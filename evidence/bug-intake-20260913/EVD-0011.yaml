inline_content: "## Title\n\n[後端][系統使用者列表] 當前使用中的站長帳號，不論站台視角，皆查無此帳號\n\n## Detail\n\n**遊戲商：** N/A（非遊戲相關，屬後台管理員系統功能）\n\n**遊戲名稱：**\
  \ N/A\n\n**測試環境：** stage-admin-srv.springkyle.online\n\n**測試帳號：** ACAA00241（站長，Arcade 視角測試）／ZZAA00244（站長，admin 根層視角測試）\n\
  \n**測試時間：** 2026-09-04\n\n**問題詳述：**\n\n依 `機台場館平台規則_spec_v01.md`「7.x 後台管理員系統」規則，新增使用者時角色選項須包含 Admin／站長／操作員，並可指定所屬場館（操作員適用）。「系統使用者列表」功能應為管理這些後台操作帳號的入口。\n\
  \n實測發現，**兩個目前正在使用中、擁有站長權限的帳號，皆無法在系統使用者列表查到**：\n\n1. 站台切換至 Arcade（機台子站台）視角，以 `ACAA00241`（站長）操作，搜尋系統使用者列表結果為「目前暫無搜尋結果」，總筆數\
  \ 0\n2. 站台切換至 admin（根層）視角，以 `ZZAA00244`（站長，建立時間為前天/昨天，非久遠帳號）操作，搜尋結果總筆數 2，但查到的是 `ZZAA00144`、`ZZAA00137` 兩筆完全不相關的帳號，角色皆顯示「游客」；**當前登入使用的\
  \ `ZZAA00244` 本身依然不在清單內**\n\n排除項：清單裡出現「游客」角色，可能是「使用非白名單帳號登入後台，系統無法辨識對應角色、預設顯示游客」的正常設計行為，此點不列入本次回報範圍。\n\n核心問題聚焦為：**一個明明正在登入、正常操作後台、且擁有站長權限的帳號，在系統使用者列表的任何一個站台視角下都查不到自己**，不論是子站台視角或根層視角皆然。\n\
  \n**預期結果：**\n\n系統使用者列表應能正確查到當前使用中且具備有效角色（Admin／站長／操作員）的後台帳號，不論從哪個站台視角查詢。若清單設計上有「可見範圍依角色與所屬場館過濾」的邏輯，至少在該帳號本身有權限操作的站台視角下（如本身即為該站台管轄範圍內的站長）應能查到自己。\n\
  \n**複製步驟：**\n\n1. 登入後台，使用任一站長權限帳號\n2. 進入「後台管理員系統 > 系統使用者列表」\n3. 站台切換至該帳號有權限操作的任一機台子站台（如 Arcade），不輸入篩選條件直接搜尋，確認是否查得到當前登入帳號（實測：查無，總筆數\
  \ 0）\n4. 站台切換至根層（admin），重新搜尋，確認是否查得到當前登入帳號（實測：查無，僅查到兩筆不相關帳號）\n5. 確認查到的帳號（ZZAA00144、ZZAA00137）的角色顯示與建立時間，作為輔助排查資訊\n\n**API\
  \ URL：**\n\n`GET https://stage-admin-srv.springkyle.online/api/v2/site/query-site-main-and-childrens`（站台資訊，供對照 isAdminSite\
  \ 等站台屬性）\n\n### Request\n\n```\nGET /api/v2/site/query-site-main-and-childrens\n```\n\n### Response（節錄）\n\n```json\n{\n\
  \    \"code\": 200,\n    \"message\": \"\",\n    \"data\": {\n        \"sites\": [\n            {\n                \"webOwnerId\"\
  : \"43037acc-50b8-4998-8d3e-3cd18e24af39\",\n                \"parentId\": \"3f6c7e0a-9d4b-4f2d-a5c8-71e92b8f4c16\",\n \
  \               \"depth\": 1,\n                \"name\": \"Arcade\",\n                \"siteType\": \"machine\",\n     \
  \           \"coreCurrency\": \"TWD\",\n                \"status\": \"active\"\n            }\n        ],\n        \"isAdminSite\"\
  : false\n    }\n}\n```\n\n> 備註：`isAdminSite: false` 欄位為新發現的站台屬性，懷疑「系統使用者列表」的查詢邏輯可能依賴此欄位判斷資料範圍，導致 Arcade（非 admin site）視角下查詢結果異常；此欄位的實際用途待與後端確認。\n"
