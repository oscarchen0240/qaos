description: bug-02-user-list-status-filter-broken.md 的「證據」段落（人工核對基準 vs 篩選結果）
inline_content: '- 不帶篩選的總數(baseline):**721**

  - `query:{status:[1]}` → `pagination.total = 0`,空列表。但樣本中所有抽查到的使用者都確實是 `status:1`,理論上應該回傳接近 721,而不是 0。

  - `query:{status:[0]}` → `pagination.total = 712`,而且回傳的列表跟「不帶篩選」時前幾筆的使用者、順序完全一樣(SKAA00003、SKAA00015、SKAA00016...),這些帳號的真實
  `status` 都是 `1`,不是 `0`。'
