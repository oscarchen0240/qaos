inline_content: '- 不帶篩選總數(baseline):**1587**

  - 真實欄位名 `betStatus`(數字/陣列/字串三種形狀都試過)→ 全部回傳 **400 Bad Request**,直接被後端拒絕。

  - 猜測欄位名 `status:[2]` → 呼叫「成功」,但 `pagination.total = 1587`,跟 baseline 完全一樣,回傳列表裡的 `betStatus` 值還是混雜的(3、2、2、6、1、3、2、3、2、3),完全沒有真的篩選成只剩
  `betStatus=2` 的紀錄。

  - 對照組 `gameBet:{min:9.99,max:10.01}` → 正確narrow 到 344 筆,確認篩選機制本身沒問題。'
