  - 額外測試 `amount:{min:0,max:0}`(應該只篩出金額為 0 的記錄)→ `total = 1311`,同樣沒有效果。

  - 對照組全部正常:`transactionType:["deposit"]` → 826;`userNo:["SKAA01586"]` → 1;`transactionNo:["152354"]` → 1;`createTime` 範圍篩選
  → 37。這些全部正確narrow,證明篩選機制本身沒有整體性壞掉。'
