description: bug-01-referral-reward-log-filter-ignored.md 的「證據」段落（人工核對基準 vs 篩選結果）
inline_content: '**人工核對(全部 47 筆)**:`referralReward=0` 的有 7 筆(SKAA00143、SKAA00556、SKAA00563、SKAA00394、SKAA00392、SKAA00388、SKAA00393),其餘
  40 筆都 >0,且全部都遠超過 10 元(無 0~10 區間案例)。

  → 正確答案:拿到獎勵的人 = **40**,超過 10 元的人 = **40**(同一批)


  **帶入 `referralReward:{min:0.01}` 的結果**:`pagination.total = 47`,回傳列表裡那 7 筆 `referralReward:0` 的記錄全部還在,完全沒有被篩掉。


  **對照組 `referralLevel:["0"]`**:正確回傳 `total = 7`,剛好等於那 7 筆 `referralReward=0` 的記錄 —— 證明篩選機制本身沒問題,問題精確定位在 `referralReward`
  這一個欄位。'
