<style>

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  header.top h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  header.top .meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }

  .progress-bar-outer{
    width:100%;
    height:8px;
    background:var(--line);
    border-radius:4px;
    overflow:hidden;
    margin-top:14px;
  }
  .progress-bar-inner{
    height:100%;
    background:var(--brand);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;

  .controls{

  }
  .controls button{

    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    cursor:pointer;
  }

  .controls button.danger{color:#a33;border-color:#e3c3c3;}
  .controls button.danger:hover{background:#fdf3f3;}

    font-size:13px;
    font-family:var(--mono);
    color:var(--brand);
    text-transform:none;
    margin:34px 0 10px;
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }

  details.section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }
  details.section[open]{border-color:#c8c8bc;}
  summary.section-head{
    list-style:none;
    cursor:pointer;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  summary.section-head::-webkit-details-marker{display:none;}
  .section-head-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .caret{
    width:14px;height:14px;flex:none;
    transition:transform .15s ease;
    color:var(--ink-soft);
  }
  details[open] .caret{transform:rotate(90deg);}
  .section-title{
    font-weight:600;
    font-size:14.5px;
  }
  .section-count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    flex:none;
  }
  .section-count.done{color:var(--brand);}

  .items{
    padding:2px 16px 14px 16px;
    border-top:1px solid var(--line);
  }
  .item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px dashed var(--line);
    font-size:13.5px;
  }
  .item:last-child{border-bottom:none;}
  .item input[type=checkbox]{
    margin-top:3px;
    width:16px;height:16px;
    accent-color:var(--brand);
    flex:none;
    cursor:pointer;
  }
  .item label{
    cursor:pointer;
    flex:1;
  }
  .item.checked label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--line);
  }
  .item .warn{
    color:var(--amber);
    font-weight:600;
  }

    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin:4px 0 14px;
  }
  table.ref th, table.ref td{
    border:1px solid var(--line);
    padding:6px 8px;
    text-align:left;
    vertical-align:top;
  }
  table.ref th{
    background:var(--brand-soft);
    font-weight:600;
    font-size:12px;
  }

  .note-box{
    background:var(--amber-soft);
    border:1px solid #e6d3ae;
    border-radius:6px;
    padding:10px 12px;
    font-size:13px;
    margin:10px 0;
    color:#5c4014;
  }

  .hidden{display:none !important;}

  footer.foot{
    margin-top:36px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:520px){
    .wrap{padding:18px 14px 60px;}
    header.top h1{font-size:19px;}
  }
</style>

const STORAGE_PREFIX = "qa-checklist:";
let allItemIds = [];
let stateCache = {};
let showOnlyPending = false;

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').slice(0,40);
}

async function loadState(id){
  try{
    const r = await window.storage.get(STORAGE_PREFIX + id, false);
    return r && r.value === "1";
  }catch(e){ return false; }
}

async function saveState(id, checked){
  try{
    if(checked){
      await window.storage.set(STORAGE_PREFIX + id, "1", false);
    }else{
      await window.storage.delete(STORAGE_PREFIX + id, false);
    }
  }catch(e){ console.error("storage error", e); }
}

        const cbId = 'cb-' + itemId;
        row.innerHTML = `
          <input type="checkbox" id="${cbId}">
          <label for="${cbId}">${text}</label>
        `;
        itemsDiv.appendChild(row);
      });

      det.appendChild(itemsDiv);
      container.appendChild(det);
    });
  });
}

async function hydrate(){
  for(const id of allItemIds){
    stateCache[id] = await loadState(id);
    const row = document.querySelector(`.item[data-item-id="${id}"]`);
    if(row){
      const cb = row.querySelector('input');
      cb.checked = stateCache[id];
      if(stateCache[id]) row.classList.add('checked');
    }
  }
  updateAllCounts();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.item input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const row = e.target.closest('.item');
      const id = row.dataset.itemId;
      stateCache[id] = e.target.checked;
      row.classList.toggle('checked', e.target.checked);
      await saveState(id, e.target.checked);
      updateAllCounts();
      applyFilter();
    });
  });
}

function updateAllCounts(){
  let totalDone = 0;
  document.querySelectorAll('details.section').forEach(det => {
    const secId = det.dataset.sectionId;
    const rows = det.querySelectorAll('.item');
    let done = 0;
    rows.forEach(r => { if(stateCache[r.dataset.itemId]) done++; });
    totalDone += done;
    const countEl = det.querySelector(`[data-count-for="${secId}"]`);
    countEl.textContent = `${done}/${rows.length}`;
    countEl.classList.toggle('done', done === rows.length && rows.length > 0);
  });
  const total = allItemIds.length;
  const pct = total ? Math.round((totalDone/total)*100) : 0;
  document.getElementById('overallBar').style.width = pct + '%';
  document.getElementById('overallText').textContent = `${totalDone} / ${total} 完成`;
  document.getElementById('overallPct').textContent = pct + '%';
}

function applyFilter(){
  document.querySelectorAll('.item').forEach(row => {
    const id = row.dataset.itemId;
    const isDone = !!stateCache[id];
    row.classList.toggle('hidden', showOnlyPending && isDone);
  });
  document.querySelectorAll('details.section').forEach(det => {
    const visible = [...det.querySelectorAll('.item')].some(r => !r.classList.contains('hidden'));
    det.classList.toggle('hidden', showOnlyPending && !visible);
  });
}

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = true);
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = false);
});
document.getElementById('showPending').addEventListener('click', () => {
  showOnlyPending = true;
  applyFilter();
});
document.getElementById('showAll').addEventListener('click', () => {
  showOnlyPending = false;
  applyFilter();
});
document.getElementById('resetAll').addEventListener('click', async () => {
  if(!confirm('確定要清空所有勾選紀錄嗎？此動作無法復原。')) return;
  for(const id of allItemIds){
    stateCache[id] = false;
    await saveState(id, false);
  }
  document.querySelectorAll('.item').forEach(row => {
    row.classList.remove('checked');
    row.querySelector('input').checked = false;
  });
  updateAllCounts();
  applyFilter();
});

render();
hydrate();
</script>
</body>
</html>
