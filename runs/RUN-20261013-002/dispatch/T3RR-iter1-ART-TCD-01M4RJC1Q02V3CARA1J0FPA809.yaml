    title: 對一筆從未送過核實的待核實出金（面額 399.60），以兩個不同帳號在 API 層真正並行送出 10 個核實請求：恰好一個成功，核實頁與機台交易紀錄的核實人員一致且只寫一次，提款次數只 +1、金額只 +399.6
    description: TCRiskReview RF-12（及二次抽查 RF-01、RF-02）：驗證同一張待核實出金在多個核實請求真正重疊（並行）送達時的最終一致結果。以腳本在 API 層同時放行 5＋5 個請求（U1、U2 各
      5 個），逐請求記錄送出／回應絕對時間確認請求確實重疊，並以核實人員判斷勝方。
    requirement_ids:
    - REQ-CASHOUT-024
    - REQ-CASHOUT-006
    - REQ-CASHOUT-022
    - REQ-CASHOUT-026
    acceptance_criteria_ids:
    - AC-CASHOUT-0241
    test_level: api
    test_types:
    - functional
    - negative
    design_techniques:
    - negative
    - error_guessing
    - state_transition
    priority: high
    risk: high
    preconditions:
    - 兩個『不同的』後台帳號 U1、U2（不可是同一帳號——要靠核實人員分辨勝方），角色皆為 spec 已授權執行核實者（管理員、站長、操作員三種擇二；若用操作員須屬於本案機台場館，因操作員限自身場館），自行從環境中選定；U1、U2 各用一個獨立的瀏覽器工作階段（一般視窗、無痕視窗）登入，站台切換選單都切到本案機台場館所屬的站台。
    - 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（399.6；每一輪都需要一筆新的 399.60 待核實出金），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
      spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
    - 【取樣紀錄 X】核實請求的網址與格式 spec 未定義，需要先擷取：另備一筆與 P 不同的待核實出金 X（可屬另一個機台帳號），由 U1 在 Network 面板（勾 Preserve log、篩 Fetch/XHR）正常核實一次，對該核實請求右鍵
      → Copy → Copy as cURL 存成樣板（X 因此被核實，不可重用；若環境負責人能直接提供核實 API 文件，可省略 X）。同樣從 U1、U2 視窗各取一個請求的 Copy as cURL，取得各自的認證資訊（Cookie
      或 Authorization）。
    - 【並行送出方式】用下方 test_data 的『並行送出腳本』，從終端機（不經瀏覽器畫面）對『從未送過任何核實請求』的待核實出金 P，一次同時放行 10 個核實請求（U1、U2 各 5 個）。P 的紀錄識別由 U1 或 U2 視窗以
      O 查詢時，列表查詢請求的回應內容取得。每一輪的 P 在並行送出之前絕不可在畫面點過『核實』或送過任何核實請求。
    - 【有效性判定】逐請求記錄『送出時間』與『回應時間』（腳本輸出的 Unix 時間，單位秒、毫秒精度，同一台機器同一時鐘）。只有 max(所有請求的送出時間) < min(所有請求的回應時間) 才表示所有請求在回應回來之前都已送出、請求確實重疊；不成立的那一輪視為無效，不計入輪次，換新的待核實出金重做。
    - 【執行輪次】至少 3 個『有效』輪次，每輪使用一筆新的待核實出金 P（核實不可撤銷，P 用過即不可重用）；任何一輪不符預期即判 FAIL。
    - 【環境前提，需環境負責人確認】後台操作紀錄的頁面位置、查詢方式與欄位 spec 未定義（只在第 142 行規定洗分出金核實與作廢須寫入操作人員、時間、對象交易）。找不到操作紀錄頁時，該項標記為『無法驗證』並回報，不要判 FAIL，也不要因此跳過其餘檢查。
    - 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
    - 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。
    test_data:
    - name: 出金面額（機台餘額）
      value: '399.6'
      note: 含小數，使重複累計會呈現 +799.2 以上而容易辨識
    - name: 並行請求組成
      value: U1 × 5 ＋ U2 × 5，共 10 個，目標皆為同一筆 P
    - name: 並行送出腳本
      value: "# 並行送出腳本（Python 3 標準庫；環境不限，只要能連到後台 API）\nimport threading, time, urllib.request, urllib.error\nURL    = \"<核實請求網址，取自樣板>\"\
        \nMETHOD = \"<核實請求方法，取自樣板>\"\ndef body(record_id): return \"<樣板請求內容，把目標紀錄識別換成 record_id；格式一律取自樣板>\"\nH1 = {\"<標頭名>\"\
        : \"<U1 的認證資訊，取自 U1 視窗任一請求的 Copy as cURL>\", \"Content-Type\": \"<取自樣板>\"}\nH2 = {\"<標頭名>\": \"<U2 的認證資訊>\", \"Content-Type\"\
        : \"<取自樣板>\"}\nJOBS = [  # (標籤, 標頭, 目標紀錄識別)——依本案步驟填寫\n    (\"U1\", H1, \"<P 的紀錄識別>\"), (\"U1\", H1, \"<P 的紀錄識別>\"\
        ), (\"U1\", H1, \"<P 的紀錄識別>\"), (\"U1\", H1, \"<P 的紀錄識別>\"), (\"U1\", H1, \"<P 的紀錄識別>\"),\n    (\"U2\", H2, \"<P 的紀錄識別>\"\
        ), (\"U2\", H2, \"<P 的紀錄識別>\"), (\"U2\", H2, \"<P 的紀錄識別>\"), (\"U2\", H2, \"<P 的紀錄識別>\"), (\"U2\", H2, \"<P 的紀錄識別>\"\
        ),\n]\nbar = threading.Barrier(len(JOBS)); res = []\ndef run(tag, h, rid):\n    req = urllib.request.Request(URL,\
        \ data=body(rid).encode(), headers=h, method=METHOD)\n    bar.wait()                       # 所有執行緒就緒後同時放行\n    t_send\
        \ = time.time()\n    try:\n        with urllib.request.urlopen(req, timeout=30) as r: code, txt = r.status, r.read().decode()\n\
        \    except urllib.error.HTTPError as e: code, txt = e.code, e.read().decode()\n    t_resp = time.time()\n    res.append((tag,\
        \ rid, t_send, t_resp, code, txt[:200]))\nts = [threading.Thread(target=run, args=j) for j in JOBS]\n[t.start() for\
        \ t in ts]; [t.join() for t in ts]\nfor r in sorted(res, key=lambda r: r[2]): print(\"%s %s send=%.3f resp=%.3f HTTP\
        \ %s %s\" % (r[0], r[1], r[2], r[3], r[4], r[5]))\nprint(\"VALID(max(send) < min(resp)):\", max(r[2] for r in res)\
        \ < min(r[3] for r in res))\n"
      note: 把 <> 內的值依樣板與環境填入；JOBS 的標籤用來判斷勝方屬於哪個帳號
    - name: 預期成功回應數（每輪）
      value: '1'
      note: 其餘 9 個為拒絕（回應內容 spec 未定義，只判定『非成功』）
    - name: 預期提款次數差／提款金額差（每輪）
      value: +1／+399.6
      note: 不是 +2 以上／+799.2 以上
    steps:
    - n: 1
      action: （只做一次）依前提的『取樣紀錄 X』擷取核實請求樣板與 U1、U2 的認證資訊；之後才讀取任何會員列表基準（X 若與 P 同一機台帳號，核實 X 會改變該帳號的提款累計）。
      expected: 取得樣板（網址、方法、請求內容格式、目標紀錄識別位置）與 U1、U2 認證資訊。
    - n: 2
      action: （每輪開始）到後台『會員列表』，以選定機台帳號的會員編號查詢，記下『提款次數』N0 與『提款金額』W0（小數位照實記錄）。
      expected: 取得本輪基準 N0、W0。
    - n: 3
      action: 在機台端對選定機台帳號（餘額 399.6）按『結算』執行出金，記下訂單編號 O 與面額。
      expected: 出金完成，面額數值 399.6（若不是，前提不成立，停止並回報）。
    - n: 4
      action: U1、U2 兩個視窗各自到『帳務管理 > 洗分出金核實』以 O 查詢，確認看到同一筆 P 為『待核實』、金額 399.60，並從列表查詢請求的回應取得 P 的紀錄識別，同時記下 P 在『機台交易紀錄』中的交易編號 T。不要點擊『核實』。
      expected: 兩個視窗都看到 P 為待核實；取得 P 的紀錄識別與交易編號 T。
    - n: 5
      action: 執行『並行送出腳本』（U1 × 5 ＋ U2 × 5，目標皆為 P），保存腳本輸出的每個請求的送出時間、回應時間、HTTP 狀態與回應摘要。
      expected: 腳本輸出 VALID(max(send) < min(resp)) ＝ True（否則本輪無效，不計入輪次，換新的 P 重做）。
    - n: 6
      action: 檢視 10 個請求的回應。
      expected: 恰好 1 個請求成功，其餘 9 個被拒絕（非成功）。記下成功請求的標籤（U1 或 U2）為勝方 W。不可出現 2 個以上成功。
    - n: 7
      action: 在核實頁以 O 重新查詢 P，檢視核實狀態、核實人員、核實時間。
      expected: 只有 1 筆 P，核實狀態『已核實』；核實人員＝勝方 W 的帳號；核實時間為單一值 H。
    - n: 8
      action: 到『機台交易紀錄』以交易編號 T 查詢該筆交易，檢視核實狀態與核實人員／時間欄位。
      expected: 機台交易紀錄該筆為『已核實』，核實人員＝W、核實時間＝H，與核實頁完全一致（回寫只寫一次，沒有被輸方的請求覆寫）。
    - n: 9
      action: 到後台操作紀錄（位置見前提）以 O 或 T 查詢 P 的核實紀錄。
      expected: P 的核實紀錄只有 1 筆，操作人員為 W。（找不到操作紀錄頁時標記『無法驗證』，不判 FAIL。）
    - n: 10
      action: 回會員列表重新查詢同一會員，讀取『提款次數』與『提款金額』。
      expected: 提款次數 ＝ N0 ＋ 1（不是 N0 ＋ 2 以上）；提款金額 ＝ W0 ＋ 399.6（不是 W0 ＋ 799.2 以上）。
    - n: 11
      action: 重複步驟 2～10，累積至少 3 個有效輪次，每輪用新的出金。
      expected: 每一個有效輪次都符合步驟 5～10 的預期。
    expected_result: 對一筆從未送過核實的待核實出金，在請求確實重疊（max(送出時間) < min(回應時間)）的 10 個並行核實請求下，恰好 1 個成功、其餘被拒絕；核實頁與機台交易紀錄的核實人員／時間一致且為勝方帳號、只寫一次，操作紀錄只有
      1 筆核實；該機台帳號的提款次數只 +1、提款金額只累計 +399.6。
