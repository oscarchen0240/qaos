      D 內完成，且執行時刻須同時距場館日結時間（營業日切分點）與 UTC+0 00:00 前後各至少 2 小時，並確認以這兩種切法得到的日期相同（「出收據那天」以哪一種切日目前待 Clarification CLR-CASHOUT-005，本案不驗證也不採用其中一種答案；兩種切法日期一致，才不會因答案不同而查錯列）。若報表未即時反映，記錄實際更新方式與等待時間後再讀取，不要直接判定
      PASS／FAIL。報表以管理員或站長身分檢視（這兩個角色是 spec 已授權執行本頁核實與作廢者；各角色對日結報表的可見範圍 spec 未定義，若看不到報表請回報環境負責人，不要改用其他角色逕行判定）。
    - 現金淨收的查看位置與算式 spec 未定義：本案假設場館日結報表可看到營業日 D 的『現金淨收』，若報表另有顯示現金淨收的扣除項明細則一併記錄；『核實後現金淨收減少』是依第 132 行『現金淨收只計入已核實的洗分；待核實洗分不扣除』推得（待核實不扣除，反過來即已核實洗分才扣除），spec
      沒有寫報表的欄位結構與數學式。若報表實際結構與此不同，記錄實際現象並回報，不要直接判定 PASS／FAIL。洗分在機台端完成後立即在本頁核實（洗分核實時點本就是付現後立即），確保洗分與核實落在同一營業日 D，避免觸碰跨日歸屬規則（跨日核實的兌現金額歸屬
      spec 未定義，TCRiskReview RF-07 待 Clarification）。
    - 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
    - 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。本案會對一筆新產生的 399.6 洗分執行核實。
