      expected: 列表出現該筆洗分，核實狀態『待核實』，『實際金額』數值為 399.6（尾端是否補 0 不比對）。
    - n: 5
      action: 核實前檢查：回會員列表重新查詢同一會員；再回日結報表，同一站台、同一營業日 D 重新查詢。
      expected: 會員列表提款次數仍為 N0、提款金額仍為 W0（待核實不計入）；日結報表『現金淨收』仍為 C0（扣除項仍為 K0）：待核實洗分不計入現金淨收扣除項。
