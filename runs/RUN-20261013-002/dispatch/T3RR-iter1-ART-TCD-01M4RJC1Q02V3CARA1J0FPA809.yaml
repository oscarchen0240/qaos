    draft_id: TC-DRAFT-01M4RJC1Q0V2KA7KCK1GAH0VCY
    title: 出金收據已核實或已作廢之後，機台的完成回報才遲到重送：不產生新的待核實紀錄，狀態不變，提款累計與日結報表未兌現金額不變
    description: 二次抽查 RF-03：完成回報在紀錄已核實（現金已付）或已作廢之後才遲到送達，若被當成新的一筆，會再產生待核實紀錄、櫃檯可能再付一次現金、日結未兌現金額再次出現。驗證兩種狀態下重送都不產生新紀錄。
    requirement_ids:
    - REQ-CASHOUT-001
    - REQ-CASHOUT-032
    - REQ-CASHOUT-006
    acceptance_criteria_ids: []
    test_level: integration
    test_types:
    - functional
    - negative
    design_techniques:
    - error_guessing
    priority: high
    risk: high
    preconditions:
    - 以管理員或站長登入後台（本案從頭到尾使用同一個後台帳號；作廢僅管理員與站長可執行），頁面標題下方的站台切換下拉選單切到本案機台場館所屬的站台。
    - 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（399.6；本案需對同一機台帳號先後出金兩次（A、B），每次出金前重新調整餘額），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
      spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
    - 【環境前提，spec 與派發包均未定義，需環境負責人確認】機台端測試工具能對『同一筆出金（同一訂單編號、同一交易）』重送完成回報（end-cashout）。AC-CASHOUT-0041 的備註（RD 2026-09-23）載明後端無法攔截
      end-cashout 完成回報，測試環境對 end-cashout 的處理能力有限；能否重送，我無法從 spec 或派發包確認。若工具無法重送同一筆的完成回報（只能送出新的出金請求），本案無法執行，請標記為受阻並回報，不要以第二次新出金替代。
    - 【推理說明，spec 未對重送行為逐字規定】第 19 行以『每一筆』已完成的交易產生一筆待核實紀錄、第 63 行規定交易編號對應機台交易編號、第 129 行規定僅已完成的交易產生核實紀錄；三處合起來是『一筆交易對應一筆核實紀錄』。遲到重送的完成回報（同一訂單編號、同一交易編號）不是新交易，所以不應再產生待核實紀錄，是由這三處推得，不是
      spec 對重送的明文。
    - 本案不驗證『已核實的收據能否作廢』（spec 未定義，CLR-CASHOUT-003 待答覆）：A 只核實、不作廢；B 只在待核實時作廢、不核實；兩筆互不交叉。
    - 【環境前提，spec 與派發包均未定義，需環境負責人確認】場館日結報表的後台選單路徑與欄位名稱、場館日結時間（營業日的切分時點；spec 未定義其設定位置與值）、以及核實／作廢後報表金額是即時或排程更新。本案所稱營業日 D＝『出金當下所屬的營業日，以場館日結時間切分』，全程在同一個營業日
      D 內完成，且執行時刻須同時距場館日結時間（營業日切分點）與 UTC+0 00:00 前後各至少 2 小時，並確認以這兩種切法得到的日期相同（「出收據那天」以哪一種切日目前待 Clarification CLR-CASHOUT-005，本案不驗證也不採用其中一種答案；兩種切法日期一致，才不會因答案不同而查錯列）。若報表未即時反映，記錄實際更新方式與等待時間後再讀取，不要直接判定
      PASS／FAIL。報表以管理員或站長身分檢視（這兩個角色是 spec 已授權執行本頁核實與作廢者；各角色對日結報表的可見範圍 spec 未定義，若看不到報表請回報環境負責人，不要改用其他角色逕行判定）。
    - 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
    - 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。本案會對 A 執行核實、對 B 執行作廢，兩者皆不可撤銷。
