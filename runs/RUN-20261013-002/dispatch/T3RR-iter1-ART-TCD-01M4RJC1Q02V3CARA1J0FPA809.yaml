      end-cashout 完成回報，測試環境對 end-cashout 的處理能力有限；能否重送同一筆的完成回報，我無法從 spec 或派發包確認。若工具只能送出『新的出金請求』而不是重送同一筆的完成回報，本案無法執行，請標記為阻塞並回報，不要以第二次新出金替代（那會合法地產生第二筆紀錄）。
