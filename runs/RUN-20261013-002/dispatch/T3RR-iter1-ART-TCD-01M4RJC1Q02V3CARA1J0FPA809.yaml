    - 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（0.6；機台是否允許出金這麼小的餘額 spec 未定義，若機台端拒絕出金或收據面額不是
      0.6，代表前提不成立，請回報並停止，不要判定為本頁缺陷），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
      spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
    - 顯示格式說明：spec 的例子是『399.6 → 399.60』。本案的硬性斷言是面額『數值』為 0.6（不是 0、不是 1、不是空白）；若畫面顯示為 0.60，與 spec 例子同型態；若顯示為 0.6（未補尾端 0）或顯示成『.6』（省略前導
