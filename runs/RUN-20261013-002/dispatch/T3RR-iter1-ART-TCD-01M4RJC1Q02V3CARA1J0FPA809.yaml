    draft_id: TC-DRAFT-01M4RJC1PZA85JMDMZFVMR4GSN
    title: 同一機台帳號連續核實三張含小數面額出金（0.1、0.2、399.6）：提款金額逐筆精確累計，日結報表未兌現金額為面額精確加總
    description: TCRiskReview RF-03：提款金額累計只驗過單筆 +399.60。本案用同一機台帳號連續核實 0.1、0.2、399.6 三張出金（0.1＋0.2 是典型浮點誤差組合），驗證每次核實後提款金額與日結報表未兌現金額都是面額的精確加總，無浮點尾數。
    requirement_ids:
    - REQ-CASHOUT-006
    - REQ-CASHOUT-032
    acceptance_criteria_ids:
    - AC-CASHOUT-0062
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - error_guessing
    priority: medium
    risk: high
    preconditions:
    - 以管理員或站長登入後台（本案從頭到尾使用同一個後台帳號），頁面標題下方的站台切換下拉選單切到本案機台場館所屬的站台（洗分出金核實頁的資料範圍跟隨該選單，不另設場館篩選欄位）。
    - 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（0.1、0.2、399.6；三者都是一位小數，沿用 spec 例子
      399.6 → 399.60 的同型態，不涉及超過兩位小數的取捨），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
      spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
    - 本案只比對金額『數值』，不以字串斷言尾端 0 是否補齊（例如 0.1 與 0.10 視為相同）；整數面額與一位小數面額是否一律顯示兩位小數，spec 沒有一致規則，屬待 Clarification 事項（TCRiskReview RF-02），本案不驗證。
    - 【環境前提，spec 與派發包均未定義，需環境負責人確認】場館日結報表的後台選單路徑與欄位名稱、場館日結時間（營業日的切分時點；spec 未定義其設定位置與值）、以及核實／作廢後報表金額是即時或排程更新。本案所稱營業日 D＝『出金當下所屬的營業日，以場館日結時間切分』，全程在同一個營業日
      D 內完成，且執行時刻須同時距場館日結時間（營業日切分點）與 UTC+0 00:00 前後各至少 2 小時，並確認以這兩種切法得到的日期相同（「出收據那天」以哪一種切日目前待 Clarification CLR-CASHOUT-005，本案不驗證也不採用其中一種答案；兩種切法日期一致，才不會因答案不同而查錯列）。若報表未即時反映，記錄實際更新方式與等待時間後再讀取，不要直接判定
      PASS／FAIL。報表以管理員或站長身分檢視（這兩個角色是 spec 已授權執行本頁核實與作廢者；各角色對日結報表的可見範圍 spec 未定義，若看不到報表請回報環境負責人，不要改用其他角色逕行判定）。
    - 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
    - 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。本案會對 A、B、C 三筆新產生的出金依序執行核實。
    test_data:
    - name: 出金 A 的機台餘額／預期面額（數值）
      value: '0.1'
    - name: 出金 B 的機台餘額／預期面額（數值）
      value: '0.2'
    - name: 出金 C 的機台餘額／預期面額（數值）
      value: '399.6'
    - name: 核實 A 後預期提款金額差
      value: '+0.1'
      note: 提款次數 +1
    - name: 核實 B 後預期提款金額累計差
      value: '+0.3'
      note: 0.1＋0.2 的精確和；提款次數累計 +2；不應出現 0.30000000000000004、0.29、0.31
    - name: 核實 C 後預期提款金額累計差
      value: '+399.9'
      note: 0.1＋0.2＋399.6 的精確和；提款次數累計 +3；不應出現 399.90000000000003 之類尾數，也不是 +399 或 +400
    - name: 日結報表未兌現金額（三張出金皆待核實時）
      value: U0 + 399.9
      note: U0 為出金前基準值；全部核實後應回到 U0
    steps:
    - n: 1
      action: 到後台『會員列表』，以選定機台帳號的會員編號查詢，記下該會員的『提款次數』N0 與『提款金額』W0（小數位照實記錄）。
      expected: 取得 N0、W0 作為基準。
    - n: 2
      action: 開啟場館日結報表（選單路徑見前提），同一站台，結算日期設為營業日 D（起訖皆為 D），記下『未兌現金額』U0。
      expected: 取得 U0 作為基準。
    - n: 3
      action: 在機台端依序對選定機台帳號執行三次出金（每次出金前先把餘額調到指定值）：(a) 餘額 0.1 → 按『結算』，記下訂單編號 O_A；(b) 餘額 0.2 → 按『結算』，記下 O_B；(c) 餘額 399.6 → 按『結算』，記下
        O_C。三次都在營業日 D 內完成。每次出金後，到『帳務管理 > 洗分出金核實』以該訂單編號查詢，確認該筆為『機台出金』、核實狀態『待核實』、『實際金額』數值等於當次餘額（0.1／0.2／399.6）。
      expected: 三筆待核實出金，面額數值依序為 0.1、0.2、399.6（若任一面額數值與當次餘額不同，代表前提不成立，停止並回報，不要繼續判定）。此時會員列表該會員的提款次數仍為 N0、提款金額仍為 W0（待核實不計入累計）。
    - n: 4
      action: 回日結報表，同一站台、同一營業日 D 重新查詢，讀取『未兌現金額』U1。
      expected: U1 ＝ U0 ＋ 0.1 ＋ 0.2 ＋ 399.6 ＝ U0 ＋ 399.9（數值精確，無浮點尾數；日結報表一律以面額計）。
    - n: 5
      action: 回洗分出金核實頁，以 O_A 查詢，點擊該筆『核實』，於確認彈窗核對後點擊確認（不可撤銷）；核實完成後立即到會員列表重新查詢同一會員。
      expected: 該筆標記為『已核實』；提款次數 ＝ N0 ＋ 1；提款金額 ＝ W0 ＋ 0.1。
    - n: 6
      action: 以 O_B 查詢並核實（同上），完成後立即到會員列表重新查詢同一會員。
      expected: 該筆標記為『已核實』；提款次數 ＝ N0 ＋ 2；提款金額 ＝ W0 ＋ 0.3（0.1＋0.2 的精確和），不是 W0 ＋ 0.30000000000000004、也不是 W0 ＋ 0.29 或 ＋0.31。
    - n: 7
      action: 以 O_C 查詢並核實（同上）；確認後櫃檯以整數 400 模擬現場付現（現場動作，此金額不輸入平台）。完成後立即到會員列表重新查詢同一會員。
      expected: 該筆標記為『已核實』；提款次數 ＝ N0 ＋ 3；提款金額 ＝ W0 ＋ 399.9（三筆面額的精確和），沒有 399.90000000000003 之類尾數，也不是 W0 ＋ 400 或 ＋399。
    - n: 8
      action: 回日結報表，同一站台、同一營業日 D 重新查詢，讀取『未兌現金額』U2。
      expected: U2 ＝ U0（三張出金皆已核實而轉出，未兌現金額回到基準值，數值精確）。
    expected_result: 同一機台帳號連續核實面額 0.1、0.2、399.6 的三張出金後，每次核實當下會員列表的提款次數依序 +1、+2、+3，提款金額依序累計 +0.1、+0.3、+399.9（面額的精確加總，無浮點尾數）；日結報表同一營業日的未兌現金額在三張皆待核實時為
      U0＋399.9，全部核實後回到 U0。
