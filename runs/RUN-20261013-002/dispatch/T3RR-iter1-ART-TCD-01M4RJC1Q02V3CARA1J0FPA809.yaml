    - name: 預期同訂單編號的核實紀錄筆數
      value: '1'
      note: 不是 2 或 3
    - name: 預期日結報表未兌現金額增量
      value: '+399.6'
      note: 不是 +799.2
    steps:
    - n: 1
      action: 到後台『帳務管理 > 洗分出金核實』，篩選『機台帳號』＝選定機台帳號的會員編號、『交易類型』＝機台出金、『核實狀態』＝待核實並搜尋，記下結果筆數 c0。開啟場館日結報表（選單路徑見前提），同一站台，結算日期設為營業日
        D（起訖皆為 D），記下『未兌現金額』U0。
      expected: 取得 c0 與 U0 作為基準。
    - n: 2
      action: 在機台端對選定機台帳號（餘額 399.6）按『結算』執行出金，記下訂單編號 O、交易編號 T（交易編號可由本頁列表或機台交易紀錄查得）與面額。
      expected: 出金完成，面額數值 399.6（若不是，前提不成立，停止並回報）。
    - n: 3
      action: 回洗分出金核實頁，以 O 查詢；並以步驟 1 的篩選條件重新查詢。
      expected: 以 O 查詢恰好 1 筆：機台出金、核實狀態『待核實』、交易編號為 T、實際金額數值 399.6；步驟 1 的篩選條件結果筆數為 c0 ＋ 1。
    - n: 4
      action: 以機台端測試工具對同一筆出金（訂單編號 O、交易編號 T）重送完成回報（end-cashout）一次；稍待片刻後再重送一次。記下工具對每次重送的回應（回應內容 spec 未定義，只記錄，不判定）。
      expected: 兩次重送完成。
    - n: 5
      action: 回洗分出金核實頁重新整理，再次以 O 查詢，並以步驟 1 的篩選條件重新查詢。
      expected: 以 O 查詢仍恰好 1 筆，狀態『待核實』、交易編號 T、實際金額數值 399.6；步驟 1 的篩選條件結果筆數仍為 c0 ＋ 1（沒有新增第二筆、第三筆）。
    - n: 6
      action: 回日結報表，同一站台、同一營業日 D 重新查詢，讀取『未兌現金額』U1。
      expected: U1 ＝ U0 ＋ 399.6（只計入一次面額），不是 U0 ＋ 799.2。
    expected_result: 機台對同一筆出金重送完成回報後，洗分出金核實頁以該訂單編號查詢仍只有一筆待核實紀錄（同一筆交易編號），同機台帳號的待核實出金筆數只增加 1；日結報表同一營業日的未兌現金額只增加一次面額 399.6。
    expected_result_spec_reference:
