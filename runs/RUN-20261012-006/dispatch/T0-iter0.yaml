  answer_sha256: 4662e9b4d9735c4faacee0e6cd84c13bf950812273210302ddf44ab174eb1935
  answer: A：洗分一送出就完成，不會有中間狀態。機台洗分為單階段交易（req-keyout，帳務立即生效），不會停在「待處理／等待中」；畫面篩選器上那兩個值是與「出鈔」共用同一組技術值的結果，對洗分不適用。洗分只會是「已處理（＝已完成）」或「已拒絕／錯誤（＝未成立）」，與
    SPEC-CASHFLOW-001 洗分異常處理表「已完成／查無此筆或未成立」兩種路徑一致。→ TC-CASHOUT-044 的 given「洗分交易狀態為待確認」無法建立，須改用出金（兩階段，req-cashout 成功但 end-cashout
    完成回報未送達時會停在待確認）來驗證 AC-CASHOUT-0041「未完成交易不會出現在核實頁」。核實狀態層面（洗分待核實帶「⚠ 現金未確認」警示、出金待核實屬正常）與 spec 一致，非本題範圍。REQ-TXLOG-009 的「無」歧義本次未回覆，仍待
    RD。
