    title: 出金待確認超過 24 小時不會自動逾時，持續保留待確認，僅能靠補完回報、新出金取代、櫃檯人工出金連動取消或管理員手動取消收斂
    description: TC-TXLOG-148 修訂：收斂途徑改為補完回報／新出金取代／櫃檯人工出金連動取消／管理員手動取消，移除『轉介洗分出金核實頁』（AC-TXLOG-0171）
