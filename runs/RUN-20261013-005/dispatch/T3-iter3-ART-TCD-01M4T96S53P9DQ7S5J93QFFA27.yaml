      expected: 可用操作為查看明細，以及『手動取消』（管理員對待確認機台出金）；仍沒有任何核實操作。前端上線前實機只看到『明細』是 BUG-TXLOG-001 的現況，本步驟記『受阻』並備註實際觀察
    expected_result: 交易紀錄查詢頁不存在任何核實操作（核實一律於帳務管理『洗分出金核實』執行）；本頁可用操作僅有查看明細，以及管理員對待確認機台出金的手動取消。（步驟 1『無核實操作』在前端未上線時即可判定；步驟 2 的手動取消入口需前端上線，之前記受阻。）
