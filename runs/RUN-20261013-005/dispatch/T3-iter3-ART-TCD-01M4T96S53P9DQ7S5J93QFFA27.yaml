      expected: 找不到任何核實操作（核實狀態欄僅供查看，唯讀）；可用的操作有查看明細。若 Z 列還出現『手動取消』（顯示但停用等），只記錄現象，不判定（不符合條件時的阻擋方式 spec 未定義）
    - n: 2
