    draft_id: TC-DRAFT-01M4T96S5300Q06JB6HEFPW2QT
    title: 以站長（非管理員）嘗試對待確認的機台出金手動取消：無法完成取消，交易維持待確認、分數不異動
    description: 驗證非管理員（站長）無法完成手動取消（AC-TXLOG-0291）
    requirement_ids:
    - REQ-TXLOG-029
    acceptance_criteria_ids:
    - AC-TXLOG-0291
    test_types:
    - functional
    - negative
    design_techniques:
    - requirement_based
    preconditions:
    - 【執行通道，前端未開發】依 CLR-TXLOG-002，手動取消的後端已完成、前端尚未開發（BUG-TXLOG-001；2026-10-12 實機：列表操作欄只有『明細』，明細面板標示『本頁只讀』）。標記『UI』的步驟照 spec
      描述撰寫，前端上線前實機看不到手動取消入口，這些步驟記為『受阻』（不是本案的產品 FAIL，也不要把『實機沒有入口』當成預期結果）；標記『API』的步驟以後端為準。手動取消後端 API 的路徑、方法、參數、身分驗證與二次確認的表達方式
      spec 與派發包都未定義，需向 RD／環境負責人取得；取不到時 API 步驟一併記『受阻』，不得自行推測或編造 API，也不得改用資料庫直接修改來替代。列表查詢本身（篩選、交易狀態欄）不受前端缺手動取消影響，可正常用來觀察結果。
    - 【判定基準】前端未開發期間，任何角色、任何狀態在實機 UI 都看不到手動取消入口，因此『UI 看不到入口』不能作為本案通過的依據；本案的通過判定以『API 通道實際送出取消請求後，交易狀態與分數不變』為準。API 通道取不到時，本案記『受阻』，不用
      UI 現象代替。不符合條件時系統如何阻擋（不顯示入口、顯示但停用、送出後後端拒絕及提示文案）spec 未定義（CLR-TXLOG-003 待回覆），只記錄實際看到的阻擋方式，不判定對錯，也不比較各情況是否一致。
    - 【API 通道有效性對照（必要，用來排除『請求格式錯誤所以狀態沒變』的假通過）】(a) 同一環境、同一版本已用同一份 RD 請求範本成功執行過 AC-TXLOG-0282 的案例（管理員對待確認機台出金取消成功、交易狀態轉為已取消）；本案送出的請求只替換『身分』或『目標交易』，其餘路徑、方法、標頭、欄位、二次確認的表達方式與範本逐字相同，執行時附上範本與實際請求供比對。若環境尚無該成功執行紀錄，先執行
      AC-0282 案例，否則本案記『受阻』。(b) 本案最後以管理員身分、同一份範本，對一筆待確認的測試出金取消成功，作為對照組。(c) 若取消請求的回應顯示請求格式錯誤、路由不存在、欄位缺漏或錯誤，或憑證無效／過期（未通過身分驗證，例如
      401 或 token 失效；與『已通過驗證但無權限／不符條件』不同，後者不算無效），本次執行記為『無效／受阻』，不判通過，也不得因為狀態與分數沒變就判通過。不符合條件時如何阻擋（不顯示入口、停用、後端拒絕及文案）仍未定義（CLR-TXLOG-003
      待回覆），本對照只確認請求有效，阻擋方式與回應內容只記錄，不判定。
    - 【一輪執行所需的待確認測試資料數量（供執行計畫備料）】不可逆消耗（取消或完成後不得再用）的待確認機台出金共 7 筆：AC-0282 案 1 筆、手動取消後遲到 end-cashout 案 2 筆（取消目標 X 與對照出金 V）、AC-0291
      站長案 1 筆、AC-0291 操作員案 1 筆、AC-0292 案對照出金 W1 1 筆、AC-0293 案對照出金 W2 1 筆；另需可共用、不被取消的待確認機台出金 1 筆（AC-0281、AC-0283、TC-TXLOG-165
      修訂版共用），TC-TXLOG-148 修訂版需另一筆超過 24 小時且全程不被取消者 1 筆，AC-0293 案需待確認的機台入金 Y 1 筆（24 小時內）；AC-0292 案另需已完成與已取消的機台出金各 1 筆（不消耗）。各筆都是測試機台帳號的測試資料，佈置方式
      spec 未定義，需環境負責人確認
    - 手動取消的入口位置 spec 未定義（列表操作欄或右側明細面板，REQ-TXLOG-028 Q01 detail_gaps），不得假設；兩處都要檢視
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】本站台有一筆交易狀態為『待確認』的機台出金 X（自行從環境中選定；機台已受理出金、平台尚未收到完成回報）。spec 只定義待確認的意義，並提到一種會讓待確認長期留著的情境（現場在機台
      Operator 選單執行過 Reset 後，機台不再回報該筆交易）；如何製造待確認出金（機台端中斷回報、後端測試工具等）不在 spec 範圍，是需環境負責人提供的資訊。X 須是測試機台帳號的測試資料：手動取消後平台會告知機台這筆交易不存在，無法復原，不得對正式營運資料執行。
    - 【環境前提，spec 未定義，需環境負責人確認】機台帳號分數（餘額）以哪個來源讀取：機台端畫面，或在列表點擊『機台帳號』進入的會員詳細資料頁（該頁是否顯示分數 spec 未定義）。取消前後固定用同一個來源讀取，且測試期間不要對該機台帳號進行其他開分、洗分、入金、出金，否則分數差異無法歸因。
    - 本案最後的對照步驟會由管理員取消 X（X 取消後不得再供其他案例使用）；因此 X 不要與其他案例共用
    - 【環境前提，需環境負責人確認】另備一個既有的站長帳號（自行從環境中選定，不是管理員）；站長能否進入交易紀錄查詢頁以及頁面資料範圍，spec 與派發包均未定義，以實際環境為準並記錄
    - 以管理員（spec 原文稱 Admin）登入後台作為觀察者，用來讀取 X 的狀態；站台切換選單切到 X 所屬的機台場館站台
    test_data:
    - name: 嘗試取消的角色
      value: 站長
    - name: 目標交易
      value: 交易類型＝機台出金、交易狀態＝待確認的 X
    steps:
    - n: 1
      action: 以管理員身分在交易紀錄查詢篩選『交易類型＝機台出金』『交易狀態＝待確認』，選定 X，記下交易編號、機台帳號；依前提的來源讀取分數 S0
      expected: X 的交易狀態為『待確認』；取得 S0
    - n: 2
      action: 切換登入為上述站長帳號，進入『各式報表 > 交易紀錄查詢』，站台切換選單切到 X 所屬的機台場館站台，用 X 的交易編號查詢
      expected: 取得該帳號對 X 的操作管道；若該帳號無法進入『交易紀錄查詢』或看不到 X，記錄實際現象，並改以 API 通道（該帳號的身分）進行步驟 3～4，不自行判定
    - n: 3
      action: 憑證預檢：以站長帳號的同一組憑證，發出一個該身分確定有權限的唯讀請求（例如取得目前登入者資訊，或該角色可進入的任一頁面所用的查詢；不要用該角色可能無權查看的交易紀錄查詢）
      expected: 請求成功（證明該身分的憑證有效、通過身分驗證）。只有未通過身分驗證（例如 401 或 token 失效）才記『無效／受阻』並不進入下一步；『已通過驗證但無權限』不算預檢失敗
    - n: 4
      action: （UI）以站長帳號對 X 嘗試手動取消，記下看到的情況（沒有入口／入口停用／可點擊並被拒絕等）；（API，判定依據）使用 AC-TXLOG-0282 案例成功執行過的同一份 RD 範本，只把身分換成站長帳號、目標為
        X，其餘逐字相同，對 X 發出手動取消請求
      expected: 請求被受理並處理，但無法完成手動取消（阻擋方式與回應內容只記錄，不判定）。若回應是請求格式錯誤、路由不存在、欄位錯誤或憑證無效，本次執行記『無效／受阻』，不進入下一步判通過。UI 步驟在前端上線前記『受阻』且不作為通過依據
    - n: 5
      action: 以管理員身分重新以 X 的交易編號查詢，並依同一來源再讀取機台帳號分數 S1
      expected: X 仍為『待確認』，S1 等於 S0，分數不異動
    - n: 6
      action: 對照組：以管理員身分，使用同一份 RD 範本（只換身分為管理員，目標為 X），對 X 送出手動取消並完成二次確認，再重新查詢 X
      expected: 取消成功，X 轉為『已取消』，證明範本與通道有效、X 是可取消的目標（此為對照結果，不屬 AC-0291 的斷言）。若對照組失敗，步驟 4 的結果無效，本次執行記『無效／受阻』
    expected_result: 以站長（非管理員）對交易狀態為『待確認』的機台出金嘗試手動取消，無法完成取消；該筆交易維持『待確認』，機台帳號分數不異動。（阻擋方式未定義，不作預期。本結論須在憑證預檢通過、取消請求不是格式錯誤／路由不存在／憑證無效，且步驟
      6 管理員對照組取消成功時才成立，否則記無效／受阻。）
