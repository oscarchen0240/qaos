  answer_sha256: 7c3aba8ff95bacdc8ca39e2d6445b3ef8f2231a47dede487cd6a45bba147490a
  answer: 此問題已 moot：交易紀錄查詢頁（本包）實際上並不提供『手動取消』這個操作，spec.md §操作 描述的『手動取消：僅 Admin 可對待確認狀態的交易執行』這段是錯誤敘述，非現行產品行為。凡是待確認/待核實交易需要的人工處理，一律在『洗分出金核實』頁（SPEC-CASHOUT-001）進行，不在本頁。REQ-TXLOG-028/029
    需回頭修正。
  resolution: spec_updated
  basis_hash: 30f4a725649d0fd6a3d0f5cfdbcd46bffa41419301261e7732d789d11c4cf4cb
