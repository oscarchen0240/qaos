  applicability: []
- clarification_id: CLR-TXLOG-002
  status: INCORPORATED
  kind: spec_question
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  requirement_id: REQ-TXLOG-028
  question_id: null
  answer_rev: 0
  answer_sha256: ece76a3c8c11b7de3f4ded894bf3d0d12f802143df78919236986b7aad9d7547
  answer: 提供。交易紀錄查詢（4.1 機台視角）提供待確認「機台出金」的手動取消：僅管理員可操作（RD 已確認）、僅對交易狀態「待確認」的機台出金；二次確認後標記為「已取消」，分數不異動；用於機台故障造成的卡單清理。機台入金沒有手動取消（待確認入金依
    24 小時逾時轉「已逾時」收斂）。後端已開發完成，前端尚未開發（2026-10-12 實機：列表操作欄只有「明細」，明細面板標示「本頁只讀」）。2026-09-14（CLR-TXLOG-001）與 2026-09-15（CLR-CASHFLOW-004）「本頁不提供手動取消」的確認不再適用；REQ-TXLOG-028
    改回提供（限出金、限管理員），REQ-TXLOG-029 的限制（非管理員、非待確認、入金）恢復為有效需求。
