  answer_sha256: acff34834ada1db42a387f922eb05396a36c1c38ad151b0b69c15a8069445ce7
  answer: 受結算日期範圍限制：結算日期仍是篩選條件，未兌現金額只算範圍內；只是不受統計週期切分影響。例：9/10 未兌現 200；(a) 結算 09-03～09-09 按週 → 09-07～09-09 列未兌現 1000、09-03～09-06
    列 0；(b) 結算 09-03～09-10 → 09-07～09-10 列 1200、09-03～09-06 列 0。→ **TC-DAILYREPORT-046 的假設（不受結算日期限制）是錯的**，該案 expected 需改為「不包含範圍外的
    200」；建議 APR-0003 逐項 reject TC-046，待 spec v0.2 走 WF-C 重寫。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
