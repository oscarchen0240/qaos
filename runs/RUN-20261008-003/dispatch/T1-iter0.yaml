  answer: admin 例外規則為 PM 最終決定，非資料錯誤或臆測：根層站台（無上層站台）建立時，型別可自由選擇（機台或線上），核心貨幣依所選類型連動建立，不受REQ-SITELIST-002子站台強制跟隨規則約束。此為PM已定案且已開發完成上線的產品行為，非待定或實驗性設計。spec.md原文尚未反映此例外，屬spec文件落後於實際已上線行為的已知落差。
