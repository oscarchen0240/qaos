  answer_sha256: 1d29cee7f000f930d0676cad5599636f286323f37f2f85dc7c05596c59891961
  answer: 以「三個角色的關係」權限範圍圖為準（同 CLR-PLATFORMRULE-001 附圖）：範圍由所屬站台決定，不是角色本身。站長掛在主站台 A → 可見範圍＝A 及其子樹；操作員只看自身場館。層級可指派範圍：管理員可指派管理員/站長及以下，站長只能指派站長以下，操作員不可指派。站長嘗試存取平行或上層站台（含直接以站台
