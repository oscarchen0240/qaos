  answer_sha256: 359e0362135c06c5224efca5517a09b53dc2f2c85ad685c331b4e6c600f56ac8
  answer: 提醒標示的呈現方式如截圖：交易列表中待核實的機台洗分列顯示黃色標籤「⚠ 現金未確認」，核實狀態欄為藍色「待核實」；已核實者為綠色「已核實」。報表的待核實洗分提醒沿用同款黃色警示標籤。
