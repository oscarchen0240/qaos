      quote: 設為 0 代表不限制
    - type: spec
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      content_hash: b1e2c55628b9b349616e9fea62804602a77c425e5e5bfbfe91714ad50ea6a1cc
