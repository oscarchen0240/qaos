    title: 場館額度上限設為 0 代表不限制：開分 req-keyin 送出遠大於原額度的金額仍回 0-OK 入帳，不會被當成『上限為 0』而回 1-OVER LIMIT
    requirement_ids:
    - REQ-CASHFLOW-004
    acceptance_criteria_ids:
    - AC-CASHFLOW-0041
    test_level: api
    test_types:
    - functional
    - negative
    - boundary
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    execution_cost: medium
    critical_path: true
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）【環境前提，需環境負責人確認】
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 額度上限的設定：額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，所以本案以探測步驟確認新額度已生效；動手前先記下原額度上限 Q_orig，執行完畢後還原
    test_data:
    - name: S（場館所有機台帳號分數合計）
      value: 依環境讀出
      note: 下文 A = S + 100，剩餘額度恰為 100
    - name: 對照開分金額
      value: 101
      note: 比剩餘額度 100 多 1，額度上限非 0 時必被拒
    - name: 大額開分金額
      value: 1000000
      note: 遠大於 A；開分是單階段、由平台直接判定，沒有 req-cashin 那種客戶端回報金額的防禦預檢問題
    - name: 額度上限（步驟 4 之後）
      value: 0
    steps:
    - n: 1
      action: 後台讀 M 目前分數，記為 B0；逐一讀出 M 所屬場館所有機台帳號的分數並加總，記為 S（含 M 的 B0）；並記下該場館現行的『額度上限』原值 Q_orig
      expected: 取得 B0、S、Q_orig
    - n: 2
      action: 把 M 所屬場館的『額度上限』設為 A = S + 100（非 0；剩餘額度恰為 100）
      expected: 額度上限 A 已儲存
    - n: 3
      action: 對照（額度上限非 0）：M 送出 req-keyin，金額 101（加計後合計 S + 101，超過 A 共 1 單位）
      expected: 回 1-OVER LIMIT；後台讀 M 分數仍為 B0。同時確認 A 已即時生效；若回 0-OK，表示額度尚未生效或 S 讀值有誤，先向環境負責人確認，不要往下做
    - n: 4
      action: 把該場館『額度上限』改為 0
      expected: 額度上限 0 已儲存
    - n: 5
      action: M 送出與步驟 3 完全相同的 req-keyin，金額 101
      expected: 回 0-OK，M 分數 = B0 + 101。同一筆金額在額度上限非 0 時被拒、改為 0 後成立，差異只來自額度上限的設定值，不是金額本身
    - n: 6
      action: M 送出 req-keyin，金額 1000000（遠大於步驟 2 的 A）
      expected: 回 0-OK，M 分數 = B0 + 101 + 1000000；不回 1-OVER LIMIT（額度上限 0 代表不限制，不是『上限為 0 所以任何金額都超過』）
    - n: 7
      action: 還原：把額度上限改回 Q_orig。M 留有的餘額（B0 + 1000101）若需歸零，可送 req-keyout（mode=all、throshold=0）全洗；此為清理，不列入判定
    expected_result: 場館額度上限為非 0 的 A 時，超過剩餘額度的開分（101）被拒：回 1-OVER LIMIT、分數不變；同場館額度上限改為 0 後，同一筆 101 與遠大於原額度的 1000000 開分都回 0-OK
      並入帳，不回 1-OVER LIMIT——0 代表不限制，不會被當成上限為 0。
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §業務規則與驗證（本包相關）（第 249 行）
      quote: 設為 0 代表不限制
    decision_refs:
