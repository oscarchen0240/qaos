    title: 後端手動取消 API 驗證權限：站長、操作員（非管理員）呼叫都不能取消待確認出金（TXID 仍為待確認、分數不變），管理員呼叫同一 API 則轉為已取消、分數不異動
    requirement_ids:
    - REQ-CASHFLOW-026
    acceptance_criteria_ids:
    - AC-CASHFLOW-0265
    - AC-CASHFLOW-0262
    test_level: api
    test_types:
    - functional
    - negative
    - security
    design_techniques:
    - security_rule
    priority: high
    risk: high
    execution_mode: manual
    execution_cost: medium
    critical_path: true
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案；動手前先記下原值。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提，spec 未定義】後端『手動取消待確認出金』API：CLR-CASHFLOW-008 說明後端已開發完成、前端（4.1 的『手動取消』入口）尚未開發（BUG-TXLOG-001 OPEN）。API 的路徑、認證方式（各後台角色的登入身分如何帶入）、請求參數與拒絕時的回應內容，spec
      與 CLR 均未定義，需由開發提供；本案不編造這些細節。取不到 API 規格時，本案記為『受阻』並回報缺口，不得改以 UI 假設通過（前端尚未開發）
    - 三個後台帳號（自行從環境中選定）：管理員（Admin）角色一個、站長角色一個、操作員角色一個，皆能登入後台並取得各自的 API 身分。'操作員' 角色在環境中的實際名稱與其權限範圍 spec 未定義，請環境負責人指定一個被歸類為非管理員的操作員帳號；環境沒有此角色帳號時，操作員那一步記為『受阻』，其餘步驟照做
    - 本案以 API 為主要驗證（不是選做）：前端『手動取消』入口尚未開發，既有 TC-CASHFLOW-117 的 UI 步驟無法執行，API 步驟是目前唯一能驗證後端權限的證據。本案只斷言『非管理員不能取消』的結果（TXID 狀態與分數），拒絕時的回應內容（碼、訊息）spec
      未定義，只記錄不斷言
