    title: 門檻 100 全洗 399.6 後留下的餘數 99.6：再以門檻 100 全洗回 1-NO CREDITS 洗不出，按結算出金則全額領回 99.6（含小數）、餘額歸 0、交易紀錄 -99.6
    requirement_ids:
    - REQ-CASHFLOW-014
    - REQ-CASHFLOW-020
    acceptance_criteria_ids:
    - AC-CASHFLOW-0142
    - AC-CASHFLOW-0203
    test_level: api
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: medium
    risk: high
    execution_mode: manual
    execution_cost: medium
    critical_path: false
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案；動手前先記下原值。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】本案需要機台帳號出現帶小數的分數：spec 只說明餘額帶小數來自部分遊戲派彩，沒有定義 req-keyin 是否接受小數金額，也沒有定義如何構造小數餘額。建議作法（我的推測，未經
      spec 證實）：以 req-keyin 送出只帶一位小數的金額（本案只用一位小數；小數位數上限、進位與顯示格式 spec 未定義，不在本案判定範圍）。若被拒（例如 6-BAD DATA/FORMAT）或顯示被取整，改請環境負責人以測試資料工具或指定派彩設定構造相同餘額；仍無法構造恰為指定值的餘額時，本案記為『受阻』，不可改用其他小數值替代後仍宣稱通過
    - 清空機台分數的方式：用洗分（req-keyout，mode=all、throshold=0），並且不要核實這筆清空用的洗分；不要用出金清空，因為出金的收據金額會混入場館報表（此為清理手法，依 spec『稽核倍數預設 0 倍，玩家隨時可洗分』與『門檻
      0＝洗出全部餘額』）
    - 出金不套門檻、不需要 throshold；過渡期（機台暫無印表機）出金由前台依序呼叫 req-cashout／end-cashout，本案以直接呼叫機台 API 等效驗證平台端行為
    test_data:
    - name: 佈置用開分金額
      value: 399.6
    - name: 洗分門檻 throshold
      value: 100
    - name: 預期餘數
      value: 99.6
    - name: 預期出金核可金額
      value: 99.6
    - name: 預期交易紀錄金額
      value: -99.6
    steps:
    - n: 1
      action: 若 M 目前分數不是 0，先用洗分清空（req-keyout，mode=all、throshold=0，不核實）
      expected: M 分數為 0
    - n: 2
      action: 【佈置】M 送出 req-keyin，金額 399.6
      expected: 回 0-OK，M 分數 = 399.6；若被拒或被取整，依前提處理（受阻，不可改用其他值）
    - n: 3
      action: 【佈置】M 送出 req-keyout，mode=all、throshold=100
      expected: 回 0-OK，value 為 300；M 分數 = 99.6。此檢查點只確認佈置成立（情境同 TC-CASHFLOW-111），不列入本案判定
    - n: 4
      action: M 再送出 req-keyout，mode=all、throshold=100（餘數 99.6 不足一個門檻單位 100）
      expected: 回 1-NO CREDITS（可洗金額為 0）；後台讀 M 分數仍為 99.6（餘數沒有被清除或取整）
    - n: 5
      action: M 送出 req-cashout
      expected: 回 0-OK；核可金額為 99.6（含小數；不取整為 99 或 100，也不回 1-NO CREDITS）；取得 TXID_1
    - n: 6
      action: M 送出 end-cashout，帶 TXID_1
      expected: 回 0-OK
    - n: 7
      action: 後台讀 M 分數；4.1 查看這筆機台出金（TXID_1）的金額
      expected: M 分數為 0；這筆機台出金金額為 -99.6
    - n: 8
      action: 還原：額度上限改回原值（不影響判定）
    expected_result: 餘額 399.6、門檻 100 全洗後餘數 99.6 留在機台帳號：再以門檻 100 全洗可洗金額為 0，回 1-NO CREDITS、餘數不變；改按結算出金則核可金額為全部餘額 99.6（含小數、不取整），機台餘額歸
      0，交易紀錄金額 -99.6。
