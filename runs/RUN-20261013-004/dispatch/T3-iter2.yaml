  spec_version: '0.3'
  requirement_id: REQ-DAILYREPORT-016
  question_id: Q04
  answer_rev: 0
  answer_sha256: d6a13eb9dc6ced8b2888a6cf8a82a18587c816ccd7e15175488f67b292373799
  answer: 以 v0.3 為準：查詢期間沒有任何交易與場次時，列表仍列出該結算期間，各金額與筆數欄顯示 0；期初／期末餘額依時點值規則，沿用最近一個營業日的結算值（從未有分數者為 0）；匯出 CSV 同此規則。CLR-DAILYREPORT-006「各欄位顯示
    0」對期初／期末餘額不再適用（該 CLR 回答時尚無期初餘額欄），其餘欄位為 0 的結論不變。
