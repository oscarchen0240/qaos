  answer_sha256: 1291e5d88a01595f8b788c86d61ff37237fbc126de16b4febc11a5b33c59ff48
  answer: 依 SPEC-DAILYREPORT-001 v0.3（2026-10-05 定案，第 53、54 行）：出金在洗分出金核實頁被作廢後，該筆收據金額仍計入出收據那天的「收據金額」，並計入新增的「已作廢金額」欄（以出收據的日期歸屬，不論作廢是哪一天）；每列
    收據金額 ＝ 已兌現金額 ＋ 未兌現金額 ＋ 已作廢金額。即原問題的選項 B。
