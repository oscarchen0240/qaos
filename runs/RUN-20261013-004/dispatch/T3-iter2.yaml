  answer_sha256: b40db737b492e2dc4b8add3a201608c75de6a0ccaf773345033d01da166d01ab
  answer: 以 v0.3 為準：未兌現金額以出收據的日期歸屬——每列只含當日（週期列為該週期內各營業日）出的收據中、截至查詢當下仍為待核實者的金額合計，直到核實或作廢才轉出；與洗分出金核實 REQ-CASHOUT-032 一致。CLR-DAILYREPORT-009「未兌現不受統計週期切分」的結論不再適用（只算結算日期範圍內出的收據、狀態以查詢當下為準這兩點不變）。
  resolution: requirement_clarified
  basis_hash: 629d539ec14a5ca22f04b90e108bddb8d77c2529e75d56bf8faff31279eac208
