    - name: 活動
      value: 門檻 100／單週期上限 5／稽核倍數 0／每日重置
    - name: 下注
      value: M1 有效流水貢獻 200（產生 2 個紅包）
    steps:
    - n: 1
      action: 建立機台場館紅包活動『RP-ARC-DEC-W』（永久）：每日重置；預設規則門檻 100／單週期上限 5／獎勵方式『隨機金額』權重表兩列：紅包金額 0.5 機率 50.0%、紅包金額 10.5 機率 50.0%；稽核倍數
        0；點『儲存』
      expected: 權重表金額 0.5 與 10.5 皆為大於 0 的 1 位小數、機率合計 100%，不出現驗證提示；稽核倍數 0 不顯示機台稽核警告；建立成功
    - n: 2
      action: 店員對 M1 開分 200，使 M1 進入進行中場次；M1 結算有效流水貢獻 200（跨 2 個門檻）
      expected: 產生 2 個待開啟紅包 P1、P2；紅包明細中兩筆的『紅包金額』各為 0.5 或 10.5 其中之一（產生當下已抽定），分別記為 a1、a2（抽到哪個金額不判定，以紅包明細顯示為準）
    - n: 3
      action: 記下 M1 目前分數 S1；至『各式報表 > 場館日結報表』（統計維度『依場次明細』、機台帳號 M1、結算日期含此刻），找到 M1 進行中場次那一列，記下『紅包金額』R0、期初餘額、開分金額、進鈔金額、損益、洗分金額、收據金額、期末餘額
      expected: 已記錄；待開啟的 P1、P2 不計入『紅包金額』。自此步驟起 M1 不再下注、不洗分、不出金
    - n: 4
      action: M1 依領取流程只領取一個紅包（領取獎勵（2）→ 確認領取），再看紅包明細確認被領取的是 P1 或 P2，記為已入帳紅包 Pk（金額 ak）；另一個保持待開啟
      expected: 機台分數＝S1＋ak（ak 為 0.5 或 10.5，恰好增加該金額，不取整）；紅包明細：Pk『已入帳』，另一個仍『待開啟』
    - n: 5
      action: 重新查詢『場館日結報表』（同步驟 3 條件、同一個場次列）
      expected: 『紅包金額』＝R0＋ak（只計已入帳；待開啟的另一個紅包不計入）；以該列顯示的數字驗算 期初餘額＋開分金額＋進鈔金額＋紅包金額＋損益－洗分金額－收據金額 ＝ 期末餘額，等式成立
    - n: 6
      action: M1 領取剩下的紅包（金額 a'）後，再次查詢同一列
      expected: 機台分數再增加 a'；『紅包金額』＝R0＋a1＋a2；餘額驗算仍成立
    - n: 7
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 權重表 0.5／10.5 的機台紅包可建立；每次領取後機台分數增加的金額恰為該紅包在紅包明細顯示的金額（0.5 或 10.5，不取整）；場館日結報表該場次的『紅包金額』只計已入帳紅包（待開啟不計），且餘額驗算式
      期末餘額 ＝ 期初餘額＋開分＋進鈔＋紅包金額＋損益－洗分－收據 在帶小數時仍成立。
