    - negative
    design_techniques:
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 備妥兩個後台帳號：甲＝管理員、乙＝站長（皆具優惠活動管理權限、所屬同一線上站台），分別用獨立瀏覽器登入，並各自把頁面標題下方的站台切換下拉選單選到該線上站台（核心貨幣 USDT）
    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 【環境前提，spec 未定義，需工程提供】測試人員可用 API 工具（例如 REST 客戶端或瀏覽器開發者工具）以指定後台帳號的登入身分直接呼叫後端 API；各 API 的端點、參數與認證方式 spec 未定義，由工程提供。錯誤代碼與
      HTTP 狀態碼由後端定義，本案只核對『被拒絕』與『資料不變』
    - 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
    - 【環境前提，spec 未定義，需工程提供】可程式化地讓多筆注單『幾乎同時』結算（例如以腳本模擬遊戲商的注單結算通知，或同時操作多個前台工作階段各自結算）；結算通知的介面與格式 spec 未定義，由工程提供。每筆注單的有效流水貢獻須可指定（貢獻系數
      100% 的遊戲，有效投注額＝有效流水貢獻）
    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 選定一名既有線上會員（玩家 A），本週期無注單計入累計
    - 本案重複 3 輪；每輪開始前站台不得有進行中或排程中的紅包活動（上一輪留下的活動要取消排程）。每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』
    test_data:
    - name: 甲／乙活動
      value: RP-RACE-ADM（永久）／RP-RACE-MGR（約 2 分鐘後～約 30 天後）
    - name: 輪數
      value: 3 輪
    steps:
    - n: 1
      action: 【每一輪】甲、乙各自進入『新增優惠活動』、活動類型『紅包』，各填妥合法表單：甲＝活動名稱『RP-RACE-ADM』、活動時間『永久』；乙＝活動名稱『RP-RACE-MGR』、活動時間『區間』起＝約 2 分鐘後、迄＝約
        30 天後（UTC+0）；兩者其餘設定相同（活動幣種 USDT；每日重置；預設規則門檻 100／上限 5／固定 10／稽核 1）。先不按儲存
      expected: 兩份表單都已填妥，兩人的時段重疊
    - n: 2
      action: 【每一輪】讓甲、乙的『儲存』（或對應的『新增紅包活動』API 請求）幾乎同時送出
      expected: 請求送出
    - n: 3
      action: 【每一輪】檢視『活動排程 > 紅包活動』
      expected: 狀態為『進行中』或『排程中』的活動恰 1 個（RP-RACE-ADM 或 RP-RACE-MGR 其中之一，誰成立不判定）；另一個沒有被建立。落敗者畫面的提示（是否為『與「…」的活動時間重疊…』）spec 對並送情境未定義，只記錄
    - n: 4
      action: 【每一輪】待存活的活動變為『進行中』後，玩家 A 結算有效流水貢獻 100
      expected: 只產生 1 個紅包（紅包明細 1 筆）；兩個活動同時進行中時才會重複累計與重複發放
    - n: 5
      action: 【每一輪結束】對存活的活動點『取消排程』並於確認視窗點『確認取消』，再進入下一輪（玩家 A 的累計隨新活動重新起算）
      expected: 已取消排程
    expected_result: 兩人同時建立時段重疊的紅包活動時，每一輪最終只有 1 個活動成立（進行中或排程中），另一個因時段重疊被阻擋、未建立；之後玩家結算達門檻只產生 1 個紅包。
