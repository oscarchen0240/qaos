      expected: 後端拒絕並回傳『無權限』，不回傳 CSV 內容
    - n: 6
      action: 站長身分呼叫『新增紅包活動』API，目標站台為 A1（合法資料：活動名稱『RP-SUB-NEW』、區間約 100 天後～約 130 天後、其餘設定同 RP-SUB，時段不與 RP-SUB 重疊）
