    title: 線上玩家在確認領取視窗開著時跨過 UTC+0 00:00 重置才按［確認領取］：不入帳（錢包、交易紀錄、稽核明細不變），紅包已作廢（週期重置）並釋放預算
    description: 線上玩家在確認領取視窗開著時跨過 UTC+0 00:00 重置才按［確認領取］：不入帳（錢包、交易紀錄、稽核明細不變），紅包已作廢（週期重置）並釋放預算
    product: ba-admin
