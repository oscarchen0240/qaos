      value: 追加預算 6000、取消排程、查詢紅包明細、匯出 CSV、新增活動（目標站台 A1）
    steps:
    - n: 1
      action: 【對照組】以 A 的管理員身分用 API 工具對 RP-SUB 呼叫『查詢紅包明細』API
      expected: 成功回傳 RP-SUB 的紅包資料（至少 1 筆）——管理員範圍含其子站台，並確認 API 呼叫方式正確（之後的拒絕不是因為請求格式錯誤）
    - n: 2
      action: 以 A 的站長身分，用 API 工具對 RP-SUB 呼叫『追加預算』API（新總預算 6000）
