  - draft_id: TC-DRAFT-01M4RHPW69PH4EPP344S7GZ8VA
    title: 管理員與站長同時在同一線上站台建立時段重疊的紅包活動：最終只存在 1 個活動，另一個被阻擋（重複 3 輪）
    description: 管理員與站長同時在同一線上站台建立時段重疊的紅包活動：最終只存在 1 個活動，另一個被阻擋（重複 3 輪）
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
    - REQ-REDPACKET-017
    acceptance_criteria_ids:
    - AC-REDPACKET-0171
    - AC-REDPACKET-0172
    spec_id: SPEC-REDPACKET-001
