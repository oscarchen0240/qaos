      value: RP-OLD、RP-NEW：門檻 1000／上限 5／固定 10／稽核 1；每日重置；永久
    - name: 注單
      value: Y＝300（RP-OLD 期間，之後被取消）；Z＝500（RP-NEW 期間）；補注 499、1
    steps:
    - n: 1
      action: 建立活動『RP-OLD』（活動時間『永久』）：活動幣種 USDT；預設規則門檻 1000／上限 5／固定 10／稽核 1；每日重置；儲存
      expected: 建立成功
    - n: 2
      action: 玩家 A 結算注單 Y（有效流水貢獻 300）
      expected: RP-OLD 累計 300，沒有紅包
    - n: 3
      action: 於『活動排程 > 紅包活動』對 RP-OLD 點『取消排程』，於確認視窗點『確認取消』
      expected: RP-OLD 狀態變為『已取消』
    - n: 4
      action: 立即新增活動『RP-NEW』（活動時間『永久』，其餘設定與 RP-OLD 完全相同）並儲存；建立後等狀態變為『進行中』
      expected: 儲存成功（已取消的活動不占用時段，可立即以相同時段重建）；RP-NEW 的累計從 0 起算，不含注單 Y（Y 結算時 RP-NEW 尚不存在）
    - n: 5
      action: 玩家 A 結算注單 Z（有效流水貢獻 500）；玩家 A 於前台點紅包圖示開啟紅包視窗
      expected: RP-NEW 累計 500：紅包視窗累計進度顯示 500 ／ 1,000（尚差 500），沒有紅包
    - n: 6
      action: 對屬於 RP-OLD 期間的注單 Y 觸發遊戲商『取消』（－300）；玩家 A 重新開啟紅包視窗
      expected: RP-NEW 的累計不被扣減（原注單所屬的活動已結束，不扣）：累計進度仍為 500 ／ 1,000；RP-OLD 的紅包明細（若有）不受影響
    - n: 7
      action: 玩家 A 結算有效流水貢獻 499
      expected: 累計 999，沒有紅包（若 Y 的 －300 被誤扣到 RP-NEW，累計會是 699）
    - n: 8
      action: 玩家 A 結算有效流水貢獻 1
      expected: 累計 1,000 達標：產生恰 1 個紅包，紅包明細『週期累計』顯示 1,000
    - n: 9
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 原注單所屬的活動已結束（取消排程）後，該注單被遊戲商取消的負值有效流水貢獻不扣到新活動的累計：新活動累計維持 500，補 499 仍未達標、再補 1 恰好達標並產生 1 個紅包（週期累計 1,000）。
