      expected: 顯示提示『未開啟的紅包將於重置時作廢』
    - n: 7
      action: 清理：先於『活動排程 > 紅包活動』取消該活動排程（確認視窗點『確認取消』），再回『站台列表』把日結時間改回環境原值（此為調早且原時點已過，會依規則立即重置，因活動已取消，無待開啟紅包受影響）
      expected: 活動已取消排程；日結時間已還原
