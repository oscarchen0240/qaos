    title: 現金淨收不扣已作廢的收據：當日開分 1000、出金收據 500（200 已核銷、300 已作廢）時現金淨收為 800
    requirement_ids:
    - REQ-DAILYREPORT-012
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0123
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    preconditions:
    - 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
    - 進入 各式報表 > 場館日結報表
    - 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
      UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
    - （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
      AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
    - 機台 A 為自行從環境中選定的既有機台帳號（會員編號），須在該管理員管轄範圍內的機台場館；需要第二台機台時另選一台不同的既有機台帳號
    - 機台 A 在某個過去營業日 D（單一營業日）：開分金額合計 1000、進鈔 0、洗分 0（因此已核實洗分為 0）；出金收據兩張，面額 200（已核銷）與 300（已作廢），共 500；A 在 D 沒有其他出金收據。（示意形狀，非強制：出金一律清空餘額，所以
      1000 的開分可以是分三次開 200、300、500，前兩次各自出金成收據 200、300，第三次的 500 留在機台。形成方式由環境負責人決定。）
    - 測試期間不要對這兩張收據做核實或作廢
    test_data:
    - name: 開分／進鈔／洗分
      value: 1000／0／0
    - name: 收據（已核銷／已作廢）
      value: 200／300
    - name: 預期現金淨收
      value: 800
    - name: 不應出現的結果
      value: '500'
    steps:
    - n: 1
      action: 統計維度選「依機台明細」、統計週期選「按日」、機台帳號填機台 A、結算日期設為營業日 D（起迄同一天），搜尋
    - n: 2
      action: 找到機台 A 在 D 的列，記錄「開分金額」「進鈔金額」「已核實洗分」「已兌現金額」「已作廢金額」「現金淨收」
      expected: 已兌現金額 200、已作廢金額 300、已核實洗分 0——用來確認造數形狀成立；若不符，停止並回報環境負責人，不要繼續判定
    - n: 3
      action: 以 開分 ＋ 進鈔 － 已核實洗分 － 已兌現 計算現金淨收，與列上的「現金淨收」比對
    expected_result: 機台 A 在 D 的列現金淨收 800（＝1000＋0－0－200）：已作廢的 300 不扣，也不是把整筆 500 收據都扣掉的 500。
