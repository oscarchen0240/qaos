      action: 統計維度選「依場館彙總」，搜尋；記錄列表上的全部欄位標題（含：結算期間、場館／機台、場次數、開分金額、洗分金額、已核實洗分、待核實洗分、進鈔金額、收據金額、已兌現金額、未兌現金額、已作廢金額、現金淨收、注單數、有效投注額、損益、期初餘額、期末餘額）；逐一點擊每一個欄位標題各一次（每次點擊另一欄時該欄由遞增開始），檢視該標題的指示是否為
        ▲；數值欄（場次數、各金額欄、注單數、期初／期末餘額、損益等）另檢視列順序是否依數值遞增；文字與時間欄（結算期間、場館／機台、場次編號、開始／結束時間）只記錄實際列順序，不作判準
    - n: 2
      action: 統計維度改選「依機台明細」，搜尋；重複步驟 1 的逐欄點擊（含已作廢金額、注單數欄）
    - n: 3
      action: 統計維度改選「依場次明細」，搜尋；記錄全部欄位標題（含場次編號、開始／結束時間、場次時長等該維度新增的欄位，以及已作廢金額、注單數欄）；重複步驟 1 的逐欄點擊
    expected_result: 三種統計維度下，列表上的每個欄位標題（包含已作廢金額欄與注單數欄）都可點擊排序：點擊後該標題顯示 ▲，數值欄的列順序依數值單調遞增；不存在點擊後無反應或無排序指示的欄位。文字與時間欄（結算期間、場館／機台、場次編號、開始／結束時間，含進行中場次結束時間「—」）的實際排序規則
      spec 未定義，只記錄實際順序、不作為通過與否的判準。
