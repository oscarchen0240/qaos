  question_id: null
  answer_rev: 0
  answer_sha256: 359e0362135c06c5224efca5517a09b53dc2f2c85ad685c331b4e6c600f56ac8
  answer: 提醒標示的呈現方式如截圖：交易列表中待核實的機台洗分列顯示黃色標籤「⚠ 現金未確認」，核實狀態欄為藍色「待核實」；已核實者為綠色「已核實」。報表的待核實洗分提醒沿用同款黃色警示標籤。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-006
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-016
  question_id: null
  answer_rev: 0
  answer_sha256: 50eeeed9f7247bcab8e7160a12ac5df8385e6c65f34258508f561e19f9ea696b
  answer: 無資料時列表仍列出，日期正常顯示、各欄位顯示 0。欄位清單（PM 提供）：場館、場次數、開分金額、洗分金額、已核實洗分、待核實洗分、進鈔金額、收據金額、已兌現金額、未兌現金額、現金淨收、注單數、有效投注額、損益、期末餘額。註：此清單含「注單數」，Spec
    v0.1 列表欄位無此欄 → spec 需補；匯出 CSV 無資料時的行為未明說，推定同列表（一列 0）。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-007
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-009
  question_id: null
  answer_rev: 0
  answer_sha256: 0ecb66079c64cb54fe57c01c8511e0654958afb4b9b57149b9c9ba234aa7203c
  answer: 逾時結束的時間會超過日結時間；而 Spec 規定日結時間到達時強制結束所有進行中的場次，因此當日內場次只會以「已結束」或「日結結算」收尾，兩者都計入當日場次數（場次數計算在今日）。→ TC-DAILYREPORT-031 的假設「含所有非進行中狀態、日結結算歸屬開始的營業日」已確認。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-008
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-005
  question_id: null
  answer_rev: 0
  answer_sha256: 93118bcd237fa1fc198d157363d85e311ae8361d441b838bb15c62fd4da5d85e
  answer: 不完整週照實際範圍顯示（截圖：結算日期 09-03 起、按週 → 列出「2026-09-07 ~ 2026-09-13」與「2026-09-03 ~ 2026-09-06」兩列），只要完整週以週一為週起即可；範圍外的營業日（08-31～09-02）不計入第一列合計。→
    TC-014 的兩條假設已確認（顯示格式＝實際起迄；只計結算日期範圍內）。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-009
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-015
  question_id: null
  answer_rev: 0
  answer_sha256: acff34834ada1db42a387f922eb05396a36c1c38ad151b0b69c15a8069445ce7
  answer: 受結算日期範圍限制：結算日期仍是篩選條件，未兌現金額只算範圍內；只是不受統計週期切分影響。例：9/10 未兌現 200；(a) 結算 09-03～09-09 按週 → 09-07～09-09 列未兌現 1000、09-03～09-06
    列 0；(b) 結算 09-03～09-10 → 09-07～09-10 列 1200、09-03～09-06 列 0。→ **TC-DAILYREPORT-046 的假設（不受結算日期限制）是錯的**，該案 expected 需改為「不包含範圍外的
    200」；建議 APR-0003 逐項 reject TC-046，待 spec v0.2 走 WF-C 重寫。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-010
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-011
  question_id: null
  answer_rev: 0
  answer_sha256: 98800f6b3a1ac5bb86c4045cc4e23acb9a861b36fd6415ae7e8d6e75d1d5a523
  answer: A：已兌現金額以收據日歸屬——「當日出金的收據中，已核實（核銷）者的金額合計」，記在出收據那天，不論實際付現是哪一天（同 AC-DAILYREPORT-0113）。因此單列內 收據金額＝已兌現＋未兌現＋已作廢 成立；現金淨收（開分＋進鈔－已核實洗分－已兌現）含未來才付現的收據金額，不是當日實際現金增減。作廢在報表的呈現另見
    CLR-DAILYREPORT-011（待回）。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-012
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
