  answer_sha256: 2458cd0e03f998bebd08732838c212fc1bf46538cee1d40116a71f6f0dd89eeb
  answer: '結算日期異常（起日晚於迄日等）：找不到資料即可，API 回 rows: []。註：與 Spec「必填」的關係——未填時是否也回空列表而非阻擋，建議 spec v0.2 明寫。

    【2026-09-14 補充】未填結算日期時，前端 popup 警示「失敗：結算日期為必填」（截圖）；不送出查詢。→ TC-DAILYREPORT-009 的假設已解（阻擋方式＝popup）。'
  resolution: requirement_clarified
