  answer_rev: 0
  answer_sha256: 6dcaec8f8873e6a2f5c5e30b408467f7e5ad821901e145767d7ae293f66cb6af
  answer: 日結時間為場館設定欄位（每日結算的截止時刻，UTC+0），畫面截圖顯示欄位有預設值「上午 12:00」（即 00:00 UTC+0）。→ 未設定時以 00:00 UTC+0 切分營業日。
  resolution: requirement_clarified
