  answer_sha256: 8d11dd3ead777b893984a15b62c03a41b46a52e760d8d5eb950f1881e433166c
  answer: 比照操作員：管理員或站長查詢、匯出管轄範圍外的場館（含直接呼叫 API 帶範圍外場館參數）時，前端不提供範圍外場館選項，後端拒絕並回傳「無權限」錯誤、資料不變；不採用「當作不存在／回空結果」。錯誤代碼由後端定義（截至 2026-10-09
    後端尚未定案）。依 QA 問題單回覆 CLR-SITELIST-015「全系統的越權處理一致，CLR-DAILYREPORT-014 同樣適用」；規則寫在開發包⑧（SPEC-ROLEPERM-001 v0.2），場館日結報表 spec
    本身未為此改版。
