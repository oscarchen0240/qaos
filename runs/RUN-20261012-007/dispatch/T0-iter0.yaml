  question_id: null
  answer_rev: 0
  answer_sha256: 93a09b95b9590aea15898a41140e25afce3fda35ace31e1b3508f473711690fd
  answer: B：場館日結報表「依場次明細」只列已結束／逾時結束／日結結算的場次，進行中場次不列。現行實作（時長僅於結算時計算一次、明細不列進行中）符合。→ AC-DAILYREPORT-0083 作廢、TC-DAILYREPORT-027
    retire；REQ-008 statement 移除「進行中場次結束時間顯示「—」、時長為累計至查詢當下」。附帶題「會員詳細頁機台資訊區塊的進行中場次摘要是否顯示即時時長」本次未決，留待 ACCOUNT／ARCADE 處理。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
- clarification_id: CLR-DAILYREPORT-013
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  requirement_id: REQ-DAILYREPORT-008
  question_id: null
  answer_rev: 0
  answer_sha256: 8fc28e161f226ff67131d4b0a1ac80cdc6e6eb53a94e81f47c567a0a3a9177fd
  answer: A：以 spec 2026-09-17 為準。①依場次明細列出進行中場次：結束時間「—」，場次時長與期末餘額為累計到查詢當下的值；②期末餘額一律計入進行中場次累計到查詢當下的分數（已結算的營業日仍為結算時點的值）。CLR-DAILYREPORT-012
    的 B 作廢。現行實作（進行中場次在日結報表查不到任何資料）為缺陷。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
