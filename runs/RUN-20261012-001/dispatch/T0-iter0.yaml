  answer: 選 A：任何站台都不能刪除，線上、機台、根站台皆同。畫面沒有刪除按鈕，以 API 直接呼叫後端也拒絕；要停止服務一律切「暫停」或「關閉」。v06 的刪除寫法（權限表兩列、列表操作欄、刪除站台小節、刪除確認規則）已全部從 v07
    移除，proto 也拿掉刪除按鈕與確認彈窗。CLR-SITELIST-008／009 的定案維持有效。
  resolution: spec_updated
  basis_hash: 304c29ee5c1dbc7d90e1138bb20ad60d0040530cdaaed23589e6f8a4b8f65727
  scope: null
  applicability: []
