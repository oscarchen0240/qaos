  answer_sha256: 98800f6b3a1ac5bb86c4045cc4e23acb9a861b36fd6415ae7e8d6e75d1d5a523
  answer: A：已兌現金額以收據日歸屬——「當日出金的收據中，已核實（核銷）者的金額合計」，記在出收據那天，不論實際付現是哪一天（同 AC-DAILYREPORT-0113）。因此單列內 收據金額＝已兌現＋未兌現＋已作廢 成立；現金淨收（開分＋進鈔－已核實洗分－已兌現）含未來才付現的收據金額，不是當日實際現金增減。作廢在報表的呈現另見
    CLR-DAILYREPORT-011（待回）。
  resolution: requirement_clarified
  basis_hash: 16393525216693f380ce340482e5aeac450e8095a26b7e866c6ab34e86e8d105
  scope: null
  applicability: []
