  question_id: Q02
  answer_rev: 0
  answer_sha256: 003f7dc16777299de02a6df389603b768684f5d365e2f5a5c5ff65fa451bab53
  answer: 後端拒絕：以 API 建立子站台並帶入與主站台（上層站台）不同的站台類型時，後端會擋下，不只是前端唯讀限制。回應內容（錯誤代碼、訊息、HTTP 狀態）原答覆未定義，另開 CLR 追問。沿用 CLR-SITELIST-001
    rev 0。
  resolution: requirement_clarified
  basis_hash: c2d58a12dd274a678be25a4d5cbfaa75b5e5067d4db2759f6069b5b287a8e906
