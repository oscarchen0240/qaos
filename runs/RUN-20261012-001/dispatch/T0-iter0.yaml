  answer_sha256: e3069abe2fb3f639145d37f22a9c49648577dd427218e92270df4eba033ab27c
  answer: 站長不可指派站長，也不可指派管理員：角色下拉選單依操作者自身角色過濾，站長的畫面不會出現「管理員」與「站長」選項；直接呼叫 API 越權指派時，後端拒絕並回傳「無權限」（選 A）。站長可以指派操作員；管理員可指派所有角色，含管理員與操作員（可指派的角色須低於操作者自身角色，唯管理員可指派管理員）。指派在「系統使用者列表」操作：點列表中的角色欄位，從下拉選單選擇新角色（手冊
