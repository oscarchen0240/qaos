  answer_sha256: 4cbaddfb8dd1ff7b382270a8d932aad6d677ed945c573a648fbae56f49a834dc
  answer: 選 A：任何站台都不能刪除，因此「刪除仍有子站台的站台時子樹如何處理」的情境不會發生，B1～B3 的追問不適用，本條僅供追溯。
