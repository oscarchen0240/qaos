- clarification_id: CLR-SITELIST-019
  status: ANSWERED
  kind: spec_question
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  requirement_id: REQ-SITELIST-002
  question_id: Q03
  answer_rev: 0
  answer_sha256: 6f82dfe5880bd1b03b6c5778b698de57888c313649da705be0d06bc533afb95b
  answer: 會自動啟用，且不依賴上層：新站台建立時，核心貨幣連動建立的同時，會自動在該站台自己的「鏈上錢包管理」啟用對應幣別（例如機台類型建立時 TWD 會自動啟用）；此連動不需要根站台 admin 或上層站台的鏈上錢包管理預先啟用該幣別，是新站台自己獨立產生的初始啟用狀態。鏈上錢包管理是每個站台各自一份的設定，管理該站台可使用幣種的啟用／禁用（代表能否出入金），建立後可隨時調整；核心貨幣則於建立時依類型決定、不可更改。沿用
    CLR-SITELIST-012 rev 0（修正 CLR-SITELIST-011）。
