    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【清空後依序佈置】由站長（或管理員）於該機台場館建立活動 E『RP-ARC-E』：重置方式每日、活動時間『永久』、預設規則（門檻 300／上限 5／固定 20／稽核 0）、總預算 5000；儲存後於『活動排程 > 紅包活動』確認 E
      出現（狀態為『進行中』或『排程中』皆可）
    - 另備該機台場館的操作員後台帳號（所屬場館即上述機台場館）
    - 【環境前提，spec 未定義，需工程提供】測試人員可用 API 工具（例如 REST 客戶端或瀏覽器開發者工具）以指定後台帳號的登入身分直接呼叫後端 API；各 API 的端點、參數與認證方式 spec 未定義，由工程提供。錯誤代碼與
      HTTP 狀態碼由後端定義，本案只核對『被拒絕』與『資料不變』
    test_data:
    - name: 活動 E 總預算
      value: 5000
    - name: API 追加測試值
      value: 新總預算 6000
    steps:
    - n: 1
      action: 以操作員登入，切到該機台場館；進入左側『優惠活動管理』，再進入『活動排程 > 紅包活動』
      expected: 可進入優惠活動管理與活動排程列表，列表列出活動 E
    - n: 2
      action: 檢視頁面上方與活動 E 該列的操作欄
      expected: 畫面不顯示『新增優惠活動』『追加預算』『取消排程』按鈕
    - n: 3
      action: 以操作員的登入身分，用 API 工具直接呼叫『新增紅包活動』API（帶一組合法的活動資料，活動名稱『RP-OP-NEW』）
      expected: 後端拒絕並回傳『無權限』；『活動排程 > 紅包活動』沒有新增『RP-OP-NEW』
    - n: 4
      action: 以同一身分直接呼叫『追加預算』API 對活動 E（新總預算 6000）
      expected: 後端拒絕並回傳『無權限』；活動 E 的總預算仍為 5000
    - n: 5
      action: 以同一身分直接呼叫『取消排程』API 對活動 E
      expected: 後端拒絕並回傳『無權限』；活動 E 仍在列表且狀態未變為『已取消』
    - n: 6
      action: 改以站長登入，檢視活動 E
      expected: 總預算 5000、活動 E 未被取消；列表中沒有操作員建立的活動
    - n: 7
      action: 清理：以站長於機台場館『活動排程 > 紅包活動』對活動 E 點『取消排程』，於確認視窗點『確認取消』
      expected: 已取消排程
    expected_result: 操作員可進入機台場館的優惠活動管理與活動排程列表，但畫面不顯示『新增優惠活動』『追加預算』『取消排程』按鈕；直接呼叫新增、追加預算、取消排程 API 一律被後端拒絕並回傳『無權限』，活動 E 的資料與狀態不變。
    expected_result_spec_reference:
