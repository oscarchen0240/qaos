      action: 建立活動『RP-NOPART』（永久）：活動幣種 USDT；預設規則『關閉』；新增等級規則 1 勾選序號 s（門檻 100／上限 5／固定 10／稽核 1）；每日重置；儲存
      expected: 建立成功
    - n: 2
      action: 會員 C（序號 c，無等級規則、預設規則關閉、無待開啟紅包）進入前台，檢視畫面右側
      expected: 不顯示此紅包活動（沒有紅包圖示）
    - n: 3
      action: 會員 B（序號 s）結算有效流水貢獻 100
      expected: 產生 1 個待開啟紅包 P1；前台紅包圖示亮起
    - n: 4
      action: 把會員 B 降級至序號 c2（沒有適用規則的等級）；會員 B 重新整理前台，檢視畫面右側並開啟紅包視窗
      expected: 仍顯示紅包圖示與視窗供領取；累計進度處顯示『目前等級不參加』
    - n: 5
      action: 會員 B 依領取流程領取 P1
      expected: 可領取，入帳 10
    - n: 6
      action: 會員 B 再看前台畫面右側
      expected: 不顯示此紅包活動（已無待開啟紅包，且目前等級沒有適用規則）
    - n: 7
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 會員當下等級沒有適用規則且沒有待開啟紅包時，前台不顯示此活動；仍有待開啟紅包時照常顯示供領取，累計進度處顯示『目前等級不參加』，可領取；領完後不再顯示。
