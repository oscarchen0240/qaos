    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 機台帳號 M1（自行從環境中選定，本週期無注單）
    test_data:
    - name: 活動
      value: 門檻 300／上限 5／固定 20／稽核 0
    - name: 下注
      value: 建立前 300；建立後 299、1
    steps:
    - n: 1
      action: 確認該機台場館沒有任何進行中或排程中的紅包活動（先清空）；M1 結算有效流水貢獻 300
      expected: 沒有紅包、沒有活動可累計（此時場館尚未建立紅包活動）
    - n: 2
      action: 建立機台場館紅包活動『RP-LATEJOIN』（永久）：每日重置；預設規則門檻 300／上限 5／固定 20／稽核 0；儲存
      expected: 建立成功
    - n: 3
      action: 檢視紅包明細
      expected: 沒有任何紅包（建立前的 300 不計入、不補計）
    - n: 4
      action: M1 結算有效流水貢獻 299
      expected: 累計 299，沒有紅包（若建立前的 300 被補計，這裡就會達標）
    - n: 5
      action: M1 結算有效流水貢獻 1
      expected: 累計 300 達標：產生 1 個紅包，紅包明細『週期累計』顯示 300（不是 600）
    - n: 6
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 紅包版本已上線但場館尚未建立紅包活動時，機台帳號注單不累計、不產生紅包；站長建立活動後才開始參加：建立前的 300 流水不補計，建立後累計 299＋1＝300 才達標。
    expected_result_spec_reference:
