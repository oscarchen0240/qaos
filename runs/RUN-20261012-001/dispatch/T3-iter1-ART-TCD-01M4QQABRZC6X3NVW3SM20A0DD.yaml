    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
    - 【時間窗】本案橫跨兩次 UTC+0 00:00（週六→週日、週日→週一）：請在週六 UTC+0 18:00 前備妥活動與步驟 2，之後在週日 00:05 與週一 00:05 之後各觀察一次
    test_data:
    - name: 活動
      value: 重置方式『每週一』；門檻 100／上限 5／固定 10／稽核 1
    - name: 下注
      value: 玩家 A 150（週六）
    steps:
    - n: 1
      action: 週六建立活動『RP-WEEK-ON』（永久）：活動幣種 USDT；重置方式『每週一』；預設規則門檻 100／上限 5／固定 10／稽核 1；儲存
      expected: 建立成功
    - n: 2
      action: 玩家 A 結算有效流水貢獻 150
      expected: 產生 1 個待開啟紅包 P1，餘量 50
    - n: 3
      action: 週日 UTC+0 00:05（週六→週日，非週一）檢視紅包明細；玩家 A 前台開啟紅包視窗
      expected: 沒有重置：P1 仍為『待開啟』
    - n: 4
      action: 玩家 A 結算有效流水貢獻 40（累計 90）
      expected: 沒有新紅包（餘量 50＋40＝90，證明累計沒有在週六→週日的午夜歸零）
    - n: 5
      action: 週一 UTC+0 00:05（週日→週一）檢視紅包明細；玩家 A 前台開啟紅包視窗
      expected: 週期已重置：P1 狀態『已作廢』、作廢原因『週期重置』；累計進度顯示 0 ／ 100
    - n: 6
      action: 玩家 A 結算有效流水貢獻 100
      expected: 累計從 0 開始：產生新紅包，『週期累計』顯示 100
    - n: 7
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 重置方式『每週一』的線上活動只在週日→週一的 UTC+0 00:00 重置：週六→週日午夜累計與待開啟紅包保留；週一 00:00 之後累計歸零、待開啟紅包作廢（週期重置）。
