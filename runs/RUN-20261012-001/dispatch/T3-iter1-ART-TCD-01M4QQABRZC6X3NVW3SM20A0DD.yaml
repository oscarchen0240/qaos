    description: 領取紅包經『確認領取獎勵』視窗：［取消］不領取、［確認領取］才入帳；核心貨幣入錢包、交易紀錄『紅包』正值、稽核明細『紅包』
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
