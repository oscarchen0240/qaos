    - n: 6
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 前台紅包視窗：有待開啟紅包時累計進度顯示滿格『1,000 ／ 1,000』並標示『已達有效流水門檻』，本期已獲得 1 ／ 5，顯示活動名稱與活動說明、不顯示規則名稱；領完後改顯示『84 ／ 1,000』與尚差
