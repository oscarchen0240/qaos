  - draft_id: TC-DRAFT-01M4QQ9S51E6EX9SGEKP3QXTWS
    title: 以注單結算時點計入累計：已下注未結算不計入，結算後才計入並使用結算當下的匯率換算
    description: 以注單結算時點計入累計：已下注未結算不計入，結算後才計入並使用結算當下的匯率換算
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
