  - draft_id: TC-DRAFT-01M4QQ9S50DW3A4AX4DWWA4EKE
    supersedes_testcase:
      testcase_id: TC-REDPACKET-065
      version: 1
    title: 機台玩家按結算鍵且尚有待開啟紅包：先跳出可取消的確認視窗；［返回開啟紅包］關閉視窗且不送出交易；紅包領完後再結算不再跳窗
    description: 機台玩家按結算鍵且尚有待開啟紅包：先跳出可取消的確認視窗；［返回開啟紅包］關閉視窗且不送出交易；紅包領完後再結算不再跳窗
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
    - REQ-REDPACKET-027
    - REQ-REDPACKET-036
    acceptance_criteria_ids:
    - AC-REDPACKET-0273
    - AC-REDPACKET-0275
    - AC-REDPACKET-0278
    - AC-REDPACKET-0365
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.2'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 【環境前提】機台目前為過渡期（暫無印表機，SPEC-ARCADE-001 出金段 2026-09-03）：按結算鍵後由前台自行完成整筆出金，扣分時點為前台回報完成、平台扣分成功當下；本案以此流程執行。若環境已改為印表機流程，扣分時點改為收據送入列印佇列之後，本案斷言以『扣分成功』為準，步驟不變
    - 【自足佈置】(1) 建立機台場館紅包活動『RP-PROMPT』（活動時間『永久』）：重置方式每日、預設規則門檻 100／上限 5／固定 20／稽核 0；儲存。(2) 機台帳號 M1（自行從環境中選定，本週期無注單）在前台遊戲畫面結算有效流水貢獻
      100，不開啟紅包。(3) 到後台紅包明細確認 M1 恰有 1 筆『待開啟』紅包；M1 此時分數餘額大於 0（剛下注過的餘額），記下為 B0
    - 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    test_data:
    - name: 活動規則
      value: 門檻 100 / 上限 5 / 固定 20 / 稽核 0
    steps:
    - n: 1
      action: 在 M1 前台打開遊戲首頁錢包彈窗，按『結算』鍵
      expected: 機台畫面先跳出確認視窗『尚有紅包未開啟，交易完成後將作廢』，視窗有［返回開啟紅包］與［繼續結算］兩個選項；此時尚未送出出金交易（後台『各式報表 > 交易紀錄查詢』機台視角以 M1、類型『機台出金』查詢，沒有新的出金交易；M1
        分數仍為 B0）
    - n: 2
      action: 點［返回開啟紅包］
      expected: 視窗關閉、不送出交易；後台仍沒有新的『機台出金』交易；紅包仍為『待開啟』且可領取；M1 分數仍為 B0
    - n: 3
      action: M1 依領取流程領取該紅包
      expected: M1 分數 B0＋20；紅包轉為已入帳；已無待開啟紅包
    - n: 4
      action: 在 M1 前台再打開錢包彈窗，按『結算』鍵
      expected: 不跳出『尚有紅包未開啟』確認視窗，出金交易照常送出（依過渡期流程完成）；後台交易紀錄機台視角出現 1 筆 M1 的『機台出金』
    - n: 5
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 尚有待開啟紅包時，玩家按結算鍵會先看到可取消的確認視窗『尚有紅包未開啟，交易完成後將作廢』，此時尚未送出出金；選［返回開啟紅包］關閉視窗、不送出交易，紅包仍待開啟可領取、分數不變；紅包領完（沒有待開啟紅包）後再按結算鍵，不跳出確認視窗，交易照常送出。
    expected_result_spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.2'
      location: §前台呈現說明（第 210 行）
      quote: ［返回開啟紅包］關閉視窗、不送出交易；［繼續結算］送出交易。店員洗分時同一視窗由店員確認
    decision_refs:
