        spec_id: SPEC-REDPACKET-001
        spec_version: '0.2'
        content_hash: 75afb8365acd507227a69c28bcb44390f3bffbfd7df71ef308461017a161978b
        location: §業務規則與驗證（第 407 行）
    source_refs:
    - type: spec
      spec_id: SPEC-REDPACKET-001
