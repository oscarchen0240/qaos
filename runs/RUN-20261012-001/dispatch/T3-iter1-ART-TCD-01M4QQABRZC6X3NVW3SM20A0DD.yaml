    - 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    - 【環境註記，手動取消入口待確認】依 PM／RD 確認的入口執行：SPEC-TXLOG-001@0.1 載明『各式報表 > 交易紀錄查詢』機台視角的明細面板提供『手動取消』（僅 Admin、對『待確認』交易、二次確認後標為『已取消』、分數不異動）；但
      CLR-CASHFLOW-004（依 RD 實際畫面）稱該頁沒有任何手動取消功能。Oscar 2026-10-12 決定以 CLR-REDPACKET-055 為準（待確認出金可由管理員手動取消）並另開單請 PM／RD 確認操作入口（QA
