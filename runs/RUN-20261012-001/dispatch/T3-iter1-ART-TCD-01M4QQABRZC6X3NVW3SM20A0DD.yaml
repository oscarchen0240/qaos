  - draft_id: TC-DRAFT-01M4QQ9S512D1XQFTWP1B61V3R
    title: 機台場館活動期間調早日結時間：新重置時點尚未經過者本週期延至該時點結束；已經過者視同到達重置點、立即重置（累計歸零、待開啟紅包作廢『週期重置』）
    description: 機台場館活動期間調早日結時間：新重置時點尚未經過者本週期延至該時點結束；已經過者視同到達重置點、立即重置（累計歸零、待開啟紅包作廢『週期重置』）
