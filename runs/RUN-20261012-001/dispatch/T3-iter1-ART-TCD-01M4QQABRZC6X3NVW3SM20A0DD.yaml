      expected: 累計 1,000：產生第 7 個紅包（餘量 999＋1）
    - n: 10
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 產生達上限的第 5 個紅包時，超出門檻的餘數 84 保留，之後結算的注單（500）不再計入；升級至上限 8 的等級規則後自保留的 84 續計，916 結算後恰好產生第 6 個紅包；之後 999 不產生、再加
