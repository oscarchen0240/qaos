  - draft_id: TC-DRAFT-01M4QQ9S51TP5R578FY5XB2CBD
    title: 機台場館活動期間調晚日結時間：本週期一律延至原結束點之後的第一個新重置時點，不立即重置、不產生短週期、不倒退重來
    description: 機台場館活動期間調晚日結時間：本週期一律延至原結束點之後的第一個新重置時點，不立即重置、不產生短週期、不倒退重來
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
    - REQ-REDPACKET-011
    acceptance_criteria_ids:
    - AC-REDPACKET-0116
    - AC-REDPACKET-0117
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.2'
    test_level: integration
    test_types:
    - boundary
    - functional
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 管理員或站長可於『後台管理員系統 > 站台列表』找到該機台站台，點『編輯』開啟 Modal，修改『日結時間』欄（UTC+0）後點『儲存變更』（欄位路徑依站台列表 spec）
    - 以下『日結時間』皆為 UTC+0；本案每個 Run 的起始條件依『現在時間』而定，請在符合條件的時段執行（各 Run 彼此獨立，可在不同時段分次執行）；每次調整日結時間都會立即影響該場館的日結報表營業日與紅包重置週期，請在專用測試場館操作
    - 機台帳號 M1（自行從環境中選定）；店員可對 M1 開分，使 M1 分數大於 0
    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 名詞：本週期起點 P＝最近一次到達（舊）日結時間 C0 的時刻；原結束點 E＝P＋1 天；新日結時間 C1。判定（第 383 行）：調晚時本週期一律延至 E 之後的第一個 C1 結束（不立即重置）
    test_data:
    - name: Run C（新時點今天已過）
      value: C0＝現在－6 小時、C1＝現在－4 小時 → 結束於 E 之後第一個 C1＝現在＋20 小時
    - name: Run D（新時點今天未到）
      value: C0＝現在－1 小時、C1＝現在＋1 小時 → 結束於 E 之後第一個 C1＝現在＋25 小時（不是今天的 C1）
    - name: 活動
      value: 門檻 300／上限 5／固定 20／稽核 0；每日重置
    steps:
    - n: 1
      action: 【Run C 準備】於站台列表把日結時間設為 C0＝現在－6 小時並儲存；建立機台場館紅包活動『RP-ADJ-LATE』（永久、每日重置、預設規則門檻 300／上限 5／固定 20／稽核 0）；M1 結算有效流水貢獻
        350
      expected: 產生 1 個待開啟紅包 P1，餘量 50
    - n: 2
      action: 【Run C 調整】於站台列表把日結時間改為 C1＝現在－4 小時並儲存（調晚；C1 今天已過）
      expected: 儲存成功
    - n: 3
      action: 檢視後台紅包明細，並在 M1 前台開啟紅包視窗，檢視『重置時間』
      expected: 沒有立即重置、沒有短週期：P1 仍為『待開啟』；『重置時間』顯示約 20 小時後（E 之後第一個 C1）
    - n: 4
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額；並把日結時間改回環境原值
      expected: 已取消排程
    - n: 5
      action: 【Run D 準備】於站台列表把日結時間設為 C0＝現在－1 小時並儲存；建立機台場館紅包活動『RP-ADJ-LATE-D』（同上設定）；M1 結算有效流水貢獻 350
      expected: 產生 1 個待開啟紅包 P1，餘量 50
    - n: 6
      action: 【Run D 調整】於站台列表把日結時間改為 C1＝現在＋1 小時並儲存（調晚；今天的 C1 還沒到）
      expected: 儲存成功
    - n: 7
      action: 檢視後台紅包明細，並在 M1 前台開啟紅包視窗，檢視『重置時間』
      expected: 沒有重置：P1 仍為『待開啟』；『重置時間』顯示約 25 小時後（明天的 C1），不是 1 小時後的今天 C1
    - n: 8
      action: 等到今天的 C1 時刻（現在＋1 小時）之後再檢視紅包明細與紅包視窗
      expected: 不倒退重來：仍沒有重置，P1 仍為『待開啟』
    - n: 9
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額；並把日結時間改回環境原值
      expected: 已取消排程
    expected_result: 調晚日結時間時，本週期一律延至原結束點之後的第一個新重置時點才結束：Run C 延至約 20 小時後、Run D 延至約 25 小時後（不是今天尚未到的 C1），過程中不立即重置、不產生短週期，到今天的
      C1 時刻也不重置。
    expected_result_spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.2'
      location: §業務規則與驗證（第 383 行）
      quote: 週期只往前、不倒退：調早時，本週期起點之後已經過新的重置時點者，視同到達重置點、立即重置，尚未經過者延至該重置時點結束；調晚時，本週期一律延至原結束點之後的第一個新重置時點結束（不立即重置、不產生短週期）。已重置過的週期不重來
    decision_refs:
    - requirement_id: REQ-REDPACKET-011
      question_id: Q02
      basis_ref:
