  - draft_id: TC-DRAFT-01M4QQ9S52E089Y7YXRZ38XA0Y
    title: 線上站台紅包功能的管轄範圍決策表：管理員（含子站台）× 站長（僅自身站台，不含子站台）× 自身站台／子站台
    description: 線上站台紅包功能的管轄範圍決策表：管理員（含子站台）× 站長（僅自身站台，不含子站台）× 自身站台／子站台
