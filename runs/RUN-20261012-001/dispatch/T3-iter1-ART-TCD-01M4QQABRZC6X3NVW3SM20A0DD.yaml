    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】可固定（mock）系統匯率並在測試中途改值；相關幣種（如 EUR）的錢包已在鏈上錢包管理開啟；匯率需可固定到 5～6 位小數（本案用 1.50001、1.49999、1.499999）
    test_data:
    - name: 活動
      value: 門檻 1000／上限 5／固定 10／稽核 1；活動幣種 USDT、EUR
    - name: 步驟 2
      value: EUR 有效流水貢獻 666.66，匯率 1.50001 → 999.99667 → 1,000.00
    - name: 步驟 3
      value: EUR 666.66，匯率 1.49999 → 999.98333 → 999.98
    - name: 步驟 4
      value: USDT 0.02 → 累計 1,000.00
    - name: 步驟 5
      value: EUR 666.67，匯率 1.499999 → 1,000.00433 → 1,000.00
    steps:
    - n: 1
      action: 建立活動『RP-ROUND』（活動時間『永久』）：活動幣種 USDT、EUR；預設規則門檻 1000／上限 5／固定 10／稽核 1；每日重置；儲存
      expected: 建立成功
    - n: 2
      action: 把 EUR→USDT 匯率固定為 1.50001；玩家 A 結算 EUR 有效流水貢獻 666.66（100% 遊戲）
      expected: 換算 666.66×1.50001＝999.99667，四捨五入為 1,000.00 並以此值判斷達標：產生 1 個紅包 P1，紅包明細『週期累計』顯示 1,000（若不四捨五入，999.99667 未達門檻，不會產生）
    - n: 3
      action: 把匯率固定為 1.49999；玩家 A 結算 EUR 有效流水貢獻 666.66
      expected: 換算 666.66×1.49999＝999.98333，四捨五入為 999.98，未達門檻，沒有新紅包（仍 1 個）
    - n: 4
      action: 玩家 A 結算 USDT 有效流水貢獻 0.02
      expected: 累計 999.98＋0.02＝1,000.00 達標：產生第 2 個紅包 P2，『週期累計』顯示 2,000
    - n: 5
      action: 把匯率固定為 1.499999；玩家 A 結算 EUR 有效流水貢獻 666.67
      expected: 換算 666.67×1.499999＝1,000.00433，四捨五入為 1,000.00，剛好達門檻：產生第 3 個紅包 P3，『週期累計』顯示 3,000（不是 3,000.004 之類的未四捨五入值）
    - n: 6
      action: 進入紅包明細，逐筆檢視 P1～P3 的『週期累計』
      expected: 依序為 1,000、2,000、3,000
    - n: 7
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 非核心貨幣注單換算後四捨五入至小數 2 位再計入累計，顯示與達標判斷都用此值：999.99667 → 1,000.00 達標、999.98333 → 999.98 未達標、1,000.00433 → 1,000.00
      達標，紅包明細週期累計為四捨五入後的 1,000／2,000／3,000。
    expected_result_spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.2'
      location: §業務規則與驗證（第 379 行）
      quote: 非核心貨幣注單的有效流水貢獻，於注單結算當下依系統匯率換算為核心貨幣，四捨五入至小數 2 位後計入累計；顯示與達標判斷皆用此值；換算後不因匯率變動重算
