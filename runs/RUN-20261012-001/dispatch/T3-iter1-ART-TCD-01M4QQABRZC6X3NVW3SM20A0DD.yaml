    preconditions:
    - 以管理員登入後台，站台切換下拉選單選到線上站台（核心貨幣 USDT），負責佈置活動；另備該站台的『財務』與『站長』角色後台帳號各一
    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
    test_data:
    - name: 活動
      value: 門檻 100／上限 5／固定 10／稽核 1；永久
    - name: 下注
      value: 玩家 A 100
    steps:
    - n: 1
      action: 以管理員建立活動『RP-ROLE-F』（永久）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 10／稽核 1；每日重置；儲存；玩家 A 結算有效流水貢獻 100
      expected: 產生 1 個待開啟紅包，活動進行中
    - n: 2
      action: 改以『財務』帳號登入同一線上站台，進入『優惠活動管理 > 活動排程 > 紅包活動』，點活動『RP-ROLE-F』的名稱
      expected: 可進入紅包明細並檢視紅包資料
    - n: 3
      action: 在紅包明細點右上角『匯出 CSV』
      expected: 可匯出（下載成功，含該紅包）
    - n: 4
      action: 回活動排程列表，對『RP-ROLE-F』點『取消排程』，於確認視窗點『確認取消』
      expected: 財務可取消排程；活動狀態『已取消』
    - n: 5
      action: 改以管理員建立活動『RP-ROLE-S』（永久，設定同上）並由玩家 A 再結算有效流水貢獻 100
      expected: 產生 1 個待開啟紅包，活動進行中
    - n: 6
      action: 改以『站長』帳號登入，進入『活動排程 > 紅包活動』，點活動『RP-ROLE-S』的名稱，匯出 CSV
      expected: 站長可進入紅包明細並匯出 CSV
    - n: 7
      action: 站長對『RP-ROLE-S』點『取消排程』，於確認視窗點『確認取消』
      expected: 站長可取消排程；活動狀態『已取消』
    expected_result: 財務與站長在線上站台皆可對活動取消排程、檢視紅包明細並匯出 CSV，與新增活動同權限。
