    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 場館內一台機台帳號 M1，本週期無注單計入累計；需兩位現場人員分飾玩家甲、乙（同一台機台，M1 帳號登入後不換帳號）；領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    test_data:
    - name: 下注
      value: 甲 250；乙 100
    steps:
    - n: 1
      action: 建立機台場館紅包活動『RP-SHARED』（活動時間『永久』）：每日重置；預設規則門檻 300／上限 5／固定 20／稽核 0；儲存
      expected: 建立成功
    - n: 2
      action: 玩家甲在 M1 玩，結算有效流水貢獻 250，之後離開座位（不洗分、不出金）；檢視機台畫面右側紅包圖示
      expected: 尚無紅包（250 < 300）；紅包圖示為暗
    - n: 3
      action: 玩家乙坐上 M1（機台帳號不變），結算有效流水貢獻 100（兩人合計 350）
      expected: 累計達門檻：M1 畫面的紅包圖示亮起；不自動彈出紅包視窗
    - n: 4
      action: 玩家乙點擊亮起的紅包圖示開啟紅包視窗，點『領取獎勵（1）』，於確認領取視窗點［確認領取］
      expected: 紅包視窗顯示金額 20；確認後 M1 的分數即時增加 20，紅包轉為已入帳
    - n: 5
      action: 到後台紅包明細檢視
      expected: 共 1 筆，會員編號欄為 M1 的機台帳號（不是某位玩家），狀態『已入帳』
    - n: 6
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 甲、乙兩位玩家在同一台機台的流水合計達門檻，產生 1 個屬於機台帳號 M1 的紅包；達標時 M1 的紅包圖示亮起、不自動彈出視窗；由當下在台前的玩家乙點圖示經領取流程取得，M1 分數即時 +20。
    expected_result_spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.2'
      location: §線上與機台的差異（第 31 行）
      quote: 累計是整台機台的流水，達標當下坐在台前的人開啟並取得
