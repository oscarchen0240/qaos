    title: 會員升級：累計與已產生數保留、不觸發產生、以新門檻判斷、既有紅包維持原規則；保留進度超過新門檻時一筆結算循環產生多個紅包
    description: 會員升級：累計與已產生數保留、不觸發產生、以新門檻判斷、既有紅包維持原規則；保留進度超過新門檻時一筆結算循環產生多個紅包
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
    - REQ-REDPACKET-006
    acceptance_criteria_ids:
    - AC-REDPACKET-0061
    - AC-REDPACKET-0062
    - AC-REDPACKET-0064
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.2'
    test_level: integration
    test_types:
    - functional
    - negative
    design_techniques:
    - state_transition
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 【環境前提，spec 未定義】需有可立即改變指定測試會員 VIP 等級序號的辦法（6.2 僅定義自動升降的評估週期；變動結果可於『各式報表 > 會員等級異動紀錄』核對），由環境負責人提供；下文『會員升級／降級』均指此辦法
    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 選定一名既有線上會員（會員 B，目前 VIP 等級序號 b，未被任何等級規則勾選），及另一個序號 s（s ≠ b）作為升級目標；本週期無注單計入累計
    - 另選定一名不同的既有線上會員（會員 C，目前 VIP 等級序號 c，未被任何等級規則勾選），及第三個序號 t（t ≠ c、t ≠ s）作為升級目標；本週期無注單計入累計
    - 記下會員 B、C 目前錢包 USDT 餘額與稽核明細最新一筆的『所需有效投注額』變動
    test_data:
    - name: 預設規則
      value: 1000/5/10/稽核1
    - name: 等級規則1（序號 s）
      value: 800/8/30/稽核2
    - name: 等級規則2（序號 t）
      value: 400/8/20/稽核1
    - name: 會員 B 下注
      value: 1200 → 升級 → 700
    - name: 會員 C 下注
      value: 900 → 升級 → 10 → 289 → 1
    steps:
    - n: 1
      action: 建立活動『RP-UPG』（活動時間『永久』）：每日重置；預設規則開啟（門檻 1000／上限 5／固定 10／稽核 1）；等級規則 1 勾選序號 s（門檻 800／上限 8／固定 30／稽核 2）；等級規則 2 勾選序號
        t（門檻 400／上限 8／固定 20／稽核 1）；儲存
      expected: 建立成功
    - n: 2
      action: 會員 B 結算有效流水貢獻 1200（USDT、100% 遊戲）
      expected: 紅包明細新增 1 筆會員 B 的紅包 P1：金額 10、狀態待開啟、週期累計 1,200
    - n: 3
      action: 把會員 B 升級至序號 s
      expected: 等級異動生效
    - n: 4
      action: 檢視紅包明細會員 B 的紅包筆數
      expected: 仍只有 P1 一筆（變動當下不觸發產生）
    - n: 5
      action: 會員 B 再結算 700（累計 1,900）
      expected: 新增 1 筆 P2：金額 30、週期累計 1,900（餘量 200 保留，200＋700＝900 ≥ 新門檻 800；若累計被清空，700 < 800 就不會產生）
    - n: 6
      action: 會員 B 於前台依領取流程領取兩次（每次：點紅包圖示 → 紅包視窗『領取獎勵（N）』→ 確認領取視窗點［確認領取］；先後順序不判定）
      expected: 兩次領取後錢包 USDT 合計 +40（一次 +10、一次 +30）
    - n: 7
      action: 至『各式報表 > 稽核明細』篩選會員 B、檢視兩筆紅包稽核
      expected: P1 所需有效投注額增加 10（10×1，維持產生當下的預設規則稽核倍數）；P2 增加 60（30×2，等級規則 1 的稽核倍數）
    - n: 8
      action: 【保留進度已超過新門檻】會員 C 結算有效流水貢獻 900（USDT、100% 遊戲）
      expected: 累計 900 < 預設規則門檻 1000，紅包明細沒有會員 C 的紅包
    - n: 9
      action: 把會員 C 升級至序號 t
      expected: 等級異動生效
    - n: 10
      action: 檢視紅包明細會員 C 的紅包筆數
      expected: 仍沒有會員 C 的紅包（變動當下不觸發產生，即使保留進度 900 已超過新門檻 400）
    - n: 11
      action: 會員 C 再結算 10（累計 910）
      expected: 以新門檻 400 判斷、循環產生：新增 2 個會員 C 的紅包（各 20，適用規則為等級規則 2），餘量 110 續計（910－2×400）
    - n: 12
      action: 會員 C 再結算 289（累計 1,199，餘量 399）
      expected: 沒有新增紅包（仍 2 個）
    - n: 13
      action: 會員 C 再結算 1（累計 1,200，餘量 400）
      expected: 新增第 3 個紅包（金額 20），週期累計 1,200；確認餘量確實是 110（289＋1＋110＝400 才達標）
    - n: 14
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 升級後：本週期累計（餘量 200）與已產生數（1）保留；升級當下不產生新紅包；下一筆 700 以新門檻 800 判斷產生 1 個 30 元紅包（週期累計 1,900）；升級前產生的 P1 領取時金額與稽核倍數仍依預設規則（入帳
      10、稽核 +10），P2 依等級規則 1（入帳 30、稽核 +60）。保留進度已超過新門檻時（會員 C：進度 900、新門檻 400），升級當下不產生，下一筆結算（+10＝910）一次循環產生 2 個紅包並續計 110，再累計 290
      才產生第 3 個。
