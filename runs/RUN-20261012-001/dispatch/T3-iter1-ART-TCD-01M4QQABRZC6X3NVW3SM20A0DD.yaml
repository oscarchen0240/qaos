        1）；每日重置；儲存
      expected: 建立成功
    - n: 2
      action: 玩家 A 結算有效流水貢獻 1084
      expected: 產生 1 個待開啟紅包
    - n: 3
      action: 玩家 A 於前台點右側亮起的紅包圖示，開啟紅包視窗
      expected: 顯示活動名稱『RP-ENTRY』與活動說明『RP-ENTRY 活動說明』；累計進度顯示滿格（1,000 ／ 1,000）並標示『已達有效流水門檻』；本期已獲得 1 ／ 5；領取按鈕『領取獎勵（1）』；不顯示規則名稱（如『預設規則』）
    - n: 4
      action: 玩家 A 依領取流程領取該紅包（已無其他待開啟紅包），再開啟紅包視窗
      expected: 累計進度改顯示 84 ／ 1,000（距下一個紅包已累計的 84，不是累計總額 1,084）並顯示尚差 916；本期已獲得仍為 1 ／ 5；紅包金額顯示『最高 ＄10』
    - n: 5
