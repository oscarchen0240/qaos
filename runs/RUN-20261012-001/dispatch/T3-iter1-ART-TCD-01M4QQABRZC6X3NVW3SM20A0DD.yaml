    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 選定兩名既有線上會員：會員 C（目前 VIP 等級序號 c，未被任何等級規則勾選）；會員 B（目前序號 s，被等級規則 1 勾選）；另一個目標序號 c2（c2 ≠ s，且未被任何等級規則勾選，作為 B 降級的目的地）；兩人本週期無注單計入累計
    test_data:
