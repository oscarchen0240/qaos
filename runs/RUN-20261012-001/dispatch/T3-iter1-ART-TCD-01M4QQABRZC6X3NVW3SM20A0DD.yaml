    title: 幣種換算四捨五入至小數 2 位後計入累計：以四捨五入後的值判斷達標，週期累計顯示該值（邊界取 999.98／999.99667→1,000.00／1,000.0043→1,000.00）
    description: 幣種換算四捨五入至小數 2 位後計入累計：以四捨五入後的值判斷達標，週期累計顯示該值（邊界取 999.98／999.99667→1,000.00／1,000.0043→1,000.00）
    product: ba-admin
