  - draft_id: TC-DRAFT-01M4QQ9S53A6D7BP39J6S4C9MF
    title: 線上前台等級不參加：沒有待開啟紅包時不顯示活動；仍有待開啟紅包時照常顯示、進度處顯示『目前等級不參加』並可領取
    description: 線上前台等級不參加：沒有待開啟紅包時不顯示活動；仍有待開啟紅包時照常顯示、進度處顯示『目前等級不參加』並可領取
