      expected: 建立成功
    - n: 2
      action: 玩家 A 結算有效流水貢獻 10×(P＋5)
      expected: 產生 P＋5 個紅包（超過一頁）
    - n: 3
      action: 進入紅包明細，確認列表分成至少 2 頁、總筆數 N＝P＋5；記下列表底部的紅包金額總計（僅計已入帳，此時為 0）
      expected: 至少 2 頁
    - n: 4
      action: 點右上角『匯出 CSV』
      expected: 下載 CSV
    - n: 5
      action: 開啟 CSV，數紅包資料列（排除標題列）並與列表第 1 頁與最後一頁的紅包編號比對；檢視 CSV 最後一列
      expected: 紅包資料列數＝N 且全是紅包資料（沒有『總計』列，標題列之外不多出一列）；包含第 1 頁與最後一頁的紅包（不是只有目前頁）
    - n: 6
      action: 對列表加上篩選（例如狀態＝待開啟）使結果仍超過一頁，再匯出一次
      expected: CSV 紅包資料列數＝篩選後的總筆數，同樣不含總計列
    expected_result: 匯出的 CSV 涵蓋整個查詢結果（所有頁，紅包資料列數＝總筆數 N，篩選後亦同），且不含總計列（資料列數剛好等於 N，沒有多出的總計列）。
