      expected: 『領取獎勵』按鈕停用並顯示『交易處理中』
    - n: 3
      action: 嘗試點擊領取 P1
      expected: 無法領取；M1 分數不變
    - n: 4
      action: 讓洗分交易完成
      expected: 洗分完成；後台紅包明細 P1 狀態『已作廢』
    - n: 5
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 洗分請求送出後、交易完成前，領取按鈕停用並顯示『交易處理中』，紅包無法領取；洗分完成後 P1 依規則作廢。
