  - draft_id: TC-DRAFT-01M4QQ9S53477X8NZSQVVZ1P2F
    title: 線上前台紅包圖示：無待開啟時暗、達標亮起且不自動彈窗、禮物圖示亮紅點、領完後轉暗
    description: 線上前台紅包圖示：無待開啟時暗、達標亮起且不自動彈窗、禮物圖示亮紅點、領完後轉暗
    product: ba-admin
    functional_area: REDPACKET
