    execution_mode: manual
    preconditions:
    - 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
      遊戲』
    - 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
    - 【環境前提】EUR 錢包已開啟；選定一名既有線上會員（玩家 A），以 EUR 為主下注；記下玩家 A 目前 USDT 與 EUR 錢包餘額
    test_data:
    - name: 稽核倍數／固定金額
      value: 2 / 18
    - name: 下注
      value: EUR 有效投注 2000（100%遊戲）
    steps:
    - n: 1
      action: 建立活動『RP-CREDIT』（活動時間『永久』）：活動幣種 USDT、EUR；預設規則門檻 1000／上限 1／固定金額 18／稽核倍數 2；每日重置；儲存
      expected: 建立成功（上限 1 確保只產生 1 個紅包）
    - n: 2
      action: 玩家 A 於前台以 EUR 結算足夠的有效流水貢獻（例如 EUR 有效投注 2000，100% 遊戲；EUR 對 USDT 匯率約為 1，2000 EUR 應遠超過門檻 1000 USDT，若環境匯率特殊請加大投注額）
      expected: 產生 1 個待開啟紅包，紅包明細金額 18
    - n: 3
      action: 玩家 A 於前台點右側亮起的紅包圖示開啟紅包視窗，點『領取獎勵（1）』
      expected: 跳出『確認領取獎勵』視窗：顯示活動名稱、紅包金額 18、稽核倍數 x2 與『確定要領取此獎勵嗎？』，有［取消］與［確認領取］兩個按鈕
    - n: 4
      action: 點［取消］
      expected: 確認視窗關閉、不領取；玩家 A 的 USDT 與 EUR 錢包餘額不變；紅包明細該紅包仍為『待開啟』
    - n: 5
      action: 再點『領取獎勵（1）』，於確認視窗點［確認領取］
      expected: 按鈕顯示『處理中…』，完成後紅包入帳
    - n: 6
      action: 檢視玩家 A 錢包
      expected: USDT 餘額 +18；EUR 餘額不變
    - n: 7
      action: 至『各式報表 > 交易紀錄查詢』，篩選會員編號為玩家 A、交易類型『紅包』
      expected: 交易類型選項中有『紅包』；出現 1 筆：交易類型『紅包』、幣別 USDT、變動金額 +18（正值）
    - n: 8
      action: 至『各式報表 > 稽核明細』，篩選會員編號為玩家 A、類型『紅包』
      expected: 類型選項中有『紅包』；出現 1 筆：類型『紅包』、金額 18、所需有效投注額增加 36（18×2）
    - n: 9
      action: 至紅包明細檢視該紅包
      expected: 狀態『已入帳』
    expected_result: 領取紅包須先經『確認領取獎勵』視窗：按［取消］不領取（紅包仍待開啟、錢包不變），按［確認領取］才送出並入帳；入帳後 USDT 錢包 +18（以核心貨幣入帳，EUR 玩家亦同）；交易紀錄新增『紅包 +18
      USDT』；稽核明細新增類型『紅包』、所需有效投注額 +36（紅包金額×稽核倍數 2）；紅包明細狀態轉『已入帳』。
