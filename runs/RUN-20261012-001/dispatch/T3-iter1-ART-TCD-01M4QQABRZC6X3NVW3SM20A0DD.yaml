  - draft_id: TC-DRAFT-01M4QQ9S51F05BSHMAYANABV4B
    supersedes_testcase:
      testcase_id: TC-REDPACKET-090
      version: 1
    title: 機台待確認出金被新出金取代：舊筆轉『已取消』，新出金仍進行中時紅包繼續鎖定；新出金完成後作廢
    description: 機台待確認出金被新出金取代：舊筆轉『已取消』，新出金仍進行中時紅包繼續鎖定；新出金完成後作廢
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
    - REQ-REDPACKET-028
    - REQ-REDPACKET-027
    - REQ-REDPACKET-036
    acceptance_criteria_ids:
    - AC-REDPACKET-0286
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.2'
    test_level: integration
    test_types:
    - functional
    - negative
    design_techniques:
    - state_transition
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 【環境前提，spec 未定義，需環境負責人／工程確認可行】過渡期出金由前台依序送 req-cashout、end-cashout，一般操作沒有人工可觀察的『已受理、尚未完成』空窗；本案需要借助測試手段（例如可暫緩送出 end-cashout
      的機台模擬器／代理）讓出金請求停在『待確認』。若環境沒有此手段，本案無法執行，應回報，不要改以別的方式推斷
    - 機台帳號 M1（自行從環境中選定，本週期無注單；分數餘額可在『會員與加盟商 > 會員列表』帳號類型篩「機台」、所屬站台選該場館時，由 M1 的餘額欄查看；結算出金前餘額須大於 0，若為 0 先由店員對 M1 開分補足）
    - 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    - 【環境前提，需環境負責人／工程確認可行】過渡期前台在請求出金到回報完成之間不提供取消（SPEC-ARCADE-001），end-cashout 被壓住時前台可能停在處理中畫面、玩家按不到第二次結算。環境手段須讓前台回到可再按『結算』的狀態（例如代理讓前台的
      end-cashout 逾時失敗，但平台仍保留 PENDING）；或改由模擬器直接送出第二筆 req-cashout，並以此代表『玩家再按一次結算』（取代規則是平台端行為，兩種方式等價）。兩者都做不到時本案無法執行，應回報
    test_data:
    - name: 活動規則
      value: 門檻 100 / 上限 5 / 固定 20 / 稽核 0
    steps:
    - n: 1
      action: 建立機台場館紅包活動『RP-LOCKR』（活動時間『永久』）：每日重置；預設規則門檻 100／上限 5／固定 20／稽核 0；儲存
      expected: 建立成功
    - n: 2
      action: M1 結算有效流水貢獻 100（不領取）
      expected: 紅包明細有 1 筆 M1 的紅包 P1，狀態『待開啟』
    - n: 3
      action: 玩家在 M1 前台按『結算』鍵，於『尚有紅包未開啟，交易完成後將作廢』確認視窗點［繼續結算］，並透過環境手段讓這筆出金（W1）停在已受理、尚未完成
      expected: W1 為『待確認』；M1 前台領取按鈕停用，顯示『交易處理中』
    - n: 4
      action: 依前置條件的環境手段，讓玩家在 M1 前台再按一次『結算』鍵（因 P1 仍待開啟，再次跳出確認視窗，點［繼續結算］），或由模擬器直接送出第二筆 req-cashout，產生新的出金請求 W2，並同樣讓 W2 停在已受理、尚未完成
      expected: 後台『各式報表 > 交易紀錄查詢』（機台視角）：W1 狀態『已取消』（被新出金取代）、W2 狀態『待確認』；M1 分數餘額尚未異動
    - n: 5
      action: 玩家在 M1 前台點紅包圖示開啟紅包視窗，檢視並嘗試領取 P1
      expected: P1 仍不可領取（W2 仍在進行中，取代後新出金送出即再次鎖定）；領取按鈕停用並顯示『交易處理中』；P1 未作廢
    - n: 6
      action: 讓環境手段送出 W2 的完成回報，使 W2 完成
      expected: W2 狀態『已完成』；後台紅包明細 P1 狀態『已作廢』
    - n: 7
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 待確認的出金被新出金取代時，舊筆轉『已取消』；新出金仍在進行中，紅包繼續不可領取（不作廢）；新出金完成後紅包作廢。
    expected_result_spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.2'
      location: §線上與機台的差異（第 43 行）
      quote: 交易取消、未成立或被取代則恢復可開啟
