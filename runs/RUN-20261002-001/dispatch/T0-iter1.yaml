  requirement_id: REQ-SITELIST-023
  question_id: null
  answer_rev: 0
  answer_sha256: 30deea3f7b85dbdbc7e777e243058401d93d8df3223206112c6ee02d562b3af3
  answer: 不論線上或機台類型，站台皆不支援刪除功能，僅能暫停或關閉（停用）。此為對 spec 原文「刪除站台」一節（點擊列表刪除、二次確認、不可復原）的重大修正——該流程實際上不存在於任何站台類型，CLR-SITELIST-007 先前確認的「機台類型不可刪除」應擴大為「所有類型皆不可刪除」。
  resolution: spec_updated
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
  scope: null
  applicability: []
- clarification_id: CLR-SITELIST-009
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-SITELIST-001
