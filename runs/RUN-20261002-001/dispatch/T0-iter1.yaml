  question_id: null
  answer_rev: 0
  answer_sha256: a47566a5140a282a4a8003908a6c8915c6bfe70cc649feae39969775a87d28ae
  answer: 已確認：前端與後端皆拒絕刪除站台，不論線上或機台類型皆同（與 CLR-SITELIST-008 的結論一致，非誤答）。原因是刪除站台會影響站台樹狀結構（子站台歸屬、上下層關係），故刻意不提供刪除功能，僅能暫停／關閉（停用）。spec.md
    v0.4 原文「刪除站台可正常執行」一節與此結論牴觸，屬 spec 需修正的錯誤敘述，非目前產品行為。
  resolution: spec_updated
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
  scope: null
  applicability: []
