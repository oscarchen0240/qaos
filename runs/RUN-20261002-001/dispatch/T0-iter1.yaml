  answer_sha256: 1a554f8da65a66760e82ae813f47be19d0a41bc84d36adc6e9c679a7ca41d0b7
  answer: 以 CLR-SITELIST-008／009 為準：任何站台（不論線上或機台類型、不論是否為子站台）皆不提供刪除操作，前端無刪除入口、後端拒絕刪除請求，只能暫停／關閉（停用）。原因是刪除會影響站台樹狀結構。v0.6 §角色與權限「子站台：刪除」列、§列表欄位「操作｜編輯、刪除」中的刪除、§操作/刪除站台與
    §業務規則/刪除確認，皆為未同步 CLR 定案的錯誤敘述，待修正 spec 正本；在修正前，REQ-SITELIST-022 依本答案判定。
  resolution: requirement_clarified
  basis_hash: 304c29ee5c1dbc7d90e1138bb20ad60d0040530cdaaed23589e6f8a4b8f65727
