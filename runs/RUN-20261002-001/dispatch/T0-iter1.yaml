  answer_sha256: 0fc8d15e137b6eb137c63295f05da0d13d718adc1dd875b5676a9eb31c19a26f
  answer: 採 CLR-SITELIST-008／009：任何站台皆不提供刪除，因此「刪除仍有子站台的站台時子樹如何處理」的情境不會發生，不需定義子樹處理方式；本條僅供追溯。若日後產品方向改為可刪除，須另開 CLR 定義子樹處理。
