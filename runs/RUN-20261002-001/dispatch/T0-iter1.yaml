  answer_sha256: 526a6e109699d3a76f01695362571a18bcf9d5a7ac1399aa39a20ea15b0e2df1
  answer: admin 例外規則為 PM 最終決定，非資料錯誤或臆測：根層站台（無上層站台）建立時，型別可自由選擇（機台或線上），核心貨幣依所選類型連動建立，不受REQ-SITELIST-002子站台強制跟隨規則約束。此為PM已定案且已開發完成上線的產品行為，非待定或實驗性設計。spec.md原文尚未反映此例外，屬spec文件落後於實際已上線行為的已知落差。
  resolution: requirement_clarified
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
  scope: null
  applicability: []
- clarification_id: CLR-SITELIST-011
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  requirement_id: REQ-SITELIST-002
  question_id: null
  answer_rev: 0
  answer_sha256: 20fa3106bee64e2928e539212b7e74eb3b64a6d1a6523fea85ee2c611ad1ab26
  answer: 鏈上錢包管理與站台核心貨幣是兩個完全不同、互不相依的概念。鏈上錢包管理管理的是「此平台整體能使用的幣種有哪些」，啟用/禁用代表該幣種能否出入金，目的是作為平台出問題時的即時止損開關（platform級風險控管，不分站台）。站台的核心貨幣則是站台建立時依站台類型連動決定的設定欄位（例如機台類型連動TWD），屬SITELIST頁面自身的站台設定，跟鏈上錢包管理的啟用狀態無關、不互相依賴。因此AC-SITELIST-0023「不需admin自身的鏈上錢包管理預先啟用該幣別」這句話，本質是在說明這兩個系統彼此獨立、互不閘門——站台核心貨幣的連動建立不需要、也不會去檢查鏈上錢包管理的任何狀態。
  resolution: requirement_clarified
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
  scope: null
  applicability: []
- clarification_id: CLR-SITELIST-012
  status: APPLIED
  kind: spec_question
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  requirement_id: REQ-SITELIST-002
  question_id: null
  answer_rev: 0
  answer_sha256: ff7f4bb8c28db569fd3ae8029b55923358da7c673534ee13bb2a0a910c35c167
  answer: 修正CLR-SITELIST-011：鏈上錢包管理與站台核心貨幣不是「完全無關」，而是「性質不同但有連動關係」。(1)鏈上錢包管理是每個站台各自獨立一份的設定，管理該站台能使用的幣種之啟用/禁用（代表能否出入金），目的是平台/站台出問題時的即時止損開關，此開關可在建立後隨時調整。(2)站台核心貨幣則是站台建立時就依類型決定的corecurrency欄位，不可更改、也不能在後台關閉，屬於站台建立當下就定案的不可變屬性。(3)兩者的連動關係：新站台建立時，核心貨幣連動建立的同時，會自動在該站台自己的鏈上錢包管理啟用對應幣別（例如機台類型建立時TWD會自動連動啟用）；此連動不需要admin自身的鏈上錢包管理預先啟用對應幣別（即不依賴上層/admin的狀態，是該新站台自己獨立產生的初始啟用狀態）。此修正有獨立既有證據佐證：TC-SITELIST-063（ACTIVE，建立時間早於本次CLR-010/011/012的討論）已完整斷言此機制，並非本次對話中臨時產生的說法。
  resolution: requirement_clarified
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
  scope: null
  applicability: []
