  answer_sha256: c1277f1cff0af36324bebf0cc1281eaedf0e43b5f65ad3a507ab3ff4251d0028
  answer: 機台類型站台不提供刪除操作，只能停用（暫停／關閉）；不會出現在確認刪除的流程裡。（原問題「有子站台時如何刪除」對機台類型不再適用，因為機台本來就不能刪除；線上類型站台若帶有子站台時的刪除行為，本次回覆未涵蓋，另開單追蹤）
  resolution: spec_updated
  basis_hash: 63cf9770cb9c1c1a9932c5595983212235c87591dafc926f5a3576418eb1b1bd
