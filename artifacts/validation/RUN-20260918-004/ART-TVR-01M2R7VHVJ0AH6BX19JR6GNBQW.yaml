    explanation: AC-BONUSCCY-008 用『返水或代理佣金等一般紅利』(『等』字) 概括全部六種類型，但 spec 明確警示簽到、首存/次存這兩種類型在『幣別』語意上與返水/代理佣金不同，代表它們未必能安全併入同一等價類，在沒有
