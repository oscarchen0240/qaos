      只涵蓋「是否含逾時結束與日結結算狀態」。Spec：「場次數…為當日結束的場次筆數」；「日結時間到達時強制結束所有進行中的場次」；同一 Draft 的邊界案例（…NNWMBW1F6QTAE852RE）預期 06:00:00 的交易計入新營業日。
