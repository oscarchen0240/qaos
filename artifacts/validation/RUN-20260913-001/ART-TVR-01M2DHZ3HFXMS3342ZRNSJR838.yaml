    explanation: 第一週 08-31～09-06 有兩個營業日（08-31、09-01）落在結算日期 09-02～09-10 之外。「該週內營業日合計」是含這兩天（整週）還是只含結算日期範圍內的 09-02～09-06，Spec
      沒寫；已宣告的 assumption 只涵蓋顯示格式，未涵蓋合計範圍。上一版指出的這一點未處理，expected 的金額部分仍無法判定。
    recommended_change: 補一條 assumption：「結算日期範圍外但同週的營業日是否計入合計，Spec 未定義；本案假設只計結算日期範圍內」，並在 expected 明寫「第一列＝09-02～09-06 合計、第二列＝09-07～09-10
      合計」；或把測試資料改為完整週（09-07～09-13）避開此歧義。
