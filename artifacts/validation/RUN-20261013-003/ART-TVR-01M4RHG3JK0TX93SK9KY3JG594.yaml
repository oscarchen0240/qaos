  - testcase_id: TC-DRAFT-01M4RH8EQZ38N4HRRS8REYN7WZ
    issue_type: unsupported_assumption
    severity: major
    violated_requirement: REQ-CASHFLOW-004
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §狀態碼對照（第 317 行）
      quote: 欄位缺漏、型別錯誤、`currency` 與主站台核心貨幣不符、金額為負
    evidence: 前提自承『spec 沒有定義 req-keyin 是否接受小數金額』，並給出退路：『若被拒…改請環境負責人以測試資料工具…構造相同餘額；仍無法構造…記為受阻』。但這條退路只涵蓋步驟 2 對機台 N 的佈置。步驟 7～9
      的受測請求本身就是小數開分：M 送 req-keyin 100.5，預期 1-OVER LIMIT；送 100.4，預期 0-OK、M 分數 = B0 + 100.4；送 0.1，預期 1-OVER LIMIT。
    explanation: 『req-keyin 接受小數金額』是 spec 未定義的行為，案例自己也承認。走退路時（步驟 2 的小數開分被拒、改用工具佈置 N），平台對步驟 7～9 可能回 6-BAD DATA/FORMAT 或取整，與預期不符，會被誤判成額度判定缺陷。尤其步驟
      8 預期 100.4 回 0-OK，等於隱含斷言『平台接受小數開分』，而這項依賴沒有宣告、也沒有受阻閘門。同批的 TC-DRAFT-…D13ZX（end-cashin 路徑）刻意用整數清點金額、只讓小數出現在剩餘額度，就沒有這個問題；TC-DRAFT-…NKQ6、…BE7E
      的小數開分只用於佈置，也已設受阻退路，都合格。
    recommended_change: 在步驟 7 之前加一道閘門：只有步驟 2 的 req-keyin 399.6 實際回 0-OK 且 N 分數恰為 399.6（等於證明平台接受一位小數的開分），才執行步驟 7～9；若佈置改用工具完成，步驟
      7～9 記為『受阻』，不判定。或者比照 end-cashin 案例，改用整數開分搭配小數剩餘額度（例：剩餘 100.4 時，開分 101 被拒、100 成立、再開 1 被拒）；但這樣會失去『恰等於上限』的檢查點，需在案例中說明取捨。
