    evidence: TC-DRAFT-01M4RH8EQZ5ZZ14VW38J4DKS31 步驟 5 要求『兩個請求都在任一回應到達之前已送出（否則該輪作廢）』，但 test_data 的 bash 範例只在起跑前記一次 date，每個
      curl 只輸出 time_total。TC-DRAFT-01M4RH8EQZ1CJ2ME8WVP0P4TGS 步驟 2 同樣要求『記錄各請求的送出時間與回應時間』，範例卻完全沒有記錄時間。
    explanation: 兩案的斷言只用 spec 定義的結果（恰一筆 0-OK、另一筆 1-OVER LIMIT、合計 = A；order_id 全系統不重複），沒有斷言哪一方勝出，也沒有斷言落敗那筆 end-cashin 的 PENDING
      去向，可執行性與依據都沒有問題。只是『判定重疊』所需的逐請求時間戳，範例沒有提供，執行者得自己補，每輪是否作廢的判斷可能因人而異。
    recommended_change: 不阻擋。範例改成逐請求記錄送出與回應的絕對時間，例如每個 curl 前後各記一次 date +%s.%N，或 curl -w 輸出 %{time_starttransfer}；也可改用 Python
      asyncio 搭配 time.time()。判定式寫明：max(各請求送出時刻) < min(各請求回應時刻)。
