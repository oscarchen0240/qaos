    explanation: 缺陷本身（進行中場次沒有列出、總計列期末餘額 $0.00 未計入任何進行中分數）不受這一點影響：只要場次在 10:31:45 已建立，任何截圖時點的機台分數都大於 0。受影響的只是 expected 裡「＝900」這個具體數值的嚴謹度。
