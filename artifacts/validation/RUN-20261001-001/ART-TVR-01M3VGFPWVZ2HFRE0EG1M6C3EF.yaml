      quote: 日結時間到達時強制結束所有進行中的場次，餘額轉為隔日新場次的期初餘額
    evidence: steps[1].action：「機台 A 有進行中場次、餘額 80（以機台前台顯示的分數為準；佈置方式見 design_rationale 的資料佈置說明）」
    explanation: TC 正式存檔時 design_rationale 會被移除，執行者看不到「資料佈置說明」。前置條件只說機台 A 為「既有機台會員，自行從環境中選定」，既有機台可能已有進行中場次且餘額不是 80，要把進行中場次餘額佈置成
      80 需要先結束現有場次再開分，這段做法只存在於看不到的欄位；期初餘額 80 是步驟 5 的預期值，佈置不出來就無法判定。
    recommended_change: 移除「見 design_rationale」的引用，把佈置方式直接寫進 step 1 或 preconditions，例如：「若機台 A 已有進行中場次，先以出金結束（出金一律清空餘額）；再開分
      80、不投注，確認機台前台分數為 80」。或改為不限定 80：記錄機台前台分數 X（須 > 0），步驟 5 預期期初餘額＝X。
