      location: §背景：場次資訊/場次狀態 L82
      quote: 進行中 / 已結束 / 逾時結束 / 日結結算
    evidence: steps[2].action：「不對機台 A 做任何交易，等待日結時間 06:00 UTC+0 到達」；preconditions 與 steps 都沒有限制 step 1 到 06:00 之間的間隔。對照 Registry
      ACTIVE TC-DAILYREPORT-054 v2（APR-0007 核准）：場館有場次逾時時間（預設 1 小時），在有餘額狀態下超過逾時時間無任何交易與遊玩，場次會變成「逾時結束」
    explanation: 這份 TC 要求在日結前完全不交易，如果 step 1 佈置完成的時間離 06:00 超過場館逾時時間，S1 會先變成「逾時結束」，不會變成「日結結算」；步驟 3、4、5 的預期都會落空，造成誤判。v2 就有這個隱藏風險，v3
      新增「不對機台 A 做任何交易」之後變成明文要求，所以要處理。
    recommended_change: 在 preconditions 加上時間限制：「step 1 佈置完成到日結時間 06:00 的間隔須短於場館場次逾時時間（例如 06:00 前 30 分鐘內佈置；必要時先把逾時時間調長）」，並在步驟
      3 之前加一個檢查點：日結前 S1 仍為「進行中」。
