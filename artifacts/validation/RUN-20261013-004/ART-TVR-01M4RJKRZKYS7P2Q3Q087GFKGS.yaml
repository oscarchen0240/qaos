      location: §列表欄位／收據金額（第 51 行）
      quote: 當日出金總額（印出的收據面額合計；過渡期機台暫無印表機時，為結算結果畫面顯示的出金金額合計）
    evidence: 前提寫「出金為兩階段交易，以扣分完成的那筆紀錄時間為準，若紀錄只有一個時間則取該時間——此為我的推測，需環境負責人確認」。步驟 4 的 expected 無條件斷言「機台 A：D 列收據與未兌現＝基準＋100×（早於
      T0 的出金筆數）；D+1 列＝100×（不早於 T0 的出金筆數）」。步驟 2 是每秒一輪『開分 100 → 出金』，持續到 T0 前後各 30 秒，expected 也自承「日結時刻 T0 ……可能剛好落在某輪的『開分』與『出金』之間」。
    explanation: v0.3 只定義「交易發生」依日結時間歸營業日（第 42、152 行，AC-0071／0072），沒有出金兩階段（請求／扣分完成）的概念，也沒有規定兩階段跨過 T0 時以哪一個時刻歸屬；兩階段金流定義在開發包③，不在本派發包範圍內。本案刻意讓出金在
      T0 前後密集發生，所以一筆出金的兩個階段落在 T0 兩側的機率不低。這時「以扣分完成時間為準」是設計者的推測：報表如果以請求時間歸屬，本案會把一個 spec 未定義的行為判成 FAIL。這屬於「斷言隱含依賴未定事項」，而且以確定斷言呈現，沒有
      assumptions[]。環境負責人無法裁決 spec 語意，「需環境負責人確認」不能解除這個依賴。（其餘部分有依據：開分、洗分是單一交易；D 期末＝D+1 期初兩邊都取 T0 結算時點的分數，與出金歸屬哪一天無關；兩日合計不漏不重也與歸屬規則無關。）
    recommended_change: 比照 RF-13 案的條件判定處理跨 T0 的出金：步驟 3 依機台交易紀錄找出兩階段時間分落 T0 兩側的出金（若紀錄只有單一時間則不會有這種情況）。對這些出金只斷言它的 100 恰好計入 D
      或 D+1 其中一列（不漏不重，兩日收據／未兌現合計＝出金總筆數×100），並記錄實際歸屬哪一列、不作判準；其餘不跨 T0 的出金才逐日斷言。或者在 T0 前後各數秒的窗口內暫停送出出金（開分、洗分照送），讓所有出金不跨越 T0。也可以由主
      session 以 --extra 登記開發包③ 中定義出金歸屬時刻的條文，作為依據。
