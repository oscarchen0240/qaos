  issues:
  - testcase_id: TC-DRAFT-01M4T6NYW6BWYF0W0Y69FZGRVD
    issue_type: invalid_expected_result
    severity: major
    violated_requirement: REQ-TXLOG-028
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §列表欄位／核實狀態（第 76 行）
      quote: 洗分與出金顯示「待核實／已核實／已作廢」，其餘交易類型顯示「—」
    evidence: 步驟 1 在手動取消之前記錄基準：「(b) 以『核實狀態＝待核實』『交易類型＝機台出金』篩選時，結果中是否含 T_X 及該機台帳號的筆數 P0」。步驟 3 執行手動取消，但沒有重新記錄這個基準。步驟 5 的 expected
      卻斷言「『核實狀態＝待核實』的結果中沒有 T_X，該機台帳號的筆數 P2 等於 P0」。
    explanation: P0 是在取消之前量的，P2 是在「取消＋遲到重送」之後量的，兩者的差同時混入了取消本身的影響。spec 沒有定義待確認或已取消的出金的核實狀態：第 76 行字面上是「出金顯示待核實／已核實／已作廢」，依此讀法，待確認的
      X 與取消後的 X 都會顯示待核實，T_X 就會出現在結果中，與「沒有 T_X」直接牴觸；如果系統改為把已取消的出金顯示為不適用，P2 又會等於 P0－1，與「P2＝P0」不符。不論是哪一種，正確實作都可能被判 FAIL，而本案要驗證的「遲到回報沒有新增紀錄」反而沒被隔離出來。這是斷言建立在未定義事項上。
    recommended_change: 在步驟 3 取消成功之後，重新記錄基準：T_X 是否在待核實結果中，以及該機台帳號的待核實筆數 P1（已完成出金數 C1 也可一併重記）。步驟 5 改為斷言「T_X 是否在待核實結果中，與取消後（步驟
      3）相同；P2＝P1；C2＝C1」，只衡量遲到重送帶來的變化，不斷言已取消出金的核實狀態。
  - testcase_id: TC-DRAFT-01M4T6NYW6BWYF0W0Y69FZGRVD
    issue_type: invalid_expected_result
    severity: major
    violated_requirement: REQ-TXLOG-028
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 93 行）
      quote: 取消後平台會告知機台這筆交易不存在，機台就會停止重試
    evidence: 前提：X 與 V「屬於兩個不同的測試機台帳號」。步驟 4：「用步驟 2 驗證過的同一份 end-cashout 範本，只把交易編號換成 T_X，其餘逐字相同，對平台連續送出 3 次完成回報」；回應「只記錄、不判定」；只有格式錯誤、路由不存在或憑證無效才記無效。
    explanation: V 的範本帶的是 V 那台機台的身分（機台帳號、機台憑證），以及 V 的金額等欄位。只把交易編號換成 T_X，送出的就不是 X 那台機台對 X 的真正完成回報，而是「V 的機台宣稱完成 X」。平台如果有任何一層核對交易與機台的對應（或金額），就會以「查無此交易」之類的訊息拒絕。這和
      spec 第 93 行預期的「告知機台這筆交易不存在」外觀相同，X 也同樣維持已取消，於是本案會在根本沒驗到「已取消交易拒收遲到回報」的情況下判 PASS。V 的對照只證明工具能對 V 送出有效回報，不能證明改寫後的請求對 X 有效。依第
      51 行，同一台機台新的出金請求會取代舊的待確認出金，所以 X、V 只能放在不同機台。這個限制本身正確，但正因如此，範本必須連同機台身分一起換成 X 的。
    recommended_change: 步驟 4 改為「以 X 所屬機台的身分與憑證、X 的原始欄位（交易編號、金額等，依 RD 範本說明哪些欄位要換），送出 X 的完成回報」，執行時附上 V 與 X 兩份實際請求，逐欄對照只差在交易／機台識別與該筆的固有欄位。如果工具能讓
      X 那台機台（模擬器）在取消後直接送出它原本那筆未完成的回報，優先採用。無法確認請求對應到 X 的機台時，本案記為受阻。回應內容仍然只記錄，不判定。
