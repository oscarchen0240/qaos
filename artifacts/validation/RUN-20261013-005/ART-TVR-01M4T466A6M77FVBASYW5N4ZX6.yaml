  - testcase_id: TC-DRAFT-01M4T43E6MVYG1V3TH0TFGA80Y
    issue_type: other
    severity: minor
    violated_requirement: REQ-TXLOG-029
    spec_reference: &id001
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 89 行）
      quote: 僅 Admin 可對「待確認」狀態的交易執行
    evidence: 上一輪 4 個 major 已解決。REQ-029 四案都補上：(a) 前提要求同一環境已用同一份 RD 範本成功執行過 AC-0282，本案只替換身分或目標，並附範本與實際請求供比對；(b) 憑證唯讀預檢；(c)
      回應為格式錯誤、路由不存在、欄位錯誤或憑證無效時，記為無效／受阻；(d) 最後以管理員、同一範本做對照取消。對照的對象：兩張 AC-0291 案用 X 本身，在步驟 5 判定狀態與分數之後才做；AC-0292、0293 案用另備的待確認出金
      W。expected_result 也明寫結論只在以上條件都成立時才有效。
    explanation: 假通過途徑已消除：對照組證明同一份請求在合法條件下確實會造成取消，所以「狀態沒變」可以歸因到權限或狀態檢查，而不是請求本身無效。AC-0291 案用 X 本身做對照最強，同時證明 X 確實是可被取消的目標；對照放在斷言之後，不影響步驟
      5 的判定。對照組走的是正向路徑（AC-0282），排除條件也只針對請求格式或憑證層，不涉及阻擋方式、錯誤碼或文案，所以不依賴 CLR-TXLOG-003（Q04 E5）。如果後端用同一種回應同時表示「格式錯誤」與「業務拒絕」，執行者分不出來時會記為無效，這是保守方向，只會造成受阻，不會假通過。
    recommended_change: 不阻擋。
  - testcase_id: TC-DRAFT-01M4T43E6MYYQHQEV571X8B8BD
    issue_type: non_executable_steps
    severity: minor
    violated_requirement: REQ-TXLOG-029
    spec_reference: *id001
    evidence: 操作員案與站長案的步驟 2 寫「若該帳號無法進入『交易紀錄查詢』或看不到 X……改以 API 通道（該帳號的身分）進行步驟 3」，但新增的步驟 3 是「憑證預檢：以該帳號憑證對唯讀查詢（例如查詢 X 的交易紀錄）發出一次請求；失敗則記無效／受阻」，原本的嘗試取消已順延為步驟
      4。另外，前提把「操作員／站長能否進入頁面、資料範圍」列為環境前提。
    explanation: 有兩點：(1) 步驟 2 引用的步驟號碼沒有跟著更新。(2) 如果該角色本來就不能進入本頁或看不到 X（這正是步驟 2 預留的分支），以「查詢 X」做預檢會因權限不足（不是憑證無效）而失敗，整案會被記為受阻，API
      通道的備案就走不通。這是保守方向，不會假通過，但可能讓操作員案在合理環境下永遠受阻。
    recommended_change: 步驟 2 的「進行步驟 3」改為「進行步驟 3～4」。憑證預檢改用該身分確定有權限的唯讀請求（例如取得目前登入者資訊，或該角色可進入的任一頁的查詢），並明寫只有「未通過身分驗證」（例如 401 或
      token 失效）才記無效；「已通過驗證但無權限」不算預檢失敗。
  - testcase_id: TC-DRAFT-01M4T43E6M2R4Z6G6GBJST4Z0G
    issue_type: other
    severity: minor
    violated_requirement: REQ-TXLOG-029
    spec_reference: *id001
    evidence: 不可逆消耗的待確認測試出金：AC-0282 案 1 筆（X）、AC-0291 站長案與操作員案各 1 筆（X，前提已註明不得共用）、AC-0292 與 AC-0293 案各 1 筆對照用的 W（都註明取消後不得再用），合計至少
      5 筆。AC-0283 與 TC-165 修訂案的 X 註明可與其他案例共用；TC-148 修訂案需要另一筆超過 24 小時的待確認出金，且全程不得被取消。
    explanation: 消耗關係已在各案標明，沒有案例在取消後被重用，不構成錯誤。只是 AC-0292、0293 兩案都把對照交易叫作「W」，如果環境負責人在同一輪只準備一筆 W，第二案就會受阻；而且 AC-0283／TC-165 可共用的
      X 如果先被 AC-0282 或 AC-0291 的對照取消，這兩案也需要另一筆。
    recommended_change: 不阻擋。建議在 TDR 或執行計畫中列出一輪回歸需要的待確認出金數量（至少 5 筆不可逆消耗，另加可共用的 1 筆，以及 TC-148 的 1 筆超過 24 小時者），並把兩案的 W 改名（例如
      W2、W3）以免混用。
