    evidence: Draft expected_result：「可查得全平台各場館的機台交易：步驟 2 的結果同時含 S1、S2（P1 子樹）與 T1（P2 子樹）的機台交易；步驟 3 三個會員編號皆查得各自的交易」；steps 1～3
      全程未提站台切換下拉選單的選取。v0.2 依據 quote 只有「| 機台交易紀錄查詢 | 管轄範圍 | 管轄範圍 | 自身場館 |」，未寫單次查詢跨場館彙總；SPEC-TXLOG-001 v0.1 L27 明文「一次僅顯示所選站台」，且根站台
      admin 依 SPEC-SITELIST-001 v0.6「根站台」為線上類型站台。
    explanation: 本 TC 是 AC-PLATFORMRULE-0153（根站台管理員可查全平台）唯一對應的案例。預期寫的是「同一次查詢結果同時含三個場館的交易」，但 v0.2 沒有這條依據，機台交易紀錄查詢頁的正式規格（SPEC-TXLOG-001）又規定頁面資料範圍跟隨站台切換、一次只顯示所選站台。照步驟執行時，切換選單停在根站台
      admin（線上站台）或任一單一場館，步驟 2 都不會同時出現 S1、S2、T1 的交易，實作正確時反而判 FAIL（偽失敗）。步驟 3 也未說明要切到哪個站台再查，結果取決於執行者當下選的站台。
    recommended_change: 改寫步驟與預期：(1) 展開站台切換下拉選單，確認含 P1、S1、S1a、S2、P2、T1（或註明此點由 N3 案例負責，本案不重複）；(2) 依序將站台切換至 S1、S2、T1，各自以涵蓋已知交易的日期範圍及對應會員編號（MS1／MS2／MT1）查詢；預期改為「切換至
      S1／S2／T1 時，分別查得 MS1／MS2／MT1 的機台交易（跨兩個平行主站台皆可切換、可查得）」。移除「步驟 2 的結果同時含 S1、S2、T1」的單次彙總斷言。expected_result_spec_reference
      維持 v0.2 權限表列即可，必要時於 location 註明頁面範圍依 SPEC-TXLOG-001「站台切換」。
  - testcase_id: TC-DRAFT-01M3XJEKZ6SNAXNQYJN7TXFHNA
