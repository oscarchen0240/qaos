    spec_reference: *id001
    evidence: steps 1～5 均未指定站台切換下拉選單選哪個站台；步驟 3「分別以 MS1、MS2 的會員編號查詢」，預期「步驟 3 查得 MS1、MS2 的交易」；步驟 2「不限定會員編號，檢視結果中的交易所屬場館」，預期「步驟
      2 的結果不含 MT1 的交易」；步驟 4「以 MT1 查詢結果為空」；步驟 5「若頁面提供場館或站台篩選欄位，嘗試選取 T1…若無此欄位則略過本步」。SPEC-TXLOG-001 v0.1 L27「一次僅顯示所選站台…不另設『場館』篩選欄位」、L70「場館名稱不顯示」。
    explanation: 這是 TC-PLATFORMRULE-051 的修訂版（P1 站長的機台交易紀錄管轄範圍），也是站長管轄範圍唯一的機台交易紀錄查詢 UI 案例。頁面一次只顯示所選站台：站長登入後若停在自身站台 P1，MS1（S1）、MS2（S2）的交易不會出現在
      P1 的查詢結果中，步驟 3 會偽失敗；要查得就必須先切到 S1、S2，步驟卻沒寫。反向斷言（步驟 2 不含 MT1、步驟 4 MT1 查無）只要切換選單停在 P1 子樹內任一站台就必然成立，與管轄範圍是否正確無關，無法驗出越權。真正的邊界在站台切換選單是否提供
      T1／P2，但步驟 5 以「場館或站台篩選欄位」為條件，TXLOG 已明定不另設場館篩選欄位，執行者很可能直接略過。另外，步驟 2「檢視結果中的交易所屬場館」在列表上看不到（TXLOG 不顯示場館名稱）。
    recommended_change: 改寫為以站台切換下拉選單為驗證主軸：步驟 A 以 P1 站長登入，展開站台切換下拉選單，記錄全部選項；步驟 B 切換至 S1，以日期範圍及 MS1 查詢；步驟 C 切換至 S2，以 MS2 查詢；預期改為「站台切換選單僅含
      P1、S1、S1a、S2，不含 P2、T1（無法切換至 T1 查詢）；切至 S1／S2 時分別查得 MS1／MS2 的交易」。刪除步驟 2 的「檢視交易所屬場館」，或改為以「機台帳號（來源機台）」欄位辨識。步驟 5 不要寫成條件式略過，直接以站台切換選單為檢查對象。API
      越權仍由 N8（TC-DRAFT-01M3XJEKZ93MZZ228YZTPA38EG）負責。
