      location: §活動設定與成本試算（第 213 行）
      quote: 以**建立當下**各規則的涵蓋會員人數加權（建立時記錄，不隨會員人數變動）
    evidence: S1「新增『等級規則 1』勾選會員 B 以外的某等級 a」；S5「把會員 B 升降至不同等級，使『會員等級設定』中各等級人數改變；重新整理紅包明細 ==> 『建立時成本試算』仍與步驟 1 的數值一致」。
    explanation: B 原本不在等級 a；若 S5 把 B 移到另一個同樣未被等級規則勾選的等級，預設規則與等級規則 1 的涵蓋人數都不變，即時計算的整體試算也不會變。這時不論實作是快照還是即時計算，S5 都會通過，驗不出 AC-0212
      的「不隨會員人數變動」。
