      quote: '| 機台專屬欄位 | 可修改（場館幣別唯讀） | 可修改（場館幣別唯讀） | 額度上限、場次逾時時間修改後即時生效；欄位定義見「站台類型與機台專屬欄位」 |'
    evidence: 前置條件：「於『系統管理 > 站台列表』編輯該機台場館，把『日結時間』設為距現在約 30～90 分鐘後的整點（UTC+0；下稱 T）並儲存；必須在建立紅包活動之前完成」。S2「T 前 10 分鐘內，M1 結算 600，再結算
      600 ==> 第二筆後 M1 產生 1 個紅包」；S3、S4「M2 在 T 前結算 600、T 後再結算 600 ==> 仍無紅包（兩筆分屬兩個週期）」。SPEC-SITELIST-001@0.6 第 84 行只定義「日結時間：每日結算的截止時刻（UTC+0），用於場館日結報表分日」；第
      182 行把「修改後即時生效」限定給「額度上限、場次逾時時間」，沒有包含日結時間。派發包範圍內（REDPACKET、SITELIST、ARCADE、DAILYREPORT 與決議快照 CLR-DAILYREPORT-004/007）都沒有定義日結時間在當日中途修改後何時生效。本案與
      iteration 0 相同，上一輪未報。
    explanation: 本案的判準（T 前的兩筆同週期、跨 T 的兩筆分屬兩週期）成立的前提是「把日結時間改成當天稍後的 T，當天就以 T 切分」。這一點 spec 沒有定義，而且 SITELIST 明列即時生效的欄位時刻意沒有列入日結時間。若實作是隔一個營業日才生效，或修改當天產生過長／過短週期（正是
      REQ-REDPACKET-011 Q02（E4 major，CLR-REDPACKET-006）待決的週期切分問題），M2 的 600＋600 會落在同一週期而產生紅包，實作正確也會被判 FAIL。前置把這一步標成「依 spec
      的場館設定欄位」的環境佈置，沒有揭露成假設，也沒有 decision_refs 或 exploratory 標示。本案是 high risk 的 REQ-REDPACKET-011 唯一的非 happy-path 案例，也是 AC-0112（機台以日結時間切分）唯一的行為驗證。
    recommended_change: '不要在測試當天修改日結時間：改用場館現有的日結時間 T（在前置記下其 UTC+0 值），把測試排在 T 前後的時間窗執行；若必須調整，至少提前一個完整營業日完成修改並在前置寫明，避開「修改當日」。若仍要沿用當日修改的作法，需在
      assumptions 寫明「假設日結時間修改後當日即以新時刻切分」（requirement_id REQ-REDPACKET-011、needs_human_confirmation: true），加 decision_refs
      REQ-REDPACKET-011/Q02（basis_ref null），並把標題與預期標成 exploratory。'
