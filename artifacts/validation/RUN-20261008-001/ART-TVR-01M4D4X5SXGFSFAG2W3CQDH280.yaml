    evidence: S2「…（若操作員無法進入活動排程列表，記錄實際行為並結束本案，此情形不判 fail，供 CLR-REDPACKET-017 參考）」。
    explanation: 依 RequirementModel，操作員能否進入活動排程列表屬 REQ-024 Q02（E3），條件式處理合規。但第 257 行明定操作員可檢視自身場館的紅包明細，而紅包明細的路徑經過活動排程（第 201
