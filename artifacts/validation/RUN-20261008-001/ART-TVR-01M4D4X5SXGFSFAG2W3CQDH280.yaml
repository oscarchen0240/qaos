    explanation: 報表按日顯示的是依場館日結時間切分的營業日；當日結時間不是 00:00（UTC+0），或執行者以台灣時間理解『今日』時，『今日』對應的營業日日期可能不同，執行者可能選錯日期而查不到該列。判準本身正確。
