    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §對既有章節的影響（第 350 行）
      quote: 新增「紅包金額」欄（當日已入帳紅包合計）
    evidence: 前置：「已有一個『已結束的營業日』Z，場館內某機台帳號 M1 在 Z 當日有已入帳紅包（入帳時間在 Z 的中段，避開營業日邊界…）」；S3「在 M1 的紅包明細中，把 Z 當日『入帳時間』落在營業日內的已入帳紅包金額相加
      ==> 等於報表『紅包金額』」。紅包明細的功能路徑是「優惠活動管理 > 活動排程 > 紅包活動 > 點擊活動名稱」（第 201 行），每個活動各自一頁；本 Draft 幾乎每案都以『取消排程』收尾，Z 當日 M1 的紅包可能分屬多個活動，其中已取消的活動是否仍列於排程列表屬
      REQ-REDPACKET-016 Q03（E4，CLR-REDPACKET-009）。前置也沒有限定 Z 的紅包來自『每日重置』的活動。
    explanation: S3 的對照值要從「M1 的紅包明細」加總，但紅包明細是逐活動檢視，沒有跨活動查 M1 的入口；Z 用的是環境既有資料，若當日有多個（含已取消、可能已不在列表的）活動，執行者可能漏加而在實作正確時判 FAIL。另外，若
      Z 的紅包來自每週／每月／不重置的活動，可能有前一營業日產生、Z 當日才入帳的紅包；此時『依入帳時間歸屬營業日』正是 REQ-032 Q02（E4，CLR-REDPACKET-025）待確認的部分，前置只避開了營業日邊界，沒有避開這種情形。S4（期末餘額驗算）與
      S5（現金淨收）不受影響；紅包金額只計已入帳的判準另由受控資料的 TC-DRAFT-01M4D4C0RYSX0BDQMAV343G4Q9 覆蓋，所以 high risk 的 REQ-032 沒有失去實質覆蓋，列 minor。
    recommended_change: 改用受控資料：在某營業日內自行建立一個『每日重置』的紅包活動，讓 M1 產生並開啟已知金額的紅包（同時做開分、洗分、出金），待該營業日結束後再查詢；或在前置限定 Z 當日 M1 的紅包只來自單一個仍可從列表進入的『每日重置』活動，並把
      S3 的對照來源改為（或加上）『各式報表 > 交易紀錄查詢』M1 在 Z 營業日內交易類型『紅包』的金額合計。
