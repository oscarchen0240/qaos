    evidence: 前提只要求『自行從環境中選定一台…既有機台』與『測試期間不得有其他針對 M 的交易』，沒有要求 M 的起始分數為 0。步驟 2 送 req-keyin 1000、洗分 100 後斷言『M 分數 900』；步驟 3『完成出金（全額
      900）』；步驟 4 斷言 R_o 金額 −900；步驟 6 斷言『提款金額 = m0 + 1000』。
    explanation: 出金一律以當下全部餘額為核可金額（第 336 行）。如果選到的既有機台原本就有餘額 B0，R_o 的金額會是 B0 + 900，步驟 2、3、4、6 的絕對數值（900、−900、m0 + 1000）都會不符，產生假的
      FAIL。這個案例對應 high risk 的 REQ-048，『核實當下累計提款金額』是 AC-0483 的核心斷言，前置條件不足會讓這個斷言無法判定。
    recommended_change: 在步驟 1 之前加一個前置步驟：確認 M 分數為 0；若有餘額，先用 req-keyout mode=all、throshold=0 洗到 0，且不要核實這筆清空用的洗分，才不會影響 w0／m0。或者改成相對寫法：步驟
      2 前先讀 B0，R_o 的金額寫成 −(B0 + 900)，步驟 6 寫成 m0 + 100 + (B0 + 900)。
