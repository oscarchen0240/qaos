      quote: 交易紀錄、核實與場館日結報表的收據金額、已兌現金額、現金淨收一律以面額計
    evidence: 步驟 1 先記下場館日結報表『收據金額』『已兌現金額』『現金淨收』基準值 R0／C0／N0；步驟 2 才『使 M 餘額恰為 399.6（見前提）』再出金。前提給的佈置作法是『先把 M 餘額清到 0，再試送 req-keyin
      金額 399.6』，或請環境負責人用測試資料工具設定。步驟 5 斷言『收據金額增加 399.6、已兌現金額增加 399.6、現金淨收的變動量絕對值為 399.6』。
    explanation: 佈置餘額的交易發生在記錄基準值之後、比對之前，而且本身就會進入同一張場館日結報表：開分 399.6 會讓現金淨收 +399.6，與出金的 −399.6 互相抵銷；若用洗分把舊餘額清到 0，會再多一筆洗分付現；若用出金清到
      0，收據金額也會多出舊餘額。照步驟寫的順序執行，步驟 5 的三個差額（尤其是現金淨收）不會等於 399.6，會產生假的 FAIL，AC-0204『現金淨收以面額計』的主要斷言就無法判定。前提雖然要求『測試期間該場館不得有其他交易』，但佈置交易本身就落在測試期間。
    recommended_change: 把『使 M 餘額恰為 399.6』移到步驟 1 之前（獨立成前置步驟，並確認佈置交易已反映在報表上），然後才記下 R0／C0／N0；或者在步驟 2 佈置完成、送出 req-cashout 之前再讀一次基準值。步驟
      5 的差額只比對從 req-cashout 到核實這段期間的變動。另外建議註明：清空舊餘額時不要用出金，避免收據金額混入其他筆。
