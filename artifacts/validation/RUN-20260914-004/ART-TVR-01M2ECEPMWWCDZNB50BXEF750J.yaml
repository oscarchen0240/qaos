      Modal 下拉選單的可選項集合（建立前的欄位定義）。但它宣告對應的 AC-ACCOUNT-0011（given 後台建立一個線上帳號 / when 檢視該會員紀錄 / then 帳號類型欄位值為線上）與 AC-ACCOUNT-0012（given
