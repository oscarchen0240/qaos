      Modal 下拉選單有哪些選項』是不同的斷言、不同的操作時機。本包另有 TC-DRAFT-01M2EBZJFM2E5HPP6SMNVBCZJD 才是真正驗證 AC-0011/0012 給定情境的案例。
    explanation: acceptance_criteria_ids 指向的 AC 與 TC 實際的 steps/expected_result 內容不相符：AC-0011/0012 驗證的是『建立後記錄上的帳號類型值』，TC 驗證的是『建立前欄位下拉選單只有兩個選項』。兩者雖同屬
      REQ-ACCOUNT-001 的合理延伸驗證，但不是同一個 given/when/then，屬於 AC 標記不精準（與過去 DAILYREPORT／SITELIST 驗證中最常見的錯誤同類型）。
    recommended_change: 移除本 TC 對 AC-ACCOUNT-0011／AC-ACCOUNT-0012 的掛勾；若要保留本 TC 作為『帳號類型僅有線上/機台兩值』的獨立驗證，建議在 Requirement 端新增對應
      AC（例如描述 Modal 欄位可選值集合的 AC），或將 acceptance_criteria_ids 留空並僅保留 requirement_ids，避免宣稱驗證了實際上未驗證的 given/when/then。
