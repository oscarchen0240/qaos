  ambiguities:
  - requirement_id: REQ-TXLOG-028
    ambiguity:
      level: none
      raised_level: major
      description: spec 第 89 行定義手動取消（未限交易類型），CLR-TXLOG-001 曾裁定本頁不提供手動取消，兩者衝突；已由 CLR-TXLOG-002 rev 0 裁決為提供、限待確認機台出金、限管理員（決策點
        Q01 已解決）
  - requirement_id: REQ-TXLOG-029
    ambiguity:
      level: major
      raised_level: major
      description: 不符合手動取消條件（非管理員、非待確認、機台入金）時系統的阻擋方式 spec 未定義（決策點 Q04）
      options:
      - 不顯示手動取消入口
      - 顯示但停用（disabled），無法點擊
      - 允許點擊，送出後由後端拒絕並顯示錯誤訊息
  - requirement_id: REQ-TXLOG-009
    ambiguity:
      level: minor
      description: 開分/入鈔類型的交易狀態選項中「無」這個技術值對應 spec.md 哪個概念分類尚未確認
      options:
      - 對應「未成立」（與「錯誤」「無效」同類）
      - 對應其他尚未定義的情況
      - 純粹的 UI 佔位/邊界情況，實務上不會出現
  constraints:
  - text: 手動取消僅限管理員、僅限交易狀態「待確認」的機台出金；機台入金沒有手動取消
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 89 行）
      quote: 僅 Admin 可對「待確認」狀態的交易執行
    requirement_id: REQ-TXLOG-029
  - text: 手動取消須經二次確認，確認後標記為「已取消」，分數不異動
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 89 行）
      quote: 僅 Admin 可對「待確認」狀態的交易執行；二次確認後標記為「已取消」，分數不異動。用於機台故障造成的卡單清理
    requirement_id: REQ-TXLOG-028
  - text: 出金不設逾時，待確認保留至機台補完回報、被新出金取代、櫃檯人工出金連動取消或管理員手動取消為止
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §相關業務規則（第 122 行）
      quote: 入金：尚未完成的交易超過 24 小時自動轉為「已逾時」。出金：不設逾時，待確認保留至完成、被新出金取代、人工出金連動取消或 Admin 手動取消為止
    requirement_id: REQ-TXLOG-017
  - text: 本頁不提供核實操作，核實狀態欄位唯讀
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 91 行）
      quote: 本頁不提供核實操作——洗分與出金的核實一律於 帳務管理 \>「洗分出金核實」執行（見該小節），本頁的核實狀態欄位僅供查帳
    requirement_id: REQ-TXLOG-030
  edge_case_candidates:
  - text: 管理員在二次確認對話框選擇不確認（或關閉對話框）：交易應維持待確認、分數不異動（spec 只寫「二次確認後標記為已取消」）
    requirement_id: REQ-TXLOG-028
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 89 行）
      quote: 僅 Admin 可對「待確認」狀態的交易執行；二次確認後標記為「已取消」，分數不異動。用於機台故障造成的卡單清理
  - text: 管理員開啟二次確認後、確認前，機台補完回報使交易轉為已完成：確認送出時應如何處理
    requirement_id: REQ-TXLOG-029
  - text: 兩位管理員同時對同一筆待確認機台出金執行手動取消
    requirement_id: REQ-TXLOG-028
  - text: 手動取消後機台才補送完成回報（第 93 行：取消後平台告知機台交易不存在、機台停止重試）：交易應維持已取消、分數不異動
    requirement_id: REQ-TXLOG-028
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 93 行）
      quote: 取消後平台會告知機台這筆交易不存在，機台就會停止重試
  - text: 手動取消後，以交易狀態篩選「已取消」（出鈔類型技術值「失效」，見 REQ-TXLOG-009）可查到該筆出金；完成時間、實際金額欄的顯示
    requirement_id: REQ-TXLOG-028
  - text: 現場執行 Operator Reset 後待確認的機台出金永遠留著，須由管理員手動取消清理（第 99 行）
    requirement_id: REQ-TXLOG-017
    spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §操作（第 99 行）
      quote: 該待確認會永遠留著，必須由 Admin 手動取消清理
  - text: 過渡期（機台暫無印表機）出金停在待確認時依人工出金連動取消處理（第 97 行），與管理員手動取消並存
    requirement_id: REQ-TXLOG-017
