  summary: SPEC-TXLOG-001 v0.1 同版本重新分析（spec-change-impact 0.1→0.1，from R000 legacy，reason=decision_added；RUN-20261013-005
    T0，派發包 T0-iter0；閉包為空、references undeclared；決議快照 CLR-TXLOG-001 APPLIED、CLR-TXLOG-002 ANSWERED rev 0）。落地 CLR-TXLOG-002：交易紀錄查詢（4.1
    機台視角）提供待確認機台出金的手動取消（僅管理員、僅待確認、二次確認後標已取消、分數不異動；機台入金沒有手動取消；後端已完成、前端未開發），推翻 CLR-TXLOG-001（2026-09-14）與 CLR-CASHFLOW-004（2026-09-15）「本頁不提供手動取消」的結論。沿用
    30 條需求 ID 與全部既有 AC ID，無新增需求。修改：REQ-TXLOG-028（改為提供手動取消，version 2；AC-TXLOG-0281 改寫、新增 0282、0283）、REQ-TXLOG-029（恢復為有效需求：非管理員、非待確認、入金不可手動取消，version
    2；AC-TXLOG-0291、0292 改寫、新增 0293）、REQ-TXLOG-017（出金待確認收斂途徑補上管理員手動取消、移除依 CLR-TXLOG-001 加入的「轉介洗分出金核實頁」，version 2）、REQ-TXLOG-030（可用操作改為查看明細＋手動取消，version
    2）。以上 4 條改用決策點格式，其餘 26 條維持舊格式（E6）不變。決策點 9 個：已決（conflict＋CLR-TXLOG-002 resolution）1、defined_in_target 7、undefined 1（REQ-TXLOG-029
    Q04 阻擋方式，major）；unresolved conflict 0。
  scope:
    in_scope:
    - 交易紀錄查詢 4.1 的機台視角擴充：查詢範圍、篩選器、交易狀態定義、列表欄位、金額總計
    - 交易狀態收斂（入金 24 小時逾時、出金不設逾時與其收斂途徑）
    - 操作：查看明細、管理員對待確認機台出金的手動取消（含二次確認、標已取消、分數不異動）
    - 手動取消的限制：僅管理員、僅待確認、僅機台出金（入金沒有手動取消）
    - 本頁不提供核實操作，核實狀態欄位唯讀
    out_of_scope:
    - 機台交易的產生、狀態流轉與「交易不成立的原因」對照表（開發包③ SPEC-CASHFLOW-001）
    - 洗分與出金的核實／作廢操作（帳務管理「洗分出金核實」SPEC-CASHOUT-001）
    - 手動取消前的現場實體狀況確認（第 93～99 行，屬作業指引，非系統行為）
    - 手動取消後平台告知機台交易不存在、機台停止重試（第 93 行，屬機台端協定，後台頁面不可觀察）
    - 非機台（線上會員）交易的既有查詢行為
