  summary: 機台交易紀錄（開發包④，既有『交易紀錄查詢 4.1』的機台視角擴充）：查詢範圍含未完成/取消/未成立的機台交易，新增機台/場次/交易類型/交易狀態/核實狀態等篩選器，列表新增多個機台專屬欄位（含金額、狀態、核實狀態、重送次數等），並提供查看明細與
    Admin 手動取消兩個操作。底層交易資料模型（產生、狀態流轉）已在 SPEC-CASHFLOW-001 定義，本包只測查詢/篩選/呈現層與手動取消動作，不重複測試 CASHFLOW 已驗證的交易生成規則。
  scope:
    in_scope:
    - 篩選器（機台帳號/交易編號/場次編號/訂單編號/交易類型/交易狀態/核實狀態/交易時間/金額）
    - 列表欄位呈現規則
    - 查看明細操作
    - Admin 手動取消操作
    - 入金與出金待確認收斂機制的差異
    out_of_scope:
    - 交易的產生、金額計算、狀態流轉規則（SPEC-CASHFLOW-001）
    - 洗分出金核實頁本身的核實操作（開發包⑤）
    - 站台列表與站台切換機制本身（SPEC-SITELIST-001）
