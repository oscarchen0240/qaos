  summary: 洗分出金核實（開發包⑤，帳務管理新增頁）：全平台唯一的核實入口，消費 CASHFLOW 已產生的機台洗分/出金交易（僅已完成者），提供核實（登記現金已交付）與作廢（僅出金，收據不再兌付）兩個寫入操作，並有自己的篩選/列表/欄位。核實當下連動累計會員列表的提款次數/金額，並回寫機台交易紀錄（TXLOG）的核實狀態欄位。不重複測試
    CASHFLOW 的交易生成規則，也不重複測試 TXLOG 已驗證過的查詢層本身。
  scope:
    in_scope:
    - 核實狀態定義與呈現規則
    - 紀錄產生規則（僅已完成交易出現）
    - 篩選器與列表欄位
    - 核實（洗分/出金）操作流程
    - 作廢操作（僅出金）
    - 核實/作廢的權限與連動規則
    out_of_scope:
    - 洗分/出金交易本身如何產生、金額如何計算（SPEC-CASHFLOW-001）
    - 機台交易紀錄查詢頁本身的篩選/列表（SPEC-TXLOG-001）
    - 操作員角色的完整權限定義（開發包⑥ SPEC-PLATFORMRULE-001）
