  ambiguities:
  - requirement_id: REQ-DAILYREPORT-001
    ambiguity:
      level: minor
      description: 「管理員」的「管轄範圍」本包未定義（權限表註明沿用正本「角色與權限」），v0.1 為「全部」；管理員與站長同為「管轄範圍」時兩者的實際差異不明。
      options:
      - 範圍由使用者所屬站台決定（所屬站台及其子樹），管理員與站長採同一模型、只差所屬站台層級（與 SITELIST 權限範圍模型一致）
      - 平台最上層的管理員其管轄範圍實質仍為全部場館；僅下層站台的管理員受限
  - requirement_id: REQ-DAILYREPORT-009
    ambiguity:
      level: major
      description: CLR-DAILYREPORT-007 的定案以「逾時結束的時間必然超過日結時間，故同一營業日內場次只會以已結束或日結結算收尾」為前提，但實測曾在同一營業日內產生「逾時結束」場次，前提不成立；營業日內的逾時結束場次是否計入「當日結束的場次筆數」、歸屬哪個營業日，v0.2
        與 CLR-007 皆未涵蓋（已送 PM，尚未回覆）。
      options:
      - 逾時結束視同當日結束：所有非進行中狀態（已結束、逾時結束、日結結算）皆計入其結束（或開始）營業日的場次數
      - 逾時結束不計入場次數，維持 CLR-007 只計已結束與日結結算
      - 同一營業日內不應出現逾時結束，實測現象屬場次引擎（開發包③）缺陷，報表規則不變
  - requirement_id: REQ-DAILYREPORT-011
    ambiguity:
      level: major
      description: 出金在「洗分出金核實」頁被作廢後（作廢不可復原、分數不退回機台），該筆收據金額在本報表如何呈現未定義：依現有定義推導，收據金額仍含已作廢、已兌現與未兌現皆不含，單列「收據＝已兌現＋未兌現」出現等於已作廢金額的殘差且報表無欄位說明。此題也影響餘額驗算式（REQ-DAILYREPORT-021，收據以交易發生為準計入）——若收據金額扣除已作廢，驗算式將不成立。CLR-DAILYREPORT-011
        已送 PM（ASKED），尚未回覆。
      options:
      - A. 不另顯示：收據金額仍含已作廢，殘差＝已作廢，靠回推；需在欄位說明註明
      - B. 新增「已作廢金額」欄，讓 收據＝已兌現＋未兌現＋已作廢 可直接勾稽
      - C. 收據金額扣除已作廢，維持 收據＝已兌現＋未兌現
  - requirement_id: REQ-DAILYREPORT-016
    ambiguity:
      level: major
      description: CLR-DAILYREPORT-006（2026-09-13，當時尚無「期初餘額」欄）定案「無資料時列表仍列出、各欄位顯示 0」，但 v0.2 規定各列餘額涵蓋「含當期無場次但仍有留存分數者（沿用其最近一個營業日的結算時點值）」；當期無任何場次與交易、但機台留有分數時，期初／期末餘額應顯示留存分數還是
        0，兩者衝突，不自行裁定。
      options:
      - 依 v0.2：金額與筆數欄顯示 0，期初／期末餘額顯示留存分數（沿用最近一個營業日結算時點值）
      - 依 CLR-DAILYREPORT-006：所有欄位（含期初／期末餘額）皆顯示 0
  - requirement_id: REQ-DAILYREPORT-017
    ambiguity:
      level: major
      description: 「逾時結束」的場次結束後若機台仍留有分數（餘數），日結時是否承接成隔日新場次的期初餘額、是否計入期末餘額，v0.2 未定義：§場次資訊「期初餘額」只列「承接洗分餘數或日結結算轉入者」，§業務規則「場次日結」只涵蓋「進行中的場次」。此題決定期末／期初餘額、相鄰列前後相接與餘額驗算式（REQ-DAILYREPORT-014／018／020／021）在含逾時結束場次時是否成立（已送
        PM，尚未回覆）。
      options:
      - 承接：日結時以該餘數作為隔日新場次的期初餘額，並計入期末餘額（餘額前後相接、驗算成立）
      - 不承接但計入：餘數仍計入期末餘額（機台實際分數），但不形成新場次期初，次日期初與前日期末不相接
      - 不承接也不計入：逾時結束的餘數不計入期末餘額
      - 逾時結束時餘數另有處置（例如清空或轉入其他帳務），由開發包③定義，本報表照其結果呈現
  - requirement_id: REQ-DAILYREPORT-018
    ambiguity:
      level: minor
      description: 「無前一營業日資料時為 0」與同節「含當期無場次但仍有留存分數者（沿用其最近一個營業日的結算時點值）」的關係未明：若緊鄰的前一營業日該機台無資料、但更早的營業日留有分數，期初餘額取 0 還是沿用最近一個營業日的值。
      options:
      - 「無前一營業日資料」指該機台在查詢起點之前完全沒有結算紀錄；否則沿用最近一個營業日的結算時點值
      - 嚴格指緊鄰的前一營業日無資料即為 0
  - requirement_id: REQ-DAILYREPORT-022
    ambiguity:
      level: minor
      description: 排序鍵值相同（例如依機台明細／依場次明細下同一結算期間有多列，或依金額排序時數值相同）時的次排序未定義；「翻頁不會出現資料跳動」需要穩定的次排序。
      options:
      - 以結算期間新→舊為次排序，再依場館／機台／場次編號
      - 以場館／機台帳號／場次編號為次排序
      - 不定義次排序，只保證同一查詢條件下順序穩定
  - requirement_id: REQ-DAILYREPORT-025
    ambiguity:
      level: minor
      description: 未經鑽取、直接以統計維度下拉選單切到依機台明細／依場次明細時，第二層「結算期間」與第三層「機台帳號」顯示什麼內容未定義（例如顯示結算日期範圍？機台帳號篩選留空時第三層顯示什麼？）。
      options:
      - 第二層顯示當前結算日期範圍、第三層顯示機台帳號篩選值（留空時顯示「全部機台」）
      - 僅顯示層級名稱（結算期間／機台帳號），不帶值
  - requirement_id: REQ-DAILYREPORT-026
    ambiguity:
      level: minor
      description: 還原清單只列「統計維度、結算日期、機台帳號」，未提「統計週期」：向下鑽取（例如從按週列點場館名）後統計週期是否維持、回到上層時是否還原未定義；另「清除」重設為第一層時統計維度是否一併回到依場館彙總、其餘篩選是否清空也未明寫。
      options:
      - 統計週期在鑽取與還原間維持不變；清除時所有篩選回預設、統計維度回依場館彙總
      - 統計週期也隨上層還原；清除只重設麵包屑與統計維度
