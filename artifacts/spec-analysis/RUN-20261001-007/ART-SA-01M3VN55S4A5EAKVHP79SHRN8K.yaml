  summary: 場館日結報表 v0.2（ba-spec main 2026-09-12～09-17 修訂）：在 v0.1 的三維度／四週期現金收支統計之上，權限改為管理員＝管轄範圍；損益明定以機台（會員）端計算；新增「期初餘額」欄；期初／期末餘額定義為時點存量，總計列與
    CSV 總計列不逐列相加，各列餘額涵蓋含當期無場次但留存分數的機台、依結算期間排序時相鄰列前後相接；新增餘額驗算式；進行中場次分數計入期末餘額並於依場次明細列出；新增排序與分頁（所有欄位可排序、預設結算期間新→舊、固定每頁 10 筆、非結算期間排序時的餘額欄提示）、維度鑽取與麵包屑；總計與
    CSV 改為整個查詢結果。v0.1 RM 經 CLR-DAILYREPORT-001～010、013 落地的 PM 定案，v0.2 原文多未收錄，本版逐條帶入並於 spec_reference.location 註明出處；CLR-012
    已被 CLR-013 推翻不再適用；CLR-011 仍待回覆。需求共 26 條：沿用 v0.1 語意 12 條（version 1；其中 REQ-008 依 v0.2 原文更新出處、REQ-009／011／017 更新 ambiguity，語意不變）、修改
    5 條（001／013／014／015／016，version 2）、新增 9 條（018～026）。
  scope:
    in_scope:
    - 權限（管轄範圍）
    - 篩選器（機台帳號、結算日期、統計週期、統計維度）
    - 列表欄位與計算規則（含新增期初餘額、損益機台端視角）
    - 期初／期末餘額時點值規則、總計列與 CSV 總計列
    - 餘額驗算式
    - 進行中場次於期末餘額與依場次明細的呈現
    - 排序與分頁
    - 維度鑽取與麵包屑
    - 匯出 CSV（整個查詢結果）
    - 場次日結（影響本報表分日與餘額承接）
    out_of_scope:
    - 核實操作本身（洗分出金核實，開發包⑤之一）
    - 場次引擎與逾時規則細節（開發包③）
    - 會員詳細頁「機台資訊」區塊、機台前台、機台交易紀錄的場次呈現
    - 客戶版手冊
    - 互動原型 proto 本身
