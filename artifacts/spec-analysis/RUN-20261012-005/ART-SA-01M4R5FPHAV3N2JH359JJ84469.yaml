    0.7→0.8（RUN-20261012-005 T0，派發包 T0-iter0，閉包為空、references undeclared、ac_seq_high_water 為空）。沿用 v0.7 的範圍劃分：本正本大部分內容已拆到機台金流（CASHFLOW）、交易紀錄（TXLOG）、洗分出金核實（CASHOUT）、場館日結報表（DAILYREPORT）、站台列表（SITELIST）、創建會員帳號（MEMBER）、機台場館平台規則（PLATFORMRULE）等開發包各自建模，本包只對
    v0.7 已屬 ARCADE 的需求建模。共 5 條 ACTIVE 需求（REQ-ARCADE-001～004、006，沿用原 ID 與原 AC），6 條 AC（沿用舊 3 位數 AC，未新增 AC），8 個決策點全部 defined_in_target（E1）；REQ-ARCADE-005
    於 v0.7 已退役（被 REQ-PLATFORMRULE-014 涵蓋），本版不再列入（列入會被持久化重設為 ACTIVE）。v0.8 對本包範圍沒有新增、修改或移除的行為；僅行號位移（v0.7 RM 的位置引用改為 v0.8 行號）並改為決策點新格式。REQ-ARCADE-004
    的稽核倍數設定位置在 v0.8 內仍有「出金設定」與「鏈上錢包管理」兩種用詞（第 198／834／858 行 vs 第 257 行），依第 257 行與 Oscar 2026-09-15 確認建模，用詞不一列 doc_issues（minor），不開新
    ambiguity。
  scope:
    in_scope:
    - 機台場館前台不開放自行註冊（REQ-ARCADE-001）
    - 機台帳號流水不計入加盟傭金／代理返傭基數（REQ-ARCADE-002）
    - 機台交易不進優惠彩金審核佇列（REQ-ARCADE-003）
    - 鏈上錢包管理 TWD 頁籤的稽核倍數設定與預設 0 倍（REQ-ARCADE-004）
    - 洗分出金核實的核實與作廢寫入後台操作紀錄（REQ-ARCADE-006）
    out_of_scope:
    - 四種金流、場次、對接 API、額度上限與預留、洗分門檻、出金清空與小數面額、PENDING 保留與手動取消（機台金流 SPEC-CASHFLOW-001）
    - 交易紀錄查詢的機台視角擴充、交易狀態、手動取消操作（機台交易紀錄 SPEC-TXLOG-001）
    - 洗分出金核實頁的篩選、列表、核實／作廢流程與權限（洗分出金核實 SPEC-CASHOUT-001）
    - 場館日結報表（SPEC-DAILYREPORT-001）
    - 站台類型、場館設定欄位、核心貨幣（站台列表 SPEC-SITELIST-001）
    - 創建會員帳號、機台資訊／機台憑證區塊、重設密碼、前台忘記密碼（創建會員帳號 SPEC-MEMBER-001）
    - 排除規則政策層、後台選單顯示、操作員角色、遊戲更新預設停用、Free Spin 例外（機台場館平台規則 SPEC-PLATFORMRULE-001）
    - 角色與權限模型（後台角色與權限 SPEC-ROLEPERM-001）
    - REQ-ARCADE-005（場次逾時時間操作員唯讀）：v0.7 已退役，由 REQ-PLATFORMRULE-014 涵蓋
