  - text: 主站台管理員新增站台時，上層站台搜尋結果不得出現根站台 admin 或平行主站台（否則可建立新的主站台或跨客戶掛載）
    requirement_id: REQ-SITELIST-012
  - text: 根站台模板可設定：根站台恆為開通，若清空根站台模板是否允許（開通時模板必填規則僅在「切換為開通」時檢查）
    requirement_id: REQ-SITELIST-032
  - text: 已知風險（沿用 v0.4）：子站台的站台類型／核心貨幣唯讀欄位曾在切換上層站台下拉時未重新查詢、沿用登入者自身站台資料（MAN-20260913-014），建議設計「切換上層站台後唯讀繼承值即時更新」案例
    requirement_id: REQ-SITELIST-002
  - text: 上層站台選單搜尋結果格式（站台名稱、代碼、完整路徑）在候選項極多、層級極深時的呈現與效能，spec 未定義上限
    requirement_id: REQ-SITELIST-012
  - text: 同時新增前台與後台網域皆為空白（0 筆）送出——兩者皆選填，理論上應允許
    requirement_id: REQ-SITELIST-018
  - text: 根站台 admin 的管理員新增主站台時「上層站台」預帶 admin（ZZ），改選他站後即不再是主站台，站台類型／核心貨幣欄應即時改為唯讀繼承
    requirement_id: REQ-SITELIST-034
