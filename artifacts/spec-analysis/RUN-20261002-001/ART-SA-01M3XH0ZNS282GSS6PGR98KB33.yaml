  summary: 站台列表 v0.6（ba-spec main，v06 2026-09-04）：在 v0.4 的站台類型／核心貨幣／機台專屬欄位／五種狀態／網域／模板／階層瀏覽之上，v05 引入單一樹與系統建置的根站台 admin（代碼 ZZ、線上；唯一、不可刪除、狀態恆為開通、不可指定上層、後端須一併實作），主站台重新定義為根站台底下第一層、根站台不參與類型與貨幣繼承鏈，上層站台改為不可留空；v06
    把 Admin 改為每個站台皆有的「管理員」，可見範圍與站長相同（自身站台及子樹，根站台管理員＝全平台），差別在操作深度，新增角色指派範圍與管理員對自身站台的三項限制（不可改上層、不可刪除、不可切為開通），開通與更新待審切回改由上層站台的管理員執行。v0.4
    RM 經 CLR-SITELIST-001～012 與 CLR-PLATFORMRULE-001 落地的定案 v0.6 原文均未收錄，本版逐條帶入並註明出處；其中 CLR-SITELIST-008／009「任何站台皆不可刪除」與 v0.6「子站台可由管理員／站長刪除」直接衝突，標
    critical 不裁定（REQ-022／023）。需求共 37 條：沿用 v0.4 語意 21 條（version 1；部分依 v0.6 用語更新出處、帶入 CLR 定案或補 ambiguity，語意不變）、修改 8 條（011／012／013／014／016／017／022／023，version
    2）、新增 8 條（030～037）。
  scope:
    in_scope:
    - 站台新增／編輯（上層站台、名稱、代碼、類型、核心貨幣、機台專屬欄位、狀態、模板、網域）
    - 根站台 admin 保護規則與單一樹
    - 主站台定義與類型／核心貨幣繼承鏈
    - 管理員／站長角色模型、可見範圍、操作深度與自身站台限制
    - 角色指派範圍（規則層級）
    - 五種狀態與切換權限、更新待審自動觸發
    - 刪除站台（v0.6 原文與 CLR 衝突，待裁定）
    - 階層瀏覽、篩選搜尋、列表欄位
    out_of_scope:
    - 機台專屬欄位實際業務邏輯（額度檢核、場次判定、洗分出金等，見實體機台正本／SPEC-CASHFLOW-001）
    - 操作員角色定義（見實體機台正本與機台場館平台規則）
    - 角色指派的操作介面本身（手冊 7.1.1 角色說明相關功能）
    - 鏈上錢包管理功能本身（僅保留 CLR-SITELIST-012 定案的建站連動）
    - 客戶版手冊與互動原型 proto 本身
