  ambiguities:
  - requirement_id: REQ-SITELIST-011
    ambiguity:
      level: major
      description: 站長的可見／管轄範圍在 v0.6 有兩種寫法：§角色與權限表與 §階層結構寫「自身站台及所有子站台（不含平行或上層站台）」，§主站台寫「站長的管轄範圍即自身所屬的主站台及其所有子站台」；當站長所屬站台不是主站台（位於更深層）時，兩者結果不同。另
        CLR-PLATFORMRULE-001 的案例 ZZAA00264 為「指派在 admin 的站長」，但 v0.6 §根站台「可見者」只列根站台自身的管理員看得到根站台這一列，未說明根站台若有站長時是否可見、是否允許存在。
      options:
      - 以角色與權限表為準：站長可見範圍＝自身所屬站台及其子樹（所屬站台可為任一層），§主站台那句只描述站長掛在主站台的情形；根站台的站長同樣看得到根站台這一列
      - 以 §主站台 為準：站長的範圍一律為其所屬主站台的整棵子樹（即使站長掛在更深層站台）
      - 站長只能掛在主站台或更深層，根站台不設站長（ZZAA00264 類帳號屬資料異常，不在可見規則內）
  - requirement_id: REQ-SITELIST-012
    ambiguity:
      level: minor
      description: §操作/新增站台寫管理員「可搜尋改選任意站台」，§角色與權限寫「可於管轄範圍內自由選取上層站台」；推定「任意」限於管轄範圍內。管理員以 API 帶入管轄範圍外的上層站台時後端是否拒絕未定義（CLR-SITELIST-005
        只涵蓋站長）。
      options:
      - 搜尋結果與後端驗證皆限管轄範圍內，帶入範圍外上層站台一律拒絕
      - 前端搜尋限管轄範圍內，後端不另驗證
  - requirement_id: REQ-SITELIST-013
    ambiguity:
      level: major
      description: 管理員（尤其根站台 admin 的管理員，其管轄範圍含所有主站台）可「於管轄範圍內自由修改」子站台的上層站台，但站台類型與核心貨幣建立後不可修改、且子站台一律與主站台同類型；把站台改掛到不同類型或不同核心貨幣的主站台底下、或改掛到根站台底下使其成為主站台時，系統如何處理
        v0.6 未定義（v0.4 同樣未定義，v0.6 引入單一樹後跨主站台改掛成為可達路徑）。
      options:
      - 上層站台選單只列同一主站台子樹內的站台，不可跨主站台改掛，也不可改掛為主站台
      - 可跨主站台改掛，但僅限同站台類型且同核心貨幣的目標；不同者阻擋
      - 可任意改掛，站台類型與核心貨幣維持原值不變（允許與新主站台不一致）
  - requirement_id: REQ-SITELIST-016
    ambiguity:
      level: minor
      description: §站台狀態以「上層站台的管理員」表述開通／恢復開通的切換者，但 §角色與權限 寫管理員對管轄範圍內所有子站台有完整權限（含切為開通）；「上層站台的管理員」是僅指直屬上層站台的管理員，還是任一管轄範圍涵蓋該站台的祖先站台管理員（例如根站台
        admin 的管理員）未明寫。
      options:
      - 任一祖先站台的管理員皆可（管轄範圍涵蓋該站台即可），「上層站台」為簡稱
      - 僅直屬上層站台的管理員可切為開通，更上層的管理員不可
  - requirement_id: REQ-SITELIST-022
    ambiguity:
      level: critical
      description: v0.6 原文與已落地的 CLR 定案直接牴觸，本 RM 不自行裁定。v0.6（版本日期 2026-09-04）§角色與權限「子站台：刪除｜可操作｜可操作」、§列表欄位「操作｜編輯、刪除」、§操作/刪除站台（確認彈窗、二次確認、不可復原）、§業務規則/刪除確認，皆定義管理員與站長可刪除管轄範圍內的子站台（僅自身站台與根站台不可刪除）；CLR-SITELIST-008／009（2026-09-14，PM
        與後端共同確認，晚於 v0.6 版本日期）定案「任何類型的站台皆不提供刪除操作，前後端皆拒絕，只能暫停／關閉」，原因是刪除會影響站台樹狀結構。v0.6 取自 ba-spec main 2026-09-29 快照仍保留刪除敘述，QA
        增補草稿要求移除該節亦未合入正本，無法判斷是 spec 未同步 CLR，還是產品方向已改回可刪除。
      options:
      - 以 CLR-SITELIST-008／009 為準：任何站台皆不提供刪除（前端無入口、後端拒絕），v0.6 的「子站台：刪除」列、§操作/刪除站台與刪除確認規則為待修正的錯誤敘述
      - 以 v0.6 原文為準：管理員與站長可刪除管轄範圍內的子站台（自身站台與根站台除外），確認彈窗二次確認後執行、不可復原；CLR-SITELIST-008／009 視為被取代，並須補定義有子站台時的處理（REQ-SITELIST-023）
      - 部分採用：僅特定條件可刪除（例如無子站台、未曾開通），其餘不可刪除，需 PM 補定義條件
  - requirement_id: REQ-SITELIST-023
    ambiguity:
      level: critical
      description: 與 REQ-SITELIST-022 同一衝突（v0.6 原文可刪除子站台 vs CLR-SITELIST-008／009 任何站台皆不可刪除），應一併裁定；若採 v0.6 原文，刪除仍有子站台的站台時子樹如何處理
        v0.6 亦未定義。
      options:
      - 採 CLR-SITELIST-008／009：不提供刪除，本條情境不會發生，僅供追溯
      - 採 v0.6，有子站台時阻擋刪除，須先移轉或刪除所有子站台
      - 採 v0.6，串聯刪除整個子樹（含孫層）
      - 採 v0.6，子站台自動改掛到被刪站台的上層
  - requirement_id: REQ-SITELIST-029
    ambiguity:
      level: minor
      description: v0.6 起始層改為「一律顯示自身所屬站台這一列」，且根站台只有根站台的管理員看得到，但路徑列仍寫「點擊『站台列表』回到根層」；對主站台以下的使用者，「根層」所指未明。
      options:
      - 回到使用者的起始層（自身所屬站台這一列）
      - 回到根站台層，僅根站台的管理員有意義；其他使用者不顯示「站台列表」節點
  - requirement_id: REQ-SITELIST-032
    ambiguity:
      level: major
      description: §根站台「網域／模板：可設定，行為與一般站台相同」，但一般站台在「開通」狀態下網域異動會被系統自動切為「更新待審」（REQ-SITELIST-017，「適用於所有角色」），與「根站台不可切為更新待審、恆為開通」互相牴觸；根站台網域新增或刪除時是否觸發更新待審未定義。若觸發，根站台無上層、無人能切回開通。
      options:
      - 根站台網域異動不觸發更新待審，狀態維持開通（保護規則優先）
      - 根站台網域異動仍觸發更新待審（網域行為與一般站台相同優先），並另定義由誰切回開通
  - requirement_id: REQ-SITELIST-036
    ambiguity:
      level: major
      description: 「站長以下」是否含站長本身未明：管理員表述為「管理員與站長（及以下所有角色）」，站長表述為「僅可分配站長以下的角色權限，不可指派管理員」，CLR-SITELIST-004 亦寫「站長只能指派站長以下」；站長能否指派另一位站長決定負向案例的預期。
      options:
      - 含站長：站長可指派站長與操作員等更低角色，只是不可指派管理員
      - 不含站長：站長僅可指派低於站長的角色（如操作員）
  - requirement_id: REQ-SITELIST-037
    ambiguity:
      level: minor
      description: QA 增補草稿（specs/_drafts/SPEC-SITELIST-001-v0.5-addendum.md，整理自 CLR-SITELIST-004，尚未合入正本）寫「Admin 看全平台；主站台 A
        的管理員/站長看 A 及其子樹」，字面上把 Admin 與管理員並列為不同角色；v0.6 明定不存在具跨站權限的獨立角色，看全平台者為根站台 admin 的管理員。CLR-PLATFORMRULE-001／CLR-SITELIST-004
        正文（範圍由所屬站台決定）與 v0.6 一致，差異僅在草稿用語，但需確認是否另有平台層級 Admin 角色。
      options:
      - 不存在獨立 Admin 角色：草稿的「Admin」即根站台 admin 的管理員（與 v0.6 一致），草稿用語待修正
      - 另有平台層級 Admin 角色具跨站權限（草稿字面），v0.6 需補定義該角色
