    SPEC-REDPACKET-002@0.1 saveAdd() 定義（見 Q05）
  - REQ-REDPACKET-003/Q04（未定義，minor）：稽核倍數可否為負數、可否為小數及其上限；中獎機率、紅包金額、累積門檻與總預算允許的小數位數（可否為 0 已由 Q06 定義）
  - REQ-REDPACKET-008/Q02（未定義，minor）：換算為核心貨幣後金額的小數位數與捨入方式（影響是否剛好達門檻）
  - REQ-REDPACKET-008/Q03（未定義，major）：已計入累計的注單事後被取消、派彩取消、廢除取消結算或重新結算時，累計是否扣回；若已因此產生紅包（待開啟或已入帳），是否作廢或追回
  - REQ-REDPACKET-010/Q02（未定義，minor）：單筆注單使累計一次跨越多個門檻並在途中達到單週期上限時：(1) 觸發上限那筆注單在最後一個紅包之後的剩餘流水是否仍計入本週期累計（第 319 行「停止累計」的生效時點；影響之後因升級改用上限較高的規則時的進度）；(2)
    同一筆注單產生的多個紅包，紅包明細「週期累計」各顯示什麼值（第 239、280 行只示範單一紅包的情形）
  - REQ-REDPACKET-011/Q02（未定義，major）：活動進行中修改場館「日結時間」時，當前週期的結束點與後續週期如何切分（是否產生過長／過短週期、待開啟紅包何時作廢）
  - REQ-REDPACKET-011/Q04（未定義，major）：場館「日結時間」修改後何時生效（即時、下一個營業日或其他）；SPEC-SITELIST-001@0.6 只寫明額度上限與場次逾時時間「修改後即時生效」，日結時間的生效時點在目標與各參考皆未定義。此為
    Q02（週期如何切分）的前提
  - REQ-REDPACKET-014/Q03（未定義，minor）：範圍只限機台帳號的呈現細節（Q02 已定義 4.1 交易類型與 4.4 稽核明細類型新增「紅包」、線上與機台皆有）：(1) 4.1 機台視角擴充（SPEC-ARCADE-001@0.7
    機台交易紀錄）的交易類型下拉是否加入「紅包」，以及紅包列的場次編號、交易狀態、核實狀態、請求／實際金額、完成時間、來源等欄位值；(2) 4.4 稽核明細中機台帳號紅包列的金額單位（現行欄位標示 USDT，機台為 TWD）
  - REQ-REDPACKET-016/Q02（未定義，minor）：新總預算小於或等於目前總預算時，後端是否同樣拒絕及其回應（狀態碼與訊息）；前端行為已由 SPEC-REDPACKET-002@0.1 confirmBudget() 定義（見
    Q05）
  - REQ-REDPACKET-016/Q04（未定義，minor）：追加預算的操作紀錄於何處檢視（後台操作紀錄頁或紅包明細），以及可檢視的角色
  - REQ-REDPACKET-017/Q03（未定義，minor）：「同一站台」的範圍：主站台與其子站台的紅包活動是否各自獨立判斷重疊；某站台的活動是否涵蓋子站台的會員
  - REQ-REDPACKET-022/Q03（未定義，minor）：CSV 的欄位清單與順序、是否含總計列、狀態與作廢原因的輸出文字、時間格式（SPEC-REDPACKET-002@0.1 的匯出只是示意 toast，未定義檔案內容）
  - REQ-REDPACKET-022/Q04（衝突，major）：預設規則關閉且只有一組等級規則的活動，紅包明細是否顯示「規則」篩選
  - REQ-REDPACKET-023/Q02（未定義，minor）：線上站台紅包明細、匯出 CSV、取消排程的可操作角色與可見範圍（管轄範圍是否含子站台）；SPEC-SYSADMIN-001@0.1 6.5 未載明權限
  - REQ-REDPACKET-023/Q03（未定義，minor）：無權限角色直接呼叫新增、追加預算、取消排程或紅包明細 API 時，後端的回應（狀態碼與訊息）
  - REQ-REDPACKET-024/Q02（未定義，minor）：操作員在機台場館紅包明細的「唯讀」是否包含「匯出 CSV」（目標第 257 行只寫自身場館唯讀；進入路徑已由 Q04 定義）
  - REQ-REDPACKET-024/Q03（缺文件，minor）：操作員越權操作（含直接呼叫 API）時的系統回應：按鈕隱藏或停用、後端回應與訊息
  - REQ-REDPACKET-025/Q02（未定義，major）：紅包入帳（分數增加）與場次的關係：(1) 場次因輸光歸零結束後才開啟紅包，分數由 0 轉正時是否建立新場次（SPEC-ARCADE-001@0.7 只列開分、入金會建立場次）；(2)
    紅包入帳歸屬哪個場次（紅包明細的場次編號是產生當下的場次，第 237 行，入帳時可能已不同）；(3) 場館日結報表「依場次明細」維度的期初／期末餘額與紅包金額如何計入
  - REQ-REDPACKET-026/Q02（未定義，major）：「機台場館啟用紅包」的方式、粒度與時點：全平台一次解除，或依場館個別啟用（有無開關、由誰設定）；啟用前的行為見 Q03
  - REQ-REDPACKET-027/Q02（未定義，minor）：「尚有紅包未開啟，交易完成後將作廢」提示出現後，玩家或店員可否先返回、不送出交易（以便先開啟紅包），還是提示後交易直接繼續
  - REQ-REDPACKET-028/Q02（未定義，major）：櫃檯對機台帳號執行人工出金（扣分）時，是否視同「出金」而作廢待開啟紅包、作廢原因為何；人工入金（補分）是否影響待開啟紅包。待確認期間的鎖定、取消與被取代後恢復、過渡期前台出金已由
    Q03 定義
  - REQ-REDPACKET-030/Q02（缺文件，major）：機台紅包稽核倍數大於 0 時，紅包產生的稽核如何影響機台洗分／出金的核可金額：正本的扣除規則以出金設定 TWD 倍數大於 0 為條件、計入交易僅開分與入金，出金設定為 0
    倍而紅包倍數大於 0 時是否仍扣除
  - REQ-REDPACKET-031/Q02（未定義，minor）：「週期即將重置」提示從重置前多久開始顯示（SPEC-REDPACKET-002@0.1 不含前台）；「目前累計」的定義見 Q03
  - REQ-REDPACKET-032/Q02（未定義，minor）：紅包金額欄在列表中的位置；「依場次明細」維度的紅包金額與期初／期末餘額如何計入（依 REQ-REDPACKET-025 Q02 的場次歸屬）。營業日依入帳歸屬（第 350
    行「當日已入帳」）見 Q01，總計列與 CSV 見 Q03
