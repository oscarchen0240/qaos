  ambiguities:
  - requirement_id: REQ-REDPACKET-003
    ambiguity:
      level: minor
      description: 後端是否同樣拒絕不合法的紅包活動設定（門檻、上限、總預算、活動幣種、等級規則、權重表、活動名稱、活動時間），以及直接呼叫 API 時的回應（狀態碼與訊息）；前端阻擋方式與提示文字已由 SPEC-REDPACKET-002@0.1
        saveAdd() 定義（見 Q05）；稽核倍數可否為負數、可否為小數及其上限；中獎機率、紅包金額、累積門檻與總預算允許的小數位數（可否為 0 已由 Q06 定義）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-008
    ambiguity:
      level: major
      description: 換算為核心貨幣後金額的小數位數與捨入方式（影響是否剛好達門檻）；已計入累計的注單事後被取消、派彩取消、廢除取消結算或重新結算時，累計是否扣回；若已因此產生紅包（待開啟或已入帳），是否作廢或追回
      raised_level: major
  - requirement_id: REQ-REDPACKET-010
    ambiguity:
      level: minor
      description: 單筆注單使累計一次跨越多個門檻並在途中達到單週期上限時：(1) 觸發上限那筆注單在最後一個紅包之後的剩餘流水是否仍計入本週期累計（第 319 行「停止累計」的生效時點；影響之後因升級改用上限較高的規則時的進度）；(2)
        同一筆注單產生的多個紅包，紅包明細「週期累計」各顯示什麼值（第 239、280 行只示範單一紅包的情形）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-011
    ambiguity:
      level: major
      description: 活動進行中修改場館「日結時間」時，當前週期的結束點與後續週期如何切分（是否產生過長／過短週期、待開啟紅包何時作廢）；場館「日結時間」修改後何時生效（即時、下一個營業日或其他）；SPEC-SITELIST-001@0.6
        只寫明額度上限與場次逾時時間「修改後即時生效」，日結時間的生效時點在目標與各參考皆未定義。此為 Q02（週期如何切分）的前提
      raised_level: major
  - requirement_id: REQ-REDPACKET-014
    ambiguity:
      level: minor
      description: 範圍只限機台帳號的呈現細節（Q02 已定義 4.1 交易類型與 4.4 稽核明細類型新增「紅包」、線上與機台皆有）：(1) 4.1 機台視角擴充（SPEC-ARCADE-001@0.7 機台交易紀錄）的交易類型下拉是否加入「紅包」，以及紅包列的場次編號、交易狀態、核實狀態、請求／實際金額、完成時間、來源等欄位值；(2)
        4.4 稽核明細中機台帳號紅包列的金額單位（現行欄位標示 USDT，機台為 TWD）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-015
    ambiguity:
      level: minor
      description: 決策點皆已定義（原始等級保留）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-016
    ambiguity:
      level: minor
      description: 新總預算小於或等於目前總預算時，後端是否同樣拒絕及其回應（狀態碼與訊息）；前端行為已由 SPEC-REDPACKET-002@0.1 confirmBudget() 定義（見 Q05）；追加預算的操作紀錄於何處檢視（後台操作紀錄頁或紅包明細），以及可檢視的角色
      raised_level: minor
  - requirement_id: REQ-REDPACKET-017
    ambiguity:
      level: minor
      description: 「同一站台」的範圍：主站台與其子站台的紅包活動是否各自獨立判斷重疊；某站台的活動是否涵蓋子站台的會員
      raised_level: minor
  - requirement_id: REQ-REDPACKET-019
    ambiguity:
      level: minor
      description: 決策點皆已定義（原始等級保留）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-021
    ambiguity:
      level: minor
      description: 決策點皆已定義（原始等級保留）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-022
    ambiguity:
      level: major
      description: CSV 的欄位清單與順序、是否含總計列、狀態與作廢原因的輸出文字、時間格式（SPEC-REDPACKET-002@0.1 的匯出只是示意 toast，未定義檔案內容）；預設規則關閉且只有一組等級規則的活動，紅包明細是否顯示「規則」篩選
      raised_level: major
  - requirement_id: REQ-REDPACKET-023
    ambiguity:
      level: minor
      description: 線上站台紅包明細、匯出 CSV、取消排程的可操作角色與可見範圍（管轄範圍是否含子站台）；SPEC-SYSADMIN-001@0.1 6.5 未載明權限；無權限角色直接呼叫新增、追加預算、取消排程或紅包明細
        API 時，後端的回應（狀態碼與訊息）
      raised_level: minor
  - requirement_id: REQ-REDPACKET-024
    ambiguity:
      level: minor
      description: 操作員在機台場館紅包明細的「唯讀」是否包含「匯出 CSV」（目標第 257 行只寫自身場館唯讀；進入路徑已由 Q04 定義）；操作員越權操作（含直接呼叫 API）時的系統回應：按鈕隱藏或停用、後端回應與訊息
      raised_level: minor
  - requirement_id: REQ-REDPACKET-025
    ambiguity:
      level: major
      description: 紅包入帳（分數增加）與場次的關係：(1) 場次因輸光歸零結束後才開啟紅包，分數由 0 轉正時是否建立新場次（SPEC-ARCADE-001@0.7 只列開分、入金會建立場次）；(2) 紅包入帳歸屬哪個場次（紅包明細的場次編號是產生當下的場次，第
        237 行，入帳時可能已不同）；(3) 場館日結報表「依場次明細」維度的期初／期末餘額與紅包金額如何計入
      raised_level: major
  - requirement_id: REQ-REDPACKET-026
    ambiguity:
      level: major
      description: 「機台場館啟用紅包」的方式、粒度與時點：全平台一次解除，或依場館個別啟用（有無開關、由誰設定）；啟用前的行為見 Q03
      raised_level: major
  - requirement_id: REQ-REDPACKET-027
    ambiguity:
      level: minor
      description: 「尚有紅包未開啟，交易完成後將作廢」提示出現後，玩家或店員可否先返回、不送出交易（以便先開啟紅包），還是提示後交易直接繼續
      raised_level: minor
  - requirement_id: REQ-REDPACKET-028
    ambiguity:
      level: major
      description: 櫃檯對機台帳號執行人工出金（扣分）時，是否視同「出金」而作廢待開啟紅包、作廢原因為何；人工入金（補分）是否影響待開啟紅包。待確認期間的鎖定、取消與被取代後恢復、過渡期前台出金已由 Q03 定義
      raised_level: major
  - requirement_id: REQ-REDPACKET-030
    ambiguity:
      level: major
      description: 機台紅包稽核倍數大於 0 時，紅包產生的稽核如何影響機台洗分／出金的核可金額：正本的扣除規則以出金設定 TWD 倍數大於 0 為條件、計入交易僅開分與入金，出金設定為 0 倍而紅包倍數大於 0 時是否仍扣除
      raised_level: major
  - requirement_id: REQ-REDPACKET-031
    ambiguity:
      level: minor
      description: 「週期即將重置」提示從重置前多久開始顯示（SPEC-REDPACKET-002@0.1 不含前台）；「目前累計」的定義見 Q03
      raised_level: minor
  - requirement_id: REQ-REDPACKET-032
    ambiguity:
      level: minor
      description: 紅包金額欄在列表中的位置；「依場次明細」維度的紅包金額與期初／期末餘額如何計入（依 REQ-REDPACKET-025 Q02 的場次歸屬）。營業日依入帳歸屬（第 350 行「當日已入帳」）見 Q01，總計列與
        CSV 見 Q03
      raised_level: minor
  constraints:
  - text: 活動幣種、重置方式、規則設定（含預設規則開關、各規則適用等級、累積門檻、單週期上限、獎勵設定、稽核倍數）於建立後不可修改；需調整時取消排程後重建。唯一例外為總預算可追加調高。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L337
      quote: 活動幣種、重置方式、規則設定（含預設規則開關、各規則適用等級、累積門檻、單週期上限、獎勵設定、稽核倍數）於建立後不可修改；需調整時取消排程後重建。唯一例外為總預算可追加調高
    requirement_id: REQ-REDPACKET-002
  - text: 儲存時檢查：活動幣種至少勾選一個；預設規則關閉時至少須有一個等級規則；每個等級規則至少勾選一個等級；一個等級只能屬於一個規則；各生效規則（關閉的預設規則不檢查）的累積門檻須大於 0、單週期發放上限須為大於 0 的整數；總預算有填時須大於
      0；權重表至少一列、各列金額須大於 0、機率合計須為 100%（否則阻擋儲存）；活動名稱最多 25 字元。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L334
      quote: 累積門檻須大於 0；單週期發放上限須為大於 0 的整數；總預算有填時須大於 0
    requirement_id: REQ-REDPACKET-003
  - text: 同一站台同一時間僅能有一個進行中的紅包活動，排程時間重疊時阻擋儲存；重疊判斷只計「進行中」與「排程中」的活動，已取消的活動不占用時段，取消後可立即以相同時段重建。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L331
      quote: 同一站台同一時間僅能有一個進行中的紅包活動（排程時間重疊時阻擋儲存）
    requirement_id: REQ-REDPACKET-017
  - text: 機台帳號參與紅包為排除規則「6.5 優惠活動」的逐項解除（僅解除紅包類型，其餘優惠類型維持排除），須經政策層處理，不得在紅包功能內硬編碼帳號類型判斷。機台場館的後台入口：優惠活動管理僅開放「紅包」類型，活動排程僅顯示「紅包活動」子分頁。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L332
      quote: 機台帳號參與紅包為開發包⑥排除規則「6.5 優惠活動」的逐項解除（僅解除紅包類型，其餘優惠類型維持排除），須經政策層處理，不得在紅包功能內硬編碼帳號類型判斷
    requirement_id: REQ-REDPACKET-026
  - text: 紅包入帳不受場館額度上限阻擋（不因額度拒絕已達標的獎勵），但入帳後計入全場館餘額合計，影響後續開分／入金的額度檢核。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L330
      quote: 紅包入帳不受場館額度上限阻擋（不因額度拒絕已達標的獎勵），但入帳後計入全場館餘額合計，影響後續開分／入金的額度檢核
    requirement_id: REQ-REDPACKET-029
