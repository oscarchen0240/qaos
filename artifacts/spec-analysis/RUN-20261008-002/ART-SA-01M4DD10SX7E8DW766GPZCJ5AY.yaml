  summary: SPEC-REDPACKET-001 v0.1 同版本重新分析（RUN-20261008-002，spec-change-impact，reason=declaration_changed；target_decl_rev
    8）。宣告變動為新增 normative 參考 SPEC-REDPACKET-002@0.1（紅包互動原型 proto，reference_only，僅涵蓋後台畫面：活動列表、新增表單、成本試算、追加預算、紅包明細；無前台，CSV 只是示意
    toast）。依 Oscar 決定，proto 中明確的判定邏輯、驗證規則、提示文字與格式化規則視為規則依據，mock 資料與固定 NOW 不是規則。沿用 R001 全部 33 條需求、103 條 AC、70 個決策點的 ID；新增 20
    條 AC、13 個決策點，未新增或移除需求。原 25 個未定決策點：3 個改為已定（REQ-016 Q03 活動狀態、REQ-019 Q02 試算格式、REQ-021 Q02 差異百分比），9 個拆分為已定＋未定（未定部分沿用原 question_id），13
    個維持未定。剩 24 個非 E1 決策點：21 個未定義（E4）、2 個缺文件（E3：開發包③、⑧）、1 個新衝突（E2：紅包明細規則篩選顯示條件，目標第 222 行 vs proto）；無 critical，全部需求 ACTIVE。另修正
    AC-REDPACKET-0191 計算錯誤、補 REQ-001／004／012 漏收的 known_rules、REQ-011 新增日結時間生效時點決策點、釐清 REQ-014 Q02／Q03 範圍。
  scope:
    in_scope:
    - 紅包活動的建立表單、規則設定（預設規則／等級規則）與驗證
    - 累計基準、幣種換算、匯率取價失敗、循環發放、單週期上限、重置週期
    - 金額抽定、紅包狀態與作廢、直接入帳（交易紀錄、稽核明細）
    - 總預算占用／用罄／追加預算、同站台僅一個進行中活動
    - 活動排程列表、成本試算與整體試算、紅包明細（頂部摘要、篩選、列表、CSV）
    - 線上與機台場館的角色權限
    - 機台場館差異：帳號層級累計、前台彈窗、洗分／出金作廢與交易鎖、額度上限、稽核警告、排除規則逐項解除
    - 場館日結報表新增紅包金額欄與驗算式
    - 線上前台紅包入口顯示與開啟
    out_of_scope:
    - 前台動畫與版面細節（spec 明示由前台設計另定）
    - 幣安 API 的取價方式與更新頻率（spec 明示由工程定義）
    - 客戶版手冊建置工具（tools/build_manual.py、build_manual.sh 的 drop_sections）與既有章節文件的改版作業本身
    - 既有其他優惠活動類型（充值、簽到、熱門、彩金）的行為
    - 會員等級設定（6.2）本身的方案管理與升降級規則
