  ambiguities:
  - requirement_id: REQ-SITELIST-012
    ambiguity:
      level: major
      description: 「站長固定為當前所在層，不可修改」是否為前端限制、還是後端也必須驗證並拒絕不同的上層站台？spec 未區分前後端層級
      options:
      - 僅前端限制即符合規格（後端不需額外驗證）
      - 前後端皆須拒絕，後端也必須驗證並拒絕站長帶入非當前層的上層站台
  - requirement_id: REQ-SITELIST-016
    ambiguity:
      level: major
      description: Admin「可切換為任意狀態」是否包含「待開通」？「待開通」在 §站台狀態一節的觸發方式僅列「新建站台自動設定」，未列為可被 Admin 手動選取的目標狀態
      options:
      - 任意狀態含待開通，Admin 可把既有站台手動改回待開通
      - 任意狀態不含待開通，待開通只能由新建站台觸發，Admin 手動切換的目標僅限開通/暫停/關閉
  - requirement_id: REQ-SITELIST-023
    ambiguity:
      level: major
      description: 刪除有子站台的站台時，系統應如何處理其子站台？spec 未提及
      options:
      - 阻擋刪除，需先刪除或移轉所有子站台
      - 串聯刪除所有子站台（含孫層）
      - 子站台自動上移為根層或掛到被刪站台的上層
