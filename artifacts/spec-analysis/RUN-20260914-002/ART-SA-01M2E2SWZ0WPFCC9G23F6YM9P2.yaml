  summary: 站台列表：管理平台下所有子站台（無限層級父子關係）。涵蓋站台類型（線上/機台，建立後鎖定、子站台強制繼承）、核心貨幣（主站台設定、子站台繼承、建立後鎖定、依類型過濾）、機台專屬欄位（場館幣別/地址/聯絡人/額度上限/場次逾時/日結時間，作用範圍不含子站台）、五種狀態與更新待審自動觸發、角色權限（Admin
    全權 vs 站長侷限管轄範圍）、上層站台選取與循環防護、模板權限與開通必填規則、網域管理、階層瀏覽、篩選搜尋、代碼/名稱驗證、刪除確認。為實體機台各開發包的前置相依。
  scope:
    in_scope:
    - 站台 CRUD
    - 站台類型與核心貨幣鎖定規則
    - 機台專屬欄位
    - 五種狀態與轉換
    - 角色權限分層
    - 階層與篩選
    - 網域管理
    - 模板規則
    out_of_scope:
    - 機台專屬欄位實際業務邏輯（額度檢核、場次判定等，見 SPEC-CASHFLOW-001）
    - 操作員角色定義（見機台場館平台規則）
    - 客戶可見章節
