    T0-iter0，basis_hash 8742a49f…、closure 空、references undeclared）。查閱目標全文。共 49 條需求（沿用 REQ-CASHFLOW-001～044，新增 REQ-CASHFLOW-045,
    REQ-CASHFLOW-046, REQ-CASHFLOW-047, REQ-CASHFLOW-048, REQ-CASHFLOW-049，由主 session 配發）、92 條 AC、59 個決策點；spec 與既有 CLR 衝突並已依
    CLR 裁決 4 個（REQ-CASHFLOW-007/Q01←CLR-CASHFLOW-005 rev 0、REQ-CASHFLOW-008/Q01←CLR-CASHFLOW-008 rev 1、REQ-CASHFLOW-009/Q01←CLR-CASHFLOW-005
    rev 0、REQ-CASHFLOW-030/Q02←CLR-CASHFLOW-006 rev 0）；待決 3 個（REQ-CASHFLOW-042/Q01 undefined major、REQ-CASHFLOW-043/Q01 undefined
    major、REQ-CASHFLOW-045/Q02 undefined minor）。v0.2 實質變更：餘額帶小數時出金收據面額與門檻 0 全洗照記含小數、照樣清空、平台只記面額（REQ-CASHFLOW-013、020；CLR-CASHFLOW-007
    已依 v0.2 原文回答）；入金帶訂單編號（REQ-CASHFLOW-045）；進行中場次期末餘額顯示查詢當下分數（REQ-CASHFLOW-046）；手動取消角色用詞 Admin→管理員。待確認出金的管理員手動取消依 spec 原文與
    CLR-CASHFLOW-008 恢復（REQ-CASHFLOW-026）。spec v0.2 未吸收已落地的 CLR-CASHFLOW-004／005／006 與 CLR-CASHFLOW-008 的入金結論；依 Oscar 決定以
    CLR 為準（2026-10-12 追加 SPEC-CASHFLOW-001@0.2 適用紀錄），原文不一致處記為 doc_issues。另補 v0.1 RM 既有缺口 3 條（REQ-CASHFLOW-047～049：前台場次隔離、交易類型與會員列表累計、機台憑證
    JWT 驗證）。
  scope:
    in_scope:
    - 四種金流（開分、入金、洗分、出金）的平台端規則與 API 對接（req-keyin／req-keyout／req-cashin／end-cashin／req-cashout／end-cashout）
    - PENDING 生命週期與收斂（含待確認出金的管理員手動取消）
    - 額度上限、門檻、餘額帶小數的計算
    - 未成立原因與狀態碼
    - 場次的開始、結束、歸屬與場次資訊
    out_of_scope:
    - 機台端畫面與印表機行為（機台廠商實作）
    - 交易紀錄查詢／機台交易紀錄的畫面與手動取消入口（SPEC-TXLOG，開發包④）
    - 洗分出金核實與場館日結報表（開發包⑤）
    - 場館設定欄位（站台列表 v07）與機台帳號（創建會員帳號 v01）
    - 紅包對機台出金的影響（SPEC-REDPACKET-001@0.2，不屬本包）
    - 開分招待（v07 定案本次不實作）
