  summary: 18 紅利（彩金）幣別盤點：核心規則是除彩金活動與遊戲商JACKPOT/促銷派彩外，其餘紅利一律發站台系統幣別，不受玩家實際下注/存款幣別影響；另盤點人工存款不進任何活動與累積統計、存款通道幣別與系統幣別不一致時的四個已知風險（目前無真實管道可測，本次排除）。逐節比對後：機台帳號天然不參與返水/優惠活動/簽到已由
    SPEC-ACCOUNT-001/SPEC-PLATFORMRULE-001 驗證，本包一般紅利規則只在線上站台測；人工存款「錢進錢包」本身已由 SPEC-BONUSCCY-001 REQ-BONUSCCY-003 驗證，不重複；存款通道幣別不一致的四個❌情境與存款活動門檻換算，spec
    明講目前無真實管道可測，本次排除，等真實TWD存款通道開通後再補測。
  scope:
    in_scope:
    - 一般紅利（返水/代理佣金/推薦獎勵/簽到/首存次存/累積存款）發放幣別=站台系統幣別，不受其他已啟用幣別影響
    - 彩金活動的自選發放幣別例外
    - 遊戲商JACKPOT/促銷派彩的下注錢包幣別規則
    - 推薦註冊金的收款人站台幣別歸屬
    - 人工存款不觸發任何活動與累積統計（但稽核流水正常計入）
    out_of_scope:
    - 機台帳號的返水/優惠活動/簽到——天然排除，已由 SPEC-ACCOUNT-001/SPEC-PLATFORMRULE-001 驗證
    - 人工存款「錢進錢包」本身與未指定幣別預設站台系統幣別——已由 SPEC-BONUSCCY-001 REQ-BONUSCCY-003 驗證
    - 存款通道幣別與站台系統幣別不一致的四個❌情境——目前無真實非系統幣別存款管道可測
    - 存款活動門檻的匯率換算——spec 明講現行程式尚未實作，屬已知未來落差非本次驗證對象
