  ambiguities:
  - requirement_id: REQ-REDPACKET-003
    ambiguity:
      level: minor
      raised_level: minor
      description: 除權重表機率合計外，其餘驗證（門檻、上限、總預算、活動幣種、等級規則、活動名稱字數）不符時系統如何回應：前端阻擋方式與提示文字、後端是否同樣拒絕及回應；稽核倍數的允許範圍（可否為 0、可否為小數、上限）、中獎機率與紅包金額／門檻／總預算允許的小數位數
  - requirement_id: REQ-REDPACKET-008
    ambiguity:
      level: major
      raised_level: major
      description: 換算為核心貨幣後金額的小數位數與捨入方式（影響是否剛好達門檻）；已計入累計的注單事後被取消、派彩取消、廢除取消結算或重新結算時，累計是否扣回；若已因此產生紅包（待開啟或已入帳），是否作廢或追回；依原文推定：以結算時點落在活動期間內為準（活動開始前下注、開始後結算者計入）；設計
        TC 時以此為前提
  - requirement_id: REQ-REDPACKET-010
    ambiguity:
      level: minor
      raised_level: minor
      description: 單筆注單使累計跨越多個門檻而超過上限時，超出上限部分的累計是否保留、紅包明細「週期累計」顯示值為何
  - requirement_id: REQ-REDPACKET-011
    ambiguity:
      level: major
      raised_level: major
      description: 活動進行中修改場館「日結時間」時，當前週期的結束點與後續週期如何切分（是否產生過長／過短週期、待開啟紅包何時作廢）
  - requirement_id: REQ-REDPACKET-014
    ambiguity:
      level: minor
      raised_level: minor
      description: 機台帳號的紅包入帳在 4.1 機台視角（交易類型篩選、場次編號、核實狀態、來源等欄位）如何呈現；4.4 稽核明細機台帳號的紅包列欄位與單位（現列為 USDT）
  - requirement_id: REQ-REDPACKET-015
    ambiguity:
      level: minor
      raised_level: minor
      description: 依原文推定：用罄為活動層級，一次抽出金額超過剩餘即整個活動（所有規則、帳號）停止產生，即使其他規則金額較小仍可容納；觸發用罄的該門檻累計已消耗、不補發。設計 TC 時以此為前提
  - requirement_id: REQ-REDPACKET-016
    ambiguity:
      level: minor
      raised_level: minor
      description: 輸入的新總預算小於或等於目前總預算時，系統如何回應（確認鈕停用或送出後提示、提示文字、後端是否拒絕）；活動狀態（排程中、進行中、已結束、已取消）的定義、判定時點與在列表上的顯示位置（6.5.1 既有排程列表沒有狀態欄）；已結束或已取消的活動是否仍列於排程列表；追加預算的操作紀錄於何處檢視（後台操作紀錄頁或紅包明細），以及可檢視的角色
  - requirement_id: REQ-REDPACKET-017
    ambiguity:
      level: minor
      raised_level: minor
      description: 「同一站台」的範圍：主站台與其子站台的紅包活動是否各自獨立判斷重疊；某站台的活動是否涵蓋子站台的會員
  - requirement_id: REQ-REDPACKET-019
    ambiguity:
      level: minor
      raised_level: minor
      description: 試算數值的顯示格式：期望金額與最高成本的小數位數、成本占比以百分比或比值顯示及其位數
  - requirement_id: REQ-REDPACKET-021
    ambiguity:
      level: minor
      raised_level: minor
      description: 差異百分比的計算基準（(實際－期望)÷期望）與小數位數；實際等於期望時的顯示與色標
  - requirement_id: REQ-REDPACKET-022
    ambiguity:
      level: minor
      raised_level: minor
      description: CSV 的欄位清單與順序、是否含總計列、狀態與作廢原因的輸出文字、時間格式
  - requirement_id: REQ-REDPACKET-023
    ambiguity:
      level: minor
      raised_level: minor
      description: 線上站台紅包明細、匯出 CSV、取消排程的可操作角色與可見範圍（管轄範圍是否含子站台）；SPEC-SYSADMIN-001@0.1 6.5 未載明權限；無權限角色直接呼叫新增、追加預算、取消排程或紅包明細
        API 時，後端的回應（狀態碼與訊息）
  - requirement_id: REQ-REDPACKET-024
    ambiguity:
      level: minor
      raised_level: minor
      description: 操作員能否進入優惠活動管理與活動排程列表、能否匯出紅包明細 CSV（「唯讀」是否含匯出）；操作員越權操作（含直接呼叫 API）時的系統回應：按鈕隱藏或停用、後端回應與訊息
  - requirement_id: REQ-REDPACKET-025
    ambiguity:
      level: major
      raised_level: major
      description: 紅包入帳（分數增加）與場次的關係：最後一局輸光使場次歸零結束後才開啟紅包，分數由 0 轉正時是否建立新場次；紅包入帳歸屬哪個場次（紅包明細的場次編號是產生當下的場次，可能與入帳時不同）；場館日結報表「依場次明細」維度的期初／期末餘額是否含紅包
  - requirement_id: REQ-REDPACKET-026
    ambiguity:
      level: major
      raised_level: major
      description: 參考文件（SPEC-PLATFORMRULE-001@0.2、SPEC-ARCADE-001@0.7）仍記載機台帳號不參與任何優惠活動、機台場館隱藏優惠活動管理；本 spec 明示啟用時同步改版，行為以本
        spec 為準；「機台場館啟用紅包」的方式與時點：是全平台一次上線、依場館開關啟用，或另有設定；啟用前機台場館的選單與機台帳號是否仍完全排除（目前正本與開發包⑥皆為排除）
  - requirement_id: REQ-REDPACKET-027
    ambiguity:
      level: minor
      raised_level: minor
      description: 「尚有紅包未開啟」提示是否為可取消的確認視窗（玩家可先返回開啟紅包）或僅告知後繼續交易；店員以鑰匙選單洗分時提示顯示於何處
  - requirement_id: REQ-REDPACKET-028
    ambiguity:
      level: major
      raised_level: major
      description: 櫃檯對機台帳號人工出金（或人工入金）是否視同出金而作廢待開啟紅包；出金停在「待確認」（不設逾時）期間紅包是否一直不可開啟，Admin 手動取消或被新出金取代時是否恢復；過渡期由前台完成的出金是否同樣適用
  - requirement_id: REQ-REDPACKET-030
    ambiguity:
      level: major
      raised_level: major
      description: 機台紅包稽核倍數大於 0 時，紅包產生的稽核如何影響機台洗分／出金的核可金額：正本的扣除規則以出金設定 TWD 倍數大於 0 為條件、計入交易僅開分與入金，出金設定為 0 倍而紅包倍數大於 0 時是否仍扣除
  - requirement_id: REQ-REDPACKET-031
    ambiguity:
      level: minor
      raised_level: minor
      description: 「週期即將重置」提示的起始時點（重置前多久）；「目前累計」顯示的是本週期累計總額還是距下一個紅包的累計（範例中週期累計 1,084 與超出 84 並存）
  - requirement_id: REQ-REDPACKET-032
    ambiguity:
      level: minor
      raised_level: minor
      description: 紅包金額欄的位置、是否進總計列與 CSV、在「依場次明細」維度的值（場次歸屬見 REQ-REDPACKET-025 Q02），以及營業日依入帳時間歸屬的確認
  constraints:
  - text: 活動幣種、重置方式、規則設定（含預設規則開關、各規則適用等級、累積門檻、單週期上限、獎勵設定、稽核倍數）於建立後不可修改；需調整時取消排程後重建。唯一例外為總預算可追加調高。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L337
      quote: 活動幣種、重置方式、規則設定（含預設規則開關、各規則適用等級、累積門檻、單週期上限、獎勵設定、稽核倍數）於建立後不可修改；需調整時取消排程後重建。唯一例外為總預算可追加調高
    requirement_id: REQ-REDPACKET-002
  - text: 儲存時檢查：活動幣種至少勾選一個；預設規則關閉時至少須有一個等級規則；每個等級規則至少勾選一個等級；一個等級只能屬於一個規則；各生效規則（關閉的預設規則不檢查）的累積門檻須大於 0、單週期發放上限須為大於 0 的整數；總預算有填時須大於
      0；權重表至少一列、各列金額須大於 0、機率合計須為 100%（否則阻擋儲存）；活動名稱最多 25 字元。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L334
      quote: 累積門檻須大於 0；單週期發放上限須為大於 0 的整數；總預算有填時須大於 0
    requirement_id: REQ-REDPACKET-003
  - text: 同一站台同一時間僅能有一個進行中的紅包活動，排程時間重疊時阻擋儲存；重疊判斷只計「進行中」與「排程中」的活動，已取消的活動不占用時段，取消後可立即以相同時段重建。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L331
      quote: 同一站台同一時間僅能有一個進行中的紅包活動（排程時間重疊時阻擋儲存）
    requirement_id: REQ-REDPACKET-017
  - text: 機台帳號參與紅包為排除規則「6.5 優惠活動」的逐項解除（僅解除紅包類型，其餘優惠類型維持排除），須經政策層處理，不得在紅包功能內硬編碼帳號類型判斷。機台場館的後台入口：優惠活動管理僅開放「紅包」類型，活動排程僅顯示「紅包活動」子分頁。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L332
      quote: 機台帳號參與紅包為開發包⑥排除規則「6.5 優惠活動」的逐項解除（僅解除紅包類型，其餘優惠類型維持排除），須經政策層處理，不得在紅包功能內硬編碼帳號類型判斷
    requirement_id: REQ-REDPACKET-026
  - text: 紅包入帳不受場館額度上限阻擋（不因額度拒絕已達標的獎勵），但入帳後計入全場館餘額合計，影響後續開分／入金的額度檢核。
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L330
      quote: 紅包入帳不受場館額度上限阻擋（不因額度拒絕已達標的獎勵），但入帳後計入全場館餘額合計，影響後續開分／入金的額度檢核
    requirement_id: REQ-REDPACKET-029
  edge_case_candidates:
  - text: 活動開始前下注、開始後才結算的注單，以結算時點計入（推定）；活動結束後才結算的注單不計入
    requirement_id: REQ-REDPACKET-008
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L309
  - text: 非核心貨幣注單換算後的小數金額剛好使累計等於門檻（等於即產生）
    requirement_id: REQ-REDPACKET-008
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L95
  - text: 已計入的注單事後被取消或廢除結算，累計與已產生紅包的處理（待 Q03 釐清）
    requirement_id: REQ-REDPACKET-008
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L309
  - text: 幣安 API 對某幣種無交易對、且該幣種從未成功取價：注單不計入且之後不補計
    requirement_id: REQ-REDPACKET-009
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L312
  - text: 單筆注單使累計一次跨越多個門檻，循環產生多個紅包（未超過上限）
    requirement_id: REQ-REDPACKET-010
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L315
  - text: 單筆注單跨越門檻數超過剩餘上限，只產生到上限為止
    requirement_id: REQ-REDPACKET-010
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L319
  - text: 重置方式「不重置」時，單週期發放上限等同整個活動期間的上限
    requirement_id: REQ-REDPACKET-010
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L67
  - text: 機台場館週期切分點剛好等於日結時間（例：UTC+0 20:00:00 整）結算的注單歸屬
    requirement_id: REQ-REDPACKET-011
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L313
  - text: 每週一／每月 1 日重置於機台場館日結時間切分，而非日曆日 00:00
    requirement_id: REQ-REDPACKET-011
    spec_reference:
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: L302
