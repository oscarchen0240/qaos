  open_questions:
  - REQ-REDPACKET-003/Q03：除權重表機率合計外，其餘驗證（門檻、上限、總預算、活動幣種、等級規則、活動名稱字數）不符時系統如何回應：前端阻擋方式與提示文字、後端是否同樣拒絕及回應
  - REQ-REDPACKET-003/Q04：稽核倍數的允許範圍（可否為 0、可否為小數、上限）、中獎機率與紅包金額／門檻／總預算允許的小數位數
  - REQ-REDPACKET-008/Q02：換算為核心貨幣後金額的小數位數與捨入方式（影響是否剛好達門檻）
  - REQ-REDPACKET-008/Q03：已計入累計的注單事後被取消、派彩取消、廢除取消結算或重新結算時，累計是否扣回；若已因此產生紅包（待開啟或已入帳），是否作廢或追回
  - REQ-REDPACKET-010/Q02：單筆注單使累計跨越多個門檻而超過上限時，超出上限部分的累計是否保留、紅包明細「週期累計」顯示值為何
  - REQ-REDPACKET-011/Q02：活動進行中修改場館「日結時間」時，當前週期的結束點與後續週期如何切分（是否產生過長／過短週期、待開啟紅包何時作廢）
  - REQ-REDPACKET-014/Q03：機台帳號的紅包入帳在 4.1 機台視角（交易類型篩選、場次編號、核實狀態、來源等欄位）如何呈現；4.4 稽核明細機台帳號的紅包列欄位與單位（現列為 USDT）
  - REQ-REDPACKET-016/Q02：輸入的新總預算小於或等於目前總預算時，系統如何回應（確認鈕停用或送出後提示、提示文字、後端是否拒絕）
  - REQ-REDPACKET-016/Q03：活動狀態（排程中、進行中、已結束、已取消）的定義、判定時點與在列表上的顯示位置（6.5.1 既有排程列表沒有狀態欄）；已結束或已取消的活動是否仍列於排程列表
  - REQ-REDPACKET-016/Q04：追加預算的操作紀錄於何處檢視（後台操作紀錄頁或紅包明細），以及可檢視的角色
  - REQ-REDPACKET-017/Q03：「同一站台」的範圍：主站台與其子站台的紅包活動是否各自獨立判斷重疊；某站台的活動是否涵蓋子站台的會員
  - REQ-REDPACKET-019/Q02：試算數值的顯示格式：期望金額與最高成本的小數位數、成本占比以百分比或比值顯示及其位數
  - REQ-REDPACKET-021/Q02：差異百分比的計算基準（(實際－期望)÷期望）與小數位數；實際等於期望時的顯示與色標
  - REQ-REDPACKET-022/Q03：CSV 的欄位清單與順序、是否含總計列、狀態與作廢原因的輸出文字、時間格式
  - REQ-REDPACKET-023/Q02：線上站台紅包明細、匯出 CSV、取消排程的可操作角色與可見範圍（管轄範圍是否含子站台）；SPEC-SYSADMIN-001@0.1 6.5 未載明權限
  - REQ-REDPACKET-023/Q03：無權限角色直接呼叫新增、追加預算、取消排程或紅包明細 API 時，後端的回應（狀態碼與訊息）
  - REQ-REDPACKET-024/Q02：操作員能否進入優惠活動管理與活動排程列表、能否匯出紅包明細 CSV（「唯讀」是否含匯出）
  - REQ-REDPACKET-024/Q03：操作員越權操作（含直接呼叫 API）時的系統回應：按鈕隱藏或停用、後端回應與訊息
  - REQ-REDPACKET-025/Q02：紅包入帳（分數增加）與場次的關係：最後一局輸光使場次歸零結束後才開啟紅包，分數由 0 轉正時是否建立新場次；紅包入帳歸屬哪個場次（紅包明細的場次編號是產生當下的場次，可能與入帳時不同）；場館日結報表「依場次明細」維度的期初／期末餘額是否含紅包
  - REQ-REDPACKET-026/Q02：「機台場館啟用紅包」的方式與時點：是全平台一次上線、依場館開關啟用，或另有設定；啟用前機台場館的選單與機台帳號是否仍完全排除（目前正本與開發包⑥皆為排除）
  - REQ-REDPACKET-027/Q02：「尚有紅包未開啟」提示是否為可取消的確認視窗（玩家可先返回開啟紅包）或僅告知後繼續交易；店員以鑰匙選單洗分時提示顯示於何處
  - REQ-REDPACKET-028/Q02：櫃檯對機台帳號人工出金（或人工入金）是否視同出金而作廢待開啟紅包；出金停在「待確認」（不設逾時）期間紅包是否一直不可開啟，Admin 手動取消或被新出金取代時是否恢復；過渡期由前台完成的出金是否同樣適用
  - REQ-REDPACKET-030/Q02：機台紅包稽核倍數大於 0 時，紅包產生的稽核如何影響機台洗分／出金的核可金額：正本的扣除規則以出金設定 TWD 倍數大於 0 為條件、計入交易僅開分與入金，出金設定為 0 倍而紅包倍數大於 0
    時是否仍扣除
  - REQ-REDPACKET-031/Q02：「週期即將重置」提示的起始時點（重置前多久）；「目前累計」顯示的是本週期累計總額還是距下一個紅包的累計（範例中週期累計 1,084 與超出 84 並存）
  - REQ-REDPACKET-032/Q02：紅包金額欄的位置、是否進總計列與 CSV、在「依場次明細」維度的值（場次歸屬見 REQ-REDPACKET-025 Q02），以及營業日依入帳時間歸屬的確認
