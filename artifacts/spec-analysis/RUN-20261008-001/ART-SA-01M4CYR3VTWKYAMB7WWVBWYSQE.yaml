  spec_id: SPEC-REDPACKET-001
  spec_version: '0.1'
  content_hash: 590d35efdb117e817095dcb61758afcab0b2c118924b8363a8966130938ca2a7
  summary: SPEC-REDPACKET-001 v0.1（紅包，優惠活動新類型，內部未開放）全新分析，無前版 RM。依派發包（basis_hash 24ee3102…、target_decl_rev 7、references declared）查閱目標全文與
    6 份 depth=1 normative 參考（SYSADMIN 6.2/6.5、REPORTS 4.1/4.2/4.4、SITELIST 核心貨幣與日結時間、PLATFORMRULE 全文、DAILYREPORT 全文、ARCADE
    相關章節）及 informative 的 COMMON。共 33 條需求、103 條 AC、70 個決策點。主要待決：注單事後取消時累計與紅包的處理、場館日結時間異動對週期的影響、機台紅包與場次的關係、櫃檯人工出金／待確認出金對紅包的作廢與鎖定、機台紅包稽核對洗分出金核可金額的影響（缺開發包③）、機台場館啟用紅包的方式與時點；另有多項
    minor 細節（拒絕回應、數值精度、顯示格式、CSV、權限細項；部分缺 proto 與開發包⑧）。參考文件（REPORTS 交易類型、ARCADE／PLATFORMRULE 排除規則與選單、DAILYREPORT 驗算式）尚未同步本
    spec 的異動，記為 doc_issues；本 spec 明示對客戶開放或機台場館啟用時才改版。
  scope:
    in_scope:
    - 紅包活動的建立表單、規則設定（預設規則／等級規則）與驗證
    - 累計基準、幣種換算、匯率取價失敗、循環發放、單週期上限、重置週期
    - 金額抽定、紅包狀態與作廢、直接入帳（交易紀錄、稽核明細）
    - 總預算占用／用罄／追加預算、同站台僅一個進行中活動
    - 活動排程列表、成本試算與整體試算、紅包明細（頂部摘要、篩選、列表、CSV）
    - 線上與機台場館的角色權限
    - 機台場館差異：帳號層級累計、前台彈窗、洗分／出金作廢與交易鎖、額度上限、稽核警告、排除規則逐項解除
    - 場館日結報表新增紅包金額欄與驗算式
    - 線上前台紅包入口顯示與開啟
    out_of_scope:
    - 前台動畫與版面細節（spec 明示由前台設計另定）
    - 幣安 API 的取價方式與更新頻率（spec 明示由工程定義）
    - 客戶版手冊建置工具（tools/build_manual.py、build_manual.sh 的 drop_sections）與既有章節文件的改版作業本身
    - 既有其他優惠活動類型（充值、簽到、熱門、彩金）的行為
    - 會員等級設定（6.2）本身的方案管理與升降級規則
