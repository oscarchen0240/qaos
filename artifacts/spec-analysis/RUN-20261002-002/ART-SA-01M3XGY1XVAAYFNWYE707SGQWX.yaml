  - text: 時區：後台所有時間欄位一律顯示為 UTC+0——此為跨頁通用規則，已在 TXLOG/CASHOUT 等包個別欄位的 Requirement 中驗證過（如交易時間、核實時間），本包不重複逐頁測試
