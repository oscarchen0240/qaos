  content_hash: b36b764b775645ab44d5d128916e5560d6e94157fc2f5ebf95048c10ae22cc0a
  summary: 機台場館平台規則 v0.2（ba-spec main 現況，紅包開發包 2026-09-29 快照附檔）：與 v0.1 的差異僅在「角色與權限」——Admin 改名「管理員」並說明每個站台皆有、權限範圍跟著所屬站台走（自身站台及其所有子站台，與站長可見範圍相同、差別在操作深度）；管理員可見場館範圍由「全部場館」改為「自身站台及所有子站台下的場館（根站台
    admin 的管理員＝全部場館）」；機台交易紀錄查詢與場館日結報表的管理員權限由「全部」改為「管轄範圍」。其餘章節（排除規則、後台選單、遊戲更新、Free Spin 例外、出金設定 TWD 頁籤、對既有章節的影響、業務規則）逐字未變。v0.1
    RM 經 CLR-PLATFORMRULE-001～003 落地的定案，v0.2 原文均未收錄，本版逐條帶入並於 spec_reference.location／rejection_contract 註明出處：CLR-001（管理員＞站長＞操作員、可見範圍由所屬站台決定）經比對與
    v0.2「管理員每個站台皆有、範圍隨所屬站台」一致，無衝突，帶入 REQ-013／015／025；CLR-002（REQ-011 維持 rejection_contract.defined=false、不湊負向 TC）帶入 REQ-011；CLR-003（操作員可進入注單查詢與稽核明細、限自身場館）帶入
    REQ-014／024，v0.2 權限表仍未補列兩列。需求共 25 條：沿用 22 條（version 1；其中 REQ-016／017／020 僅術語 Admin→管理員、REQ-022 新增 minor ambiguity、各條 quote
    改為 v0.2 逐字原文，語意不變）、修改 2 條（REQ-013、REQ-015，version 2）、新增 1 條（REQ-025 管理員可見場館範圍）。延續 v0.1 的刻意排除：場館日結報表的角色範圍屬 SPEC-DAILYREPORT-001（其
    v0.2 已將 REQ-DAILYREPORT-001 改為管理員＝管轄範圍），本包不重複。
  scope:
    in_scope:
    - 排除規則表中尚未被其他包驗證過的項目（出金審核、稽核明細顯示、Free Spin）
    - 機台場館後台選單顯示/隱藏規則
    - 操作員角色的完整權限矩陣（含補充其他包遺漏的角色維度；含 CLR-PLATFORMRULE-003 新增的注單查詢／稽核明細存取權）
    - v0.2 管理員可見場館範圍（自身站台及所有子站台下的場館；根站台 admin 的管理員＝全部場館）
    - 機台交易紀錄查詢依角色的可見範圍（v0.2 管理員改為管轄範圍）
    - 機台場館遊戲更新規則
    - 出金設定 TWD 頁籤
    out_of_scope:
    - 已由 SPEC-ACCOUNT-001 驗證的新增機台/編輯機台/機台憑證/機台停用啟用的管理員與站長權限、排除規則必須實作項與天然不會發生兩表
    - 已由 SPEC-DAILYREPORT-001 驗證的場館日結報表角色範圍（v0.2 管理員＝管轄範圍已由 SPEC-DAILYREPORT-001 v0.2 REQ-DAILYREPORT-001 v2 承接）
    - 已由 SPEC-CASHFLOW-001 驗證的稽核倍數計算規則本身
    - 已由 SPEC-ACCOUNT-001 驗證的機台場館前台不開放自行註冊
    - 管理員對自身所屬站台的三項限制（上層站台、刪除、切為「開通」）與角色指派——v0.2 明文指向 SPEC-SITELIST-001 v0.6「角色與權限」，由該 spec 承接
    - CLR-PLATFORMRULE-001 延伸的「站長不可自由選取上層站台」——屬 SPEC-SITELIST-001 範圍
