  ambiguities:
  - requirement_id: REQ-PLATFORMRULE-022
    ambiguity:
      level: minor
      description: §機台場館的遊戲更新「開啟方式」與§業務規則「遊戲更新預設停用」只寫由站長啟用（操作員不可），但§角色與權限表「| 機台場館遊戲啟用（遊戲商管理） | 可操作 | 可操作 | 不可 |」管理員欄為「可操作」；v0.2
        明定管理員每個站台皆有，管理員能否於遊戲商管理啟用因新增／更新而停用的遊戲，兩處寫法不一致（v0.1 已存在，v0.2 未修）。不影響現有三條 AC（站長可、操作員不可、平台不代開），只影響是否另需管理員視角的 AC
      options:
      - 依權限表：管理員與站長皆可啟用（CLR-PLATFORMRULE-001 管理員層級高於站長亦支持此讀法）；「開啟方式」的「站長」為相對於平台／操作員的寫法
      - 依遊戲更新章節：僅站長可啟用，管理員不可（權限表管理員欄需修正）
  constraints:
  - text: 排除規則必須做成集中、可逐項解除的政策層（policy），各功能不得自行硬編碼帳號類型判斷——這是架構/實作規範，非使用者可觀察的黑箱行為，不另立可獨立驗證的 Requirement（選單面的可觀察部分見 REQ-PLATFORMRULE-011）
