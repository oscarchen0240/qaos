payload:
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.2'
  content_hash: 75afb8365acd507227a69c28bcb44390f3bffbfd7df71ef308461017a161978b
  summary: SPEC-REDPACKET-001 v0.2（紅包 spec v02，2026-10-10，依 CLR-REDPACKET-001～025 與前台設計稿定案，「尚未定案」為「無」）重新分析，spec-change-impact
    0.1→0.2（RUN-20261012-001 T0，派發包 T0-iter0，basis_hash 4022002f…、target_decl_rev 11、references declared）。查閱目標全文、SPEC-REDPACKET-002@0.2（proto
    v02）全文、SPEC-ROLEPERM-001@0.2 全文，以及 SYSADMIN 0.1、REPORTS 0.1、SITELIST 0.7、PLATFORMRULE 0.2、DAILYREPORT 0.3、ARCADE 0.8、CASHFLOW
    0.2、TXLOG 0.1 的相關章節。共 39 條需求（沿用 REQ-REDPACKET-001～033，新增 034～039，由主 session 配發）、200 條 AC、105 個決策點；待決 7 個（conflict 5 個、undefined
    2 個），其餘皆由目標原文或 normative 參考定義。v0.2 原文已定案的事項（CLR-REDPACKET-026～037、039～046、049、050 與 048 的觸發條件）一律以 defined_in_target 記錄並以
    prior_clarifications 指回原 CLR。主要異動：①前台改為線上與機台共用的右側紅包圖示（暗／亮、不自動彈窗、結束即移除）與紅包視窗（最高／實際金額、滿格進度與距下一個紅包、本期已獲得、倒數、重置時間、總獎池、領取獎勵（N）與確認領取視窗、重置前
    1 小時提示），新增 REQ-034～037，REQ-031 改為共用視窗的進度與提示（AC-0313 移除、AC-0311 修訂），REQ-027 改為機台結算／洗分前可取消的確認視窗與交易處理中停用（AC-0271、0272 移除、0273
    修訂）；②機台：入帳歸屬入帳當下的場次、無場次時建立新場次（REQ-025）、洗分／出金後才達標直接以已作廢建立（新 REQ-038）、人工出金作廢與人工入金不影響（REQ-028）、稽核扣除不再以出金設定倍數大於 0 為前提（REQ-030）、隨版本一次上線不設場館開關（REQ-026，AC-0263
    移除）；③後台：活動狀態欄、追加預算確認鈕停用與後端拒絕、7.4 操作紀錄（REQ-016）、各站台獨立（REQ-017）、CSV 格式（REQ-022）、機台操作員可匯出與越權「無權限」（REQ-024）、數值最多 1 位小數與驗證回應（新
    REQ-039）；④報表：4.1 機台視角「紅包」交易類型、4.4 單位 TWD（REQ-014）、日結報表紅包金額欄位置與依場次明細（REQ-032）；⑤累計：幣種換算四捨五入 2 位、注單取消／重結算照實扣減（REQ-008）、達上限餘數保留（REQ-010）、日結時間變更立即生效且不倒退（REQ-011）。
  scope:
    in_scope:
    - 新增紅包活動表單：活動類型、條件、活動幣種、派發幣種、活動時間、重置方式、總預算、規則設定、前台圖示、預設語系、活動名稱／說明欄多語系
    - 規則設定（預設規則開關、等級規則、適用等級）、規則適用、會員等級變動、切換會員等級方案
    - 累計基準、幣種換算（四捨五入 2 位）、取價失敗、注單取消／重結算、循環發放、單週期上限與餘數保留
    - 重置週期（線上 UTC+0、機台場館日結時間）與日結時間變更
    - 獎勵方式、金額抽定、紅包狀態與作廢、直接入帳（錢包、4.1 交易紀錄、4.4 稽核明細，含機台視角）
    - 總預算占用、用罄、追加預算（含後端拒絕與 7.4 操作紀錄）、活動狀態
    - 活動排程列表、取消排程、成本試算與整體試算、紅包明細（頂部區塊、篩選、列表、CSV）
    - 表單驗證、數值精度與驗證回應
    - 線上站台與機台場館的角色權限、越權回應
    - 機台差異：紅包屬於機台、入帳場次、洗分／出金作廢（含人工出金）、交易進行中鎖、洗分／出金後才達標、額度上限、稽核倍數與稽核扣除、排除規則逐項解除與一次上線
    - 前台：共用紅包圖示與視窗、領取流程與確認領取視窗、線上專屬顯示、機台結算／洗分前確認視窗
    - 場館日結報表紅包金額欄與餘額驗算式；站台列表日結時間變更提示
    out_of_scope:
    - 前台動畫與版面細節（目標第 213 行：由前台設計另定）
    - 其他優惠活動類型（充值、簽到、熱門、彩金）與 6.5 優惠活動管理既有行為（SPEC-SYSADMIN-001）
    - 幣安匯率 API 的取價方式與更新頻率（目標第 380 行：依既有串接，由工程定義）
    - 機台金流、場次引擎與洗分出金核實本身的規則（SPEC-CASHFLOW-001／SPEC-ARCADE-001），僅分析與紅包交互的部分
    - 7.4 操作紀錄頁面本身的欄位與權限（實體機台正本規劃新增）
    - tools/build_manual.py 的手冊產出調整（目標第 433 行）
