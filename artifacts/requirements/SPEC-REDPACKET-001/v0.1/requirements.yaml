  version: 1
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.1'
  type: functional
  title: 機台場館差異：紅包屬於機台、帳號層級累計、固定預設規則與 TWD
  statement: 機台帳號為一台機台所有玩家共用，紅包在機台場館屬於機台、不屬於玩家：累計是整台機台跨玩家的流水，達標當下坐在台前的人開啟並取得。參加對象為該場館所有機台帳號（不參與會員等級），僅預設規則且固定開啟；活動幣種固定 TWD
    不顯示；派發幣種為核心貨幣 TWD。
  acceptance_criteria:
  - ac_id: AC-REDPACKET-0251
    given: 機台 M1 由玩家甲、乙先後遊玩
    when: 兩人流水合計達門檻
    then: 產生 1 個屬於機台帳號 M1 的紅包，由當下在台前的玩家開啟
  - ac_id: AC-REDPACKET-0252
    given: 機台場館的紅包活動
    when: 檢視參加對象
    then: 該場館所有機台帳號皆適用預設規則
  - ac_id: AC-REDPACKET-0253
    given: 機台場館
    when: 紅包入帳
    then: 以 TWD 入帳
  spec_reference:
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    location: §線上與機台的差異 L31
    quote: 紅包在機台場館屬於機台、不屬於玩家
  ambiguity:
    level: major
    raised_level: major
    description: 紅包入帳（分數增加）與場次的關係：最後一局輸光使場次歸零結束後才開啟紅包，分數由 0 轉正時是否建立新場次；紅包入帳歸屬哪個場次（紅包明細的場次編號是產生當下的場次，可能與入帳時不同）；場館日結報表「依場次明細」維度的期初／期末餘額是否含紅包
