- requirement_id: REQ-REDPACKET-003
  version: 1
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.1'
  type: constraint
  title: 表單驗證：門檻、上限、預算、權重表、等級規則與活動名稱
  statement: 儲存時檢查：活動幣種至少勾選一個；預設規則關閉時至少須有一個等級規則；每個等級規則至少勾選一個等級；一個等級只能屬於一個規則；各生效規則（關閉的預設規則不檢查）的累積門檻須大於 0、單週期發放上限須為大於 0 的整數；總預算有填時須大於
    0；權重表至少一列、各列金額須大於 0、機率合計須為 100%（否則阻擋儲存）；活動名稱最多 25 字元。
  acceptance_criteria:
  - ac_id: AC-REDPACKET-0031
    given: 權重表中獎機率合計為 99%
    when: 點擊「儲存」
    then: 阻擋儲存，活動未建立
  - ac_id: AC-REDPACKET-0032
    given: 某規則累積門檻填 0 或單週期發放上限填 1.5
    when: 點擊「儲存」
    then: 不允許建立（門檻須 > 0、上限須為 > 0 的整數）
  - ac_id: AC-REDPACKET-0033
    given: 預設規則關閉且未新增任何等級規則
    when: 點擊「儲存」
    then: 不允許建立
  - ac_id: AC-REDPACKET-0034
    given: 預設規則關閉、其欄位留空，另有一組合法的等級規則
    when: 點擊「儲存」
    then: 關閉的預設規則不檢查，可成功建立
  - ac_id: AC-REDPACKET-0035
    given: 活動名稱輸入 26 字元
    when: 儲存
    then: 不允許超過 25 字元
  spec_reference:
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    location: §業務規則與驗證 L334
    quote: 累積門檻須大於 0；單週期發放上限須為大於 0 的整數；總預算有填時須大於 0
  ambiguity:
    level: minor
    raised_level: minor
    description: 除權重表機率合計外，其餘驗證（門檻、上限、總預算、活動幣種、等級規則、活動名稱字數）不符時系統如何回應：前端阻擋方式與提示文字、後端是否同樣拒絕及回應；稽核倍數的允許範圍（可否為 0、可否為小數、上限）、中獎機率與紅包金額／門檻／總預算允許的小數位數
  risk: high
  status: ACTIVE
