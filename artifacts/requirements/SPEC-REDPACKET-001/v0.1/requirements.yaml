- requirement_id: REQ-REDPACKET-006
  version: 1
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.1'
  type: functional
  title: 會員等級變動時立即改用新規則
  statement: 活動期間會員升降級時立即改用新等級的規則：本週期累計進度與已產生數保留；變動當下不觸發產生；下一筆計入的注單結算時以新規則的累積門檻判斷（累計已達多個門檻時循環產生）；單週期上限以本週期已產生數（含變動前）對照新規則上限，已達上限即停止累計直到重置；已產生的紅包（含待開啟）金額與稽核倍數維持產生當下的規則。預設規則關閉、會員變動至沒有等級規則的等級時停止累計；累計進度保留、待開啟紅包仍可開啟；同週期內變動回有規則的等級時依該規則續計。
  acceptance_criteria:
  - ac_id: AC-REDPACKET-0061
    given: 玩家 B（2・Bronze，預設規則門檻 1,000）本週期累計 1,200、已產生 1 個
    when: 會員升為 3・Silver（等級規則 1 門檻 800）
    then: 不觸發產生；累計（距下一個紅包 200）與已產生數 1 保留
  - ac_id: AC-REDPACKET-0062
    given: 承上
    when: 下一筆注單結算使累計 +700
    then: 以門檻 800 判斷，200＋700 ≥ 800 產生 1 個 30 USDT 紅包，超出 100 續計
  - ac_id: AC-REDPACKET-0063
    given: 玩家升級前本週期已產生 8 個，新規則上限 8
    when: 升級後有注單結算
    then: 已達新規則上限，停止累計直到重置
  - ac_id: AC-REDPACKET-0064
    given: 時點 1 依預設規則產生的待開啟紅包 10 USDT
    when: 升級後開啟該紅包
    then: 入帳 10 USDT，稽核倍數依產生當下的預設規則
  - ac_id: AC-REDPACKET-0065
    given: 預設規則關閉，會員降至沒有等級規則的等級
    when: 注單結算
    then: 停止累計；累計進度保留；原待開啟紅包仍可開啟
