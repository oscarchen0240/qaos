  title: 活動總預算：占用、用罄與恢復
  statement: 活動總預算選填（空白表示不限），單位為核心貨幣，所有規則共用一池。設有總預算時，預算占用＝已入帳＋待開啟紅包金額；紅包作廢即釋放占用。紅包產生當下抽出的金額大於剩餘預算時，不產生該紅包，活動標示「預算用罄」並停止產生紅包；用罄期間帳號累計照常推進，達標的門檻不產生、不補發；追加預算或占用被釋放後恢復產生。
  acceptance_criteria:
