  title: 機台完成洗分／出金時作廢待開啟紅包與交易進行中鎖
  statement: 機台帳號完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢（作廢原因機台洗分／機台出金），累計進度不歸零。紅包入帳與機台洗分／出金使用同一把帳號鎖：洗分或出金請求送出後、交易完成前，紅包不可開啟；交易完成依上述作廢，交易取消或未成立則恢復可開啟。
