- requirement_id: REQ-REDPACKET-004
  version: 1
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.1'
  type: functional
  title: 規則設定：預設規則開關、等級規則與適用等級選項
  statement: 規則同時決定參加資格與門檻／獎勵，不另設受眾範圍。預設規則以開關設定「其餘等級參加」，預設開啟；開啟時套用所有未被等級規則勾選的等級序號（含日後切換方案才出現的序號），欄位必填；關閉時其餘等級不參加、欄位隱藏。等級規則選填，可新增多組、可移除，每組勾選適用等級（選項讀取
    6.2 生效會員等級方案，顯示「VIP 等級序號・等級名稱」）；一個等級序號只能屬於一個規則，已被其他規則勾選的等級停用並標示所屬規則。規則依序命名「預設規則」「等級規則 1」…；預設規則開啟時標題旁顯示實際套用的等級。機台場館僅預設規則且固定開啟，不顯示開關與「新增等級規則」。
  acceptance_criteria:
  - ac_id: AC-REDPACKET-0041
    given: 線上站台新增紅包活動
    when: 開啟規則設定
    then: 預設規則開關預設為開啟，規則欄位必填
  - ac_id: AC-REDPACKET-0042
    given: 等級規則 1 已勾選 3・Silver
    when: 於等級規則 2 檢視適用等級
    then: 3・Silver 停用並標示屬於等級規則 1
  - ac_id: AC-REDPACKET-0043
    given: 預設規則開啟，等級規則 1 勾選 3、4
    when: 檢視預設規則標題
    then: 顯示實際套用的其餘等級（如 1・Starter、2・Bronze、5・Platinum，及其他未勾選的等級序號）
  - ac_id: AC-REDPACKET-0044
    given: 機台場館新增紅包活動
