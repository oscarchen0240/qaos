    title: 機台帳號的投注不計入任何上層加盟商/代理的傭金與返傭計算基數
    statement: 機台帳號即使掛在某加盟商底下，該加盟商的加盟傭金與代理返傭計算基數，皆不含機台帳號產生的流水——這是機台帳號流水量級遠大於線上玩家、若不排除會使整間場館的流水被誤算成該加盟商業績的底層防護規則
    acceptance_criteria:
