- requirement_id: REQ-MEMBER-005
  version: 3
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  type: constraint
  title: 可提領餘額須大於 10 USDT 才可申請出金
  statement: 會員申請出金時，「提領申請金額」本身須大於等於 10 USDT 才可出金；門檻判斷對象是會員實際填寫送出的提領金額，與後台帳務資訊「可提領餘額」欄位的精確數值無關（只要可提領餘額足以支應本次提領金額即可），也與出金手續費計算無關。spec
    §2.1.4原文僅寫「可提領餘額...須大於10 USDT方可申請出金」，字面上用「大於」(不含10)且以「可提領餘額」為判斷對象，與實際產品行為（大於等於/含10、判斷對象是提領申請金額本身）有落差，已由 Oscar 2026-09-16
    以實際操作確認並多次更正，建議另案更新spec原文。
  acceptance_criteria:
  - ac_id: AC-MEMBER-007
    given: 會員可提領餘額足夠支應提領金額，提領申請金額本身為 9.99 USDT（邊界值，未達 10 USDT 門檻）
    when: 送出提領申請
    then: 不可出金——提領申請金額本身未達 10 USDT 門檻
  - ac_id: AC-MEMBER-008
    given: 會員可提領餘額足夠支應提領金額，提領申請金額本身恰為 10.00 USDT（邊界值，剛好達到門檻）
    when: 送出提領申請
    then: 可正常出金，申請成功送出——提領申請金額本身剛好達到 10 USDT 門檻（含）
  spec_reference:
    spec_id: SPEC-MEMBER-001
    spec_version: '0.2'
    location: §2.1.4 帳戶資訊
    quote: 可提領餘額｜目前符合提領條件的金額（單位USDT）；須大於 10 USDT 方可申請出金
  ambiguity: null
  risk: high
  status: ACTIVE
  behavior_kind: boundary
  rejection_contract:
    defined: true
    description: 規則已明確定義，是個精確的數值邊界規則，容易被誤實作成「大於」(不含10)而非「大於等於」(含10)，值得用邊界值驗證（此描述已於2026-09-16修正方向：原文誤把「大於等於」當成錯誤實作，實際上「大於等於」才是正確方向）
    spec_reference:
      spec_id: SPEC-MEMBER-001
