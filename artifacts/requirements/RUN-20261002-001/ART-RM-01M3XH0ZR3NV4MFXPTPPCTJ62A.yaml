    statement: 管理員對其管轄範圍內的子站台可切換為任意可手動選取的狀態（待開通／開通／暫停／關閉；「更新待審」僅由系統觸發、不開放手動選取）；「任意狀態」含待開通沿用 v0.4 RM 經 Oscar 2026-09-14 確認的解讀，v0.6
      原文明寫「含開通」。站長不論對子站台或自身站台，僅可切換為「暫停」或「關閉」，其他狀態顯示但不可選，選取則阻擋儲存。管理員對自身所屬站台僅可切「暫停」「關閉」，不可切為「開通」（見 REQ-SITELIST-035）。依 §站台狀態：「開通」由上層站台的管理員手動切換，站台自身的管理員與站長皆不可自行切為開通；「暫停」「關閉」可由該站台的管理員或站長切換，上層站台的管理員亦可；暫停的站台可由上層站台的管理員恢復為開通。操作員後台不顯示站台列表頁面，不具任何狀態調整能力（沿用
      v0.4 RM）。暫停與關閉在功能上皆代表該站台無法入金；場館站台（含自行經營的機台主站台）不是「開通」時，該場館所有機台一律無法運作（SPEC-CASHFLOW-001 所指場館站台非開通狀態，回 7-OUT OF SERVICE，沿用
      v0.4 RM）。
    acceptance_criteria:
    - ac_id: AC-SITELIST-0161
      given: 以管理員登入
      when: 編輯其管轄範圍內某子站台並切換狀態
      then: 可選擇待開通、開通、暫停、關閉任一種；「更新待審」不可手動選取（v0.4 寫「五種狀態任一種」與更新待審不開放手動選取矛盾，依原文修正）
    - ac_id: AC-SITELIST-0162
      given: 以站長登入
      when: 編輯子站台或自身所屬站台並切換狀態
      then: 只能選擇暫停或關閉；其餘選項顯示但不可點選
    - ac_id: AC-SITELIST-0163
      given: 以站長登入
      when: 嘗試切換為暫停或關閉以外的狀態
      then: 系統阻擋儲存
    - ac_id: AC-SITELIST-0164
      given: 以操作員身分登入後台
      when: 尋找站台列表頁面（選單或直接訪問）
      then: 站台列表頁面不對操作員開放，操作員無法檢視或調整任何站台的狀態
    - ac_id: AC-SITELIST-0165
      given: 某站台狀態為暫停，模板已填
      when: 該站台上層站台的管理員將其切換為開通並儲存
      then: 系統接受，狀態變更為開通
      spec_reference:
        spec_id: SPEC-SITELIST-001
        spec_version: '0.6'
        location: §站台狀態/暫停
        quote: 站台暫停服務，可由上層站台的管理員恢復為開通
    - ac_id: AC-SITELIST-0166
      given: 以某站台自身的管理員或站長登入，該站台狀態為開通
      when: 將自身所屬站台切換為暫停或關閉並儲存
      then: 系統接受
      spec_reference:
        spec_id: SPEC-SITELIST-001
        spec_version: '0.6'
        location: §站台狀態/暫停、關閉
        quote: 該站台的管理員或站長切換，上層站台的管理員亦可
    spec_reference: &id016
      spec_id: SPEC-SITELIST-001
      spec_version: '0.6'
      location: §角色與權限/子站台：狀態切換、自身站台：狀態切換 + §站台狀態 + §業務規則與驗證/狀態（站長編輯）
      quote: 子站台：狀態切換 | 可切換為任意狀態（含「開通」） | 僅可切換為「暫停」或「關閉」
    ambiguity:
      level: minor
      description: §站台狀態以「上層站台的管理員」表述開通／恢復開通的切換者，但 §角色與權限 寫管理員對管轄範圍內所有子站台有完整權限（含切為開通）；「上層站台的管理員」是僅指直屬上層站台的管理員，還是任一管轄範圍涵蓋該站台的祖先站台管理員（例如根站台
        admin 的管理員）未明寫。
      options:
      - 任一祖先站台的管理員皆可（管轄範圍涵蓋該站台即可），「上層站台」為簡稱
      - 僅直屬上層站台的管理員可切為開通，更上層的管理員不可
    risk: high
    status: DRAFT
    behavior_kind: constraint
    rejection_contract:
      defined: true
      description: 其他狀態顯示但不可選、選取則阻擋儲存，即為拒絕方式
      spec_reference:
        spec_id: SPEC-SITELIST-001
        spec_version: '0.6'
        location: §業務規則與驗證/狀態（站長編輯）
        quote: 僅可切換為「暫停」或「關閉」；選取其他狀態時阻擋儲存
    supersedes_version: 1
