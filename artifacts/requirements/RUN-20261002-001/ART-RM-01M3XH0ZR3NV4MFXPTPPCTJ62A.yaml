    title: 管理員為每站台皆有的角色，操作範圍限管轄範圍
    statement: 「管理員」為每個站台皆有的角色，權限範圍跟著所屬站台走（自身站台及其所有子站台），層級高於同站台的站長；管理員與站長可見範圍相同，差別在操作深度——管理員可操作管轄範圍內的所有欄位並指派角色，站長部分欄位唯讀。根站台
      admin 的管理員因其子樹即全平台而等同看到全部站台，是所屬站台的位置造成，不是角色本身有跨站權限；v0.4「Admin 為平台方最高管理者、可見全部站台」作廢。角色層級為管理員＞站長＞操作員，可見範圍由所屬站台決定、權限層級由角色決定（CLR-PLATFORMRULE-001，與
      v0.6 一致）。
    acceptance_criteria:
    - ac_id: AC-SITELIST-0371
      given: 以主站台 A 的管理員登入
      when: 對平行主站台 B 底下的站台執行編輯或狀態切換（含以站台 ID 直接呼叫 API）
      then: 無法操作，B 底下的站台不在其管轄範圍
    - ac_id: AC-SITELIST-0372
      given: 以根站台 admin 的管理員登入
      when: 編輯任一主站台或其子站台的上層站台、模板與狀態
      then: 可依子站台權限操作（等同全平台皆為其子站台）
    - ac_id: AC-SITELIST-0373
      given: 同一站台的管理員與站長
      when: 分別編輯該站台底下的同一子站台
      then: 管理員可修改上層站台、模板並切換任意狀態；站長的上層站台與模板唯讀、狀態僅可切暫停或關閉
      spec_reference:
        spec_id: SPEC-SITELIST-001
        spec_version: '0.6'
        location: §角色與權限
        quote: 管理員對**子站台**有完整權限；對**自身所屬站台**則受限，見下表末三列
    spec_reference: &id037
      spec_id: SPEC-SITELIST-001
      spec_version: '0.6'
      location: §角色與權限（角色定義附註）+ §功能說明/權限分層（角色層級與範圍原則與 CLR-PLATFORMRULE-001 一致）
      quote: 「管理員」**每個站台皆有**，權限範圍跟著所屬站台走（自身站台及其所有子站台），層級高於同站台的站長
    ambiguity:
      level: minor
      description: QA 增補草稿（specs/_drafts/SPEC-SITELIST-001-v0.5-addendum.md，整理自 CLR-SITELIST-004，尚未合入正本）寫「Admin 看全平台；主站台 A
        的管理員/站長看 A 及其子樹」，字面上把 Admin 與管理員並列為不同角色；v0.6 明定不存在具跨站權限的獨立角色，看全平台者為根站台 admin 的管理員。CLR-PLATFORMRULE-001／CLR-SITELIST-004
        正文（範圍由所屬站台決定）與 v0.6 一致，差異僅在草稿用語，但需確認是否另有平台層級 Admin 角色。
      options:
      - 不存在獨立 Admin 角色：草稿的「Admin」即根站台 admin 的管理員（與 v0.6 一致），草稿用語待修正
      - 另有平台層級 Admin 角色具跨站權限（草稿字面），v0.6 需補定義該角色
    risk: high
    status: DRAFT
    behavior_kind: constraint
    rejection_contract:
