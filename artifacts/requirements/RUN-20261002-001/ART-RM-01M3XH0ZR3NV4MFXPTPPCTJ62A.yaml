    title: 站台類型由主站台選定，子站台強制繼承（根站台不參與）
    statement: 站台類型於主站台（根站台 admin 底下第一層）選定，其下所有子站台一律與主站台同類型、不可個別選擇；根站台 admin 本身不是主站台，其類型（線上）不往下傳，故於根站台底下新增主站台時可自由選擇線上或機台，核心貨幣依所選類型連動建立（v0.6
      原文已明寫；與 CLR-SITELIST-010 定案一致，即 v0.4 RM 以「admin 例外」記載的同一行為，語意不變）。子站台類型繼承為後端強制：透過 API 帶入與上層（主站台）不同的站台類型會被拒絕，不只是前端唯讀（CLR-SITELIST-001，v0.6
      原文未載）。新站台建立、核心貨幣連動建立的同時，系統會自動在該新站台自己的「鏈上錢包管理」啟用對應幣別；此連動不依賴根站台 admin 的鏈上錢包管理是否已啟用該幣別。鏈上錢包管理為每站台各自一份、建立後可隨時調整的幣種出入金開關（止損用），核心貨幣為建立時定案、不可更改也不能於後台關閉的屬性，兩者性質不同但有上述連動（CLR-SITELIST-012，修正
      CLR-SITELIST-011 的「完全無關」；v0.6 原文未載）。
    acceptance_criteria:
