    spec_reference: &id011
      spec_id: SPEC-SITELIST-001
      spec_version: '0.6'
      location: §角色與權限/可見站台範圍 + §根站台/可見者 + §階層結構與逐層瀏覽/起始層顯示、可見範圍（越權回應依 CLR-SITELIST-004；範圍模型與 CLR-PLATFORMRULE-001 一致）
      quote: 自身站台及所有子站台（不含平行或上層站台）；根站台的管理員＝全平台
    ambiguity:
      level: major
      description: 站長的可見／管轄範圍在 v0.6 有兩種寫法：§角色與權限表與 §階層結構寫「自身站台及所有子站台（不含平行或上層站台）」，§主站台寫「站長的管轄範圍即自身所屬的主站台及其所有子站台」；當站長所屬站台不是主站台（位於更深層）時，兩者結果不同。另
        CLR-PLATFORMRULE-001 的案例 ZZAA00264 為「指派在 admin 的站長」，但 v0.6 §根站台「可見者」只列根站台自身的管理員看得到根站台這一列，未說明根站台若有站長時是否可見、是否允許存在。
