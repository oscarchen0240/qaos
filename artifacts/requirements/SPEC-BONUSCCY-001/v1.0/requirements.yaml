- requirement_id: REQ-BONUSCCY-004
  version: 1
  spec_id: SPEC-BONUSCCY-001
  spec_version: '1.0'
  type: constraint
  title: 核心貨幣所對應的錢包幣別可停用作止損用途；停用後入金/出金/開分/洗分四項操作皆須被阻擋
  statement: 核心貨幣本身只能從資料庫層級關閉，站台使用者無法在鏈上錢包管理直接關閉核心貨幣這個抽象設定；鏈上錢包管理中「停用」某幣別（例如TWD）這個操作，是停用該站台可用的一筆錢包幣別紀錄（wallet_currency），此功能刻意保留，用途是資金池出問題等異常狀況時讓機台即時止損。當核心貨幣所對應的那筆錢包幣別被停用後，入金、出金、開分、洗分四項操作皆應被系統阻擋，防止資金繼續流入或流出一個已停用的幣別（已由
    Oscar/PM 2026-09-15 確認，並於 2026-09-15 進一步澄清「核心貨幣」與「錢包幣別停用」的概念區分）
  acceptance_criteria:
  - ac_id: AC-BONUSCCY-006
    given: 站台核心貨幣對應的錢包幣別（例如TWD）已被停用
    when: 嘗試對該站台帳號執行入金
    then: 系統阻擋，不允許入金
  - ac_id: AC-BONUSCCY-022
    given: 站台核心貨幣對應的錢包幣別已被停用
    when: 嘗試對該站台帳號執行出金
    then: 系統阻擋，不允許出金
  - ac_id: AC-BONUSCCY-023
    given: 站台核心貨幣對應的錢包幣別已被停用
    when: 嘗試對該站台帳號執行開分
    then: 系統阻擋，不允許開分
  - ac_id: AC-BONUSCCY-024
    given: 站台核心貨幣對應的錢包幣別已被停用
    when: 嘗試對該站台帳號執行洗分
    then: 系統阻擋，不允許洗分
  spec_reference:
    spec_id: SPEC-BONUSCCY-001
    spec_version: '1.0'
    location: §一句話（限制段落）
    quote: 一個限制：站台的系統幣別必須是啟用中的錢包幣別之一（wallet_currency.enabled = 1），否則獎勵會發到玩家看不到的錢包；補充（2026-09-15 PM確認）：核心貨幣所對應的錢包幣別可停用作即時止損用途，停用後入金/出金/開分/洗分四項操作皆須被阻擋（2026-09-15進一步澄清：核心貨幣本身只能從DB關閉，鏈上錢包管理停用的是該幣別的wallet_currency紀錄，非核心貨幣設定本身）
  ambiguity: null
  risk: medium
  status: ACTIVE
  behavior_kind: rejection
  rejection_contract:
    defined: true
    description: 規則已由 PM 2026-09-15 明確補充確認：停用本身允許（止損用途），但停用後四項操作皆須阻擋；具體錯誤訊息文案未給，只測是否被阻擋
    spec_reference:
      spec_id: SPEC-BONUSCCY-001
      spec_version: '1.0'
      location: §一句話
      quote: ''
