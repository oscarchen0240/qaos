  statement: 主站台＝根站台 admin 底下的第一層站台，即一個客戶（營運方）的頂層站台，其下可再展開無限層子站台；站台類型與核心貨幣在主站台這一層選定，其下所有子站台（含孫層以下）一律繼承主站台；根站台本身不是主站台、不參與繼承鏈，故機台類型的主站台可直接掛在根站台底下。
