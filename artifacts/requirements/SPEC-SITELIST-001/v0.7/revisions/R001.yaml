- requirement_id: REQ-SITELIST-035
  version: 2
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 管理員對自身所屬站台的兩項限制（後端強制）
  statement: 管理員對自身所屬站台有兩項限制：(1) 不可修改自身站台的上層站台（編輯視窗唯讀）；(2) 不可將自身站台切換為「開通」（含由「更新待審」切回），可切「暫停」「關閉」。這兩項須由上層站台的管理員執行；名稱、網域、模板、場館設定等其餘欄位可自行編輯；對子站台無此限制。站長對自身站台同樣適用。限制由後端強制：以
    API 對自身站台修改上層站台或切為開通時，後端拒絕並回傳「無權限」、資料不變（v0.7 第 218 行；CLR-SITELIST-013 定案已併入 v0.7）。原第三項「不可刪除自身站台」因站台一律不可刪除而併除（見 REQ-SITELIST-022）。根站台
    admin 無上層，兩項限制對其不成立，改適用根站台保護規則。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0351
    given: 以某站台（非根站台）的管理員登入
    when: 編輯自身所屬站台
    then: 上層站台欄唯讀顯示目前值，無法修改
  - ac_id: AC-SITELIST-0353
    given: 以某站台的管理員登入，自身站台狀態為待開通或暫停
    when: 編輯自身站台並切換狀態
    then: 只能選擇暫停或關閉，不可選擇開通
  - ac_id: AC-SITELIST-0354
    given: 以某站台的管理員登入，自身站台狀態為更新待審
    when: 嘗試將自身站台切回開通
    then: 不可切回開通，須由上層站台的管理員執行
  - ac_id: AC-SITELIST-0355
    given: 以某站台的管理員登入
    when: 編輯自身所屬站台的名稱、網域、模板或場館設定並儲存
    then: 系統接受
  - ac_id: AC-SITELIST-0356
    given: 某站台狀態為待開通且模板已填
    when: 以其上層站台的管理員修改該站台的上層站台（管轄範圍內）或將其切換為開通
    then: 系統接受
  - ac_id: AC-SITELIST-0357
    given: 以某站台（非根站台）的管理員登入，略過前端限制
    when: 直接呼叫編輯站台 API 修改自身所屬站台的上層站台
    then: 後端拒絕並回傳「無權限」錯誤，上層站台不變
  - ac_id: AC-SITELIST-0358
    given: 以某站台的管理員或站長登入，自身站台為待開通、暫停或更新待審，略過前端限制
    when: 直接呼叫編輯站台 API 將自身所屬站台切為開通
    then: 後端拒絕並回傳「無權限」錯誤，狀態不變
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.7'
    location: §角色與權限/自身站台兩列 L52-55 + §操作/編輯站台/上層站台、狀態 L179、L185 + §業務規則與驗證/管理員的自身站台限制 L218
    quote: 管理員不可修改自身所屬站台的上層站台、不可將自身站台切換為「開通」（含由「更新待審」切回）
  ambiguity: null
