- requirement_id: REQ-SITELIST-002
  version: 1
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: constraint
  title: 站台類型由主站台選定，子站台強制繼承（根站台不參與）
  statement: 站台類型於主站台（根站台 admin 底下第一層）選定，其下所有子站台一律與主站台同類型、不可個別選擇（新增視窗唯讀跟隨主站台）；根站台 admin 不參與繼承鏈，故於根站台底下新增主站台時可自由選擇線上或機台，核心貨幣依所選類型連動。以下兩點為前版依
    CLR 記載、v0.7 原文未載的行為，本版列為待綁定決策點（見 Q02、Q03）：子站台以 API 帶入與上層不同類型時後端拒絕（CLR-SITELIST-001）；新站台建立時自動於該站台自己的鏈上錢包管理啟用對應幣別、不依賴根站台
    admin 的設定（CLR-SITELIST-012，修正 CLR-SITELIST-011）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0021
    given: 上層站台為機台類型（機台主站台或其子站台）
    when: 新增子站台
    then: 子站台的站台類型固定為機台，UI 不開放選擇
  - ac_id: AC-SITELIST-0022
    given: 上層站台為線上類型（線上主站台或其子站台）
    when: 新增子站台
    then: 子站台的站台類型固定為線上，UI 不開放選擇
  - ac_id: AC-SITELIST-0023
    given: 上層站台為根站台 admin（代碼 ZZ，類型線上），即新增的是主站台
    when: 新增站台
    then: 站台類型欄位可自由選擇機台或線上，不跟隨根站台自身的類型；核心貨幣依所選類型連動（例如選機台則為 TWD），建立後不可更改。【以下依 CLR-SITELIST-010／012，v0.7 原文未載，見 Q03】同時該新站台自己的鏈上錢包管理自動啟用對應幣別，不需根站台
      admin 的鏈上錢包管理預先啟用該幣別
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.7'
    location: §站台類型與機台專屬欄位 L77 + §主站台 L118-119 + §業務規則與驗證/站台類型隨主站台 L228、根站台不參與繼承 L225
    quote: 子站台一律與主站台同類型、不可個別選擇
