  statement: 全平台站台構成單一一棵樹，樹根為系統建置的根站台 admin（代碼 ZZ、站台類型線上）；根站台全平台恰好一個，不開放新增第二個根；除根站台外所有站台皆必須指定上層站台，新增時「上層站台」不可留空。根站台保護規則須在後端一併實作，不能只靠前端。
