- requirement_id: REQ-SITELIST-011
  version: 3
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 可見範圍：管理員與站長相同，依所屬站台決定；範圍外一律「無權限」
  statement: 管理員與站長的可見範圍相同：自身所屬站台及其所有子站台，不含平行或上層站台；根站台 admin 的管理員因所屬站台為根站台，可見範圍等同全平台。起始層一律為自身所屬站台這一列；僅根站台自身的管理員看得到根站台這一列。所屬站台不是主站台時（例如子站台
    A1 的站長），可見範圍為 A1 及其子樹，看不到主站台 A（開發包⑧第四節）。存取管轄範圍外站台（含直接以站台 ID 呼叫查詢 API）時，後端拒絕並回傳「無權限」錯誤、資料不變，不採「當作不存在／回空結果」（v0.7 第 59、223
    行，CLR-SITELIST-015 定案已併入 v0.7）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0111
    given: 以根站台 admin 的管理員登入
    when: 開啟站台列表
    then: 起始層顯示根站台 admin 這一列，點入為各主站台，可逐層瀏覽全平台站台
  - ac_id: AC-SITELIST-0112
    given: 以站長登入
    when: 開啟站台列表
    then: 起始層顯示自身所屬站台這一列，且僅能看到自身及其所有子站台
  - ac_id: AC-SITELIST-0113
