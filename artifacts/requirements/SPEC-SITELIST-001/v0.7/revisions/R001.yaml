- requirement_id: REQ-SITELIST-016
  version: 3
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 狀態切換權限（依角色與子站台／自身站台）
  statement: 管理員對其管轄範圍內的子站台可切換為任意可手動選取的狀態（待開通／開通／暫停／關閉；「更新待審」僅由系統觸發、不開放手動選取）。站長不論對子站台或自身站台，僅可切換為「暫停」或「關閉」，其他狀態顯示但不可選，選取則阻擋儲存；站長以
    API 送出其他狀態時後端拒絕並回傳「無權限」、資料不變（v0.7 第 59 行）。管理員對自身所屬站台僅可切「暫停」「關閉」，不可切為「開通」（見 REQ-SITELIST-035）。依 §站台狀態：「開通」由上層站台的管理員手動切換；「暫停」「關閉」可由該站台的管理員或站長切換，上層站台的管理員亦可。場館站台（含自行經營的機台主站台）不是「開通」時，該場館所有機台一律無法運作。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0161
    given: 以管理員登入
    when: 編輯其管轄範圍內某子站台並切換狀態
    then: 可選擇待開通、開通、暫停、關閉任一種；「更新待審」不可手動選取
  - ac_id: AC-SITELIST-0162
    given: 以站長登入
    when: 編輯子站台或自身所屬站台並切換狀態
    then: 只能選擇暫停或關閉；其餘選項顯示但不可點選
  - ac_id: AC-SITELIST-0163
    given: 以站長登入
    when: 嘗試切換為暫停或關閉以外的狀態
    then: 系統阻擋儲存
  - ac_id: AC-SITELIST-0164
    given: 以操作員身分登入後台
    when: 尋找站台列表頁面（選單或直接訪問）
    then: 站台列表頁面不對操作員開放，操作員無法檢視或調整任何站台的狀態（v0.7 未明載操作員能否進入站台列表，見 Q04；本 AC 在 Q04 定案前不得作為 Test Case 依據）
  - ac_id: AC-SITELIST-0165
    given: 某站台狀態為暫停，模板已填
    when: 該站台上層站台的管理員將其切換為開通並儲存
    then: 系統接受，狀態變更為開通
  - ac_id: AC-SITELIST-0166
    given: 以某站台自身的管理員或站長登入，該站台狀態為開通
    when: 將自身所屬站台切換為暫停或關閉並儲存
    then: 系統接受
  - ac_id: AC-SITELIST-0167
    given: 以站長登入，略過前端限制
    when: 直接呼叫編輯站台 API 將子站台狀態改為開通或待開通
    then: 後端拒絕並回傳「無權限」錯誤，狀態不變
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.7'
    location: §角色與權限/子站台：狀態切換 L49 + §站台狀態 L65-73 + §業務規則與驗證/狀態（站長編輯） L213、場館站台狀態 L235
    quote: 僅可切換為「暫停」或「關閉」；選取其他狀態時阻擋儲存
  ambiguity:
    level: minor
    description: 決策點待決：Q03（minor，undefined）、Q04（minor，undefined）
    raised_level: minor
  risk: high
  status: ACTIVE
  supersedes_version: 2
