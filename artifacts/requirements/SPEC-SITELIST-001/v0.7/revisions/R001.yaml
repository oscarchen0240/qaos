- requirement_id: REQ-SITELIST-013
  version: 3
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 編輯上層站台權限與循環防護
  statement: 管理員編輯其管轄範圍內的子站台時可於管轄範圍內修改上層站台，選取時自動排除該站台自身及其子站台（循環防護）；管理員對自身所屬站台的上層站台唯讀（見 REQ-SITELIST-035）；站長編輯時上層站台唯讀顯示目前值，如需變更須通知管理員。站長以
    API 修改上層站台時後端拒絕並回傳「無權限」、資料不變（v0.7 第 59、223 行）。管理員以 API 送出循環的上層站台時後端如何回應、以及跨主站台改掛（改到不同類型或不同核心貨幣的主站台底下、或改掛到根站台底下成為主站台）如何處理，v0.7
    未定義（Q03、Q04）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0131
    given: 以管理員登入
    when: 編輯其管轄範圍內某子站台的上層站台，開啟選單
    then: 選單不包含該站台自身及其所有子站台，也不包含管轄範圍外的站台
  - ac_id: AC-SITELIST-0132
    given: 以站長登入
    when: 編輯站台
    then: 上層站台欄位唯讀顯示目前值，無法修改
  - ac_id: AC-SITELIST-0133
    given: 以站長登入，略過前端限制
    when: 直接呼叫編輯站台 API 修改子站台的上層站台
    then: 後端拒絕並回傳「無權限」錯誤，上層站台不變
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.7'
    location: §角色與權限/子站台：上層站台（編輯） L47 + §操作/編輯站台/上層站台 L179 + §業務規則與驗證/上層站台循環防護 L220
    quote: 編輯時，不可將自身或自身的子站台選為上層站台
