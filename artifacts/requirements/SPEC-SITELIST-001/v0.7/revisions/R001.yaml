- requirement_id: REQ-SITELIST-017
  version: 2
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: functional
  title: 更新待審狀態自動觸發與切回
  statement: 站台處於「開通」或「更新待審」狀態下，若前台或後台網域有新增或刪除，儲存後系統自動切換為「更新待審」，適用於所有角色；此狀態不開放手動選取；待技術部門完成設定後由上層站台的管理員人工切回「開通」，上層站台的管理員亦可在此狀態下手動切換為其他任意狀態；站台自身的管理員與站長不可將其由「更新待審」切回「開通」（見
    REQ-SITELIST-035）。根站台的網域異動與本規則的衝突見 REQ-SITELIST-032 Q02。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0171
    given: 站台狀態為開通
    when: 新增或刪除一筆網域並儲存
    then: 狀態自動變為更新待審
  - ac_id: AC-SITELIST-0172
    given: 站台狀態為暫停或關閉或待開通
    when: 新增或刪除一筆網域並儲存
    then: 狀態不因網域異動而改變
  - ac_id: AC-SITELIST-0173
    given: 站台狀態為更新待審，模板已填
    when: 該站台上層站台的管理員手動切換為開通或其他狀態
    then: 系統接受
  - ac_id: AC-SITELIST-0174
    given: 以站長登入，所編輯站台狀態為開通
    when: 新增或刪除一筆網域並儲存
    then: 狀態自動變為更新待審（網域異動觸發適用於所有角色）
