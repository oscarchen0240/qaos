- requirement_id: REQ-SITELIST-037
  version: 2
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 管理員為每站台皆有的角色；越權操作一律「無權限」
  statement: 「管理員」為每個站台皆有的角色，權限範圍跟著所屬站台走（自身站台及其所有子站台），層級高於同站台的站長；管理員與站長可見範圍相同，差別在操作深度。根站台 admin 的管理員等同看到全部站台，是所屬站台的位置造成，不是角色本身有跨站權限。所有權限限制由後端每一支
    API 強制，畫面上的唯讀、隱藏只是輔助；越權操作（範圍外站台、自身站台限制、越級指派角色）一律拒絕並回傳「無權限」錯誤、資料不變，不採「當作不存在／回空結果」；錯誤代碼由後端定義，尚未定案（Q03；CLR-SITELIST-015）。管理員帳號的建立方式於開發包⑧列為尚未定案（Q04）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0371
    given: 以主站台 A 的管理員登入
    when: 對平行主站台 B 底下的站台執行編輯或狀態切換（含以站台 ID 直接呼叫 API）
    then: 後端拒絕並回傳「無權限」錯誤，B 底下站台資料不變
  - ac_id: AC-SITELIST-0372
    given: 以根站台 admin 的管理員登入
    when: 編輯任一主站台或其子站台的上層站台、模板與狀態
    then: 可依子站台權限操作（等同全平台皆為其子站台）
  - ac_id: AC-SITELIST-0373
    given: 同一站台的管理員與站長
    when: 分別編輯該站台底下的同一子站台
    then: 管理員可修改上層站台、模板並切換任意狀態；站長的上層站台與模板唯讀、狀態僅可切暫停或關閉
