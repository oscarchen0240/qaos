- requirement_id: REQ-SITELIST-036
  version: 2
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 角色指派範圍（站長不可指派管理員與站長）
  statement: 管理員可在管轄範圍內指派所有角色（管理員、站長、操作員、財務、清稽核客服、客服、遊客）；站長僅可分配站長以下的角色權限（含操作員），不可指派管理員與站長；其餘角色不可指派。規則：可指派的角色須低於操作者自身角色，唯管理員可指派管理員（開發包⑧第六節）。指派於「系統使用者列表」操作（點列表中角色欄位、從下拉選單選擇新角色，手冊
    7.1.2），角色下拉選單依操作者角色過濾（站長看不到管理員與站長選項）；越級指派或於管轄範圍外指派時，後端拒絕並回傳「無權限」、資料不變（v0.7 第 219、223 行；CLR-SITELIST-014 定案已併入 v0.7）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0361
    given: 以某站台的管理員登入
    when: 於其管轄範圍內的站台指派一名管理員
    then: 系統接受
  - ac_id: AC-SITELIST-0362
    given: 以某站台的管理員登入
    when: 於其管轄範圍內的站台指派一名站長
    then: 系統接受
  - ac_id: AC-SITELIST-0363
    given: 以站長登入系統使用者列表
    when: 點擊某帳號的角色欄位開啟下拉選單；並略過前端以 API 指派管理員
    then: 下拉選單不出現「管理員」；以 API 指派管理員時後端拒絕並回傳「無權限」錯誤，角色不變
  - ac_id: AC-SITELIST-0364
    given: 以主站台 A 的管理員登入
    when: 嘗試對平行主站台 B 底下站台的帳號指派角色（含直接呼叫 API）
    then: 後端拒絕並回傳「無權限」錯誤，角色不變（不在管轄範圍內）
  - ac_id: AC-SITELIST-0365
    given: 以操作員登入
    when: 嘗試指派任何角色
    then: 不可指派
  - ac_id: AC-SITELIST-0366
    given: 以站長登入系統使用者列表
    when: 點擊某帳號的角色欄位開啟下拉選單；並略過前端以 API 指派站長
    then: 下拉選單不出現「站長」；以 API 指派站長時後端拒絕並回傳「無權限」錯誤，角色不變
  - ac_id: AC-SITELIST-0367
    given: 以站長登入系統使用者列表，目標帳號在其管轄範圍內
    when: 將該帳號角色改為操作員
    then: 系統接受，確認後即時生效
  - ac_id: AC-SITELIST-0368
