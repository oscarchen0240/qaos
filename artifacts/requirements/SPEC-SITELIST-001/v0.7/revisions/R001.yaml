- requirement_id: REQ-SITELIST-012
  version: 3
  spec_id: SPEC-SITELIST-001
  spec_version: '0.7'
  type: security
  title: 新增子站台時上層站台欄位權限（不可留空、後端強制）
  statement: 管理員新增站台時，上層站台自動帶入當前所在層，可於管轄範圍內搜尋改選（搜尋結果顯示站台名稱、代碼及完整路徑），不可留空；站長新增時上層站台固定為當前所在層、唯讀不可修改。上述限制由後端強制：站長以 API 指定其他上層站台、或管理員以
    API 指定管轄範圍外的上層站台，後端拒絕並回傳「無權限」、不建立站台（v0.7 第 59、223 行；前版站長部分依 CLR-SITELIST-005，已併入 v0.7 的通則）。
  acceptance_criteria:
  - ac_id: AC-SITELIST-0121
    given: 以管理員登入
    when: 新增站台，搜尋並改選上層站台
    then: 搜尋結果顯示站台名稱、代碼及完整路徑，僅含其管轄範圍內的站台；系統接受所選站台為上層站台
  - ac_id: AC-SITELIST-0122
    given: 以站長登入
    when: 新增站台
    then: 上層站台欄位唯讀，固定顯示當前所在層，無法改選
  - ac_id: AC-SITELIST-0123
    given: 以站長登入，略過前端限制
    when: 直接呼叫建立站台 API 並帶入當前所在層以外的上層站台
    then: 後端拒絕並回傳「無權限」錯誤，不建立站台
  - ac_id: AC-SITELIST-0124
    given: 以主站台 A 的管理員登入，略過前端限制
    when: 直接呼叫建立站台 API 並以平行主站台 B 底下的站台為上層站台
    then: 後端拒絕並回傳「無權限」錯誤，不建立站台
