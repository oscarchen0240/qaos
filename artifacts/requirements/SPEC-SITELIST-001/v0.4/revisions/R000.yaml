- requirement_id: REQ-SITELIST-016
  version: 1
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  type: security
  title: 狀態切換權限
  statement: Admin 可切換為任意可手動選取的狀態（待開通／開通／暫停／關閉，共 4 種；不含僅由系統自動觸發、不開放手動選取的「更新待審」——已由 Oscar 2026-09-14 確認「任意狀態」含待開通）；站長僅可切換為「暫停」或「關閉」，其他狀態顯示但不可選；操作員因後台不顯示站台列表頁面，不具備任何狀態調整能力（含查看）。暫停與關閉在功能上皆代表該站台平台無法入金（即
    SPEC-CASHFLOW-001 所指「場館站台非開通狀態」，機台一律無法運作，回 7-OUT OF SERVICE）
  acceptance_criteria:
  - ac_id: AC-SITELIST-0161
    given: 以 Admin 登入
    when: 編輯站台並切換狀態
    then: 可選擇五種狀態中的任一種
  - ac_id: AC-SITELIST-0162
    given: 以站長登入
    when: 編輯站台並切換狀態
    then: 只能選擇暫停或關閉；其餘選項顯示但不可點選
  - ac_id: AC-SITELIST-0163
    given: 以站長登入
    when: 嘗試切換為暫停或關閉以外的狀態
    then: 系統阻擋儲存
  - ac_id: AC-SITELIST-0164
    given: 以操作員身分登入後台
    when: 尋找站台列表頁面（選單或直接訪問）
    then: 站台列表頁面不對操作員開放，操作員無法檢視或調整任何站台的狀態
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    location: §角色與權限/狀態切換
    quote: 狀態切換 | 可切換為任意狀態 | 僅可切換為「暫停」或「關閉」（「任意狀態」範圍已於 2026-09-14 由 Oscar 確認含待開通）
