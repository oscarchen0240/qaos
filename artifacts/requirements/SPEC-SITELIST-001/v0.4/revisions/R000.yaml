      直接確認：Admin 的「任意狀態」包含待開通（可將既有站台手動切回待開通），採用選項一
    options:
    - 任意狀態含待開通，Admin 可把既有站台手動改回待開通
    - 任意狀態不含待開通，待開通只能由新建站台觸發，Admin 手動切換的目標僅限開通/暫停/關閉
  risk: high
  status: ACTIVE
  behavior_kind: constraint
  rejection_contract:
