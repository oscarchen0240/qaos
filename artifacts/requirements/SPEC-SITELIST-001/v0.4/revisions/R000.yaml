- requirement_id: REQ-SITELIST-002
  version: 1
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  type: constraint
  title: 站台類型由主站台決定，子站台強制繼承
  statement: 站台類型於主站台（根層）選定，子站台一律與主站台同類型，不可個別選擇；例外：當上層站台為 admin（最上層根站台）時，此強制跟隨規則不適用——底下子站台可自由選擇機台或線上類型，核心貨幣依所選類型連動建立（此為 PM
    最終決定，已開發完成並上線，非待定或實驗性設計；正式確認見 CLR-SITELIST-010，spec.md 原文尚未反映此例外，屬 spec 文件落後於實際已上線行為的已知落差）
  acceptance_criteria:
  - ac_id: AC-SITELIST-0021
    given: 上層站台為機台類型
    when: 新增子站台
    then: 子站台的站台類型固定為機台，UI 不開放選擇
  - ac_id: AC-SITELIST-0022
    given: 上層站台為線上類型
    when: 新增子站台
    then: 子站台的站台類型固定為線上，UI 不開放選擇
  - ac_id: AC-SITELIST-0023
    given: 上層站台為 admin（最上層根站台）
    when: 新增子站台
    then: 站台類型欄位可自由選擇機台或線上，不強制跟隨 admin 自身的站台類型；核心貨幣依所選類型連動建立（例如選機台則連動啟用 TWD）且此欄位不可更改、不能於後台關閉。與此同時，該新站台自己的「鏈上錢包管理」（每站台獨立一份、可事後調整的幣種出入金開關）會自動連動啟用對應幣別；此連動不需要
      admin 自身的鏈上錢包管理預先啟用該幣別（即不依賴上層/admin 的狀態）。【CLR-SITELIST-012已修正】先前CLR-SITELIST-011誤判兩者「完全無關」，實際上兩者性質不同（核心貨幣不可變 vs 鏈上錢包管理可調整）但確有連動關係，已由既有ACTIVE的TC-SITELIST-063（早於本次CLR討論即存在）獨立佐證修正。
  spec_reference:
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    location: §站台類型與機台專屬欄位 + §業務規則-站台類型隨主站台
    quote: 站台類型於主站台（根層）選定，子站台一律與主站台同類型、不可個別選擇
  ambiguity: null
  risk: high
  status: ACTIVE
  behavior_kind: constraint
  rejection_contract:
    defined: false
    description: 若繞過前端UI、直接呼叫建立站台API並帶入與上層站台不同的站台類型，後端同樣拒絕（不只是前端唯讀限制）。依CLR-SITELIST-001確認
