    - ac_id: AC-DAILYREPORT-0091
      given: 機台 A 當日結束 3 場、機台 B 當日結束 2 場
      when: 維度依機台明細
      then: A 列場次數 3、B 列場次數 2
    - ac_id: AC-DAILYREPORT-0092
      given: 同上
      when: 維度依場館彙總
      then: 場次數 5
    - ac_id: AC-DAILYREPORT-0093
      given: 機台 A 有 1 場進行中
      when: 維度依機台明細
      then: 進行中場次不計入場次數
    spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.2'
      location: §列表欄位/場次數（2026-09-03 定案；狀態範圍與日結結算歸屬依 CLR-DAILYREPORT-007）
      quote: 為當日結束的場次筆數：依機台明細＝該機台帳號當日的場次數
    ambiguity:
      level: major
      description: CLR-DAILYREPORT-007 的定案以「逾時結束的時間必然超過日結時間，故同一營業日內場次只會以已結束或日結結算收尾」為前提，但實測曾在同一營業日內產生「逾時結束」場次，前提不成立；營業日內的逾時結束場次是否計入「當日結束的場次筆數」、歸屬哪個營業日，v0.2
        與 CLR-007 皆未涵蓋（已送 PM，尚未回覆）。
