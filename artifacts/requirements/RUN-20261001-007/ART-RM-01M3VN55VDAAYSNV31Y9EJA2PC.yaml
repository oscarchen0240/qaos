      then: 回到依場館彙總，結算日期還原為 9/01～9/15、機台帳號還原為空（鑽取前的條件），麵包屑剩一層
    - ac_id: AC-DAILYREPORT-0265
      given: 由 0261→0263 鑽取到第三層
      when: 點麵包屑第二層「結算期間」
      then: 回到依機台明細，結算日期為 9/10～9/10、機台帳號還原為空（該層鑽取前的條件），麵包屑剩兩層
    - ac_id: AC-DAILYREPORT-0266
      given: 鑽取到第三層
      when: 切換站台
      then: 鑽取路徑重設為第一層
    - ac_id: AC-DAILYREPORT-0267
      given: 鑽取到第三層
      when: 按「清除」
      then: 鑽取路徑重設為第一層
    spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.2'
      location: §維度鑽取與麵包屑/向下鑽取
      quote: 於「依場館彙總」列點場館名 → 切至「依機台明細」，並將**結算日期收斂為該列的結算期間**；於「依機台明細」列點機台帳號 → 切至「依場次明細」，並將該機台帳號帶入篩選器
    ambiguity:
      level: minor
      description: 還原清單只列「統計維度、結算日期、機台帳號」，未提「統計週期」：向下鑽取（例如從按週列點場館名）後統計週期是否維持、回到上層時是否還原未定義；另「清除」重設為第一層時統計維度是否一併回到依場館彙總、其餘篩選是否清空也未明寫。
      options:
      - 統計週期在鑽取與還原間維持不變；清除時所有篩選回預設、統計維度回依場館彙總
      - 統計週期也隨上層還原；清除只重設麵包屑與統計維度
