  - requirement_id: REQ-DAILYREPORT-009
    version: 1
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.2'
    type: functional
    title: 場次數
    statement: 「場次數」於「依場館彙總」與「依機台明細」維度顯示，為當日結束的場次筆數：依機台明細＝該機台帳號當日場次數；依場館彙總＝該場館底下所有機台帳號當日場次數的加總。「當日結束」包含「已結束」與「日結結算」兩種狀態，僅「進行中」不計入；日結結算場次歸屬於場次「開始」的營業日，不因被日結時刻強制結束而計入下一個營業日（以上兩點依
      CLR-DAILYREPORT-007 PM 定案，v0.2 原文未載）。「逾時結束」場次的計入方式見 ambiguity。
