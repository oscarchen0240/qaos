    type: security
    title: 角色權限範圍
    statement: 場館日結報表依角色限制可見範圍：管理員＝管轄範圍；站長＝管轄範圍；操作員＝自身場館（v0.2 修訂：v0.1 的「Admin｜全部」改名為「管理員」，可見範圍改為「管轄範圍」）。操作員越權時前端與後端皆阻擋：站台切換選單不提供非自身場館，直接呼叫
      API 帶非自身場館參數會被後端拒絕（依 CLR-DAILYREPORT-001 PM 定案，含 2026-09-14 補充；v0.2 原文未載）。
    acceptance_criteria:
    - ac_id: AC-DAILYREPORT-0011
      given: 以管理員登入
      when: 開啟場館日結報表並展開站台切換下拉選單
      then: 只能選擇並查看其管轄範圍內的場館資料，管轄範圍外的場館不出現在選單中（v0.2：管理員由「全部」改為「管轄範圍」）
    - ac_id: AC-DAILYREPORT-0012
      given: 以站長登入
      when: 開啟場館日結報表
      then: 只能查看自身及子站台管轄範圍內的場館資料
    - ac_id: AC-DAILYREPORT-0013
      given: 以操作員登入
      when: 開啟場館日結報表
      then: 只能查看自身場館資料
    spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.2'
      location: §功能說明/權限表（操作員越權的前後端阻擋依 CLR-DAILYREPORT-001）
      quote: '| 場館日結報表 | 管轄範圍 | 管轄範圍 | 自身場館 |'
    ambiguity:
      level: minor
      description: 「管理員」的「管轄範圍」本包未定義（權限表註明沿用正本「角色與權限」），v0.1 為「全部」；管理員與站長同為「管轄範圍」時兩者的實際差異不明。
      options:
      - 範圍由使用者所屬站台決定（所屬站台及其子樹），管理員與站長採同一模型、只差所屬站台層級（與 SITELIST 權限範圍模型一致）
      - 平台最上層的管理員其管轄範圍實質仍為全部場館；僅下層站台的管理員受限
    related_requirement_ids:
    - REQ-DAILYREPORT-002
    risk: high
    status: DRAFT
    behavior_kind: constraint
    rejection_contract:
      defined: false
      description: 操作員越權：前端已擋（站台切換選單不提供其他場館選項）、後端也擋（直接呼叫 API 帶非自身場館參數會被拒絕），依 CLR-DAILYREPORT-001（含 2026-09-14 補充）。v0.2 新增的限制——管理員由「全部」改為「管轄範圍」——其越權（管理員或站長存取管轄範圍外場館，含直接呼叫
        API）時的系統反應 v0.2 未定義，CLR-001 只涵蓋操作員，需再確認是否比照操作員（前端不提供、後端拒絕）。
