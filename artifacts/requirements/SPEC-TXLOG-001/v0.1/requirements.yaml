- requirement_id: REQ-TXLOG-009
  version: 1
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  type: functional
  title: 交易狀態篩選依交易類型分兩組，選項為後端技術值
  statement: 交易狀態篩選實際為多選 chip 選擇器，且可選項目依交易類型篩選而分為兩組技術值（非 spec.md 描述的單一 5 種分類文字）：交易類型為「開分」或「入鈔」時，可選「已逾時、錯誤、無、成功、等待中、已取消、無效」共
    7 項；交易類型為「出鈔」或「洗分」時，可選「失效、待處理、已拒絕、等待中、錯誤、已處理」共 6 項（已由 Oscar 2026-09-14 確認並補上原先遺漏的「已處理」）。這些技術值對應
    spec.md 定義的 5 種概念分類（待確認/已完成/已取消/已逾時/未成立），大致對應關係（已由 Oscar 2026-09-14 依實際畫面截圖確認）：開分/入鈔＝等待中→待確認、成功→已完成、已取消→已取消、已逾時→已逾時、錯誤→未成立、無效→未成立（「無」的語意尚未確認）；出鈔/洗分＝待處理→待確認、等待中→待確認、已拒絕→未成立、失效→已取消、錯誤→未成立、已處理→已完成
  acceptance_criteria:
  - ac_id: AC-TXLOG-0091
    given: 交易類型篩選勾選「開分」或「入鈔」
    when: 開啟交易狀態篩選
    then: 可選項目為「已逾時、錯誤、無、成功、等待中、已取消、無效」共 7 項
  - ac_id: AC-TXLOG-0092
    given: 交易類型篩選勾選「出鈔」或「洗分」
    when: 開啟交易狀態篩選
    then: 可選項目為「失效、待處理、已拒絕、等待中、錯誤、已處理」共 6 項
  spec_reference:
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    location: §篩選器（實際畫面與 spec.md 原文不同，見 Oscar 2026-09-14 截圖確認）
    quote: 交易狀態 | 下拉選單 | 全部 / 待確認 / 已完成 / 已取消 / 已逾時 / 未成立（＊實際依交易類型分兩組技術值，非此單一清單）
  ambiguity:
    level: minor
    description: 開分/入鈔類型的交易狀態選項中「無」這個技術值對應 spec.md 哪個概念分類尚未確認
    options:
    - 對應「未成立」（與「錯誤」「無效」同類）
    - 對應其他尚未定義的情況
    - 純粹的 UI 佔位/邊界情況，實務上不會出現
  risk: medium
  status: ACTIVE
  behavior_kind: success
  rejection_contract:
    defined: true
    description: 規則已由實際畫面截圖確認
    spec_reference:
