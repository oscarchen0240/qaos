- requirement_id: REQ-TXLOG-017
  version: 1
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  type: functional
  title: 入金與出金的待確認收斂機制不同
  statement: 入金的待確認超過 24 小時自動轉為已逾時；出金不設逾時，待確認會一直保留，直到機台補完回報、被新的出金取代、櫃檯人工出金連動取消，或轉介至「洗分出金核實」頁（SPEC-CASHOUT-001）由人工處理為止（原
    spec.md 提及的「或由 Admin 手動取消為止」已由 Oscar 2026-09-14 確認為錯誤敘述，交易紀錄查詢頁不提供手動取消操作，見 REQ-TXLOG-028）
  acceptance_criteria:
  - ac_id: AC-TXLOG-0171
    given: 一筆出金交易長期處於待確認狀態，機台從未補送完成回報
    when: 持續檢視其狀態
    then: 不會自動轉為已逾時，持續保留為待確認，直到被新出金取代、櫃檯人工出金連動取消，或轉介至「洗分出金核實」頁（SPEC-CASHOUT-001）由人工處理
  spec_reference:
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    location: §交易狀態 + §相關業務規則
    quote: 出金不設逾時，待確認會一直保留，直到機台補完回報、被新的出金取代、櫃檯人工出金連動取消，或轉介至「洗分出金核實」頁人工處理（原文「或由 Admin
      手動取消為止」已由 Oscar 2026-09-14 確認為錯誤敘述，見 REQ-TXLOG-028）
  ambiguity: null
  risk: high
  status: ACTIVE
  behavior_kind: constraint
  rejection_contract:
