    title: 一般紅利一律發站台系統幣別，不受玩家使用其他已啟用幣別下注或存款影響
    statement: 返水、代理佣金、推薦獎勵、每日/累積簽到、首存/次存活動、累積存款活動，皆發站台系統幣別；玩家用哪個錢包下注、用什麼幣別存款，都不影響這些紅利發出來的幣別
    acceptance_criteria:
    - ac_id: AC-BONUSCCY-008
      given: 玩家所屬線上站台已啟用兩種以上幣別（例如TTK、USDT，站台系統幣別為USDT），玩家持有並使用TTK餘額下注/存款
      when: 該玩家獲得一筆返水或代理佣金等一般紅利
      then: 紅利發放進站台系統幣別（USDT）錢包，不是玩家下注/存款所用的TTK
    spec_reference: &id001
      spec_id: SPEC-BONUSCCY-002
      spec_version: '1.0'
      location: §一句話 + §每一種紅利發什麼幣別
      quote: 除了「彩金活動」與「遊戲商JACKPOT／促銷派彩」，其他紅利一律發「站台系統幣別」。玩家拿哪個錢包下注、用什麼幣別存款，都不影響紅利發出來的幣別
    ambiguity: null
    risk: high
    status: DRAFT
