  - requirement_id: REQ-BONUSCCY-010
    version: 1
    spec_id: SPEC-BONUSCCY-002
    spec_version: '1.0'
    type: functional
    title: 人工存款不觸發任何活動與累積統計，但稽核流水正常計入
    statement: 人工存款不會進任何活動與累積統計：不觸發首存/次存活動、不累積存款活動的累積門檻、不計入簽到活動的有效會員門檻、不計入玩家累積儲值統計（不推進VIP等級）；但稽核流水（打碼量）仍依後台填的稽核倍數正常計入。「錢進玩家錢包」這個基本行為已由
      SPEC-BONUSCCY-001 REQ-BONUSCCY-003 驗證，本條不重複測
    acceptance_criteria:
    - ac_id: AC-BONUSCCY-012
      given: 玩家原本未達首存活動門檻，對其執行一筆金額足以達標的人工存款
      when: 檢視首存活動是否被觸發、是否發放獎勵
      then: 不觸發，該玩家不算首儲，也不會配到任何存款活動
    - ac_id: AC-BONUSCCY-013
      given: 玩家原本未達簽到活動的有效會員門檻，對其執行一筆金額足以達標的人工存款
      when: 檢視簽到活動的有效會員狀態
      then: 門檻不計入這筆人工存款金額，玩家不會因此變成有效會員
    - ac_id: AC-BONUSCCY-014
      given: 對玩家執行一筆人工存款
      when: 檢視該筆存款是否計入稽核流水（打碼量）
      then: 依後台填寫的稽核倍數正常計入稽核流水
    spec_reference: &id005
      spec_id: SPEC-BONUSCCY-002
      spec_version: '1.0'
      location: §人工存款
      quote: 人工存款不會進任何活動與累積統計。它只做兩件事：把錢加進錢包、寫一筆交易紀錄 ｜ 首存／次存活動 ❌不觸發，不算首儲、也不會配到任何存款活動 ｜ 累積存款活動 ❌不累積 ｜ 簽到活動的「有效會員」門檻 ❌不計入 ｜ 玩家累積儲值統計（VIP等級的依據）
        ❌不計入，所以也不會推進VIP等級 ｜ 稽核流水（打碼量） ✅有，依後台填的稽核倍數
