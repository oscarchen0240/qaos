- requirement_id: REQ-DAILYREPORT-020
  version: 1
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: constraint
  title: 依結算期間排序時相鄰列餘額前後相接
  statement: 依場館彙總／依機台明細的各列餘額為時點值，涵蓋篩選條件內所有機台（含當期無場次但仍有留存分數者），故依結算期間排序時相鄰各列前後相接：較早一期的期末餘額即次一期的期初餘額（依機台明細時以同一機台的相鄰期間比對）。預設排序（結算期間新→舊）時，按日檢視的第一列期末餘額即總計列期末餘額。
  acceptance_criteria:
  - ac_id: AC-DAILYREPORT-0201
    given: 按日、依場館彙總，結算日期 9/10～9/12，依結算期間排序
    when: 比對相鄰列
    then: 9/10 列期末餘額＝9/11 列期初餘額；9/11 列期末餘額＝9/12 列期初餘額
  - ac_id: AC-DAILYREPORT-0202
    given: 按週、依場館彙總，結算日期跨兩個完整週
    when: 比對兩列
    then: 前一週列期末餘額＝次一週列期初餘額
  - ac_id: AC-DAILYREPORT-0203
    given: 按日、依機台明細，機台 A 於 9/11 無任何場次但留存分數 400
    when: 比對 A 的 9/10、9/11、9/12 三列
    then: A 的 9/10 期末 400＝9/11 期初 400；9/11 期末 400＝9/12 期初 400（無場次的期間仍沿用留存分數，前後相接）
  - ac_id: AC-DAILYREPORT-0204
    given: 按日、預設排序（結算期間新→舊）
    when: 查看第一列與總計列
    then: 第一列（最新營業日）期末餘額等於總計列期末餘額
  spec_reference:
