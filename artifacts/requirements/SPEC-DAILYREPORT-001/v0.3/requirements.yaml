- requirement_id: REQ-DAILYREPORT-014
  version: 2
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: functional
  title: 期末餘額（列層級時點值）
  statement: 期末餘額為各機台分數合計，屬時點存量：已結算的營業日取該日結算時點的值；尚未結算（含有進行中場次）者取截至查詢當下的分數，進行中場次的分數計入（v0.3 第 60、72 行；「已結算營業日仍取結算時點值」依 CLR-DAILYREPORT-013
    定案 A 理解第 72 行）。依場館彙總／依機台明細的每一列，餘額涵蓋篩選條件（含機台帳號）內的所有機台，含當期無場次但仍有留存分數者（沿用其最近一個營業日的結算時點值）。依場次明細＝該場次結束時的分數（歸零結束與出金結束為 0；洗分結束留有餘數時為該餘數；進行中場次為累計至查詢當下的分數）。統計週期非按日時取最後一個營業日的值（REQ-DAILYREPORT-015）；總計列規則見
    REQ-DAILYREPORT-019；無資料期間見 REQ-DAILYREPORT-016。
