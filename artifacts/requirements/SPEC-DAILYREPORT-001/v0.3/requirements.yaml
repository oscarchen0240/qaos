- requirement_id: REQ-DAILYREPORT-025
  version: 1
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: functional
  title: 維度鑽取麵包屑：層級與呈現
  statement: 篩選器下方顯示頁內維度鑽取路徑（麵包屑），最多三層：場館（依場館彙總）› 結算期間（依機台明細）› 機台帳號（依場次明細），每層下方標註其對應的統計維度。層級數依統計維度而定（依場館彙總一層、依機台明細兩層、依場次明細三層），直接切換「統計維度」下拉選單時麵包屑同步更新。路徑最後一層為當前檢視層級，純文字不可點；其餘各層為可點連結。第一層即站台切換下拉選單所選的場館，僅顯示當前場館、不另提供切換。本麵包屑與後台全站頁首的功能路徑麵包屑（各式報表
    / 場館日結報表）並存。
  acceptance_criteria:
  - ac_id: AC-DAILYREPORT-0251
    given: 統計維度為依場館彙總
    when: 查看麵包屑
    then: 只有一層「場館」（顯示當前所選場館名），下方標註「依場館彙總」，為純文字不可點
  - ac_id: AC-DAILYREPORT-0252
    given: 統計維度為依機台明細
    when: 查看麵包屑
    then: 兩層：場館 › 結算期間，分別標註依場館彙總、依機台明細；「場館」為可點連結、「結算期間」為純文字
  - ac_id: AC-DAILYREPORT-0253
    given: 統計維度為依場次明細
    when: 查看麵包屑
    then: 三層：場館 › 結算期間 › 機台帳號；前兩層可點、最後一層純文字
  - ac_id: AC-DAILYREPORT-0254
    given: 目前依場館彙總（一層）
    when: 直接於統計維度下拉選單改選依場次明細
    then: 麵包屑同步更新為三層
  - ac_id: AC-DAILYREPORT-0255
    given: 使用者在站台切換選單選擇場館 X
    when: 查看麵包屑第一層
    then: 顯示場館 X，且第一層不提供切換其他場館的控制項
  - ac_id: AC-DAILYREPORT-0256
