- requirement_id: REQ-DAILYREPORT-009
  version: 2
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: functional
  title: 場次數（計入狀態與營業日歸屬）
  statement: 「場次數」於「依場館彙總」與「依機台明細」維度顯示，為當日結束的場次筆數：依機台明細＝該機台帳號當日的場次數；依場館彙總＝該場館底下所有機台帳號當日場次數的加總。計入狀態為「已結束」「逾時結束」「日結結算」，「進行中」不計入；日結結算的場次歸屬於場次開始的營業日，不計入下一個營業日（v0.3
    2026-10-05 定案，附例：日結 06:00，S2 9/10 20:00 開始、9/11 06:00 日結結算 → 計入 9/10；餘分轉入的 S3 9/11 06:00 開始、屬 9/11，結束前不計入）。場次撐到日結時間必先被日結結算，故任何已結束的場次都落在其開始的營業日內。「依場次明細」另列進行中場次，故鑽取後的列數可能多於上一層的場次數。（v0.3
    修訂：v0.2 未寫計入狀態，逾時結束的計入方式原為 major 疑義，v0.3 已明載；與 CLR-DAILYREPORT-007 結論一致）
  acceptance_criteria:
  - ac_id: AC-DAILYREPORT-0091
    given: 機台 A 當日結束 3 場、機台 B 當日結束 2 場
    when: 維度依機台明細
    then: A 列場次數 3、B 列場次數 2
  - ac_id: AC-DAILYREPORT-0092
    given: 同上
    when: 維度依場館彙總
    then: 場次數 5
  - ac_id: AC-DAILYREPORT-0093
    given: 機台 A 有 1 場進行中
    when: 維度依機台明細
    then: 進行中場次不計入場次數
  - ac_id: AC-DAILYREPORT-0094
    given: 場館日結時間 06:00 UTC+0；機台 A 場次 S2 於 9/10 20:00 開始、9/11 06:00 被日結結算；餘分轉入的新場次 S3 於 9/11 06:00 開始、查詢時仍進行中
    when: 結算日期 9/10～9/11、按日、依機台明細查詢
    then: A 的 9/10 列場次數含 S2（計 1）；9/11 列不含 S2，S3 尚未結束不計入（9/11 列場次數 0）
    spec_reference:
