- requirement_id: REQ-DAILYREPORT-019
  version: 1
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: constraint
  title: 期初／期末餘額總計列不逐列相加（時點存量）
  statement: 期初餘額與期末餘額為時點存量，總計列（含 CSV 匯出的總計列）不做逐列相加：總計期末餘額＝各機台取其查詢範圍內時間最後一個場次／最後一個營業日結算時點的期末餘額，再跨機台相加；最後一個場次為進行中時取該場次累計至查詢當下的分數（2026-09-17
    修訂）。總計期初餘額＝各機台在查詢範圍起點前一營業日結算時點的分數（＝該機台範圍內最早場次的期初餘額），再跨機台相加。「依場次明細」查單一機台時總計期末餘額即等於最後一列的值；按日檢視時總計期末餘額就是最新一個營業日那一列的值。餘額以外的金額與筆數欄照常為各列合計。
  acceptance_criteria:
  - ac_id: AC-DAILYREPORT-0191
    given: 機台 A：場次 S1 洗分後留餘數 900 結束，場次 S2 承接該 900 後出金清空為 0
    when: 依場次明細查詢 A，查看總計列期末餘額
    then: 0（非 900；不逐列相加）
    spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.3'
      location: §列表欄位附註／期末餘額不加總（第 66 行）
      quote: 例如同一機台前一場次洗分後留餘數 900 結束、下一場次承接該 900 後出金清空為 0，兩列相加得 900，但結算時點該機台實際為 0
  - ac_id: AC-DAILYREPORT-0192
    given: 按日、依場館彙總，結算日期 9/10～9/12；9/10、9/11、9/12 列期末餘額分別 500、300、450，9/10 列期初餘額 200
    when: 查看總計列
    then: 總計期末餘額 450（最新營業日 9/12 那一列）、總計期初餘額 200（範圍起點前一營業日結算時點）；開分等金額欄為三列合計
  - ac_id: AC-DAILYREPORT-0193
    given: 依機台明細，查詢範圍內機台 A 最後一個營業日期末 200、機台 B 最後一個營業日期末 150
    when: 查看總計列期末餘額
    then: 350（各機台取最後值再跨機台相加）
  - ac_id: AC-DAILYREPORT-0194
    given: 機台 A 範圍內最後一個場次為進行中、目前分數 600；前一個已結束場次期末 0
    when: 依場次明細查詢 A，查看總計列期末餘額
    then: 600（計入進行中場次累計至查詢當下的分數，非最後一個已結束場次的 0）
    spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.3'
      location: §列表欄位附註／期末餘額不加總（第 66 行）
      quote: 改為計入進行中場次累計至查詢當下的分數
  - ac_id: AC-DAILYREPORT-0195
    given: 機台 A 範圍內最早場次期初餘額 1000，共 3 個場次
    when: 依場次明細查詢 A，查看總計列期初餘額
    then: 1000（非 3 個場次期初餘額相加）
  - ac_id: AC-DAILYREPORT-0196
    given: 已查出含多機台、多日的結果
    when: 匯出 CSV
    then: CSV 總計列的期初／期末餘額與畫面總計列一致，依同一時點值規則計算
  spec_reference:
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.3'
    location: §列表欄位附註／期末餘額不加總（第 66 行）、期初餘額比照辦理（第 68 行）
    quote: 總計列一律各機台取其查詢範圍內時間最後一個場次／最後一個營業日結算時點的期末餘額，再跨機台相加；「依場次明細」維度查單一機台時即等於最後一列的值。CSV 匯出的總計列同規則。
