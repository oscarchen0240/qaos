  statement: 「期初餘額」欄位於「期末餘額」前一欄：該結算期間起點的分數合計，即前一營業日結算時點各機台的分數。層級為場館／機台的該期間起點（＝該期間第一場場次的期初餘額），餘額涵蓋範圍與期末餘額相同（篩選條件內所有機台，含當期無場次但仍有留存分數者，沿用其最近一個營業日的結算時點值）；從未有分數者為
    0（v0.3 第 64 行釐清 v0.2「無前一營業日資料時為 0」）。「依場次明細」維度顯示該場次的期初餘額：開分／入金起始者為 0；承接洗分餘數或日結結算轉入者為承接金額；出金一律清空餘額、無餘數承接。統計週期非按日時取該週期第一個營業日之前的值（REQ-DAILYREPORT-015）。
