- requirement_id: REQ-DAILYREPORT-021
  version: 2
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  type: constraint
  title: 餘額驗算式
  statement: 每一列（及任何查詢範圍）滿足：期末餘額＝期初餘額＋開分金額＋進鈔金額＋損益－洗分金額－收據金額。損益以機台（會員）端計算（REQ-DAILYREPORT-013）；洗分／出金以交易發生為準計入（不論核實與否），作廢的收據分數已扣、不退回，仍含在收據金額內（v0.3
    新增），驗算與「已核實洗分」「已兌現金額」「已作廢金額」無關。進行中場次的分數計入期末餘額，故含進行中場次的範圍驗算式亦成立（含逾時結束場次時的成立與否見 REQ-DAILYREPORT-017 Q02）。
