- requirement_id: REQ-ARCADE-004
  version: 1
  spec_id: SPEC-ARCADE-001
  spec_version: '0.7'
  type: functional
  title: 鏈上錢包管理TWD頁籤可設定機台場館的稽核倍數
  statement: 鏈上錢包管理，於 TWD 頁籤可設定稽核倍數，供機台開分與入金依此倍數計算稽核門檻；預設值為 0 倍（即開分/入金不產生稽核門檻）（已由 Oscar 2026-09-15 確認：設定位置為鏈上錢包管理，非帳務管理出金設定；正本195/784行用詞不準確，254行「鏈上錢包管理...稽核倍數設定在此」才是正確位置）
  acceptance_criteria:
  - ac_id: AC-ARCADE-004
    given: 以 Admin 登入後台，站台切換至一個機台場館
    when: 至鏈上錢包管理 > TWD 頁籤
    then: 可見稽核倍數設定欄位，預設值顯示為 0；修改數值並儲存後，該倍數即套用於後續的機台開分與入金計算
  spec_reference:
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    location: 機台帳號的稽核／設定位置
    quote: （254行）鏈上錢包管理（僅顯示法幣 TWD 頁籤，區塊鏈頁籤隱藏——稽核倍數設定在此）；（195行原文用詞「帳務管理>出金設定」已由 Oscar 2026-09-15 確認不準確）
  ambiguity: null
  risk: high
  status: ACTIVE
  behavior_kind: success
  rejection_contract:
