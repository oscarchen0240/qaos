- requirement_id: REQ-ARCADE-002
  version: 1
  spec_id: SPEC-ARCADE-001
  spec_version: '0.7'
  type: constraint
  title: 機台帳號的投注不計入任何上層加盟商/代理的傭金與返傭計算基數
  statement: 機台帳號即使掛在某加盟商底下，該加盟商的加盟傭金與代理返傭計算基數，皆不含機台帳號產生的流水——這是機台帳號流水量級遠大於線上玩家、若不排除會使整間場館的流水被誤算成該加盟商業績的底層防護規則
  acceptance_criteria:
  - ac_id: AC-ARCADE-002
    given: 一台機台帳號掛在某加盟商站台底下且產生了投注流水
    when: 計算該加盟商當期的加盟傭金與代理返傭
    then: 該機台帳號的流水不計入計算基數，加盟商的傭金/返傭金額不因此增加
  spec_reference:
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    location: 既有功能對機台帳號的排除規則／4.5-4.6
    quote: 4.5 / 4.6｜加盟傭金／代理返傭｜不適用，機台帳號的投注不計入任何上層的傭金基數
  ambiguity: null
  risk: high
  status: ACTIVE
  behavior_kind: rejection
  rejection_contract:
