  title: 機台場館前台暫不開放自行註冊
  statement: 機台場館（含自行經營的機台主站台）的前台不提供自行註冊入口；機台帳號一律由後台建立。線上站台前台維持開放以帳號密碼方式自行註冊，不受影響
  acceptance_criteria:
  - ac_id: AC-ARCADE-001
    given: 站在一個機台場館的前台網域上
    when: 尋找自行註冊入口
    then: 找不到任何自行註冊功能；同一站台切到線上站台的前台則正常提供註冊入口，兩者形成對照
  spec_reference:
