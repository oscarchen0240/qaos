    spec_version: '0.1'
    location: §四種金流/交易不成立的原因 + §附錄-狀態碼對照
    quote: （v0.1 原文僅載明餘額不足不寫入；本規則已由 CLR-CASHFLOW-006 擴大至全部未成立原因，spec.md 待更新）
  ambiguity: null
  risk: medium
  status: ACTIVE
  behavior_kind: rejection
  rejection_contract:
