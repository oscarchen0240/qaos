  title: end-cashin 依實際清點金額判定額度上限並完成入帳
  statement: 收到 end-cashin 且 TXID 相符時，**本階段判定額度上限**（依入鈔機實際清點金額）；未超限則更新帳務、預留概念不再區分（req-cashin 未預留），回 0-OK；超限則回 1-OVER LIMIT、機台退鈔、不更新帳務。【2026-09-23
    CLR-CASHFLOW-005 RD 回覆 A，推翻 spec v07「額度上限判定與預留移至 req-cashin」定案】req-cashin 階段入鈔機尚未完成實體清點，客戶端回報的金額不可信；若此時依此數字判斷額度上限，攻擊者可宣稱鉅額數字造成整台機台卡在等待中的
    DoS。額度上限實際於 end-cashin（入鈔機清點確認完成後）依實際金額判定，超限則退鈔。開分（req-keyin，純數字輸入非實體入鈔）不受影響，維持單階段立即判定。
