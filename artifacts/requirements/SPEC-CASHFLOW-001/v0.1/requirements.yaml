- requirement_id: REQ-CASHFLOW-007
  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  type: functional
  title: 入金額度上限於 end-cashin 階段依實際清點金額判定
  statement: req-cashin 階段建立 PENDING、取得 TXID，**不**於此階段判定額度上限（客戶端回報金額未經入鈔機清點確認、不可信）；額度上限於 **end-cashin** 階段以場館鎖內「當下全場館機台分數餘額合計（已入帳）＋本筆實際清點金額」判定，未超限才更新帳務、回
    0-OK，超限則回 1-OVER LIMIT、機台退鈔、不更新帳務。【2026-09-23 CLR-CASHFLOW-005 RD 回覆 A，推翻 spec v07「額度上限判定與預留移至 req-cashin」定案】req-cashin
    階段入鈔機尚未完成實體清點，客戶端回報的金額不可信；若此時依此數字判斷額度上限，攻擊者可宣稱鉅額數字造成整台機台卡在等待中的 DoS。額度上限實際於 end-cashin（入鈔機清點確認完成後）依實際金額判定，超限則退鈔。開分（req-keyin，純數字輸入非實體入鈔）不受影響，維持單階段立即判定。
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0071
    given: req-cashin 送出（不論金額，本階段不判定額度）
    when: 送出 req-cashin
    then: 建立 PENDING 並取得 TXID，尚未判定額度上限、尚未預留
  - ac_id: AC-CASHFLOW-0072
    given: end-cashin 確認時（實際清點金額），全場館機台分數餘額合計（已入帳）＋本筆實際清點金額 將超過額度上限
    when: 送出 end-cashin
    then: 回 1-OVER LIMIT，不更新帳務、不關閉為已完成，機台退鈔
  - ac_id: AC-CASHFLOW-0073
    given: 兩筆入金的 end-cashin 幾乎同時到達，各自單看不超限但合計會超限
    when: 依場館鎖逐筆序列化處理
    then: 場館鎖內逐筆序列化判定：先處理的一筆通過並入帳，第二筆的判定基準已包含第一筆的實際入帳金額，因而正確被擋下回 1-OVER LIMIT
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    location: §附錄-入金
    quote: （v07 定案已作廢，見 CLR-CASHFLOW-005；本欄不再逐字引用 spec.md，待正本更新）
  ambiguity: null
