  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  type: functional
  title: 出金第一階段 15 秒逾時的死單風險
  statement: 機台送出 req-cashout 後 15 秒未收到回覆即直接結束程序（收據不印），但平台此時已建立 PENDING，該筆將永遠等不到 end-cashout，須由新的 req-cashout 取代（見 REQ-CASHFLOW-019
    出金PENDING唯一性）或人工出金連動取消（REQ-CASHFLOW-027）收斂。（2026-09-15 已由 Oscar 確認移除：原「Admin手動取消」這條路徑——交易紀錄查詢頁不存在手動取消功能，洗分出金核實頁的「作廢」操作僅適用於已完成的出金交易，範圍對不上待確認狀態的出金PENDING）
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0261
    given: req-cashout 已建立 PENDING，機台 15 秒內未收到回覆而結束程序
    when: 檢視該 PENDING 狀態
    then: PENDING 持續停留在待確認，不會自動結束；需靠新的 req-cashout（依 REQ-CASHFLOW-019 取代）或櫃檯對該機台帳號執行人工出金（依 REQ-CASHFLOW-027 連動取消既有 PENDING）才能收斂——不存在「Admin
      手動取消」這個操作（2026-09-15已由Oscar確認，交易紀錄查詢頁沒有此功能）
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    location: §附錄-出金
    quote: 第一階段有 15 秒逾時…但平台此時已建立 PENDING，該筆將永遠等不到 end-cashout，須由新的 req-cashout 取代或 Admin 手動取消收斂
  ambiguity: null
