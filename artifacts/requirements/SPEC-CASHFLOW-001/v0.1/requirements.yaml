- requirement_id: REQ-CASHFLOW-030
  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  type: functional
  title: 所有未成立原因一律不寫入交易紀錄
  statement: 任何交易被判定為未成立（不論原因為額度上限、資料格式錯誤、機台停用/場館未開通、憑證失效或餘額不足），平台一律不寫入交易紀錄，僅回覆對應狀態碼；交易紀錄查詢／機台交易紀錄不會出現任何「未成立」狀態的紀錄。【2026-09-23
    CLR-CASHFLOW-006 回覆 B】所有未成立原因（額度上限、資料格式錯誤、機台停用/場館未開通、憑證失效等）一律不寫入交易紀錄，理由與 CLR-CASHFLOW-005 一致：客戶端未經驗證的輸入若被拒絕仍留紀錄，攻擊者可高頻觸發使資料庫被大量無用紀錄灌爆。spec.md
    正本相關文字（未成立原因、附錄狀態碼對照）待更新。
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0301
    given: 洗分或出金因餘額不足被拒絕
    when: 檢視機台交易紀錄
    then: 查無此次拒絕的紀錄，僅收到 1-NO CREDITS 回覆
  - ac_id: AC-CASHFLOW-0302
    given: 交易因額度上限、資料格式錯誤、機台停用/場館未開通或憑證失效等任一未成立原因被拒絕
    when: 檢視機台交易紀錄
    then: 查無此次拒絕的紀錄，僅收到對應狀態碼；不會以「未成立」狀態出現在交易紀錄查詢中
  spec_reference:
