- requirement_id: REQ-CASHFLOW-023
  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  type: functional
  title: 出金印表機異常的兩種情況
  statement: 此規則為印表機到位後的正式流程（過渡期見 REQ-CASHFLOW-025，不適用本規則）：列印還沒開始就偵測到異常時，機台直接結束流程、不呼叫 end-cashout，分數不扣、保留在機台上，但平台因先前 req-cashout
    已建立的 PENDING 仍留有一筆「待確認」的出金；已送入列印佇列後才實體故障（卡紙缺紙）時，分數照扣、收據待狀況排除後自動印出
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0231
    given: 按下結算時印表機已有異常（列印尚未開始）
    when: 機台直接結束流程
    then: 機台不呼叫 end-cashout，分數不扣、保留在機台上；但平台因先前 req-cashout 已建立的 PENDING 仍留有一筆「待確認」的出金（現場其實什麼也沒發生，該 PENDING 依 REQ-CASHFLOW-026
      的既有機制收斂）
  - ac_id: AC-CASHFLOW-0232
    given: 收據已送入列印佇列後才卡紙或缺紙
    when: 檢視分數與收據狀態
    then: 分數已扣（出金已完成），收據仍在佇列中，待現場排除狀況後自動印出，不可視為未出金而重做
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    location: §四種金流/出金 + §四種金流/出金（過渡期）
    quote: 過渡期不適用：「印出成功」的定義、印表機異常兩種情況、收據延遲印出…列印還沒開始就偵測到異常…機台直接結束流程、不通知平台，分數不扣、保留在機台上。平台這邊會留下一筆「待確認」的出金，現場其實什麼也沒發生
  ambiguity: null
