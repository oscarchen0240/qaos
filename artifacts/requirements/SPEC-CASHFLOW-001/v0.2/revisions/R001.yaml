- requirement_id: REQ-CASHFLOW-007
  version: 2
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: functional
  title: 入金額度上限於 end-cashin 階段依實際清點金額判定
  statement: req-cashin 階段只建立 PENDING、取得 TXID，不判定額度上限、不預留額度（客戶端回報的金額未經入鈔機清點確認、不可信）；額度上限於 end-cashin 階段在場館鎖內逐筆序列化，以「當下全場館機台分數餘額合計（已入帳）＋本筆實際清點金額」判定，未超限才更新帳務、回
    0-OK，超限則回 1-OVER LIMIT、機台退鈔、不更新帳務。開分（req-keyin）不受影響，維持單階段立即判定（CLR-CASHFLOW-005）
  rationale: CLR-CASHFLOW-005 的理由：req-cashin 的金額是客戶端回報、未經入鈔機實體清點，依此判定額度會被宣稱鉅額數字造成整台機台卡住（DoS）。spec v0.2 仍為 v07 寫法（見 doc_issues）
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0071
    given: req-cashin 送出（不論金額，本階段不判定額度）
    when: 送出 req-cashin
    then: 建立 PENDING 並取得 TXID，尚未判定額度上限、不預留額度
  - ac_id: AC-CASHFLOW-0072
    given: end-cashin 確認時（實際清點金額），全場館機台分數餘額合計（已入帳）＋本筆實際清點金額將超過額度上限
    when: 送出 end-cashin
    then: 回 1-OVER LIMIT，不更新帳務、不關閉為已完成，機台退鈔
  - ac_id: AC-CASHFLOW-0073
    given: 同場館兩筆入金的 end-cashin 幾乎同時到達，各自單看不超限但合計會超限
    when: 依場館鎖逐筆序列化處理
    then: 先處理的一筆通過並入帳，第二筆的判定基準已包含第一筆的實際入帳金額，因而被擋下回 1-OVER LIMIT
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.2'
    location: §入金（`req-cashin` → `end-cashin`）（第 325 行）
    quote: 額度上限於本階段判定並預留（v07 定案）
