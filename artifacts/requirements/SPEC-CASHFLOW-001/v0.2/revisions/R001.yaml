- requirement_id: REQ-CASHFLOW-049
  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: security
  title: 機台憑證（JWT）驗證
  statement: 所有機台 API 以平台簽發的 JWT 機台憑證（Bearer）驗證：除簽章外須比對該機台現行有效的憑證識別，重置後舊 token 一律拒絕；憑證不設有效期限，僅靠重置使舊憑證失效；驗證失敗回 9-OTHER ERROR（憑證失效）
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0491
    given: 機台憑證已被重置，機台仍以舊 token 呼叫任一 API
    when: 平台驗證憑證
    then: 拒絕，回 9-OTHER ERROR（憑證失效），不寫入任何帳務異動
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §附錄：機台系統對接規格（開發團隊用）（第 282 行）
      quote: 驗證除簽章外須比對該機台現行有效的憑證識別，重置後舊 token 一律拒絕；不設有效期限（v07 定案），僅靠重置使舊憑證失效
  - ac_id: AC-CASHFLOW-0492
    given: 機台以簽發已久、未被重置的有效 token 呼叫 API
    when: 平台驗證憑證
    then: 因憑證不設有效期限，驗證通過、正常受理
    spec_reference:
