- requirement_id: REQ-CASHFLOW-008
  version: 2
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: functional
  title: 待確認入金沒有手動取消，只依 24 小時逾時收斂
  statement: 待確認入金（PENDING）沒有手動取消操作（管理員、站長皆無），只會因 end-cashin 成功入帳而完成，或超過 24 小時由排程轉為「已逾時」而收斂。入金不於 req-cashin 預留額度（REQ-CASHFLOW-007），因此入帳、逾時時都沒有預留需要轉換或釋放（CLR-CASHFLOW-004、CLR-CASHFLOW-008
    rev 1、CLR-CASHFLOW-005）
  rationale: 入金死單只能等 24 小時逾時，沒有立即處理的手動路徑，非資金卡死風險，屬已知限制（CLR-CASHFLOW-004）。spec v0.2 仍寫管理員／站長手動取消並釋放預留（見 doc_issues）
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0081
    given: 待確認入金（req-cashin 未預留額度）
    when: end-cashin 成功入帳
    then: 分數入帳、該筆轉為已完成；不涉及預留額度的轉換
  - ac_id: AC-CASHFLOW-0082
    given: 待確認入金
    when: 超過 24 小時未完成
    then: 自動轉為已逾時，分數不增加；不涉及預留額度的釋放
  - ac_id: AC-CASHFLOW-0083
    given: 待確認入金
    when: 管理員或站長於交易紀錄查詢該筆
    then: 沒有手動取消入金的操作；該筆只能等 end-cashin 完成或 24 小時逾時收斂
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.2'
    location: §入金（`req-cashin` → `end-cashin`）（第 326 行）
    quote: 管理員／站長於交易紀錄手動取消該筆待確認入金時立即釋放
