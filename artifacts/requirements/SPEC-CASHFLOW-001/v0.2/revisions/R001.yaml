- requirement_id: REQ-CASHFLOW-026
  version: 2
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: functional
  title: 待確認出金不設逾時與死單收斂路徑（含管理員手動取消）
  statement: 機台送出 req-cashout 後 15 秒未收到回覆即直接結束程序（收據不印），但平台已建立的 PENDING 永遠等不到 end-cashout。出金 PENDING 不設逾時，保留至完成或以下三條路徑之一收斂：被新的
    req-cashout 取代（REQ-CASHFLOW-019）、櫃檯人工出金連動取消（REQ-CASHFLOW-027）、管理員手動取消。管理員手動取消後交易標記為「已取消」、分數不異動；Operator Reset 後機台停止重送、機台報廢等死單，以管理員手動取消清理
  rationale: 2026-09-15 CLR-CASHFLOW-004 曾移除「Admin 手動取消」路徑；2026-10-12 CLR-CASHFLOW-008 確認恢復（僅管理員，RD 已確認），並說明 CLR-CASHFLOW-004
    對出金的該部分不再適用；spec v0.2 原文亦保留此路徑。CLR-CASHFLOW-008 補充：操作位置在 4.1 交易紀錄查詢機台視角（屬 SPEC-TXLOG，不在本包範圍），後端已開發完成、前端尚未開發——依賴 UI 的 TC
    執行前需確認前端進度
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0261
    given: req-cashout 已建立 PENDING，機台 15 秒內未收到回覆而結束程序
    when: 檢視該 PENDING 狀態
    then: PENDING 持續停留在待確認、不會自動結束；只會因新的 req-cashout 取代、櫃檯人工出金連動取消或管理員手動取消而收斂
  - ac_id: AC-CASHFLOW-0262
    given: 機台帳號有一筆待確認出金（PENDING）
    when: 管理員手動取消該筆
    then: 交易標記為「已取消」，機台分數不異動；之後機台送來該 TXID 的 end-cashout 因查無對應 PENDING 回 1-NO RECORD
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §出金（`req-cashout` → `end-cashout`）（第 345 行）
      quote: 平台此時已建立 PENDING，該筆將永遠等不到 `end-cashout`，須由新的 `req-cashout` 取代或 管理員 手動取消收斂
  - ac_id: AC-CASHFLOW-0263
    given: 第二階段遲遲未成功，現場 Operator 於機台選單執行 Reset，機台停止重送
    when: 檢視並處理平台端的 PENDING
    then: PENDING 停在待確認、不會自動結束；由管理員手動取消後轉為「已取消」
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §出金（`req-cashout` → `end-cashout`）（第 348 行）
      quote: Reset 後機台停止重送，平台端的 PENDING 只能由 管理員 手動取消
