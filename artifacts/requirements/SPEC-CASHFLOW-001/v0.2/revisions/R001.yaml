- requirement_id: REQ-CASHFLOW-048
  version: 1
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: functional
  title: 機台交易的紀錄類型與會員列表累計時點
  statement: 機台入金、洗分、出金的交易紀錄類型分別為「機台入金」（正值）、「機台洗分」（負值）、「機台出金」（負值）。機台開分與入金於交易完成當下直接累計存款次數／金額；機台洗分與出金不於完成當下累計，於「洗分出金核實」頁核實當下累計提款次數／金額，待核實與已作廢不計；金額以站台核心貨幣原值累計、不換算
    USDT；人工入金與人工出金一律不計入這四個欄位
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0481
    given: 機台入金完成（分數入帳）
    when: 檢視交易紀錄與會員列表
    then: 交易類型為「機台入金」、金額為正值；當下累計存款次數 +1、存款金額加上該筆
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §入金（第 93 行）
      quote: 交易完成（分數入帳）當下直接累計進該機台帳號於會員列表的「存款次數」「存款金額」（不需核實；2026-09-04 定案）
  - ac_id: AC-CASHFLOW-0482
    given: 機台洗分（或出金）完成但尚未核實
    when: 檢視交易紀錄與會員列表
    then: 交易類型為「機台洗分」（或「機台出金」）、金額為負值；提款次數／金額尚未累計
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §洗分（第 132 行）
      quote: 本筆不於完成當下累計進會員列表的「提款次數」「提款金額」，而是於「洗分出金核實」頁核實當下才累計（2026-09-04 定案）
  - ac_id: AC-CASHFLOW-0483
    given: 該筆洗分或出金於「洗分出金核實」頁核實
    when: 檢視會員列表
    then: 提款次數 +1、提款金額加上該筆（以核心貨幣原值）；已作廢者不計
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §業務規則與驗證（本包相關）（第 258 行）
      quote: 提款次數／提款金額累計機台洗分與機台出金——於「洗分出金核實」頁核實當下累計，待核實與已作廢不計
  - ac_id: AC-CASHFLOW-0484
    given: 櫃檯對機台帳號人工入金或人工出金
    when: 檢視會員列表
    then: 存款／提款次數與金額皆不變
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §業務規則與驗證（本包相關）（第 258 行）
      quote: 人工入金與人工出金一律不計入
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.2'
    location: §業務規則與驗證（本包相關）（第 258 行）
