  type: functional
  title: 場次資訊欄位與進行中場次的期末餘額
  statement: 每個場次記錄場次編號、場館／機台、場次狀態（進行中／已結束／逾時結束／日結結算）、開始／結束時間（UTC+0，進行中結束時間顯示「—」）、場次時長（進行中累計至查詢當下）、期初餘額、開分／入金金額、洗分／出金金額、投注筆數、有效投注額、損益、期末餘額。期末餘額為場次結束時的分數（歸零結束與出金結束為
    0；洗分結束留有餘數時為該餘數）；進行中場次顯示累計至查詢當下的分數，場館日結報表的期末餘額亦計入進行中場次的當前分數（2026-09-17 定案）
  rationale: v0.2 新增（v0.1 為「取最後一個已結束場次」的舊定義已於 2026-09-17 修訂）。場次不另設獨立頁面，呈現於會員詳細頁、機台交易紀錄、場館日結報表（屬其他 spec），本需求只定義場次資料本身
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0461
    given: 機台有一個進行中場次，目前分數 1,250
    when: 查詢該場次資訊
    then: 期末餘額顯示 1,250（累計至查詢當下），結束時間顯示「—」，場次時長累計至查詢當下
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §場次資訊（第 232 行）
      quote: 進行中場次顯示累計至查詢當下的分數（2026-09-17 定案，比照「場次時長」；場館日結報表的期末餘額亦計入進行中場次的當前分數）
  - ac_id: AC-CASHFLOW-0462
    given: 場次因洗分結束且留有餘數 21；另一場次因出金結束
    when: 查詢兩個場次的資訊
    then: 洗分結束的場次期末餘額為 21、出金結束的場次期末餘額為 0
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §場次資訊（第 232 行）
      quote: 場次結束時的分數（歸零結束與出金結束為 0；洗分結束留有餘數時為該餘數）
  - ac_id: AC-CASHFLOW-0463
    given: 一個場次由開分起始，另一個場次承接前一場次的洗分餘數 21
    when: 查詢兩個場次的期初餘額
    then: 開分起始者期初餘額為 0，承接餘數者期初餘額為 21
    spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §場次資訊（第 226 行）
      quote: 場次開始時的分數（開分／入金起始者為 0；承接洗分餘數或日結結算轉入者為承接金額）
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.2'
