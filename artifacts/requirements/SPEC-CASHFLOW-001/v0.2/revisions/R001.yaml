- requirement_id: REQ-CASHFLOW-030
  version: 2
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  type: functional
  title: 所有未成立原因一律不寫入交易紀錄
  statement: 任何交易被判定為未成立（不論原因為額度上限、資料格式錯誤、機台停用/場館未開通、憑證失效或餘額不足），平台一律不寫入交易紀錄，僅回覆對應狀態碼；交易紀錄查詢／機台交易紀錄不會出現任何「未成立」狀態的紀錄（CLR-CASHFLOW-006）
  rationale: CLR-CASHFLOW-006 的理由：被拒絕的客戶端輸入若都留紀錄，攻擊者可高頻觸發灌爆資料庫，與 CLR-CASHFLOW-005 的防禦設計一致；交易紀錄只會有已完成、待確認、已取消、已逾時四種狀態。spec
    v0.2 仍寫會留下「未成立」紀錄（見 doc_issues）
  acceptance_criteria:
  - ac_id: AC-CASHFLOW-0301
    given: 洗分或出金因餘額不足被拒絕
    when: 檢視機台交易紀錄
    then: 查無此次拒絕的紀錄，僅收到 1-NO CREDITS 回覆
  - ac_id: AC-CASHFLOW-0302
    given: 交易因額度上限、資料格式錯誤、機台停用/場館未開通或憑證失效等任一未成立原因被拒絕
    when: 檢視機台交易紀錄
    then: 查無此次拒絕的紀錄，僅收到對應狀態碼；不會以「未成立」狀態出現在交易紀錄查詢中
  spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.2'
    location: §交易不成立的原因（第 185 行）
    quote: 不寫入交易紀錄（2026-09-03 定案）——平台僅回覆機台餘額不足；本表其餘原因才會留下「未成立」紀錄
  ambiguity:
    level: none
    raised_level: major
    description: Q02（major，conflict）餘額不足以外的未成立原因是否寫入交易紀錄：spec v0.2 與 CLR-CASHFLOW-006 衝突，已依 CLR-CASHFLOW-006 rev 0 裁決（一律不寫入）
  related_requirement_ids:
  - REQ-CASHFLOW-029
  risk: medium
