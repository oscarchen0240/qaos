    statement: 重置方式為每日／每週一／每月 1 日／不重置。線上站台於 UTC+0 00:00 切分；機台場館於場館「日結時間」切分（每週／每月週期亦同），與場館日結報表的營業日對齊；表單提示同時顯示該場館日結時間的 UTC+0
      與台灣時間。週期重置時累計歸零，該帳號所有待開啟紅包作廢，已入帳紀錄不受影響。
