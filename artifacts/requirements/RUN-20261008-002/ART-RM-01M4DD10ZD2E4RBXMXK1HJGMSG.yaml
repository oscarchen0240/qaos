  - requirement_id: REQ-REDPACKET-026
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: constraint
    title: 機台帳號參與紅包：排除規則逐項解除與後台入口
    statement: 機台帳號參與紅包為排除規則「6.5 優惠活動」的逐項解除（僅解除紅包類型，其餘優惠類型維持排除），須經政策層處理，不得在紅包功能內硬編碼帳號類型判斷。機台場館的後台入口：優惠活動管理僅開放「紅包」類型，活動排程僅顯示「紅包活動」子分頁。機台場館啟用紅包之前，維持正本與開發包⑥現行的排除規則與選單（第
      342、349 行：啟用時才同步改版）。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0261
      given: 機台場館已啟用紅包
      when: 站台切換到機台場館
      then: 後台選單顯示優惠活動管理，且只能新增「紅包」類型
    - ac_id: AC-REDPACKET-0262
      given: 機台場館已啟用紅包
      when: 嘗試以機台帳號參加首儲、簽到等其他優惠
      then: 仍被排除
    - ac_id: AC-REDPACKET-0263
      given: 機台場館尚未啟用紅包
      when: 站台切換到機台場館；機台帳號注單結算
      then: 後台選單不顯示優惠活動管理；機台帳號不累計、不產生紅包（維持排除規則 6.5）
