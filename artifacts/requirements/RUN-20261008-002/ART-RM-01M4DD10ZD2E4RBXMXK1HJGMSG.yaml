  - requirement_id: REQ-REDPACKET-008
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 累計基準：有效流水貢獻與幣種換算
    statement: 累計基準為有效流水貢獻（有效投注額 × 貢獻系數），以注單結算時點計入，只計以「活動幣種」下注的注單；貢獻系數為 0 的遊戲不計入。非核心貨幣注單的有效流水貢獻於注單結算當下依系統匯率（幣安 API）換算為核心貨幣後計入，換算後不因匯率變動重算。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0081
      given: 活動幣種 USDT、EUR、USD（未勾 BTC），核心貨幣 USDT
      when: 玩家依序結算 USDT 400、EUR 300（匯率 1.08）、USD 500 系數 50%、BTC 0.01、EUR 100（匯率 1.10）
      then: 週期累計依序為 400、724、974、974、1,084
    - ac_id: AC-REDPACKET-0082
      given: 第 2 筆 EUR 注單已以 1.08 換算為 324
      when: 之後 EUR 匯率變動
      then: 第 2 筆仍計 324，不重算
    - ac_id: AC-REDPACKET-0083
