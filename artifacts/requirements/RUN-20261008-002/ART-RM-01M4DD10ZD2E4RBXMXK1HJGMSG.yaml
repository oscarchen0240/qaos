    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 機台前台：達標彈窗、保留於錢包彈窗與作廢提示
    statement: 機台場館累計達門檻時，於當局結束後在機台遊戲畫面彈出紅包；玩家點擊開啟 → 顯示金額 → 分數即時增加。玩家未開啟即關閉彈窗時，紅包保留於遊戲首頁錢包彈窗內（與結算鍵同處）可再次開啟。玩家於錢包彈窗按結算鍵、或店員洗分時，若尚有待開啟紅包，前台提示「尚有紅包未開啟，交易完成後將作廢」。洗分或出金請求送出後、交易完成前，紅包按鈕停用並顯示「交易處理中」；交易取消或未成立即恢復可開啟。提示的觸發時點、文字與位置（機台前台，含店員洗分時）由第
      173 行定義；呈現樣式由前台設計另定（第 176 行）。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0271
      given: 機台本局中累計達門檻
      when: 本局結束
      then: 機台畫面彈出紅包
    - ac_id: AC-REDPACKET-0272
      given: 彈出的紅包未開啟
      when: 玩家關閉彈窗
      then: 紅包保留於遊戲首頁錢包彈窗內，可再次開啟
    - ac_id: AC-REDPACKET-0273
      given: 尚有待開啟紅包
      when: 玩家於錢包彈窗按結算鍵
      then: 前台提示「尚有紅包未開啟，交易完成後將作廢」
    - ac_id: AC-REDPACKET-0274
      given: 店員已送出洗分、交易尚未完成
      when: 玩家查看紅包
      then: 紅包按鈕停用並顯示「交易處理中」
