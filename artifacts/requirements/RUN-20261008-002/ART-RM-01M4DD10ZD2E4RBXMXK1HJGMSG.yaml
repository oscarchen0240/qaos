    spec_version: '0.1'
    type: functional
    title: 切換會員等級方案時依 VIP 等級序號對應
    statement: 活動期間於 6.2 切換生效的會員等級方案時，等級規則依 VIP 等級序號對應新方案的等級；新方案沒有的序號：該勾選不對應任何會員；新方案多出、未被勾選的序號依預設規則開關（開啟適用預設規則、關閉不參加）；會員因切換而序號改變時視同會員等級變動。活動設定與列表的等級名稱改顯示新方案名稱；新方案沒有的序號顯示「序號（目前方案無此等級）」。紅包明細的適用規則記錄產生當下的序號與等級名稱，切換後不改寫。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0071
      given: 等級規則 1 勾選序號 3，原方案第 3 級名為 Silver
      when: 於 6.2 切換為第 3 級名為 Gold3 的新方案
      then: 等級規則 1 改適用新方案第 3 級，設定與列表顯示新名稱
    - ac_id: AC-REDPACKET-0072
      given: 等級規則勾選序號 7，新方案只有 6 級
      when: 切換方案
      then: 該勾選不對應任何會員，顯示「7（目前方案無此等級）」
    - ac_id: AC-REDPACKET-0073
      given: 切換前已產生的紅包適用規則顯示「等級規則 1（3・Silver）」
      when: 切換方案後檢視紅包明細
      then: 仍顯示「等級規則 1（3・Silver）」不改寫
