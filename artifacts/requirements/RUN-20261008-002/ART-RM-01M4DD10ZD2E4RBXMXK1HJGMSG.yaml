    title: 成本試算（每個規則）
    statement: 成本試算由系統自動計算、不可編輯，每個規則各自計算並顯示於該規則區塊：單個紅包期望金額＝Σ（各獎項金額 × 中獎機率），固定金額時即紅包金額；每帳號單週期最高成本＝權重表最大獎項金額（或固定金額）× 單週期發放上限；成本占比＝單個紅包期望金額
      ÷ 累積門檻；預算約可發放＝活動總預算 ÷ 該規則單個紅包期望金額（無條件捨去），未設總預算時顯示「不限」。顯示格式（SPEC-REDPACKET-002@0.1 costHtml()）：期望金額與最高成本最多兩位小數、不補尾零；成本占比以百分比顯示兩位小數（期望金額
      ÷ 門檻 × 100），門檻未填時顯示「—」；預算約可發放以千分位整數加「個」顯示，期望金額為 0 時顯示「—」；權重表機率合計不為 100% 時期望金額標示「（機率未滿 100%，僅供參考）」。
