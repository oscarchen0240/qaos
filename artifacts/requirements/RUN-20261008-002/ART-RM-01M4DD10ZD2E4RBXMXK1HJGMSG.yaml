  - requirement_id: REQ-REDPACKET-020
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 整體試算（兩組以上生效規則，依涵蓋會員人數加權）
    statement: 有兩組以上生效的規則時，於規則設定區塊下方顯示整體試算，並在新增／移除等級規則、改勾適用等級、切換預設規則開關或修改任一規則欄位時即時重算。涵蓋會員人數＝該規則適用等級在 6.2 生效方案的「會員人數」合計（預設規則為所有未被等級規則勾選的等級合計；關閉的預設規則不計入），並顯示於各規則標題旁。整體期望金額＝Σ（各規則期望金額
      × 涵蓋人數）÷ Σ 涵蓋人數；每帳號單週期最高成本取各規則最大值；整體成本占比同法加權；預算約可發放＝總預算 ÷ 整體期望金額（無條件捨去），未設顯示「不限」。涵蓋人數合計為 0 時，整體期望金額、整體成本占比與預算約可發放顯示「—」；畫面標註「依目前會員人數估算，僅供參考」。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0201
      given: 預設規則（涵蓋 300 人，期望 10）與等級規則 1（涵蓋 100 人，期望 30）
      when: 檢視整體試算
      then: 整體期望金額 (10×300＋30×100)÷400＝15
    - ac_id: AC-REDPACKET-0202
      given: 只有一組生效規則
      when: 檢視規則設定
      then: 不顯示整體試算
    - ac_id: AC-REDPACKET-0203
      given: 兩組規則的涵蓋會員人數合計為 0
      when: 檢視整體試算
      then: 整體期望金額、整體成本占比與預算約可發放顯示「—」
    - ac_id: AC-REDPACKET-0204
      given: 整體試算已顯示
      when: 改勾等級規則的適用等級
      then: 即時重算
