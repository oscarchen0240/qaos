  - requirement_id: REQ-REDPACKET-017
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: constraint
    title: 同一站台同一時間僅一個進行中的紅包活動
    statement: 同一站台同一時間僅能有一個進行中的紅包活動，排程時間重疊時阻擋儲存；重疊判斷只計「進行中」與「排程中」的活動，已取消的活動不占用時段，取消後可立即以相同時段重建。重疊以時間區間嚴格交疊判斷（首尾相接不算重疊；永久活動視為無結束時間），已結束的活動不列入；重疊時於活動時間欄提示衝突的活動名稱（SPEC-REDPACKET-002@0.1）。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0171
      given: 站台已有 10/01～10/31 排程中的紅包活動
      when: 新增 10/15～11/15 的紅包活動並儲存
      then: 阻擋儲存，活動時間欄顯示「與「（既有活動名稱）」的活動時間重疊：同一站台同一時間僅能有一個進行中的紅包活動」
      spec_reference:
        spec_id: SPEC-REDPACKET-002
        spec_version: '0.1'
        location: L895 saveAdd()
        quote: 的活動時間重疊：同一站台同一時間僅能有一個進行中的紅包活動
    - ac_id: AC-REDPACKET-0172
      given: 站台已有永久生效的進行中紅包活動
      when: 新增任何時段的紅包活動
      then: 阻擋儲存
    - ac_id: AC-REDPACKET-0173
      given: 10/01～10/31 的紅包活動已取消排程
      when: 以相同時段新增紅包活動
      then: 可成功建立
    - ac_id: AC-REDPACKET-0174
      given: 站台已有 2026-10-01 00:00～2026-10-31 23:59 排程中的紅包活動
      when: 新增開始時間 2026-10-31 23:59、結束時間 2026-11-30 23:59 的紅包活動並儲存
      then: 首尾時間相接不視為重疊（開始時間須早於對方結束時間才算重疊），可成功建立
      spec_reference:
        spec_id: SPEC-REDPACKET-002
        spec_version: '0.1'
        location: L862 overlaps()
        quote: function overlaps(s1,e1,s2,e2){return s1<(e2||Infinity)&&s2<(e1||Infinity);}
    - ac_id: AC-REDPACKET-0175
      given: 站台有一個狀態為「已結束」的紅包活動
      when: 新增與其時段重疊的紅包活動並儲存
      then: 已結束的活動不列入重疊判斷，可成功建立
      spec_reference:
        spec_id: SPEC-REDPACKET-002
        spec_version: '0.1'
        location: L893 saveAdd()
        quote: getStatus(a)!=='expired'
    spec_reference: &id017
      spec_id: SPEC-REDPACKET-001
