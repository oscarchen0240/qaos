  - requirement_id: REQ-REDPACKET-028
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 機台完成洗分／出金時作廢待開啟紅包與交易進行中鎖
    statement: 機台帳號完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢（作廢原因機台洗分／機台出金），累計進度不歸零。紅包入帳與機台洗分／出金使用同一把帳號鎖：洗分或出金請求送出後、交易完成前，紅包不可開啟；交易完成依上述作廢，交易取消或未成立則恢復可開啟。出金停在「待確認」期間屬交易進行中、紅包不可開啟；該筆被
      Admin 手動取消或被新出金取代（狀態「已取消」）時恢復可開啟（新出金本身仍在進行中則繼續鎖定）；過渡期由前台完成的出金以前台回報完成、平台扣分成功為完成時點。洗分為單階段交易，鎖定只在請求送出至平台回覆之間。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0281
      given: 機台有 1 個待開啟紅包、週期累計 300
      when: 店員洗分完成
      then: 紅包作廢（作廢原因「機台洗分」），週期累計仍為 300
    - ac_id: AC-REDPACKET-0282
      given: 機台有待開啟紅包
      when: 玩家按結算出金且扣分成功
      then: 紅包作廢（作廢原因「機台出金」）
    - ac_id: AC-REDPACKET-0283
      given: 出金請求已送出、尚未完成
      when: 嘗試開啟紅包
      then: 不可開啟
    - ac_id: AC-REDPACKET-0284
      given: 洗分因餘額不足未成立
      when: 查看紅包
      then: 紅包恢復可開啟，不作廢
    - ac_id: AC-REDPACKET-0285
      given: 出金請求已受理、交易停在「待確認」（尚未收到完成回報）
      when: 玩家嘗試開啟待開啟紅包
      then: 不可開啟，直到該筆出金完成或取消
      spec_reference:
        spec_id: SPEC-REDPACKET-001
        spec_version: '0.1'
        location: §業務規則與驗證 L329
        quote: 洗分或出金請求送出後、交易完成前，紅包不可開啟
    - ac_id: AC-REDPACKET-0286
      given: 出金停在「待確認」期間紅包不可開啟
      when: Admin 於機台交易紀錄手動取消該筆出金（狀態轉「已取消」）
      then: 紅包恢復可開啟，不作廢
      spec_reference:
        spec_id: SPEC-REDPACKET-001
        spec_version: '0.1'
        location: §業務規則與驗證 L329
        quote: 交易取消或未成立則恢復可開啟
    - ac_id: AC-REDPACKET-0287
      given: 過渡期（機台暫無印表機），機台有待開啟紅包
      when: 玩家於前台按結算，前台回報完成、平台扣分成功
      then: 待開啟紅包作廢（作廢原因「機台出金」）
      spec_reference:
        spec_id: SPEC-ARCADE-001
        spec_version: '0.7'
        location: §出金 L461
        quote: 扣分時點＝前台回報完成、平台扣分成功當下
    spec_reference: &id028
      spec_id: SPEC-REDPACKET-001
      spec_version: '0.1'
      location: §業務規則與驗證 L328
      quote: 機台帳號完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢；累計進度不歸零
    ambiguity:
      level: major
      description: 櫃檯對機台帳號執行人工出金（扣分）時，是否視同「出金」而作廢待開啟紅包、作廢原因為何；人工入金（補分）是否影響待開啟紅包。待確認期間的鎖定、取消與被取代後恢復、過渡期前台出金已由 Q03 定義
      raised_level: major
