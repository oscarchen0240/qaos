    title: 紅包明細：篩選、列表欄位、總計與匯出 CSV
    statement: 紅包明細（優惠活動管理 > 活動排程 > 紅包活動 > 點擊活動名稱）列出該活動所有紅包。篩選：會員編號（多筆以「,」分隔；機台場館即機台帳號）、規則（僅有等級規則的活動顯示）、紅包狀態、產生時間（UTC+0）；搜尋／清除。列表欄位：紅包編號、會員編號、適用規則（產生當下的規則與序號・等級名稱，切換方案後不改寫；機台固定「預設規則」）、場次編號（產生當下的場次，僅供爭議追溯；線上顯示「—」）、產生時間、週期累計、紅包金額、稽核倍數、狀態、入帳時間、作廢原因（週期重置／活動結束／機台洗分／機台出金）。列表底部顯示篩選結果的紅包金額總計（僅計已入帳）；右上角「匯出
      CSV」匯出整個查詢結果。
    acceptance_criteria:
