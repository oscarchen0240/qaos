      when: 升級後有注單結算
      then: 已達新規則上限，停止累計直到重置
    - ac_id: AC-REDPACKET-0064
      given: 時點 1 依預設規則產生的待開啟紅包 10 USDT
      when: 升級後開啟該紅包
      then: 入帳 10 USDT，稽核倍數依產生當下的預設規則
    - ac_id: AC-REDPACKET-0065
