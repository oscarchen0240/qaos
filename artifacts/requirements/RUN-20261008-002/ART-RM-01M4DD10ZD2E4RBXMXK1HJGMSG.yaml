  - requirement_id: REQ-REDPACKET-032
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 場館日結報表新增紅包金額欄與餘額驗算式
    statement: 場館日結報表新增「紅包金額」欄（當日已入帳紅包合計）；餘額驗算式改為 期末餘額 ＝ 期初餘額 ＋ 開分 ＋ 進鈔 ＋ 紅包金額 ＋ 損益 － 洗分 － 收據；現金淨收不變（紅包無現金流入）。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0321
      given: 某營業日機台期初 1,000、開分 1,500、進鈔 2,500、紅包入帳 30、損益 0、洗分 1,000、收據 3,500
      when: 查詢場館日結報表
      then: 紅包金額 30；期末餘額 530 ＝ 1,000＋1,500＋2,500＋30＋0－1,000－3,500
    - ac_id: AC-REDPACKET-0322
      given: 同一營業日有紅包入帳
      when: 檢視現金淨收
      then: 現金淨收不含紅包金額（開分＋進鈔－已核實洗分－已兌現）
    - ac_id: AC-REDPACKET-0323
      given: 同一營業日有待開啟與已作廢紅包
      when: 檢視紅包金額
      then: 只計已入帳
