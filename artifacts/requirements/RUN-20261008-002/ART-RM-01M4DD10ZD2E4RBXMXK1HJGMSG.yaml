      then: 產生 1 個紅包，超出 84 續計入下一個門檻
    - ac_id: AC-REDPACKET-0102
      given: 門檻 1,000，單週期上限 5，本週期已產生 4 個
      when: 一筆注單使距下一門檻的累計由 900 增至 3,100
      then: 只產生 1 個（達上限 5），之後停止累計直到重置
