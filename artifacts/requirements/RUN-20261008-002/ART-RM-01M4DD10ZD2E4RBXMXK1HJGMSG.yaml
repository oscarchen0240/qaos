  - requirement_id: REQ-REDPACKET-003
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: constraint
    title: 表單驗證：門檻、上限、預算、權重表、等級規則與活動名稱
    statement: 儲存時檢查：活動幣種至少勾選一個；預設規則關閉時至少須有一個等級規則；每個等級規則至少勾選一個等級；一個等級只能屬於一個規則；各生效規則（關閉的預設規則不檢查）的累積門檻須大於 0、單週期發放上限須為大於 0 的整數；總預算有填時須大於
      0；權重表至少一列、各列金額須大於 0、機率合計須為 100%（否則阻擋儲存）；活動名稱最多 25 字元。前端驗證（依 SPEC-REDPACKET-002@0.1）：活動時間必填，區間的結束時間須晚於開始時間；活動名稱必填、輸入欄最多
      25 字元；權重表最後一列不可移除；稽核倍數可為 0。儲存時任一欄位不合法即不建立，於該欄位以紅框與訊息標示並提示「請修正標示紅框的欄位」。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0031
      given: 權重表中獎機率合計為 99%
      when: 點擊「儲存」
      then: 阻擋儲存，活動未建立
    - ac_id: AC-REDPACKET-0032
      given: 某規則累積門檻填 0 或單週期發放上限填 1.5
      when: 點擊「儲存」
      then: 不允許建立（門檻須 > 0、上限須為 > 0 的整數）
    - ac_id: AC-REDPACKET-0033
      given: 預設規則關閉且未新增任何等級規則
      when: 點擊「儲存」
      then: 不允許建立
    - ac_id: AC-REDPACKET-0034
      given: 預設規則關閉、其欄位留空，另有一組合法的等級規則
      when: 點擊「儲存」
      then: 關閉的預設規則不檢查，可成功建立
    - ac_id: AC-REDPACKET-0035
      given: 活動名稱輸入 26 字元
      when: 儲存
