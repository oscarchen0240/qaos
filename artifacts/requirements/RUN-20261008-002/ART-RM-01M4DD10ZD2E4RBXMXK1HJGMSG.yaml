  - requirement_id: REQ-REDPACKET-001
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 新增紅包活動表單：活動類型、條件、幣種、時間與共用欄位
    statement: 於優惠活動管理新增活動並選擇活動類型「紅包」：活動條件固定為「有效流水累計」不可修改；活動幣種可複選（至少一個），選項依鏈上錢包管理已開啟幣種、預設勾選核心貨幣，機台場館不顯示（固定 TWD）；派發幣種唯讀顯示站台核心貨幣；活動時間為永久或區間（UTC+0）；另有重置方式、活動總預算（選填）、規則設定、前台圖示與預設語系；點擊「儲存」建立、「取消」放棄返回。機台場館活動類型僅「紅包」可選。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0011
      given: 站長於線上站台進入新增優惠活動
      when: 選擇活動類型「紅包」
      then: 活動條件顯示「有效流水累計」且不可修改；派發幣種唯讀顯示站台核心貨幣；活動幣種預設勾選核心貨幣
    - ac_id: AC-REDPACKET-0012
      given: 站長於機台場館進入新增優惠活動
      when: 開啟活動類型下拉選單
      then: 僅「紅包」可選；表單不顯示活動幣種（固定 TWD）
    - ac_id: AC-REDPACKET-0013
      given: 已填妥所有必填欄位
      when: 點擊「取消」
      then: 放棄建立並返回，未建立任何活動
    spec_reference: &id001
