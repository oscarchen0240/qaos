  - requirement_id: REQ-REDPACKET-005
    version: 1
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 規則適用判定：會員依當下等級適用唯一規則
    statement: 會員依當下會員等級只適用一個規則：該等級序號有等級規則 → 適用該等級規則；否則預設規則開啟 → 適用預設規則；兩者皆無 → 不參加。機台帳號一律適用預設規則。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0051
      given: 等級規則 1 勾選 3・Silver，預設規則開啟
      when: 3・Silver 會員的注單結算
      then: 以等級規則 1 的門檻累計
    - ac_id: AC-REDPACKET-0052
      given: 預設規則開啟，2・Bronze 未被任何等級規則勾選
      when: 2・Bronze 會員的注單結算
      then: 以預設規則累計
    - ac_id: AC-REDPACKET-0053
      given: 預設規則關閉，2・Bronze 未被任何等級規則勾選
      when: 2・Bronze 會員的注單結算
      then: 不累計、不產生紅包
    - ac_id: AC-REDPACKET-0054
      given: 機台場館的紅包活動
      when: 機台帳號的注單結算
      then: 以預設規則累計
    spec_reference: &id005
      spec_id: SPEC-REDPACKET-001
