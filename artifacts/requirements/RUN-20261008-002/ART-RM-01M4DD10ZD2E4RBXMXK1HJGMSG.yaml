  - requirement_id: REQ-REDPACKET-018
    version: 2
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.1'
    type: functional
    title: 活動排程：紅包活動子分頁與列表欄位、取消排程
    statement: 於 6.5.1 活動排程新增「紅包活動」子分頁，欄位沿用既有排程列表（活動名稱、排程說明、取消排程），另顯示活動幣種、累積門檻／單週期上限、獎勵方式、稽核倍數與預算使用（已占用／總預算，未設顯示「不限」）；預算用罄的活動於狀態旁標示「預算用罄」。活動名稱下方顯示參加等級摘要（預設規則開啟為「全部等級」，關閉時列出各等級規則勾選的等級；機台場館不顯示）；門檻等欄位顯示預設規則的值（預設規則關閉時顯示等級規則
      1），有等級規則時另標示「＋N 個等級規則」。機台場館的活動排程僅顯示「紅包活動」子分頁。取消排程後活動停止累計與產生紅包，已產生未開啟的紅包一併作廢。列表另有活動時間（UTC+0）、狀態與操作欄；「取消排程」只提供給進行中與排程中的活動，點擊後開啟「確認取消排程」視窗（「確定要取消「名稱」？此操作無法復原。」，返回／確認取消）（SPEC-REDPACKET-002@0.1）。
    acceptance_criteria:
    - ac_id: AC-REDPACKET-0181
      given: 線上站台有一個預設規則開啟、另有 1 組等級規則的紅包活動，總預算 5,000、占用 18
      when: 檢視活動排程「紅包活動」子分頁
      then: 參加等級顯示「全部等級」；門檻等顯示預設規則值並標示「＋1 個等級規則」；預算使用顯示 18 ／ 5,000
    - ac_id: AC-REDPACKET-0182
      given: 機台場館
      when: 進入活動排程
      then: 僅顯示「紅包活動」子分頁，且不顯示參加等級摘要
    - ac_id: AC-REDPACKET-0183
      given: 進行中活動有待開啟紅包
      when: 取消排程
      then: 活動停止累計與產生，待開啟紅包作廢
    - ac_id: AC-REDPACKET-0184
      given: 進行中的紅包活動「九月流水紅包」
      when: 點擊「取消排程」
      then: 開啟「確認取消排程」視窗，內容為「確定要取消「九月流水紅包」？此操作無法復原。」；點「返回」不取消、活動維持原狀態；點「確認取消」才取消排程
      spec_reference:
        spec_id: SPEC-REDPACKET-002
        spec_version: '0.1'
        location: L434 取消排程確認視窗
        quote: ？此操作無法復原。
    - ac_id: AC-REDPACKET-0185
      given: 狀態為「已結束」或「已取消」的紅包活動
      when: 檢視列表操作欄
      then: 不提供「取消排程」
      spec_reference:
        spec_id: SPEC-REDPACKET-002
        spec_version: '0.1'
        location: L649 render()
        quote: ${canCancel?
    spec_reference: &id018
