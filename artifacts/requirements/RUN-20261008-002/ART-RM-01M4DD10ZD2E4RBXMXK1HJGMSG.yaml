    statement: 設有總預算、且狀態為進行中或排程中的活動，列表提供「追加預算」：開啟視窗顯示目前總預算、已占用與剩餘；輸入新的總預算（須大於目前總預算），點擊「確認」即時生效，原本預算用罄的活動恢復產生紅包。只能調高、不能調低；未設總預算的活動不提供此操作、不可改為有預算。每次追加寫入操作紀錄（操作人員、時間、調整前與調整後金額）。活動狀態依
      SPEC-REDPACKET-002@0.1 getStatus()：已取消排程 → 已取消；開始時間晚於現在 → 排程中；區間活動結束時間早於現在 → 已結束；其餘 → 進行中。列表有狀態欄與狀態篩選（全部／進行中／排程中／已結束／已取消），已結束與已取消的活動仍列出。新總預算不大於目前總預算時，前端於欄位顯示「須大於目前總預算（只能調高、不能調低）」且不生效。
