      2原版「執行人工存入，稽核倍數設為3」「因存入金額乘上稽核倍數而增加」這種抽象描述。抽象描述不利於執行者判定「增加多少才算通過」，具體數值使測試結果可被精確驗證、不留模糊空間。依整合原則(深度優先)採用Phase 3的具體數值版本，同時補上重新整理頁面的驗證步驟以確認資料已持久化
