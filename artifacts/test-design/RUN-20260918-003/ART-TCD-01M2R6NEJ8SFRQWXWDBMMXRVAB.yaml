      value: D2 之後的區間，不含 D2
    steps:
    - n: 1
      action: 取一筆已知交易時間為 D1 的紀錄，設定交易時間篩選範圍為 [D1, D1]（同一天）並搜尋，確認該筆包含在結果內
    - n: 2
      action: 將交易時間篩選範圍改為不含 D1 的區間（例如 [D1+1天, D1+30天]）並搜尋，確認該筆被排除
    - n: 3
      action: 清除交易時間篩選，改取一筆已核實、已知核實時間為 D2 的紀錄，比照上兩步分別以含 D2 與不含 D2 的核實時間範圍篩選並比對結果
    expected_result: 交易時間範圍恰好包含 D1 時該筆出現、不包含時被排除；核實時間範圍恰好包含 D2 時該筆出現、不包含時被排除，兩個篩選欄位皆以邊界日期正確納入/排除紀錄
    expected_result_spec_reference:
      spec_id: SPEC-CASHOUT-001
      spec_version: '0.1'
      location: §篩選器
      quote: 交易時間 | 日期範圍 | 出金即收據印出時間 ｜ 核實時間 | 日期範圍 | —
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 日期範圍篩選本質就是邊界比較（範圍含/不含某天），用 boundary_value 是恰當的，因為這裡驗證的是『日期落在範圍邊界內外』的真實邊界行為，不是隨意貼標籤。
