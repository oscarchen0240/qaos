  testcases:
  - draft_id: TC-DRAFT-01M2R6NEJ6MFXNJGSHP0QA8MAW
    title: 機台洗分交易完成後，本頁自動出現一筆對應的待核實紀錄
    product: ba-admin
    functional_area: CASHOUT
    requirement_ids:
    - REQ-CASHOUT-001
    acceptance_criteria_ids:
    - AC-CASHOUT-0011
    spec_id: SPEC-CASHOUT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions: &id001
    - 以 Admin 身分登入後台
    - 頁面標題下方的站台切換選單已切換至一個既有的測試站台
    - 進入 帳務管理 > 洗分出金核實
    test_data: []
    steps:
    - n: 1
      action: 於測試機台完成一筆機台洗分（或於機台交易紀錄確認一筆洗分交易狀態已為『已完成』）
    - n: 2
      action: 進入本頁（不套用任何篩選條件），檢視是否出現對應該筆交易的紀錄
    expected_result: 本頁自動出現一筆待核實紀錄，其交易編號對應剛完成的洗分交易
    expected_result_spec_reference:
      spec_id: SPEC-CASHOUT-001
      spec_version: '0.1'
      location: §功能說明
      quote: 每一筆「已完成」的機台洗分或機台出金，系統會自動在本頁產生一筆待核實紀錄
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: AC-0011 字面涵蓋洗分與出金兩種交易類型，兩者現場流程不同（見功能說明表格），故拆成兩條對稱 TC 分別驗證，避免用單一 TC 掩蓋任一類型可能各自的問題；技巧用 requirement_based
      因為只是單一條件（交易完成）到單一結果（出現紀錄）的直接對應，沒有組合矩陣，不套用 decision_table。
