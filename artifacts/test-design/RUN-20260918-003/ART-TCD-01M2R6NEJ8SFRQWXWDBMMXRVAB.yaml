  - draft_id: TC-DRAFT-01M2R6NEJ62M162ZBFHSBSN6VP
    title: 尚未完成（待確認）的洗分交易，系統不會為其建立核實紀錄
    product: ba-admin
    functional_area: CASHOUT
    requirement_ids:
    - REQ-CASHOUT-001
    - REQ-CASHOUT-004
    acceptance_criteria_ids:
    - AC-CASHOUT-0011
    - AC-CASHOUT-0041
    spec_id: SPEC-CASHOUT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 取得（或使一筆）機台洗分交易於機台交易紀錄的交易狀態為『待確認』（尚未完成）
    - n: 2
      action: 進入本頁，以該機台帳號或訂單編號查詢，確認是否有對應紀錄
    expected_result: 查無此筆紀錄；因為交易尚未完成，系統根本不會為它建立核實狀態紀錄。不可憑本頁無紀錄直接判斷交易狀態，須至機台交易紀錄查明實際狀態後再決定是否付款
    expected_result_spec_reference:
      spec_id: SPEC-CASHOUT-001
      spec_version: '0.1'
      location: §紀錄產生規則
      quote: 僅交易狀態為「已完成」的機台洗分與機台出金會出現在本頁；待確認、已取消、已逾時、未成立的交易不會出現
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 這條 TC 同時是 REQ-001（已完成才產生紀錄）的反面驗證，也是 REQ-004 AC-0041（未完成交易不出現）的正面驗證，兩者本質是同一個規則的一體兩面，因此一條 TC 掛兩個 requirement_id，不重複設計；REQ-001
      為 high risk 需要至少一條非 happy-path 案例，這條負向案例滿足該要求。技巧選 negative（而非 boundary_value）因為交易狀態是離散的列舉值（待確認/已完成/已取消/已逾時/未成立），不是數值或長度的邊界比較。
