    test_data: []
    steps:
    - n: 1
      action: 玩家於線上站台完成一筆帶小數點的系統存款（例如 100.55）
    - n: 2
      action: 檢視入帳結果的金額
    expected_result: 進錢包金額精確為 100.55，不因新拆出「原始金額」欄位而被無條件取整或截斷
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-003
      spec_version: '1.0'
      location: §改了什麼／①存款金額拆成兩個
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 欄位拆分後最容易出錯的地方之一是取整規則，用小數金額當邊界案例驗證。另一個迴歸風險（『原始金額』與『核心貨幣金額』兩欄位有沒有接錯，即進錢包邏輯是否真的讀對欄位）本條刻意不涵蓋——見 uncovered_with_reason
