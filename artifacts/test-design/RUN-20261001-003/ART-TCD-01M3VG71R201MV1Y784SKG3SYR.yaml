    design_rationale: CLR-DAILYREPORT-013 PM 定案 A（2026-10-01）推翻 CLR-DAILYREPORT-012 的 B：依場次明細列出進行中場次（結束時間「—」）。v2 前置條件『依場次明細只列已結束／逾時結束／日結結算的場次』已不成立，已移除；新建立（進行中）的場次改回於依場次明細驗證。會員詳細頁「機台資訊」區塊的驗證點保留為補充（spec
      §場次呈現位置明寫該區塊顯示目前進行中場次摘要，與依場次明細並列為兩個呈現位置，並不互斥），但不再宣稱『依場次明細看不到進行中場次』。本 TC 無對應 AC（RM 的 REQ-017 states 中 已結束→進行中 allowed:false）；斷言『已結束不可逆』與『新交易建立新場次』皆是由場次定義與
      REQ-017 states 推得，spec 原文未逐字寫出『不可逆』。【資料佈置的未驗證前提】開分／投注／出金等機台金流操作的入口，v0.1 與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本
      TC 以『機台前台畫面顯示的分數』為讀值來源，是依 TC-DAILYREPORT-054 既有寫法（以剩餘分數在機台前台嘗試進入遊戲）推測，需環境負責人確認。
