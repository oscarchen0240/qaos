    - 透過線上站台以該會員身分完成一筆或多筆存款（不可用後台人工存款——spec 明定後台人工存款不計入累積儲值與有效會員判定），使其累積存款金額大於 0，但低於所屬簽到活動設定的『有效會員門檻』。
