    preconditions:
    - 選定一個已開啟『有效會員每月重置』設定的簽到活動（自行從後台活動列表中確認此設定已開啟；若目前沒有任何活動開啟此設定，需請環境負責人協助開啟一個測試用活動）。
    - 選定一名既有會員，其上個月透過線上存款的累積金額已達到（或曾達到）該活動的有效會員門檻，且本月截至目前尚未有任何新的線上存款記錄（可從後台歷史存款記錄篩選出符合此時間條件的既有會員；若無法自然找到，需以可控制系統日期的測試環境配合建立此狀態——此佈置方式所需的環境能力需請環境負責人確認可行）。
    test_data: []
    steps:
    - n: 1
      action: 於 ba-admin 後台查詢該會員在系統當前月份（跨月後）的有效會員累積判定金額與狀態。
    - n: 2
      action: 以該會員身分登入會員前台，開啟一次簽到活動頁面，查看『有效會員』進度條顯示。
    - n: 3
      action: 於 ba-admin 後台再次查詢該會員本月的有效會員判定結果與累積金額。
    expected_result: 無論後台判定或前台進度條，本月的累積金額皆從 0 重新開始計算，僅反映『本月』透過 deposit_log_v2 記錄的存款；不會把上個月已計入（歸零前）的存款金額延續帶入本月累積。本月尚無任何新存款，因此累積金額應為
      0，不會僅因為上月已達門檻就維持或直接判定為有效會員。
