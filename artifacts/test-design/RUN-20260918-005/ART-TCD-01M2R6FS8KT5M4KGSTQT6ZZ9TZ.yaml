    expected_result: 開啟前台簽到頁後，進度條顯示達標（累積金額≥門檻），且該次開啟即直接將此會員寫入『有效會員』狀態；隨後於 ba-admin 後台再次查詢時，該會員的有效會員狀態與判定結果與前台一致（不需要玩家再存一筆才會反映）。
