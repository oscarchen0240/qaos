      spec §改了什麼②裡『前台開頁直接寫入、後台要等下一筆存款才重算』這個機制細節設計驗證順序（先不開前台頁確認後台未變、再開一次前台頁確認寫入），避免只驗證『最終兩邊一致』卻沒驗證到『是前台這次開頁造成的』這個因果關係。
