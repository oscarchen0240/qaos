      location: §這次能測什麼／T5
      quote: 每月重置仍正常｜簽到活動若開了「有效會員每月重置」，跨月後進度應歸零重算
    assumptions:
    - text: spec 未定義如何在測試環境中人工製造『跨月』情境（例如是否有可調整系統日期的測試環境，或需要仰賴自然存在、真的橫跨月份邊界的既有會員資料）。此測試資料佈置方式是我方推測的可行做法，需要環境負責人確認實際可行的操作路徑。
      requirement_id: REQ-BONUSCCY-014
