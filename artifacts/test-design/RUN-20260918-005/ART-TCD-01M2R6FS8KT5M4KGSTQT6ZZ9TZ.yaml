  - draft_id: TC-DRAFT-01M2R6FS8JC19890EJ87Q1NS95
    title: 線上站台存款：存入多少金額，玩家錢包就精確增加多少，幣別與存款當下一致
    product: ba-admin
    functional_area: BONUSCCY
    requirement_ids:
    - REQ-BONUSCCY-011
    acceptance_criteria_ids:
    - AC-BONUSCCY-017
    spec_id: SPEC-BONUSCCY-003
    spec_version: '1.0'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 選定一名既有的線上站台會員（自行從環境中選定）。
    - 於 ba-admin 後台查詢該會員目前的錢包餘額與幣別，記錄為存款前基準值。
    test_data: []
    steps:
    - n: 1
      action: 以該會員身分，透過線上站台實際完成一筆系統存款（非後台人工存款），存入一個可清楚辨識的金額，例如 100 USDT（實際數字可依環境調整，只要能明確辨識即可）。
    - n: 2
      action: 確認該筆存款於系統顯示為入帳成功。
    - n: 3
      action: 於 ba-admin 後台重新查詢該會員的錢包餘額與幣別。
    - n: 4
      action: 於 ba-admin 後台查詢該筆存款的交易/存提記錄明細，記錄其顯示的金額與幣別。
    expected_result: 錢包餘額較存款前增加的金額，恰等於玩家本次實際存入的金額（本例 100），幣別與玩家存款當下所使用的幣別一致（USDT）；存提記錄明細顯示的金額與此一致。不因新拆出的「原始金額」與「核心貨幣金額」兩個欄位而發生算錯或漏算。
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-003
      spec_version: '1.0'
      location: §改了什麼／①存款金額拆成兩個；§這次能測什麼／T2
      quote: 原始金額｜玩家實際存的錢，玩家看到的幣別｜進錢包、算流水倍數、算手續費／T2 入金金額進錢包正確：存多少就進多少，幣別正確。這是最重要的回歸點
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: AC-BONUSCCY-017 與 spec 的 T2 都直接點名這是本次部署最重要的回歸點；此案例是最直接的正向驗證，只斷言 AC 明確要求的『存多少進多少、幣別正確』，不多加碼。幣別換算是否算對不在本次測試範圍內（spec
      明講今天沒有任何存款會觸發換算），故不在此案例中涉及。
