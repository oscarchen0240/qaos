    source: spec_workflow
    design_rationale: REQ-BONUSCCY-011 為 high risk，需要至少一條 non-happy 案例；這裡用 error_guessing 技巧，針對『把同一個金額拆成兩個欄位』這種改動最容易犯的錯誤類型（欄位間賦值時精度遺失、其中一個欄位被錯誤四捨五入）刻意選用非整數金額作為測試資料，藉此提高抓到回歸的機率。expected_result
      仍完全落在 AC-BONUSCCY-017『存多少進多少』的範圍內，沒有新增 spec 未要求的斷言，故不需要 assumptions／exploratory 標記；spec 也未定義任何數值精度邊界，因此不使用 boundary_value
      技巧標籤，避免虛標。
  - draft_id: TC-DRAFT-01M2R6FS8JFCKHRQ4E9GE3EC66
    title: 存款後的流水門檻增量與手續費，以玩家實際存入的原始金額為基數計算
    product: ba-admin
    functional_area: BONUSCCY
    requirement_ids:
    - REQ-BONUSCCY-012
    acceptance_criteria_ids:
    - AC-BONUSCCY-018
    spec_id: SPEC-BONUSCCY-003
    spec_version: '1.0'
    test_level: ui_e2e
    test_types:
