    preconditions:
    - 選定一名既有的線上站台會員（自行從環境中選定，與另一條 TC 的會員不同，避免互相干擾）。
    - 於 ba-admin 後台開啟該簽到活動的設定頁面，記錄其設定的『有效會員門檻』數值。
