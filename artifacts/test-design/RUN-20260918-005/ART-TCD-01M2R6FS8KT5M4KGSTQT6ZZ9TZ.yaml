    expected_result: 錢包餘額增加的金額精確等於存入的小數金額（本例 83.57），小數位不因「原始金額」與「核心貨幣金額」拆成兩欄位而被四捨五入、無條件捨去或整數化。
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-003
