    - 於 ba-admin 後台查詢並記錄該會員存款前既有的『提領所需有效投注額（流水門檻）』，以及本次存款預期適用的流水倍數與手續費率（若後台頁面有顯示規則的話）。
    test_data: []
    steps:
    - n: 1
      action: 以該會員身分，透過線上站台實際完成一筆存款（非後台人工存款），存入一個可清楚辨識的金額，例如 200 USDT。
    - n: 2
      action: 確認該筆存款入帳成功。
    - n: 3
      action: 於 ba-admin 後台重新查詢該會員的『提領所需有效投注額（流水門檻）』，計算本次存款造成的增量。
    - n: 4
      action: 於 ba-admin 後台查詢該筆存款實際扣收的手續費金額。
    - n: 5
      action: 以『存款金額（原始金額）× 已知流水倍數』與『存款金額（原始金額）× 已知手續費率』分別回算，核對後台顯示的流水門檻增量與手續費是否與回算結果一致。
    expected_result: 流水門檻增量與手續費金額，皆以玩家實際存入的原始金額（本例 200）為計算基數；與回算結果一致。惟因目前線上站台的存款幣別必然等於記帳幣別（兩個金額欄位目前數字相同），本測試無法真正區辨『以原始金額為基數』與『以核心貨幣金額為基數』兩者的差異，只能確認這次欄位拆分沒有破壞既有的計算行為（回歸驗證）。
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-003
      spec_version: '1.0'
      location: §改了什麼／①存款金額拆成兩個；§這次能測什麼／T3
      quote: 原始金額｜玩家實際存的錢，玩家看到的幣別｜進錢包、算流水倍數、算手續費／T3 流水倍數與手續費的基數正確：存款後的「提領所需有效投注額」要以實際存入金額為基數算，不是別的數字
    assumptions:
    - text: spec.md 未說明存款觸發非零『流水倍數』與『手續費』的確切條件（例如是否需要同時符合某個存款相關紅利活動才會有流水倍數，或手續費率如何配置／在哪個後台頁面可查）。此測試資料佈置方式（選定一名存款會產生非零流水倍數與手續費的會員、並於後台查得其規則數值用於回算比對）是我方為了讓案例可執行而做的推測，需要環境負責人確認實際可行的操作路徑與查詢頁面。
      requirement_id: REQ-BONUSCCY-012
      needs_human_confirmation: true
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: AC-BONUSCCY-018 的斷言本身有明確 spec 依據（quote 直接對應），但要佈置一個『存款會產生非零流水倍數與手續費』的測試狀態，依賴的是 spec 未定義的觸發規則與查詢頁面，屬於未經驗證的環境/資料知識，因此誠實標為
      exploratory 並揭露 assumption。expected_result 同時老實承認：因為今天幣別必存等於記帳幣別，這條案例只能做到回歸驗證，無法真正證明『基數是原始金額而非核心貨幣金額』——這一點也對應 spec 自己在『這次測不了』一節的說明。
