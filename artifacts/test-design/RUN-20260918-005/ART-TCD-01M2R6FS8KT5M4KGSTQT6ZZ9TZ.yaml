      action: 以該會員身分，透過線上站台實際完成一筆系統存款，刻意使用一個非整數、非規則的小數金額，例如 83.57 USDT（避免使用 100 這類整數，降低『欄位間複製/寫入時精度被吃掉』這類 bug 被整數掩蓋的機率；實際小數位數以站台實際允許的輸入精度為準）。
    - n: 2
      action: 確認該筆存款入帳成功。
