  - draft_id: TC-DRAFT-01M2J626CM4ARAGER33TSQTT0D
    title: 加盟商會員透過邀請鏈註冊時，側邊面板正確顯示完整上下層邀請鏈
    product: ba-admin
    functional_area: MEMBER
    requirement_ids:
    - REQ-MEMBER-004
    acceptance_criteria_ids:
    - AC-MEMBER-005
    spec_id: SPEC-MEMBER-001
    spec_version: '0.2'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: medium
    risk: medium
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台，進入「會員與加盟商 > 會員列表」頁面
    - 取一名既有會員 X，須同時符合兩個各自獨立的條件：(a) X 目前已具加盟商身分——加盟商身分的取得見 REQ-MEMBER-013（達成升等門檻並透過前台申請，或被指定為客製化加盟商），與註冊方式無關；(b) X 當初是透過『另一名既有會員』的前台邀請連結完成註冊，成為該會員的下線——「完成註冊」這個動作本身只會建立
      X 與邀請人之間的上下層關係，不會讓 X 自動取得加盟商身分；自行從環境中選定同時符合這兩個獨立條件的既有帳號，或分兩步驟分別達成：先讓 X 透過邀請連結註冊成為下線，再另外讓 X 依 REQ-MEMBER-013 的途徑取得加盟商身分
    test_data: []
    steps:
    - n: 1
      action: 於會員列表點擊該會員 X 的會員編號，開啟右側簡易資料面板
    - n: 2
      action: 檢視面板頂部的邀請鏈顯示區塊
    expected_result: 面板頂部顯示完整的上下層關係：上層會員編號 → 當前會員編號 → 會員N人（N為其下層會員數），且上層顯示的是實際邀請該會員 X 註冊的會員編號
    expected_result_spec_reference:
      spec_id: SPEC-MEMBER-001
      spec_version: '0.2'
      location: §2.1.4 側邊簡易資料面板
      quote: 若該會員為加盟商，則顯示其成為加盟商的時間與邀請鏈。邀請鏈顯示完整的上下層關係（如：上層會員編號 → 當前會員編號 → 會員 N 人）
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: false
    execution_cost: medium
    stability: unknown
    critical_path: false
