    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台，開啟一名會員的人工存入面板
    - 具備使用瀏覽器開發者工具或 API 測試工具（如 Postman）直接呼叫後台 API 的環境與權限，用於步驟3繞過前端驗證後端行為
    test_data: []
    steps:
    - n: 1
      action: 稽核欄位輸入 0，其餘欄位填妥後點擊儲存
    - n: 2
      action: 稽核欄位輸入一個負數（例如 -1），其餘欄位填妥後點擊儲存，觀察前端顯示
    - n: 3
      action: 另外使用瀏覽器開發者工具或 API 測試工具（如 Postman），帶入登入後的有效憑證，繞過前端頁面直接呼叫人工存入/提出 API，request body 中稽核帶入一個負數，確認回應的 HTTP 狀態碼與錯誤代碼
    - n: 4
      action: 稽核欄位留空，其餘欄位填妥後點擊儲存，觀察並記錄系統實際反應
    expected_result: 步驟1：系統接受輸入 0，正常完成人工存入/提出（稽核=0已由 Oscar 2026-09-15 實測確認為合法輸入）；步驟2：前端顯示驗證失敗訊息並阻擋送出；步驟3：後端回應 HTTP 400、錯誤代碼
      COMMON_NON_NEGATIVE（已由 Oscar 2026-09-15 確認，此步驟不依賴前端是否阻擋，主動繞過前端直接驗證後端行為）；步驟4：留空時的系統反應 spec §2.1.5 全文未定義，也尚未有其他確認依據，本TC只能如實記錄實際觀察到的行為，不預設任何一種反應為正確答案，需另外向
      PM 確認正確規則後再回填為確定案例；步驟4以「完整記錄實際觀察行為」作為該步驟的完成標準，不影響步驟1-3斷言成立時的整體TC判定
    expected_result_spec_reference:
      spec_id: SPEC-MEMBER-001
      spec_version: '0.2'
      location: §2.1.5 帳務資訊
      quote: 稽核｜設定本次異動金額所需完成的可提領投注倍數，將影響會員後續提款條件；預設為 1
    assumptions:
    - text: 稽核欄位留空時的系統反應，spec §2.1.5全文未定義（僅定義「預設為1」與「會影響提款條件」），且不同於0/負數的情況(已由Oscar 2026-09-15確認具體行為)，留空目前沒有任何確認依據；本TC不預設這是一個應被阻擋或應退回預設值的欄位，只如實記錄實測行為，正確規則需
        PM 確認
      requirement_id: REQ-MEMBER-011
      needs_human_confirmation: true
