    design_rationale: 已比對Phase 3影子測試(qaos-test-designer agent)產出的TC-MEMBER-042（已退役），Phase 2原版title「系統應拒絕或退回預設值...不可留下無法計算的投注門檻」偏武斷，雖然expected_result本身有hedge但沒有結構化assumptions記錄這個依賴。Phase
      3版本完全不預設任何一種反應為正確答案，且有結構化assumptions揭露spec未定義此規則。v1採用此誠實揭露方式後，APR-0088核准前Oscar 2026-09-15補充確認了具體行為：稽核=0為合法輸入；稽核=負數時前端阻擋、後端回400
      COMMON_NON_NEGATIVE。v2依此新資訊，把0與負數兩個子情境從exploratory改為grounded（有確定expected_result），只保留「留空」這個子情境維持exploratory/assumptions揭露，因為留空目前沒有任何確認依據。v3依獨立Validator
      FAIL判定修正：v2步驟3寫成「若前端未完全阻擋才檢查API」的被動條件式，但若前端驗證正常運作（步驟2大概率成立），步驟3幾乎不會被執行到，導致「後端回400 COMMON_NON_NEGATIVE」這個v2新增的核心斷言實質上可能從未被驗證過。已改為主動的明確動作：不論前端是否阻擋，都額外使用API測試工具繞過前端直接呼叫API驗證後端行為，並在precondition補充所需的工具/權限，同時補充步驟4的判定標準說明
