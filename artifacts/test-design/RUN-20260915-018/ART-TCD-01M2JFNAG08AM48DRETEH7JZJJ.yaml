    test_data: []
    steps:
    - n: 1
      action: 稽核欄位輸入 0，其餘欄位填妥後點擊儲存
    - n: 2
      action: 稽核欄位輸入一個負數（例如 -1），其餘欄位填妥後點擊儲存，觀察前端顯示
    - n: 3
      action: （若前端未完全阻擋、允許送出）檢視對應的 API request/response，確認後端回應狀態碼與錯誤代碼
    - n: 4
      action: 稽核欄位留空，其餘欄位填妥後點擊儲存，觀察並記錄系統實際反應
    expected_result: 步驟1：系統接受輸入 0，正常完成人工存入/提出（稽核=0已由 Oscar 2026-09-15 實測確認為合法輸入）；步驟2-3：前端顯示驗證失敗訊息並阻擋送出，若透過API直接送出則後端回應 HTTP
      400、錯誤代碼 COMMON_NON_NEGATIVE（已由 Oscar 2026-09-15 確認）；步驟4：留空時的系統反應 spec §2.1.5 全文未定義，也尚未有其他確認依據，本TC只能如實記錄實際觀察到的行為，不預設任何一種反應為正確答案，需另外向
      PM 確認正確規則後再回填為確定案例
    expected_result_spec_reference:
      spec_id: SPEC-MEMBER-001
      spec_version: '0.2'
      location: §2.1.5 帳務資訊
      quote: 稽核｜設定本次異動金額所需完成的可提領投注倍數，將影響會員後續提款條件；預設為 1
    assumptions:
    - text: 稽核欄位留空時的系統反應，spec §2.1.5全文未定義（僅定義「預設為1」與「會影響提款條件」），且不同於0/負數的情況(已由Oscar 2026-09-15確認具體行為)，留空目前沒有任何確認依據；本TC不預設這是一個應被阻擋或應退回預設值的欄位，只如實記錄實測行為，正確規則需
