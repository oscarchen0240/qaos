    - 必須使用機台站台（非線上站台）——入金為機台版前台功能，線上站台無此入口，Oscar 2026-09-15 確認入金/出金/開分/洗分四項操作皆於機台版前台進行，對應 SPEC-CASHFLOW-001 §兩階段/單階段對照表的 API
    test_data: []
    steps:
    - n: 1
      action: 於機台版前台投紙鈔，觸發 req-cashin（建立入金 PENDING）
    - n: 2
      action: 接著觸發 end-cashin（確認入金）
    - n: 3
      action: 觀察兩階段的回應（是否仍回 0-OK 並完成入帳）
    expected_result: req-cashin 或 end-cashin 任一階段應被阻擋（不應兩階段皆回 0-OK 並完成入帳）；若實際錯誤訊息/狀態碼文案不同，不視為違反本條，僅測是否被阻擋
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-001
      spec_version: '1.0'
      location: §一句話（限制段落，2026-09-15 PM 補充確認）
      quote: ''
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: change_workflow
    design_rationale: PM 2026-09-15 明確確認：核心貨幣可停用（止損用途，本身不應被阻擋），但停用後入金應被系統阻擋。這條驗證的是「停用後」的下游效果，不是停用動作本身。操作步驟依 SPEC-CASHFLOW-001
