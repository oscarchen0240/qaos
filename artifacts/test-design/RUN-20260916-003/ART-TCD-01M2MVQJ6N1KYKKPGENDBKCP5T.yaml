    title: 開分加計後恰等於場館額度上限可成立，超過 1 單位則被拒絕且不寫入帳務異動但留交易紀錄
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-004
    acceptance_criteria_ids:
    - AC-CASHFLOW-0041
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
