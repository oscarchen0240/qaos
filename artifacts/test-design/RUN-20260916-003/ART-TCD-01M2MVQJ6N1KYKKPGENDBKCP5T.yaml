    test_types:
    - boundary
    - negative
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 機台已透過憑證通過認證
    - 機台所屬場館為開通狀態，機台為啟用狀態
    - 調整場館額度上限為一已知值 A，另建構一筆已預留未入帳的入金 PENDING，使目前「全場館機台分數餘額合計＋已預留未入帳入金金額」恰為 A-100
    test_data:
    - name: 第一筆開分金額
      value: 100（使加計後恰等於上限 A）
    - name: 第二筆開分金額
      value: 1（使加計後超過上限 A）
    steps:
    - n: 1
      action: 送出開分請求（req-keyin），金額 100，使「全場館機台分數餘額合計＋已預留未入帳入金金額＋本筆金額」恰等於額度上限 A
    - n: 2
      action: 確認回覆為 0-OK，分數正常增加，交易紀錄正常寫入
    - n: 3
      action: 再送出開分請求（req-keyin），金額 1，使加計後超過額度上限 A
    - n: 4
      action: 確認此筆的回覆、分數變化，並查詢交易紀錄
    expected_result: 第一筆恰等於上限：成立，回 0-OK，分數正常增加；第二筆使合計超過上限：平台回 1-OVER LIMIT，機台畫面顯示失敗，分數不變、不寫入任何帳務異動（判定含已預留未入帳的入金金額，與入金共用同一把場館鎖），但交易紀錄留有「未成立」紀錄可查得拒絕原因（超過額度上限不屬於餘額不足的不寫入交易紀錄例外）
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §附錄-開分 + §四種金流/交易不成立的原因
      quote: 全場館機台分數餘額合計＋已預留未入帳的入金金額，加計本筆金額後不可超過場館額度上限，超過則回 1-OVER LIMIT；餘額不足不寫入交易紀錄，其餘原因才會留下「未成立」紀錄
