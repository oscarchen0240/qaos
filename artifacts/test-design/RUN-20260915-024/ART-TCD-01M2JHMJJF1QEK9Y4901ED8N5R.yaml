    design_rationale: 已比對Phase 3影子測試(qaos-test-designer agent)產出的TC-MEMBER-049（已退役），其多了「重新整理列表確認已移除」與「確認畫面上無任何復原操作入口」兩個實際驗證動作，Phase
      2原版只在expected_result斷言「被永久刪除」「不提供復原功能」，卻沒有對應的steps去實際驗證這兩件事（若只是前端樂觀移除、後端未真的刪除，或者復原入口藏在其他頁面，原TC測不出來）。依整合原則(深度優先)補上這兩個驗證步驟，讓斷言真正可被驗證。v2依獨立Validator
      FAIL判定修正：v1步驟4「確認畫面上不存在任何可復原的操作入口」範圍界定不清（AC/expected_result講的是系統層級的『不提供復原功能』，但步驟只講『畫面上』，未定義具體檢查範圍），不同執行者可能有不同判定標準。已將步驟4具體化為：僅檢查推薦註冊金設定列表頁本身，並明確寫出範圍依據（spec全文未定義任何回收桶/操作歷程復原功能，故此頁面檢查已涵蓋spec定義的驗證範圍；若日後新增此類功能需回頭補測），同時補上expected_result_spec_reference的實際spec引用文字
