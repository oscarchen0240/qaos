    title: 依場次明細的進行中場次列：結束時間「—」，場次時長與期末餘額累計到查詢當下
    requirement_ids:
    - REQ-DAILYREPORT-008
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0083
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    preconditions:
    - 已登入後台並切換至機台場館站台（Arcade）
    - 測試場館下有一台既有機台 A（自行從環境中選定）
    - 執行期間不得跨越場館日結時間（若目前離日結時間不到 30 分鐘，請改日或等日結後再執行）
    - 機台 A 目前有一個進行中場次：已有開分與投注，且最後一次投注後不再有任何交易、也不再遊玩
    - 機台 A 的目前分數 X 已知：以機台前台畫面顯示的分數為準並記錄（AC 範例為 300，實際值不限，須大於 0）
    test_data:
    - name: X
      value: 機台 A 目前分數；AC 範例 300，實際取機台前台讀值，須 > 0
    - name: 等待間隔
      value: 約 3 分鐘
    steps:
    - n: 1
      action: 進入 各式報表 > 場館日結報表，統計維度選「依場次明細」、統計週期「按日」、機台帳號填機台 A、結算日期涵蓋昨日與今日（營業日依場館日結時間切分；日期標示可能與日曆日不同，故取涵蓋兩天的區間，並以列表中最後一個、尚未日結的營業日列為判讀對象），查詢
    - n: 2
      action: 在列表找出機台 A 的進行中場次列，記錄場次編號、狀態、結束時間、場次時長 T1、期末餘額，以及查詢的時間點
    - n: 3
      action: 不對機台 A 做任何交易，等待約 3 分鐘，以完全相同的條件重新查詢，記錄同一場次列的場次時長 T2、結束時間、期末餘額
    expected_result: 步驟 2：該場次列存在，狀態「進行中」、結束時間「—」、期末餘額＝X；步驟 3：同一場次編號的列仍為「進行中」、結束時間仍為「—」，場次時長 T2 比 T1 多約 3 分鐘（隨查詢當下累計，非固定值），期末餘額仍＝X（期間無交易）
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §列表欄位/場次編號 + §背景：場次資訊（結束時間、場次時長）；進行中場次的期末餘額累計到查詢當下依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以 spec 2026-09-17
        修訂為準，v0.1 不含該修訂）
      quote: 進行中的場次結束時間顯示「—」
    assumptions: []
    critical_path: true
    source: spec_workflow
    design_rationale: 驗證 AC-0083。引用的 v0.1 原文只涵蓋『進行中場次結束時間顯示「—」』與場次時長『進行中則顯示累計至查詢當下』；『期末餘額為累計到查詢當下的值（＝X）』來自 CLR-DAILYREPORT-013（PM
      定案 A，2026-10-01；以 spec 2026-09-17 修訂為準，v0.1 不含該修訂），不在 v0.1 原文內，已在 location 註明。取代已 RETIRED 的 TC-DAILYREPORT-027（只驗結束時間與時長）：新增期末餘額＝X
      的斷言，並用兩次查詢（中間無交易）區分『累計到查詢當下』與『固定快照』。期間不交易是為了讓 X 不變，作為乾淨基準。技術為 requirement_based（單一情境、無組合或邊界）。【資料佈置的未驗證前提】開分／投注／出金等機台金流操作的入口，v0.1
      與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本 TC 以『機台前台畫面顯示的分數』為讀值來源，是依 TC-DAILYREPORT-054 既有寫法（以剩餘分數在機台前台嘗試進入遊戲）推測，需環境負責人確認。
    draft_id: TC-DRAFT-01M3VG7JJAEXZ0C96DK8JFRXMH
