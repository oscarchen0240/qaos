    - n: 2
      action: 對機台 A 追加開分任意金額，記錄機台前台新的目前分數 X'（確認 X' ≠ X；若相同則再追加開分）
    - n: 3
      action: 以完全相同的條件重新查詢，記錄目前營業日列的期末餘額 E2
    expected_result: 步驟 1：機台 A 目前營業日列的期末餘額 E1＝X（含進行中場次的分數）；步驟 3：E2＝X'（截至查詢當下，非查詢前的 X）
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §列表欄位/期末餘額；進行中場次計入期末餘額（尚未結算取截至查詢當下）依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以 spec 2026-09-17 修訂為準，v0.1 不含該修訂）
      quote: 該日結算時點各機台的分數合計
    assumptions: []
    critical_path: true
    source: spec_workflow
    design_rationale: 驗證 AC-0143。v0.1 原文只有『該日結算時點各機台的分數合計』；『尚未結算的營業日取截至查詢當下、計入進行中場次』來自 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以
      spec 2026-09-17 修訂為準，v0.1 不含該修訂），不在 v0.1 內，已在 location 註明（quote 僅涵蓋基本規則）。AC 範例為 300，但如何把分數精準佈置成 300 依賴未載明的分數換算與金流機制（開分金額與分數是否
      1:1 v0.1 未寫），因此以『前台讀值 X』當基準，不寫死 300。步驟 2 追加開分並重查，是為了驗證 then 子句的『截至查詢當下』（不是場次開始時或首次查詢時的快照）。要求不跨日結是因為跨日結後當日營業日會變成已結算，結果不同。【資料佈置的未驗證前提】開分／投注／出金等機台金流操作的入口，v0.1
      與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本 TC 以『機台前台畫面顯示的分數』為讀值來源，是依 TC-DAILYREPORT-054 既有寫法（以剩餘分數在機台前台嘗試進入遊戲）推測，需環境負責人確認。
