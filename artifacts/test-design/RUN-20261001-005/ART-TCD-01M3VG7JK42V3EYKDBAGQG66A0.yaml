      action: 在列表分別找出機台 A 的已結束場次列與進行中場次列，記錄兩列的場次編號、狀態、結束時間、場次時長（已結束列 E1、進行中列 P1）
    - n: 3
      action: 不對機台 A 做任何交易，等待約 3 分鐘，以完全相同的條件重新查詢，記錄兩列的結束時間與場次時長（已結束列 E2、進行中列 P2）
    expected_result: 已結束列：狀態「已結束」、結束時間為具體時間（不是「—」），兩次查詢的結束時間與場次時長不變（E2＝E1）；進行中列：狀態「進行中」、結束時間「—」，P2 比 P1 多約 3 分鐘；兩列的場次編號不同
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §背景：場次資訊（場次時長）+ §列表欄位/場次編號；進行中場次列於依場次明細依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以 spec 2026-09-17 修訂為準，v0.1
        不含該修訂）
      quote: 開始至結束的時間差；進行中則顯示累計至查詢當下
    assumptions: []
    critical_path: false
    source: spec_workflow
    design_rationale: REQ-008 為 high risk，需要 non_happy 覆蓋。REQ-008 的 rejection_contract.defined=true（非場次明細維度不顯示場次編號欄，由 TC-DAILYREPORT-026
      覆蓋），但針對 AC-0083 本身的反面是『「—」與累計時長只屬於進行中場次，其他狀態不應如此』。本案用同機台同查詢內的已結束列當對照組，驗證『已結束列不顯示「—」且時長固定』（依 spec 場次時長定義『開始至結束的時間差』）；已結束列的斷言出自
      v0.1 場次資訊表而非 AC-0083 的 then 子句，僅作對照。與第一條 TC 的差異：第一條驗進行中列本身（含期末餘額＝X），本條驗進行中與已結束的區分，兩者斷言不重疊。技術為 requirement_based，不是 boundary_value（沒有數值邊界）。【資料佈置的未驗證前提】開分／投注／出金等機台金流操作的入口，v0.1
      與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本 TC 以『機台前台畫面顯示的分數』為讀值來源，是依 TC-DAILYREPORT-054 既有寫法（以剩餘分數在機台前台嘗試進入遊戲）推測，需環境負責人確認。
    draft_id: TC-DRAFT-01M3VG7JJATAPQNNNVSR8J4XV7
