  - draft_id: TC-DRAFT-01M2RHAA6ZFVYQYJX2MPAT3FF3
    title: Admin 切換任一站台後可查看該站台所有場館的日結資料
    product: ba-admin
    functional_area: DAILYREPORT
    requirement_ids:
    - REQ-DAILYREPORT-001
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0011
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一個底下有多個場館（或多台機台分屬不同場館）的既有站台
    test_data: []
    steps:
    - n: 1
      action: 於頁面標題下方的站台切換下拉選單，切換至選定的站台
    - n: 2
      action: 進入『各式報表 > 場館日結報表』，統計維度選『依場館彙總』，結算日期設定涵蓋當日或近期有資料的區間並查詢
    - n: 3
      action: 檢視列表出現的場館筆數與範圍
    expected_result: 列表顯示該站台底下所有場館的日結彙總列，不因 Admin 身分而被排除任何場館；若改切換至另一個站台，列表資料範圍隨之切換為該站台的全部場館
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §功能說明/權限表
      quote: 場館日結報表 | 全部 | 管轄範圍 | 自身場館
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: AC-0011 對應 spec 權限表 Admin 欄『全部』；本案只驗證 Admin 可見範圍是否為所選站台的全部場館，不涉及站台切換選單本身如何決定資料範圍（該部分由 REQ-DAILYREPORT-002
      覆蓋），避免兩條 TC 斷言重疊
  - draft_id: TC-DRAFT-01M2RHAA6ZHPA9TRVAY1TS9GH0
    title: 站長只能查看自身及子站台管轄範圍內的場館資料，看不到管轄範圍以外的場館
    product: ba-admin
    functional_area: DAILYREPORT
    requirement_ids:
    - REQ-DAILYREPORT-001
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0012
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以站長身分登入後台
    - 確認該站長帳號的管轄範圍為特定一至多個場館（非站台全部場館），且該站台底下另有管轄範圍以外的場館存在，供後續比對
    test_data: []
    steps:
    - n: 1
      action: 進入『各式報表 > 場館日結報表』，統計維度選『依場館彙總』，結算日期設定涵蓋當日或近期的區間並查詢，記錄列表顯示的場館清單
    - n: 2
      action: 另以 Admin 身分查看同一站台、相同結算日期的場館日結報表，記錄該站台底下的全部場館清單
    - n: 3
      action: 比對兩份清單
    expected_result: 站長看到的場館清單為其管轄範圍內的場館，是 Admin 所見全部場館清單的真子集合；管轄範圍以外的場館不出現在站長的列表中
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §功能說明/權限表
      quote: 場館日結報表 | 全部 | 管轄範圍 | 自身場館
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 驗證方式採『站長清單 ⊆ Admin 清單』的比對法，而非斷言站長只能看到某個具體場館名稱——『管轄範圍』的實際場館組成因帳號設定而異，比對法可在不寫死特定測試帳號或場館編號的前提下驗證範圍限制是否生效
  - draft_id: TC-DRAFT-01M2RHAA6Z1E0DSQE6SCQQ6RE3
    title: 操作員只能查看自身場館資料，無法透過機台帳號篩選看到其他場館的日結資料
    product: ba-admin
    functional_area: DAILYREPORT
    requirement_ids:
    - REQ-DAILYREPORT-001
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0013
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以操作員身分登入後台
    - 確認該操作員帳號僅對應單一自身場館，且該站台底下另有其他場館存在（非操作員自身場館），供後續比對
    test_data: []
    steps:
    - n: 1
      action: 進入『各式報表 > 場館日結報表』，統計維度選『依場館彙總』，結算日期設定涵蓋當日或近期的區間並查詢，記錄列表顯示的場館筆數與名稱／代碼
    - n: 2
      action: 嘗試於『機台帳號』篩選欄輸入一個已知不屬於該操作員自身場館的其他場館機台帳號並搜尋，觀察結果
    expected_result: 步驟1 的列表只出現操作員自身場館一列（依場館彙總維度應僅一列），不出現任何其他場館資料；步驟2 輸入非自身場館的機台帳號後，列表不會回傳該其他場館的日結資料（不論呈現方式是空結果或維持原自身場館範圍，皆不應洩漏其他場館的資料）
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §功能說明/權限表
      quote: 場館日結報表 | 全部 | 管轄範圍 | 自身場館
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: REQ-DAILYREPORT-001 為 high risk，本案為其 non-happy 覆蓋：驗證操作員無法透過機台帳號篩選繞過場館範圍限制看到他人場館資料。rejection_contract.defined=false（spec
      未定義越權時系統的具體回應方式：拒絕／隱藏／空結果），故 expected_result 刻意只斷言『不洩漏其他場館資料』這個必然要件，不預設具體呈現方式（不寫死錯誤訊息或空白頁面文案）——這是對 spec 未定義部分保持開放而非把未定義行為當成確定規則來斷言，因此不需標為
      exploratory
