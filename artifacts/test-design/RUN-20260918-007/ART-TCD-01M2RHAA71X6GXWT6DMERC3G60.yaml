  - draft_id: TC-DRAFT-01M2RHAA6ZAP989GFK7AD6CF76
    title: 日結結算狀態的場次同樣計入當日場次數，不因是被強制結束而排除
    product: ba-admin
    functional_area: DAILYREPORT
    requirement_ids:
    - REQ-DAILYREPORT-009
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0091
    - AC-DAILYREPORT-0092
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一台場次記錄同時包含『已結束』與『日結結算』兩種狀態的既有機台（可於機台交易紀錄依場次狀態篩選查找；不要求存在『逾時結束』狀態的樣本——依CLR-DAILYREPORT-007的邏輯，逾時結束的判定時間必然超過日結時間，日結時間到達時會搶先強制結束所有進行中場次，故『當日』範圍內結構上不會出現逾時結束這個終結狀態，本TC不要求也不依賴此類樣本）
    test_data: []
    steps:
    - n: 1
      action: 於機台交易紀錄核對該機台當日場次的狀態分布，分別記錄『已結束』與『日結結算』各自的筆數
    - n: 2
      action: 進入場館日結報表，統計維度選『依機台明細』，結算日期設為當日，查詢，檢視該機台的『場次數』
    expected_result: 該機台的場次數＝已結束場次數＋日結結算場次數，不含進行中場次；依CLR-DAILYREPORT-007確認：日結結算狀態的場次（因日結時間到達被系統強制結束，非自然結束）同樣計入當日場次數，不因是被強制結束而被排除——這是本規則相對於『僅計已結束』這個較窄解讀的關鍵差異點。『逾時結束』依同一份CLR的邏輯推導，其判定時間必然超過日結時間，故當日範圍內結構上不會出現這個終結狀態，不在本TC的驗證範圍內
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §列表欄位/場次數
      quote: 為當日結束的場次筆數
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 第一輪獨立Validator指出：前版expected_result寫『已結束+逾時結束+日結結算』三者相加，卻又在同段引用CLR-007『只會以已結束或日結結算收尾』的結論，兩者自相矛盾；precondition要求尋找『當日逾時結束』樣本，但依CLR-007的推理，這個狀態結構上不應出現在當日資料中，等於要求執行者尋找一個理論上不存在的樣本，可能造成執行卡關。已依Validator建議(a)修正：聚焦驗證『已結束+日結結算』兩者相加，不再要求逾時結束樣本；本案與另一條TC（TC-DRAFT-01M2RHAA6Z6QPHG4FAQ50W650H，僅用已結束狀態、刻意迴避模糊地帶的保守設計）形成互補——那條驗證『純已結束』情境，本案專門驗證CLR-007新增的關鍵斷言：日結結算狀態也要計入，不重複，各自聚焦不同情境
