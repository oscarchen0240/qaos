    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §篩選器 + §業務規則-場館範圍跟隨站台切換
      quote: 不另設場館篩選欄位
    assumptions: []
