    title: 操作員後台選單無「站台列表」項目，無法進入場館設定頁面，額度上限等欄位無從檢視或修改
    requirement_ids:
    - REQ-PLATFORMRULE-014
    acceptance_criteria_ids:
    - AC-PLATFORMRULE-0141
    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    preconditions:
    - 以操作員身分登入後台
    - 站台切換選單已選定自身所屬的機台場館
    test_data: []
    steps:
    - n: 1
      action: 檢視後台左側選單，確認「站台列表」是否存在於選單中
    - n: 2
      action: 確認「會員與加盟商>會員列表」「帳務管理>洗分出金核實」「各式報表>交易紀錄查詢/注單查詢/稽核明細/場館日結報表」是否正常存在於選單中
    - n: 3
      action: 若嘗試直接以網址存取站台列表頁面，觀察系統反應
    expected_result: 選單中沒有「站台列表」這個項目，因此無法進入場館設定頁面，該頁面內的額度上限（本 spec 原文欄位）與場次逾時時間（SPEC-ARCADE-001 正本定義的欄位，本 spec 原文未提及）皆無從檢視，更無法修改；會員列表、洗分出金核實、交易紀錄查詢、注單查詢、稽核明細、場館日結報表等操作員可操作項目正常存在於選單中，不受影響（若直接以網址嘗試存取站台列表頁面，若實際錯誤訊息/阻擋方式與選單消失不同，不視為違反本條，僅測是否被阻擋）
    expected_result_spec_reference:
      spec_id: SPEC-PLATFORMRULE-001
      spec_version: '0.1'
      location: §角色與權限
      quote: 額度上限（場館層級） | 可設定 | 可設定 | 唯讀（本spec原文欄位，經 Oscar 2026-09-15 選單截圖確認整頁無法進入，非可檢視唯讀）。場次逾時時間欄位本身不在本 spec 原文中，出處見 SPEC-ARCADE-001
        §場館設定
    assumptions: []
    critical_path: true
    source: change_workflow
    design_rationale: CLR-PLATFORMRULE-003 PM 回覆（2026-09-22）：新需求，操作員可進入注單查詢與稽核明細；RM 已新增 REQ-PLATFORMRULE-024（AC-0241 可進入、AC-0242
      限自身場館）。 本條僅在步驟 2／expected 的操作員可用頁面列舉補入注單查詢與稽核明細（依 REQ-024），其餘與 v2 相同。
    supersedes_testcase:
      testcase_id: TC-PLATFORMRULE-018
      version: 2
