  - 『分數因投注輸完歸 0』的觸發機制屬於遊戲/投注引擎的範疇，不在本包（機台金流與場次，純後端）定義的四種金流 API 範圍內；本包僅定義『分數歸 0 時場次如何反應』，至於如何在測試環境中實際觸發分數歸 0（例如是否有可直接呼叫的測試用注單模擬介面），需與環境負責人或遊戲引擎測試團隊確認可行的觸發方式
  - 本 AC 標註為『理論情境』，真正的高並發競態通常需要能同時發送多筆請求的壓測/自動化工具才能可靠重現與驗證，一般手動或序列化的功能測試僅能模擬『幾乎同時』而非真正併發；是否有可用的並發測試工具/環境需與自動化或效能測試團隊確認
  - 『機台停用』的後台切換操作路徑，本 spec 未明確定義其所在頁面（僅說明其效果），推測透過既有的會員帳號啟用/停用機制操作，實際入口需與環境負責人確認
