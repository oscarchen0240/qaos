  - draft_id: TC-DRAFT-01M2MBHFR6XP0FQFE63NXFH2BG
    title: 開分加計後恰等於場館額度上限可成立，超過 1 單位則被拒絕（1-OVER LIMIT）
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-004
    acceptance_criteria_ids:
    - AC-CASHFLOW-0041
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    test_level: integration
    test_types:
    - boundary
    - negative
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 以 Admin 登入 站台列表，將該機台所屬場館的額度上限設為 A（一個便於計算的整數，例如現有全場館機台分數餘額合計＋已預留未入帳入金金額為 A-100）
    - n: 2
      action: 呼叫 req-keyin 開分金額恰為 100（使加計後全場館合計恰等於額度上限 A）
    - n: 3
      action: 確認開分成功（0-OK），分數增加、交易紀錄正常寫入
    - n: 4
      action: 再次呼叫 req-keyin 開分金額 1（此時加計後將超過額度上限 A）
    - n: 5
      action: 確認此筆的回覆與分數變化
    expected_result: 第一筆恰等於上限：成立，回 0-OK，分數正常增加；第二筆使合計超過上限：平台回 1-OVER LIMIT，分數不變、不寫入任何帳務異動，但交易紀錄留有「未成立」紀錄（超過額度上限不屬於餘額不足的不寫入例外）
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §四種金流/開分 + §附錄-開分
      quote: 判定與入帳於場館鎖內執行，與入金的預留共用同一把鎖而序列化，判定基準須含已預留未入帳的入金金額（v07 定案）；開分為單階段，判定即入帳。超過額度上限回 1-OVER LIMIT，不寫入任何帳務異動
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 此案例採 boundary_value，直接測試 AC-CASHFLOW-0041 描述的『超過上限』邊界的相鄰兩點：加總『恰等於上限 A』（應成立）與『超過上限 1 單位』（應被拒絕），是驗證『超過…上限』這種比較邏輯最直接的邊界取值方式，而非任意選一個明顯超額的大數字。test_data
      未寫死具體數字，改用相對量『現有合計為 A-100』搭配『開分 100』與『再開分 1』，讓執行者可依測試環境當下實際場館餘額推算出 A 與應佈置的差額，避免寫死可能不存在於環境中的絕對金額。expected_result 中『交易紀錄留有未成立紀錄』一句依
