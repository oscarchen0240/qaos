      是因為兩者是 REQ-CASHFLOW-033 定義的同一條規則下的兩種觸發來源，理解上需相互對照。額外加入 negative 標籤的第 6 步（分數維持 0 時不應意外建立場次）是針對『場次開始』這個規則的反向探測——驗證的是觸發條件的『必要性』（沒有分數轉正就不該有新場次），這部分未在
