  - draft_id: TC-DRAFT-01M2MBGVMHHKYCSY4FK40NV01M
    title: 額度上限內連續送出兩筆內容相同的開分請求，系統不偵測也不阻擋重複，兩筆皆入帳
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-005
    acceptance_criteria_ids:
    - AC-CASHFLOW-0051
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    test_level: api
    test_types:
    - functional
    design_techniques:
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 確認場館額度上限充足，不受本次測試金額影響
    - n: 2
      action: 呼叫 req-keyin 開分金額 X（模擬現場店員操作）
    - n: 3
      action: 確認回 0-OK，分數增加 X
    - n: 4
      action: 在未查詢後台的情況下，直接以完全相同的參數再次呼叫 req-keyin（模擬店員誤判失敗後重按）
    - n: 5
      action: 確認第二筆的回覆與分數變化
    expected_result: 兩筆請求皆判定通過、分別入帳，機台分數總共增加 2X——系統不會偵測或阻擋這種重複，此為 spec 明確承認的既定行為（現場 SOP 因應）而非缺陷
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §業務規則與驗證/單階段交易防重複 + §附錄-開分
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 此需求本質是驗證『沒有防護』這件事，design_technique 選 error_guessing 而非 negative，因為預期結果是兩次都成功（非拒絕），純粹是針對已知高風險情境（重按）做探測。
  - draft_id: TC-DRAFT-01M2MBGVMH2Y6DED4TTZSBKQ90
    title: req-cashin 每次皆建立新 PENDING 與唯一 TXID，不使既有 PENDING 失效；對其中一筆完成 end-cashin 不影響另一筆
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-006
    acceptance_criteria_ids:
    - AC-CASHFLOW-0061
    - AC-CASHFLOW-0062
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    test_level: api
    test_types:
    - functional
    design_techniques:
    - requirement_based
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 呼叫 req-cashin 送出第一筆入金請求，記錄回覆的 TXID1（PENDING1 建立）
    - n: 2
      action: 再呼叫 req-cashin 送出第二筆入金請求（同一機台帳號），記錄回覆的 TXID2
    - n: 3
      action: 確認 TXID1 ≠ TXID2，且 PENDING1 未因 PENDING2 的建立而失效（兩者並存）
    - n: 4
      action: 以 TXID1 呼叫 end-cashin 完成該筆入帳
    - n: 5
      action: 確認 PENDING2（TXID2）仍維持待確認狀態、未受影響，可再獨立以 end-cashin(TXID2) 完成
    expected_result: 每次 req-cashin 皆建立新 PENDING 並產生唯一 TXID，不使既有 PENDING 失效；同一帳號可同時存在多筆有效入金 PENDING，且對其中一筆完成或處理不會波及另一筆
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §附錄-入金
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
