    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 以 Admin 登入 站台列表，將該機台所屬場館的額度上限設為 A（一個便於計算的整數，例如現有全場館機台分數餘額合計＋已預留未入帳入金金額為 A-100）
    - n: 2
      action: 呼叫 req-keyin 開分金額恰為 100（使加計後全場館合計恰等於額度上限 A）
    - n: 3
      action: 確認開分成功（0-OK），分數增加、交易紀錄正常寫入
    - n: 4
      action: 再次呼叫 req-keyin 開分金額 1（此時加計後將超過額度上限 A）
    - n: 5
      action: 確認此筆的回覆與分數變化
    expected_result: 第一筆恰等於上限：成立，回 0-OK，分數正常增加；第二筆使合計超過上限：平台回 1-OVER LIMIT，分數不變、不寫入任何帳務異動，但交易紀錄留有「未成立」紀錄（超過額度上限不屬於餘額不足的不寫入例外）
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §四種金流/開分 + §附錄-開分
