  - draft_id: TC-DRAFT-01M2MBGVMHT4WYRV85CYYF3V2A
    title: 開分請求送達即立即生效，交易紀錄類型正確且當下直接累計存款次數與金額（不需核實）
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-003
    acceptance_criteria_ids:
    - AC-CASHFLOW-0031
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    test_level: integration
    test_types:
    - functional
    design_techniques:
    - requirement_based
    - state_transition
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 查詢機台帳號於會員列表的目前「存款次數」「存款金額」作為基準值
    - n: 2
      action: 呼叫 req-keyin 送出開分請求，金額 X（模擬店員以鑰匙開啟機台選單為玩家開分）
    - n: 3
      action: 確認回覆立即生效，機台分數增加 X
    - n: 4
      action: 至機台交易紀錄查詢該筆（若查詢頁尚未部署，可改查詢後端資料紀錄核對），確認類型為「機台開分」、金額為正值 X
    - n: 5
      action: 立即（不進行任何額外的核實或審核操作）重新查詢會員列表的存款次數與存款金額
    - n: 6
      action: 嘗試尋找任何可撤銷／回滾這筆開分存款次數與金額累計的後台操作
    expected_result: 分數立即增加 X；交易紀錄類型為「機台開分」、金額為正值；存款次數 +1、存款金額 +X，且是在交易完成當下就直接累計（不等待核實），累計後不存在任何撤銷或回滾入口
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §四種金流/開分
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: AC-0031 只斷言累計行為本身；額外加入『尋找撤銷入口』一步，是因為此需求為 high risk 且『不需核實即直接累計』本身隱含不可逆的風險，屬合理的 error_guessing 延伸，未超出
      AC 的『直接累計』語意。
  - draft_id: TC-DRAFT-01M2MBGVMHN0KYGNTD3HATTEMD
    title: 開分加計後恰等於場館額度上限可成立，超過 1 單位則被拒絕（1-OVER LIMIT）
    product: ba-admin
    functional_area: CASHFLOW
    requirement_ids:
    - REQ-CASHFLOW-004
    acceptance_criteria_ids:
    - AC-CASHFLOW-0041
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    test_level: integration
    test_types:
