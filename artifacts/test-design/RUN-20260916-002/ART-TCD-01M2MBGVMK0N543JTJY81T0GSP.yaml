    test_data: []
    steps:
    - n: 1
      action: 設場館額度上限為 A，目前全場館餘額合計＋已預留金額為 A-150
    - n: 2
      action: 呼叫 req-cashin 送出金額 100 的入金請求（單看未超限：A-150+100=A-50，未超過 A）
    - n: 3
      action: 確認此筆通過並建立 PENDING（預留轉入後，判定基準已含此筆的 100）
    - n: 4
      action: 接著（不等待前一筆入帳，模擬幾乎同時送達）呼叫 req-cashin 送出金額 100 的另一筆入金請求（若僅以原始 A-150 為基準計算不會超限，但加計前一筆已預留的 100 後將達 A+50，超限）
    expected_result: 依場館鎖逐筆序列化處理：第一筆通過並將 100 計入預留後，第二筆的判定基準已包含第一筆的預留（A-150+100+100=A+50 超過上限），因而正確被擋下並回 1-OVER LIMIT，不會發生『兩筆各自判斷都通過、合計卻超額』的漏洞
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §附錄-入金
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 無法在單機測試中製造真正的並行競態（同一毫秒送達），故以『不等待第一筆結果即連續送出第二筆』模擬序列化鎖的判定基準是否正確累加預留金額，這是本規則可被功能測試驗證的核心邏輯，而非依賴真正的高並發壓測工具。
