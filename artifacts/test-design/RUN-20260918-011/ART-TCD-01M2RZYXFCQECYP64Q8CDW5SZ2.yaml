  - draft_id: TC-DRAFT-01M2RZYXFB9CT74GR8738QJZ6Z
    title: 機台場館前台網域找不到自行註冊入口，同一時間線上站台前台維持提供註冊入口作為對照
    product: ba-admin
    functional_area: ARCADE
    requirement_ids:
    - REQ-ARCADE-001
    acceptance_criteria_ids:
    - AC-ARCADE-001
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - negative
    - requirement_based
    priority: low
    risk: low
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 於後台『站台列表』頁面，查詢一個既有機台場館（或自行經營之機台主站台）的網域，並另外查詢一個既有線上站台的網域，記錄兩者的前台網址（本步驟僅用於取得網址，不涉及登入後台以外的任何前台操作）
    test_data: []
    steps:
    - n: 1
      action: 於瀏覽器開啟機台場館的前台網址，檢視頁面（含首頁、登入頁、選單與頁尾等一般常見放置註冊入口的位置）是否存在任何『註冊』相關按鈕或連結
    - n: 2
      action: 於另一分頁開啟該線上站台的前台網址，同樣檢視是否存在『註冊』相關按鈕或連結，並嘗試點擊確認可進入註冊流程頁面
    expected_result: 機台場館前台網域的頁面（首頁、登入頁、選單、頁尾等常見位置）皆找不到任何『註冊』入口；線上站台前台網域則正常可見『註冊』入口並可進入以帳號密碼方式自行註冊的流程，兩者形成對照，差異僅在站台類型不同
    expected_result_spec_reference:
      spec_id: SPEC-ARCADE-001
      spec_version: '0.7'
      location: 機台場館的後台選單／補充說明
      quote: 機台場館的前台不開放自行註冊（v07 定案維持）：註冊入口不在機台場館的前台提供，機台帳號一律由後台建立（暱稱禁用詞設定因此一併隱藏）；開放與否屬未來營運需求、時程未定。線上站台的前台註冊不受影響
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 本條驗證的行為主體是會員前台網域，不是後台管理系統，故 precondition 刻意不假設後台有一個對應『申請/切換前台』的操作入口，而是利用後台『站台列表』既有且不受本次排除規則影響的網域查詢功能取得前台網址，再直接以瀏覽器造訪前台網域驗證；RequirementModel
      的 AC 用語『同一站台切到線上站台的前台』屬 RM 抽象化描述，實際上前台並無『站台切換』這個後台概念，機台場館與線上站台本屬不同網域/不同站台，本 TC 因此以『開兩個分頁分別檢視兩個不同前台網域』的方式落地，而非誤植為前台真的存在切換元件。技巧上這是單一輸入條件（站台類型）對應兩種相反結果（無/有註冊入口）的對照案例，非多條件組合，故不標decision_table；因主要斷言是『找不到』，標
      negative，同時保留 requirement_based 因對照組的『線上站台正常提供』這半段斷言直接可由業務規則表原文『線上站台的前台維持開放以帳號密碼方式自行註冊』（v0.7.md 第803行）佐證，此段因與本引用的第264行段落不連續，故未併入
      quote，僅在此說明。
  - draft_id: TC-DRAFT-01M2RZYXFB5RZJCDAQAZG9A5JX
    title: 機台帳號產生投注流水後，其所屬加盟商當期的加盟傭金與代理返傭金額不因此增加
    product: ba-admin
    functional_area: ARCADE
    requirement_ids:
    - REQ-ARCADE-002
    acceptance_criteria_ids:
    - AC-ARCADE-002
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一個既有加盟商，其站台樹（含任何層級子站台）底下已包含一個機台場館，且該場館下至少有一台既有機台帳號（自行從環境中選定；此掛載關係是否已存在屬環境事實，若無法確認見下方假設）
    - 於『各式報表 > 加盟傭金發放紀錄』（或加盟商詳細頁的統計區塊），記錄該加盟商在本次查驗前、當期結算週期的加盟傭金與代理返傭金額，作為比對基準
    test_data: []
    steps:
    - n: 1
      action: 於『各式報表 > 交易紀錄查詢』或『注單查詢』，以該機台帳號查詢確認其於本結算週期內是否已存在（或可產生）至少一筆新的已完成投注紀錄；若當下無現成紀錄，需依機台現場流程使其產生（此步驟涉及機台端硬體操作，非本 spec
        定義的後台 UI 範圍，見下方假設）
    - n: 2
      action: 待該筆機台帳號投注流水確認已產生（可於交易紀錄查詢或注單查詢中查得）後，重新查詢『各式報表 > 加盟傭金發放紀錄』（或加盟商詳細頁統計），取得該加盟商本期最新的加盟傭金與代理返傭金額
    - n: 3
      action: 將本次取得的金額與前置作業記錄的比對基準金額逐一核對
    expected_result: 該加盟商本期的加盟傭金與代理返傭金額與比對基準相同，未因該機台帳號新產生的投注流水而增加；同時該筆機台帳號的投注流水本身在交易紀錄查詢／注單查詢中確實可查得（證明流水真實發生過，排除『沒增加只是因為根本沒發生』的誤判可能）
    expected_result_spec_reference:
      spec_id: SPEC-ARCADE-001
      spec_version: '0.7'
      location: 既有功能對機台帳號的排除規則／排除規則總表
      quote: 4.5 / 4.6 | 加盟傭金／代理返傭 | 不適用，機台帳號的投注不計入任何上層的傭金基數
    assumptions:
    - text: 本 TC 假設測試環境當下存在（或可佈置）一個機台場館作為某既有加盟商站台樹的子站台，且該場館下至少有一台機台帳號；本次精讀的 spec 段落（140-232行、760-819行）未定義機台場館與加盟商站台樹之間具體的掛載機制細節（該機制屬站台列表/加盟商相關
        spec 範圍），此環境事實需環境負責人確認才能佈置。此外，使該機台帳號實際產生新的投注流水，依賴機台端硬體現場遊玩流程，非本 spec 定義的後台 UI 可直接觸發；若環境當下無法產生新流水，可改用已存在的歷史投注流水，搭配其發生前後對應期間的傭金/返傭計算結果變化進行比對，但仍需環境負責人協助確認該歷史區間的計算結果快照。
      requirement_id: REQ-ARCADE-002
      needs_human_confirmation: true
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: REQ-ARCADE-002 為 high risk，本案即其 non-happy 覆蓋，expected_result 斷言『不計入』這個負面事實，比對基準採用同一加盟商『產生流水前 vs 產生流水後』的金額快照對比，並額外核對流水本身確實存在，避免落入『沒看到變化只是因為壓根沒發生』的偽陰性陷阱（依指示
      4 的比對基準要求）。技巧上僅標 negative：本案只有單一輸入條件（機台帳號流水）對應單一結果（不增加），不構成多條件矩陣，不套用 decision_table。是否已有機台場館掛在既有加盟商站台樹下，屬本次精讀段落未定義的環境設定細節，依指示
      1 誠實以 assumption 揭露，不假裝環境必然已具備此掛載關係。
  - draft_id: TC-DRAFT-01M2RZYXFB37BAYAV26S799WMV
    title: 機台帳號完成金流交易後，優惠彩金審核佇列查無該筆交易
    product: ba-admin
    functional_area: ARCADE
    requirement_ids:
    - REQ-ARCADE-003
    acceptance_criteria_ids:
    - AC-ARCADE-003
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - negative
    priority: medium
    risk: medium
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 站台切換下拉選單切換至一個既有的機台場館站台
    - 選定該場館下一個既有機台帳號，記錄其目前的交易紀錄狀態（可先於『各式報表 > 交易紀錄查詢』核對），供後續比對是否有新增交易
    test_data: []
    steps:
    - n: 1
      action: 使該機台帳號完成任一筆金流交易（開分／入金／洗分／出金皆可，四者本 requirement 一視同仁），記錄該筆交易的完成時間與交易編號（此步驟涉及機台端硬體現場流程，非本 spec定義的後台 UI 範圍，見下方假設）
    - n: 2
      action: 進入『帳務管理 > 優惠彩金審核』頁面，以涵蓋該筆交易完成時間的查詢區間查詢
    - n: 3
      action: 檢視查詢結果列表中是否存在對應該筆機台交易的審核項目；若查詢區間內原本就有其他線上會員的優惠彩金審核項目，一併記錄，以確認佇列本身有在正常運作而非剛好整批皆空
    expected_result: 優惠彩金審核佇列的查詢結果中查無剛才那筆機台帳號交易對應的審核項目；若查詢範圍內原本就存在其他線上會員的優惠彩金審核項目，這些項目仍正常列出，僅機台帳號的交易不出現，證明並非佇列查詢功能本身異常
    expected_result_spec_reference:
      spec_id: SPEC-ARCADE-001
      spec_version: '0.7'
      location: 既有功能對機台帳號的排除規則／排除規則總表
      quote: 3.3 | 優惠彩金審核 | 不適用
    assumptions:
    - text: 機台帳號的開分／入金／洗分／出金交易本身是玩家在機台端實際操作產生的紀錄，非後台 UI 可直接建立的動作；本 TC 假設測試環境當下可透過機台現場流程（或既有模擬工具）使該機台帳號產生至少一筆新的已完成金流交易供查驗，若環境當下無法產生，需洽環境負責人協助，此步驟超出本
        spec 定義範圍。
      requirement_id: REQ-ARCADE-003
      needs_human_confirmation: true
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: REQ-ARCADE-003 為 medium risk（不強制 non-happy），但其 behavior_kind 為 rejection，本身即以負向斷言（不出現）驗證最貼近 statement，故仍設計為
      negative。比對基準採『若查詢範圍內存在其他線上會員項目則仍應正常列出』的方式排除『佇列整體異常』的干擾（依指示 4）。機台交易來源依賴機台端硬體流程，誠實以 assumption 揭露，模式與REQ-ARCADE-002 一致。
  - draft_id: TC-DRAFT-01M2RZYXFBZ015T1Q5Q8NSBYJ4
    title: 新建機台主站台的鏈上錢包管理 TWD 頁籤可見稽核倍數欄位，初始預設值為 0
    product: ba-admin
    functional_area: ARCADE
    requirement_ids:
    - REQ-ARCADE-004
    acceptance_criteria_ids:
    - AC-ARCADE-004
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 於後台『站台列表』新增一個全新的機台主站台（站台類型選擇「機台」，依畫面指示填寫其餘必要欄位後建立），確保稽核倍數尚未被任何人調整過，記錄新建立站台的名稱以利後續操作（刻意新建而非沿用既有場館，避免既有場館的稽核倍數可能已被他人調整過、導致無法驗證真正的初始預設值）
    test_data:
    - name: 稽核倍數初始值
      value: 0
    steps:
    - n: 1
      action: 站台切換下拉選單切換至剛建立的機台主站台
    - n: 2
      action: 進入『帳務管理 > 鏈上錢包管理』，檢視頁籤列
    - n: 3
      action: 點開 TWD 頁籤，檢視稽核倍數設定欄位目前顯示的數值
    expected_result: 頁籤列僅顯示「TWD」（法幣）頁籤；TWD 頁籤內可見稽核倍數設定欄位，欄位當下顯示值為 0（尚未經任何調整的初始預設值）
    expected_result_spec_reference:
      spec_id: SPEC-ARCADE-001
      spec_version: '0.7'
      location: 機台帳號的稽核／稽核規則表
      quote: 預設值 | **0 倍**——即開分與入金不產生稽核門檻，玩家隨時可洗分與出金
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 本案驗證的是欄位存在與初始值，不涉及後續計算效果，故單純以 requirement_based 技巧設計靜態檢視案例。以『新建一個從未被調整過的機台主站台』取代『任選一個既有機台場館』作為前置作業，理由是既有場館的稽核倍數可能早已被其他測試或操作調整過、不再是
      0，若沿用既有場館會把『這個特定場館目前剛好是 0』誤當成『驗證了預設值就是 0』，兩者不是同一件事（依指示 1 對『環境目前是否已具備某狀態』的假設要誠實處理，此處選擇改用『從既有站台列表新增功能建立全新站台』這個 spec 已明確保證存在的路徑來規避此假設，而非略過不談）。導覽路徑（鏈上錢包管理，非帳務管理出金設定）依本
      requirement 的RequirementModel 已由 Oscar 2026-09-15 人工確認並記錄於 history，且可由 v0.7.md 第254行『機台場館的後台選單』分類表『帳務管理 | 鏈上錢包管理（僅顯示法幣
      TWD 頁籤，區塊鏈頁籤隱藏——稽核倍數設定在此）』交叉驗證，非本 TC 自行臆測的介面路徑。
  - draft_id: TC-DRAFT-01M2RZYXFBEB2M473NYKMZTE7A
    title: 稽核倍數調整為大於 0 並儲存後，尚未完成稽核的部分會使機台洗分／出金的核可金額被扣減
    product: ba-admin
    functional_area: ARCADE
    requirement_ids:
    - REQ-ARCADE-004
    acceptance_criteria_ids:
    - AC-ARCADE-004
    spec_id: SPEC-ARCADE-001
    spec_version: '0.7'
    test_level: ui_e2e
    test_types:
    - functional
    - boundary
    design_techniques:
    - scenario
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一個既有機台場館，並記錄其下一台既有機台帳號（作為稽核倍數調整後的觀察對象）
    test_data:
    - name: 稽核倍數設定值
      value: 大於 0 的任意值（例如 2）
    steps:
    - n: 1
      action: 站台切換至該機台場館，進入『帳務管理 > 鏈上錢包管理 > TWD』頁籤，將稽核倍數由目前值修改為一個大於 0 的數值（例如 2），儲存
    - n: 2
      action: 使該機台帳號完成一筆機台開分或機台入金交易，使其產生尚未完成稽核的累計金額（此步驟涉及機台端硬體現場流程與稽核判定的具體計算方式，非本 spec 摘錄段落定義範圍，見下方假設）
    - n: 3
      action: 在該筆開分/入金完成、稽核尚未完成的狀態下，嘗試對該機台帳號執行洗分或出金操作，檢視系統核可的金額
    expected_result: 洗分或出金的核可金額因尚未完成稽核的部分而被扣除，明顯低於未設定稽核倍數（0倍）時應得的全額；若扣除後金額為 0，機台畫面顯示餘額不足。此結果證明剛才在鏈上錢包管理 TWD 頁籤儲存的稽核倍數確實套用於後續的機台開分與入金稽核門檻計算，而不是僅停留在設定畫面本身沒有實際生效
