    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 測試用機台 M（自行從環境中選定一台啟用機台），並取得其現行有效憑證 T_old（JWT）
    - 【環境前提，spec 未定義位置】後台需要有重置機台憑證的功能，且重置後能取得新憑證 T_new（spec 說明重置後舊 token 一律拒絕、須由現場重新寫入新憑證；憑證相關功能屬 創建會員帳號 規格，位置與操作需環境負責人確認）
    expected_result: 機台憑證被重置後，仍以舊 token 呼叫任一 API：平台拒絕並回 9-OTHER ERROR（憑證失效），不寫入任何帳務異動。
    design_rationale: 技術：憑證驗證屬安全規則，標 security_rule，test_types 為 negative／security。既有 TC-CASHFLOW-059 驗證『憑證被重置→回 9-OTHER ERROR』，本案新增
      AC-0491 的『任一 API』與『不寫入任何帳務異動』，並用重置前對照與新 token 對照，排除『機台本身或場館有問題』這類干擾。『任一 API』無法窮舉，我取四種代表（單階段開分、洗分，兩階段第一階段入金、出金）；end-cashin／end-cashout
      等需要既有 TXID 的第二階段 API 未納入，這是範圍縮窄而非 spec 限定。依據：附錄第 282 行（重置後舊 token 一律拒絕）與第 319 行（Token 無效或已重置→9-OTHER ERROR）。『不寫入帳務異動』的觀察方式是分數與交易筆數前後相同（筆數不變同時符合
      CLR-006 憑證失效不寫交易紀錄）。憑證重置功能在後台的位置 spec 在本包內沒有，已在前提標為需環境負責人確認。
