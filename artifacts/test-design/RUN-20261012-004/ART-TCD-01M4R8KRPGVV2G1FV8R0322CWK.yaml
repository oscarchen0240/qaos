    - AC-CASHFLOW-0265
    test_level: ui_e2e
    test_types:
    - negative
    - security
    design_techniques:
    - security_rule
    priority: high
    risk: medium
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【前端受阻註記】管理員『手動取消』的 UI 入口在 4.1 交易紀錄查詢（機台視角），前端尚未開發（BUG-TXLOG-001 OPEN；後端已完成）。前端上線前，涉及該入口的步驟無法以 UI 執行，執行結果記為『受阻』（不是 FAIL）；可改以後端手動取消
      API 驗證，API 的路徑、認證與參數 spec 未定義，需由開發提供
    - 已有兩個後台帳號可用（自行從環境中選定）：一個管理員（Admin）角色、一個站長角色，皆能進入 4.1 交易紀錄查詢（機台視角）。【環境前提】站長角色能否進入該頁 spec 本包未載明；若進不了，記錄為『站長無法檢視』，不判定通過
    - 本案的證據強度限制：前端上線前，管理員也看不到手動取消入口，無法區分『站長被限制』與『前端未開發』；因此步驟 4 的後端 API 嘗試，或前端上線後的重跑，才是有效證據
    expected_result: 以站長（非管理員）身分檢視待確認出金時，手動取消不可操作；待確認出金的手動取消僅限管理員。
    design_rationale: 技術：角色×操作的權限規則，標 security_rule，test_types 標 negative／security。依據：CLR-CASHFLOW-008 rev1『僅管理員，RD 已確認』（REQ-026
      Q02 KR2，minor 決策點，state E1）。RM 的 detail_gaps 指出 spec 本身只寫『管理員手動取消』，沒有明說站長不可，且入金段落寫『管理員／站長』——所以『站長不可』的明確依據是 CLR 不是 spec
      原文，和 RD 確認一致。不外推：只斷言『4.1 機台視角待確認出金的手動取消站長不可』，不斷言站長對其他功能的權限。證據強度的誠實限制：前端未開發時，站長與管理員同樣看不到入口，UI 步驟是弱證據（已在前提寫明）；要得到有效證據需後端
      API 嘗試或前端上線後重跑。API 的拒絕回應 spec 未定義，故只記錄不斷言。
