    priority: high
    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）；【環境前提，需環境負責人確認】
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 記下當下『全場館所有機台帳號分數餘額的合計』S（逐一讀出該場館每個機台帳號的分數後加總，讀法見前一條環境前提），並記下 M 目前分數 B0
    - 將 M 所屬場館的『額度上限』設為 A = S + 100（額度上限屬站台列表的場館設定；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效）。例：S = 250 則 A = 350
    expected_result: 恰等於額度上限的開分（100）成立，回 0-OK、分數增加 100，且同場館尚未完成的入金 PENDING（50）不計入判定、req-cashin 不預留額度；超過額度上限 1 單位的開分（1）被拒絕：回
      1-OVER LIMIT、分數不變、不寫入任何帳務異動，且交易紀錄查無此次拒絕的紀錄、不會以『未成立』狀態出現。
    design_rationale: 技術：原 v3 標 decision_table，但本案實際是『剛好等於上限（成立）／剛好超過 1 單位（拒絕）』的上限邊界比較，spec 明定『超過上限』即拒絕，所以改標 boundary_value，不是矩陣。斷言依據分層：(1)
      超過上限回 1-OVER LIMIT 且不寫任何帳務異動＝spec 第 352 行原文（REQ-004 Q01）；(2)『恰等於上限可成立』是從『超過』的字面推得的邊界，spec 沒有單獨寫『等於可成立』，屬我的推論，沿用 v3 且
      CIR 明示改寫時保留；(3)『未完成入金 PENDING 不計入、不預留』＝CLR-CASHFLOW-005（REQ-007 Q01 裁決，spec 第 94/249/325 行寫 req-cashin 預留屬文件未同步，不採用）；(4)『額度上限拒絕不寫交易紀錄』＝CLR-CASHFLOW-006（REQ-030
      Q02 裁決，spec 第 180 行寫會留未成立紀錄屬文件未同步，不採用）。v3 的『另建構已預留未入帳入金使合計為 A-100』在 v0.2 不成立（入金不預留），改成以『已入帳餘額合計 S 加 100』構成邊界，並新增未完成入金
      PENDING 作對照，驗證它不計入。v3 掛的 AC-0301（洗分／出金餘額不足）v3 步驟其實沒有測，REQ-030 的 AC-0301/0302 另有 TC-CASHFLOW-035 涵蓋，故本版只掛實際驗證的 AC-0302，並新增
      REQ-007／AC-0071（req-cashin 只建 PENDING 不預留），以便決策點依據歸屬清楚。入金 PENDING 金額刻意取 50（遠小於剩餘額度 100）：CLR-005 提到 req-cashin『或僅做極寬鬆的防禦性預檢』，預檢是否存在及門檻
      spec 未定義（REQ-007 Q01 detail_gaps），取小額可避免預檢干擾，不測鉅額防禦（TC-CASHFLOW-008 已涵蓋）。我依賴的環境機制假設（已在 preconditions 標註）：後台可讀出各機台帳號分數並加總出
      S、額度上限修改後即時套用、測試期間場館無旁人交易；這三項 spec 都沒寫，需環境負責人確認。
    source_ref: 'affected: TC-CASHFLOW-005 v3（CI-SPEC-CASHFLOW-001-0.1-0.2）'
    critical_path: true
