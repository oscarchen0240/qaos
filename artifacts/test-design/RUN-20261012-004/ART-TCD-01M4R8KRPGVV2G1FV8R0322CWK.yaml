    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    expected_result: 待確認入金經 end-cashin 成功入帳後，M 分數增加 200（B0 變為 B0 + 200），該筆由『待確認』轉為『已完成』；入金在 req-cashin 階段未預留額度，入帳不涉及預留額度的轉換。
    design_rationale: 技術：原 v2 標 decision_table＋state_transition，但本案只有一條 PENDING→已完成 的狀態轉換（REQ-008 states 的第一列），沒有條件矩陣，所以只標
      state_transition。spec 第 327 行原句後半寫『把預留轉為實際餘額』，與 CLR-005（req-cashin 不預留）衝突，Oscar 2026-10-12 適用紀錄已裁定以 CLR 為準，所以 er 只引前半『關閉
      PENDING、更新帳務』，不引預留那半句；『不預留額度』的依據是 CLR-CASHFLOW-008 rev1（REQ-008 Q01 的 resolution 來源）。v2 的『預留轉為實際分數餘額、額度不再被此筆佔用』在 v0.2
      不成立，已改寫；沒有可觀察的方式直接斷言『沒有發生預留轉換』，所以只斷言可觀察的結果（分數入帳、狀態轉已完成），『未預留』由 TC-CASHFLOW-005/053 以額度探測驗證。步驟 3 讀到的『入帳前分數 B0』只是比對基準，不是獨立斷言。沿用
      v2 的 hotfix_eligible/critical_path 旗標。額度上限設 0（不限制）是 spec 明載的語意，目的只是排除額度干擾。
