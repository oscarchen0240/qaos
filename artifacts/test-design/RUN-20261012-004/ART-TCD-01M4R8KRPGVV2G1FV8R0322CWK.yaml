    - 記下全場館所有機台帳號分數餘額合計 S，並將 M 所屬場館的『額度上限』設為 A = S + 100（剩餘額度 100；修改後是否即時套用 spec 未載明，請向環境負責人確認）
    expected_result: 加計後將超過場館額度上限時，開分 req-keyin 與入金的 end-cashin 都回 1-OVER LIMIT。
    design_rationale: 技術：原 v2 標 decision_table，但只有『超過上限→1-OVER LIMIT』一個條件結果，沒有輸入條件矩陣；開分與入金 end-cashin 是同一個結果的兩個入口，改標 requirement_based。v2
      步驟 2『送出開分或入金請求』沒區分階段，在 v0.2（CLR-005）入金的 req-cashin 不判額度，只有 end-cashin 才回 1-OVER LIMIT，故拆成開分與 end-cashin 兩個入口。決策點依據的限制要誠實說明：1-OVER
      LIMIT 的觸發條件在狀態碼對照表第 316 行（er 與 source_refs 引用的原文），但 RM 為 REQ-029 Q01 列的 known_rules 只含第 308、317、318、319 行，不含第 316 行；所以
