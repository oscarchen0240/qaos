    - M 目前沒有尚未完成的出金交易（人工出金會連動取消該機台尚未完成的出金，此規則會干擾本案）
    expected_result: 櫃檯對機台帳號人工入金或人工出金後，會員列表的存款次數／存款金額與提款次數／提款金額皆不變。
