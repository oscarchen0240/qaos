    - name: 剩餘額度 H（A − S）
      value: 100
    - name: 未完成入金金額
      value: 100
    - name: 逾時前探測：開分
      value: 1
    - name: 逾時後探測：開分（超過剩餘額度 99 共 1）
      value: 100
    - name: 逾時後探測：開分（恰等於剩餘額度 99）
      value: 99
    assumptions: []
    supersedes_testcase:
      testcase_id: TC-CASHFLOW-053
      version: 1
    title: 待確認入金逾時轉為已逾時時分數不增加，且不憑空釋放額度：逾時前後場館剩餘額度不變
    requirement_ids:
    - REQ-CASHFLOW-008
    acceptance_criteria_ids:
    - AC-CASHFLOW-0082
    test_level: api
    test_types:
    - functional
    - boundary
    design_techniques:
    - boundary_value
    - state_transition
    priority: high
    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）；【環境前提，需環境負責人確認】
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 專用場館：整段觀察期（超過 24 小時）內該場館不得有本案以外的任何交易（含其他機台的開分、入金、洗分、出金），否則下方剩餘額度探測值會失準；【環境前提，需環境負責人確認】
    - 本案需跨 24 小時，可與 TC-CASHFLOW-014 等案例同時間各自建立專用 PENDING、共用等待時間；但本案必須獨佔場館（其他案例的 PENDING 不得在同場館造成入帳或開分）
    - 【環境前提，spec 未定義】系統排程的執行頻率 spec 未載明，本案不設時限，記錄實際轉換時間
    expected_result: 待確認入金超過 24 小時未完成，自動轉為『已逾時』，分數不增加；入金不預留額度，因此逾時時沒有預留額度被釋放——逾時前後場館剩餘額度保持不變（本案以開分探測：逾時前 H−1 = 99、逾時後仍為 99）。
    design_rationale: 原 v1：『PENDING 有預留額度→逾時釋放預留』在 v0.2 不成立（CIR 判 affected）。AC-0082 新 then 是『分數不增加；不涉及預留額度的釋放』。『不涉及釋放』本身沒有直接可觀察的欄位，所以我設計額度探測來驗證：剩餘額度
      H=100、PENDING 100，若 req-cashin 有預留，逾時前探測 1 會被拒；逾時後若錯誤地『釋放』從未預留的金額，剩餘額度會膨脹，探測 100 會誤成立、探測 99 與 100 之間的邊界即是判準——所以標 boundary_value（99
      成立／100 拒絕是精確邊界）與 state_transition（PENDING→已逾時）。這個『誤釋放會讓額度膨脹』是我的缺陷假設，不是 spec 文字；spec/CLR 的依據只有：入金不預留（CLR-008 rev1／CLR-005）、24
      小時轉已逾時（第 375 行）、分數不會增加（第 106 行原文：『該筆待確認 24 小時後自動轉「已逾時」，分數不會增加』）。CIR 建議可與 TC-CASHFLOW-014 整併；因 014 與 053 掛不同需求（REQ-012／REQ-008）且不能自行退役，兩案都保留：014
      驗證 24 小時門檻本身，本案驗證逾時不影響額度。機制假設已標在 preconditions：專用場館 24 小時無旁人交易（否則探測值失準）、後台能讀出各機台分數合計。這項『24 小時無旁人交易』在真實環境可能很難滿足，需環境負責人確認；若做不到，本案的額度探測步驟（3、6、7）改記為受限，其餘斷言（轉已逾時、分數不增加）仍可執行。
    source_ref: 'affected: TC-CASHFLOW-053 v1（CI-SPEC-CASHFLOW-001-0.1-0.2）'
    critical_path: true
