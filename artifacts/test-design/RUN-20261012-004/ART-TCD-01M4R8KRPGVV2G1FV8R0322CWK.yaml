    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提，spec 未定義】需要能使用機台前台（機台本身的遊戲畫面或模擬器；以 M 的機台帳號登入前台，帳密由環境負責人提供）下注，並查看前台的『注單』與『遊戲紀錄』。spec 說明機台帳號的前台登入僅供機台本身的遊戲畫面使用，帳密不交付玩家，故取得方式需環境負責人說明
    - 開始前確認 M 分數為 0、沒有進行中場次
    expected_result: 機台前台的注單與遊戲紀錄僅顯示當前進行中場次的內容：場次因出金切換後，下一位玩家看不到前一場次（S1）的任何注單與遊戲紀錄；機台沒有進行中場次（分數為 0）時，內容為空。
    design_rationale: 技術：一條連續情境（S1 下注→出金切換→無場次→S2 開始）同時涵蓋 AC-0471 與 AC-0472，屬 scenario；test_types 含 negative，因為 AC-0471 的主體是『看不到前一場次』（負面事實）。負面事實的對照基準：步驟
      2 先證明 S1 的注單確實存在且能在前台顯示（正向對照），步驟 7 再以後台證明紀錄沒被刪除，這樣步驟 4、5 的『空』才能歸因於場次隔離，而不是『本來就沒有紀錄』。步驟 7 假設後台注單查詢頁可查到已結束場次的注單，spec 只在『場次欄位於線上帳號』列提到注單查詢頁會帶場次編號欄位，沒有明說機台帳號的查詢細節，已標『若該頁可查到』，不可查則略過，不影響前面斷言。最大機制假設：能取得並使用機台前台（ENV_FRONT）。spec
      說明帳密不交付玩家，我無從得知測試環境如何取得，已在前提要求環境負責人說明。注意 AC-0471 的 given 是『玩家 A 出金離台』，我選出金作為場次切換方式；洗分切換場次也會觸發，但留餘數時新場次會立即承接，不是『無進行中場次』，故出金較能乾淨地製造空場次。
