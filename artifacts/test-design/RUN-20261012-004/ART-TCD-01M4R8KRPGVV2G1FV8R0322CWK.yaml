      AC-0291 的 then；未斷言分數不變等額外行為。額度剩餘 100、請求 150 取遠離邊界的值，因邊界已由 TC-CASHFLOW-005/008 驗證。步驟 2 的 req-cashin 150 超過剩餘額度 100，依
      AC-0071／CLR-005 req-cashin 本就不判額度；若環境在此步回拒絕，屬 REQ-CASHFLOW-007 的行為偏差（由 TC-CASHFLOW-008 判定），本案記為受阻，不併入本案結論。『機台退鈔』是機台實體行為，AC-0291
      只規範狀態碼，本案不斷言。
