    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 本案需跨 24 小時。可與 TC-CASHFLOW-053、本批『待確認出金超過 24 小時不逾時』案例在同一時間各自建立專用 PENDING、共用同一段等待時間（每案使用自己的 TXID）
    - 【環境前提，spec 未定義】系統排程的執行頻率 spec 未載明；若環境提供縮短逾時或調整時間的方式，須由環境負責人說明，本案預設以真實等待為準
    expected_result: 入金 PENDING 建立滿 24 小時且經系統排程檢查後，自動轉為『已逾時』，M 分數不增加（入金不預留額度，無預留需釋放）。
    design_rationale: 技術：24 小時是 spec 明定的時間門檻（『超過 24 小時』），所以同時標 boundary_value；狀態由 PENDING 轉已逾時是 REQ-012 states 的第一列，標 state_transition。步驟
      2『未滿 24 小時仍待確認』是從『超過 24 小時才轉』推得的邊界另一側，AC-0121 的 then 沒有明寫，屬我的推論；CIR 說 24 小時逾時主體行為不變。排程頻率 spec 未定義，故步驟 3 不設通過時限，只要求記錄實際轉換時間，延遲異常長由執行者回報確認。AC-0122（逾時後
      end-cashin 回 1-NO RECORD）已有 TC-CASHFLOW-015 涵蓋，本案不重複。v1 的『釋放預留額度』在 v0.2 不成立（入金不預留，見 REQ-007），改為『分數不增加』。與 TC-CASHFLOW-053
      的差異：053 驗證 REQ-008 視角下逾時不憑空釋放額度，本案驗證 REQ-012 的 24 小時門檻本身。真實等待 24 小時是我選的最保守執行方式，調時間的做法 spec 沒有定義。
    source_ref: 'affected: TC-CASHFLOW-014 v1（CI-SPEC-CASHFLOW-001-0.1-0.2）'
    critical_path: false
