      預期寫『交易紀錄查詢頁不存在手動取消操作（CLR-004）』，已被 CLR-CASHFLOW-008 rev1 推翻（出金恢復管理員手動取消，後端已完成、前端未開發 BUG-TXLOG-001），故改寫成三條收斂路徑。本案親自走兩條：新請求取代（API
      可執行）與管理員手動取消（UI 流程，受阻時改後端 API）；第三條『櫃檯人工出金連動取消』由 TC-CASHFLOW-032 驗證，不重複。管理員手動取消的詳細斷言（分數不異動、遲到 end-cashout 回 1-NO RECORD）放在本批新增案例（AC-0262），本案只確認它是會讓
      PENDING 收斂的路徑之一。『等待至少 10 分鐘』是我自訂的觀察窗，用來代表『不會自動結束』；spec 對平台端沒有任何出金逾時（24 小時不逾時另由 AC-0264 案例驗證），不是 spec 數字。斷言『只會因這三條路徑收斂』無法窮舉驗證，本案以『觀察期內不自動變化』加『兩條路徑實際收斂』作為證據。UI
      入口的名稱與二次確認視窗：CLR-008 只說『於 4.1 交易紀錄查詢機台視角操作』，二次確認視窗的有無 spec 在本派發包內沒寫，步驟以『若出現則確認』處理。
