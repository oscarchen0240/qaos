    - 【環境前提，spec 未定義】spec 的『場次』小節只列出場次資訊的呈現位置（會員詳細頁『機台資訊』區塊顯示進行中場次摘要、機台交易紀錄可依場次編號篩選、場館日結報表可選『依場次明細』），未載明『場次狀態』『期末餘額』等欄位在哪個頁面逐欄可見；請環境負責人指定查看場次資訊的頁面，執行者以該頁為準（下文稱『場次資訊頁』）
    expected_result: 洗分結束且留有餘數 21 的場次期末餘額為 21、出金結束的場次期末餘額為 0；由開分起始的場次期初餘額為 0，承接洗分餘數的場次期初餘額為 21。
    design_rationale: 技術：一條連續情境鏈（開分→洗分留餘數→承接→出金）同時產出 AC-0462 與 AC-0463 所需的四個場次狀態，屬 scenario。這與 TC-CASHFLOW-039（承接餘數 21 的期初餘額）有重疊，已列
      duplicate_check；本案的增量是同時檢查期末餘額規則（洗分結束留餘數＝餘數、出金結束＝0）與開分起始場次的期初為 0。依據：第 232 行（期末餘額規則）與 Q_START 引用的場次資訊表『期初餘額』列；AC-0463
      的期初規則不在 RM 為 REQ-046 列的 known_rules 內，所以 decision_refs 只掛 Q02 的期末餘額規則，期初以 source_refs 補充。洗分以稽核 0 倍為前提（precondition 已列），洗分與出金完成當下場次即結束、不等核實（第
      209 行，由 TC-CASHFLOW-041 驗證）。場次資訊頁位置同 AC-0461 案例，spec 未定義。
