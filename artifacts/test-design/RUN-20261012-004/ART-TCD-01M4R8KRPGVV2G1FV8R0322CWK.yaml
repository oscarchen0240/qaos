    steps:
    - n: 1
      action: M 送出 req-cashin，金額 50；之後不送 end-cashin（讓這筆入金停在待確認）
      expected: 回 0-OK 並取得 TXID，後台 4.1 出現該筆『待確認』入金 50，M 分數仍為 B0；req-cashin 階段不判定額度、不預留額度（AC-0071）
    - n: 2
      action: 後台 4.1 以 M 的機台帳號篩選（不篩選交易狀態），記下目前列出的交易筆數 N1
      expected: N1 為此後比對『被拒絕的開分有沒有留下紀錄』的基準筆數
    - n: 3
      action: M 送出 req-keyin，金額 100（加計後全場館合計 = S + 100，恰等於額度上限 A）
      expected: 回 0-OK，M 分數 = B0 + 100。若上一步未完成的入金 PENDING（50）被計入判定，合計會變成 S + 150 而被拒絕，所以本步成立即代表該 PENDING 不計入、不預留
    - n: 4
      action: 後台 4.1 重新查詢（不篩選交易狀態），記下交易筆數 N2
      expected: 新增 1 筆已完成的開分 100；N2 = N1 + 1
    - n: 5
      action: M 送出 req-keyin，金額 1（加計後合計 = S + 101，超過 A 共 1 單位）
      expected: 回 1-OVER LIMIT；M 分數維持 B0 + 100，不變
    - n: 6
      action: 後台 4.1 重新查詢（不篩選交易狀態，涵蓋所有狀態）
      expected: 筆數仍為 N2，查無這次被拒絕的金額 1 的開分紀錄，也沒有任何『未成立』狀態的紀錄（對照基準：步驟 4 的 N2）
    - n: 7
      action: 還原：把場館額度上限改回原值。步驟 1 的入金 PENDING 因入金沒有手動取消，不需處理，24 小時後自動轉為已逾時
