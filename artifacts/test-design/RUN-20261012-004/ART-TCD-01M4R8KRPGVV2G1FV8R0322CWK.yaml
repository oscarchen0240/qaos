      quote: 交易紀錄的類型記為「機台出金」，金額為負值
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.2'
      location: §業務規則與驗證（本包相關）（第 258 行）
      quote: 提款次數／提款金額累計機台洗分與機台出金——於「洗分出金核實」頁核實當下累計，待核實與已作廢不計
    steps:
    - n: 1
      action: 會員列表記下 M 的『提款次數』w0、『提款金額』m0
      expected: 取得基準值 w0、m0
    - n: 2
      action: M 送出 req-keyin 1000；再送 req-keyout mode=value、value=100、throshold=100
      expected: 回 0-OK，核可 100（洗分 R_w 完成，M 分數 900）
    - n: 3
      action: M 送出 req-cashout 與 end-cashout 完成出金（全額 900），得 R_o；再送 req-keyin 400，req-cashout 與 end-cashout 完成出金（全額 400），得
        R_v
      expected: 兩筆出金完成，M 分數 0
    - n: 4
      action: 後台 4.1 查看 R_w、R_o、R_v；會員列表查看提款次數與金額
      expected: R_w 交易類型『機台洗分』金額 −100；R_o、R_v 類型『機台出金』金額 −900、−400；三筆都尚未核實，提款次數、提款金額仍為 w0、m0（尚未累計）
    - n: 5
      action: 到『洗分出金核實』頁僅核實 R_w（R_o、R_v 維持待核實）；查看會員列表
      expected: 提款次數 = w0 + 1、提款金額 = m0 + 100（R_o、R_v 為待核實，不計）
    - n: 6
      action: 核實 R_o；查看會員列表
      expected: 提款次數 = w0 + 2、提款金額 = m0 + 1000（以核心貨幣原值累計，不換算）
    - n: 7
      action: 對 R_v 在『洗分出金核實』頁執行『作廢』（不核實）；查看會員列表
      expected: 提款次數、提款金額維持 w0 + 2、m0 + 1000（已作廢不計）
    test_data:
    - name: 洗分 R_w
      value: 指定金額 100（mode=value、throshold=100）
    - name: 出金 R_o
      value: 全額 900
    - name: 出金 R_v（將作廢）
      value: 全額 400
    assumptions: []
    source_ref: 'new_required: REQ-CASHFLOW-048/AC-0482,AC-0483'
    title: 機台洗分／出金完成但未核實：類型與負值正確、提款次數與金額尚未累計；核實當下才累計，待核實與已作廢不計
    requirement_ids:
    - REQ-CASHFLOW-048
    acceptance_criteria_ids:
    - AC-CASHFLOW-0482
    - AC-CASHFLOW-0483
    test_level: integration
    test_types:
    - functional
    - negative
    design_techniques:
    - equivalence_partitioning
    priority: high
    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提】會員列表要能看到該機台帳號的『提款次數』『提款金額』欄位；能進入『洗分出金核實』頁並對機台洗分／出金執行『核實』與『作廢』（核實與作廢屬另一個規格；CLR-CASHFLOW-004 的答案提到該頁的『作廢』僅適用於已完成、已生成收據的出金交易，作廢的前置條件與畫面以該頁規格為準）。測試期間不得有其他針對
      M 的交易
    expected_result: 機台洗分（或出金）完成但尚未核實時：交易類型為『機台洗分』（或『機台出金』）、金額為負值，提款次數／金額尚未累計；於『洗分出金核實』頁核實當下，提款次數 +1、提款金額加上該筆（以核心貨幣原值）；待核實與已作廢者不計。
    design_rationale: 技術：核實狀態有三個互斥類別（待核實／已核實／已作廢），各自對提款累計的效果不同（不計／計／不計），本案每類各取一筆代表，標 equivalence_partitioning；它是單一條件（核實狀態）的分類，不是多條件矩陣，所以不標
      decision_table。test_types 含 negative：『待核實與已作廢不計』是負面事實，比對基準是步驟 1 的 w0、m0 以及每步前後差額。依據：第 258 行（提款累計時點與待核實／已作廢不計）、第 131
      行（洗分類型與負值）、第 164 行（出金類型與負值）。我依賴的、spec 沒寫的機制：(1) R_v 必須能在『核實』之前直接『作廢』——CLR-004 只說作廢適用於『已完成、已生成收據的出金』，沒說是否要先核實或是否有其他前置；若該頁不允許對待核實的出金直接作廢，步驟
      7 記為受限，不影響前六步；(2)『洗分出金核實』頁與會員列表的欄位位置，另兩個規格負責。洗分我用 mode=value（指定金額 100）而不是全洗，是為了讓三筆互相獨立，不讓餘數影響後續出金金額。
