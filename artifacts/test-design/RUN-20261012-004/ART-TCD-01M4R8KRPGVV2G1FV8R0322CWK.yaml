    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】使 M 的分數餘額恰為 399.6：spec 只說明餘額帶小數來自部分遊戲派彩，沒有定義 req-keyin 是否接受小數金額、也沒有定義如何構造小數餘額。建議作法（我的推測，未經
      spec 證實）：先把 M 餘額清到 0，再試送 req-keyin 金額 399.6，若回 0-OK 且後台顯示 M 分數為 399.6 即可；若被拒（例如 6-BAD DATA/FORMAT）或顯示被取整，改請環境負責人以測試資料工具或指定派彩設定把餘額設為
      399.6。無法取得恰為 399.6 的餘額時，本案記為『受阻』，不可改用其他小數值替代後仍宣稱通過
    expected_result: 餘額 399.6、門檻 0 全洗：核可金額為 399.6（含小數、不取整），機台餘額歸 0；平台只記 399.6，現場實際付現多少平台不記錄。
    design_rationale: 技術：REQ-013 輸入 throshold 的限制是 min:0，門檻 0 正是該輸入的下界值，且 spec 對 0 有專屬語意（洗出全部餘額、不取整），所以標 boundary_value，並滿足本需求『有數值限制必須有
      boundary_value 案例』。既有 TC-CASHFLOW-056 是整數餘額 321 的門檻 0；本案新增的是『餘額帶小數』這個維度。依據：第 127 行『門檻 0 的全洗比照出金，洗分金額照記實際餘額（含小數，例 399.6）』與第
      360 行；CLR-CASHFLOW-007 同。『現場實際付現平台不記錄』只做負面斷言的一半：我只確認 4.1 紀錄是 399.6，沒有逐頁搜尋『有沒有別處記了實付』，因為 spec 沒有定義實付欄位存在於何處。最大風險是環境機制：如何讓
      M 餘額恰為 399.6 spec 完全沒定義（開分是否接受小數也沒寫），已在 ENV_DEC 前提標為推測並要求受阻時不得換值充數。AC-0134 的 then 沒有要求交易紀錄的正負號，所以 4.1 只斷言金額絕對值。
