      標 negative（驗證某操作不存在）。依據只有 CLR-CASHFLOW-008 rev1（REQ-008 Q01 的裁決來源）；spec v0.2 第 326、249 行原文寫『管理員／站長可手動取消入金』與該裁決衝突，Oscar
      2026-10-12 適用紀錄已裁定以 CLR 為準，所以 expected_result_spec_reference 的 location 明寫這是 CLR 而非 spec 原文，其 spec_id/spec_version 欄位只是
      SpecReference 格式必填，並不代表 spec 原文支持這句話——請審查者留意。『負面事實』的比對基準：同頁的待確認出金列（對照組）。但目前前端沒有任何手動取消入口（BUG-TXLOG-001），所以在前端上線前，對照組也看不到入口，此時『入金列無入口』是弱證據，我在
      preconditions 與步驟 3 都誠實寫明，並要求前端上線後重跑；再以步驟 6（end-cashin 仍能完成）證明該筆沒有被其他途徑取消。不把規則外推：只斷言『4.1 機台視角看不到取消入金的操作』，不斷言所有角色對所有入金相關功能都沒權限；站長能否進入
      4.1 是 spec 本包沒寫的，已標註。步驟 5（後端 API 嘗試取消入金）spec 未定義回應，刻意只記錄不斷言。
