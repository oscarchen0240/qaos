      action: 等到 TXID_B 建立後超過 24 小時，每隔一段時間重新整理 4.1，記錄轉換時間（期間場館內不得有其他交易）
      expected: TXID_B 轉為『已逾時』
    - n: 5
      action: 讀 M 分數
      expected: M 分數仍為 B0 + 1，沒有增加（逾時不入帳）
    - n: 6
      action: 逾時後探測：M 送出 req-keyin，金額 100（超過剩餘額度 99 共 1）
      expected: 回 1-OVER LIMIT。若逾時時把從未預留的 100 當成預留額度釋放，剩餘額度會變成 199，此筆會誤成立
    - n: 7
      action: M 送出 req-keyin，金額 99（恰等於剩餘額度）
      expected: 回 0-OK（剩餘額度恰為 99，與逾時前一致）
    - n: 8
      action: 還原：把場館額度上限改回原值
