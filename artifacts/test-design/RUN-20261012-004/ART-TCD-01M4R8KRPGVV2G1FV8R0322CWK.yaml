      action: 記錄廠商 API 文件中 req-cashin 請求是否定義了 order_id 欄位；M 送出 req-cashin，金額 100
      expected: 記錄：請求有無 order_id（值）、回覆有無 order_id（值）。僅記錄，不判定
    - n: 2
      action: 後台 4.1 查看該筆入金（待確認），記錄訂單編號欄是否顯示 order_id、值是否與步驟 1 一致；嘗試以該 order_id 在 4.1 的訂單編號篩選查詢，記錄是否查得
      expected: 僅記錄。若欄位顯示『—』、查無或與步驟 1 不一致，記為與 AC-0453 敘述不一致的觀察，不判定缺陷
    - n: 3
      action: M 送出 end-cashin，帶 TXID 與實際清點金額 100，使該筆收斂；再記錄 order_id 是否與完成前相同
      expected: 回 0-OK；僅記錄 order_id 是否未變
    test_data:
    - name: 入金金額
      value: 100
    assumptions:
    - text: 入金 order_id 的來源（廠商於 req-cashin 帶入或由平台產生）尚未定案（CLR-CASHFLOW-011 OPEN，REQ-CASHFLOW-045 Q02 minor）；本案不假設來源，只記錄觀察。『入金帶有
        order_id 並可於交易紀錄顯示與查詢』（spec 2026-09-09 定案）的存在性、以及『由平台產生、與出金共用編號規則與全系統唯一』的暫定規則，都只當觀察點，待 CLR-CASHFLOW-011 回覆後再轉為確定斷言
      requirement_id: REQ-CASHFLOW-045
      needs_human_confirmation: true
    source_ref: 'new_required: REQ-CASHFLOW-045/AC-0453'
    title: 入金交易帶 order_id（來源待確認，exploratory）：只記錄 req-cashin 後入金是否帶有 order_id 及其在後台的呈現，不斷言來源、格式與唯一性
    requirement_ids:
    - REQ-CASHFLOW-045
    acceptance_criteria_ids:
    - AC-CASHFLOW-0453
    test_level: api
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: medium
    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 【環境前提】廠商 req-cashin 請求的欄位（是否含 order_id）依廠商 API 文件（spec 未列欄位）；本案如實使用文件規定的請求格式，不自行加入或省略 order_id
    expected_result: 【exploratory，僅記錄、不判定通過或失敗】記錄：(a) req-cashin 請求與回覆是否出現 order_id 及其值；(b) 後台交易紀錄查詢中該入金是否顯示 order_id、能否以其查詢；(c)
      值的來源判斷（請求帶入值與回覆相同＝廠商帶入；請求未帶而回覆出現＝平台產生）；(d) 與出金 order_id 的編號規則看起來是否相同。依 spec，入金交易同樣帶 order_id（2026-09-09 定案），來源待確認（CLR-CASHFLOW-011
      OPEN）；來源、格式與唯一性不在本案斷言範圍。
    design_rationale: REQ-045 Q02 是 E5（basis undefined，minor）：依需求 A 規則，依賴此決策點的斷言只能 exploratory，且 basis 為 undefined 的 known_rules
      只是背景、不能當 expected 依據，所以 decision_refs 的 basis_ref 為 null，source_refs 留空。依指示『以 exploratory／只記錄方式撰寫，不要假設』：我不替 CLR-CASHFLOW-011
      擅自選邊，連『平台產生』的暫定規則也不當成預期結果，只列為觀察點(c)(d)。expected_result_spec_reference 引用的是 spec 第 323 行的『待確認…確認前暫定比照出金由平台產生』原文，用意是揭露這是待確認事項，不是拿來當斷言。這是
      REQ-045 唯一的 exploratory 案例（上限 3）。步驟 2 嘗試以 order_id 在 4.1 篩選，是因為 AC-0453 說『可於交易紀錄查詢顯示與查詢』；4.1 的訂單編號欄／篩選的實際行為不在本派發包的 spec
      內，所以只記錄。
