    design_rationale: 技術：單一情境→單一結果，requirement_based。既有 TC-CASHFLOW-023 是整數餘額 321 與餘額 0，本案補『餘額帶小數』。依據：第 168 行『餘額帶小數時，收據面額照記實際餘額（含小數）』（Q02
      KR0）與第 336 行（Q02 KR2）；-399.6 的負號與金額是 AC-0203 的 then，交易紀錄類型『機台出金』金額為負值見第 164 行。RM 把 Q02 標 minor（小數位數上限、儲存精度、顯示格式未定義，且收據由機台列印、格式非平台控制），所以我只斷言數值相等，不斷言字串形式；這是刻意縮窄範圍，避免把未定義的格式寫成確定規則。『收據』在過渡期沒有實體收據，改看前台結算結果畫面，spec
      第 153 行起有過渡期說明；若測試只走 API，核可金額在 req-cashout 回覆裡，這點回覆欄位名稱 spec 未定義，已在步驟寫『以回覆的核可金額為準』。餘額 399.6 的佈置方式 spec 沒定義，同 ENV_DEC
      的推測性前提。
