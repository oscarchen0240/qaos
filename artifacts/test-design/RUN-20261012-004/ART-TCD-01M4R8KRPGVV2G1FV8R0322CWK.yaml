    priority: high
    risk: high
    preconditions:
    - 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
      M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
    - 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
    - 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
    - 將 M 所屬場館的『額度上限』設為 0（spec：設為 0 代表不限制），避免額度判定干擾本案。額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，設定後請向環境負責人確認生效；執行完畢後還原原值
    - 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】使 M 的分數餘額恰為 399.6：spec 只說明餘額帶小數來自部分遊戲派彩，沒有定義 req-keyin 是否接受小數金額、也沒有定義如何構造小數餘額。建議作法（我的推測，未經
      spec 證實）：先把 M 餘額清到 0，再試送 req-keyin 金額 399.6，若回 0-OK 且後台顯示 M 分數為 399.6 即可；若被拒（例如 6-BAD DATA/FORMAT）或顯示被取整，改請環境負責人以測試資料工具或指定派彩設定把餘額設為
      399.6。無法取得恰為 399.6 的餘額時，本案記為『受阻』，不可改用其他小數值替代後仍宣稱通過
    - 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）；【環境前提，需環境負責人確認】
    - 【環境前提，spec 未在本包定義】需要能查看『洗分出金核實』頁（spec 提及，屬另一個規格）與『場館日結報表』（spec 提及的收據金額、已兌現金額、現金淨收欄位），以及當日該場館報表會即時含入本案交易；欄位位置與是否需先日結，請對照該兩頁的規格或請環境負責人確認。本案以『前後差額』比對，所以測試期間該場館不得有其他交易
    expected_result: 面額 399.6 的出金完成後，不論櫃檯實付 399 或 400：交易紀錄、洗分出金核實與場館日結報表的收據金額、已兌現金額、現金淨收一律以面額 399.6 計；平台不記錄實付金額，也不記錄面額與實付的差額。
    design_rationale: 技術：requirement_based。我曾考慮標 equivalence_partitioning（實付 399／400 兩類），但系統根本沒有實付輸入欄位，兩類對平台沒有差別，硬標會是裝飾，所以只做一個代表值並寫明另一值同理。test_types
      加 negative：AC-0204 的 then 主體是『平台不記錄實付與差額』（負面事實）。比對基準：報表前後差額（步驟 1 與 5），並要求測試期間場館無其他交易（preconditions）。最大限制：『洗分出金核實』與『場館日結報表』的欄位位置、是否即時更新、『現金淨收』的計算方式不在
      SPEC-CASHFLOW-001，是另兩個規格的內容；我只依 AC 的用詞（收據金額、已兌現金額、現金淨收）設計，並假設這三欄的變動量等於本筆面額——這是我的推論，尚未被本包 spec 證實（AC 只說『一律以面額計』）。若欄位計算方式使變動量不等於面額（例如現金淨收含其他項），請執行者依該報表規格調整比對，不得直接判失敗。『核實』動作位於洗分出金核實頁，本包僅提及；核實是否為取得『已兌現金額』的必要條件是我的推測，故放在
      AC 之外的步驟，不列入斷言。
