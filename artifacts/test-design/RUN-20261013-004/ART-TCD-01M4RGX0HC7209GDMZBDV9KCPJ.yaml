    design_rationale: 依據：第 62 行（總計為整個查詢結果的各欄合計、匯出同範圍）、第 54 行（每列恆等式）、第 53／70 行（狀態以查詢當下為準）；AC-0162、AC-0272、AC-0273。T3RR RF-10
