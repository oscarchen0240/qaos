      quote: 後端也擋了：直接呼叫 API 帶非自身場館參數會被後端拒絕
    design_rationale: 依據：CLR-DAILYREPORT-001 的補充『後端也擋了：直接呼叫 API 帶非自身場館參數會被後端拒絕』與前段『前端已擋（站台切換選單不提供其他場館）』，以及第 25 行權限表（操作員＝自身場館）；AC-0013。T3RR
      RF-15 指出：管理員／站長版本（TC-140／141）同時驗證查詢與匯出，操作員版本只有 TC-004 驗證查詢 API，匯出可能是獨立端點。『匯出 API 也屬於 CLR-001 所說的「直接呼叫 API」』是我依 RF-15
      的推論（CLR 原文沒有特別提匯出）；因此預期寫成『被拒絕、不含非自身場館資料』，不超出 CLR 的字面範圍。技術：security_rule（角色範圍規則的越權拒絕）；步驟 6 為對照組，排除假拒絕。與 TC-004 的關係：004
      只驗證查詢請求、屬 exploratory，本案驗證匯出請求且已有 CLR 依據，不取代 004。我的推測與需確認事項：(1) 匯出是否有獨立請求（步驟 3 現場確認，沒有則跳過）；(2) V2 必須確實存在且有資料，否則空結果會被誤判為『被拒絕』，故前提要求
      V2 有資料、並以對照請求排除格式錯誤；(3) 拒絕的具體形式未定義，不作判準。
    source_ref: T3RR:RUN-20261012-007 RF-15
