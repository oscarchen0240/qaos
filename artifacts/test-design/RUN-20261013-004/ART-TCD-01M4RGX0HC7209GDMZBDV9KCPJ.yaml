    design_rationale: 依據：第 35 行（按週以週一為週起、每列為各營業日彙總）、第 70 行（非按日時各金額為該週期內各營業日合計、三欄依收據日歸屬）、第 42 行（營業日依日結時間切分）；AC-0052、AC-0151、AC-0155；T3RR
      RF-03 指出 TC-014 與既有按週 TC 都以 T=00:00 為前提，沒有覆蓋 T 不是 00:00 的週界。技術：boundary_value，邊界是週一 M 的日結時刻 T（兩側各一組交易：T 之前屬前一週、T 起屬新一週）；對照基準是同一機台同一查詢內的兩列，若系統改以日曆週一
      00:00 切週，X1 的 100 會落入新一週列（開分 300），結果可區分。我的推測與需確認事項：(1)『週一的營業日自週一的 T 起算』是由第 35、42 行推得，非 spec 逐字；(2) 週一 00:00 ～ T 的現場操作窗口與造數方式為我的推測，需環境負責人確認；(3)
