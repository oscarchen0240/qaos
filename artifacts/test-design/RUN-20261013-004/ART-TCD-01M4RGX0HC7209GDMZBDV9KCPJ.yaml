      spec_version: '0.3'
      content_hash: 535d360df2afe72602ff397f6fcd1f329b9225472aaba13b798b95f590c3fc6d
      location: §列表欄位／進鈔金額（第 50 行）
      quote: 當日入金總額（紙鈔機收現）
    - *id006
    - *id007
    design_rationale: 依據：第 50 行（進鈔金額＝當日入金總額）、第 51 行（收據金額＝當日出金總額）、第 53 行（未兌現為當日仍待核實收據的合計）；AC-0101、AC-0116。T3RR RF-13 指出：機台會以同一
      TXID 重送完成回報，沒有任何案例驗證報表在重送之後仍只計入一次。技術：scenario（入金／出金 → 重送 → 再查詢的時序），test_types 含 negative（重複送出不得使金額加倍）；不標 error_guessing，因為重送是
      T3RR 指出的真實情境，不是我猜的錯誤輸入。對照基準：以『重送前 Z1』對『重送後 Z2』比較，並以基準 Z0 確認單次完成的增量，不依賴任何機台金流端的內部規則。我的推測與需確認事項：(1) 重送工具與請求格式不在派發包範圍內（本
      spec 只說機台金流在開發包③），由環境負責人提供；(2)『重送不是新交易』這個前提取自 T3RR RF-13 的描述（機台金流端要求冪等），我無法在派發包內找到它的原文，若實際系統設計為重送被視為新交易或另有規則，本案預期需與環境負責人確認；(3)
      只比較重送前後的報表金額欄，不斷言重送的回應內容，也不斷言機台交易紀錄的筆數（只記錄）；(4) 不涉及注單數。
    source_ref: T3RR:RUN-20261012-007 RF-13
