    design_rationale: 依據：第 68 行（相鄰列前後相接，較早一期期末＝次一期期初）、第 42／152 行（營業日依日結時間切分）、AC-0071／0072（T 前歸前一營業日、T 整點歸當日）、AC-0201。T3RR
      RF-12 指出：現有案例都在日結前後的靜止狀態下查詢，沒有覆蓋日結執行當下有交易進來的情況。技術：boundary_value，邊界是日結時刻 T0，交易流橫跨 T0 兩側；每筆交易歸屬由『機台交易紀錄』的實際交易時間判定，而不是預設某筆落在哪一側，因為現場無法精準控制每筆的毫秒時間。只用開分：不送注單（注單跨場次切換點的歸屬已有
      BUG-DAILYREPORT-004，不斷言），不涉及逾時結束場次（CLR-DAILYREPORT-017 仍 OPEN，不依賴）。日結強制結束進行中場次並轉出餘額（第 151 行）是背景，本案不斷言場次狀態與場次數。我的推測與需確認事項：(1)
      送出開分的機台模擬器與迴圈指令由環境提供（spec 未定義）；(2)『機台交易紀錄』的交易時間與報表分日使用同一時間，是我的推測，需環境負責人確認，若兩者本來就不同，步驟 3 的計數基準要調整；(3) D 的開分基準以送入前查詢取得。
    source_ref: T3RR:RUN-20261012-007 RF-12
