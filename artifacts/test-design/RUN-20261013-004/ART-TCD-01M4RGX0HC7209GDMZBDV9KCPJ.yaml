      CSV 同範圍）；AC-0104（399.60 不取整）、AC-0272（三欄與收據的勾稽）、AC-0161／0162。T3RR RF-04 指出：含小數只用單筆 399.60 驗證過，多張小數收據同列加總、進入總計列與 CSV 時有無浮點尾數、恆等式是否精確沒有案例。技術：requirement_based——這是同一規則（恆等式與合計）套在含小數資料上的一般案例，沒有
      spec 定義的數值邊界，也沒有條件組合矩陣，所以不標 boundary_value／decision_table。資料設計：同一欄內出現 0.10＋0.20（浮點易出尾數）、再與 399.65 同列相加，是我為了讓浮點誤差可被觀察而選的，不是
      spec 規則。顯示位數 spec 未定義，已在前提註明不作判準，只比較數值是否精確與彼此一致。我的推測與需確認事項：(1) 造出餘額恰為 0.10、0.20、399.65 的方式；(2) D 場館除 A、B 外無其他出金；(3)
      核實／作廢的角色與按鈕名稱以畫面為準。
