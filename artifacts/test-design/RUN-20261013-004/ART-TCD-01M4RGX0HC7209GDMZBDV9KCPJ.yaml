      A 以複製為 cURL 的請求迴圈重放 60 輪，session B 同時逐張處理 12 張收據；斷言只用不變量（恆等式、收據金額不變、總計＝各列之和）與最終一致結果，不斷言任何中途數值，因為中途的混合狀態不可預測。步驟 4 要求確認有中途狀態的檔案，避免沒有真正並行卻誤判通過。我的推測與需確認事項：(1)
