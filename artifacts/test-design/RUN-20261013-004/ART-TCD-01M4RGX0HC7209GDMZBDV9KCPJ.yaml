    - name: 預期（前一週列，週起為 M-7）
      value: 開分 100、收據 100、未兌現 100
    - name: 預期（新的一週列，週起為 M）
      value: 開分 200、收據 200、未兌現 200
    steps:
    - n: 1
      action: 依前提造出 X1 類與 X2 類交易（X1 類在週一 M 的 00:00 ～ T 之前、X2 類在 T 之後）。到『機台交易紀錄』逐筆確認兩組交易的時間，記入執行記錄
      expected: X1 類兩筆（開分、出金）的交易時間皆早於 M 的 T、不早於 M 的 00:00；X2 類不早於 M 的 T。否則造數失敗，重做，不繼續後續步驟
    - n: 2
      action: 以管理員登入並選好站台，開啟場館日結報表：統計維度『依機台明細』、統計週期『按週』、機台帳號填機台 A、結算日期設為 M-7 ～ M，搜尋
      expected: 列表出現兩列：週起為 M-7 的前一週列、週起為 M 的新一週列（依 CLR-DAILYREPORT-008，不完整週照實際起迄顯示，新一週列只含 M 這個營業日）
    - n: 3
      action: 記錄前一週列與新一週列各自的『開分金額』『收據金額』『未兌現金額』
      expected: 前一週列：開分 100、收據 100、未兌現 100；新一週列：開分 200、收據 200、未兌現 200。X1 類（週一 00:00 ～ T 之前）不出現在新一週列
    expected_result: 按週彙總以營業日為單位：週一 M 的 00:00 ～ T 之間發生的開分 100 與出金收據 100（待核實）屬於週日營業日，計入前一週列（開分 100、收據 100、未兌現 100）；M 的 T 起發生的開分
