    steps:
    - n: 1
      action: 依前提造出 X1 類與 X2 類交易（X1 類在週一 M 的 00:00 ～ T 之前、X2 類在 T 之後）。到『機台交易紀錄』逐筆確認兩組交易的時間，記入執行記錄
      expected: X1 類兩筆（開分、出金）的交易時間皆早於 M 的 T、不早於 M 的 00:00；X2 類不早於 M 的 T。否則造數失敗，重做，不繼續後續步驟
