      expected: 請求被後端拒絕（以回應是錯誤而非成功的檔案內容判定）；不產生含 V2 任何日結資料列的檔案或回應內容；狀態碼、錯誤訊息與錯誤代碼只記錄，不作判準
    - n: 5
