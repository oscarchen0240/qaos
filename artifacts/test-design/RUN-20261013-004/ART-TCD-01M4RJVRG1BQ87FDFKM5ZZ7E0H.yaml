    - security_rule
    priority: high
    risk: high
    execution_cost: medium
    preconditions:
    - 環境負責人提供一個既有的操作員帳號（其自身場館記為 V1），以及一個『非自身場館』V2：確實存在於系統、不是 V1，且在同一個查詢條件（見下）下有日結資料列，作為越權目標
    - 操作員自身場館 V1 在某個單一營業日 d 有報表資料，作為對照（自身場館）的查詢條件
    - 瀏覽器可開啟開發者工具擷取請求；匯出請求的路徑與代表站台／場館的參數名稱本 spec 未載明，由步驟 3 現場擷取，不預設。若匯出沒有獨立請求（例如前端自行由查詢結果產生檔案），如實記錄此事實並跳過步驟 4～6
    - CLR-DAILYREPORT-001（2026-09-14 補充）只說明『後端會拒絕』，沒有定義拒絕的 HTTP 狀態碼、錯誤訊息或錯誤代碼；本案只判定『被拒絕且不含非自身場館資料』，這些具體值只記錄、不作判準，也不套用管理員／站長適用的『無權限』錯誤（CLR-DAILYREPORT-014
      的適用對象不含操作員）
    - 進入 各式報表 > 場館日結報表（以操作員登入後）
    test_data:
    - name: 越權目標 V2
      value: 由環境負責人提供，不寫死
