      RF-03 指出 TC-014 與既有按週 TC 都以 T=00:00 為前提，沒有覆蓋 T 不是 00:00 的週界。技術：boundary_value，邊界是週一 M 的日結時刻 T（兩側各一組交易：T 之前屬前一週、T 起屬新一週）；對照基準是同一機台同一查詢內的兩列，若系統改以日曆週一
