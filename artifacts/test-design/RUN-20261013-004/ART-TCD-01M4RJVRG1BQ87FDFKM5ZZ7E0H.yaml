    title: 日結執行當下持續有交易進來（機台 A 開分→出金、機台 B 開分→洗分交錯送出）：每筆交易只計入一個營業日，D／D+1 兩列的開分、收據、未兌現、洗分、待核實洗分各只計一次，且各機台 D 列期末餘額＝D+1 列期初餘額
    description: 驗證日結時刻前後持續送入開分、出金、洗分時，營業日歸屬不漏不重，且相鄰營業日的餘額銜接（RUN-20261012-007 T3RR RF-12；iteration 2 依二次抽查 RF-02 由只送開分擴充為交錯送出開分→出金與開分→洗分）。不使用注單（注單跨場次切換點的歸屬為
