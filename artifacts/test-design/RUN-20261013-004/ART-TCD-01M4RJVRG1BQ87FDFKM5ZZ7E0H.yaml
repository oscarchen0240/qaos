    - 已以管理員登入後台（所選機台場館須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至該機台場館站台（自行從環境中選定一個機台場館）
    - 進入 各式報表 > 場館日結報表
    - 測試場館的日結時間 T 不是 00:00，且比 00:00 晚至少 30 分鐘（例如 06:00），讓『週一 00:00 ～ T』有足夠的現場操作時間。營業日依場館的日結時間 T（UTC+0，場館設定欄位，第 152 行）切分：自某日
      T 起至次日 T 前的交易屬同一營業日，營業日以起算日期標示（AC-DAILYREPORT-0071／0072：T=06:00 時，9/5 05:59 的交易計入 9/4，9/5 06:00 的交易計入 9/5）。結算日期欄與列表上的日期皆為營業日；測試人員位於非
      UTC 時區時，須先依 T 把營業日換算成 UTC+0 的時間範圍，避免差一天
    - T 的設定在造數之前就已完成，造數到查詢結束期間不得修改（變更 T 對既有營業日的影響 v0.3 未定義，不在本案範圍）
    - 令 M 為某個週一（UTC+0 日曆日）。X1 類交易發生在 M 的 00:00:00 ～ T-1 秒之間（屬於 M 前一日的週日營業日，即前一週）；X2 類交易發生在 M 的 T 起（屬於週一營業日，即新的一週）。若在現場操作，需排在
      M 當天 UTC+0 的 00:00 ～ T 之間完成 X1 類交易，並在 T 之後完成 X2 類交易；若環境有可指定交易時間的造數工具，則直接指定
    - 機台 A 為自行從環境中選定的既有機台帳號（會員編號），屬於上述場館；A 在 M-7 ～ M 的營業日（以營業日標示）內沒有下列四筆以外的開分、出金；造數前 A 的機台餘額為 0
    - X1 類：開分 100，隨後出金（出金清空餘額，收據面額＝100，維持待核實）；X2 類：開分 200，隨後出金（收據面額 200，維持待核實）。（造數方式為我的推測，需環境負責人確認）本規格未定義如何造出指定時間的開分／出金交易與收據，也沒有後台入口可直接建立出金；我推測出金（收據）由機台端產生、核實與作廢在『帳務管理
      > 洗分出金核實』執行（第 111 行），因此造數由環境負責人以環境既有的機台操作或造數工具完成。出金一律清空餘額（第 128 行），故一張收據的面額＝出金當下機台的餘額（AC-DAILYREPORT-0104：機台餘額帶小數 →
      收據面額帶小數）；各筆實際交易時間以『機台交易紀錄』為準（欄位名稱以畫面為準）
    - 整個測試不對這兩張收據做核實或作廢（本案只看開分與待核實收據）
