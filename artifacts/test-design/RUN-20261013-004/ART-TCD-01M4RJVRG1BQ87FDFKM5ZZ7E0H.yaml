    title: 操作員在匯出 CSV 的請求中把站台／場館參數改成非自身場館：後端拒絕，不回傳含非自身場館資料的檔案
    description: 補上操作員匯出 API 的越權案例（既有 TC-DAILYREPORT-004 只驗證查詢 API；RUN-20261012-007 T3RR RF-15）。
    requirement_ids:
    - REQ-DAILYREPORT-001
