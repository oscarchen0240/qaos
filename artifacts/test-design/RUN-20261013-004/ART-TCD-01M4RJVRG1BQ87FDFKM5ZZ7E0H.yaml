      quote: 當日出金的收據中，已作廢者的金額合計；以出收據的日期歸屬，不論作廢是哪一天（2026-10-05 新增）
    design_rationale: 依據：第 53 行（未兌現以出收據日歸屬，CLR-DAILYREPORT-015 已裁決以此為準）、第 52 行（已兌現以收據日歸屬）、第 54 行（已作廢以收據日歸屬、不論作廢哪一天）、第 42／152
      行（營業日依日結時間切分）；AC-0071／0072（交易在 T 前 1 秒計入前一營業日、T 整點計入當日）、AC-0115／0116／0271。T3RR RF-02 指出：既有 TC-021／022 只用開分驗證 T 兩側，沒有任何案例驗證收據落在切分點時這三欄記到哪一列，且
      T 不是 00:00 時『出收據那天』若以 UTC+0 日曆日解讀會與營業日不同。技術：boundary_value，邊界是 spec 定義的日結時刻 T（AC-0071／0072 的 T 前／T 整點）；2 個狀態（作廢／核實）×
      2 側（T 前／T 起）各一張，面額互異，不是條件組合矩陣的 decision_table。資料設計：作廢／核實的動作日期刻意與收據日不同（建議 D 的下一個營業日執行），歸屬錯誤時結果可區分；限定 A 在 D-1、D 無其他出金，避免干擾（負面事實的對照基準＝同一條件下作廢／核實前後各查一次）。我的推測與需確認事項：(1)『出收據的日期』＝出金交易時刻所屬營業日是由第
      51、54、42、70 行與 AC-0071／0072 的勾稽推得（第 51 行收據金額＝當日出金總額、第 70 行『當日』＝營業日、第 54 行三欄之和須等於收據金額而採同一歸屬），非 spec 逐字；(2) 造數與取得交易時間的方式（造數工具或現場操作、『機台交易紀錄』有交易時間欄）為我的推測，需環境負責人確認；(3)
      刻意不修改 T（RF-01 變更 T 的效果 spec 未定義，不依賴）；(4) 與 REQ-CASHOUT-032 的『出收據那天』是否同為營業日未知，本案不斷言洗分出金核實頁的呈現。
    source_ref: T3RR:RUN-20261012-007 RF-02
