      quote: 開分 ＋ 進鈔 － 已核實洗分 － 已兌現（不扣待核實洗分——尚未確認付出；作廢的收據未付現，亦不扣）
    design_rationale: 依據：第 54 行『每列 收據金額 ＝ 已兌現金額 ＋ 未兌現金額 ＋ 已作廢金額』、第 51 行與變更記錄 v02『收據金額一律以面額計（含小數）』、第 62 行（總計為整個查詢結果的各欄合計、匯出
      CSV 同範圍）；AC-0104（399.60 不取整）、AC-0272（三欄與收據的勾稽）、AC-0161／0162。T3RR RF-04 指出：含小數只用單筆 399.60 驗證過，多張小數收據同列加總、進入總計列與 CSV 時有無浮點尾數、恆等式是否精確沒有案例。技術：requirement_based——這是同一規則（恆等式與合計）套在含小數資料上的一般案例，沒有
      spec 定義的數值邊界，也沒有條件組合矩陣，所以不標 boundary_value／decision_table。資料設計：同一欄內出現 0.10＋0.20（浮點易出尾數）、再與 399.65 同列相加，是我為了讓浮點誤差可被觀察而選的，不是
      spec 規則。顯示位數 spec 未定義，已在前提註明不作判準，只比較數值是否精確與彼此一致。iteration 2 增補（二次抽查 RF-01）：造數加入開分，補驗第 55 行『現金淨收＝開分＋進鈔－已核實洗分－已兌現』在已兌現帶小數（0.30）時是否精確、無浮點尾數；該公式的各項取自同一列顯示值或造數記錄，沒有新增
      spec 外的規則；本案造數不含洗分與進鈔，使預期值只剩開分－已兌現（待核實洗分本來就不扣）。我的推測與需確認事項：(1) 造出餘額恰為 0.10、0.20、399.65 的方式，以及開分後餘額如何降到收據面額（出金清空餘額，面額＝出金當下餘額；經遊戲損益或洗分皆有可能，spec
      未定義）；(2) D 場館除 A、B 外無其他出金；(3) 核實／作廢的角色與按鈕名稱以畫面為準。
    source_ref: T3RR:RUN-20261012-007 RF-04
