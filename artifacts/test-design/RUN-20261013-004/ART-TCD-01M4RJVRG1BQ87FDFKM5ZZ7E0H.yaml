      action: 迴圈結束後，逐一檢視 q_*.json（查詢回應）與 e_*.csv（匯出檔）：對每個成功取得的檔案檢查 (a) 每個營業日列的 收據金額＝已兌現＋未兌現＋已作廢；(b) 每列的收據金額等於 600／1500／2400／3300（全程不變）；(c)
        總計列的收據、已兌現、未兌現、已作廢四欄各自等於 4 個營業日列的對應欄之和；(d) 每列 現金淨收＝開分＋進鈔－已核實洗分－已兌現（四項皆取自同一份回應或同一份 CSV 的同一列），總計列的開分與現金淨收各自等於 4 列之和，且每列的開分、進鈔、已核實洗分在全部成功回應中不變。另挑出『未兌現』總計介於
        0 與 7800 之間的檔案，確認這類中途狀態的檔案確實存在
      expected: 每個成功取得的查詢回應與 CSV 檔都同時滿足 (a)(b)(c)(d)，沒有任何一個檔案出現列與列、或列與總計列對不起來的數值。若沒有任何中途狀態的檔案（所有回應不是全 7800 未兌現，就是已全部處理完），代表沒有真正碰到並行，本次執行無效，增加收據張數或加快重放後重做，不得判通過（若因被限流而取得的成功回應太少，同樣視為無效，改用較低頻率重放後重做，不判報表
        FAIL）
    - n: 5
      action: 迴圈與核實／作廢都結束後，以相同條件重新查詢一次，並再匯出一次 CSV
      expected: D1～D4 列依序：已兌現 400／500／1600／1100、已作廢 200／1000／800／2200、未兌現全為 0，收據金額 600／1500／2400／3300；總計列：已兌現 3600、已作廢 4200、未兌現
        0、收據 7800；CSV 與畫面一致；每列 現金淨收＝開分＋進鈔－已核實洗分－已兌現，且相對起始值，各列現金淨收的減少量恰等於該列已兌現金額（D1～D4 依序 400／500／1600／1100），總計列現金淨收減少 3600
    expected_result: 核實與作廢進行期間重放的每一次查詢回應與每一份匯出 CSV 都是自洽的：每列 收據金額＝已兌現＋未兌現＋已作廢，且收據金額不因核實／作廢而改變（600／1500／2400／3300），每列 現金淨收＝開分＋進鈔－已核實洗分－已兌現（同一份回應內的值，不會出現已兌現已增加而現金淨收還沒扣），總計列各金額欄等於各列對應欄之和（CSV
      的總計列同）；全部處理完後的最終查詢與 CSV 顯示：已兌現 3600、已作廢 4200、未兌現 0、收據 7800（各營業日數值見 test_data），各列現金淨收相對起始值的減少量等於該列已兌現金額。以上只判定成功取得的回應與檔案。（原文：第
      54 行恆等式、第 62 行總計為整個查詢結果各欄合計；推論部分：『單次回應內自洽』是把這些以靜態數據陳述的規則套用到併發情境，spec 沒有明文談併發或快照語意。）
