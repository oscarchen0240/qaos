      quote: 當日出金的收據中，截至查詢當下仍為待核實者的金額合計；以出收據的日期歸屬（2026-10-05 定案，原為「截至查詢當下全部待核實收據的累計」）
    design_rationale: 依據：第 68 行（相鄰列前後相接，較早一期期末＝次一期期初）、第 42／152 行（營業日依日結時間切分）、第 46、47、49、51、53 行（開分、洗分、待核實洗分、收據、未兌現的定義）、AC-0071／0072（T
      前歸前一營業日、T 整點歸當日）、AC-0201、AC-0101、AC-0111、AC-0116。T3RR RF-12 指出現有案例都在日結前後的靜止狀態下查詢；二次抽查 RF-02 指出只送『開分』是最單純的一種，出金（兩階段）與洗分（牽涉待核實洗分）在日結當下最容易出錯，因此流量改為機台
      A 交錯『開分→出金』、機台 B 交錯『開分→洗分』，橫跨 T0。iteration 4 修訂（回應 Validator 對本案的 major：unsupported_assumption）：iteration 2 假設『出金以扣分完成的紀錄時間歸屬』，但
      v0.3 只定義『交易發生』依日結時間歸營業日，沒有出金兩階段跨 T0 時的歸屬時刻，兩階段金流定義在開發包③、不在派發包範圍內，環境負責人也無法裁決 spec 語意。改為條件判定：以機台交易紀錄把出金分成 D 側、D+1 側、跨
      T0 三類；只對同側出金逐日斷言收據與未兌現，跨 T0 出金只斷言恰計入其中一列（不重不漏：兩日增量合計＝100×出金總筆數），並記錄實際落在哪一列、不作判準。開分、洗分是單一交易，逐日斷言維持；D 期末＝D+1 期初與兩日合計不漏不重，也與出金歸屬規則無關，維持。技術：boundary_value，邊界是日結時刻
      T0，交易流橫跨 T0 兩側；報表預期值由紀錄計數推算，因此 A、B 在 D+1 不得有本案以外的交易，D 用步驟 1 的基準。不涉及注單（注單跨場次切換點的歸屬已有 BUG-DAILYREPORT-004，不斷言），不涉及逾時結束場次（CLR-DAILYREPORT-017
      仍 OPEN，不依賴）：要求 D 與 D+1 無逾時結束場次、A、B 起始分數為 0。日結強制結束進行中場次並轉出餘額（第 151 行）是背景，本案不斷言場次狀態與場次數。我的推測與需確認事項：(1) 送出開分、出金、洗分的機台模擬器與迴圈指令由環境提供（spec
      未定義）；(2)『機台交易紀錄』的交易時間與報表分日使用同一時間，且可看出出金各階段的時間，是我的推測，需環境負責人確認；若紀錄只有單一時間則沒有跨 T0 出金；(3) 出金後餘額清空、洗分 100 後餘額為 0 是依第 128 行與洗分定義的推論；(4)
      本案不核實／作廢，故洗分全為待核實、收據全為未兌現，只為讓預期值簡單，不是 spec 規則。
