    preconditions:
    - 已以管理員登入後台（所選機台場館須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至該機台場館站台（自行從環境中選定一個機台場館）
    - 進入 各式報表 > 場館日結報表
    - 營業日依場館的日結時間 T（UTC+0，場館設定欄位，第 152 行）切分：自某日 T 起至次日 T 前的交易屬同一營業日，營業日以起算日期標示（AC-DAILYREPORT-0071／0072：T=06:00 時，9/5 05:59
      的交易計入 9/4，9/5 06:00 的交易計入 9/5）。結算日期欄與列表上的日期皆為營業日；測試人員位於非 UTC 時區時，須先依 T 把營業日換算成 UTC+0 的時間範圍，避免差一天
    - T 的設定在造數之前就已完成，造數到查詢結束期間不得修改（變更 T 對既有營業日的影響 v0.3 未定義，不在本案範圍）。本案在 T0（造數當天的日結時刻）前後現場執行，需提前安排時間；T 可以是任何時刻（含 00:00）。令 D
      為 T0 之前的營業日（造數當天 T0 之前正在進行的營業日），D+1 為自 T0 起的營業日
    - 機台 A、機台 B 為自行從環境中選定的兩台不同的既有機台帳號（會員編號），屬於上述場館。A、B 在 D 與 D+1 都沒有逾時結束的場次，且流量開始前 A、B 的分數為 0（若有留存分數，先各做一次出金清空，出金一律清空餘額，第
      128 行），以免分數來自逾時結束場次的餘分——該情況下『相鄰列前後相接』是否成立未定義（CLR-DAILYREPORT-017 未決，不依賴）。A、B 在 D+1 沒有本案送出的交易以外的任何交易；D 的各欄基準值於步驟 1 另行記錄。（造數方式為我的推測，需環境負責人確認）本規格未定義如何造出指定時間的交易，也沒有後台入口可直接建立出金；我推測交易由機台端產生，因此由環境負責人以環境既有的機台操作、模擬器或造數工具完成。出金一律清空餘額（第
      128 行），故收據面額＝出金當下機台的餘額
    - 送出交易的方式：由環境負責人提供可對指定機台送出『開分 100』『出金』『洗分』的機台模擬器或測試腳本。機台 A 的循環為『開分 100 → 出金』（出金清空餘額，收據面額＝100），機台 B 的循環為『開分 100 → 洗分 100』（洗分後餘額為
      0）；本案不核實任何洗分，所以送出的洗分全數為待核實洗分，也不核實或作廢任何收據，所以收據全數為待核實（未兌現）。本 spec 沒有定義送出機制，下列迴圈中的〈…〉為環境提供的指令
    - 『機台交易紀錄』可查到每一筆開分、出金、洗分的交易時間（欄位名稱以畫面為準）。開分與洗分是單一交易，以該時間（早於 T0 或不早於 T0）判定所屬營業日（AC-0071／0072：交易時間早於 T 計入前一營業日，等於 T 計入當日營業日）。出金是兩階段交易，而
      v0.3 只規定『交易發生』依日結時間歸營業日，沒有規定出金兩階段跨過 T0 時以哪個時刻歸屬，所以本案不替它假設：以機台交易紀錄判斷每筆出金各階段的時間——兩階段都早於 T0 的稱『D 側出金』，都不早於 T0 的稱『D+1 側出金』，分落
      T0 兩側的稱『跨 T0 出金』（若紀錄只有一個時間，則沒有跨 T0 出金；紀錄是否分別記錄兩階段的時間，需環境負責人確認）。跨 T0 出金只斷言它恰好計入 D 或 D+1 其中一列，並記錄實際落在哪一列，不作判準。
    - 整個測試不對本案的洗分或收據做核實／作廢，也不送注單
