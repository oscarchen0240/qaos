      quote: 當日出金的收據中，已核實（核銷）者的金額合計；以出收據的日期歸屬，不論實際付現是哪一天（2026-10-05 定案）
    - type: spec
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.3'
      content_hash: 535d360df2afe72602ff397f6fcd1f329b9225472aaba13b798b95f590c3fc6d
      location: §列表欄位／已作廢金額（第 54 行）
      quote: 當日出金的收據中，已作廢者的金額合計；以出收據的日期歸屬，不論作廢是哪一天（2026-10-05 新增）
    design_rationale: 依據：第 50 行（進鈔金額＝當日入金總額）、第 51 行（收據金額＝當日出金總額）、第 52 行（已兌現以收據日歸屬）、第 53 行（未兌現為當日仍待核實收據的合計）、第 54 行（已作廢以收據日歸屬、收據金額含已作廢）；AC-0101、AC-0116、AC-0115、AC-0273。T3RR
      RF-13 指出：機台會以同一 TXID 重送完成回報，沒有任何案例驗證報表在重送之後仍只計入一次。iteration 1 修訂（回應 Validator 對本案的 major：unsupported_assumption）：移除『同一
      TXID 的重送不是新交易』前提，改為先查機台交易紀錄的 TXID 筆數，才斷言報表重送前後相同；多筆視為交易層問題、停止並回報。iteration 2 增補：(1) Validator minor——分支 (a) 的條件補上『A
      當日入金、出金紀錄總筆數』（第一段各為 1、第二段各為 3），避免重送被另記成新 TXID 時誤判報表；(2) 二次抽查 RF-03——補『收據已核實、已作廢之後完成回報才遲到』的第二段：最危險的情況是遲到的回報被上游當成新的一筆，使收據日那一列重新出現未兌現、收據金額加倍；沿用相同的
      TXID 筆數閘門。環境無法重送記為受阻。iteration 4 增補（Validator advisory）：分支 (a) 補上『重送後 R1 仍待核實、R2 仍為已核實、R3 仍為已作廢』的狀態確認；遲到的完成回報若把收據狀態改回待核實，報表依第
      53 行把它計入未兌現反而正確，真正的問題在交易層或核實層，故比照分支 (b) 停止回報、不判報表。技術：scenario（入金／出金 → 重送 → 查交易紀錄 → 再查詢的時序；再加 核實／作廢 → 遲到重送 → 查交易紀錄 →
      再查詢），test_types 含 negative（重複送出不得使報表金額異常加倍）；不標 error_guessing，因為重送是 T3RR 指出的真實情境，不是我猜的錯誤輸入。我的推測與需確認事項：(1) 重送工具與請求格式不在派發包範圍內，由環境負責人提供，沒有則本案受阻；(2)『機台交易紀錄』可看到
      TXID 與筆數、並能以日期和機台篩出入金／出金總筆數，是我的推測，需環境負責人確認；(3) 只比較重送前後的報表金額欄，不斷言重送的回應；(4) 第二段的核實／作廢帳號與按鈕名稱以畫面為準；(5) 不涉及注單數。
    source_ref: T3RR:RUN-20261012-007 RF-13
