    title: T 不是 00:00 的場館：日結時刻前後各出的收據，未兌現、已作廢、已兌現三欄都記在收據所屬營業日的列，不依作廢日或核實日
    description: 驗證日結時間 T 不是 00:00 時，出金收據落在 T 之前與 T 之後（兩個相鄰營業日）時，未兌現、已作廢、已兌現三欄各自歸屬的營業日（RUN-20261012-007 T3RR RF-02）。
    requirement_ids:
    - REQ-DAILYREPORT-007
    - REQ-DAILYREPORT-011
    - REQ-DAILYREPORT-027
    acceptance_criteria_ids:
