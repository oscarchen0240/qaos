    steps:
    - n: 1
      action: 在 T0 前至少 2 分鐘，以管理員登入並選好站台，開啟場館日結報表：統計維度『依機台明細』、統計週期『按日』、機台帳號留空、結算日期選 D ～ D，搜尋；記錄機台 A 與機台 B 在 D 列的『開分金額』『洗分金額』『待核實洗分』『收據金額』『未兌現金額』（基準值）
      expected: 取得基準值
    - n: 2
      action: 在 T0 前 30 秒開始，於終端機啟動：end=$((T0 的 epoch 秒 + 30)); while [ $(date +%s) -le $end ]; do 〈送出機台 A 開分 100〉; 〈送出機台 A
        出金〉; 〈送出機台 B 開分 100〉; 〈送出機台 B 洗分 100〉; sleep 1; done，持續到 T0 後 30 秒結束（約 60 輪）。送出期間不要對 A、B 做其他任何操作。被拒絕或逾時的請求只記錄；若某輪被拒絕，該輪不計入送出筆數，一切以步驟
        3 的機台交易紀錄為準
      expected: 迴圈期間送出的請求被接受；日結時刻 T0 在流量中途到達，可能剛好落在某輪的『開分』與『出金』（或『開分』與『洗分』）之間。記錄任何被拒絕或逾時的請求
    - n: 3
      action: 流量停止並等待日結完成後，到『機台交易紀錄』篩選機台 A、再篩選機台 B 在 T0-60 秒 ～ T0+60 秒內的紀錄：數出 A 的開分『早於 T0』與『不早於 T0』的筆數；逐筆檢視 A 的出金各階段的時間，分成
        D 側出金（nOd）、D+1 側出金（nOd1）、跨 T0 出金（nOx，兩階段時間分落 T0 兩側；紀錄只有單一時間時 nOx=0）三類；數出 B 的開分與洗分各自『早於 T0』與『不早於 T0』的筆數；並記錄各筆面額
      expected: 每筆開分、出金、洗分的面額都是 100；各類紀錄沒有重複的筆數（同一筆交易沒有出現兩筆紀錄）。若紀錄出現重複或面額不符，這是交易層的問題，記錄後停止本案並回報，不判定報表。記錄 nOd、nOd1、nOx
    - n: 4
      action: 重新查詢報表：統計維度『依機台明細』、統計週期『按日』、機台帳號留空、結算日期 D ～ D+1，搜尋。記錄機台 A 與機台 B 在 D 列與 D+1 列的『開分金額』『洗分金額』『待核實洗分』『收據金額』『未兌現金額』『期初餘額』『期末餘額』
      expected: 機台 A：D 列開分＝基準＋100×（早於 T0 的開分筆數）、D+1 列開分＝100×（不早於 T0 的開分筆數）。A 的收據與未兌現（每列兩者的增量相同）：D 列增量＝100×（nOd＋k）、D+1 列增量＝100×（nOd1＋nOx－k），k
