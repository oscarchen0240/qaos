    design_rationale: 依據：第 62 行（總計為整個查詢結果的各欄合計、匯出同範圍）、第 54 行（每列恆等式）、第 53／70 行（狀態以查詢當下為準）；AC-0162、AC-0272、AC-0273。T3RR RF-10
      指出：現有案例都是『先操作、再重新查詢』的循序流程，沒有驗證查詢／匯出執行當下有人核實或作廢時，單次回應是否自洽。技術：scenario（持續重放查詢／匯出 × 同時核實／作廢的時序情境），不是 decision_table。觸發方式（我設計，可執行）：session
      A 以複製為 cURL 的請求迴圈重放 60 輪，session B 同時逐張處理 12 張收據；斷言只用不變量（恆等式、收據金額不變、總計＝各列之和）與最終一致結果，不斷言任何中途數值，因為中途的混合狀態不可預測。步驟 4 要求確認有中途狀態的檔案，避免沒有真正並行卻誤判通過。我的推測與需確認事項：(1)
      請求是否可被 cURL 重放、檔案輸出格式；(2) 12 張收據的造數方式與核實／作廢的角色；(3) 被限流或拒絕的請求只記錄，不作判準（CLR-DAILYREPORT-019 OPEN）；(4) 選『依場館彙總』使 4 個營業日只有
      4 列（每頁 10 筆內，一次回應即含全部列），因此總計列可與各列直接加總；(5)『單次回應自洽』是把靜態規則套在併發情境的推論，spec 沒有明文，已寫入 expected_result。iteration 2 增補（二次抽查 RF-01）：現金淨收會隨核實即時減少（第
      55 行，已兌現以收據日歸屬、核實後過去營業日的現金淨收改變，AC-0124），若它與已兌現不是取自同一時點，會出現已兌現已增加、現金淨收還沒扣的不自洽；因此加 (d)，只比較同一份回應內各欄的關係，不斷言中途數值，且併發案例同樣只用成功取得的回應判定。開分/進鈔取自造數記錄，造數路徑的假設已於前提註明。未涵蓋：同一張收據的核實與作廢互搶（RF-11，需
      REQ-CASHOUT 側的 Clarification，依指示不補）。
