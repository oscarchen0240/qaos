      version: 1
    source_ref: CLR-DAILYREPORT-009
    design_rationale: 自 TC-DAILYREPORT-046 v1 修訂：v1 的 expected_result 明確寫『依假設：不受結算日期範圍限制』，該假設當初由 APR-0003 標記為 needs_human_confirmation=false（視為已確認），但
      CLR-DAILYREPORT-009的PM正式回覆推翻了這個假設——未兌現金額仍受結算日期範圍限制，只是不受統計週期切分本身影響（例：9/10未兌現200，結算範圍09-03~09-09時該筆不計入任何一列，結算範圍09-03~09-10時才計入09-07~09-10這一列）。改用『同一筆收據、兩種結算範圍前後對照』的equivalence_partitioning設計，直接對比範圍含/不含該筆收據時的差異，比原本單一情境的斷言更能驗證『範圍才是篩選依據』這個修正後的正確機制，同時保留PM提供的具體算例作為expected_result的精確依據，不再是需要needs_human_confirmation的假設。
