    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 進入 站台列表
    test_data: []
    steps:
    - n: 1
      action: 取一個線上類型站台，檢視其可用操作
    - n: 2
      action: 取一個機台類型站台，檢視其可用操作
    - n: 3
      action: 在兩者的編輯畫面檢視可切換的狀態選項
    expected_result: 兩種類型（線上／機台）皆不提供刪除操作／按鈕；可用的狀態操作僅有暫停或關閉（停用）。（原因：刪除站台會影響站台樹狀結構——子站台歸屬與上下層關係——故 PM／後端定案不提供刪除功能，見 CLR-SITELIST-009）
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §操作/刪除站台（此節內容已由 CLR-SITELIST-009 確認為錯誤敘述，非現行產品行為）
      quote: 點擊列表「刪除」後顯示確認彈窗，列出站台名稱與代碼，二次確認後執行（＊此流程不存在於現行產品，見 CLR-SITELIST-009 PM 回覆）
