  - draft_id: TC-DRAFT-01M2R6JHSDC2MH8F0DEN9EPKXQ
    title: 玩家同時持有系統幣別與多個非系統幣別餘額時，一般紅利仍正確發到系統幣別，不會誤發到餘額較高或最近使用的其他幣別錢包
    product: ba-admin
    functional_area: BONUSCCY
    requirement_ids:
    - REQ-BONUSCCY-006
    acceptance_criteria_ids:
    - AC-BONUSCCY-008
    spec_id: SPEC-BONUSCCY-002
    spec_version: '1.0'
    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一名既有會員，其同時持有系統幣別（USDT）與至少兩種非系統幣別（例如 TTK、另一已啟用幣別）的正數餘額；其中某個非系統幣別的餘額刻意高於系統幣別餘額，且該會員最近一次下注/存款用的是非系統幣別（非 USDT）
    test_data: []
    steps:
    - n: 1
      action: 於後台會員詳細資料頁展開多幣別餘額檢視，記錄該會員此刻所有已啟用幣別錢包的餘額
    - n: 2
      action: 等待或確認該會員產生一筆返水或代理佣金並已結算入帳
    - n: 3
      action: 重新查看多幣別餘額檢視，比對每個幣別錢包的變動
    expected_result: 只有系統幣別（USDT）錢包的餘額增加，其餘幣別錢包（含餘額較高、或最近下注/存款所用的那個非系統幣別）餘額不變；系統不會因為玩家『最近使用』或『餘額較高』的幣別是其他幣別，就誤把紅利發到那個幣別錢包
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-002
      spec_version: '1.0'
      location: §一句話
      quote: 玩家拿哪個錢包下注、用什麼幣別存款，都不影響紅利發出來的幣別
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 這是本規則錯發幣別風險最高的情境：多個幣別錢包同時有餘額時，若實作是『發到玩家最近使用或餘額最高的錢包』而非『固定發到系統幣別』，黑箱功能測試在單一幣別情境（TC1/TC2）下測不出來，只有在多幣別同時有餘額時才會暴露；這是
      error_guessing，針對『系統可能選錯錢包』這個合理懷疑設計，不是硬湊案例——REQ-BONUSCCY-006 為 high risk 且 rejection_contract.defined=true，此為 requirement_based
      之外唯一能覆蓋 high risk 要求的 non-happy 案例
