    title: 玩家用非系統幣別下注時，返水仍發放進站台系統幣別錢包
    product: ba-admin
    functional_area: BONUSCCY
    requirement_ids:
    - REQ-BONUSCCY-006
    acceptance_criteria_ids:
    - AC-BONUSCCY-008
    spec_id: SPEC-BONUSCCY-002
    spec_version: '1.0'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 選定一個已啟用兩種以上幣別的線上站台（系統幣別例如 USDT，另啟用至少一種非系統幣別例如 TTK）
    - 選定一名該站台既有會員，其近期已使用 TTK 餘額下注並已產生一筆返水（自行從環境中挑選，或於前台以 TTK 餘額完成下注等待返水結算週期產生）
    test_data: []
    steps:
    - n: 1
      action: 於後台『會員列表』查詢該會員，進入會員詳細資料頁，展開帳務資訊的『帳戶餘額（主錢包）』多幣別檢視，記錄目前系統幣別（USDT）與 TTK 兩個錢包的餘額
    - n: 2
      action: 確認該會員這筆返水已結算入帳後，重新查看同一組多幣別餘額
    expected_result: 返水入帳後，增加的金額出現在系統幣別（USDT）錢包那一列，TTK 錢包餘額不因這筆返水而變動；即使玩家下注用的是 TTK 餘額，返水依然發放進系統幣別錢包，不受下注/存款所用幣別影響
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-002
      spec_version: '1.0'
      location: §一句話 + §每一種紅利發什麼幣別
      quote: 除了「彩金活動」與「遊戲商JACKPOT／促銷派彩」，其他紅利一律發「站台系統幣別」。玩家拿哪個錢包下注、用什麼幣別存款，都不影響紅利發出來的幣別。｜返水：站台系統幣別
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: AC-BONUSCCY-008 直接以返水為例；多幣別餘額展開檢視的操作方式依 SPEC-MEMBER-001 v0.2 §2.1.6（會員詳細資料頁帳務資訊可展開逐列查看各幣別錢包），本条只驗『發到哪個錢包』這個
      spec 明確定義的斷言，返水本身如何被觸發（結算週期）不在 BONUSCCY-002 定義範圍內，測試執行時以既有已產生返水的會員或等待一次自然結算週期為準
