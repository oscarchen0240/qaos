    title: 彩金活動指定非系統幣別發放時，正確送進玩家對應幣別錢包，不是系統幣別
    product: ba-admin
    functional_area: BONUSCCY
    requirement_ids:
    - REQ-BONUSCCY-007
    acceptance_criteria_ids:
    - AC-BONUSCCY-009
    spec_id: SPEC-BONUSCCY-002
    spec_version: '1.0'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: medium
    risk: medium
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 站台已啟用系統幣別以外的至少一種幣別（例如 TTK）
    - 透過後台『優惠活動管理』（或對應的彩金活動建立功能）建立一個彩金活動，發放幣別欄位指定為 TTK（系統幣別以外）
    - 選定一名符合該彩金活動條件、且原已持有 TTK 錢包（餘額可為 0）的既有會員
    test_data: []
    steps:
    - n: 1
      action: 於後台會員詳細資料頁展開多幣別餘額檢視，記錄該會員目前 TTK 與系統幣別（USDT）錢包的餘額
    - n: 2
      action: 使該會員符合彩金活動的發放條件，確認彩金已發放入帳
    - n: 3
      action: 重新查看多幣別餘額檢視，比對 TTK 與系統幣別錢包的變動
    expected_result: 彩金金額進入 TTK 錢包（後台建活動時指定的幣別），系統幣別（USDT）錢包不因這筆彩金而變動——彩金活動是全站唯一可以自己選發放幣別的紅利類型，不受系統幣別限制
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-002
      spec_version: '1.0'
      location: §每一種紅利發什麼幣別
      quote: 彩金活動｜後台建活動時自己填的幣別｜全站唯一可以自己選發放幣別的紅利｜2026-09-02 與 PM 確認：彩金依後台建活動時選的幣別，送進玩家對應幣別的錢包
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: BONUSCCY-002 本身未涵蓋彩金活動建立的完整後台操作流程（欄位、頁面路徑），目前可讀到的其他 spec 也沒有專門文件描述；precondition 中『優惠活動管理』這個模組名稱依 SPEC-PLATFORMRULE-001
      §機台場館的後台選單所列的線上站台後台選單項目推得，實際建立彩金活動的詳細欄位需由執行者對照當下後台介面操作，不影響本條 expected_result 的斷言本身（該斷言逐字依據 spec 原文與 2026-09-02 PM 確認記錄）。另，AC-BONUSCCY-009
      提到『玩家原本沒有該幣別錢包時會自動出現一列』，依 SPEC-MEMBER-001 v0.2 §2.1.6，已在站台層級啟用的幣別即使玩家餘額為 0 也會在多幣別展開檢視中列出一列顯示 0.00（不因無餘額而隱藏），故『錢包原本沒有該幣別的一列，中獎後才新增』這件事在本後台
      UI 上不是一個可獨立觀察的離散事件——只要 TTK 是站台已啟用幣別，該列在彩金發放前就已存在並顯示 0.00；本 TC 因此只驗證『金額進對錢包』這個可觀察斷言，不另立一條驗證『新增一列』的 TC，避免設計一條在目前 UI 慣例下無法真正驗到差異的假案例
