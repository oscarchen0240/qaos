  - requirement_id: REQ-BONUSCCY-007
    reason: 'AC_PARTIALLY_COVERED: AC-BONUSCCY-009「玩家原本沒有該幣別錢包時會自動出現一列」這半句斷言未另立TC。依SPEC-MEMBER-001 v0.2§2.1.6第290行「金額為0的幣別仍列出並顯示0.00，不因無餘額而隱藏」，已在站台層級啟用的幣別即使玩家餘額為0也會在多幣別展開檢視中列出一列並顯示0.00，故「錢包原本沒有該幣別的一列、中獎後才新增」這件事在本後台UI上不是一個可獨立觀察的離散事件——只要TTK是站台已啟用幣別，該列在彩金發放前就已存在並顯示0.00。TC-DRAFT-01M2R6JHSDEMW4M0KGRGSED1WW已驗證AC-BONUSCCY-009另一半「金額進對錢包」的可觀察斷言，本判斷已由本輪獨立Validator查證SPEC-MEMBER-001原文屬實。'
  - requirement_id: REQ-BONUSCCY-006
    reason: 'AC_PARTIALLY_COVERED: 累積存款活動（REQ-BONUSCCY-006 statement列舉的第六種紅利類型）未另立TC。spec.md對累積存款活動僅列『站台系統幣別』，未像簽到/首存次存那樣附加⚠️特別警示，與返水、代理佣金同屬『無特殊陷阱、單純依規則發系統幣別』的一般情境，AC-BONUSCCY-008已用『返水或代理佣金等一般紅利』（『等』字概括同構情境）的等價類推理涵蓋此類無特殊風險的紅利類型，並由現有TC1/TC2（返水、代理佣金）與TC3（多幣別餘額同時存在的error_guessing案例）共同驗證『系統幣別優先於下注/持有幣別』這個核心機制在不同計算基礎、不同餘額情境下皆成立。已由本輪獨立Validator確認此推理方式合理，不需為累積存款活動額外複製一條相同斷言的TC。'
  - requirement_id: REQ-BONUSCCY-006
    reason: 'AC_PARTIALLY_COVERED: 推薦獎勵（REQ-BONUSCCY-006 statement列舉的第三種紅利類型）未在REQ-BONUSCCY-006底下另立TC。獨立Validator第二輪曾將此列為缺口，經查證：推薦獎勵、推薦註冊金實際上是REQ-BONUSCCY-009（推薦獎勵、推薦註冊金專屬需求）的定義範圍，已有專屬TC（『跨站台推薦時，推薦註冊金依收款人所屬站台的系統幣別發放』，requirement_id掛REQ-BONUSCCY-009）驗證此斷言，只是TC掛的requirement_id是REQ-009而非REQ-006。這是RequirementModel本身REQ-006
      statement與REQ-009重複列舉推薦獎勵這一項造成的表面缺口，不是真正未被驗證的設計缺口，故不需為REQ-006額外複製一條相同斷言的TC。'
