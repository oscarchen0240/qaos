    - 以 Admin 登入後台
    - 選定一個僅啟用單一幣別的既有機台場館（TWD 唯一頁籤）作為『1 種幣別』對照組
    - 另選定一個已啟用兩種以上幣別的既有線上站台作為『2 種以上』對照組
    test_data: []
    steps:
    - n: 1
      action: 切換至機台場館，進入『會員與加盟商 > 會員列表』，檢視任一機台帳號的『帳戶餘額（主錢包）』欄，確認是否有展開箭頭
    - n: 2
      action: 切換至已啟用兩種以上幣別的線上站台，檢視任一會員的『帳戶餘額（主錢包）』欄，確認是否有展開箭頭
    expected_result: 步驟1（僅啟用 1 種幣別）欄位不出現展開箭頭，維持單行呈現；步驟2（已啟用 2 種以上幣別）欄位出現展開箭頭——驗證『已啟用幣種超過一種』這個門檻恰好落在 1 與 2 之間
    expected_result_spec_reference:
      spec_id: SPEC-UPDATEPACK-001
      spec_version: '0.1'
      location: §一、多幣別錢包展開顯示
      quote: 展開箭頭顯示條件 | 已啟用幣種超過一種時才顯示展開箭頭；僅啟用一種幣別的站台不顯示箭頭，維持單行呈現
    assumptions:
    - text: 機台場館（TWD唯一頁籤、僅啟用單一幣別）作為『1種幣別』對照組，此業務規則本身直接引自spec『機台場館的情形』小節，非自行推測；但目前測試環境中是否已存在一個可操作的機台場館測試站台，需環境負責人協助確認。若環境當下無此類站台，可暫以站台列表新建一個機台類型場館站台替代，或標記本案待執行
      requirement_id: REQ-UPDATEPACK-002
      needs_human_confirmation: true
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: '『超過一種』是一個明確的數量門檻（1 對 2），本案以兩個既有站台分別代表門檻兩側的真實案例做對照，而非在單一站台上臨時切換啟用幣種數（避免混入切換過程中的其他副作用），屬邊界值分析而非一般案例；機台場館僅單一幣別的事實直接引自
      spec『機台場館的情形』小節，非自行推測


      【交叉比對前修正】獨立Validator第一輪指出本TC依賴『既有機台場館測試站台』這個環境事實，卻未像TC1/TC5那樣附加應變條款或用assumptions標註，可能導致環境無此類站台時無法執行。已補上assumptions揭露此環境依賴。'
