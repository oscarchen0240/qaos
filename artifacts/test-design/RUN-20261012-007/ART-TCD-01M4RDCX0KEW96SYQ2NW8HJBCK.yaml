      quote: 比照操作員：管理員或站長查詢、匯出管轄範圍外的場館（含直接呼叫 API 帶範圍外場館參數）時，前端不提供範圍外場館選項，後端拒絕並回傳「無權限」錯誤、資料不變
    hotfix_eligible: false
    execution_cost: medium
    design_rationale: 分層說明依據：(1) 選單只含管轄範圍＝spec 第 25 行權限表（『管轄範圍』）加 AC 的 then；(2) 越權時後端回「無權限」錯誤、資料不變＝CLR-DAILYREPORT-014 的回答（針對
      v0.2，v0.3 本文未載；Oscar 2026-10-12 已以 applicability 綁定到 v0.3，派發包決議快照可見），並非 v0.3 spec 原文——所以 expected_result_spec_reference
      引用的權限表只支撐 (1)，(2) 的依據在 source_refs 的 clarification。AC 的 then 只管前端選單，後端拒絕不在 AC 內，這是我刻意超出 AC then 的部分（CIR new_required
      指示以 CLR-014 為來源補管理員／站長越權的負向 TC），已明示。不斷言錯誤代碼：CLR-014 明說代碼由後端定義、尚未定案。既有 TC-DAILYREPORT-103／104 當時刻意不斷言反應形式，本案補上它們缺的部分，不取代它們（CIR
      判 unaffected）。技術標 security_rule、test_types 含 negative／security：這是權限邊界（管轄範圍內／外）的越權拒絕；CLR-014 的『資料不變』對唯讀查詢沒有可另外觀察的狀態變化，故只以『不回傳範圍外資料』判定。本案只用管理員，是
      spec 權限表授權使用本報表的角色之一；操作員的越權反應（CLR-DAILYREPORT-001）不在本次 new_required 範圍，未涵蓋。
