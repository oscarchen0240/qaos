      expected: 同樣為「無權限」錯誤，不回傳含範圍外場館資料的檔案或內容
    - n: 7
      action: （對照）以原本範圍內的參數值重送查詢請求
      expected: 同一請求在範圍內可正常取得資料，排除請求格式錯誤造成的假拒絕
    expected_result: (1) 站台切換選單只提供其自身及子站台管轄範圍內的站台，管轄範圍外的場館不出現在選單中（AC-DAILYREPORT-0012）；(2) 將查詢請求與匯出請求的站台／場館參數改為管轄範圍外的場館時，後端拒絕並回傳「無權限」錯誤（依
