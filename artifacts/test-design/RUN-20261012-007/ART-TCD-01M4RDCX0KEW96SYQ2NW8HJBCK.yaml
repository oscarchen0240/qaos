    stability: unknown
    source: change_workflow
    assumptions: *id001
    draft_id: TC-DRAFT-01M4RDF4MZEKSQZBWG1EE43A3M
    title: 過去營業日的現金淨收隨其收據之後被核實而改變：核實後收據日那一列的現金淨收減少該筆面額，核實當天那一列不變
    requirement_ids:
    - REQ-DAILYREPORT-012
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0124
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - scenario
    priority: high
    risk: high
    preconditions:
    - 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
    - 進入 各式報表 > 場館日結報表
    - 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
      UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
    - （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
      AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
    - 機台 A 為自行從環境中選定的既有機台帳號（會員編號），須在該管理員管轄範圍內的機台場館；需要第二台機台時另選一台不同的既有機台帳號
    - 收據 R 為機台 A 的一筆出金收據（面額 F，截至目前仍待核實），其出收據的營業日 D 比目前營業日（今天所屬的營業日，依 T 判定）至少早一個營業日（AC 範例：9/10 出收據、9/12 核實，核實日 ≠ 收據日）；機台 A
      在目前營業日沒有其他會改變現金淨收的新交易（找一台沒人在玩的測試機台），整個測試須在同一個營業日內完成，不要跨過日結時刻
    - 有權限在『帳務管理 > 洗分出金核實』核實出金的後台帳號（核實的角色權限不在本 spec，請環境負責人提供；本案不驗證權限）
    - 核實與作廢可能無法復原（本 spec 未說明復原方式，請視為不可復原），且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行；本案使用的收據不得與其他 TC（含 TC-CASHOUT-132～134）共用，測試期間也不要對同一機台帳號做其他核實、作廢或新增出金
    - 【環境前提，spec 未定義】核實／作廢後報表金額何時更新（即時或排程）：若重新查詢仍是舊值，請記錄實際的更新方式與等待時間後再讀取，不要直接判定 PASS／FAIL
    test_data:
    - name: 收據面額 F
      value: 自選待核實出金的面額
      note: AC 範例 1000
    - name: 預期
      value: N1＝N0－F；M1＝M0
    steps:
    - n: 1
      action: 到後台『帳務管理 > 洗分出金核實』，找出機台 A 在 D 的那筆待核實出金（篩選方式以畫面為準），記下訂單編號、面額 F 與其出收據日 D
      expected: 取得收據資訊；該筆為待核實
    - n: 2
      action: 開啟場館日結報表（各式報表 > 場館日結報表），統計維度「依機台明細」、統計週期「按日」、機台帳號填機台 A、結算日期設為 D～目前營業日，搜尋；記錄 D 列的「開分金額」「進鈔金額」「已核實洗分」「已兌現金額」「現金淨收」（記為
        N0），以及目前營業日列的「現金淨收」（記為 M0）
      expected: D 列現金淨收 N0＝開分＋進鈔－已核實洗分－已兌現；此時 R 尚未核實，其面額不在已兌現內
    - n: 3
      action: 回到洗分出金核實頁，對該筆出金執行核實，依畫面流程確認（按鈕名稱與確認步驟以畫面為準）
      expected: 該筆標記為已核實
    - n: 4
      action: 回到場館日結報表，以相同條件重新查詢；記錄 D 列的現金淨收（記為 N1）與目前營業日列的現金淨收（記為 M1）
    expected_result: 核實後：D 列現金淨收 N1＝N0－F（含之後才付現的收據金額，已兌現歸收據日 D）；目前營業日（核實當天）列的現金淨收 M1＝M0，不因這次核實而變動。（AC 範例：N0＝2000、F＝1000、N1＝1000。）
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.3'
      location: §列表欄位／現金淨收（第 55 行）
      quote: 因已兌現以收據日歸屬，現金淨收含之後才付現的收據金額，不等於當日實際的現金增減
    decision_refs:
    - requirement_id: REQ-DAILYREPORT-012
      question_id: Q02
      basis_ref:
        type: spec
        spec_id: SPEC-DAILYREPORT-001
        spec_version: '0.3'
        content_hash: 535d360df2afe72602ff397f6fcd1f329b9225472aaba13b798b95f590c3fc6d
        location: §列表欄位／現金淨收（第 55 行）
    source_refs:
    - type: spec
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.3'
      content_hash: 535d360df2afe72602ff397f6fcd1f329b9225472aaba13b798b95f590c3fc6d
      location: §列表欄位／現金淨收（第 55 行）
      quote: 因已兌現以收據日歸屬，現金淨收含之後才付現的收據金額，不等於當日實際的現金增減
    hotfix_eligible: false
    execution_cost: high
    design_rationale: 依據：spec 第 55 行『因已兌現以收據日歸屬，現金淨收含之後才付現的收據金額，不等於當日實際的現金增減』與 AC-0124 的 then。AC-0124 要求觀察『核實前、核實後』兩個時點，所以這條規則只能靠一次實際核實的前後對照才算驗證到效果（不能只查一次），據此用差值（N1＝N0－F、M1＝M0）而非
      AC 範例的絕對值，使它可以在任何既有收據上執行；核實當天列不變的對照基準是同一機台、同一查詢條件的 M0（因此要求當天沒有其他新交易）。技術標 scenario：這是『查詢→狀態改變（核實）→再查詢』的時序情境，不是單點驗證；不標
      state_transition，因為 RM 對 REQ-012 沒有定義狀態集合。我假設核實後報表會更新（即時或排程）但 spec 未定義，已用 PRE_TIMING 前提處理；核實可能不可復原，也是保守假設，已寫在前提。核實的角色權限不在本
      spec，需環境負責人提供有權限的帳號。與 TC-CASHOUT-133（核實後 D 日列未兌現扣減）視角不同：本案看現金淨收，不重複。
    source_ref: new_required:REQ-DAILYREPORT-012 AC-DAILYREPORT-0124
