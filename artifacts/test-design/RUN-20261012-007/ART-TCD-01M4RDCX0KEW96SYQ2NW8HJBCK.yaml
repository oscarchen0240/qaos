      9/4 100、9/8 300）。與 TC-045（新版）的分工：045 驗證『迄日邊界』（範圍外在迄日之後的收據不計入，按日／按週對照）；本案驗證『起日邊界』（起日移到 e1 隔天後 e1 被排除）與兩個週列各自歸屬，兩案不重複。技術標
      boundary_value：起日 09-05 恰為 e1 收據日 09-04 的隔天（日期範圍的 on/off 邊界）；v2 標 equivalence_partitioning／negative，本版步驟已改為對照邊界，故改標，不是為了湊分布。AC-0152
      的 given 只有 d1 300 與範圍外 200，本案資料不同（e1 100、e2 300）；引用 AC-0152 只取『範圍外收據不計入』這個語意，數字則依 AC-0155。『如何造出指定收據日的待核實出金』是我的推測（機台端造數），已寫在前提。
