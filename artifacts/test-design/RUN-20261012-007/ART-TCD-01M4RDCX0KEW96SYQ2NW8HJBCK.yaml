      content_hash: 535d360df2afe72602ff397f6fcd1f329b9225472aaba13b798b95f590c3fc6d
      location: §列表欄位／已作廢金額（第 54 行）
      quote: 當日出金的收據中，已作廢者的金額合計；以出收據的日期歸屬，不論作廢是哪一天（2026-10-05 新增）
    hotfix_eligible: false
    execution_cost: medium
    design_rationale: AC-0103（REQ-010：收據金額含已作廢）與 AC-0272（REQ-027：收據＝三欄之和）的 given 是同一組資料（200／300／500，其中 500 已作廢），兩者的 then 在同一列上同時成立，因此合併為一案，避免兩條步驟幾乎相同的案例；requirement_ids
      同時掛 REQ-010、027，decision_refs 兩個需求都有標。依據：spec 第 54 行『每列 收據金額 ＝ 已兌現金額 ＋ 未兌現金額 ＋ 已作廢金額』、第 72 行『作廢的收據分數已扣、不退回，仍含在收據金額內』、第
      169 行『收據金額仍含作廢』。技術標 equivalence_partitioning：收據狀態有已核實、待核實、已作廢三個等價類，各取一張代表，分別對應三個欄位；這不是 decision_table（沒有多條件組合矩陣），也不是
