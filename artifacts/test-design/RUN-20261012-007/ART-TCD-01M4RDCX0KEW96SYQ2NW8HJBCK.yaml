      51 行未補（RM REQ-010 Q03 minor 疑義）；顯示精度（399.6 或 399.60）spec 未定義，所以我只斷言數值等於 399.60、且不是 399 或 400，不斷言小數位數，避免把假設寫成規則。技術 requirement_based：單一情境、單一規則；399.60
      是小數與整數兩類輸入中的小數代表，但 spec 沒有定義數值邊界，故不標 boundary_value 或 equivalence_partitioning。與 CASHOUT 的 399.6 案例（洗分出金核實頁的實際金額欄）驗證的是不同頁面，不重複。資料佈置（機台餘額帶小數）為我的推測，需環境負責人確認。
