    execution_cost: medium
    design_rationale: 【修訂自 TC-DAILYREPORT-045 v2；CIR 判定 affected：AC-0152 同 ID 改寫，CLR-DAILYREPORT-015 裁決 CLR-009『未兌現不受統計週期切分』不再適用】數字預期沿用
      v2（CIR 已確認 v0.3 下仍成立：週列 300／0、按日 09-08 列 300），改掉的是理由敘述與步驟 3 的預期：移除 v2 的『未兌現金額不因統計週期切分而改變』（CLR-009 語意），改成 v0.3 第 70 行的『週期列＝期內各營業日依收據日歸屬的合計』與第
      53 行『當日出的收據』。『只算結算日期範圍內出的收據』的依據是 CLR-DAILYREPORT-015 答案（『只算結算日期範圍內出的收據、狀態以查詢當下為準這兩點不變』），非 spec 本文。技術沿用 boundary_value：查詢迄日
      09-10 恰是範圍外收據日 09-11 的前一天，驗證收據日在範圍外一天即被排除（日期範圍的邊界，不是數值上下限，這是我對此標籤的使用理由）。假設揭露：『如何造出指定收據日的待核實出金』spec 未定義，我推測需由環境負責人經機台端造數，已寫在前提；本案不依賴已作廢金額欄，故未涉及作廢。
