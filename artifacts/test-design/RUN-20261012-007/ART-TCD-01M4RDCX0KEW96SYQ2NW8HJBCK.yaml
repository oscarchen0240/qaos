      then。這是 CIR 指出需要新 TC 的部分（AC-0155 已併入修訂後的 TC-046）。『否定事實』（不依作廢日／核實日歸屬）的對照基準＝資料設計：作廢日落在另一個週列、核實日落在範圍外，使歸屬錯誤時的結果可區分；並限定
