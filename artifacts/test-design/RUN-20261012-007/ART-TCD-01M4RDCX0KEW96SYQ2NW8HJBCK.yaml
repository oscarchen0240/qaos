      判 unaffected）。技術標 security_rule、test_types 含 negative／security：這是權限邊界（管轄範圍內／外）的越權拒絕；CLR-014 的『資料不變』對唯讀查詢沒有可另外觀察的狀態變化，故只以『不回傳範圍外資料』判定。站長與管理員同為『管轄範圍』，spec
