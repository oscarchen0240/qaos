      AC-0283 的 then。requirement_ids 帶 REQ-015、016 是因為週期彙總與總計列規則分別屬於這兩個需求，decision_refs 已各自標明；AC 只掛 AC-0283（屬 REQ-028）。『總計列＝各列合計』的對照基準：步驟
      1 按日查詢的總計列與步驟 2 按週查詢的總計列應相等（同一範圍、同一機台），再加上各列加總；兩週而非一週，是因為單一週列時總計列恆等於該列，無法區分『各列合計』與『直接複製』。同樣避開注單跨場次切換點（歸屬基準 v0.3 未定義）。技術
      requirement_based。造數（確定筆數的注單）為環境負責人職責，spec 未定義。
