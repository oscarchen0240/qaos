    design_rationale: 依據：spec 第 45 行場次數欄的原文與其例句（日結 06:00、S2 9/10 20:00 開始、9/11 06:00 日結結算 → 計入 9/10；S3 9/11 06:00 開始屬 9/11、結束前不計入）＝AC-0094
      的 given／then；『進行中不計入』為同一行原文。技術標 boundary_value：被測規則是營業日邊界的歸屬——S2 的結束時刻與 S3 的開始時刻都恰在日結時刻（邊界點），歸屬 D 或 D+1 取決於以『開始時間』還是『結束時間』判定；這是時間邊界而非數值上下限，我如此標註並明示。日期切分一律用場館日結時間
      T（營業日），不用 UTC 日曆日，前提已寫換算提醒。資料佈置風險（我的推測，需環境負責人確認）：此形狀需要一台機台讓場次橫跨日結時刻並留有餘分，只能靠真實時間經過造成，後台沒有入口造出；且只能在 D+1 當天執行。本案不涉及注單，故不碰
      BUG-DAILYREPORT-004 提到的注單跨場次歸屬基準（v0.3 未定義，不斷言）；也不斷言依場次明細中 S2、S3 各出現在哪一天的列。與既有 TC-DAILYREPORT-031／077 的差異：兩者只涵蓋日結結算與逾時結束的計入，沒有『S3
      不提前計入』與『D+1 列為 0』。
