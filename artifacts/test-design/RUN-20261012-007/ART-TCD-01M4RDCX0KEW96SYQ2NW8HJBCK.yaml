    draft_id: TC-DRAFT-01M4RDF4M5424QKXCC1QZ72TCF
    title: 未兌現金額依出收據日歸屬到各列：結算日期範圍內的待核實收據只計入其收據日所在的列（按週列為期內各營業日之和），範圍外（迄日之後）的收據不計入
    requirement_ids:
    - REQ-DAILYREPORT-015
    - REQ-DAILYREPORT-011
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0152
    test_level: ui_e2e
    test_types:
    - boundary
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    preconditions:
    - 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
    - 進入 各式報表 > 場館日結報表
    - 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
      UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
    - （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
      AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
    - 收據資料（造數）：營業日 d1（AC 範例 2026-09-08，週二）有一筆出金收據 300，截至查詢當下仍未兌現（待核實）；營業日 d2＝查詢迄日的次日（AC 範例 2026-09-11）有一筆出金收據 200，同樣仍待核實
    - 查詢範圍（AC 範例 2026-09-03～2026-09-10，週一為 09-07）內，除 d1 的 300 之外，場館沒有其他待核實的出金收據；測試期間不要對這兩張收據做核實或作廢（核實或作廢後它們就不再是未兌現）
    test_data:
    - name: d1 收據（營業日 09-08）
      value: 300
      note: 待核實
    - name: d2 收據（營業日 09-11，範圍外）
      value: 200
      note: 待核實
    steps:
    - n: 1
      action: 統計維度選「依場館彙總」，結算日期選 2026-09-03～2026-09-10（迄日恰為範圍外收據 d2 的前一天），統計週期選「按週」，搜尋
    - n: 2
      action: 記錄「09-07～09-10」列與「09-03～09-06」列的未兌現金額
    - n: 3
      action: 統計週期改選「按日」，結算日期不變，搜尋；記錄 09-08 列的未兌現金額，以及其餘各日列的未兌現金額
    expected_result: 步驟 2（按週）：「09-07～09-10」列未兌現 300（d1 的收據，出收據日 09-08 落在此週期內；週期列為期內各營業日的未兌現之和）；不含結算日期範圍外 d2（出收據日 09-11）的 200；「09-03～09-06」列未兌現
      0。步驟 3（按日）：09-08 列未兌現 300，其餘各日列未兌現 0——同一張收據只出現在其出收據日當天那一列，按週列的 300 即 09-03～09-10 期內各日列未兌現（0＋…＋300＋…＋0）之和。
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
