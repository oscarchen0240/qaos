  - draft_id: TC-DRAFT-01M2NCW1BQ035VQ21YNJBFV5RS
    title: 帳號一律歸屬建立當下所在站台，切換站台後歸屬隨之改變
    product: ba-admin
    functional_area: ACCOUNT
    requirement_ids:
    - REQ-ACCOUNT-003
    acceptance_criteria_ids:
    - AC-ACCOUNT-0031
    spec_id: SPEC-ACCOUNT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 以 Admin 登入後台，切換站台選單至站台 A（自行從環境中選定），點擊「創建會員帳號」建立一個線上帳號，記錄其所屬站台
    - n: 2
      action: 將站台選單切換至另一個不同站台 B（自行從環境中選定），再次點擊「創建會員帳號」建立一個線上帳號，記錄其所屬站台
    expected_result: 第一個帳號所屬站台為 A；第二個帳號所屬站台為 B，兩者分別對應建立當下所在的站台，不受先前操作影響
    expected_result_spec_reference:
      spec_id: SPEC-ACCOUNT-001
      spec_version: '0.1'
      location: §操作/創建會員帳號
      quote: 帳號一律建立於目前所在的站台底下…不提供跨站台指定
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 「目前所在站台」是唯一決定歸屬的條件，切換到不同站台會得到不同的歸屬結果，屬條件-結果對照，標為 decision_table；同一 TC 內對照兩種站台情境比單一情境更能證明歸屬「依當下」而非「依帳號類型或其他因素」決定。
