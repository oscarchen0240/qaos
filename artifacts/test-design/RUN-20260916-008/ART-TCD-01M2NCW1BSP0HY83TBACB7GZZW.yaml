  - draft_id: TC-DRAFT-01M2NCW1BQYH4S2P0PTM2MXMWG
    title: 帳號類型預設值與可選狀態依目前站台類型而定
    product: ba-admin
    functional_area: ACCOUNT
    requirement_ids:
    - REQ-ACCOUNT-004
    acceptance_criteria_ids:
    - AC-ACCOUNT-0041
    - AC-ACCOUNT-0042
    spec_id: SPEC-ACCOUNT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 切換站台選單至一個機台場館，開啟「創建會員帳號」Modal，檢視帳號類型欄位的預設值與可選項
    - n: 2
      action: 切換站台選單至一個線上站台，開啟「創建會員帳號」Modal，檢視帳號類型欄位的預設值，並嘗試點選「機台」選項
    expected_result: 機台場館下：帳號類型預設為「機台」，「線上」「機台」皆可選；線上站台下：帳號類型預設為「線上」，「機台」選項為停用狀態，無法點選
    expected_result_spec_reference:
      spec_id: SPEC-ACCOUNT-001
      spec_version: '0.1'
      location: §操作/創建會員帳號
      quote: 預設值依目前站台的「站台類型」帶入——機台場館預設「機台」、線上站台預設「線上」。「機台」選項僅於目前站台為機台場館時可選
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 站台類型（機台/線上）這個單一條件對應兩組不同結果（預設值＋機台選項是否可選），是典型的條件-結果對照表，標為 decision_table；同一 TC 內同時涵蓋預設值(functional)與停用狀態的驗證(negative)，故
      test_types 含兩者。
