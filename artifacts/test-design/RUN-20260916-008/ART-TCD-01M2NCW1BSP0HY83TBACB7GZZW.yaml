  testcases:
  - draft_id: TC-DRAFT-01M2NCW1BQC6Q408B4MWKF4RWZ
    title: 後台建立線上帳號與機台帳號，帳號類型欄位值分別正確
    product: ba-admin
    functional_area: ACCOUNT
    requirement_ids:
    - REQ-ACCOUNT-001
    acceptance_criteria_ids:
    - AC-ACCOUNT-0011
    - AC-ACCOUNT-0012
    spec_id: SPEC-ACCOUNT-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: &id001
    - 以 Admin 登入後台
    - 進入 會員與加盟商 > 會員列表
    test_data: []
    steps:
    - n: 1
      action: 以 Admin 登入後台，切換至一個線上站台，點擊「創建會員帳號」，帳號類型選「線上」並建立
    - n: 2
      action: 以 Admin 登入後台，切換至一個機台場館，點擊「創建會員帳號」，帳號類型選「機台」並建立
    - n: 3
      action: 分別檢視兩個新帳號的會員紀錄，確認帳號類型欄位值
    expected_result: 第一個帳號的帳號類型欄位值為「線上」；第二個帳號的帳號類型欄位值為「機台」
    expected_result_spec_reference:
      spec_id: SPEC-ACCOUNT-001
      spec_version: '0.1'
      location: §功能說明
      quote: 會員紀錄新增「帳號類型」欄位區分兩種帳號，不另外建立一套帳號系統
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: low
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 帳號類型是二值輸入(線上/機台)各自映射到不同且唯一的欄位結果，屬條件-結果對照表，故標為 decision_table；同一 TC 內比較兩種輸入的差異結果，比逐一單獨驗證更能凸顯欄位是否正確區分。
  - draft_id: TC-DRAFT-01M2NCW1BQ2XK06X60SKZ8EM2P
    title: 機台帳號沒有獨立的管理選單或資料表入口，僅存在於會員列表
