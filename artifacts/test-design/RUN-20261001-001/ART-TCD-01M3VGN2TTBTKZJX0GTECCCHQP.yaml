    supersedes_testcase:
      testcase_id: TC-DAILYREPORT-051
      version: 2
    design_rationale: CLR-DAILYREPORT-013 PM 定案 A（2026-10-01）推翻 CLR-DAILYREPORT-012 的 B：依場次明細列出進行中場次（結束時間「—」）。v2 前置條件『依場次明細只列已結束／逾時結束／日結結算的場次』已不成立，已移除；新建立（進行中）的場次改回於依場次明細驗證。會員詳細頁「機台資訊」區塊的驗證點保留為補充（spec
      §場次呈現位置明寫該區塊顯示目前進行中場次摘要，與依場次明細並列為兩個呈現位置，並不互斥），但不再宣稱『依場次明細看不到進行中場次』。AC-0171 的 then 只要求『日結結算、結束時間＝日結時間、新場次期初餘額承接』；步驟 2、3、6
      對進行中列『進行中／—』的斷言來自 CLR-013 定案 A（對應 REQ-008 AC-0083），不是 AC-0171 的條文，只當作辨識新舊場次的觀察點。iteration 1 依 Validator 修正：佈置方式已直接寫進
      steps／preconditions；餘額改以『前台讀值 X』為基準（AC 範例 80；開分金額與分數的換算 v0.1 未載明，故不寫死 80）；加入逾時時間限制與日結前檢查點（逾時時間概念沿用 TC-054 已核准的場次逾時規則）；查詢範圍改為昨日與今日。『出金一律清空餘額』依
      spec 場次資訊期初餘額說明。【資料佈置的未驗證前提】開分／出金等機台金流操作的入口，v0.1 與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本 TC 以『機台前台畫面顯示的分數』為讀值來源，是依
      TC-DAILYREPORT-054 既有寫法推測的，需環境負責人確認。技術維持 state_transition：REQ-017 明定 進行中→日結結算 的狀態轉換。
