  testcases:
  - draft_id: TC-DRAFT-01M3VGN2TR49TSV0QG73YPNMHX
    title: 日結時間到達強制結束進行中場次並承接餘額
    product: ba-admin
    functional_area: DAILYREPORT
    requirement_ids:
    - REQ-DAILYREPORT-017
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0171
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    test_level: api
    test_types:
    - functional
    design_techniques:
    - state_transition
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 已登入後台並切換至機台場館站台（Arcade）
    - 測試場館已設定日結時間 06:00 UTC+0
    - 測試場館下有機台 A（既有機台會員，自行從環境中選定），可開啟其會員詳細頁「機台資訊」區塊
    - 各式報表 > 場館日結報表 可用；依場次明細列出所有狀態的場次，含進行中（依 CLR-DAILYREPORT-013 PM 定案 A，推翻 CLR-DAILYREPORT-012 的 B）
    - 時間限制：步驟 1 佈置完成到日結時間 06:00 的間隔須短於場館的場次逾時時間（預設 1 小時），否則場次會先變「逾時結束」；建議在 06:00 前 30 分鐘內開始佈置，必要時先把場館逾時時間調長
    - 步驟 5～7 的查詢時點在日結時間 06:00 UTC+0 之後
    - 步驟 5～7 的結算日期：前一日（日結前所屬營業日）與當日（日結後所屬營業日，承接場次歸屬當日）
    test_data:
    - name: X
      value: 步驟 1 佈置後機台 A 的目前分數，取機台前台畫面顯示值，須大於 0（原範例為 80，實際值不限）
    steps:
    - n: 1
      action: （日結前 30 分鐘內佈置）若機台 A 已有進行中場次，先以出金結束（出金一律清空餘額）；再對機台 A 開分任意金額、不投注，在機台前台記錄目前分數 X（須大於 0）
    - n: 2
      action: 依場次明細（機台帳號填機台 A，結算日期涵蓋昨日與今日；營業日依日結時間切分，00:00～06:00 UTC+0 時進行中場次屬於前一營業日）找到機台 A 的進行中場次列，記錄場次編號 S1、狀態、結束時間
    - n: 3
      action: 日結時間 06:00 之前的檢查點：以相同條件重新查詢，確認 S1 仍為「進行中」、結束時間「—」，且機台前台分數仍為 X；若 S1 已為「逾時結束」或分數不是 X，本次執行作廢，縮短佈置到日結的間隔後重新佈置
    - n: 4
      action: 不對機台 A 做任何交易，等待日結時間 06:00 UTC+0 到達
    - n: 5
      action: 依場次明細（機台帳號填機台 A）查詢前一日，找到場次 S1
    - n: 6
      action: 依場次明細（機台帳號填機台 A）查詢當日，找到機台 A 在日結後的場次列
    - n: 7
      action: 開啟機台 A 的會員詳細頁「機台資訊」區塊
    expected_result: 步驟 2、3：S1 該列狀態「進行中」、結束時間「—」；步驟 5：前一日 S1 狀態「日結結算」、結束時間＝06:00；步驟 6：當日有機台 A 的新場次列，場次編號不同於 S1、狀態「進行中」、結束時間「—」；步驟
      7：機台資訊區塊顯示一個進行中場次（場次編號不同於 S1），期初餘額＝X
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      quote: 日結時間到達時強制結束所有進行中的場次，餘額轉為隔日新場次的期初餘額
      location: §業務規則/場次日結 + §背景：場次資訊／場次呈現位置（會員詳細頁「機台資訊」區塊：顯示該機台目前進行中的場次摘要）（新場次於依場次明細列為進行中：依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以
        spec 2026-09-17 修訂為準，v0.1 不含該修訂））
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
