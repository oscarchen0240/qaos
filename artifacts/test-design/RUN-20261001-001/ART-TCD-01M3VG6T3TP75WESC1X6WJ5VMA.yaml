    title: 日結時間到達強制結束進行中場次並承接餘額
    requirement_ids:
    - REQ-DAILYREPORT-017
    acceptance_criteria_ids:
    - AC-DAILYREPORT-0171
    test_level: api
    test_types:
    - functional
    design_techniques:
    - state_transition
    priority: high
    risk: high
    preconditions:
    - 已登入後台並切換至機台場館站台（Arcade）
    - 測試場館已設定日結時間 06:00 UTC+0
    - 測試場館下有機台 A（既有機台會員，自行從環境中選定），可開啟其會員詳細頁「機台資訊」區塊
    - 各式報表 > 場館日結報表 可用；依場次明細列出所有狀態的場次，含進行中（依 CLR-DAILYREPORT-013 PM 定案 A，推翻 CLR-DAILYREPORT-012 的 B）
    - 查詢時點在日結時間之後
    - 結算日期：前一日與當日（承接場次歸屬當日）
    steps:
    - n: 1
      action: 機台 A 有進行中場次、餘額 80（以機台前台顯示的分數為準；佈置方式見 design_rationale 的資料佈置說明）；於依場次明細（機台帳號填機台 A，結算日期涵蓋今日）找到該進行中場次列，記錄場次編號 S1
        及其狀態、結束時間
    - n: 2
      action: 不對機台 A 做任何交易，等待日結時間 06:00 UTC+0 到達
    - n: 3
      action: 依場次明細（機台帳號填機台 A）查詢前一日，找到場次 S1
    - n: 4
      action: 依場次明細（機台帳號填機台 A）查詢當日，找到機台 A 在日結後的場次列
    - n: 5
      action: 開啟機台 A 的會員詳細頁「機台資訊」區塊
    test_data: []
    expected_result: 步驟 1：S1 該列狀態「進行中」、結束時間「—」；步驟 3：前一日 S1 狀態「日結結算」、結束時間＝06:00；步驟 4：當日有機台 A 的新場次列，場次編號不同於 S1、狀態「進行中」、結束時間「—」；步驟
      5：機台資訊區塊顯示一個進行中場次（場次編號不同於 S1），期初餘額 80
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §業務規則/場次日結 + §背景：場次資訊／場次呈現位置（會員詳細頁「機台資訊」區塊：顯示該機台目前進行中的場次摘要）（新場次於依場次明細列為進行中：依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以
        spec 2026-09-17 修訂為準，v0.1 不含該修訂））
      quote: 日結時間到達時強制結束所有進行中的場次，餘額轉為隔日新場次的期初餘額
    assumptions: []
    critical_path: true
    source: change_workflow
    supersedes_testcase:
      testcase_id: TC-DAILYREPORT-051
      version: 2
    design_rationale: CLR-DAILYREPORT-013 PM 定案 A（2026-10-01）推翻 CLR-DAILYREPORT-012 的 B：依場次明細列出進行中場次（結束時間「—」）。v2 前置條件『依場次明細只列已結束／逾時結束／日結結算的場次』已不成立，已移除；新建立（進行中）的場次改回於依場次明細驗證。會員詳細頁「機台資訊」區塊的驗證點保留為補充（spec
      §場次呈現位置明寫該區塊顯示目前進行中場次摘要，與依場次明細並列為兩個呈現位置，並不互斥），但不再宣稱『依場次明細看不到進行中場次』。AC-0171 的 then 只要求『日結結算、結束時間＝日結時間、新場次期初餘額 80』；步驟
      1 與步驟 4 對進行中列『進行中／—』的斷言來自 CLR-013 定案 A（對應 REQ-008 AC-0083），不是 AC-0171 的條文，本 TC 只把它當作辨識新舊場次的觀察點。步驟 2 補『期間不做交易』是為了讓餘額維持
      80。【資料佈置的未驗證前提】開分／投注／出金等機台金流操作的入口，v0.1 與本報表 spec 均未載明（定義於『機台金流與場次』開發包③），且『從哪裡讀機台目前分數』亦未載明；本 TC 以『機台前台畫面顯示的分數』為讀值來源，是依
      TC-DAILYREPORT-054 既有寫法（以剩餘分數在機台前台嘗試進入遊戲）推測，需環境負責人確認。技術維持 state_transition：REQ-017 明定 進行中→日結結算 的狀態轉換。
