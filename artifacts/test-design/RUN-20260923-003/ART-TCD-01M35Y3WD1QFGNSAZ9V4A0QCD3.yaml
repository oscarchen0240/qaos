    title: 尚未完成（待確認）的出金交易，系統不會為其建立核實紀錄
    preconditions:
    - 以 Admin 登入後台
    - 進入 帳務管理 > 洗分出金核實，站台切換選單已選定一個機台場館站台
    - 已取得一筆機台出金交易，其於機台交易紀錄的交易狀態為「待確認」（技術值待處理／等待中；即 req-cashout 已核可、end-cashout 完成回報未送達，分數尚未扣除）
    steps:
    - n: 1
      action: 取得（或使一筆）機台出金交易於機台交易紀錄的交易狀態為『待確認』（尚未完成）
    - n: 2
      action: 進入本頁，以該機台帳號或訂單編號查詢，確認是否有對應紀錄
    expected_result: 查無此筆紀錄；因為交易尚未完成，系統根本不會為它建立核實狀態紀錄。不可憑本頁無紀錄直接判斷交易狀態，須至機台交易紀錄查明實際狀態後再決定是否付款。
    expected_result_spec_reference:
      spec_id: SPEC-CASHOUT-001
      spec_version: '0.1'
      location: §紀錄產生規則（「僅交易狀態為「已完成」的機台洗分與機台出金會出現在本頁；待確認、已取消、已逾時、未成立的交易不會出現」）；待確認情境改以出金驗證之依據為 CLR-CASHOUT-002 回覆 A 與 SPEC-CASHFLOW-001
        §出金（「請求成功但完成回報未送達時，交易停在「待確認」」）
    assumptions: []
    source: change_workflow
    supersedes_testcase:
      testcase_id: TC-CASHOUT-085
      version: 1
    design_rationale: CLR-CASHOUT-002 回覆 A（2026-09-23）：機台洗分為單階段交易（req-keyout，帳務立即生效），不會停在「待處理／等待中」（＝待確認）；畫面篩選器上那兩個技術值係與「出鈔」共用同一組的結果，對洗分不適用。原版
      given「洗分交易狀態為待確認」的情境不存在、前置條件無法建立。改用出金（兩階段：req-cashout 已核可但 end-cashout 完成回報未送達時會停在待確認，見 SPEC-CASHFLOW-001 出金段），RM 的
      AC-CASHOUT-0041 given 已同步自洗分改為出金。ADR-008 影響掃描判定需修訂。 【Validator minor】該括號附註原置於 expected_result，已移至本欄：本案 given/when 僅涉出金，洗分不在驗證範圍，附註僅說明為何不用洗分。
