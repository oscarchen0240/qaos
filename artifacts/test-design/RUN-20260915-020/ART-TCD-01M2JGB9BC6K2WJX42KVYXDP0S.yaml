  testcases:
  - draft_id: TC-DRAFT-01M2JGB9BBRVE5QK5DG8VNWZCA
    title: 會員列表 KYC 狀態五圖示依各階段實際狀態正確顯示顏色與 Tooltip
    product: ba-admin
    functional_area: MEMBER
