    design_rationale: 已比對Phase 3影子測試(qaos-test-designer agent)產出的TC-MEMBER-030（已退役），Phase 2原版precondition聲稱「可透過後台對該測試帳號的各階段分別執行核准/駁回/停用操作」來佈置已停用狀態，把未定義的機制（是否真的有『停用』這個後台操作）當成已知可操作的方式呈現，這與TC-MEMBER-007/008、TC-MEMBER-018/019/020被抓出的問題屬同一類depth
      defect。Phase 3版本誠實揭露此依賴、標為assumption。依整合原則(深度優先)補充此揭露，precondition中移除「執行...停用操作」的武斷措辭，改為優先挑選既有帳號、並將不確定性結構化記錄於assumptions。v2依獨立Validator
      FAIL判定修正：v1只處理了「已停用」的depth defect，卻遺漏同一份precondition裡「審核中」狀態同樣有問題——原文籠統寫「可透過後台執行核准/駁回操作、或部分階段保持未送審來佈置」，但依spec §2.1.5，後台的『通過』/『駁回』操作只能作用在已經送審(審核中)的階段上，無法『執行』出審核中狀態本身，審核中是會員端送出申請觸發的狀態。已在precondition中逐一明確列出四種狀態各自正確的佈置方式，不再籠統歸入『後台操作』。v3依Oscar
      2026-09-15補充確認的新資訊修正：『已停用』狀態的實際佈置機制是後台『系統管理 > KYC設定』停用特定驗證項目，停用後會員列表KYC狀態欄該階段顯示為『--』，與spec §2.1.3表格描述的深灰色圖示＋『已停用』Tooltip用字不完全一致。此假設已從exploratory（需PM確認）轉為grounded（已有確定答案），assumptions欄位移除該項；expected_result同步改為以實際產品行為（顯示『--』）為準，並誠實標註與spec文字的落差
