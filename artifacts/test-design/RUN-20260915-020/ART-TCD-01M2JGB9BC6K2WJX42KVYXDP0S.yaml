    risk: medium
    execution_mode: manual
    preconditions:
    - 一名會員的五個 KYC 階段（個人基本資訊/身分證明文件/身分證件自拍/居住地址/資產證明）分別處於不同狀態，至少涵蓋已核准/審核中/待補件/未申請其中三種以上。各狀態佈置方式（依spec §2.1.5會員詳細資料頁「KYC 狀態」區塊定義）：「已核准」＝後台對該階段執行審核結果「通過」；「待補件」＝後台執行「駁回」（並選取駁回原因）；「未申請」＝該階段尚未經會員端送出、保持未送審；「審核中」＝會員已透過會員端（前台/APP）送出該階段申請、後台尚未執行通過或駁回——這是會員端動作觸發的狀態，後台本身沒有可直接『執行』出審核中的操作，佈置時需請一名會員實際透過前台送出申請，或從測試環境既有資料中挑選已處於審核中的既有帳號
    - 「已停用」狀態的佈置方式（已由 Oscar 2026-09-15 確認）：於後台「系統管理 > KYC設定」停用該驗證項目，該階段即對所有會員生效；停用後，會員列表 KYC 狀態欄該階段實際顯示為「--」，而非 spec §2.1.3
      表格文字描述的深灰色圖示＋「已停用」Tooltip——spec文字與實際產品顯示不完全一致，本TC以實際產品行為（顯示「--」）為準，spec的用字落差建議另案確認/更新spec
    test_data: []
    steps:
    - n: 1
      action: 於會員列表檢視該會員的 KYC 狀態欄五個圖示顏色
    - n: 2
      action: 滑鼠移至任一圖示
    expected_result: 四個仍開放審核的階段圖示顏色分別正確對應各自階段的實際狀態（綠=已核准/橘=審核中/紅=待補件/淺灰=未申請），滑鼠移至圖示顯示 Tooltip 說明階段名稱與狀態；若涵蓋已停用的階段，該階段於會員列表
      KYC 狀態欄實際顯示為「--」（已由 Oscar 2026-09-15 確認之實際產品行為，非 spec §2.1.3 表格文字描述的深灰色圖示＋『已停用』Tooltip——兩者用字有落差，以實際產品行為為準）
    expected_result_spec_reference:
      spec_id: SPEC-MEMBER-001
      spec_version: '0.2'
      location: §2.1.3 KYC驗證階段圖示說明
      quote: 🟢綠色已核准該階段已通過審核｜🟠橘色審核中會員已送出申請，待後台審核｜🔴紅色待補件審核不通過，需會員補件｜灰色（淺）未申請會員尚未提交此階段｜灰色（深）已停用此階段已被停用
    assumptions: []
