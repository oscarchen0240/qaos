    acceptance_criteria_ids:
    - AC-CASHFLOW-0071
    - AC-CASHFLOW-0072
    preconditions:
    - 機台已透過憑證通過認證
    - 機台所屬場館為開通狀態，機台為啟用狀態
    - 設定該場館額度上限為 A，並確認目前「全場館機台分數餘額合計＋已預留未入帳入金金額」恰為 A-100
    steps:
    - n: 1
      action: 送出 req-cashin，金額 100，確認建立 PENDING 並取得 TXID（本階段不判定額度，任何金額皆會建立 PENDING）
    - n: 2
      action: 送出 end-cashin（TXID 相符，實際清點金額 100），使「全場館餘額合計＋已預留金額＋本筆實際金額」恰等於額度上限 A
    - n: 3
      action: 確認回覆 0-OK、分數正常增加
    - n: 4
      action: 另建構一筆 req-cashin（金額 1，同樣建立 PENDING），送出其 end-cashin（實際清點金額 1），使加計後超過額度上限 A
    - n: 5
      action: 確認此筆 end-cashin 的回覆、分數變化，並確認機台已退鈔
    expected_result: 第一筆：req-cashin 建立 PENDING（不判定額度）；end-cashin 因加計後恰等於上限，回 0-OK 並正常入帳。第二筆：req-cashin 仍建立 PENDING（本階段不判定額度）；end-cashin
      因加計後超過上限，回 1-OVER LIMIT，不更新帳務，機台退鈔
