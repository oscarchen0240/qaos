    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 此規則直接關係現場核帳正確性（RequirementModel 標為 high risk），但門檻具體數值由機台端決定非 spec 定義的固定規則，故 precondition 刻意不聲稱任何具體門檻計算方式，只描述『安排一筆門檻小於請求金額的洗分交易』這個已由
      spec 承認會發生的情境，避免對未定義的計算細節做出斷言。
