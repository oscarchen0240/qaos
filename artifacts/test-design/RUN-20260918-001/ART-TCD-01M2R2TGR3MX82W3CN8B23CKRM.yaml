  testcases:
  - draft_id: TC-DRAFT-01M2R29PNM8KWHZP7XBWF6VENP
    title: 查詢範圍含機台交易時，待確認／已取消／已逾時／未成立四種非最終狀態的交易與已完成交易一併列出
    product: ba-admin
    functional_area: TXLOG
    requirement_ids:
    - REQ-TXLOG-001
    acceptance_criteria_ids:
    - AC-TXLOG-0011
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions: &id001
    - 以 Admin 身分登入 ba-admin 後台
    - 頁面標題下方的站台切換選單已選定一個機台場館站台
    - 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
    test_data: []
    steps:
    - n: 1
      action: 於本頁分別安排（或於既有交易紀錄中尋得）一筆待確認、一筆已取消、一筆已逾時、一筆未成立與一筆已完成的機台交易（各筆狀態的產生機制屬開發包③既有交易資料模型，本測試僅借用其已知穩定行為，不重新驗證狀態判定邏輯本身）
    - n: 2
      action: 清除所有篩選條件，僅保留站台切換範圍，點擊搜尋
    expected_result: 五種狀態的交易皆出現在查詢結果中，不因狀態非「已完成」而被排除
    expected_result_spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §功能說明
      quote: 既有的 4.1 只顯示已經生效的錢包異動；併入後，查詢範圍含機台交易時另外顯示尚未完成、被取消與被拒絕的交易
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 直接依 AC-TXLOG-0011 的五種狀態枚舉逐一確認皆會出現，為本需求最核心的正向斷言，逐一枚舉優於單一情境測試。
  - draft_id: TC-DRAFT-01M2R29PNMBDFE88X1S1KBMAXB
    title: 待確認的機台交易在本包擴充後仍會被列出，不再套用既有 4.1『僅顯示已生效』的排除規則
    product: ba-admin
    functional_area: TXLOG
    requirement_ids:
    - REQ-TXLOG-001
    acceptance_criteria_ids:
    - AC-TXLOG-0011
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 安排一筆機台交易，確保其目前狀態為待確認（尚未收到機台完成回報，分數尚未異動）
    - n: 2
      action: 以此交易編號或其機台帳號查詢
    expected_result: 該筆待確認交易正常出現在結果中；若沿用既有 4.1 的排除規則（僅顯示已生效者）則此交易應被排除，本測試即在驗證這條舊排除規則已不再套用於機台交易
    expected_result_spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §功能說明
      quote: 既有的 4.1 只顯示已經生效的錢包異動；併入後...另外顯示尚未完成、被取消與被拒絕的交易
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 這是 high risk 需求，設計為 negative 手法：明確驗證『既有排除待確認交易』這條舊規則已被移除，而非單純重複正向枚舉，比 TC1 更聚焦在風險點本身（新舊行為的交界）。
  - draft_id: TC-DRAFT-01M2R29PNMAKNDPADVMWNQ6C3K
    title: 線上會員交易不因本包機台擴充而被納入『尚未完成也顯示』的範圍，維持既有 4.1 僅顯示已生效異動的行為
    product: ba-admin
    functional_area: TXLOG
    requirement_ids:
    - REQ-TXLOG-002
    acceptance_criteria_ids:
    - AC-TXLOG-0021
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - negative
    priority: medium
    risk: medium
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 找出（或安排）一筆線上會員、狀態非已生效（例如仍在處理中）的錢包異動
    - n: 2
      action: 於本頁查詢，篩選條件不限制交易類型
    expected_result: 該筆線上會員的非生效異動不會被列出——本包的『尚未完成也顯示』擴充範圍僅限機台交易，不擴及線上會員交易，線上部分維持既有 4.1 僅顯示已生效異動的行為
    expected_result_spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §功能說明
      quote: 非機台交易的既有行為不變
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: AC 的斷言是『既有行為不變』，若只驗證外觀欄位不足以證明行為真的沒變；選擇驗證『擴充範圍是否誤及線上交易』這個最容易被本包影響到的邊界，用 negative 技巧直接測試範圍邊界比對照欄位樣式更貼近
      AC 的實質意圖。
  - draft_id: TC-DRAFT-01M2R29PNM1PXRXTV6T2K54N32
    title: 頁面資料範圍完全跟隨站台切換選單，篩選器不提供獨立的『場館』欄位
    product: ba-admin
    functional_area: TXLOG
    requirement_ids:
    - REQ-TXLOG-003
    acceptance_criteria_ids:
    - AC-TXLOG-0031
    spec_id: SPEC-TXLOG-001
    spec_version: '0.1'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: medium
    risk: medium
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 以 Admin 登入後台，進入 交易紀錄查詢 頁面
    - n: 2
      action: 檢視篩選器所有欄位名稱
    - n: 3
      action: 將頁面標題下方的站台切換選單切至機台場館站台 A，不做任何其他篩選，點擊搜尋
    - n: 4
      action: 記錄結果筆數與站台 A 範圍；再將站台切換選單切至另一機台場館站台 B，重新搜尋，比較兩次結果
    expected_result: 篩選器欄位中不存在『場館』這個獨立篩選項；切至站台 A 時的查詢結果僅含站台 A 範圍內的交易，切至站台 B 後結果隨之改變為僅含站台 B 範圍，證明資料範圍完全由站台切換選單決定
    expected_result_spec_reference:
      spec_id: SPEC-TXLOG-001
      spec_version: '0.1'
      location: §篩選器
      quote: 頁面資料範圍跟隨頁面標題下方的站台切換下拉選單（後台各頁皆有，一次僅顯示所選站台），不另設「場館」篩選欄位
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: AC 有兩個斷言（無場館欄位、範圍隨站台切換），透過『切換兩個不同站台比較結果集不同』直接證明資料範圍確實跟隨選單而非另有隱藏場館邏輯，比單純檢視欄位存在與否更完整。
