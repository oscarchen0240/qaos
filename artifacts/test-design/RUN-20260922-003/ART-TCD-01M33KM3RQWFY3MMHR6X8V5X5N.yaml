    title: 日結時間到達強制結束進行中場次並承接餘額
    preconditions:
    - 已登入後台並切換至機台場館站台（Arcade）
    - 測試場館已設定日結時間 06:00 UTC+0
    - 測試場館下有機台 A（會員編號已知），可開啟其會員詳細頁「機台資訊」區塊
    - 各式報表 > 場館日結報表 可用（依場次明細只列已結束／逾時結束／日結結算的場次，依 CLR-DAILYREPORT-012）
    - 查詢時點在日結時間之後
    - 結算日期：前一日與當日（承接場次歸屬當日）
    steps:
    - n: 1
      action: 機台 A 有進行中場次、餘額 80（於機台資訊區塊記錄其場次編號）
    - n: 2
      action: 等待日結時間 06:00 UTC+0 到達
    - n: 3
      action: 依場次明細查詢前一日
    - n: 4
      action: 開啟機台 A 的會員詳細頁「機台資訊」區塊
    expected_result: 步驟 3：前一日該場次狀態「日結結算」、結束時間＝06:00；步驟 4：機台資訊區塊顯示一個新的進行中場次（場次編號不同於步驟 1），期初餘額 80
    expected_result_spec_reference:
      spec_id: SPEC-DAILYREPORT-001
      spec_version: '0.1'
      location: §業務規則/場次日結 + §背景：場次資訊／場次呈現位置（會員詳細頁「機台資訊」區塊：顯示該機台目前進行中的場次摘要）
      quote: 日結時間到達時強制結束所有進行中的場次，餘額轉為隔日新場次的期初餘額
    assumptions: []
    source: change_workflow
    supersedes_testcase:
