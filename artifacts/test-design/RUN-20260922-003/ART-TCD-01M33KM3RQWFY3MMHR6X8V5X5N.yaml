      version: 1
    design_rationale: CLR-DAILYREPORT-012 PM 定案 B（2026-09-22）：場館日結報表「依場次明細」只列已結束／逾時結束／日結結算的場次，進行中不列。原版以依場次明細驗證新建立的（進行中）場次，B
      之後該列不存在。spec §背景：場次資訊／呈現位置明寫「會員詳細頁『機台資訊』區塊：顯示該機台目前進行中的場次摘要」，故進行中場次的場次編號／期初餘額改於該區塊驗證；已結束／日結結算的列仍於依場次明細驗。ADR-008 影響掃描判定需修訂。
