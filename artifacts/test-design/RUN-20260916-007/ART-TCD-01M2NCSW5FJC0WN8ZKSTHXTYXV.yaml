  - draft_id: TC-DRAFT-01M2NCSW5C2NPYX0YR2ATYY7QA
    title: 根層站台建立時可自由二擇一站台類型（線上／機台）
    product: ba-admin
    functional_area: SITELIST
    requirement_ids:
    - REQ-SITELIST-001
    acceptance_criteria_ids:
    - AC-SITELIST-0011
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: &id001
    - 以 Admin 身分登入 ba-admin 後台
    - 進入「站台列表」頁面
    test_data: []
    steps:
    - n: 1
      action: 點擊「+ 新增站台」，上層站台留空（建立根層站台），站台類型選擇「線上」，其餘必填欄位填妥後點擊「建立站台」
    - n: 2
      action: 再次點擊「+ 新增站台」，上層站台留空，站台類型改選「機台」，其餘必填欄位填妥後點擊「建立站台」
    expected_result: 兩次皆成功建立；前者站台類型顯示為線上，後者顯示為機台，各自依所選類型建立
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §站台類型與機台專屬欄位
      quote: 每個站台的「站台類型」為線上 / 機台，二擇一；建立後不可修改
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: AC-0011 的斷言是『選擇後系統依所選類型建立』，用一個 TC 涵蓋線上/機台兩個分支是典型 decision_table（2 條件→2 結果的映射），比拆成兩條案例更能突顯這是同一規則的兩面。
  - draft_id: TC-DRAFT-01M2NCSW5C6R7E2VFEEQ33A4S5
    title: 站台建立後，編輯畫面站台類型欄位唯讀，無法透過編輯變更
