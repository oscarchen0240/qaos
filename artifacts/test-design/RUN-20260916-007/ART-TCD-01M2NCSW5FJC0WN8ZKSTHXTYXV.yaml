    - negative
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 取上一步建立的任一站台，點擊列表「編輯」開啟 Modal
    - n: 2
      action: 檢視站台類型欄位的呈現方式與是否可互動
    - n: 3
      action: 嘗試以瀏覽器操作（如點擊欄位、嘗試選取其他選項）改變其值，並點擊「儲存變更」
    expected_result: 站台類型欄位置灰唯讀，無法點選或修改任何選項；儲存後重新開啟編輯畫面，站台類型值與建立時相同，未被變更
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §站台類型與機台專屬欄位 + §業務規則-站台類型鎖定
      quote: 建立後不可修改
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: AC-0012/0013 明確描述『唯讀置灰』即為拒絕修改的方式，rejection_contract.defined=true 且原文有直接依據，不需假設；design_technique 標 negative
      因為這條本質是驗證『修改嘗試被拒絕』而非單純檢視顯示。
  - draft_id: TC-DRAFT-01M2NCSW5CF3M957FW8FTEYYS8
    title: 子站台的站台類型強制跟隨上層站台，UI 不開放個別選擇
    product: ba-admin
    functional_area: SITELIST
    requirement_ids:
    - REQ-SITELIST-002
    acceptance_criteria_ids:
    - AC-SITELIST-0021
    - AC-SITELIST-0022
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 取一個既有的機台類型站台（自行從環境中選定，或延用本批次已建立的機台根站台），在其底下點擊「+ 新增站台」，檢視站台類型欄位
    - n: 2
      action: 取一個既有的線上類型站台，在其底下點擊「+ 新增站台」，檢視站台類型欄位
    expected_result: 前者：站台類型固定顯示為機台，UI 不提供選擇其他類型的控制項；後者：固定顯示為線上，UI 同樣不開放選擇
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §站台類型與機台專屬欄位 + §業務規則-站台類型隨主站台
      quote: 站台類型於主站台（根層）選定，子站台一律與主站台同類型、不可個別選擇
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 上層為機台／上層為線上是兩個獨立條件各自對應固定結果，屬合法的 decision_table（2×1 映射）；未使用 boundary_value 是因為這裡沒有數值邊界，純粹是類型繼承規則。
