  - draft_id: TC-DRAFT-01M2NCSW5C4CVZTP2HE4NCEX54
    title: 上層站台為 admin（根層）時例外：類型可自由選擇，核心貨幣依所選類型連動建立
    product: ba-admin
    functional_area: SITELIST
    requirement_ids:
    - REQ-SITELIST-002
    acceptance_criteria_ids:
    - AC-SITELIST-0023
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - requirement_based
    priority: high
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 點擊「+ 新增站台」，上層站台留空（即建立於最上層 admin 根節點之下、成為根層站台），站台類型選擇「機台」，核心貨幣下拉選單檢視
    - n: 2
      action: 填妥其餘必填欄位後點擊「建立站台」，建立完成後檢視該站台的核心貨幣欄位值
    expected_result: 站台類型欄位可自由選擇（不強制跟隨 admin 本身），選機台後核心貨幣下拉僅出現 TWD 並自動連動建立，過程不要求或呈現任何『admin 自身鏈上錢包管理需預先啟用 TWD』的前置檢查
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §站台類型與機台專屬欄位 + §業務規則-站台類型隨主站台
      quote: 當上層站台為 admin（最上層根站台）時，此強制跟隨規則不適用——底下子站台可自由選擇機台或線上類型，核心貨幣依所選類型連動建立
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 此 AC 描述的『上層站台為 admin』情境，經比對 spec.md 正文（§站台類型與機台專屬欄位：站台類型於『主站台（根層）』選定），與『建立根層站台可自由選類型』實為同一件事的兩種措辭，因此以建立根層站台的操作驗證；『不需
      admin 自身鏈上錢包管理預先啟用該幣別』一句涉及鏈上錢包管理，該功能不在 SITELIST spec 範圍內，本 TC 僅驗證『沒有出現任何阻擋提示』這個可觀察到的否定事實，不對鏈上錢包模組本身斷言。
