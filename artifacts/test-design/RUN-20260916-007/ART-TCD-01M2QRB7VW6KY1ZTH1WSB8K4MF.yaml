      quote: 站台處於「開通」或「更新待審」狀態下，若前台或後台網域有異動，儲存後自動切換；待技術部門完成設定後由 Admin 人工切回「開通」／站台為「開通」或「更新待審」時，儲存若有網域新增或刪除，系統自動切為「更新待審」；適用於所有角色
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: iteration 1 版本的 quote 逐字擷取自 requirements.yaml REQ-SITELIST-017 的 rejection_contract.description 欄位（『僅「開通」與「更新待審」兩狀態下的網域異動觸發此規則，其餘狀態不觸發』），卻呈現成
      spec.md 原文，這段話實際上並非 spec.md 逐字文字（Validator 已指出）。iteration 2 修訂已改引 spec.md 兩處真實原文——「站台狀態」表格「更新待審」列（第 58 行）的觸發說明，以及「業務規則與驗證」表格「網域異動觸發」列（第
      185 行）；兩處皆只明確列出「開通」與「更新待審」兩個狀態會因網域異動而觸發自動切換，未提及任何其他狀態。本 TC 斷言的『待開通/暫停/關閉狀態下網域異動不觸發』，是從這兩處條文的封閉列舉（只定義了這兩個狀態會觸發，未定義其他狀態也會觸發）推導出的否定推論，而非
      spec.md 逐字包含『其餘狀態不觸發』這句話本身，在此誠實揭露這個推論過程，避免讓執行者誤以為 spec.md 有一句逐字的『其餘狀態不觸發』。本輪（iteration 3）進一步修正：iteration 2 的 quote 欄位用『』括起兩處原文中的狀態名稱，但
      spec.md 第 58、185 行實際引號風格是「」、且原文本身沒有巢狀括號結構（不是『「」中再包一層『』』），iteration 2 的『』屬於 Test Designer 自行加註強調、並非逐字重現spec.md 的引號字元，Validator
      指出此風格不一致（minor-turned-major，因與 REQ-SITELIST-002 那次逐字性錯誤同屬一類問題）。本次已將 quote 改為兩段用「／」分隔的純逐字句子，句子內部的狀態名稱一律用 spec.md 原文的「」括號，不再使用『』；REQ-SITELIST-017
      的 rejection_contract.defined=true 且以上兩處原文已足以支撐此推論，design_technique 用 equivalence_partitioning 是因為三個起始狀態（待開通/暫停/關閉）對同一觸發事件產生完全相同的結果（不觸發），屬同一等價類的多個代表值驗證。
