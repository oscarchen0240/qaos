    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: true
    source: spec_workflow
    design_rationale: 上層為機台／上層為線上是兩個獨立條件各自對應固定結果，屬合法的 decision_table（2×1 映射）；未使用 boundary_value 是因為這裡沒有數值邊界，純粹是類型繼承規則。
