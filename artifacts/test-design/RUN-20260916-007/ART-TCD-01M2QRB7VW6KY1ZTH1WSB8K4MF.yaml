      欄位已收斂為 spec.md「角色與權限」表格「狀態切換」列 Admin 欄的純原文「可切換為任意狀態」；iteration 1 版本的 quote 混入了 requirements.yaml REQ-SITELIST-016 spec_reference.quote
      欄位裡附加的括號註記「（『任意狀態』範圍已於 2026-09-14 由 Oscar 確認含待開通）」，這段確認記錄本身並非 spec.md 逐字文字，而是 RequirementModel 記載的產品確認（因為 spec.md『站台狀態』表格的『待開通』觸發方式只列『新建站台自動設定』，未直接列為
      Admin 可手動選取的目標狀態，此處存在解讀空間，已由 Oscar 於 2026-09-14 直接確認『任意狀態』的範圍包含待開通）。本次修訂已將此確認記錄移至此處design_rationale 說明，expected_result
      中保留此註記則是為了讓執行者理解『四種目標狀態皆可切換』這個斷言範圍的依據，不影響 quote 欄位的純粹性。
