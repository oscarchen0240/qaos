    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: 『不影響既有餘額』原文語意是『這個場館設定的變更不會導致既有機台帳號的分數餘額被重算或歸零』，但『機台帳號餘額』的檢視畫面不在 SITELIST 而在 ACCOUNT 的機台資訊區塊；為維持系統邊界誠實，本
      TC 把『不影響』的斷言改為驗證『不會影響其他站台的同一份設定』這個 SITELIST 範圍內可觀察的部分，並在 expected_result 中明講為何不驗證餘額本身。
