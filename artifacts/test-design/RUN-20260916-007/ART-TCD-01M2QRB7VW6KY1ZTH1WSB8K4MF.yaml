    design_rationale: AC-0012/0013 明確描述『唯讀置灰』即為拒絕修改的方式，rejection_contract.defined=true 且原文有直接依據，不需假設；design_technique 標 negative
      因為這條本質是驗證『修改嘗試被拒絕』而非單純檢視顯示。
  - draft_id: TC-DRAFT-01M2NCSW5CF3M957FW8FTEYYS8
    title: 子站台的站台類型強制跟隨上層站台，UI 不開放個別選擇
    product: ba-admin
    functional_area: SITELIST
    requirement_ids:
    - REQ-SITELIST-002
    acceptance_criteria_ids:
    - AC-SITELIST-0021
    - AC-SITELIST-0022
    spec_id: SPEC-SITELIST-001
    spec_version: '0.4'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: critical
    risk: high
    execution_mode: manual
    preconditions: *id001
    test_data: []
    steps:
    - n: 1
      action: 取一個既有的機台類型站台（自行從環境中選定，或延用本批次已建立的機台根站台），在其底下點擊「+ 新增站台」，檢視站台類型欄位
    - n: 2
      action: 取一個既有的線上類型站台（自行從環境中選定；若環境中無既有的線上類型站台，可依 AC-SITELIST-0011 的操作路徑，即 TC-DRAFT-01M2NCSW5C2NPYX0YR2ATYY7QA 的 step1，另建一個線上根站台後使用），在其底下點擊「+
        新增站台」，檢視站台類型欄位
    expected_result: 前者：站台類型固定顯示為機台，UI 不提供選擇其他類型的控制項；後者：固定顯示為線上，UI 同樣不開放選擇
    expected_result_spec_reference:
      spec_id: SPEC-SITELIST-001
      spec_version: '0.4'
      location: §站台類型與機台專屬欄位 + §業務規則-站台類型隨主站台
      quote: 站台類型於主站台（根層）選定，子站台一律與主站台同類型、不可個別選擇
    assumptions: []
