    design_rationale: Phase2×3交叉比對整合：原版(v1)只有一個抽象步驟，直接假設「TXID對應的PENDING已被取代而不存在」這個前提狀態存在，並未真正操作出這個狀態，測試意義較弱。Phase3影子測試(RUN-20260916-002)對同一AC設計了兩個具體的真實觸發情境（櫃檯人工出金取消PENDING、新req-cashout取代舊PENDING），各自完整操作一遍才驗證end-cashout回1-NO
      RECORD。其中「新req-cashout取代」這個觸發路徑已由AC-CASHFLOW-0191/TC-CASHFLOW-022涵蓋（同樣測試舊PENDING失效），不重複建立；本版改用「櫃檯人工出金取消PENDING」這個Phase2原本沒有具體操作到的真實觸發路徑取代原版的抽象假設。
