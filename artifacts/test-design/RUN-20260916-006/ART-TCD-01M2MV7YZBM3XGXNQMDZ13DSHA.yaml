      action: 確認該筆出金 PENDING 是否被同時取消
    - n: 4
      action: 以原 TXID 呼叫 end-cashout
    expected_result: 櫃檯執行人工出金的同時，系統同時取消該機台尚未完成的出金 PENDING；之後以原 TXID 呼叫 end-cashout 因查無有效對應 PENDING 而回 1-NO RECORD，僅記錄 log
      後丟棄、不變更任何資料，避免同一筆錢被領兩次
    expected_result_spec_reference:
      spec_id: SPEC-CASHFLOW-001
      spec_version: '0.1'
      location: §四種金流/出金
      quote: end-cashout 查無對應 PENDING 或 TXID 不符時，僅記錄 log 並回 1-NO RECORD，不變更任何資料
