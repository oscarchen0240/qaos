    design_rationale: Phase2×3交叉比對整合（第二次迭代）：原版(v1)只有一個抽象步驟，直接假設「TXID對應的PENDING已被取代而不存在」這個前提狀態存在，並未真正操作出這個狀態。Phase3影子測試(RUN-20260916-002)對同一AC設計了兩個具體的真實觸發情境（櫃檯人工出金取消PENDING、新req-cashout取代舊PENDING），各自完整操作一遍才驗證end-cashout回1-NO
      RECORD。第一次迭代誤判「新req-cashout取代」路徑已由TC-CASHFLOW-022涵蓋而只保留情境一，但經獨立Validator查證，TC-CASHFLOW-022（AC-CASHFLOW-0191）只測PENDING狀態轉換本身（既存PENDING被標記失效、建立新PENDING），完全沒有測「用舊TXID呼叫end-cashout確認回1-NO
      RECORD」這個後半段——AC-CASHFLOW-0221自己的given範例明講的情境因此被錯誤砍掉。本版修正為同一條TC內包含情境一、情境二兩個完整操作流程，不遺漏任何一個真實觸發路徑。
