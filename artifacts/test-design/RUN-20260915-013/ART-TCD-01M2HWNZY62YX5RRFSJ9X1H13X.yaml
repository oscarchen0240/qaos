  - draft_id: TC-DRAFT-01M2HWNZY34QA7AMY7KPGMZGPJ
    title: 可提領餘額恰為 10 USDT 時不可於前台申請出金（邊界值，剛好不達門檻）
    product: ba-admin
    functional_area: MEMBER
    requirement_ids:
    - REQ-MEMBER-005
    acceptance_criteria_ids:
    - AC-MEMBER-007
    spec_id: SPEC-MEMBER-001
    spec_version: '0.2'
    test_level: integration
    test_types:
    - boundary
    design_techniques:
    - boundary_value
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 此規則定義於帳務資訊「可提領餘額」欄位（見 §2.1.4 / §2.1.5）：後台此欄位只是唯讀顯示，通篇 spec 沒有描述後台有可點擊的「申請出金」入口；「申請出金」是會員在前台自行操作的功能，後台頂多是透過「人工提出」代為出金，但那是後台人員主動操作、不受此門檻文字描述的「申請」語境限制，spec
      也未說明人工提出是否套用同一道門檻。因此本規則實際生效與可驗證的入口是會員前台的申請出金功能，不在 ba-admin 後台範圍內（見 assumptions）
    - 需要一名會員的「可提領餘額」恰為 10.00 USDT。spec 分別定義了帳戶餘額（主錢包）『即時可用餘額』、提領所需有效投注額（流水錢包）『會員需達到此投注額方可提領』、可提領餘額『目前符合提領條件的金額』三個獨立欄位，也定義了人工存入/提出的『金額』直接影響主錢包餘額、『稽核』設定該筆金額所需完成的可提領投注倍數（見
      REQ-MEMBER-011，同批 TC 已示範稽核倍數會使『提領所需有效投注額』增加，不是單純把存入金額加回可提領餘額）——但 spec 全文並未給出『可提領餘額』如何由前述欄位換算得出的公式，也未定義稽核=1時存入金額是否、以及何時會反映到可提領餘額。因此本
      TC 不預設任何特定存入/提出金額與稽核倍數組合能『精確且立即』把可提領餘額調到 10.00 USDT（見 assumptions）。佈置方式：透過人工存入/人工提出反覆調整，每次調整後回到帳務資訊區塊查看實際顯示的可提領餘額數值，直到確認顯示值恰為
      10.00 USDT 為止，不依賴任何計算公式預先斷定應存入/提出多少金額
    test_data:
    - name: 可提領餘額
      value: 10.00 USDT
    steps:
    - n: 1
      action: 於後台帳務資訊區塊確認可提領餘額顯示為 10.00 USDT
    - n: 2
      action: 以該會員身分登入會員前台，進入出金/提領申請功能
    - n: 3
      action: 嘗試送出出金申請
    expected_result: 前台阻擋出金申請（規則為『須大於10 USDT』，剛好等於10不符合條件）：申請入口不可用，或送出後被系統拒絕而未成功送出
    expected_result_spec_reference:
