  - draft_id: TC-DRAFT-01M2H1GPXP27QTFHSJCPA3ZAZV
    title: 會員列表 KYC 狀態欄五個圖示依各階段狀態正確顯示對應顏色與 Tooltip
    product: ba-admin
    functional_area: MEMBER
    requirement_ids:
    - REQ-MEMBER-003
    acceptance_criteria_ids:
    - AC-MEMBER-004
    spec_id: SPEC-MEMBER-001
    spec_version: '0.2'
    test_level: ui_e2e
    test_types:
    - functional
    design_techniques:
    - decision_table
    priority: high
    risk: medium
    execution_mode: manual
    preconditions:
    - 以 Admin 登入後台
    - 進入 會員與加盟商 > 會員列表
    - 準備（或合併觀察多名互補的）測試會員，使五個 KYC 階段合計涵蓋已核准、審核中、待補件、未申請、已停用五種狀態——已核准/待補件可由後台人員於會員詳細頁 KYC 狀態區塊分別執行「通過」/「駁回」取得；審核中須為會員已透過前台送出、後台尚未審核的既有測試帳號；已停用須為該站台已停用某
      KYC 階段的既有設定，此設定不在本 spec 範圍內，需洽環境負責人準備
    test_data: []
    steps:
    - n: 1
      action: 於會員列表找到目標會員，檢視其 KYC 狀態欄五個圖示（由左至右對應：個人基本資訊、身分證明文件、身分證件自拍、居住地址、資產證明）
    - n: 2
      action: 逐一核對每個圖示顏色是否對應該階段目前的實際狀態（綠=已核准、橘=審核中、紅=待補件、淺灰=未申請、深灰=已停用）
    - n: 3
      action: 滑鼠移至任一圖示，確認顯示 Tooltip
    expected_result: 五個圖示顏色分別正確對應各自階段的實際狀態；滑鼠移至任一圖示時顯示 Tooltip，內容包含該階段名稱與目前狀態文字
    expected_result_spec_reference:
      spec_id: SPEC-MEMBER-001
      spec_version: '0.2'
      location: §2.1.3 KYC驗證階段圖示說明
    assumptions: []
