  assumptions:
  - 機台出金申請本身的產生方式（現場即時核可、印出收據）屬機台端硬體現場流程，非本 spec 定義的後台 UI 操作；本 TC 假設測試環境的『洗分出金核實』頁面當下存在或可產生一筆狀態為『待核實』的機台出金申請供核實使用，若環境當下查無待核實項目，需洽環境負責人透過機台模擬工具或既有測試資料補上一筆，此步驟超出本
    spec 定義範圍
  - 機台開分／入金交易本身是玩家在機台端實際遊玩產生的紀錄，非後台 UI 可直接建立的動作；本 TC 假設測試環境當下已存在或可查得該機台帳號至少一筆已完成的開分或入金交易供查驗，若環境當下查無現成記錄，需洽環境負責人透過機台模擬工具產生，此步驟超出本
    spec 定義範圍
  - 本 TC 需要測試環境當下存在至少兩個不同的既有機台場館（操作員所屬場館 X 之外，另需一個場館 Y 作為『其他場館』對照）；若環境當下僅有一個機台場館，需先依既有機台場館的建立方式另外建立一個測試用機台場館 Y 才能執行本 TC 的對照比較
  - 本 TC 需要測試環境當下存在至少兩個不同的既有機台場館（操作員所屬場館 X 之外，另需一個場館 Y 且該場館有機台交易紀錄，作為『查無結果』的對照）；若環境當下僅有一個機台場館或場館 Y 無任何交易紀錄，需先洽環境負責人補上對應資料才能執行本
    TC 的對照比較
  - 『平台對既有遊戲發佈更新』的實際後台操作介面與具體步驟不在本 spec 定義範圍內（本 spec 僅描述此動作對機台場館產生的連帶效果，未定義觸發此動作的頁面路徑），需另比對遊戲管理相關 spec 或洽環境負責人確認實際觸發方式；本 TC
    假設可透過後台遊戲管理功能中的版本／更新發佈動作觸發，若實際操作路徑與假設不符，結果需人工複核
  - 『平台新增一款全新遊戲』的實際後台操作介面與具體步驟不在本 spec 定義範圍內，需另比對遊戲管理相關 spec 或洽環境負責人確認實際觸發方式；本 TC 假設可透過後台遊戲管理功能中的新增遊戲動作觸發，若實際操作路徑與假設不符，結果需人工複核
  - 同 REQ-PLATFORMRULE-021，『平台對遊戲發佈更新』的實際後台操作介面與具體步驟不在本 spec 定義範圍內，此處假設可透過後台遊戲管理功能觸發，且該次更新動作屬平台層級事件、會同時影響同一款遊戲在線上與機台場館兩側的預設狀態判斷；若實際操作路徑與假設不符，結果需人工複核
