    - 以 Admin 登入後台
    - 站台切換選單切換至一個既有的機台（TWD核心貨幣）站台（建議使用測試專用場館，避免影響其他測試或正式資料）
    - 進入 帳務管理 > 鏈上錢包管理，切至「法幣 TWD」頁籤，找到 TWD 幣別列，確認其目前為啟用狀態，將其切換為停用（此為刻意保留的止損操作，依REQ-BONUSCCY-004規則本身應允許停用）
    - 確認鏈上錢包管理列表中 TWD 幣別狀態已顯示為停用
    - 取得該站台一台既有機台帳號可用的機台憑證（JWT），或使用測試環境提供的機台模擬工具/API client 代替實體機台呼叫平台API（此驗證方式的API格式依據SPEC-ARCADE-001附錄「機台系統對接規格」，非BONUSCCY-001本身定義範圍，僅作為測試執行環境依據；實際測試環境是否已具備此類模擬工具，需環境負責人確認）
    test_data: []
    steps:
    - n: 1
      action: 記錄該機台帳號目前的分數（餘額）
    - n: 2
      action: 以該機台帳號的憑證呼叫平台 req-cashin（第一階段請求） API，代入一筆正常測試金額，模擬機台送出入金請求
    - n: 3
      action: 檢視 API 回覆內容，並至 各式報表 > 交易紀錄查詢 檢視該機台帳號是否新增對應交易紀錄
    - n: 4
      action: 重新檢視該機台帳號的分數（餘額）
    expected_result: 平台拒絕該筆入金請求（不論回覆的具體原因文案為何——依rejection_contract.description，spec未給定文案，僅驗證是否被阻擋）；該機台帳號的分數（餘額）維持不變，不因此筆請求而異動
    expected_result_spec_reference:
      spec_id: SPEC-BONUSCCY-001
