      location: §一句話（限制段落）
      quote: 補充（2026-09-15 PM確認）：核心貨幣所對應的錢包幣別可停用作即時止損用途，停用後入金/出金/開分/洗分四項操作皆須被阻擋
    assumptions: []
    automation_status: not_automated
    ci_eligible: false
    hotfix_eligible: true
    execution_cost: medium
    stability: unknown
    critical_path: false
    source: spec_workflow
    design_rationale: REQ-BONUSCCY-004的rejection_contract.defined=true（PM 2026-09-15已明確確認規則），故以確定規則而非exploratory方式撰寫；behavior_kind=rejection，test_types標negative符合結構化規則。入金屬於機台廠商API觸發的操作（見SPEC-ARCADE-001附錄，req-cashin（第一階段請求）），後台管理系統本身沒有對應的按鈕可直接點擊操作——這與『人工存入/人工提出』（REQ-BONUSCCY-003，後台確有按鈕）是完全不同的兩組功能，不可混淆；故test_level標為api，以直接呼叫API或機台模擬工具代替，並在precondition中誠實說明此驗證方式依賴的測試環境條件。
