    - n: 2
      action: 點擊「人工提出」開啟面板，金額欄填入一筆不超過目前TWD餘額的測試金額，稽核欄位維持預設值，前台備注與後台備注皆填寫必填文字，幣種選擇欄位維持固定顯示的 USDT（無法切換），點擊「儲存」
    - n: 3
      action: 重新整理/回到會員詳細頁，檢視核心貨幣（TWD）錢包餘額
    expected_result: 該會員核心貨幣（TWD）錢包餘額較提出前減少所填寫的金額；金額確實從站台核心貨幣（TWD）扣除，而不是寫死的 USDT（若舊行為的錯誤仍存在，TWD餘額將不會減少、或因找不到USDT餘額扣款而失敗，可藉此判斷）
