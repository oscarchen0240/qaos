      DoS；額度上限改於 end-cashin（依入鈔機實際清點金額）判定，超限則退鈔。RM REQ-CASHFLOW-007／009 已反轉，本 TC 依新規則重寫斷言方向。ADR-008 影響掃描判定需修訂。
