      action: 【乙先、甲後，皆成功】甲、乙重新開啟『追加預算』視窗（兩邊都顯示 7000）；乙輸入 8000 並確認；之後甲（視窗仍顯示過期的 7000）輸入 9000 並確認
      expected: 兩筆皆成功，總預算 9000；7.4 操作紀錄再新增 2 筆，依序為：調整前 7000、調整後 8000（乙）；調整前 8000、調整後 9000（甲）（筆數＝L0＋3）
    - n: 4
      action: 【API 並行送出，至少 3 個有效輪】每輪起點總預算為 B（第 1 輪 B＝9000，之後為上一輪結果）；甲、乙以各自帳號的憑證，用 API 工具腳本同時送出：甲追加為 B＋2000、乙追加為 B＋1000，並依『逐請求時間記錄』記下兩個請求的
        t_send、t_resp 與回應（人工在畫面上同時按下只當補充觀察，不計有效輪）
      expected: 每輪依 max(t_send) < min(t_resp) 判定是否有效，無效者作廢重做。有效輪：最終總預算＝B＋2000，任何時點查詢到的總預算都不低於前一時點（不得出現總預算下降）。7.4 操作紀錄本輪新增
        1 或 2 筆，並以『操作人員』欄判定哪個帳號的請求成立：若乙（較小值）先成立，為『B→B＋1000』（乙）、『B＋1000→B＋2000』（甲）兩筆；若甲先成立，只有『B→B＋2000』（甲）一筆，乙的請求被拒絕；不得出現調整後不大於調整前的紀錄，也不得出現前後不連續的紀錄（某筆的調整前不等於前一筆的調整後）
    - n: 5
      action: 回到『活動排程 > 紅包活動』檢視該活動預算使用
      expected: 總預算＝9000＋2000×有效輪數，狀態『進行中』
    - n: 6
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 兩位管理員從相同的『目前總預算』出發各自追加時，後端以最新的總預算檢查：新預算不大於目前總預算者被拒絕、資料不變；總預算只會升高（最終為較大值），7.4 操作紀錄每筆的調整前等於前一筆的調整後，沒有調整後不大於調整前的紀錄。
