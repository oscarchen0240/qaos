      199 行『有待開啟紅包時，於重置前 1 小時起提示』以『重置』為基準。『提示以新重置點計』是我由這兩條組合推得的結論，spec 沒有一句話直接寫『日結時間變更後提示起點隨之改變』，這點在此明講；若提示仍照舊重置點計，會出現 19:50
      仍提示或 21:05 不提示，兩者皆與『重置前 1 小時』矛盾。19:25 的對照檢視（調晚前確實提示）讓『19:50 不提示』是因為變更而非提示功能失效。P1 於 20:10 仍待開啟是調晚規則的直接結果（AC-0116：不立即重置）。技術標
      scenario（多步驟時序流程，不是單一邊界）。還原日結時間的副作用已在清理步驟註明；時間點（19:20、19:30、22:00）是我為了讓全案在 2 小時內完成而選的，非 spec 值。【Validator minor】本案斷言『不顯示提示』『未被原重置點作廢』皆為反向斷言，test_types
      補 negative。
