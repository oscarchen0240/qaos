    design_rationale: 二次抽查 RF-03（high，APR-0205）：本批併發補強只有線上領取 vs 取消排程；機台上『確認領取紅包』與洗分同時送達沒有 API 層並行案例（TC-REDPACKET-213 為人工或代理同時送出、無逐請求時間證據；068／089／185
      都是先送出交易再嘗試領取）。依據第 400 行『紅包入帳與機台洗分／出金使用同一把帳號鎖：洗分或出金請求送出後、交易完成前，紅包不可開啟』、第 398 行『完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢』，以及 SPEC-CASHFLOW-001『throshold=0
      表示洗出當前全部餘額』。由鎖推得只有兩種結果：領取先成立（紅包已入帳，之後全洗含這 20）或洗分先成立（紅包作廢、不入帳）；守恆式（最終分數＝S1＋入帳金額－洗分核可金額＝0）可偵測『已入帳但洗分沒算入、20 殘留』這類缺陷，不依賴
      spec 未定義的稽核扣除算法（因此稽核倍數取 0；CLR-REDPACKET-056 未答）。洗分用 mode=all、throshold=0 是讓最終分數必為 0，便於守恆判定；數字 200／100／20 是我選的，非 spec
      值。技術標 state_transition（待開啟→已入帳 vs 待開啟→已作廢互斥）＋error_guessing（競態推測）。T22 是 TC-REDPACKET-213 的強化版（同樣的活動設定、5 輪、(甲)(乙)二分；多了
      API 並行、逐請求時間證據與有效輪判定、throshold=0 全洗與守恆式），核准時將退役 TC-213（退役由主 session 在核准後執行，本 run 不修訂 TC-213）。【APR-0208】新增稽核前提：出金設定 TWD
      稽核倍數為 0 且 M1 無未完成稽核（SPEC-CASHFLOW-001 第 51、59 行），不成立就停止回報；(甲)(乙) 只以最終狀態歸類，回應只記錄。
