    design_rationale: RF-03：機台『每月 1 日』重置沒有 TC。TC-165 只驗每週一、TC-167 只驗線上 UTC+0 00:00 的月切分；日結時間 UTC+0 20:00 時，新月份的營業日起點落在 UTC+0
      月底最後一天 20:00，是日期跨月邊界最容易算錯之處。依據第 382 行『每月自 1 日的營業日起算』與第 361 行的機台範例。取 D 19:50／20:10 為日結時間兩側各 10 分鐘（沿用 TC-165 的取法），技術 boundary_value。三個鑑別點：(1)
      19:50 未重置、20:10 重置（不在 UTC 日曆換月時才重置）；(2) 重置後再結算 50＋50 才產生紅包，鑑別『累計是否真的歸零』（若餘量 50 被帶入，第一個 50 就會產生紅包）；(3) D+1 00:10／00:20
      仍未重置且累計延續 200，鑑別『是否另外在 UTC 日曆換月再重置一次』。『營業日 1 日＝台灣日期 1 日（D 20:00 UTC+0 起）』是依第 361 行與 AC-0119 的台灣時間寫法對應，spec 未對『月』另寫範例，已在前置條件揭露，本案沿用
      TC-165 同一對應。此案受日曆限制，一個月只能執行一次。【Validator minor】AC-0111 是線上 UTC+0 每日重置的 AC，對應不準，已自 acceptance_criteria_ids 移除，只保留 AC-0119（機台每週一的營業日起算，最接近）。
