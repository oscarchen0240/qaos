    description: 機台場館紅包金額帶 1 位小數：2 位小數（10.55）被擋；固定 10.5 的入帳分數、4.1／4.4、日結報表金額僅記錄（CLR-REDPACKET-058 待覆）
    product: ba-admin
    functional_area: REDPACKET
    requirement_ids:
