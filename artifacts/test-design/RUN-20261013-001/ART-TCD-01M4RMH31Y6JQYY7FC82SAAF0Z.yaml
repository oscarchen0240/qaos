    source_ref: RF-07；RUN-20261012-002 TCRiskReview ART-TRR-01M4QS6XAG0068DH4QNEGTA01T
    design_rationale: RF-07：總預算是整個活動共用一池（第 68 行），但預算邊界目前只用單一帳號依序結算測試（TC-REDPACKET-038／039／171）。多個帳號幾乎同時達標而剩餘預算只夠其中一個時，若『抽出金額與剩餘預算比較、占用扣除』不是原子操作，會超發。預期完全由
      spec 推出，不需新假設：第 392 行『抽出的金額大於剩餘預算時，不產生該紅包』＋第 391 行『占用＝已入帳＋待開啟』⇒ 占用不可能大於總預算；固定 30 對剩餘 30 恰好足夠一次，之後剩餘 0 小於 30，所以恰 1 個。用盡後其餘兩人該門檻不產生且不補發（第
      392 行）。不指定誰取得紅包、不指定先後。技術標 error_guessing（競態推測）；同時送出無法保證每輪都撞上競態，故 5 輪，缺陷只要出現任一輪就成立。『三人先各 90、再各 10』是我為了讓三筆注單在同一瞬間恰好達標而設計的佈置，非
      spec 值；它依賴『有效流水貢獻 10 的注單可被精準結算』這個環境前提，已揭露。【APR-0205 二次抽查 RF-02（medium）】原版只寫『同時送出無法保證每輪都撞上競態、重複多輪』，沒有證據證明後端真的並行處理（注單是非同步計入，第
      399 行；若後端經佇列逐筆處理，重跑多輪也只是循序情境）。本版補：逐請求 t_send／t_resp 與有效重疊判定（max(t_send) < min(t_resp)）、向工程取得後端處理時間證據（結算處理 log 時間戳或紅包明細產生時間）確認處理區間重疊，無證據的輪次作廢重做；並在前提要求先向工程確認結算是否一律序列化——若是，本案只算『循序一致性驗證』，不宣稱已驗證併發。預期斷言不變。
