    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分，使機台帳號有分數可下注；開分流程與開分對紅包的影響 spec 本案未定義（spec 只規定洗分／出金完成才會作廢待開啟紅包），本案除指定步驟外不洗分、不出金
    - 機台帳號 M1（自行從環境中選定，本週期無注單）；領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    - 整個測試須在同一個營業日內完成，且避開場館日結時間前後 30 分鐘（日結時間見『後台管理員系統 > 站台列表』該機台站台的『日結時間』），否則日結結算會結束進行中的場次、每日重置會干擾累計與待開啟紅包
    - 【狀態註記】CLR-REDPACKET-058（機台場館的紅包金額是否應限制為整數；若允許 1 位小數，機台入帳後的分數、4.1／4.4 金額、日結報表紅包金額是否都照記含小數）尚未回答，所以本案除步驟 1 的『2 位小數被擋』（spec
      明文：紅包金額最多 1 位小數）外，其餘斷言都是 exploratory：只記錄實際結果、不判定 PASS／FAIL。CLR-058 答覆為『機台限整數』時，本案步驟 2 起失效
    - 【範圍註記】本案只驗紅包入帳後的機台分數、4.1／4.4 與場館日結報表；玩家之後以帶小數的餘額結算出金（收據面額、付現、小數殘值）屬機台金流範圍（CLR-CASHFLOW-007 的收據小數處理），不在本案斷言範圍
    test_data:
    - name: 紅包金額
      value: 先填 10.55（2 位小數，應被擋）；再填 10.5（1 位小數，CLR-058 待覆，只記錄）
    - name: 活動
      value: 門檻 100／單週期上限 5／稽核倍數 0（步驟 1）→ 1（步驟 2）／每日重置
    - name: 下注
      value: M1 有效流水貢獻 100（入帳前）；領取後不再下注
    steps:
    - n: 1
      action: 【精度上限的另一側】進入機台場館『優惠活動管理 > 新增優惠活動』建立紅包活動『RP-ARC-DEC』（永久）：每日重置；預設規則門檻 100／單週期上限 5／獎勵方式『固定金額』紅包金額填 10.55（2 位小數）／稽核倍數
        0；點『儲存』
      expected: 紅包金額欄標紅框、下方提示『最多 1 位小數』，不建立活動（AC-0391；此步驟為 spec 明文的確定斷言）
    - n: 2
      action: 把紅包金額改為 10.5、稽核倍數改為 1，再點『儲存』
      expected: 【exploratory，僅記錄】記錄是否可儲存：若出現機台稽核警告（稽核倍數大於 0），確認後儲存；若 10.5 被擋下，記錄提示文字並結束本案（後續步驟不適用，並回報 CLR-058 的實際行為）
    - n: 3
      action: 店員對 M1 開分 200，使 M1 進入進行中場次；M1 結算有效流水貢獻 100（下注輸贏使分數增減屬正常）
      expected: 【僅記錄】是否產生 1 個待開啟紅包 P1；紅包明細中 P1 的『紅包金額』顯示什麼（參考：10.5）
    - n: 4
      action: 【入帳前基準】記下 M1 目前分數 S1（機台畫面；分數的顯示位置與小數位呈現方式 spec 未定義）。至『各式報表 > 場館日結報表』：統計維度『依場次明細』、機台帳號填 M1、結算日期選今天（含此刻）；找到 M1
        進行中場次那一列，記下該列的『紅包金額』R0，以及期初餘額、開分金額、進鈔金額、損益、洗分金額、收據金額、期末餘額
      expected: 已記錄基準值 S1、R0 與各欄。自此步驟起到最後一次查詢日結報表為止，M1 不再下注、不洗分、不出金
    - n: 5
      action: M1 依領取流程領取 P1，記下領取後的 M1 分數 S2
      expected: 【僅記錄】S2 與 S1 的差值（參考：10.5，是否被取整或四捨五入）；畫面顯示的小數位
    - n: 6
      action: 回到紅包明細檢視 P1
      expected: 【僅記錄】P1 狀態、紅包金額、稽核倍數、入帳時間
    - n: 7
      action: 至『各式報表 > 交易紀錄查詢』（機台視角），只篩選 M1 的會員編號，檢視交易類型下拉選單，並選交易類型『紅包』查詢
      expected: 【僅記錄】交易類型下拉是否含『紅包』、M1 的『紅包』紀錄筆數，以及該列的場次編號、交易狀態、核實狀態與各欄實際內容（含哪些欄位顯示金額、金額是否為 10.5）
    - n: 8
      action: 至『各式報表 > 稽核明細』（機台場館視角），篩選 M1 的帳號、類型『紅包』
      expected: 【僅記錄】是否新增『紅包』紀錄；其金額、所需有效投注額與單位（參考：10.5／10.5／TWD）
    - n: 9
      action: 回到『場館日結報表』，以『入帳前基準』步驟相同的條件重新查詢，找到同一個場次列，記下『紅包金額』R1 與各欄
      expected: 【僅記錄】R1 與 R0 的差值（參考：10.5）；以該列顯示的數字驗算 期初餘額＋開分金額＋進鈔金額＋紅包金額＋損益－洗分金額－收據金額 是否等於期末餘額，記下驗算結果與差額
    - n: 10
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 紅包金額 10.55（2 位小數）被擋下、不建立活動（確定斷言）。其餘為 exploratory、僅記錄不判定：固定 10.5 能否儲存、入帳後機台分數變化、4.1／4.4 紅包列金額、日結報表紅包金額與餘額驗算結果（待
      CLR-REDPACKET-058 答覆後轉為斷言）。
