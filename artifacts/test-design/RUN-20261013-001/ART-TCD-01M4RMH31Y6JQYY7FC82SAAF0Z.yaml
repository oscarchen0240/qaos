      action: 【前提檢查】進入『帳務管理 > 出金設定』TWD 頁籤，確認稽核倍數為 0；至『各式報表 > 稽核明細』（機台場館視角）篩選 M1，確認沒有未完成的稽核
      expected: 稽核倍數為 0、M1 沒有未完成稽核；任一不符則停止本案並回報（不判定 PASS／FAIL）
    - n: 2
      action: 建立機台場館紅包活動『RP-ARC-LOCK』（永久）：每日重置；預設規則門檻 100／單週期上限 20／固定 20／稽核倍數 0（避免稽核扣除干擾，扣除算法見 CLR-REDPACKET-056 尚未定案）；儲存
      expected: 建立成功
    - n: 3
      action: 【每一輪】先確認 M1 在稽核明細沒有未完成稽核（有則停止並回報）；店員對 M1 開分 200；M1 結算有效流水貢獻 100（下注輸贏使分數增減屬正常）；到紅包明細記下新產生的待開啟紅包 P 的紅包編號，並記下 M1
        目前分數 S1（機台畫面或後台日結報表，S1 須大於 0）
      expected: 產生 1 個待開啟紅包 P（金額 20）；已記錄 S1
    - n: 4
      action: 【每一輪】以腳本『並行送出』兩個請求：(i) M1 的領取 API（帶 P 的紅包編號）；(ii) M1 機台憑證的 `req-cashout`（出金第一階段，不帶 throshold）。並依『逐請求時間記錄』記下兩個請求的
        t_send、t_resp 與回應內容（`req-cashout` 回應含 TXID）
      expected: 兩個請求都已送出並得到回應；依 max(t_send) < min(t_resp) 判定該輪是否有效，無效者作廢、重做新的一輪（若已建立 PENDING，先用 `end-cashout` 完成該筆出金再重新佈置）
    - n: 5
      action: 【每一輪，僅有效輪，出金完成前】檢視 P 的紅包明細、『交易紀錄查詢』（機台視角）本輪的『紅包』與出金交易（含出金核可金額與狀態）
      expected: 結果只有兩種組合：(甲) 領取先成立：P『已入帳』、交易紀錄『紅包』＋1 筆（20）、出金 PENDING 的核可金額 ＝ S1＋20（`req-cashout` 當下的全部餘額，含剛入帳的 20）；(乙) 出金請求先成立：領取被拒（出金停在『待確認』期間紅包不可開啟）、P
        仍『待開啟』、交易紀錄沒有新增『紅包』、出金 PENDING 的核可金額 ＝ S1。不得出現其他組合（例如 P『已入帳』而出金核可金額 ＝ S1）。【僅記錄】重新整理或重新開啟 M1 紅包視窗後，記錄領取按鈕的狀態（參考：停用並顯示『交易處理中』；出金由腳本直接打
        API 注入，前台畫面是否同步 spec 未定義，不判定）
    - n: 6
      action: 【每一輪，僅有效輪】以 `req-cashout` 回應的 TXID，用 M1 機台憑證送出 `end-cashout`（出金第二階段，扣分完成），再檢視 P、M1 最終分數、出金交易與『紅包』交易
      expected: 出金完成（扣分成功）、M1 最終分數 0（守恆式：最終分數 ＝ S1 ＋ 入帳金額 － 出金核可金額 ＝ 0）。(甲) P 維持『已入帳』（不被作廢）；(乙) P 變為『已作廢』、作廢原因『機台出金』、交易紀錄始終沒有『紅包』。不得出現：最終分數不是
        0（20 殘留或被加回）、P 既『已入帳』又『已作廢』、交易紀錄與分數對不上。(甲) 的稽核明細『紅包』筆數只記錄（稽核倍數 0），(乙) 沒有新增『紅包』稽核紀錄
    - n: 7
      action: 【每一輪，僅有效輪】以最終狀態歸類：依出金完成前後觀察到的紅包狀態、交易紀錄、出金核可金額與最終分數，歸入(甲)或(乙)，記入結果表；兩個請求的回應內容只記錄
      expected: 每個有效輪只能歸入(甲)或(乙)其中一種（歸類只看最終狀態）；回應若與最終狀態不一致，另記為觀察事項，不影響本案 PASS／FAIL，待 CLR-REDPACKET-059 定義回應語意後再轉為斷言
    - n: 8
      action: 【每一輪結束】回到步驟 3 進入下一輪；累計有效輪數達 5 才結束，無效輪不計
      expected: 有效輪數 ≥ 5；(甲)(乙)出現次數一併記錄
    - n: 9
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 領取與出金請求以 API 並行送出（有效輪）時，鎖使兩者只有一方先成立：(甲) 領取先成立＝紅包已入帳、出金核可金額含這 20；(乙) 出金先成立＝領取被拒、紅包待出金完成後作廢（機台出金）、核可金額不含這
      20。出金完成後 M1 分數為 0，紅包狀態、交易紀錄、稽核明細與分數彼此一致；有效輪數不足 5 時不得判通過。
