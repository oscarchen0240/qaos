    design_rationale: RF-09 (2)＋二次抽查 RF-01（high，APR-0205）：原版允許『兩人口令同時按下』或腳本二擇一，人工按鍵時差通常是數百毫秒，後端幾乎一定循序處理，多跑幾輪也只是多驗循序情境，且沒有逐請求時間證據。本版改為只計
      API 層腳本並行（人工同時按下只當補充觀察、不計有效輪），雙方用不同帳號憑證，並以 max(t_send) < min(t_resp) 判定每輪是否真的重疊，無效輪作廢重做，有效輪數不足不得判通過。預期仍只用 spec 的狀態規則：待開啟→已入帳（領取）與待開啟→已作廢（活動結束）互斥；已作廢『不可復原』（第
      160 行）、已入帳不受重置／作廢影響（第 397 行）、取消排程時未開啟紅包一併作廢（第 217 行）。(甲)(乙)的歸類只看最終狀態（APR-0208 advisory：領取 API 的回應語意 spec 未定義，CLR-REDPACKET-059
      還在問，不能用回應歸類或判定）；回應只記錄，與最終狀態不一致時另記觀察事項。技術標 state_transition（兩個互斥的終態轉換）＋error_guessing（競態推測）。
