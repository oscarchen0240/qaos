      遊戲』
    - 主站台 A（線上、核心貨幣 USDT）底下有子站台 A1；備妥 A 的『站長』與『管理員』後台帳號各一（所屬站台皆為 A）。A1 目前沒有進行中或排程中的紅包活動
    - 由 A 的管理員切到 A1 建立活動『RP-SUB』（永久、活動幣種 USDT、預設規則門檻 100／上限 5／固定 10／稽核 1、總預算 5000），並讓 A1 的一名既有會員結算有效流水貢獻 100，使紅包明細至少有 1 筆紅包；記下
      RP-SUB 的活動識別（供 API 呼叫使用，取得方式由工程告知）
    - 【環境註記】CLR-REDPACKET-054 已回答：線上站長在紅包功能的範圍為自身站台、不含子站台，與 SPEC-ROLEPERM-001@0.2 通則（站長管轄含子站台）不一致，PM 以文件問題另行處理中；本案依 CLR-054
      的回答設計（沿用 TC-REDPACKET-178 的做法）。若 PM 最後改採通則，本案步驟 2～6 的預期需修訂
    test_data:
