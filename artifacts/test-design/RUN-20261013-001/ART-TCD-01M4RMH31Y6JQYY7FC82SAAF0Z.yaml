    - name: 並行動作
      value: 玩家 A［確認領取］API（玩家憑證） vs 管理員『取消排程』API（管理員憑證）
    - name: 有效輪數
      value: 至少 5 個有效輪（max(t_send) < min(t_resp)）
    steps:
    - n: 1
      action: 【每一輪】建立活動『RP-RACE-n』（永久）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 10／稽核 1；總預算 100；每日重置；儲存。記下玩家 A 的 USDT 錢包餘額 W0、交易紀錄『紅包』筆數
        N0、稽核明細『紅包』筆數 H0
      expected: 建立成功
    - n: 2
      action: 【每一輪】玩家 A 結算有效流水貢獻 100；到該活動的紅包明細記下紅包 P 的紅包編號
      expected: 產生 1 個待開啟紅包 P；預算使用 10 ／ 100
    - n: 3
      action: 【每一輪】以腳本『並行送出』玩家 A 的［確認領取］API 請求與管理員的『取消排程』API 請求（兩個請求各用自己的帳號憑證），並依『逐請求時間記錄』記下兩個請求的 t_send、t_resp 與回應內容
      expected: 兩個請求都已送出並得到回應；依 max(t_send) < min(t_resp) 判定該輪是否有效，無效者作廢、不檢視結果、重做新的一輪。回應內容與格式 spec 未定義（領取被拒時的訊息只記錄）
    - n: 4
      action: 【每一輪，僅有效輪】檢視玩家 A 的錢包餘額、交易紀錄『紅包』與稽核明細『紅包』筆數、該活動的狀態與紅包明細（P 的狀態、作廢原因、頂部『總預算（已占用／總預算）』）
      expected: 活動狀態『已取消』。結果只有兩種組合：(甲) 領取先成立：P『已入帳』（沒有被作廢）、錢包＝W0＋10、交易紀錄『紅包』＝N0＋1、稽核明細『紅包』＝H0＋1（所需有效投注額增加 10）、已占用 10 ／ 100；(乙)
        取消先成立：P『已作廢』、作廢原因『活動結束』、錢包＝W0、交易紀錄與稽核明細筆數不變、已占用 0 ／ 100。不得出現其他組合（P 既『已入帳』又『已作廢』、錢包增加但 P 為已作廢、錢包未增加但 P 已入帳、交易紀錄或稽核明細只寫一邊、占用與狀態不符）
    - n: 5
      action: 【每一輪，僅有效輪】以最終狀態歸類：依步驟 4 觀察到的紅包狀態、錢包、交易紀錄、稽核明細，歸入(甲)或(乙)，記入結果表；兩個請求的回應內容只記錄
      expected: 每個有效輪只能歸入(甲)或(乙)其中一種（歸類只看最終狀態）；回應若與最終狀態不一致（例如領取回應成功卻未入帳），另記為觀察事項，不影響本案 PASS／FAIL，待 CLR-REDPACKET-059 定義回應語意後再轉為斷言
    - n: 6
      action: 【每一輪結束】回到步驟 1 進入下一輪（上一輪活動已取消，可立即以相同時段重建）；累計有效輪數達 5 才結束，無效輪不計
      expected: 有效輪數 ≥ 5；(甲)(乙)兩種結果各出現幾次一併記錄（只出現其中一種不影響通過，但需註明未撞到另一種）
    expected_result: 領取與取消排程以 API 並行送出（有效輪）時只有一方先成立：(甲) 領取先成立＝紅包已入帳、錢包＋10、交易紀錄與稽核明細各 +1、預算仍占用 10；(乙) 取消先成立＝紅包已作廢（活動結束）、錢包與交易紀錄、稽核明細皆不變、預算釋放為
      0。不會既入帳又作廢，也不會只寫入其中一部分；有效輪數不足 5 時不得判通過。
