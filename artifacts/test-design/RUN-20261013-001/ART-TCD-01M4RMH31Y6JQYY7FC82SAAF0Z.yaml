      expected: 活動總預算變為 6000（預算使用 x ／ 6000）；7.4 操作紀錄只新增 1 筆：操作人員為本次登入帳號、活動名稱『RP-TOPUP-DUP』、調整前 5000、調整後 6000，筆數＝L0＋1。視窗是否關閉、後
        2 次點擊是被前端擋下或被後端拒絕及其提示，spec 未定義，只記錄
    - n: 2
      action: 【API 重放】以 API 工具用同一個後台帳號，把步驟 1 的追加預算請求（新總預算 6000）逐次重送 2 次
      expected: 兩次皆被後端拒絕（6000 不大於目前總預算 6000），總預算維持 6000；7.4 操作紀錄筆數仍為 L0＋1，沒有新增調整前 6000、調整後 6000 的紀錄
    - n: 3
      action: 【並送，至少 3 個有效輪】每輪起點總預算為 B（第 1 輪 B＝6000，之後為上一輪結果）；以腳本同時送出 3 個相同的追加預算 API 請求（新總預算 B＋1000，同一帳號），並依『逐請求時間記錄』記下 3
        個請求的 t_send、t_resp 與回應
      expected: 每輪依 max(t_send) < min(t_resp) 判定是否有效，無效者作廢重做。有效輪：恰有 1 個請求成功、其餘被拒絕；總預算變為 B＋1000；7.4 操作紀錄本輪只新增 1 筆：調整前 B、調整後
        B＋1000（不得出現重複的 B→B＋1000，也不得出現調整後不是 B＋1000 的值）
    - n: 4
      action: 回到『活動排程 > 紅包活動』與紅包明細頂部檢視該活動總預算
      expected: 總預算＝6000＋1000×有效輪數，活動狀態仍『進行中』；7.4 操作紀錄筆數＝L0＋1＋有效輪數
    - n: 5
      action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 追加預算被重複送出（連點、重放、並送；並送僅計有效輪）時：只有讓總預算變大的第一個請求成功並寫入一筆 7.4 操作紀錄，其餘新預算不大於目前總預算的請求被後端拒絕、資料不變、不寫入紀錄；總預算只增加一次。
