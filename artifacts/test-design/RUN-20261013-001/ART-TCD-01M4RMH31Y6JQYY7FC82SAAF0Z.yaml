    - 【時間窗與專用場館】本案要在場館日結時間（記為 Tc，於『後台管理員系統 > 站台列表』該機台站台查得，UTC+0）前後完成，並會暫時把日結時間調晚 2 小時。下文以 Tc＝UTC+0 20:00、調晚為 22:00 為例（Tc 不同時依實際值換算，新時點須晚於
