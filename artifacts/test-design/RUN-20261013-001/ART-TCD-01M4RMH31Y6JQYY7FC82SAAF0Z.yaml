    source_ref: RF-08 (2)；RUN-20261012-002 TCRiskReview ART-TRR-01M4QS6XAG0068DH4QNEGTA01T
    design_rationale: RF-08 (2)：單週期上限目前只用依序結算測試（TC-REDPACKET-028、161）。接近上限時多筆注單同時結算，若上限判斷與累計不是原子操作，可能產生超過上限的紅包。取『上限 2、已產生
      1、距下一門檻 90』剛好是上限邊界：第 389 行規定產生達上限的那個紅包時餘數保留、之後結算的注單不再計入；所以不論 5 筆如何交錯，只有 1 筆會讓累計跨過第 2 個門檻，第 2 個紅包的『週期累計』必為 190＋100＝290（明細『週期累計』＝產生當下的本週期累計，第
      289 行；與第 389 行例子 1,084 同口徑）。若出現第 3 個紅包，或第 2 個紅包週期累計大於 290，代表上限被繞過。技術標 boundary_value：上限數值邊界（上限 2、已 1、差 1）。『本期已達上限』顯示規則沿用第
      198 行與 AC-0317。【APR-0205 二次抽查 RF-02（medium）】原版只寫『同時送出無法保證每輪都撞上競態、重複多輪』，沒有證據證明後端真的並行處理（注單是非同步計入，第 399 行；若後端經佇列逐筆處理，重跑多輪也只是循序情境）。本版補：逐請求
      t_send／t_resp 與有效重疊判定（max(t_send) < min(t_resp)）、向工程取得後端處理時間證據（結算處理 log 時間戳或紅包明細產生時間）確認處理區間重疊，無證據的輪次作廢重做；並在前提要求先向工程確認結算是否一律序列化——若是，本案只算『循序一致性驗證』，不宣稱已驗證併發。預期斷言不變。
