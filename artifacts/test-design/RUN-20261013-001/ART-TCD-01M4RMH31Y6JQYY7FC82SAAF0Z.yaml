    design_rationale: RF-08 (1)：循環發放目前只用依序結算測試（TC-REDPACKET-027／028）。同一帳號多筆注單同時結算時，累計若有遺失更新，會少計或少產生紅包。預期由 spec 的循環計算推出：每累計滿門檻產生一個、超出續計（第
      388 行）；每筆注單恰 100＝每筆都剛好滿一個門檻，所以第 k 個紅包產生時的『週期累計』必為 100k（明細『週期累計』＝產生當下的本週期累計，第 289 行）。再單獨結算一筆 100 得第 6 筆、週期累計 600，是為了偵測『同時結算後累計是否正確留存』（遺失更新不一定在同時那一步就看得出紅包數）。技術標
      error_guessing；3 輪是因為競態不保證每輪都撞上。【APR-0205 二次抽查 RF-02（medium）】原版只寫『同時送出無法保證每輪都撞上競態、重複多輪』，沒有證據證明後端真的並行處理（注單是非同步計入，第 399
      行；若後端經佇列逐筆處理，重跑多輪也只是循序情境）。本版補：逐請求 t_send／t_resp 與有效重疊判定（max(t_send) < min(t_resp)）、向工程取得後端處理時間證據（結算處理 log 時間戳或紅包明細產生時間）確認處理區間重疊，無證據的輪次作廢重做；並在前提要求先向工程確認結算是否一律序列化——若是，本案只算『循序一致性驗證』，不宣稱已驗證併發。預期斷言不變。
