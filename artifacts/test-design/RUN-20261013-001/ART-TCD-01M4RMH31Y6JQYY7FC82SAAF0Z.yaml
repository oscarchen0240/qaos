      expected: 後端拒絕並回傳『無權限』；RP-SUB 仍為進行中
    - n: 4
      action: 站長身分對 RP-SUB 呼叫『查詢紅包明細』API
      expected: 後端拒絕並回傳『無權限』，不回傳任何紅包資料
    - n: 5
      action: 站長身分對 RP-SUB 呼叫『匯出 CSV』API
      expected: 後端拒絕並回傳『無權限』，不回傳 CSV 內容
    - n: 6
      action: 站長身分呼叫『新增紅包活動』API，目標站台為 A1（合法資料：活動名稱『RP-SUB-NEW』、區間約 100 天後～約 130 天後、其餘設定同 RP-SUB，時段不與 RP-SUB 重疊）
      expected: 後端拒絕並回傳『無權限』；A1 沒有新增活動
    - n: 7
      action: 以 A 的管理員切到 A1，檢視『活動排程 > 紅包活動』與 RP-SUB 紅包明細
      expected: RP-SUB 總預算 5000、狀態『進行中』、紅包明細筆數與步驟 1 相同；沒有『RP-SUB-NEW』（資料不變）
    - n: 8
      action: 清理：A 的管理員於 A1 對 RP-SUB 點『取消排程』並於確認視窗點『確認取消』
      expected: 已取消排程
    expected_result: 線上站長在紅包功能的範圍為自身站台、不含子站台（CLR-REDPACKET-054）：略過畫面直接以 API 對子站台 A1 的紅包活動追加預算、取消排程、查詢紅包明細、匯出 CSV、新增活動，後端一律拒絕並回傳『無權限』，A1
      的活動資料不變、不回傳資料；對照組中管理員可查詢 A1。
