    - AC-REDPACKET-0365
    spec_id: SPEC-REDPACKET-001
    spec_version: '0.2'
    test_level: api
    test_types:
    - functional
    - negative
    design_techniques:
    - state_transition
    - error_guessing
    priority: high
    risk: high
    execution_mode: manual
    preconditions: &id001
    - 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
    - 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分，使機台帳號有分數可下注；開分流程與開分對紅包的影響 spec 本案未定義（spec 只規定洗分／出金完成才會作廢待開啟紅包），本案除指定步驟外不洗分、不出金
    - 【環境前提，spec 未定義，需工程提供】可取得測試機台 M1 的機台憑證（Bearer JWT，見 SPEC-CASHFLOW-001『API 一覽』），並用 API 工具以該憑證送出 `req-keyout`（洗分）、`req-cashout`／`end-cashout`（出金），以及
      M1 前台『確認領取』所對應的領取 API（帶紅包編號）；領取 API 的端點與參數 spec 未定義，由工程提供。紅包編號可從該活動的紅包明細取得。錯誤代碼與回應內容由後端定義，本案只核對最終狀態與『成功／被拒』
    - 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
    - 【逐請求時間記錄與有效重疊判定】腳本須對每一個並行請求記錄：請求識別與送出帳號、送出絕對時間 t_send（UTC+0，至毫秒）、收到回應的絕對時間 t_resp（UTC+0，至毫秒）與回應內容。該輪有效 ⇔ max(所有請求的 t_send)
      < min(所有請求的 t_resp)（所有請求都在任一請求得到回應之前已送出）；不符者該輪作廢，不計入有效輪數，重做（重新佈置該輪）。有效輪數未達本案規定的下限時，不得判定通過（記為未完成）。人工口令同時按下只當補充觀察，不計入有效輪
    - 【關於『不同帳號』】機台上的領取與洗分／出金都落在同一個機台帳號 M1 上（紅包屬於機台，且共用同一把帳號鎖，第 400 行），無法用不同帳號區分勝方；本案改以『每個請求獨立的請求識別與回應』加上最終狀態（紅包狀態、交易紀錄、分數）判定哪一個請求先成立
    - 機台帳號 M1（自行從環境中選定，本週期無注單）；領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    - 整個測試須在同一個營業日內完成，且避開場館日結時間前後 30 分鐘（日結時間見『後台管理員系統 > 站台列表』該機台站台的『日結時間』），否則日結結算與每日重置會干擾累計與待開啟紅包
    - 【稽核前提，不成立就停止回報】機台開分的稽核依『帳務管理 > 出金設定』TWD 頁籤的稽核倍數計算（SPEC-CASHFLOW-001『機台帳號的稽核』第 51、59 行，預設 0 倍）；本案須在『出金設定 TWD 稽核倍數為 0』且『M1
      在稽核明細中沒有未完成的稽核』的條件下執行。倍數大於 0 時，開分 200、只打 100 會留下未完成稽核，洗分與出金核可金額會被扣減，而扣減的計算方式屬 CLR-REDPACKET-056 未決範圍，守恆式會失效並造成誤判；前提不成立時先調整設定或改用其他機台，仍不成立就停止本案並回報，不要逕行判定
    - 本案至少要 5 個『有效輪』（總輪數含無效輪不超過 20；超過時改建新活動，因單週期上限為 20）。每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』
    test_data:
    - name: 活動
      value: 門檻 100／單週期上限 20／固定 20／稽核 0／每日重置
    - name: 並行請求
      value: M1 領取 API vs M1 `req-keyout`（mode=all、throshold=0）
    - name: 有效輪數
      value: 至少 5 個有效輪（max(t_send) < min(t_resp)）
    steps:
    - n: 1
      action: 【前提檢查】進入『帳務管理 > 出金設定』TWD 頁籤，確認稽核倍數為 0；至『各式報表 > 稽核明細』（機台場館視角）篩選 M1，確認沒有未完成的稽核
      expected: 稽核倍數為 0、M1 沒有未完成稽核；任一不符則停止本案並回報（不判定 PASS／FAIL）
    - n: 2
      action: 建立機台場館紅包活動『RP-ARC-LOCK』（永久）：每日重置；預設規則門檻 100／單週期上限 20／固定 20／稽核倍數 0（避免稽核扣除干擾，扣除算法見 CLR-REDPACKET-056 尚未定案）；儲存
      expected: 建立成功
    - n: 3
      action: 【每一輪】先確認 M1 在稽核明細沒有未完成稽核（有則停止並回報）；店員對 M1 開分 200；M1 結算有效流水貢獻 100（下注輸贏使分數增減屬正常）；到紅包明細記下新產生的待開啟紅包 P 的紅包編號，並記下 M1
        目前分數 S1（機台畫面或後台日結報表，S1 須大於 0）
      expected: 產生 1 個待開啟紅包 P（金額 20）；已記錄 S1
    - n: 4
      action: 【每一輪】以腳本『並行送出』兩個請求：(i) M1 的領取 API（帶 P 的紅包編號）；(ii) M1 機台憑證的 `req-keyout`（mode=all、throshold=0，全洗）。並依『逐請求時間記錄』記下兩個請求的
        t_send、t_resp 與回應內容
      expected: 兩個請求都已送出並得到回應；依 max(t_send) < min(t_resp) 判定該輪是否有效，無效者作廢（不檢視結果）、重做新的一輪（店員補開分後重新佈置）
    - n: 5
      action: 【每一輪，僅有效輪】檢視 P 的紅包明細（狀態、作廢原因）、『各式報表 > 交易紀錄查詢』（機台視角）M1 本輪新增的『紅包』與洗分交易（含洗分核可金額）、M1 最終分數，以及『各式報表 > 稽核明細』的『紅包』紀錄
      expected: 結果只有兩種組合：(甲) 領取先成立：P『已入帳』（沒有被作廢）、交易紀錄『紅包』＋1 筆（20）、洗分核可金額 ＝ S1＋20（全洗當前全部餘額，含剛入帳的 20）、M1 最終分數 0；(乙) 洗分先成立：P『已作廢』、作廢原因『機台洗分』、交易紀錄沒有新增『紅包』、洗分核可金額
        ＝ S1、M1 最終分數 0、稽核明細沒有新增『紅包』紀錄。不得出現其他組合：P 既『已入帳』又『已作廢』；P『已入帳』但最終分數不是 0（20 殘留）；P『已作廢』但交易紀錄有『紅包』；洗分核可金額、紅包入帳與最終分數對不上（守恆式：最終分數
        ＝ S1 ＋ 入帳金額 － 洗分核可金額 ＝ 0）。(甲) 的稽核明細『紅包』筆數：稽核倍數 0 時是否仍寫入紀錄 spec 未明定，只記錄，但各個(甲)輪之間必須一致
    - n: 6
      action: 【每一輪，僅有效輪】以最終狀態歸類：依上一步觀察到的紅包狀態、交易紀錄、洗分核可金額與最終分數，歸入(甲)或(乙)，記入結果表；兩個請求的回應內容只記錄
      expected: 每個有效輪只能歸入(甲)或(乙)其中一種（歸類只看最終狀態）；回應若與最終狀態不一致，另記為觀察事項，不影響本案 PASS／FAIL，待 CLR-REDPACKET-059 定義回應語意後再轉為斷言
    - n: 7
      action: 【每一輪結束】店員若需要再對 M1 開分，回到步驟 3 進入下一輪；累計有效輪數達 5 才結束，無效輪不計
      expected: 有效輪數 ≥ 5；(甲)(乙)出現次數一併記錄（只出現其中一種不影響通過，但需註明未撞到另一種）
    - n: 8
      action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
      expected: 已取消排程
    expected_result: 領取與洗分以 API 並行送出（有效輪）時，鎖使兩者只有一方先成立：(甲) 領取先成立＝紅包已入帳、洗分核可金額含這 20、最終分數 0；(乙) 洗分先成立＝紅包已作廢（機台洗分）、不入帳、洗分核可金額不含這
      20、最終分數 0。不會既入帳又作廢，也不會有分數殘留或對不上的交易紀錄；有效輪數不足 5 時不得判通過。
