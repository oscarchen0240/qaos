      spec：活動結束（到期或取消排程）時待開啟紅包作廢、作廢釋放預算（第 160 行）；已作廢不可開啟（AC-0133）；AC-0131 活動到期作廢原因『活動結束』；活動結束後立即從前台移除圖示（第 173 行）。與 T10 相同，作廢發生在按下確認之前，是確定性案例。技術標
      state_transition：驗證『待開啟→已作廢（活動結束）』之後再嘗試非法轉換『已作廢→已入帳』被拒。已結束的活動不提供『取消排程』（第 228 行），且不列入重疊判斷（第 405 行），所以本案不需要也不做清理（APR-0205
