      才扣分並結束場次。依第 400 行『出金停在待確認期間紅包不可開啟』與第 398 行『完成出金（扣分成功）當下待開啟紅包作廢』：領取先成立→出金核可金額含這 20；出金請求先成立→領取被拒、紅包待出金完成才作廢（作廢原因機台出金）。『出金清空後又被加回分數』（RF-03
      gap）以守恆式與最終分數 0 偵測。為了讓每輪收尾，必須送 `end-cashout`；PENDING 不設逾時（SPEC-CASHFLOW-001），不收尾會卡住下一輪。稽核倍數取 0 避開 CLR-REDPACKET-056
      未定案的稽核扣除。技術標 state_transition＋error_guessing。與 TC-068／089／185 不重複：那三張都是先送出交易、再嘗試領取的循序情境。【APR-0208】(乙) 的前台按鈕「交易處理中」原為斷言，但出金是腳本打
      API 注入、非 M1 前台發起，前台是否同步 spec 未定義，改為重新開啟紅包視窗後只記錄。
