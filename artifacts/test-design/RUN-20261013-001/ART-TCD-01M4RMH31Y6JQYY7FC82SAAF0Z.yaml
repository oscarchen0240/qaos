    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
    - 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
      未明講，狀態文字與位置只記錄）
    - 【環境前提，spec 未定義，需工程提供】測試人員可用 API 工具（例如 REST 客戶端或瀏覽器開發者工具）以指定後台帳號的登入身分直接呼叫後端 API；各 API 的端點、參數與認證方式 spec 未定義，由工程提供。錯誤代碼與
      HTTP 狀態碼由後端定義，本案只核對『被拒絕』與『資料不變』
    - 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
    - 【逐請求時間記錄與有效重疊判定】腳本須對每一個並行請求記錄：請求識別與送出帳號、送出絕對時間 t_send（UTC+0，至毫秒）、收到回應的絕對時間 t_resp（UTC+0，至毫秒）與回應內容。該輪有效 ⇔ max(所有請求的 t_send)
      < min(所有請求的 t_resp)（所有請求都在任一請求得到回應之前已送出）；不符者該輪作廢，不計入有效輪數，重做（重新佈置該輪）。有效輪數未達本案規定的下限時，不得判定通過（記為未完成）。人工口令同時按下只當補充觀察，不計入有效輪
    - 【環境前提，spec 未定義，需環境負責人確認】7.4 操作紀錄是實體機台正本規劃新增的頁面（手冊 v01 尚未定義），其選單路徑與可檢視的角色隨該頁定義、目前 spec 未載明；由環境負責人告知入口，並確認本案登入角色可檢視該頁
    - 【清空後依序佈置】建立活動『RP-TOPUP-DUP』：活動幣種 USDT、重置方式每日、活動時間『永久』、預設規則（門檻 1000／上限 5／固定 10／稽核 1）、總預算 5000；儲存後確認狀態為『進行中』
    - 備妥『追加預算』視窗的快速連點手段（例如快速連按滑鼠左鍵 3 次），並記下 7.4 操作紀錄目前的筆數 L0
    test_data:
