    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
    - 【環境前提，spec 未定義佈置方式，需環境負責人確認】場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分，使機台帳號有分數可下注；開分流程與開分對紅包的影響 spec 本案未定義（spec 只規定洗分／出金完成才會作廢待開啟紅包），本案除指定步驟外不洗分、不出金
    - 機台帳號 M1（自行從環境中選定，本週期無注單）；領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
    - 場館日結時間為 UTC+0 20:00（台灣時間 04:00）（如不同，請於站台列表調整並依實際值換算下方時間）；M1 在整個測試期間保持分數足以下注（不足時由店員補開分）；整個測試期間 M1 不洗分、不出金（洗分／出金會作廢待開啟紅包，干擾判斷）
    - 【時間窗】本案必須橫跨 UTC+0 某個月份最後一天 D 的日結時間（以 10 月 31 日為例，D＝10/31，台灣時間 11/1 04:00 是新營業日的起點）與接下來的 UTC+0 日曆換月（D+1 00:00）。觀察點為 D
      19:50（日結前）、D 20:10（日結後）、D 20:30、D+1 00:10、D+1 00:20；D 當天 19:30 前備妥活動與待開啟紅包
    - 【對應規則】營業日『1 日』的起點依 spec 範例（第 361 行『台灣時間今日 04:00 至次日 04:00』、AC-0119 週一從『台灣時間週一 04:00』起）以台灣日期標記；D 20:00（UTC+0）＝台灣時間 1
