    design_rationale: 已比對Phase 3影子測試(qaos-test-designer agent)產出的TC-MEMBER-045（已退役），其多了「重新整理列表，檢視該列數值」的持久性驗證步驟，Phase 2原版只驗證點擊確認後畫面上顯示更新，未驗證重新整理後是否仍維持（若只是前端樂觀更新、實際未寫入後端，原TC測不出這個缺陷）。依整合原則(深度優先)補上持久性驗證，同時明確列出Inline編輯涉及的6個欄位名稱。v2依獨立Validator
      FAIL判定修正：v1把第6個欄位誤寫為「稽核倍數」，但spec §2.2.2/§2.2.3實際定義的名稱是「稽核」，「稽核倍數」是§2.4.3推薦註冊金設定的另一個欄位，已修正為「稽核」；並補上expected_result_spec_reference的實際spec引文。TC1只取樣修改2個欄位（佣金比例%、行政費）而非全部6個，是因為6個欄位共用同一套Inline編輯/儲存邏輯，抽樣驗證即可代表整體儲存機制，重點是驗證『儲存後持久化』這個行為本身，非窮舉每個欄位
