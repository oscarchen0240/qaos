      quote: '| 機台交易紀錄查詢 | 管轄範圍 | 管轄範圍 | 自身場館 |'
    design_rationale: CIR 指出 051 原預期『Admin 查詢結果涵蓋全部機台場館』在 v0.2 不成立，改為只驗站長（站長範圍 v0.1→v0.2 未變）；管理員部分改由 N5（非根）、N6（根）負責。Validator
      第一輪指出：機台交易紀錄頁一次只顯示所選站台（SPEC-TXLOG-001 篩選器），『在單一站台查詢結果不含 MT1』在子樹內任一站台必然成立、抓不到越權；因此本版以站台切換選單為驗證主軸，主要反向斷言是『選單沒有 P2／T1』，並切到管轄範圍內的
      S1、S2 各查得其交易。AC 對應：REQ-015 沒有以站長為主體的 AC（0151 操作員、0152 非根管理員、0153 根管理員），原掛 AC-0151 錯誤，故 acceptance_criteria_ids 留空、只追溯到
      REQ-015（RM 缺口，非硬掛）。『管轄範圍＝自身站台及所有子站台』是對照同節『可見場館範圍』列站長欄的解讀，已寫入 location。
