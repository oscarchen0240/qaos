    steps:
    - n: 1
      action: 以 S1 站台的管理員登入後台，展開 站台切換下拉選單，完整記錄選單中所有項目
    - n: 2
      action: 檢視選單內是否含 S1（自身）、S1a（S1 的子站台）
    - n: 3
      action: 檢視選單內是否出現 S2（與 S1 平行、同屬上層站台 P1）、P1（上層站台）、P2 與 T1（其他主站台及其底下的場館）
    expected_result: 選單可見 S1（自身站台）及其子站台下的場館 S1a；平行的 S2、上層站台 P1、以及其他主站台 P2 與其底下的場館 T1 皆不可見（選單中查無）
    expected_result_spec_reference:
      spec_id: SPEC-PLATFORMRULE-001
      spec_version: '0.2'
      location: §角色與權限（角色層級依 CLR-PLATFORMRULE-001）
      quote: '| 可見場館範圍 | 自身站台及所有子站台下的場館（根站台 `admin` 的管理員＝全部場館） | 自身站台及所有子站台下的場館 | 僅自身所屬場館 |'
    design_rationale: 對應 AC-0251 的『上層站台下的場館皆不可見』：N1 以主站台 P1 的管理員驗證，上層站台只有根站台（非場館），無法驗上層；本 TC 改取中間層 S1 的管理員，才同時能驗平行站台（S2）與上層站台（P1）不可見。『P1
      自身屬上層站台下的場館因而不可見』是我對 AC『上層站台下的場館』的讀法（P1 為自營場館，依站台列表 v0.6），非 PLATFORMRULE 逐字；若 PM 認為上層站台自身不屬此列，需調整。與 N1 的差別是帳號所處的樹中位置（主站台層
      vs 中間子站台層），步驟與預期不同，故不重複。
