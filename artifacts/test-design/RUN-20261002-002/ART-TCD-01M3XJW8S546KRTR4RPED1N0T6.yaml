    design_rationale: 對應 AC-0252。以六個場館的環境取樣驗證『全平台所有場館』，無法窮舉環境外的場館，僅驗證兩個平行主站台各自的子樹皆可見。P1、P2 列為場館依站台列表 v0.6『機台主站台可自行直接經營』。為正向案例，另一面（非根站台看不到）由
