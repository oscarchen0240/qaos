    title: 操作員後台選單無「站台列表」項目，無法進入場館設定頁面，額度上限等欄位無從檢視或修改
    product: ba-admin
    functional_area: PLATFORMRULE
    requirement_ids:
    - REQ-PLATFORMRULE-014
    acceptance_criteria_ids:
    - AC-PLATFORMRULE-0141
