    test_level: ui_e2e
    test_types:
    - negative
    design_techniques:
    - negative
    priority: high
    risk: high
    execution_mode: manual
    preconditions:
    - 以操作員身分登入後台
    - 站台切換選單已選定自身所屬的機台場館
    test_data: []
    steps:
    - n: 1
      action: 檢視後台左側選單，確認「站台列表」是否存在於選單中
    - n: 2
      action: 確認「會員與加盟商>會員列表」「帳務管理>洗分出金核實」「各式報表>交易紀錄查詢/場館日結報表」是否正常存在於選單中
    - n: 3
      action: 若嘗試直接以網址存取站台列表頁面，觀察系統反應
    expected_result: 選單中沒有「站台列表」這個項目，因此無法進入場館設定頁面，該頁面內的額度上限、場次逾時時間等欄位皆無從檢視，更無法修改；但會員列表、洗分出金核實、交易紀錄查詢、場館日結報表等其他操作員可操作項目正常存在於選單中，不受影響（若直接以網址嘗試存取站台列表頁面，若實際錯誤訊息/阻擋方式與選單消失不同，不視為違反本條，僅測是否被阻擋）
    expected_result_spec_reference:
      spec_id: SPEC-PLATFORMRULE-001
      spec_version: '0.1'
      location: §角色與權限
      quote: 額度上限（場館層級） | 可設定 | 可設定 | 唯讀（原文字面寫「唯讀」，經 Oscar 2026-09-15 以實際選單截圖確認：操作員選單根本沒有「站台列表」項目，此欄位是整頁無法進入而非可檢視的唯讀）
    assumptions: []
