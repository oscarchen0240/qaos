    design_rationale: 第一輪修訂把規則過度外推成整個場館相關功能都無法存取，與 spec 權限表裡操作員對機台管理/人工入出金/洗分出金核實等的可操作權限矛盾，且「場次逾時時間」在 SPEC-PLATFORMRULE-001
      原文查無依據。本輪依 Oscar 2026-09-15 提供的操作員實際選單截圖精確限定範圍：只有「站台列表」這個選單項目消失，額度上限與場次逾時時間都在這個頁面內，因此一併無法進入；機台管理、人工入出金等其他功能是透過選單中確實存在的「會員列表」進入，不受本條規則影響，與
      spec 權限表其餘可操作項目不再矛盾
