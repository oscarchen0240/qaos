    rationale: 【RF-01 已完整補上】T12、T14、T16、T17 都改成以 API 腳本並行送出，而且用不同帳號：T12 是玩家與管理員，T14、T16、T17 是兩個不同的後台帳號。T13、T15 是同一帳號重放，本來就不需要不同帳號。六張都逐請求記錄送出與回應時間，只有所有請求都在任一回應回來前送出才算有效輪，無效輪作廢重做；有效輪不足下限記為未完成、不得判通過；人工口令同時按下只當補充觀察。T12
