      已完整補上】新增 T22（領取對洗分 req-keyout，mode=all、throshold=0）與 T23（領取對出金 req-cashout，再以 end-cashout 完成），各至少 5 個有效輪。兩張都以最終狀態判定只能是兩種結果之一，並用守恆式核對：最終分數＝S1＋入帳金額－核可金額＝0。T23
      另外檢查出金待確認期間領取被拒，以及出金完成後紅包作廢、原因為機台出金，對得到第 398、400 行。同一機台帳號無法用不同帳號區分勝方，案例改用請求識別、回應與最終狀態判定，做法合理。用回應歸類（甲）（乙）、T23（乙）的畫面斷言、T22
      與 ACTIVE TC-REDPACKET-213 重疊，這三點 Validator 已列，不重複。附記兩條觀察，不列 finding：(1) medium：同一個紅包被兩個領取請求並行送出（雙重入帳）沒有案例，這和 CLR-REDPACKET-060
