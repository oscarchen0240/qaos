    gap: 後台操作類的併發案例沒有確保請求真的同時送達。T12（玩家［確認領取］對後台［確認取消］）、T14（兩位管理員同時追加預算）、T16／T17（管理員與站長同時建立重疊活動）都允許『兩人以同一口令同時按下』或『或以腳本／API
      送出』二擇一。人工按鍵的時間差通常是數百毫秒，後端幾乎一定會循序處理，多跑幾輪也只是多驗幾次循序情境。各案也都沒有像同批機台金流補強那樣，記錄每個請求的送出與回應時間，並以 max(送出) < min(回應) 判定這一輪有沒有真正重疊、沒重疊就作廢重做。T13
      步驟 3、T15 步驟 4 雖然用腳本並送，同樣缺少重疊證據。結果可能是『每輪都 PASS』，但其實從沒碰到競態。T12 牽涉入帳與預算釋放，風險最高。
    suggested_scenario: 把 T12、T14、T16、T17 的觸發方式改為必須用 API 層腳本並行送出（人工同時按下只當補充觀察）。T12、T13、T14、T15、T16、T17 都補上逐請求的送出與回應時間記錄，加入有效重疊判定：沒有重疊的輪次作廢重做，有效輪次不足規定輪數時不得判定通過。T12
      另要確認：每輪的錢包、交易紀錄、稽核明細與紅包狀態只符合（甲）或（乙）其中一種組合。
