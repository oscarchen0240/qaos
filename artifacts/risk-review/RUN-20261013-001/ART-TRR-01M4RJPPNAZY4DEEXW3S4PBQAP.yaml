    gap: T07（多帳號同時達標，爭用同一池預算）、T08／T09（同一帳號多筆注單同時結算）由工程提供的腳本『幾乎同時』送出結算，但沒有任何證據證明後端真的同時處理。注單是非同步計入（第 399 行），若平台以佇列逐筆處理結算，這幾張無論重跑幾輪都只是循序情境；而預算超發（第
      392 行）、上限超發與累計遺失（第 389 行），只會在『讀取剩餘預算或累計』與『寫入新紅包』之間被另一筆插入時才會發生。案例只寫『同時送出無法保證每一輪都撞上競態，所以重複多輪』，但沒有判斷依據，所以不知道哪一輪有效。
    suggested_scenario: 在 T07、T08、T09 補上判定依據：記錄每筆結算通知的送出與回應時間，並套用有效重疊判定；可行的話另請工程提供計入時點（例如紅包明細的產生時間，或結算處理 log 的時間戳），確認多筆結算的處理時間確實重疊。沒有重疊證據的輪次作廢重做。若工程確認結算一律經單一佇列序列化處理，請在
      TC 前提寫明，並把這三張改列為『循序一致性』驗證，不要宣稱已驗證併發。
