    gap: 本批併發補強只有線上的『領取對取消排程』（T12）。機台場館的同一帳號上，『確認領取紅包』與『洗分／出金請求』同時送達的情況沒有任何案例。第 400 行規定兩者使用同一把帳號鎖：洗分或出金送出後到完成前不可開啟紅包，完成時待開啟紅包作廢（第
      398 行）。既有的 TC-REDPACKET-068／089／185 都是先送出交易、再嘗試領取的循序情境。若鎖沒有正確實作，可能出現『紅包已入帳，但同時被記為機台洗分作廢』，或洗分的核可金額沒算入剛入帳的紅包分數、出金清空後又被加回分數，造成機台分數與交易紀錄對不上。
    suggested_scenario: 機台 M1 有 1 個待開啟紅包（固定 20），先讓 M1 停在確認領取視窗；以腳本並行送出［確認領取］與 req-keyout（mode=all、throshold=0），記錄送出與回應時間、作廢判定有效重疊，至少做
      5 輪。每輪核對結果只能是兩種之一：(甲) 領取先成立＝紅包已入帳、交易紀錄與稽核明細各 +1，洗分核可金額含這 20；(乙) 洗分先成立＝紅包已作廢（原因機台洗分）、分數沒有增加 20、交易紀錄與稽核明細不變。最終機台分數、交易紀錄與紅包狀態必須一致。出金（req-cashout）比照再做一組。
