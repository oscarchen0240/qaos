    gap: spec 定義場次有三種結束方式：洗分、出金、分數歸 0。Draft 步驟 1 只用出金產生 S1，下列兩種結束後的狀態不可逆都沒驗：(a) 分數歸 0，邊界是剩 1 分時場次仍為進行中，歸 0 才結束；(b) 洗分留有餘數
      r，此時 S1 期末＝r，之後繼續遊玩或開分形成的新場次期初餘額應承接 r。其中 (b) 的 S1 結束後機台仍有分數，最容易在實作上被誤併回原場次。
    suggested_scenario: 分別用三種方式產生 S1：出金、輸到分數歸 0、洗分留餘數 r。每種都要先在剩 1 分時確認 S1 仍為進行中。之後對機台 A 開分或投注，用依場次明細重查，確認三件事：S1 仍為「已結束」，結束時間與期末餘額不變（出金與歸
      0 為 0，洗分為 r）；另有一個新的進行中列，場次編號不同於 S1；洗分路徑下，新場次的期初餘額＝r。
    spec_basis:
      location: §背景：場次資訊（場次定義；另見同表期初餘額「承接洗分餘數或日結結算轉入者為承接金額」、期末餘額「洗分結束留有餘數時為該餘數」）
      quote: 從機台有分數開始玩起算，到洗分、出金或分數歸 0 為止，算一個場次
    needs_clarification: false
