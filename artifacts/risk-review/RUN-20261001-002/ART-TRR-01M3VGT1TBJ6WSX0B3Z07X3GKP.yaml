    gap: v0.1 只規定「進行中的場次」在日結時強制結束，並把餘額轉為隔日新場次的期初餘額。逾時結束後分數仍留在機台（TC-054 v2 的情境），這時沒有進行中場次，但有餘數。日結時以下各項 spec 都沒有定義：要不要產生承接場次、要不要把餘數轉成隔日期初餘額、前一營業日與隔日的期末餘額要不要計入這筆餘數。AC-DAILYREPORT-0172
