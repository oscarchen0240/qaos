  comparisons:
  - testcase_id: TC-TXLOG-148
    old_version: 1
    new_draft_id: TC-DRAFT-01M4T43E6KP010FJGSEFQJFJ2W
    verdict: changed
    field_diffs:
    - field: title
      old: 出金待確認不會自動逾時，只能靠新請求取代、人工出金連動取消，或轉介洗分出金核實頁收斂
      new: 出金待確認超過 24 小時不會自動逾時，持續保留待確認，僅能靠補完回報、新出金取代、櫃檯人工出金連動取消或管理員手動取消收斂
    - field: description
      old: null
      new: TC-TXLOG-148 修訂：收斂途徑改為補完回報／新出金取代／櫃檯人工出金連動取消／管理員手動取消，移除『轉介洗分出金核實頁』（AC-TXLOG-0171）
    - field: design_techniques
      old:
      - scenario
      new:
      - state_transition
      - boundary_value
    - field: preconditions
      old:
      - 以 Admin 登入後台
      - 進入 各式報表 > 交易紀錄查詢，站台切換選單已選定一個機台場館站台
      new:
      - 以管理員（spec 原文稱 Admin）登入後台，進入『各式報表 > 交易紀錄查詢』，頁面標題下方的站台切換下拉選單切到機台場館所屬站台（資料範圍跟隨該選單，一次僅顯示所選站台）
      - 【環境前提，spec 未定義佈置方式，需環境負責人確認】本站台有一筆交易狀態為『待確認』的機台出金 X，其交易時間（UTC+0）距今已超過 24 小時，且機台從未補送完成回報（自行從環境中選定；若環境沒有，需先在機台端造出待確認出金並等待超過
        24 小時，如何造出不在 spec 範圍）。spec 提到現場在機台 Operator 選單執行過 Reset 後，機台不再回報該筆交易，這是待確認長期留著的一種情境，但不代表可作為佈置手法。
      - 本案只觀察、不對 X 做任何取消或核實操作（手動取消由 REQ-TXLOG-028 的案例驗證），測試期間不要讓 X 被新的出金取代或人工出金連動取消
    - field: test_data
      old: []
      new:
      - name: X 的交易時間距今
        value: 超過 24 小時（越過入金逾時時限後的一側；選環境既有紀錄，例如 25 小時以上）
      - name: X 的交易狀態（預期全程）
        value: 待確認
    - field: steps
      old:
      - n: 1
        action: 一筆出金交易長期處於待確認狀態，機台從未補送完成回報（超過入金逾時時限的 24 小時）
      - n: 2
        action: 持續檢視其狀態
      new:
      - n: 1
        action: 在交易紀錄查詢篩選『交易類型＝機台出金』『交易狀態＝待確認』並搜尋，找到符合前提的 X，記下交易編號、交易時間、交易狀態與完成時間
        expected: X 的交易狀態為『待確認』（轉換前狀態），完成時間顯示『—』，交易時間距今超過 24 小時
      - n: 2
        action: 檢視 X 目前的交易狀態；另把『交易狀態』篩選改為『已逾時』、『交易類型』維持機台出金再搜尋，確認 X 的交易編號不在結果中
        expected: X 仍是『待確認』，不是『已逾時』（出金的 待確認→已逾時 不會發生）；『已逾時』的結果中沒有 X
      - n: 3
        action: 隔一段時間後（時間長度由執行者自行決定，建議至少 1 小時）重新用交易編號查詢 X
        expected: X 仍保留為『待確認』，沒有自動轉為『已逾時』
    - field: expected_result
      old: 不會自動轉為已逾時，持續保留為待確認，直到被新出金取代、櫃檯人工出金連動取消，或轉介至「洗分出金核實」頁（SPEC-CASHOUT-001）由人工處理
      new: 機台出金交易處於待確認、機台從未補送完成回報，超過 24 小時後不會自動轉為『已逾時』，持續保留為『待確認』，直到機台補完回報、被新的出金取代、櫃檯人工出金連動取消，或由管理員於本頁手動取消（REQ-TXLOG-028）為止。（本案實際驗證的是『超過
        24 小時仍持續待確認、不自動逾時』；四種收斂途徑只作為 spec 列出的允許結束條件，不在本案逐一觸發；已不再斷言『轉介至洗分出金核實頁』。）
    - field: expected_result_spec_reference
