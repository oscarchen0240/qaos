        spec_version: '0.1'
        location: §相關業務規則
      new:
        spec_id: SPEC-TXLOG-001
        spec_version: '0.1'
        location: §交易狀態（第 57 行）；§相關業務規則（第 122 行）
        quote: 出金不設逾時，待確認會一直保留，直到機台補完回報、被新的出金取代、櫃檯人工出金連動取消，或由 Admin 手動取消為止
    impacted_requirement_ids:
    - REQ-TXLOG-017
    recommendation: 修訂 TC-TXLOG-148 v1（CIR 判 affected）：收斂途徑移除「轉介洗分出金核實頁」，改為補完回報、新出金取代、櫃檯人工出金連動取消或管理員手動取消，對應 REQ-TXLOG-017／AC-TXLOG-0171
      R001；「超過 24 小時不自動逾時、持續待確認」的核心斷言保留；核准後以新版取代現行 ACTIVE 版本（舊版保留）
