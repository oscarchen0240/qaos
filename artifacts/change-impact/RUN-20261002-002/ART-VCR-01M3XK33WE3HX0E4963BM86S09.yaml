    old_version: 1
    new_draft_id: TC-DRAFT-01M3XJXECPT7SS704F7WK8EK0E
    verdict: changed
    field_diffs:
    - field: title
      old: Admin 可查全部場館、站長僅可查其管轄範圍內的機台交易紀錄
      new: 站長於機台交易紀錄查詢的站台切換選單僅含其管轄範圍（自身站台及所有子站台），可切換至管轄範圍內的場館查得其機台交易，且無法切換至範圍外場館
    - field: acceptance_criteria_ids
      old:
      - AC-PLATFORMRULE-0151
      new: []
    - field: spec_version
      old: '0.1'
      new: '0.2'
    - field: test_types
      old:
      - functional
