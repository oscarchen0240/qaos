  - bug_id: BUG-DAILYREPORT-004
    similarity_note: 同功能同報表、均涉及期末餘額，但 BUG-DAILYREPORT-004 是跨場次切換點注單被拆成投注與派彩兩半、日結場次歸屬營業日的問題（REQ-DAILYREPORT-009），對象為已結算場次；本案為進行中場次不可見，非同一問題
