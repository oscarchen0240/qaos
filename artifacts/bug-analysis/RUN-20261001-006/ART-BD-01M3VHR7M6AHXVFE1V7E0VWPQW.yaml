  - 機台帳號 ACAA00424 目前有進行中場次 ACAA00424_20261001_0002（2026-10-01 10:31:45 開分 100、10:32:05 入鈔 1,000，後續兩局真人大廳投注各 100 皆輸，機台目前分數
    900），之後不再有任何交易
  - 同機台同日另有已結束場次 ACAA00424_20261001_0001（08:25～08:41）
  - 查詢時未跨越場館日結時間
  reproduction_steps:
  - 於機台 ACAA00424 前台開分、入鈔並進行真人大廳投注，確認場次進行中（交易紀錄可查到 sessionCode ACAA00424_20261001_0002，機台目前分數 900，不要洗分或出金）
  - 進入 各式報表 > 場館日結報表，站台 Arcade，統計週期「按日」，統計維度「依場次明細」，機台帳號留空（或填 ACAA00424），結算日期 2026-09-25 起至含 2026-10-01，按「搜尋」
  - 檢視列表中 2026-10-01 的場次列，找場次編號 ACAA00424_20261001_0002 的列（預期狀態「進行中」、結束時間「—」、場次時長累計到查詢當下、期末餘額 900）
  - 檢視底部總計列的「期末餘額」
  expected_result: 依場次明細列出所有狀態的場次，含進行中：列表應有場次 ACAA00424_20261001_0002 的列，狀態「進行中」、結束時間顯示「—」，場次時長為累計到查詢當下的值， 期末餘額為累計到查詢當下的機台分數（TC-DAILYREPORT-099／AC-DAILYREPORT-0083
    範例；本案機台目前分數 900，依 PM 定案 A 一律計入進行中場次累計到查詢當下的分數）； 總計列的期末餘額亦應計入該進行中場次的分數，而非 $0.00（同源需求 REQ-DAILYREPORT-014／AC-DAILYREPORT-0143：尚未結算的營業日取截至查詢當下的分數、含進行中場次）。
  expected_result_spec_reference:
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    location: §背景：場次資訊/開始時間・結束時間、場次時長（v0.1 原文「進行中則顯示累計至查詢當下」）+ §列表欄位/場次編號；進行中場次列須出現、其場次時長與期末餘額累計到查詢當下， 依 CLR-DAILYREPORT-013（PM
      定案 A，2026-10-01，以 spec 2026-09-17 修訂為準，推翻 CLR-DAILYREPORT-012 的 B）；v0.1 不含 09-17 修訂，故期末餘額計入進行中場次一節（REQ-DAILYREPORT-014）出自該
      CLR 而非 v0.1 原文
    quote: 進行中的場次結束時間顯示「—」
  actual_result: 機台 ACAA00424 於 2026-10-01 10:31:45 開分 100、10:32:05 入鈔 1,000，兩筆交易皆成功，場次編號皆為 ACAA00424_20261001_0002。 10:33:35
    與 10:33:56 兩局真人大廳注單（流水號 6745051、6745052）各投注 100、有效投注 100，sessionCode 皆為 ACAA00424_20261001_0002。 機台前台注單紀錄兩局損益皆 -100，由入鈔後餘額
    1,100 推算機台目前分數為 900。 場館日結報表（Arcade、按日、依場次明細、結算日期 2026-09-25 起）列表總筆數 1，只列出已結束場次 ACAA00424_20261001_0001（2026-10-01 08:25～08:41，場次時長
    15 分），沒有 ACAA00424_20261001_0002 的列。 該列表的總計列期末餘額為 $0.00（唯一列 _0001 的期末餘額亦為 $0.00），未計入進行中場次的分數。 報表在場次結束前查不到該場次任何資料，只能由交易紀錄與注單證明場次存在。
