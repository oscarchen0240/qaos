  impact: 站長／平台對帳人員在場次結束前，無法於場館日結報表看到進行中場次（無場次列、無開始時間、無場次時長、無開分／入鈔／損益等該場次資料）； 總計列與該營業日期末餘額少算進行中場次的分數（本案顯示 $0.00，機台目前分數 900，由
    EVD-0095 推算）。 期末餘額與場次明細列同源（REQ-DAILYREPORT-008 與 REQ-DAILYREPORT-014／AC-DAILYREPORT-0143），皆因進行中場次未被報表納入而一併缺漏； 依機台明細或依場館彙總維度是否同樣漏計，本單證據未涵蓋（僅驗證依場次明細維度）。
    TC-DAILYREPORT-099 的預期行為於目前實作下無法達成（EXE-20261001-001 result fail）。
  suspected_area: 後端 report/query-venue-daily-report 場次明細層與期末餘額彙總層疑似未納入進行中場次（場次狀態「進行中」的資料未被查詢或未回傳），前端因無資料可顯示而無該列； 判斷依據僅為報表畫面無該場次任何資料，本案證據未截取
    query-venue-daily-report 的 API 回應，無法區分是後端未回傳或前端過濾，後端為較可能的推測，不確定。 另：已結束場次 _0001 列的注單數 2／有效投注額 $200／損益 -$200 與 _0002 的兩局投注金額相同，本案證據未含
    _0001 自身的交易與注單，無法判斷這些數字是否正確歸屬 _0001，本單不處理。
  ambiguity_suspected: false
  ambiguity_note: v0.1 原文只明列場次資訊「結束時間顯示「—」、場次時長進行中累計至查詢當下」，未明言日結報表「依場次明細」須列出進行中場次，亦未明言期末餘額計入進行中場次。 此兩點的預期行為已由 CLR-DAILYREPORT-013
    PM 定案 A（2026-10-01）釐清並寫入 RM（REQ-DAILYREPORT-008／014），故不視為 spec 模糊（ambiguity）。
