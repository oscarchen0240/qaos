payload:
  draft_id: BUG-DRAFT-01M3VHRDGVJGW9MZDMRDW0XXHP
  title: '[後台][Arcade][後端][場館日結報表] 依場次明細未列出進行中場次，總計列期末餘額亦未計入進行中場次的分數'
  product: ba-admin
  functional_area: DAILYREPORT
  severity_proposed: major
  priority_proposed: high
  severity_rationale: 建議 major／high，最終由 Human 決定。理由：(1) 已有 PM 定案（CLR-DAILYREPORT-013 答覆 A，2026-10-01）明確判定「現行實作（進行中場次在日結報表查不到任何資料）為缺陷」，非
    spec 模糊； (2) 場館日結報表用途為供平台與場館對帳，進行中場次對報表完全不可見（無列、無場次時間、無時長），期末餘額總計列顯示 $0.00 而非機台實際分數，屬帳務報表的數字錯誤； (3) 影響每一個尚未結束的場次、每次查詢當日營業日都會發生，非邊緣情境，故
    priority 建議 high（與同功能 BUG-DAILYREPORT-001／002／003 的 major／high 一致）。 不建議 critical 的理由：本案是「進行中場次尚未納入」而非既有已結算數字被算錯——證據中已結束場次
    _0001 列本身未見異常；規格亦定義日結時間到達時強制結束所有進行中場次（v0.1 §業務規則/場次日結），推測場次結束後會進入報表， 此點本單證據未驗證，僅為推測。若 Human 判斷站長／對帳人員會以當日即時報表的期末餘額作帳務依據，可上調
    severity。
  environment:
    name: stage
    site: Arcade（機台場館）
    account: ACAA00424（機台帳號，交易發起）；查詢者 ACAA00423（站長）
    timezone: UTC+0（後台時區 UTC+00:00）
