  - 攔截 query-venue-daily-report 的回應 JSON，檢查是否有開始時間與時長欄位
  expected_result: 每列有場次編號、開始時間、結束時間（UTC+0）、場次時長（結束－開始；進行中為累計至查詢當下）；API 回應應含開始時間（如 startTime）與時長（如 duration）欄位
  expected_result_spec_reference:
    spec_id: SPEC-DAILYREPORT-001
    spec_version: '0.1'
    location: §列表欄位/場次編號 + §場次資訊/開始時間、場次時長
  actual_result: 畫面開始時間與場次時長皆顯示「--」；API 回應僅有 endTime，無開始時間與時長欄位
  actual_result_evidence_map:
  - claim: 畫面開始時間、場次時長顯示 --
