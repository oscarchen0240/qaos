payload:
  draft_id: BUG-DRAFT-01M2GDZXWAR0S9S7RGDM63AMWH
  title: '[優化建議][前端/後端][稽核設定] TWD 稽核設定「開分/洗分」與「入金/出金」兩組畫面與API回應完全相同，使用者無法區分'
  product: ba-admin
  functional_area: CASHFLOW
  severity_proposed: trivial
  priority_proposed: low
  severity_rationale: 非規格牴觸——後端資料本身正確（兩組稽核設定各自獨立存在），純屬可用性問題：畫面與 API 回應的欄位值完全相同，操作者無法從畫面分辨自己改的是哪一組設定，有改錯風險。標為 trivial/low 是因為不影響資料正確性，只影響操作辨識度
  environment:
    name: stage
    account: ZZAA00261（管理員）
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  requirement_id: REQ-CASHFLOW-001
  acceptance_criteria_ids: []
  preconditions:
  - 站台 Arcade（機台類型）的鏈上錢包管理／出金設定 TWD 頁籤，存在「開分/洗分」與「入金/出金」兩組獨立的稽核倍數設定
  reproduction_steps:
  - 以管理員 ZZAA00261 登入後台，站台切換選單切至 Arcade（機台）
  - 至帳務管理 > 出金設定（或鏈上錢包管理）TWD 頁籤
  - 檢視列表，注意到有兩筆名稱、代碼、付款方式、出金手續費、稽核倍數、狀態皆完全相同的「New Taiwan Dollar」紀錄
  - 開啟瀏覽器 Network，檢查對應查詢 API 的回應 JSON，確認兩筆紀錄的所有欄位值（paymentMethod/currencyName/currencySymbol/transactionFee/audit/status）是否完全相同
  expected_result: 使用者應能從畫面（或至少從 API 回應）分辨這兩組稽核設定分別對應「開分/洗分」還是「入金/出金」，避免改錯組別
  expected_result_spec_reference:
    spec_id: SPEC-CASHFLOW-001
    spec_version: '0.1'
    location: §機台帳號的稽核（稽核倍數依幣種設定，機台預設 0 倍）
  actual_result: 兩筆 TWD 紀錄在畫面上完全無法區分（名稱、代碼、手續費、稽核倍數、狀態皆相同），API 回應的欄位值也完全相同，沒有任何分組標識欄位
  actual_result_evidence_map:
  - claim: 畫面上兩筆 New Taiwan Dollar 紀錄視覺上完全相同，無法分辨對應哪一組功能
    evidence_id: EVD-0054
  - claim: API 回應中兩筆紀錄除順序外所有欄位值完全相同，無分組標識欄位
    evidence_id: EVD-0053
  evidence_ids: *id001
  impact: 操作者修改稽核倍數等設定時，無法確認自己改的是「開分/洗分」還是「入金/出金」哪一組，有改錯風險（例如原意只想調整入金稽核倍數，卻誤改到洗分那組）
  suspected_area: 前端：出金設定/鏈上錢包管理 TWD 頁籤列表元件未顯示分組標籤；後端：查詢 API 回應未包含可辨識分組的欄位（如 group/scope）
  ambiguity_suspected: false
  duplicate_candidates: []
