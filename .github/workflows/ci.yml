# QAOS 工程 CI（GitHub Actions）。內容對應 .gitlab-ci.yml：
# 只測「程式有沒有壞」（tools/qaos Runtime、admin-ui 後端），不做 CD／deploy；機密不進庫。
name: QAOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  runtime-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: admin-ui/backend/requirements.txt
      - run: pip install --upgrade pip && pip install pyyaml jsonschema referencing pytest
      - run: pytest tests/ -q --junitxml=reports/runtime-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-junit
          path: reports/
          retention-days: 14

  admin-ui-pytest:
    runs-on: ubuntu-latest
    needs: runtime-pytest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: admin-ui/backend/requirements.txt
      - run: pip install --upgrade pip && pip install -r admin-ui/backend/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: runtime-junit
          path: reports/
      - run: pytest admin-ui/backend/tests/ -q --junitxml=reports/admin-ui-junit.xml
      # 產出控制台可讀的狀態檔（下載後放到 admin-ui/data/ci-status.json）
      - if: always()
        run: python admin-ui/scripts/write_ci_status.py --from-junit reports/runtime-junit.xml=runtime-pytest reports/admin-ui-junit.xml=admin-ui-pytest --out reports/ci-status.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-status
          path: reports/
          retention-days: 14
