question: (1)「出收據那天」以什麼切日：場館日結時間（營業日）還是 UTC+0 00:00？(2) 跨日核實（D 日出收據、D+n 日核實）的兌現金額（現金淨收的扣除項）記在 D 日列還是核實那天的列？(3) 收據永久有效，日結報表結算日期若有上限或資料保留期，最早的未兌現收據超出時怎麼呈現？
context: v0.2 第 104、110 行規定作廢記在出收據那天、未兌現留在出收據那天直到核實或作廢、要看全部未兌現須涵蓋最早收據；但切日基準與跨日核實的兌現歸屬未定義。日結報表 v0.3 的「當日」是依場館日結時間切分的營業日，兩份
  spec 需一致。（來源：2026-10-12／13 T3RR 風險抽查 CASHOUT RF-01/07/08；問題單 C 主題 C4）
