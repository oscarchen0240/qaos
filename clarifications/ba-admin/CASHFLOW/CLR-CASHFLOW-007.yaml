clarification_id: CLR-CASHFLOW-007
product: ba-admin
functional_area: CASHFLOW
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
question: 機台餘額帶小數（例如 399.6）時出金，收據面額與櫃檯付現要怎麼處理？櫃檯只能付到個位數，小數部分（0.6）要捨去、四捨五入、進位，還是留在機台上？門檻為 0 的全額洗分是否比照？
context: spec 原文：「出金一律是全額且清空餘額，沒有指定金額的選項，也不套門檻取整：餘額 321 → 收據面額 321，機台餘額歸 0」「收據面額可能含零頭（不像洗分有門檻取整），櫃檯付現須付至個位數」；洗分「throshold=0
  表示洗出當前全部餘額、不做取整」。spec 舉的「零頭」例子是 321（非整百），沒有考慮餘額帶小數的情況；所有 spec 都沒有規定金額必須是整數或小數如何進位。部分遊戲的派彩會帶小數，機台餘額因此可能出現小數（場館日結報表 10-01
  列損益 -1,100.4、期末餘額 299.6）。2026-10-02 stage Arcade 實測（EVD-0097、EVD-0098）：機台 ACAA00424 餘額 399.6 出金，交易 8798710 請求金額與實際金額皆為 -399.6，餘額歸
  0，核實狀態待核實——收據面額為 399.6，櫃檯無法付出 0.6 元（新台幣無角）。若付 399 則 0.6 憑空消失（餘額已清空），若付 400 則場館多付 0.4。洗分門檻大於 0 時，小數會落在不足一個門檻的餘數內、留在機台上，沒有此問題。
options:
- A. 收據面額維持實際餘額（含小數，即現行做法），付現時小數部分一律捨去（或四捨五入）；請定義差額是否需要記錄、報表的收據金額／已兌現／現金淨收以面額還是實付為準
- B. 出金核可金額取整數（無條件捨去），小數部分留在機台帳號上、不清空（比照洗分餘數）；收據面額與付現一致
- C. 出金核可金額取整數（四捨五入或無條件進位），餘額照樣清空，差額由場館吸收並記錄
- D. 從源頭處理：機台帳號餘額不允許小數（派彩入帳時即取整），出金與洗分自然不會出現小數
