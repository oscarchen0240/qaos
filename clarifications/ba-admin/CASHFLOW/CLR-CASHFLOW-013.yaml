question: 金額小數精度與進位規則：餘額為 399.65、399.655 等兩位以上小數時，核可金額、收據面額、交易紀錄、日結報表各保留幾位、四捨五入或截斷？整數面額是否顯示 .00？throshold 能否帶小數（例 0.5）？
context: v0.2 第 127、168、336、360 行只示範一位小數（399.6 → 收據 399.60），第 118 行（洗分出金核實）又寫「餘額 321 → 收據面額 321」，整數是否補 .00 不一致。CLR-CASHFLOW-007
  已定「照記含小數、平台只記面額」，但未定精度。（來源：2026-10-12／13 T3RR 風險抽查 CASHFLOW RF-05；CASHOUT RF-02；問題單 C 主題 C3）
