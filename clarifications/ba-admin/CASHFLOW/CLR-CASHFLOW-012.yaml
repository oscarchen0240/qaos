question: 管理員手動取消待確認出金的防護規則：(1) 收據已印出才取消時，管理員事前要核對什麼、收據怎麼處理、機台與平台分數怎麼對齊？(2) 對已完成出金、已取消出金、待確認入金等非「待確認出金」目標呼叫取消 API 時的回應？(3)
  手動取消與機台遲到的 end-cashout 同時到達時以哪個為準、輸的一方回什麼？(4) 重複送出取消請求時阻擋提示還是冪等？(5) 管理員能否取消其他站台機台的待確認出金？
context: 依 CLR-CASHFLOW-008 rev 1，手動取消只限管理員、只限待確認出金，後端已完成、前端未開發（BUG-TXLOG-001），目前 API 是唯一操作面。正式流程中收據送入列印佇列後才送 end-cashout（第
  151、344 行），Operator Reset 時收據多半已印出；取消後收據無對應已完成交易、無法核銷。（來源：2026-10-12／13 T3RR 風險抽查 CASHFLOW RF-07/08/11/15/18；問題單 C 主題 C2）
