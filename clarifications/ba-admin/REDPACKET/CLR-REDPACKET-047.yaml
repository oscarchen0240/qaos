  quote: 「Admin/站長手動取消」這條收斂路徑需要移除
conflict_note: SPEC-CASHFLOW-001@0.1 第 257、341、344、372 行與 SPEC-ARCADE-001@0.7 第 584、612 行定義待確認出金可由 Admin 手動取消收斂；已落地的 CLR-CASHFLOW-004（APPLIED，針對
  REQ-CASHFLOW-008／026）定案交易紀錄頁沒有手動取消功能、這條收斂路徑須移除，出金死單只剩新請求取代與人工出金連動取消。對紅包的影響：目標第 329 行「交易取消則恢復可開啟」中，待確認出金能否經 Admin 手動取消而恢復紅包可開啟，取決於此路徑是否存在
