question: 待確認出金能否由 Admin 手動取消（並因此使紅包恢復可開啟），以 spec 原文或 CLR-CASHFLOW-004 為準
context: REQ-REDPACKET-028：機台帳號完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢（作廢原因機台洗分／機台出金），累計進度不歸零。紅包入帳與機台洗分／出金使用同一把帳號鎖：洗分或出金請求送出後、交易完成前，紅包不可開啟；交易完成依上述作廢，交易取消或未成立則恢復可開啟。出金停在「待確認」期間屬交易進行中、紅包不可開啟；該筆轉為「已取消」時恢復可開啟（被新出金取代時，新出金本身仍在進行中則繼續鎖定；Admin
  手動取消路徑是否存在見 Q04）；過渡期由前台完成的出金以前台回報完成、平台扣分成功為完成時點。洗分為單階段交易，鎖定只在請求送出至平台回覆之間。
