question: 範圍只限機台帳號的呈現細節（Q02 已定義 4.1 交易類型與 4.4 稽核明細類型新增「紅包」、線上與機台皆有）：(1) 4.1 機台視角擴充（SPEC-ARCADE-001@0.7 機台交易紀錄）的交易類型下拉是否加入「紅包」，以及紅包列的場次編號、交易狀態、核實狀態、請求／實際金額、完成時間、來源等欄位值；(2)
  4.4 稽核明細中機台帳號紅包列的金額單位（現行欄位標示 USDT，機台為 TWD）
context: REQ-REDPACKET-014：玩家開啟紅包即以核心貨幣入帳至錢包（不經 3.3 優惠彩金審核、不提供線下給付）；入帳時寫入 4.1 交易紀錄（交易類型「紅包」，正值），所需有效投注額增加 紅包金額 × 稽核倍數（稽核倍數取自產生當下適用的規則），寫入
  4.4 稽核明細（類型「紅包」）。
