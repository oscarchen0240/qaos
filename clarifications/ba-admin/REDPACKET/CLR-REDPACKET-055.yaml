question: 待確認出金能否由管理員手動取消（並因此使紅包恢復可開啟），以 spec 原文（目標、SPEC-CASHFLOW-001@0.2、SPEC-ARCADE-001@0.8）或 CLR-CASHFLOW-004 為準；若存在，操作入口為何
context: REQ-REDPACKET-028：機台帳號完成洗分或出金（扣分成功）當下，該帳號待開啟紅包作廢（作廢原因機台洗分／機台出金），累計進度不歸零。櫃檯對機台帳號人工出金視同出金完成，作廢原因「機台出金」；人工入金不影響紅包；過渡期由前台完成的出金同樣適用。紅包入帳與機台洗分／出金使用同一把帳號鎖：洗分或出金請求送出後、交易完成前，紅包不可開啟；出金停在「待確認」（不設逾時）期間同樣不可開啟。交易完成依上述作廢；交易取消、未成立、被新出金取代時，原交易視為未成立、紅包恢復可開啟（新出金送出後再次鎖定）；待確認出金能否「由管理員手動取消」見
  Q04。
