  answer: 依紅包 spec v02 與 PM 最新回覆（2026-10-10，原題 022）為新設計：櫃檯人工出金視同出金完成，作廢待開啟紅包（作廢原因「機台出金」）；人工入金不影響。出金停在「待確認」期間紅包不可開啟；被管理員手動取消、被新出金取代或未成立時，原交易視為未成立、紅包恢復可開啟，新出金送出後再次鎖定。過渡期由前台完成的出金同樣適用。
    即待確認出金可由管理員手動取消，取消後紅包恢復可開啟。此設計與 CLR-CASHFLOW-004（2026-09-15，依 RD 實際畫面確認無手動取消、要求移除該收斂路徑）不同，Oscar 2026-10-12 決定以 10-10 的最新回覆為準，並另開單請
    PM／RD 確認操作入口與 CASHFLOW／TXLOG 需求的同步。
