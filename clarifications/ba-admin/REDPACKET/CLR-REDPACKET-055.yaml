conflict_note: 目標第 400 行、SPEC-CASHFLOW-001@0.2 第 260、345、348、376 行與 SPEC-ARCADE-001@0.8 第 590、879 行定義待確認出金可由管理員手動取消收斂；已落地的
  CLR-CASHFLOW-004（APPLIED，針對 SPEC-CASHFLOW-001@0.1 REQ-CASHFLOW-008／026）定案交易紀錄頁沒有手動取消功能、「Admin/站長手動取消」這條收斂路徑須移除，出金死單只剩新請求取代與人工出金連動取消；SPEC-ROLEPERM-001@0.2
  第八節也只列「待確認入金手動取消」。依規則不因任一方較新而自動採用
