question: 除權重表機率合計外，其餘驗證（門檻、上限、總預算、活動幣種、等級規則、活動名稱字數）不符時系統如何回應：前端阻擋方式與提示文字、後端是否同樣拒絕及回應
context: REQ-REDPACKET-003：儲存時檢查：活動幣種至少勾選一個；預設規則關閉時至少須有一個等級規則；每個等級規則至少勾選一個等級；一個等級只能屬於一個規則；各生效規則（關閉的預設規則不檢查）的累積門檻須大於 0、單週期發放上限須為大於
  0 的整數；總預算有填時須大於 0；權重表至少一列、各列金額須大於 0、機率合計須為 100%（否則阻擋儲存）；活動名稱最多 25 字元。
