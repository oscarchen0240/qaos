question: 換算為核心貨幣後金額的小數位數與捨入方式（影響是否剛好達門檻）
context: REQ-REDPACKET-008：累計基準為有效流水貢獻（有效投注額 × 貢獻系數），以注單結算時點計入，只計以「活動幣種」下注的注單；貢獻系數為 0 的遊戲不計入。非核心貨幣注單的有效流水貢獻於注單結算當下依系統匯率（幣安
  API）換算為核心貨幣後計入，換算後不因匯率變動重算。
