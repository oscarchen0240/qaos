  answer: 依 proto（SPEC-REDPACKET-002@0.2）：PM 2026-10-10 回覆原題 013 明定差異百分比「照 proto」——照 proto：（實際 − 期望）÷ 期望 × 100，取 1 位小數，正值前加「+」；高於期望紅色、低於綠色、相等灰色。
    因此差異 ≥ 0 時一律加「+」（恰為 0 顯示「+0.0%」），以 proto 的判斷顯示色標（絕對值小於 0.005 視為相等、灰色）。
