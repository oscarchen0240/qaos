question: 紅包明細「實際平均紅包金額」差異百分比：差異恰為 0 時顯示「0.0%」或「+0.0%」；差異絕對值小於 0.005% 時以紅／綠（依高低）或灰色標示
context: REQ-REDPACKET-021：紅包明細頂部唯讀顯示：活動設定（活動幣種、派發幣種、參加等級（機台場館顯示「本場館所有機台帳號」）、重置方式、活動時間、總預算已占用／總預算）；規則設定（每規則一列，預設規則關閉時不列）；建立時成本試算（依規則分別顯示，兩組以上規則另顯示整體試算，以建立當下的涵蓋會員人數加權、不隨人數變動）；實際平均紅包金額（依產生當下適用的規則歸屬：已入帳金額合計
  ÷ 已入帳紅包數，僅計已入帳；尚無已入帳時顯示「—」），並顯示與該規則期望金額的差異百分比：（實際 − 期望）÷ 期望 × 100，取 1 位小數，正值前加「+」；高於期望以紅色、低於以綠色、相等以灰色標示（差異為 0 與極小差異的呈現見
  Q02）；發放統計（已產生、已入帳、待開啟、已作廢筆數及已入帳金額合計）。
