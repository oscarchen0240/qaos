question: 「同一站台」的範圍：主站台與其子站台的紅包活動是否各自獨立判斷重疊；某站台的活動是否涵蓋子站台的會員
context: REQ-REDPACKET-017：同一站台同一時間僅能有一個進行中的紅包活動，排程時間重疊時阻擋儲存；重疊判斷只計「進行中」與「排程中」的活動，已取消的活動不占用時段，取消後可立即以相同時段重建。重疊以時間區間嚴格交疊判斷（首尾相接不算重疊；永久活動視為無結束時間），已結束的活動不列入；重疊時於活動時間欄提示衝突的活動名稱（SPEC-REDPACKET-002@0.1）。
