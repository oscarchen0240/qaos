question: 交易紀錄查詢（機台視角）是否提供待確認交易的手動取消？REQ-TXLOG-028 目前依 2026-09-14／09-15 的確認（CLR-TXLOG-001、CLR-CASHFLOW-004）寫為「本頁不提供手動取消」，與
  spec 原文及 CLR-REDPACKET-055 最新答案不一致；適用範圍（出金／入金）與可操作角色為何？
context: SPEC-TXLOG-001 v0.1 §操作與實體機台 v08 第 618 行皆定義交易紀錄查詢提供「手動取消」（僅管理員、僅待確認、二次確認後標為已取消、分數不異動）。2026-09-14 Oscar 確認該段為錯誤敘述（CLR-TXLOG-001），REQ-TXLOG-028
  改為不提供、REQ-TXLOG-029 僅供追溯；2026-09-15 CLR-CASHFLOW-004 依 RD 畫面維持。2026-10-12 Oscar 確認（CLR-REDPACKET-055 rev 1）待確認出金的管理員手動取消是要做的功能，後端已完成、前端未開發。
