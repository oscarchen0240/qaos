question: 線上類型的主站台若帶有子站台，執行刪除時系統如何處理其子站台？
context: CLR-SITELIST-007 已確認機台類型不提供刪除操作（只能停用），但線上類型仍照 spec 原文的一般刪除流程；線上主站台若有子站台，刪除時是阻擋、連子站台一併刪除、還是子站台改掛他處？
options:
- 阻擋刪除，需先刪除或移轉所有子站台
- 連坐刪除所有子站台（含孫層）
- 子站台自動上移為根層或改掛到被刪站台的上層
