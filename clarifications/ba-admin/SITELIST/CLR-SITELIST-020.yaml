question: 額度上限的允許範圍：負數如何拒絕（前端提示與後端回應）、上限值、可否帶小數。CLR-SITELIST-002 rev 0（針對 v0.4）答「前端顯示『值必須大於或等於 0』，後端也拒絕」，但 v0.7 原文未載，且答案 basis
  不同（X16），需以 applicability 綁定到 v0.7 或重新確認
context: REQ-SITELIST-005：額度上限為場館層級設定，該場館底下所有機台帳號共用同一份額度，開分／入金時以全場館機台分數餘額合計檢核；設為 0 代表不限制；修改後即時生效，不影響既有餘額。管理員與站長可設定，操作員唯讀（開發包⑧）。負數、上限與小數位等邊界的拒絕行為
  v0.7 未載（前版依 CLR-SITELIST-002 記載負數雙層驗證，本版列為待綁定決策點 Q02）。
