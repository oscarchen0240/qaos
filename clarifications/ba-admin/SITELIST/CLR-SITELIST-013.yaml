  answer: 選 A：前端限制，後端也拒絕，資料不變；所有權限限制都在後端每一支 API 強制執行（開發包⑧既有規則，站台列表已補註）。因站台不可刪除，限制由三項變為兩項：不可修改自身站台的上層站台、不可將自身站台切為「開通」（含由「更新待審」切回）；站長同樣適用。越權時回傳「無權限」，與
    CLR-SITELIST-015 相同。
