question: 管理員略過前端，以 API 將子站台的上層站台設為其自身或其子孫站台時，後端是否拒絕、回應為何（第 59 行後端強制只列管轄範圍、自身站台限制、角色指派上限，未列循環防護；CLR-SITELIST-006 亦註明未涵蓋）
context: REQ-SITELIST-013：管理員編輯其管轄範圍內的子站台時可於管轄範圍內修改上層站台，選取時自動排除該站台自身及其子站台（循環防護）；管理員對自身所屬站台的上層站台唯讀（見 REQ-SITELIST-035）；站長編輯時上層站台唯讀顯示目前值，如需變更須通知管理員。站長以
  API 修改上層站台時後端拒絕並回傳「無權限」、資料不變（v0.7 第 59、223 行）。管理員以 API 送出循環的上層站台時後端如何回應、以及跨主站台改掛（改到不同類型或不同核心貨幣的主站台底下、或改掛到根站台底下成為主站台）如何處理，v0.7
  未定義（Q03、Q04）。
