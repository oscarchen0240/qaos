question: 根站台 admin 底下能否存在站長帳號；若存在，其起始層與能否看到根站台這一列（v0.7 與開發包⑧只寫根站台自身的管理員看得到根站台列）
context: REQ-SITELIST-011：管理員與站長的可見範圍相同：自身所屬站台及其所有子站台，不含平行或上層站台；根站台 admin 的管理員因所屬站台為根站台，可見範圍等同全平台。起始層一律為自身所屬站台這一列；僅根站台自身的管理員看得到根站台這一列。所屬站台不是主站台時（例如子站台
  A1 的站長），可見範圍為 A1 及其子樹，看不到主站台 A（開發包⑧第四節）。存取管轄範圍外站台（含直接以站台 ID 呼叫查詢 API）時，後端拒絕並回傳「無權限」錯誤、資料不變，不採「當作不存在／回空結果」（v0.7 第 59、223
  行，CLR-SITELIST-015 定案已併入 v0.7）。
