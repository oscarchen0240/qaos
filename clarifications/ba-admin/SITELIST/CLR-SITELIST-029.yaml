conflict_note: 根站台恆為「開通」且網域「行為與一般站台相同」；一般站台「開通」時網域異動會被系統自動切為「更新待審」（適用於所有角色），但根站台不可切為更新待審。兩條規則在根站台網域新增或刪除時互相牴觸；若觸發，根站台無上層、無人能切回開通。開發包⑧
