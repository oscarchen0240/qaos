question: 根站台 admin 新增或刪除網域時：(A) 不觸發更新待審、維持開通；(B) 觸發更新待審（則由誰、如何切回開通）；(C) 根站台的網域不可異動
context: REQ-SITELIST-032：根站台 admin 狀態不可變更、恆為「開通」：列表與編輯視窗的狀態欄唯讀，不可切為暫停／關閉／更新待審；此保護規則後端須一併實作（根站台為全平台單一失效點）。根站台網域異動是否觸發「更新待審」與本條衝突（Q02）。
