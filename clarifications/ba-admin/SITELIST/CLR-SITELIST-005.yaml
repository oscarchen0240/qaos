question: REQ-SITELIST-012 不符合時系統應如何反應？（Spec 未定義拒絕行為）
context: 'Admin 新增站台時可自由選取上層站台（留空為根層）；站長新增站台時上層站台固定為當前所在層，不可修改

  Spec 只定義前端行為（站長欄位唯讀）；未定義若站長繞過前端直接呼叫建立站台 API 並帶入其他上層站台時，後端是否拒絕——此為已知風險區域，Test Designer 應設計對應的負向／探索性案例'
