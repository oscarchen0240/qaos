answer: 已修改：站長不可自由選取上層站台，需點進不同子站後新增站台，上層站台選單會自動帶入其選擇的站台；後端已拒絕（不接受繞過前端指定其他上層站台）。此前 RD 回報的「直接呼叫 API 仍會成功」風險已修復。
