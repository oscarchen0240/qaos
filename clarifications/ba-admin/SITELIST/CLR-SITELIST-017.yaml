question: 與 REQ-SITELIST-022 同一衝突（v0.6 原文可刪除子站台 vs CLR-SITELIST-008／009 任何站台皆不可刪除），應一併裁定；若採 v0.6 原文，刪除仍有子站台的站台時子樹如何處理 v0.6
  亦未定義。
context: REQ-SITELIST-023：v0.6 原文：刪除前顯示確認彈窗，二次確認後執行，操作不可復原。本條是否成立取決於 REQ-SITELIST-022 的裁定：若採 CLR-SITELIST-008／009（不提供刪除），本條情境不會發生、僅供追溯（v0.4
  RM 結論）；若採 v0.6 原文（子站台可刪除），則刪除仍有子站台的站台時其子樹（子站台、孫層）如何處理 v0.6 未定義，v0.4 時期經 CLR-SITELIST-007～009 視為 moot 的疑慮重新成立。
options:
- 採 CLR-SITELIST-008／009：不提供刪除，本條情境不會發生，僅供追溯
- 採 v0.6，有子站台時阻擋刪除，須先移轉或刪除所有子站台
- 採 v0.6，串聯刪除整個子樹（含孫層）
- 採 v0.6，子站台自動改掛到被刪站台的上層
