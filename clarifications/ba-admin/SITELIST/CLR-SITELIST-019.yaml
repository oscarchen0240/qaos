question: 新站台建立時，是否自動於該站台自己的「鏈上錢包管理」啟用核心貨幣對應幣別、且不依賴根站台 admin 的鏈上錢包管理狀態。CLR-SITELIST-012 rev 0（針對 v0.4，修正 CLR-SITELIST-011）答「會自動啟用、不依賴上層」，但
  v0.7 原文未載，且答案 basis 不同（X16），需以 applicability 綁定到 v0.7 或請 PM 補入 spec
context: REQ-SITELIST-002：站台類型於主站台（根站台 admin 底下第一層）選定，其下所有子站台一律與主站台同類型、不可個別選擇（新增視窗唯讀跟隨主站台）；根站台 admin 不參與繼承鏈，故於根站台底下新增主站台時可自由選擇線上或機台，核心貨幣依所選類型連動。以下兩點為前版依
  CLR 記載、v0.7 原文未載的行為，本版列為待綁定決策點（見 Q02、Q03）：子站台以 API 帶入與上層不同類型時後端拒絕（CLR-SITELIST-001）；新站台建立時自動於該站台自己的鏈上錢包管理啟用對應幣別、不依賴根站台 admin
  的設定（CLR-SITELIST-012，修正 CLR-SITELIST-011）。
