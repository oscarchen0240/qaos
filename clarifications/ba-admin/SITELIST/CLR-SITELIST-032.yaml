question: 以 API 建立子站台並帶入與主站台不同的站台類型時，後端拒絕的回應內容為何（錯誤代碼、訊息、HTTP 狀態）？
context: CLR-SITELIST-018 依 CLR-SITELIST-001 rev 0 已答「後端會擋下」，但未定義回應內容。v0.7 第 59、223 行的「無權限」只涵蓋權限類越權，類型不符不一定屬於同一類；若後端統一回「無權限」，請一併說明，錯誤代碼可與
  CLR-SITELIST-030 一起確認。
