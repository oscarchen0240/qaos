<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>機台更新包 — bl'ac 後台</title>
<style>
:root{
  --bg-page:#0d0d0b;   --bg-sidebar:#111110; --bg-card:#181816;
  --bg-hover:#1e1e1c;  --bg-input:#111110;
  --bg-panel:#141412;  --bg-active:#232320;
  --text-primary:#dedad2; --text-secondary:#6b6965; --text-muted:#3d3d3b;
  --border:#242422;    --border-focus:#3d3d3b;      --border-light:#3d3d3b;
  --green:#1D9E75;  --green-text:#5DCAA5;  --green-dim:#0F2E23;
  --blue:#378ADD;   --blue-text:#85B7EB;   --blue-dim:#0C2A4A;
  --red-text:#F09595;    --red-dim:#3A1818;
  --yellow-text:#EF9F27; --yellow-dim:#2E2000;
  --orange-text:#E8894A; --orange-dim:#2E1800;
  --purple-text:#B09FE8; --purple-dim:#2A1F3D;
  --gray-sw:#3a3a38;
  --sidebar-width:160px; --topbar-height:48px;
  --radius:6px; --radius-lg:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg-page);color:var(--text-primary);font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}

/* ── 框架 ── */
.topbar{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;background:var(--bg-sidebar);flex-shrink:0;}
.topbar-logo{font-size:15px;font-weight:600;letter-spacing:-0.02em;} .topbar-logo span{opacity:0.4;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px;}
.topbar-tag{font-size:12px;color:var(--text-secondary);background:var(--bg-hover);border:1px solid var(--border);padding:3px 9px;border-radius:4px;}
.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 48px);}
.sidebar{width:160px;background:var(--bg-sidebar);border-right:1px solid var(--border);padding:8px 0;flex-shrink:0;overflow-y:auto;}
.sidebar-group{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;font-size:13px;color:var(--text-secondary);cursor:pointer;}
.sidebar-group:hover,.sidebar-group.active{color:var(--text-primary);}
.sidebar-group .arr{font-size:10px;opacity:0.4;}
.sidebar-item{padding:6px 14px 6px 26px;font-size:13px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-item:hover{color:var(--text-primary);background:var(--bg-hover);}
.sidebar-item.active{color:var(--text-primary);}
.main{flex:1;overflow-y:auto;padding:24px 28px 60px;}
.breadcrumb{font-size:12px;color:var(--text-secondary);margin-bottom:16px;}
.breadcrumb span{opacity:0.35;margin:0 5px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:18px;font-weight:500;color:var(--text-primary);}
.page-header-right{display:flex;align-items:center;gap:10px;}

/* ── 按鈕 ── */
.btn-primary{background:var(--text-primary);color:#0d0d0b;border:none;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;}
.btn-primary:hover{opacity:0.8;}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:6px 12px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--border-focus);background:var(--bg-hover);}
.btn-sm{padding:3px 9px;font-size:12px;white-space:nowrap;border-radius:var(--radius);font-family:inherit;cursor:pointer;}
.btn-sm:not(.btn-primary){background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-sm:hover{color:var(--text-primary);border-color:var(--border-focus);background:var(--bg-hover);}
.btn-sm.danger:hover{color:var(--red-text);border-color:var(--red-text);}

/* ── 表單 ── */
.field{margin-bottom:13px;}
label.field-label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;}
input[type=text],input[type=number],select,textarea{width:100%;padding:7px 10px;font-size:13px;font-family:inherit;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-input);color:var(--text-primary);outline:none;transition:border-color .15s;}
input::placeholder{color:var(--text-muted);}
input:focus,select:focus,textarea:focus{border-color:var(--border-focus);}
select option{background:#181816;}
textarea{resize:vertical;min-height:80px;}

/* ── 更新包版面 ── */
.up-meta{display:flex;gap:6px;align-items:center;}
.up-tag{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap;}
.tag-date{background:var(--bg-hover);color:var(--text-secondary);border:1px solid var(--border);}
.tag-pkg{background:var(--blue-dim);color:var(--blue-text);}
.tag-ui{background:var(--green-dim);color:var(--green-text);}
.tag-be{background:var(--purple-dim);color:var(--purple-text);}
.tag-open{background:var(--yellow-dim);color:var(--yellow-text);}

.sec{margin-bottom:22px;}
.sec-label{font-size:11px;color:var(--text-muted);letter-spacing:0.06em;margin-bottom:9px;text-transform:uppercase;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.diff-col{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;}
.diff-col.before{border-color:var(--red-dim);}
.diff-col.after{border-color:var(--green-dim);}
.diff-head{font-size:11px;letter-spacing:0.04em;margin-bottom:7px;}
.diff-col.before .diff-head{color:var(--red-text);}
.diff-col.after .diff-head{color:var(--green-text);}
.diff-body{font-size:12px;color:var(--text-secondary);line-height:1.75;}
.diff-body b,.card b{color:var(--text-primary);font-weight:500;}
.strike{text-decoration:line-through;opacity:0.45;}

.bullets{list-style:none;font-size:12px;color:var(--text-secondary);line-height:1.9;}
.bullets li{padding-left:14px;position:relative;}
.bullets li::before{content:'·';position:absolute;left:3px;color:var(--text-muted);}
.hint{font-size:12px;color:var(--text-secondary);background:var(--bg-panel);border:1px solid var(--border);border-left:2px solid var(--border-light);border-radius:var(--radius);padding:9px 12px;line-height:1.75;}
.warn-box{font-size:12px;color:var(--yellow-text);background:var(--yellow-dim);border:1px solid var(--yellow-dim);border-radius:var(--radius);padding:9px 12px;line-height:1.75;}
.warn-box b{color:var(--yellow-text);font-weight:600;}

/* ── 迷你列表 ── */
.list-wrap{overflow-x:auto;overflow-y:visible;}
.list-wrap > .list-header,.list-wrap > .list-body{min-width:max-content;}
.list-header{display:grid;align-items:center;padding:5px 14px 6px;margin-bottom:2px;border-bottom:1px solid var(--border);}
.list-header > span{font-size:11px;color:var(--text-muted);letter-spacing:0.04em;white-space:nowrap;padding-right:12px;}
.up-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:7px;}
.up-card:hover{border-color:var(--border-focus);}
.up-row{display:grid;align-items:center;padding:11px 14px;}
.up-row > div{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px;}
.up-row .strong{color:var(--text-primary);}
.mono{font-variant-numeric:tabular-nums;}

/* 帳號類型標籤 */
.acct-tag{font-size:11px;padding:2px 8px;border-radius:4px;}
.acct-slot{background:var(--orange-dim);color:var(--orange-text);}
.acct-online{background:var(--blue-dim);color:var(--blue-text);}

/* 多幣別錢包（與整站 proto 同一組 class） */
.wal-cell{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;}
.wal-cell.right{align-items:flex-end;}
.wal-main{display:inline-flex;align-items:center;gap:5px;cursor:pointer;}
.wal-caret{font-size:9px;color:var(--text-muted);line-height:1;transition:transform .15s;}
.wal-main:hover .wal-caret{color:var(--text-secondary);}
.wal-cell.open .wal-caret{transform:rotate(180deg);}
.wal-detail{display:none;flex-direction:column;gap:2px;padding-top:1px;}
.wal-cell.open .wal-detail{display:flex;}
.wal-line{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--text-secondary);}
.wal-cell.right .wal-line{justify-content:flex-end;}
.wal-ccy{font-size:10px;color:var(--text-muted);letter-spacing:0.04em;}
.wal-amt{font-variant-numeric:tabular-nums;}

/* label-value 區塊（詳細頁樣式） */
.kv{display:flex;align-items:baseline;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(36,36,34,.4);}
.kv:last-child{border-bottom:none;}
.kv-label{font-size:12px;color:var(--text-muted);padding-right:8px;}
.kv-val{font-size:12px;color:var(--text-primary);text-align:right;}
.block-title{font-size:13px;color:var(--text-primary);margin-bottom:8px;}

/* 計數器示意 */
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
.counter{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.counter-label{font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.counter-val{font-size:16px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.counter.bump{border-color:var(--green);}
.op-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.log{background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;font-size:11px;color:var(--text-secondary);line-height:1.9;max-height:150px;overflow-y:auto;}
.log .ok{color:var(--green-text);} .log .no{color:var(--text-muted);} .log .warn{color:var(--yellow-text);}

/* 流程示意 */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;}
.flow-step{flex:1 1 150px;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.flow-step.hot{border-color:var(--blue);}
.flow-step-t{font-size:12px;color:var(--text-primary);margin-bottom:4px;}
.flow-step-d{font-size:11px;color:var(--text-secondary);line-height:1.7;}
.flow-arrow{display:flex;align-items:center;color:var(--text-muted);font-size:14px;}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.seg button{background:transparent;border:none;color:var(--text-secondary);font-size:12px;padding:5px 12px;}
.seg button.on{background:var(--bg-active);color:var(--text-primary);}

.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
.inline-form .field{margin-bottom:0;width:130px;}

/* 總覽表 */
.ov-row{display:grid;grid-template-columns:34px minmax(230px,1.4fr) 110px 130px 90px;align-items:center;padding:11px 14px;cursor:pointer;}
.ov-row > div{font-size:12px;color:var(--text-secondary);padding-right:12px;}
.ov-head{display:grid;grid-template-columns:34px minmax(230px,1.4fr) 110px 130px 90px;padding:5px 14px 6px;border-bottom:1px solid var(--border);margin-bottom:2px;}
.ov-head > span{font-size:11px;color:var(--text-muted);letter-spacing:0.04em;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;}
.overlay.active{display:flex;}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);width:560px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;}
.modal-head{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;}
.modal-head .x{background:transparent;border:none;color:var(--text-secondary);font-size:15px;}
.modal-body{padding:16px;overflow-y:auto;}
.modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.token-box{background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-primary);line-height:1.7;word-break:break-all;white-space:pre-wrap;max-height:180px;overflow-y:auto;}

.toast{position:fixed;right:20px;bottom:20px;background:var(--green-dim);color:var(--green-text);border:1px solid var(--green);border-radius:var(--radius);padding:9px 14px;font-size:12px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:80;}
.toast.show{opacity:1;transform:translateY(0);}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#2a2a28;border-radius:2px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">bl<span>'</span>ac</div>
  <div class="topbar-right">
    <span class="topbar-tag">UTC+00:00</span>
    <span class="topbar-tag">繁體中文</span>
    <span class="topbar-tag">OAAE27852 站長</span>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="breadcrumb">實體機台 <span>/</span> 機台更新包 <span>/</span> <span id="bc-item" style="opacity:1;margin:0;">總覽</span></div>
    <div class="page-header">
      <h1 class="page-title" id="pg-title">總覽</h1>
      <div class="page-header-right"><div class="up-meta" id="pg-meta"></div></div>
    </div>
    <div id="panel"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><span id="m-title">標題</span><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot" id="m-foot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Toast ──
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2500);
}

// ── Modal ──
function openModal(title, body, foot){
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-body').innerHTML = body;
  document.getElementById('m-foot').innerHTML = foot || '<button class="btn-ghost" onclick="closeModal()">關閉</button>';
  document.getElementById('overlay').classList.add('active');
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

const fmt = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// ── 本包各節 ──
const ITEMS = [
  {n:'總覽',                       path:'',                                     pkg:'', kind:''},
  {n:'一、多幣別錢包展開顯示',        path:'會員與加盟商 / 會員列表',                 pkg:'相依 —',      kind:'ui'},
  {n:'二、存款／提款累計欄位',        path:'會員與加盟商 / 會員列表',                 pkg:'相依 ③⑤',    kind:'ui'},
  {n:'三、機台憑證（JWT）',          path:'會員與加盟商 / 會員詳細資料頁',            pkg:'相依 ③',     kind:'ui'},
  {n:'四、場館設定的洗分門檻',        path:'後台管理員系統 / 站台列表 / 場館設定',      pkg:'相依 ②③',    kind:'ui'},
  {n:'五、交易紀錄的兩項欄位規則',     path:'各式報表 / 交易紀錄查詢',                 pkg:'相依 ③④',    kind:'ui'},
  {n:'六、場館日結報表',             path:'各式報表 / 場館日結報表',                 pkg:'相依 ③⑤',    kind:'ui'},
  {n:'七、入金額度上限的判定與預留',     path:'無後台畫面（機台對接 API 平台側邏輯）',     pkg:'相依 ③',     kind:'be'},
];

let current = 0;

function renderSidebar(){
  let h = '<div class="sidebar-group active">機台更新包 <span class="arr" style="opacity:0.7;">∨</span></div>';
  ITEMS.forEach((it,i)=>{
    h += `<div class="sidebar-item${i===current?' active':''}" onclick="showItem(${i})" title="${it.n}">${it.n}</div>`;
  });
  h += '<div class="sidebar-group" onclick="notHere()">開發包①～⑥ <span class="arr">›</span></div>';
  h += '<div class="sidebar-group" onclick="notHere()">會員與加盟商 <span class="arr">›</span></div>';
  document.getElementById('sidebar').innerHTML = h;
}
function notHere(){ showToast('本 proto 只涵蓋開發包⑦；其他包的規格請看各包 spec'); }

function showItem(i){
  current = i;
  const it = ITEMS[i];
  document.getElementById('pg-title').textContent = it.n;
  document.getElementById('bc-item').textContent = it.n;
  document.getElementById('pg-meta').innerHTML = i === 0 ? '' :
    `<span class="up-tag tag-date">${it.path}</span>
     <span class="up-tag tag-pkg">${it.pkg}</span>
     <span class="up-tag ${it.kind==='be'?'tag-be':'tag-ui'}">${it.kind==='be'?'純後端':'有畫面'}</span>`;
  document.getElementById('panel').innerHTML = PANELS[i]();
  if (AFTER[i]) AFTER[i]();
  renderSidebar();
  document.querySelector('.main').scrollTop = 0;
}

// ── 共用片段 ──
function sec(label, inner){ return `<div class="sec">${label?`<div class="sec-label">${label}</div>`:''}${inner}</div>`; }
function desc(text){ return sec('功能說明', `<div class="card"><div class="diff-body">${text}</div></div>`); }
function points(arr){ return `<div class="card"><ul class="bullets">${arr.map(t=>`<li>${t}</li>`).join('')}</ul></div>`; }
function ruleTable(rows){
  return `<div class="card"><table style="width:100%;border-collapse:collapse;">${rows.map(r=>
    `<tr><td style="vertical-align:top;padding:6px 12px 6px 0;font-size:12px;color:var(--text-primary);white-space:nowrap;">${r[0]}</td>
         <td style="vertical-align:top;padding:6px 0;font-size:12px;color:var(--text-secondary);line-height:1.75;">${r[1]}</td></tr>`).join('')}</table></div>`;
}

const PANELS = [];
const AFTER = [];

// ══════════════════════════════════════════
// 0. 總覽
// ══════════════════════════════════════════
const SCOPE = [
  ['多幣別錢包展開顯示（會員列表／側邊面板／詳細頁）', 1, '在本包'],
  ['存款／提款累計欄位（機台四種金流的計入時點）',     1, '在本包'],
  ['機台憑證（JWT）',                              1, '在本包'],
  ['場館設定的洗分門檻（改於機台端）',                1, '在本包'],
  ['交易紀錄的場次編號與餘額不足規則',                1, '在本包'],
  ['場館日結報表的場次數與計價幣別',                  1, '在本包'],
  ['入金額度上限的判定時點（純後端）',                1, '在本包'],
  ['四種金流的完整流程、場次規則、對接 API',          0, '開發包③'],
  ['洗分出金核實的核實與作廢流程',                    0, '開發包⑤'],
  ['排除規則政策層、操作員角色',                      0, '開發包⑥'],
];

PANELS[0] = () => {
  const rows = SCOPE.map(r=>`<div class="up-card"><div class="up-row" style="grid-template-columns:minmax(300px,1fr) 110px;min-width:480px;">
      <div class="${r[1]?'strong':''}">${r[0]}</div>
      <div>${r[1] ? '<span class="up-tag tag-ui">✅ 在本包</span>' : `<span class="up-tag tag-date">❌ ${r[2]}</span>`}</div>
    </div></div>`).join('');
  const nav = ITEMS.slice(1).map((it,i)=>`<div class="up-card"><div class="ov-row" onclick="showItem(${i+1})">
      <div class="strong">${i+1}</div>
      <div class="strong">${it.n.replace(/^[一二三四五六七]、/,'')}</div>
      <div>${it.path}</div>
      <div>${it.pkg}</div>
      <div><span class="up-tag ${it.kind==='be'?'tag-be':'tag-ui'}">${it.kind==='be'?'純後端':'有畫面'}</span></div>
    </div></div>`).join('');
  return `
  ${sec('開發包說明', `<div class="hint">本 proto 對應 <b>開發包⑦（機台功能更新）</b>，自正本 <b>實體機台_spec_v07.md</b> 抽錄；<b>兩檔規格如有出入一律以正本為準</b>。本包收錄的是六個開發包發出之後才定案的規格，交付對象為已拿到<b>開發包①</b>的工程師。</div>`)}

let CNT = {dc:0, da:0, wc:0, wa:0};

function cntReset(){ CNT={dc:0,da:0,wc:0,wa:0}; PENDING=[]; LOG=[]; showItem(2); }
function cntOp(kind){
  const amt = kind==='開分' ? 500 : kind==='入金' ? 1000 : kind==='洗分' ? 300 : kind==='出金' ? 221 : 800;
  if (kind==='開分' || kind==='入金'){
    CNT.dc++; CNT.da += amt;
    LOG.unshift(`<span class="ok">＋計入存款</span>　機台${kind} ${fmt(amt)}（交易完成當下直接累計，不需核實）`);
  } else if (kind==='洗分' || kind==='出金'){
    PENDING.push({kind, amt});
    LOG.unshift(`<span class="warn">待核實</span>　機台${kind} ${fmt(amt)}（<b>尚未計入</b>提款，等核實）`);
  } else {
    LOG.unshift(`<span class="no">不計入</span>　${kind} ${fmt(amt)}（人工入出金一律不計這四個欄位）`);
  }
  showItem(2);
}
function cntVerify(i, ok){
  const p = PENDING.splice(i,1)[0];
  if (ok){
    CNT.wc++; CNT.wa += p.amt;
    LOG.unshift(`<span class="ok">＋計入提款</span>　機台${p.kind} ${fmt(p.amt)} 已核實（核實當下累計）`);
  } else {
    LOG.unshift(`<span class="no">永不計入</span>　機台${p.kind} ${fmt(p.amt)} 已作廢`);
  }
  showItem(2);
}

function calcWash(){
  const bal = parseFloat(document.getElementById('w-bal').value) || 0;
  const th  = parseFloat(document.getElementById('w-th').value);
  const out = document.getElementById('w-out');
  if (isNaN(th) || th < 0){
    out.innerHTML = `<div class="warn-box"><b>6-BAD DATA/FORMAT</b>　門檻為負值／缺漏／非數值 → 防禦性拒絕</div>`;
    return;
  }
  if (th === 0){
    out.innerHTML = bal <= 0
      ? `<div class="warn-box"><b>1-NO CREDITS</b>　餘額為 0，回覆餘額不足（不寫入交易紀錄，見第五節）</div>`
      : `<div class="card"><ul class="bullets"><li>門檻 <b>0</b>＝洗出<b>全部餘額</b>、不做取整</li><li>核可金額 <b>${fmt(bal)}</b>　餘數 <b>${fmt(0)}</b>　洗分後餘額 <b>${fmt(0)}</b></li></ul></div>`;
    return;
  }
  const ok = Math.floor(bal / th) * th;
  const rest = bal - ok;
  out.innerHTML = ok === 0
    ? `<div class="warn-box"><b>1-NO CREDITS</b>　以門檻 ${fmt(th)} 捨去後可洗金額為 0 → 回覆餘額不足（<b>不寫入交易紀錄</b>）</div>`
    : `<div class="card"><ul class="bullets">
        <li>核可金額 <b>${fmt(ok)}</b>（以門檻 ${fmt(th)} 為單位捨去）</li>
        <li>餘數 <b>${fmt(rest)}</b> — <b>繼續留在機台帳號上，不會被清除</b></li>
        <li>洗分後機台餘額 <b>${fmt(rest)}</b></li></ul></div>`;
}
