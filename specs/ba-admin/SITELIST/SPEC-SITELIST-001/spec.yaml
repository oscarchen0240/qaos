  change_summary: v04→v06：新增根站台 admin（代碼 ZZ，全平台唯一、受保護）；Admin 改名「管理員」且每個站台皆有，可見範圍與站長相同（自身站台及所有子站台），差別在操作深度；管理員對自身站台不可改上層、不可刪除、不可切為開通；「開通」改由上層站台的管理員切換；新增角色指派權限；主站台定義為根站台
    admin 底下第一層
