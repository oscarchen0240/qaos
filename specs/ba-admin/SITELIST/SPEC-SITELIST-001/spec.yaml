  change_summary: v06→v07：依 CLR-SITELIST-013～017 定案——站台一律不可刪除（移除刪除權限列、刪除按鈕、刪除站台小節與刪除確認規則；自身站台限制改為兩項）；權限一律由後端強制、越權回「無權限」且資料不變；角色指派（站長可指派操作員，管理員可指派所有角色）。proto
    同步 v07
