# 機器可讀狀態機（對應 docs/architecture/03-state-machines.md）。Runtime 只允許此處列出的轉換。
# by: 允許的觸發者類別 — agent:<id> | human | system
schema_version: "1.0"
machines:
  testcase:
    initial: DRAFT
    terminal: [SUPERSEDED, RETIRED]
    transitions:
      - {from: DRAFT,             to: VALIDATING,        by: [system]}
      - {from: VALIDATING,        to: VALIDATED,         by: [system], requires: "TestValidationReport.result == PASS"}
      - {from: VALIDATING,        to: VALIDATION_FAILED, by: [system], requires: "TestValidationReport.result == FAIL"}
      - {from: VALIDATION_FAILED, to: DRAFT,             by: [system]}
      - {from: VALIDATION_FAILED, to: PENDING_APPROVAL,  by: [system], requires: "ApprovalRequest(HUMAN_OVERRIDE)"}
      - {from: VALIDATED,         to: PENDING_APPROVAL,  by: [system], requires: "ApprovalRequest(ACTIVATE_TESTCASE|APPLY_CHANGE)"}
      - {from: PENDING_APPROVAL,  to: APPROVED,          by: [human],  requires: "ApprovalDecision(approve|override)"}
      - {from: PENDING_APPROVAL,  to: DRAFT,             by: [human],  requires: "ApprovalDecision(reject)"}
      - {from: APPROVED,          to: ACTIVE,            by: [system], requires: "COMMIT_TO_REGISTRY"}
      - {from: ACTIVE,            to: SUPERSEDED,        by: [system], requires: "newer version ACTIVE"}
      - {from: ACTIVE,            to: RETIRED,           by: [human],  requires: "ApprovalDecision(RETIRE_TESTCASE|APPLY_CHANGE)"}
  bug:
    initial: DRAFT
    terminal: [CLOSED, REJECTED]
    transitions:
      - {from: DRAFT,               to: VALIDATING,          by: [system]}
      - {from: VALIDATING,          to: VALIDATED,           by: [system], requires: "BugValidationReport.result == PASS"}
      - {from: VALIDATING,          to: VALIDATION_FAILED,   by: [system], requires: "BugValidationReport.result == FAIL"}
      - {from: VALIDATING,          to: AMBIGUITY_ESCALATED, by: [system], requires: "BugValidationReport.result == AMBIGUITY"}
      - {from: VALIDATION_FAILED,   to: DRAFT,               by: [system]}
      - {from: VALIDATION_FAILED,   to: REJECTED,            by: [human],  requires: "ApprovalDecision(CONFIRM_DUPLICATE)"}
      - {from: AMBIGUITY_ESCALATED, to: DRAFT,               by: [human],  requires: "ApprovalDecision(RESOLVE_AMBIGUITY)"}
      - {from: AMBIGUITY_ESCALATED, to: REJECTED,            by: [human]}
      - {from: VALIDATED,           to: PENDING_APPROVAL,    by: [system], requires: "ApprovalRequest(OPEN_BUG)"}
      - {from: PENDING_APPROVAL,    to: OPEN,                by: [human],  requires: "ApprovalDecision(approve|override) + COMMIT_BUG"}
      - {from: PENDING_APPROVAL,    to: DRAFT,               by: [human],  requires: "ApprovalDecision(reject)"}
      - {from: OPEN,                to: IN_PROGRESS,         by: [human]}
      - {from: IN_PROGRESS,         to: RESOLVED,            by: [human]}
      - {from: RESOLVED,            to: VERIFIED,            by: [human],  requires: "TestExecution(pass)"}
      - {from: RESOLVED,            to: OPEN,                by: [human]}
      - {from: VERIFIED,            to: CLOSED,              by: [human],  requires: "ApprovalDecision(CLOSE_BUG)"}
  change_impact:
    initial: DETECTED
    terminal: [APPLIED, NO_IMPACT]
    transitions:
      - {from: DETECTED,             to: ANALYZING,            by: [system]}
      - {from: ANALYZING,            to: NO_IMPACT,            by: [system]}
      - {from: ANALYZING,            to: IMPACTED,             by: [system]}
      - {from: IMPACTED,             to: TEST_UPDATE_REQUIRED, by: [system]}
      - {from: TEST_UPDATE_REQUIRED, to: VALIDATING,           by: [system]}
      - {from: VALIDATING,           to: TEST_UPDATE_REQUIRED, by: [system]}
      - {from: VALIDATING,           to: COMPARING,            by: [system]}
      - {from: COMPARING,            to: PENDING_APPROVAL,     by: [system]}
      - {from: PENDING_APPROVAL,     to: APPLIED,              by: [human]}
      - {from: PENDING_APPROVAL,     to: TEST_UPDATE_REQUIRED, by: [human]}
  workflow_run:
    initial: CREATED
    terminal: [COMPLETED, FAILED, CANCELLED]
    transitions:
      - {from: CREATED,       to: RUNNING,       by: [system]}
      - {from: RUNNING,       to: WAITING_HUMAN, by: [system]}
      - {from: WAITING_HUMAN, to: RUNNING,       by: [human, system]}
      - {from: RUNNING,       to: FAILED,        by: [system]}
      - {from: RUNNING,       to: COMPLETED,     by: [system]}
      - {from: RUNNING,       to: CANCELLED,     by: [human]}
      - {from: WAITING_HUMAN, to: CANCELLED,     by: [human]}
  task:
    initial: PENDING
    terminal: [DONE, FAILED]
    transitions:
      - {from: PENDING,          to: READY,            by: [system]}
      - {from: READY,            to: RUNNING,          by: [system]}
      - {from: RUNNING,          to: ARTIFACT_INVALID, by: [system]}
      - {from: RUNNING,          to: GATE_FAILED,      by: [system]}
      - {from: RUNNING,          to: DONE,             by: [system]}
      - {from: ARTIFACT_INVALID, to: READY,            by: [system]}
      - {from: GATE_FAILED,      to: READY,            by: [system]}
      - {from: ARTIFACT_INVALID, to: FAILED,           by: [system]}
      - {from: GATE_FAILED,      to: FAILED,           by: [system]}
      - {from: RUNNING,          to: FAILED,           by: [system], requires: "permission violation"}
  artifact:
    initial: DRAFT
    terminal: [SUPERSEDED]
    transitions:
      - {from: DRAFT,     to: SUBMITTED,  by: [system]}
      - {from: SUBMITTED, to: VALID,      by: [system]}
      - {from: SUBMITTED, to: INVALID,    by: [system]}
      - {from: VALID,     to: SUPERSEDED, by: [system]}
      - {from: INVALID,   to: SUPERSEDED, by: [system]}
  test_suite:
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT,            to: PENDING_APPROVAL, by: [system]}
      - {from: PENDING_APPROVAL, to: ACTIVE,           by: [human], requires: "ApprovalDecision(approve|override)"}
      - {from: PENDING_APPROVAL, to: DRAFT,            by: [human]}
      - {from: ACTIVE,           to: RETIRED,          by: [human]}
  requirement:
    initial: DRAFT
    terminal: [RETIRED]
    transitions:
      - {from: DRAFT,   to: ACTIVE,  by: [system], requires: "G-SPEC PASS and no critical ambiguity (or resolved)"}
      - {from: ACTIVE,  to: CHANGED, by: [system]}
      - {from: CHANGED, to: ACTIVE,  by: [system], requires: "new version"}
      - {from: ACTIVE,  to: RETIRED, by: [system]}
      - {from: CHANGED, to: RETIRED, by: [system]}
  approval_request:
    initial: PENDING
    terminal: [DECIDED, EXPIRED, CANCELLED]
    transitions:
      - {from: PENDING, to: DECIDED,   by: [human]}
      - {from: PENDING, to: EXPIRED,   by: [system]}
      - {from: PENDING, to: CANCELLED, by: [human]}
  clarification:
    initial: OPEN
    terminal: [APPLIED, WITHDRAWN]
    # 需求 A 第 6 章 §3（A1～A10）。kinds 限定適用的 kind；沒有 kind 的舊 CLR 視為 spec_question。
    transitions:
      - {from: OPEN,         to: ASKED,        by: [human],  requires: "A1：ask（--sent-at、--channel 選填；補記時兩個時間都保留）"}
      - {from: OPEN,         to: ANSWERED,     by: [human],  kinds: [spec_question, conflict_resolution], requires: "A2：answer（answer_sources 驗證通過；記錄此 rev 的 basis）"}
      - {from: ASKED,        to: ANSWERED,     by: [human],  kinds: [spec_question, conflict_resolution], requires: "A2"}
      - {from: ANSWERED,     to: ANSWERED,     by: [human],  kinds: [spec_question, conflict_resolution], requires: "A3：追加一筆 answer_rev（舊修訂不變）"}
      - {from: ANSWERED,     to: INCORPORATED, by: [system], kinds: [spec_question, conflict_resolution], requires: "A4：提交的 revision／BugDraft 以明確 SourceRef 引用最新 answer_rev 且通過 X16；追加 incorporated landing"}
      - {from: INCORPORATED, to: INCORPORATED, by: [system], kinds: [spec_question, conflict_resolution], requires: "A4'：再被引用，只追加 landing"}
      - {from: INCORPORATED, to: ANSWERED,     by: [human],  kinds: [spec_question, conflict_resolution], requires: "A5：answer 追加新 answer_rev（需要重新納入；landings 保留）"}
      - {from: INCORPORATED, to: APPLIED,      by: [human],  kinds: [spec_question, conflict_resolution], requires: "A6：apply --path a6（第 6 章 §5）"}
      - {from: ANSWERED,     to: APPLIED,      by: [human],  kinds: [spec_question, conflict_resolution], requires: "A6b：apply --path a6b（bug reject 路徑）；A7：apply --path a7（no_change／out_of_scope 且全部歷史沒有引用）"}
      - {from: OPEN,         to: APPLIED,      by: [human],  kinds: [document_request], requires: "A8：fulfill／waive-item／核准的 waive_missing 之後的最後判定，全部項目都是有效 fulfillment 或 waived（第 6 章 §6.6）"}
      - {from: ASKED,        to: APPLIED,      by: [human],  kinds: [document_request], requires: "A8"}
      - {from: OPEN,         to: WITHDRAWN,    by: [system], kinds: [document_request], requires: "A9：核准的 waive_missing 涵蓋全部項目且沒有有效 fulfillment（第 6 章 §6.7）"}
      - {from: ASKED,        to: WITHDRAWN,    by: [system], kinds: [document_request], requires: "A9"}
      - {from: OPEN,         to: WITHDRAWN,    by: [human],  requires: "A10：withdraw --reason（必填）"}
      - {from: ASKED,        to: WITHDRAWN,    by: [human],  requires: "A10"}
      - {from: ANSWERED,     to: WITHDRAWN,    by: [human],  requires: "A10"}
      - {from: INCORPORATED, to: WITHDRAWN,    by: [human],  requires: "A10：引用它的 revision 在下次判定時為 decision_revised"}
