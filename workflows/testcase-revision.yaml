workflow_id: testcase-revision
version: "1.0.0"
description: Human 對正式（ACTIVE）Test Case 提出修訂或退回重審：新版本 Draft → Validator → APPLY_CHANGE 核准 → 新版 ACTIVE、舊版 SUPERSEDED
input:
  fields:
    testcase_id: {required: true}
    reason: {required: true, description: 為什麼要改（Human 填）}
    spec_id: {required: true}
    spec_version: {required: true}
    initiated_by: {required: true}
initial_state: {workflow_run: CREATED, testcase: ACTIVE}
agents: [agent-supervisor, agent-test-designer, agent-test-validator]
artifacts:
  - {type: TestCaseDraft, producer: agent-test-designer, note: "mode=change，supersedes_testcase 指向現行 ACTIVE 版本"}
  - {type: TestDesignReport, producer: agent-test-designer}
  - {type: TestValidationReport, producer: agent-test-validator}
  - {type: ApprovalRequest, producer: agent-supervisor}
  - {type: WorkflowSummary, producer: agent-supervisor}
max_validation_iterations: 3
tasks:
  - id: T1
    agent: agent-test-designer
    mode: change
    inputs: ["TestCaseVersion(current ACTIVE)", "Human reason", RequirementModel]
    outputs: [TestDesignReport, TestCaseDraft]
    gate: G-DESIGN
  - id: T2
    agent: agent-test-validator
    inputs: [SpecVersion, RequirementModel, TestCaseDraft]
    outputs: [TestValidationReport]
    gate: G-TVAL
    on_result: {PASS: "新版本 VALIDATED", FAIL: "回 T1"}
  - id: T3
    type: approval
    approval_type: ACTIVATE_TESTCASE
    on_decision: {approve: "新版 ACTIVE、舊版 SUPERSEDED", reject: "回 T1"}
  - id: T4
    agent: agent-supervisor
    outputs: [WorkflowSummary]
gates: [G-DESIGN, G-TVAL, G-APPROVAL]
failure_handling: {gate_fail: "同 spec-to-testcase"}
human_approval: {required: [ACTIVATE_TESTCASE], conditional: [HUMAN_OVERRIDE]}
output: ["新 TestCaseVersion ACTIVE", WorkflowSummary]
final_state: {workflow_run: [COMPLETED, CANCELLED], testcase: ACTIVE}
