record_id: MAN-20260913-011
title: '[後端][系統使用者列表] 當前使用中的站長帳號，不論站台視角，皆查無此帳號'
tester: oscarchen@blockaction.tech
tested_at: '2026-09-04T00:00:00Z'
product: ba-admin
functional_area: PLATFORMRULE
environment: stage-admin-srv.springkyle.online
preconditions:
- 測試帳號：ACAA00241（站長，Arcade 視角測試）／ZZAA00244（站長，admin 根層視角測試）
steps_performed:
- 登入後台，使用任一站長權限帳號
- 進入「後台管理員系統 > 系統使用者列表」
- 站台切換至該帳號有權限操作的任一機台子站台（如 Arcade），不輸入篩選條件直接搜尋，確認是否查得到當前登入帳號（實測：查無，總筆數 0）
- 站台切換至根層（admin），重新搜尋，確認是否查得到當前登入帳號（實測：查無，僅查到兩筆不相關帳號）
- 確認查到的帳號（ZZAA00144、ZZAA00137）的角色顯示與建立時間，作為輔助排查資訊
observed_result: '依 `機台場館平台規則_spec_v01.md`「7.x 後台管理員系統」規則，新增使用者時角色選項須包含 Admin／站長／操作員，並可指定所屬場館（操作員適用）。「系統使用者列表」功能應為管理這些後台操作帳號的入口。


  實測發現，**兩個目前正在使用中、擁有站長權限的帳號，皆無法在系統使用者列表查到**：


  1. 站台切換至 Arcade（機台子站台）視角，以 `ACAA00241`（站長）操作，搜尋系統使用者列表結果為「目前暫無搜尋結果」，總筆數 0

  2. 站台切換至 admin（根層）視角，以 `ZZAA00244`（站長，建立時間為前天/昨天，非久遠帳號）操作，搜尋結果總筆數 2，但查到的是 `ZZAA00144`、`ZZAA00137` 兩筆完全不相關的帳號，角色皆顯示「游客」；**當前登入使用的
  `ZZAA00244` 本身依然不在清單內**


  排除項：清單裡出現「游客」角色，可能是「使用非白名單帳號登入後台，系統無法辨識對應角色、預設顯示游客」的正常設計行為，此點不列入本次回報範圍。


  核心問題聚焦為：**一個明明正在登入、正常操作後台、且擁有站長權限的帳號，在系統使用者列表的任何一個站台視角下都查不到自己**，不論是子站台視角或根層視角皆然。'
outcome: fail
evidence_ids:
- EVD-0011
notes: 'source: downloads/bug單_系統使用者列表查無登入中帳號.md; 預期結果（原單）: 系統使用者列表應能正確查到當前使用中且具備有效角色（Admin／站長／操作員）的後台帳號，不論從哪個站台視角查詢。若清單設計上有「可見範圍依角色與所屬場館過濾」的邏輯，至少在該帳號本身有權限操作的站台視角下（如本身即為該站台管轄範圍內的站長）應能查到自己。'
