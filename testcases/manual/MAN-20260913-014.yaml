observed_result: "依 \n站台列表_spec_v03.md\n／\n站台列表_spec_v04.md\n 規格，子站台的「站台類型」與「核心貨幣」一律唯讀跟隨上層站台，無法個別選擇。\n2026-09-03 初次發現\n新增站台\
  \ Modal，上層站台選擇既有機台類型站台（Arcade）後，畫面顯示「線上」為已選中狀態、「機台」呈灰階無法點選，與 spec 要求相反。\n2026-09-04 重測\n在母站台視角，上層站台選擇 Arcade（機台/TWD）後，除了「站台類型」依然錯誤顯示「線上」已選中之外，\n\
  「核心貨幣」欄位也同步顯示錯誤\n——顯示「USDT（繼承主站台核心貨幣）」，而非應繼承自 Arcade 的 TWD。\n[圖]\n圖1\n：母站台視角，上層站台選擇 Arcade 後，「站台類型」錯誤顯示「線上」已選中，「核心貨幣」錯誤顯示「USDT（繼承主站台核心貨幣）」。\n\
  2026-09-04 補充觀察（理論已修正）\n帳號 ACAA00263（Arcade 本人的站長）在 \nArcade 底下\n新增子站台時，核心貨幣與站台類型皆\n正確\n顯示（TWD／機台）；但同一帳號、同一後台網域，鑽進 Arcade\
  \ \n底下的子站台「as」\n（非其本人直接歸屬的那一層）後再新增站台，「站台類型」「核心貨幣」又同樣錯誤顯示為線上／USDT。\n由此推翻先前「與登入後台網域有關」的推測，修正為更精確的理論：\n錯誤只發生在「上層站台 ≠ 登入者本人直接歸屬的站台」時\n\
  ——當上層站台剛好就是登入者自己的站台時，畫面顯示正確；只要上層站台是登入者管轄範圍內、但非本人直接歸屬的其他站台，前端就沒有正確依所選上層站台重新查詢繼承值，而是錯誤帶入登入者自身站台的資料。\n2026-09-04 理論再次驗證\n同帳號\
  \ ACAA00263，於 Arcade 專屬後台網域下，再次鑽入子站台「as」新增站台，「站台類型」再度錯誤顯示「線上」已選中——與理論預期一致，此理論已多次重現驗證，可視為確立。\n[圖]\n圖2\n：ACAA00263 於 Arcade\
  \ 專屬後台網域，鑽入子站台「as」新增站台，「站台類型」再度錯誤顯示「線上」已選中，「機台」呈灰階。\n\U0001F534 2026-09-04 新發現：同一情境下觀察到第二種失敗模式\n 同帳號、同上層站台「as」，另一次操作記錄到不同的錯誤呈現方式——「站台類型」的「線上」與「機台」\n\
  兩者皆呈正常可點擊狀態，均未 disabled\n；「核心貨幣」欄位則\n完全空白\n，未帶入任何值。\n[圖]\n圖3\n：失敗模式 B——「線上」「機台」皆可點擊、皆未 disabled，「核心貨幣」欄位完全空白。\n[圖]\n圖4\n\
  ：同一情境的另一次操作記錄，同樣呈現「站台類型」皆可選、「核心貨幣」空白的失敗模式 B。\n判定：\n此為同一根因（前端未依實際所選上層站台正確查詢繼承資料）呈現出的\n第二種失敗樣貌\n，不是新的獨立 bug：\n失敗模式\n站台類型\n\
  核心貨幣\n模式 A（先前記錄）\n「線上」被錯誤選中、「機台」disabled\n顯示錯誤的繼承值（USDT）\n模式 B（本次新發現）\n「線上」「機台」皆可點擊、皆未 disabled\n完全空白，未帶入任何值\n推測兩種模式的差異，可能與前端查詢繼承資料失敗時的處理方式不同有關（例如查詢逾時/race\
  \ condition 時，可能 fallback 到不同的預設呈現邏輯），具體成因待前端排查程式碼確認，不影響本單「上層站台≠登入者本人歸屬站台時即會出錯」的核心判斷。\n已建立完整證據鏈，確認為純前端顯示邏輯問題，並排除後端\n階段\n\
  站台類型\n核心貨幣\n新增 Modal（送出前）\n線上（錯誤顯示）\nUSDT（錯誤顯示）\n送出後，API 回傳的站台資料\nsiteType: \"machine\"\n（正確）\ncoreCurrency: \"TWD\"\n（正確）\n\
  事後編輯畫面\n機台已選中（正確）\nTWD（繼承主站台核心貨幣）（正確）\n[圖]\n圖5\n：事後編輯畫面，「站台類型」正確顯示「機台」已選中，「核心貨幣」正確顯示「TWD（繼承主站台核心貨幣）」，證實後端資料正確。\n送出前錯、送出後對、編輯時又對，證實：\n\
  後端從頭到尾收到、寫入、回傳的資料皆正確（TWD／機台）\n，問題完全侷限在「新增站台 Modal 打開當下、使用者尚未送出前」這個階段的顯示邏輯——當使用者在 Modal 內切換「上層站台」下拉選單時，「站台類型」與「核心貨幣」這兩個唯讀繼承欄位，\n\
  沒有正確依所選上層站台重新查詢對應資料\n，而是錯誤帶入了登入者自身所屬站台的類型與幣別（呼應 RD 於 2026-09-04 修復筆記所述成因：「原本抓『登入者的主站台』類型」）。\n⚠️ 本問題與 RD 於 2026-09-04 回報的修復項目「子站台的站台類型帶錯」根因描述相符，但實測後尚未修復，問題依然重現，且範圍已擴大確認"
