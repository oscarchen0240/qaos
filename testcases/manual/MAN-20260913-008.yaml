observed_result: 如果呼叫方(包含 AI agent)依照這個 API 裡其他地方學到的「日期篩選都是巢狀 `{startDate,endDate}`」這個主流慣例,套用到這個工具上,會在**沒有任何錯誤提示**的情況下拿到完全未篩選的全量資料(7452
  筆),卻誤以為問對了問題、拿到的是篩選後的結果。這正是最危險的複合問題失敗模式。
