notes: 'source: downloads/bug單_上層站台選單異常與根層機台建立受阻.html; 預期結果（原單）: 「上層站台」欄位應依角色正確呈現：Admin 帳號應可清空／自由改選任意站台；站長帳號若依 spec 設計為唯讀，應直接呈現

  唯讀顯示

  ，不應是看似可互動、實際互動後又行為異常的下拉選單

  下拉選單一旦提供「根層」選項，不應在使用者互動後消失、也不應因換頁而變動，此為基本互動穩定性問題，不分角色皆須修正

  admin 層級（SpringKyle／owoo／lebron／Arcade 所在的第一層）新增站台時，不應套用「繼承上層類型」的邏輯

  ，應與 Arcade 當初的建立方式一致，讓操作者可自由選擇「線上」或「機台」類型

  系統上必須存在能在 admin 底下建立「機台」類型站台（與 Arcade 同層）的正常入口，現存 Arcade 本身即為此需求已實現過的證明'
