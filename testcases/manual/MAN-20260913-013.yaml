record_id: MAN-20260913-013
title: 上層站台選單異常與根層機台建立受阻
tester: oscarchen@blockaction.tech
tested_at: '2026-09-04T00:00:00Z'
product: ba-admin
functional_area: SITELIST
environment: stage-arcade-violet.springkyle.online（後台）；ZZAA00244 帳號測試環境為 https://stage-admin.alphapod.cc/　
preconditions:
- 測試帳號：站長權限帳號（ZZAA00244／ACAA00263／ZZAA00264／YAAA00265）
steps_performed:
- 登入後台，使用站長權限帳號（ZZAA00244）
- 從最外層「站台列表」（未鑽入 admin）點擊「＋ 新增站台」，觀察「上層站台」是否可選「根層（無上層站台）」（初次應可選）
- 點開下拉選單互動一次後，重新檢視「根層」選項是否仍存在（實測：消失，無法再選回）
- 關閉 Modal，改為先點擊「admin」鑽入其子站台列表，再點擊「＋ 新增站台」，檢視「上層站台」是否可選根層（實測：不可選）
- 上層站台選擇「admin」，觀察「核心貨幣」是否自動帶入 USDT（實測：是），與現存機台類型的 Arcade（同為 admin 子站台）的核心貨幣 TWD 矛盾
- 找一個歸屬站台為 admin 本身的站長帳號（如 ZZAA00264）與一個歸屬中間層級站台的站長帳號（如 YAAA00265），分別重複步驟 2–5，比對兩者「上層站台」欄位的可互動性差異（實測：僅歸屬 admin 本身者可互動，其餘皆正確鎖定）
observed_result: "本單包含四個相關發現，皆圍繞「上層站台」欄位與 admin 層級的類型繼承邏輯。\n發現一：上層站台無法清空／改選\n以「站長」角色測試「新增站台」，「上層站台」欄位固定顯示為下拉選單樣式，但實際上無法清空、也無法改選其他站台，永遠鎖定顯示目前所在層（admin）。連帶導致「站台類型」的「機台」選項一律灰階無法選取，只能選「線上」。\n\
  比對 \n站台列表_spec_v03.md\n／\nv04.md\n 權限規格：「上層站台」欄位依角色分兩種行為——\nAdmin\n 可清空、可改選任意站台（留空即代表建立根層站台）；\n站長\n則固定唯讀、不可修改。「無法清空」本身與\
  \ spec 對站長角色的描述相符，但畫面呈現方式是\n看起來可互動的下拉選單\n，而非唯讀顯示，容易誤導操作者。\n2026-09-04 補充驗證\n已於已鑽入子站台（Arcade）的頁面情境下，用站長帳號主動嘗試將「上層站台」從當前所在層改選成其他站台，確認\n\
  欄位確實為唯讀狀態、無法切換\n，與 spec 對站長角色的描述一致。\n\U0001F534 2026-09-04 重大對照發現\n 另有一組帳號 ZZAA00264（同為站長，role=100，已由 RD 確認），其上層站台欄位卻是\n\
  完全可互動、可搜尋改選任意站台\n，與其餘站長帳號的鎖定行為明顯不同。經以 SpringKyle 站長帳號（YAAA00265）對照測試（可見範圍 > 1，但依然正確鎖定），已排除「可見範圍大小」的解釋，\n問題精準收斂為：只有本人歸屬站台＝admin（樹的絕對頂點）這個特例，欄位才會變成可互動\n\
  。\n對照測試證據截圖\n完整推論過程詳見 \n待PM確認_角色權限層級定義疑問.md\n／\n.html\n，以下為關鍵截圖節錄。\n[圖]\n圖1\n：ACAA00263（Arcade 本人站長）於 Arcade 底下新增站台，「上層站台」純文字唯讀鎖定顯示「Arcade」。\n\
  [圖]\n圖2\n：Arcade 底下的子站台列表，作為圖3操作情境的前置畫面。\n[圖]\n圖3\n：同帳號鑽入子站台「as」後新增站台，「上層站台」同樣唯讀鎖定顯示「as」。\n[圖]\n圖4\n：ZZAA00264（站长）新增站台，「上層站台」呈可互動下拉選單樣式，顯示「－\
  \ 根層（無上層站台）」。\n[圖]\nSpringKyle後仍可搜尋改選任意站台\">\n圖5\n：同帳號鑽入 \nadmin > SpringKyle\n 後，「上層站台」依然可互動，下拉開出完整可搜尋清單（admin、SpringKyle、owoo、lebron、Arcade、OW、goga）。\n\
  [圖]\n圖6\n：YAAA00265（SpringKyle 本人站長）於 SpringKyle 底下新增站台，「上層站台」唯讀鎖定顯示「SpringKyle」。\n[圖]\n圖7\n：同帳號鑽入子站台「OW」後新增站台，「上層站台」同樣唯讀鎖定顯示「OW」——證實可見範圍\
  \ > 1 時仍正確鎖定，排除可見範圍理論。\n發現二：下拉選單初次可選根層，互動後選項消失\n新增站台 Modal 初次開啟時，「上層站台」下拉選單一度可選「－ 根層（無上層站台）」；但\n點開下拉選單互動後，根層選項隨即消失，且無法再選回\n\
  ，須關閉整個 Modal、重新點擊「＋ 新增站台」才會恢復。此為獨立的前端狀態管理問題。\n發現三：admin 層級的類型繼承邏輯與 Arcade 現況矛盾\n上層站台選擇「admin」時，「核心貨幣」會自動繼承 admin 的值（顯示 USDT），代表目前\
  \ UI 邏輯把 admin 視為「有類型、會被繼承」的一般父層站台。但現存的 Arcade 站台本身正是 admin 底下的子站台（\nparentId\n 指向 admin），卻是機台類型／TWD——如果 Arcade 真的是透過「繼承\
  \ admin 類型」的邏輯建立，理應也被強制變成線上／USDT，兩者矛盾。\n由此推論：\nadmin 底下的第一層站台（SpringKyle／owoo／lebron／Arcade）在業務邏輯上應各自是獨立可選類型的「主站台（根層站台）」\n\
  ，資料庫上雖然技術性地把 \nparentId\n 指向 admin，但不應該套用「子站台一律繼承上層類型」這條規則。目前 UI 把 admin 當成一般會被繼承的父層站台處理，才是導致「無法在 admin 底下新增第二個機台類型站台」的根本原因。\n\
  理論已修正\n經 2026-09-04 重測確認，此現象與登入網域無關，正確理論為「錯誤只發生在上層站台 ≠ 登入者本人直接歸屬站台時」，與本發現三屬同源問題。完整證據詳見 \nbug單_子站台類型與核心貨幣顯示錯誤.md\n／\n.html\n\
  。\n發現四：導覽情境影響根層選項是否可選\n從「站台列表」鑽入 \n站台列表 > admin\n 之後，「＋ 新增站台」的上層站台\n再也選不到根層\n；須離開該頁面、回到"
