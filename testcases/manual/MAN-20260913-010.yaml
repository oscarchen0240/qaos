record_id: MAN-20260913-010
title: '[待排查][機台][洗分出金核實] 入口按鈕角標顯示待核實筆數與頁面實際查詢結果不符（角標12 vs 實際11）'
tester: oscarchen@blockaction.tech
tested_at: '2026-09-07T00:00:00Z'
product: ba-admin
functional_area: CASHOUT
environment: stage-admin-srv.springkyle.online
preconditions:
- 測試帳號：ACAA00250 / ACAA00243（機台帳號，交易發起）
steps_performed:
- 登入後台，站台切換至機台場館（Arcade）
- 觀察右上角「洗分出金核實」入口按鈕的角標數字（實測：12）
- 點擊按鈕進入「洗分出金核實」頁面，開啟瀏覽器 Network 分頁，記錄頁面載入時呼叫 `query-withdraw-verify-report` 的次數與各自回傳的 `total`（實測：呼叫 3 次，分別為 11／9／2，9+2=11）
- 比對步驟 2 的角標數字與步驟 3 算出的頁面實際待核實總數（實測：12 ≠ 11，不一致）
- 建議前端／後端一併排查角標數字實際呼叫的 API 或計算來源，確認與頁面查詢口徑是否一致
observed_result: '機台場館後台右上角「洗分出金核實」入口按鈕（原出金審核快捷圖示，依先前修復回報已改為此入口，並加上待核實筆數角標），目前角標顯示為 **12**。


  點進「洗分出金核實」頁面後，實測頁面載入時會呼叫**同一支 API 三次**，帶不同篩選條件：


  | # | 篩選條件 | 回傳 total |

  |---|---|---|

  | 1 | `verifyStatus:[0]`（全部類型，待核實） | 11 |

  | 2 | `verifyStatus:[0]` + `transactionType:["creditOut"]`（洗分） | 9 |

  | 3 | `verifyStatus:[0]` + `transactionType:["cashOut"]`（出金） | 2 |


  9（洗分）+ 2（出金）= 11，與第一支不分類型查詢的總數一致，**證實頁面內部三支查詢彼此資料一致，頁面本身顯示的待核實總數（11）沒有問題**。


  **問題聚焦在：入口按鈕角標顯示的數字（12）與頁面實際查詢結果（11）對不上，多算了 1 筆。**


  已與提出人確認：此按鈕本身的功能定位是「導向洗分出金核實頁面的入口」，導頁行為正常、無異議；本次回報範圍**僅針對角標數字的計數邏輯**，不涉及按鈕的導頁功能本身。


  **懷疑方向**：角標數字很可能不是即時依頁面所用的這三支查詢 API 計算，而是另外呼叫一支獨立的通知/計數 API，兩邊未共用同一份計數邏輯或查詢條件，才會出現角標與頁面內容筆數不一致的情況。'
outcome: fail
