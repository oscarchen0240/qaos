record_id: MAN-20260913-015
title: 不支援TWD遊戲商於機台場館顯示異常
tester: oscarchen@blockaction.tech
tested_at: '2026-09-08T00:00:00Z'
product: ba-admin
functional_area: SCREENMGMT
environment: stage-arcade-violet.springkyle.online（後台）／前台 Violet Arcade
preconditions:
- 測試帳號：ACAA00293（站長，操作畫面管理）／ACAA00243（前台測試帳號）
steps_performed:
- 登入後台，站台切換至 Arcade（機台場館），確認 AMB 遊戲商已於「畫面管理」/「遊戲商管理」開放
- 開啟前台，點擊底部導覽列的「AMB」TAB
- 觀察遊戲卡片顯示（實測：遊戲名稱顯示為內部代碼，圖示破圖）
- 點擊底部導覽列的「ATG」TAB 作為對照（實測：正常顯示中文遊戲名稱與圖示）
- 攔截兩個廠商各自的
- query-frontend-layout-block-game-list
- API 回應，比對
- title.locale
observed_result: "機台場館的核心貨幣固定為 TWD（spec 定案，\n站台列表_spec_v04.md\n），但目前查閱所有機台相關 spec（正本、開發包①～⑦），\n完全沒有定義「機台場館底下的遊戲商上架清單，是否該篩選掉不支援\
  \ TWD 幣別的遊戲商」這件事\n，屬於規格未覆蓋的空白地帶。\n實測發現一個具體案例\n：AMB 遊戲商\n只支援 USDT，不支援 TWD\n。此廠商目前仍出現在機台場館（TWD）前台的可選 TAB 清單裡，玩家可以正常點進去瀏覽，但呈現結果異常：\n\
  遊戲名稱直接顯示為\n內部識別碼\n（如 \nAMB_AMB_ELECTRONIC_BABY_MONKEY\n），而非正常應顯示的遊戲名稱\n遊戲圖示\n破圖\n，僅顯示預設的檔案圖示，無法載入正常封面圖\n[圖]\n圖1（異常組）\n：AMB\
  \ 廠商於機台場館前台，遊戲卡片圖示全數破圖，遊戲名稱顯示為內部識別碼（如 AMB_AMB_ELECTRONIC_BABY_MONKEY），而非正常遊戲名稱。\n已排除「語系（locale）」這個變數\n：比對 API 回應，AMB 與 ATG（行為正常的對照組）的\
  \ \ntitle.locale\n同樣只設定 \nen-US\n，但 ATG 在機台場館前台完全正常顯示中文遊戲名稱與正常圖示。兩者 locale 設定相同、結果卻不同，證實 locale 並非造成此異常的原因。\n[圖]\n圖2（正常對照組）\n\
  ：ATG 廠商於同一機台場館前台，正常顯示中文遊戲名稱（骰子比大小、火箭升空、四人麻將等）與正常封面圖，與 AMB 的異常呈現形成明顯對比。\n排除 locale 後的推論\n：問題根源回到「幣別支援」——AMB 只支援 USDT，機台帳號的核心貨幣是\
  \ TWD，系統目前\n沒有依站台核心貨幣過濾遊戲商上架清單的機制\n，導致不支援 TWD 的廠商依然出現在機台場館前台；玩家點進去後，因底層抓不到對應 TWD 版本的遊戲素材（名稱、圖示），只能 fallback 顯示原始內部代碼與破圖，而非正常擋下或提示不支援。\n\
  預期結果（待 PM 定案，非單純技術修復）\n此問題有兩個層次，需要分別處理：\n待 PM 決策的政策層問題\n：機台場館（TWD）的遊戲商上架清單，是否應該在「畫面管理／遊戲商管理」層級就先行過濾，只允許支援 TWD 的遊戲商出現？還是允許所有遊戲商都能上架、由前端另做幣別轉換或提示？此為產品決策，spec\
  \ 目前無定義，需請 PM 補充規則\n無論政策層如何決定，目前的顯示結果本身都是異常，需要修正\n：不應該讓玩家點進一個廠商後，看到顯示內部代碼與破圖的殘缺畫面——至少應該有明確的「此遊戲暫不支援」提示，或乾脆在清單層級就不顯示，不應該是目前這種「進得去但顯示壞掉」的狀態"
outcome: fail
