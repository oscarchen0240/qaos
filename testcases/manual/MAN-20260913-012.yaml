product: ba-admin
functional_area: SITELIST
environment: stage-arcade-violet.springkyle.online
preconditions:
- 測試帳號：異常組：ZZAA00264（站長，role=100，已由 RD 確認）／對照組：ACAA00263（Arcade 本人站長）、YAAA00265（SpringKyle 本人站長）
steps_performed:
- 使用歸屬站台為 admin 本身的站長帳號（如 ZZAA00264）登入後台，點擊「＋ 新增站台」，觀察「上層站台」欄位是否可互動改選（實測：可以）
- 使用歸屬站台為中間層級（如 SpringKyle）的站長帳號（如 YAAA00265）登入，重複步驟 1（實測：正確鎖定，不可互動）
- 使用歸屬站台為較深層級（如 Arcade）的站長帳號（如 ACAA00263）登入，重複步驟 1（實測：正確鎖定，不可互動）
- 比對三者結果，確認僅歸屬 admin 本身者出現異常
observed_result: "依 \n站台列表_spec_v03.md\n／\nv04.md\n 權限規格，「站長」角色新增站台時，「上層站台」欄位應\n固定為當前所在層、不可修改\n（唯讀）。\n\U0001F534 實測發現：同為站長（role=100）的帳號，行為不一致\n\
  \ ZZAA00264 的「上層站台」欄位為\n可互動下拉選單，可搜尋改選任意站台\n；其餘站長帳號（ACAA00263、YAAA00265）皆為\n純文字唯讀鎖定\n，符合 spec 描述。\n排查過程\n步驟\n結果\n1. 確認 ZZAA00264\
  \ 後端角色欄位\nRD 已確認為 \n100（站長）\n，排除「顯示標籤誤標成 Admin」的可能\n2. 確認 ZZAA00264 本人歸屬站台\n為 \nadmin 本身\n（於母站 alphapod 建立），可見範圍等於整棵樹\n\
  3. 對照測試：找歸屬 SpringKyle（中間層級，可見範圍 > 1）的站長 YAAA00265\n依然正確鎖定\n，排除「可見範圍大小」的解釋\n結論：\n問題精準收斂為——只有「登入者本人歸屬站台＝admin（樹的絕對頂點）」這個特例，上層站台欄位才會變成可互動；其餘所有站長帳號（不論管轄範圍大小），行為皆正確符合\
  \ spec 的唯讀鎖定描述。推測程式判斷邏輯裡，可能誤用了「登入者本人站台是否為 admin」這個特例條件，而非正確依角色（role=100）判斷是否鎖定此欄位。\n證據截圖\n[圖]\n圖1\n：ACAA00263（對照組）於 Arcade\
  \ 底下新增站台，「上層站台」唯讀鎖定顯示「Arcade」。\n[圖]\n圖2\n：Arcade 底下的子站台列表，作為圖3操作情境的前置畫面。\n[圖]\n圖3\n：同帳號鑽入子站台「as」後，「上層站台」同樣唯讀鎖定顯示「as」。\n\
  [圖]\n圖4\n：\n異常組\n ZZAA00264 新增站台，「上層站台」呈可互動下拉選單樣式，顯示「－ 根層（無上層站台）」。\n[圖]\nSpringKyle後仍可搜尋改選任意站台\">\n圖5\n：同帳號鑽入 \nadmin >\
  \ SpringKyle\n 後，「上層站台」依然可互動，下拉開出完整可搜尋清單。\n[圖]\n圖6\n：\n對照組\n YAAA00265 於 SpringKyle 底下新增站台，「上層站台」唯讀鎖定顯示「SpringKyle」。\n[圖]\n\
  圖7\n：同帳號鑽入子站台「OW」後，「上層站台」同樣唯讀鎖定顯示「OW」——證實可見範圍 > 1 時仍正確鎖定。"
