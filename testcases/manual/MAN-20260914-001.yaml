notes: 'source: QA 口述（Oscar，2026-09-14）；規則依據：機台金流與場次_spec_v01 §場次狀態「逾時結束…之後若再有交易，會建立新場次」；「不可再遊玩、前後端擋」為實測觀察，spec 未明文。'
