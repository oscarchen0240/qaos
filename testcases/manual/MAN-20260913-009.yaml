record_id: MAN-20260913-009
title: '[後端][機台][場館日結報表] API 缺少必要欄位（場次數、開始時間、場次時長）'
tester: oscarchen@blockaction.tech
tested_at: '2026-09-08T00:00:00Z'
product: ba-admin
functional_area: DAILYREPORT
environment: stage-admin-srv.springkyle.online
preconditions:
- 測試帳號：ACAA00280（站長）／ACAA00250（機台帳號，交易發起）
steps_performed:
- 登入後台，站台切換至機台場館（Arcade）
- 進入「場館日結報表」，統計維度選「依場館彙總」，搜尋，觀察「場次數」欄位（實測：全部顯示 `--`）
- 開啟瀏覽器 Network 分頁，攔截查詢 API 的原始回應，確認是否有場次數相關欄位（實測：完全沒有）
- 切換統計維度為「依場次明細」，重新搜尋，觀察「場次時長」欄位與「開始 ～ 結束」時間範圍的開始時間（實測：皆顯示 `--`）
- 再次攔截 API 原始回應，確認是否有「開始時間」與「場次時長」對應欄位（實測：僅有 `endTime`，無對應開始時間與時長欄位）
observed_result: '依 `場館日結報表_spec_v01.md`／`實體機台_spec_v07.md` 規格，比對實際 API 回應，發現兩個統計維度下各自缺少必要欄位。


  **問題一：「依場館彙總」維度，缺少「場次數」欄位**


  依 spec：


  > 場次數 | 「依場館彙總」與「依機台明細」維度顯示，為當日結束的場次筆數：...依場館彙總＝**該場館底下所有機台帳號當日場次數的加總**


  實測「依場館彙總」維度，畫面「場次數」欄一律顯示「--」。對照 API 原始回應，整包 response 完全沒有任何類似 `sessionCount` 的欄位，證實是後端未回傳，非前端未接。


  **問題二：「依場次明細」維度，缺少「開始時間」與「場次時長」欄位**


  依 spec：


  > 場次編號 | 僅「依場次明細」維度顯示；另附開始／結束時間與場次時長

  > 場次時長 | 開始至結束的時間差；進行中則顯示累計至查詢當下


  實測「依場次明細」維度，畫面每一列「場次時長」皆顯示「--」，且「開始 ～ 結束」時間範圍的開始時間也一律顯示「--」。對照 API 原始回應，僅有 `endTime`（結束時間）欄位，**完全沒有對應的「開始時間」欄位**，也沒有「場次時長」欄位——不只是場次時長本身缺欄位，連前端據以自行計算所需的「開始時間」原始資料都沒有給，前端就算想自行相減計算也無資料可用。'
outcome: fail
