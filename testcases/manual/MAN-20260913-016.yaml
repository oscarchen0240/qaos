record_id: MAN-20260913-016
title: 畫面管理OFF未實際隱藏前台TAB
tester: oscarchen@blockaction.tech
tested_at: '2026-09-08T00:00:00Z'
product: ba-admin
functional_area: SCREENMGMT
environment: stage-arcade-violet.springkyle.online（後台）／前台 Violet Arcade　
preconditions:
- 測試帳號：ACAA00293（站長，操作畫面管理）／ACAA00243（前台測試帳號）
steps_performed:
- 登入後台，站台切換至 Arcade，進入「畫面管理」
- 將某一娛樂城區塊（如 S PLUS）「前台顯示」切為 OFF
- 開啟前台，確認首頁大廳底下該區塊卡片已隱藏（實測：已隱藏，符合預期）
- 查看前台底部導覽列，確認該區塊對應的 TAB 是否仍顯示（實測：仍顯示，未如預期隱藏）
- 點擊該 TAB，確認底下遊戲是否仍可完整瀏覽與進入（實測：可以，完全不受「前台顯示」OFF 影響）
- 改至「遊戲商管理」，將該廠商（如 ATG）底下全部遊戲逐一停用
- 重新整理前台，確認該廠商 TAB 是否消失（實測：消失，此方法才有效）
observed_result: "「畫面管理」頁面的「前台顯示」開關，功能定位應為控制該區塊（娛樂城 TAB）是否顯示於前台。實測將 S PLUS、ATG、RSG、AMB 四個娛樂城區塊的「前台顯示」全數切為 OFF 後：\n[圖]\n圖1\n\
  ：後台「畫面管理」，S PLUS、ATG、RSG、AMB 四個娛樂城區塊的「前台顯示」皆已切為 OFF。\n前台大廳底下的遊戲區塊確實隱藏了\n（首頁不再列出這些區塊的遊戲卡片）\n[圖]\n圖2\n：前台大廳，首頁區塊卡片已隱藏（符合預期），但底部導覽列的\
  \ TAB（全部／S PLUS／ATG／RSG）依然全數顯示。\n但底部導覽列的 TAB（全部／S PLUS／ATG／RSG）依然全數顯示，未被隱藏\n點擊任一 TAB（如 S PLUS），該廠商底下的遊戲依然完整列出、可正常進入遊玩\n\
  ，與「前台顯示」OFF 的預期效果完全不符\n[圖]\n圖3\n：點擊「S PLUS」TAB，該廠商底下的遊戲（龍神、龍虎爭霸等）完整列出，與區塊已 OFF 的狀態不符。\n唯一能讓 TAB 消失的方法：\n改到「遊戲商管理」，把該廠商底下\n\
  所有個別遊戲逐一停用\n後，前台 TAB 才會消失。\n[圖]\n圖4\n：「遊戲商管理／ATG」，該廠商 21 款遊戲全數手動停用（狀態顯示「停用中」）。\n[圖]\n圖5\n：對應的 \nquery-game-schedule\n API\
  \ 回應，ATG 底下個別遊戲的 \ncurrentStatus\n 皆為 \n\"close\"\n，確認個別遊戲層級已停用。\n[圖]\n圖6\n：ATG 廠商所有遊戲停用後，前台底部導覽列的 ATG TAB 消失（僅剩「全部／S PLUS／RSG」）——證實\
  \ TAB 隱藏是由「遊戲商管理」個別遊戲狀態決定，而非「畫面管理」的區塊開關。\n推論：\n前台實際判斷「TAB 要不要顯示」的邏輯，看起來完全沒有讀取「畫面管理」的區塊開關狀態，而是單純依「遊戲商管理」底下該廠商是否還有任一款啟用中的遊戲來決定。也就是說，「畫面管理」的前台顯示開關目前\n\
  對 TAB 與遊戲列表毫無實際作用\n，只影響首頁區塊卡片的呈現。"
