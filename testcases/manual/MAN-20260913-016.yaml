notes: 'source: downloads/bug單_畫面管理OFF未實際隱藏前台TAB.html; 預期結果（原單）: 「畫面管理」的「前台顯示」開關 OFF 時，該區塊對應的前台 TAB 應一併隱藏，TAB 底下的遊戲也不應可透過直接點擊
  TAB 存取，效果應與「遊戲商管理全數停用該廠商遊戲」等價或至少能達成同樣的隱藏目的，不應該只影響首頁卡片區塊的呈現而已。；2026-09-14 QA 確認 RD 已修復（GA OFF 後前台不顯示，截圖）'
