steps_performed:
- 不帶篩選抓資料,取一筆真實記錄的時間戳記(`rebateLogId:89989`,`time:"2026-08-05T11:10:03Z"`)。
- 用一個「精準應該命中」的窄時間窗(`11:10:00Z` ~ `11:10:03Z`,剛好框住這筆記錄)測試。
- 用一個「應該命中多筆」的寬時間窗(`11:09:00Z` ~ `11:11:00Z`,涵蓋 baseline 前幾筆的時間範圍)測試。
observed_result: '`time` 範圍篩選在兩個方向上都是錯的:窄窗口「篩過頭」把所有資料都排除掉(包括理論上精準命中的記錄),寬窗口卻「完全沒篩」變成回傳全部資料 —— 這兩種行為互相矛盾,不是單純「條件被忽略」這麼簡單,顯示這個日期比較的實作本身有邏輯錯誤(可能是時區轉換、時間精度截斷,或查詢條件的比較運算子寫錯)。'
outcome: fail
