preconditions:
- 以具備優惠活動管理權限的後台角色（站長，或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）；財務角色能否檢視紅包明細、取消排程尚未定義（CLR-REDPACKET-015），所以除 023 系列案例外一律不用財務角色執行
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
test_data: []
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，活動類型選『紅包』；捲動到『規則設定』區
  expected: 顯示『預設規則』區塊與其開關
- n: 2
  action: 檢視預設規則開關狀態與欄位（累積門檻、單週期發放上限、獎勵方式、稽核倍數）
  expected: 開關預設為開啟；四個規則欄位顯示且為必填
- n: 3
  action: 活動名稱『RP-SW』與其餘欄位填妥，但累積門檻留空，點『儲存』
  expected: 阻擋儲存（預設規則開啟時欄位必填）；活動未建立
- n: 4
  action: 把預設規則開關切為關閉
  expected: 預設規則的規則欄位隱藏、不需填寫
expected_result: 預設規則開關預設為開啟且規則欄位必填；切為關閉後規則欄位隱藏。
