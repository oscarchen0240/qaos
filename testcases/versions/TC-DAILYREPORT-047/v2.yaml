design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下選定一段連續 23 個營業日的結算日期區間（記為 R23，例如 2026-09-01～2026-09-23），區間內每個營業日皆有交易資料，使「依場館彙總＋按日」時每個營業日一列、共 23 列（3 頁：10＋10＋3）；不選含完全無資料營業日的區間——無資料時各欄顯示
  0 與 v0.2 餘額規則（含當期無場次但仍有留存分數者）的關係尚未釐清（RM REQ-DAILYREPORT-016 ambiguity）
- 分頁列顯示總筆數 23；第 2、3 頁各列的開分金額合計不為 0（使「全部 23 列合計」與「僅第 1 頁合計」可區分）
- R23 內至少有兩個營業日的期末餘額不為 0 且彼此不同（使「逐列相加」與「時點值」可區分）
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、結算日期選 R23，搜尋；確認分頁列顯示總筆數 23、目前在第 1 頁
- n: 2
  action: 記錄底部總計列的開分、洗分、進鈔、收據、場次數、期初餘額、期末餘額
- n: 3
  action: 逐頁（第 1、2、3 頁）記錄全部 23 列的上述各欄；加總全部 23 列的開分、洗分、進鈔、收據、場次數；另加總僅第 1 頁 10 列的同樣欄位
- n: 4
  action: 比對總計列與「全部 23 列合計」「僅第 1 頁合計」；比對總計列期初／期末餘額與各列期初／期末餘額的逐列相加值，以及與「最新營業日列的期末餘額」「最早營業日列的期初餘額」
expected_result: 步驟 4：總計列的開分、洗分、進鈔、收據、場次數＝全部 23 列的合計（不是僅第 1 頁 10 列的合計）；總計列的期初餘額、期末餘額都不等於各列逐列相加的值；總計期末餘額＝最新營業日那一列的期末餘額，總計期初餘額＝最早營業日那一列的期初餘額（按日、依場館彙總時，依時點值規則）。
