title: 操作員登入機台場館後，選單無『站台列表』項目，可操作項目正常存在於選單中
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-014
acceptance_criteria_ids:
- AC-PLATFORMRULE-0141
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
- security
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 依『後台管理員系統』新增一個操作員角色帳號，將其所屬場館指定為一個既有機台場館
- 以該操作員帳號登入後台，站台切換選單確認已選定其所屬的機台場館
test_data: []
steps:
- n: 1
  action: 檢視後台左側選單的全部項目
- n: 2
  action: 確認選單中是否存在「站台列表」這個項目
- n: 3
  action: 確認會員與加盟商 > 會員列表、帳務管理 > 洗分出金核實、各式報表 > 交易紀錄查詢與場館日結報表等項目是否正常存在於選單中
expected_result: 選單中不存在「站台列表」這個項目，操作員因此沒有入口可進入場館設定頁面，該頁面內屬本 spec 明訂欄位的「額度上限（場館層級）」也因此無從檢視或修改；會員列表、洗分出金核實、交易紀錄查詢、場館日結報表等操作員可操作項目仍正常存在於選單中
