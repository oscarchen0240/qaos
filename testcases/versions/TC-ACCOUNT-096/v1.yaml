test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 於前台（會員端）登入頁或首頁
test_data: []
steps:
- n: 1
  action: 前台忘記密碼頁，輸入一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的登入帳號（機台帳號的帳號本身存在，僅無綁定信箱）與任意電子信箱，送出申請
expected_result: 系統無法完成本次申請（機台帳號沒有可比對的綁定信箱）；實際顯示的畫面或提示文案需人工比對實測結果後確認是否與一般「查無帳號/信箱不符」情境相同（見假設）
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §前台忘記密碼/機台帳號、未綁定信箱的帳號
  quote: 機台帳號 | 不適用——機台帳號沒有電子信箱，帳密由後台管理，遺失一律走後台「重設密碼」
assumptions:
- text: Spec 未定義機台帳號實際送出忘記密碼申請時，前端顯示的具體提示內容（是否仍顯示與 REQ-ACCOUNT-017 相同的通用『若資料相符』訊息，或有其他提示），需人工確認實測結果
  requirement_id: REQ-ACCOUNT-018
  needs_human_confirmation: true
