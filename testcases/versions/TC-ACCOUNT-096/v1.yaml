title: 機台帳號於前台嘗試使用忘記密碼
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-018
acceptance_criteria_ids:
- AC-ACCOUNT-0181
spec_id: SPEC-ACCOUNT-001
