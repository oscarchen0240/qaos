design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的站長帳號，並選定其管轄範圍內一名既有會員
- 以該站長帳號登入後台
test_data: []
steps:
- n: 1
  action: 進入該會員的重設密碼功能，觸發重設密碼操作
- n: 2
  action: 觀察系統是否出現二次確認提示（例如確認對話框），並完成該次確認
expected_result: 系統於執行重設密碼前要求二次確認；在完成該次確認之前，密碼重設不會生效，完成確認後才實際生效
