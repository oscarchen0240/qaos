title: 站長執行重設密碼操作須經二次確認才會生效
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-017
acceptance_criteria_ids:
- AC-PLATFORMRULE-0171
