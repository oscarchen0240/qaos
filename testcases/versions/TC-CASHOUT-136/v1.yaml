title: 機台端門檻 0、餘額 399.6 全額洗分並核實：提款次數 +1、提款金額 +399.6；現金淨收扣除項核實前不計、核實後計入 399.6
description: TCRiskReview RF-04：含小數的全額洗分（AC-CASHOUT-0184 的佈置）核實後，驗證會員列表提款累計與場館現金淨收扣除項皆以含小數的 399.6 計，不取整為 399 或 400。
