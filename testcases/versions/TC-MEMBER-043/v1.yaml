priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入「會員與加盟商 > 加盟列表」
- 篩選狀態為「啟用」並搜尋，取一名啟用中的加盟商會員
test_data: []
steps:
- n: 1
  action: 點擊該會員所在列的狀態 Toggle
- n: 2
  action: 檢視該列狀態欄位的顯示
- n: 3
  action: 將篩選器狀態改為「停用」並重新搜尋
expected_result: 點擊後該會員的加盟商狀態變更為停用；篩選器改選停用並重新搜尋後可查到該筆記錄，確認狀態已真正切換而非僅前端顯示變化
