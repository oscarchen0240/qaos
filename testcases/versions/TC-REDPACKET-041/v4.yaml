title: 追加預算金額須大於目前總預算且最多 1 位小數：等於／低於／2 位小數時『確認』鈕停用並提示、僅高 0.1 即可行
description: 追加預算金額須大於目前總預算且最多 1 位小數：等於／低於／2 位小數時『確認』鈕停用並提示、僅高 0.1 即可行
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-016
acceptance_criteria_ids:
- AC-REDPACKET-0163
- AC-REDPACKET-0167
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- boundary
- negative
design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【清空後依序佈置】建立活動『RP-TOPUP-INV』：活動幣種 USDT、重置方式每日、活動時間『永久』、預設規則（門檻 1000／上限 5／固定 10／稽核 1）、總預算 5000；儲存後於『活動排程 > 紅包活動』確認該活動出現（若狀態欄顯示『排程中』，等其變為『進行中』）
test_data:
- name: 原總預算
  value: 5000
- name: 測試輸入（依序）
  value: 5000 / 4000 / 6000.55 / 6000.5 / 6000.5（等於現值）/ 6000.6
steps:
- n: 1
  action: 該活動列點『追加預算』
  expected: 視窗顯示目前總預算 5000
- n: 2
  action: 『新的總預算』輸入 5000（等於目前總預算）
  expected: 『確認』鈕停用（不可點）；欄位下方提示『新的總預算須大於目前總預算』
- n: 3
  action: 改輸入 4000（低於目前總預算）
  expected: 『確認』鈕停用；欄位下方提示『新的總預算須大於目前總預算』
- n: 4
  action: 改輸入 6000.55（2 位小數）
  expected: 欄位提示『最多 1 位小數』；『確認』鈕停用
- n: 5
  action: 改輸入 6000.5（1 位小數、大於目前總預算），點『確認』
  expected: 成功；活動列的預算使用顯示 0 ／ 6,000.5（總預算變為 6000.5）
- n: 6
  action: 重新開啟『追加預算』，輸入 6000.5（等於現值）
  expected: 『確認』鈕停用；欄位下方提示『新的總預算須大於目前總預算』（現值已是 6000.5）
- n: 7
  action: 改輸入 6000.6（只比現值高 0.1），點『確認』
  expected: 成功；總預算變為 6000.6
- n: 8
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 新總預算等於（5000、6000.5）或低於（4000）目前總預算時，『確認』鈕停用並於欄位下方提示『新的總預算須大於目前總預算』；輸入 2 位小數（6000.55）時提示『最多 1 位小數』且『確認』鈕停用；輸入
  1 位小數且大於目前總預算（6000.5、6000.6）時可確認生效。
