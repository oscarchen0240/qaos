execution_mode: manual
preconditions:
- 推薦註冊金設定列表存在至少一筆既有設定
test_data: []
steps:
- n: 1
  action: 點擊該筆設定旁的刪除圖示，確認彈出確認視窗
- n: 2
  action: 於確認視窗點擊確認
- n: 3
  action: 重新整理列表，確認該筆設定已從清單移除
- n: 4
  action: 確認畫面上不存在任何可將此筆設定復原的操作入口
expected_result: 彈出確認視窗；確認後該筆設定被永久刪除，清單中不再出現；系統不提供復原此操作的功能
