title: 機台紅包屬於機台：跨玩家累計、達標只亮起圖示不自動彈窗、由當下在台前的玩家經領取流程取得
description: 機台紅包屬於機台：跨玩家累計、達標只亮起圖示不自動彈窗、由當下在台前的玩家經領取流程取得
product: ba-admin
functional_area: REDPACKET
