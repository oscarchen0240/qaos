priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額 W0
- 【時間窗】本案必須橫跨一次 UTC+0 00:00（與其他案例『避開 00:00 前後』相反）：請在 UTC+0 23:40 前備妥活動與待開啟紅包，23:59:30 前後打開確認領取視窗，並預留到 UTC+0 00:01 之後繼續
- 記下玩家 A 的『各式報表 > 交易紀錄查詢』類型『紅包』筆數 N0 與『各式報表 > 稽核明細』類型『紅包』筆數 H0（備妥紅包前）
test_data:
- name: 活動
  value: 門檻 100／上限 5／固定 10／稽核 1／總預算 100／每日重置
- name: 時間點
  value: 確認視窗於 UTC+0 23:59:30 開啟、00:00:05 之後按［確認領取］
steps:
- n: 1
  action: （UTC+0 23:40 前）建立活動『RP-CLAIMRESET』（永久）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 10／稽核 1；總預算 100；每日重置；儲存
  expected: 建立成功；預算使用 0 ／ 100
- n: 2
  action: 玩家 A 結算有效流水貢獻 100
  expected: 產生 1 個待開啟紅包 P1；『活動排程 > 紅包活動』預算使用 10 ／ 100
- n: 3
  action: （UTC+0 23:59:30 前後）玩家 A 於前台點紅包圖示開啟紅包視窗，點『領取獎勵（1）』，讓『確認領取獎勵』視窗開著，先不按任何鈕
  expected: 確認領取視窗顯示紅包金額 10 與稽核倍數 x1
- n: 4
  action: 等到 UTC+0 00:00 過後約 5 秒（週期已重置），玩家 A 在同一個確認領取視窗點［確認領取］
  expected: 紅包已因週期重置作廢、不可開啟：不入帳。前台是否顯示錯誤訊息、視窗是否自動關閉，spec 未定義，只記錄
- n: 5
  action: 檢視玩家 A 的 USDT 錢包餘額、交易紀錄『紅包』筆數、稽核明細『紅包』筆數，並檢視紅包明細與活動預算使用
  expected: 錢包仍為 W0（沒有增加 10）；交易紀錄『紅包』筆數仍為 N0；稽核明細『紅包』筆數仍為 H0；紅包明細 P1 狀態『已作廢』、作廢原因『週期重置』、入帳時間『—』；預算使用 0 ／ 100（作廢釋放占用）
- n: 6
  action: 玩家 A 重新開啟紅包視窗
  expected: 沒有待開啟紅包，『領取獎勵』按鈕停用；P1 不補發
- n: 7
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 確認領取視窗開啟後週期重置，之後才按［確認領取］：紅包已作廢（原因『週期重置』）、不可開啟也不補發；玩家錢包、交易紀錄『紅包』、稽核明細『紅包』皆不變；作廢釋放所占用的預算（0 ／ 100）。
expected_result_spec_reference:
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.2'
  location: §紅包狀態（第 160 行）
  quote: 週期重置、活動結束（到期或取消排程）時作廢；機台另於完成洗分／出金時作廢，洗分／出金完成後才達標者直接以本狀態建立（見業務規則「洗分／出金後才達標」）。不可復原、不補發；作廢釋放所占用的預算
