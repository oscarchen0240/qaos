title: 不存在『開分招待』功能，稽核倍數為幣種層級設定無法綁定單筆交易
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-044
acceptance_criteria_ids:
- AC-CASHFLOW-0441
