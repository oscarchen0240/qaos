design_techniques:
- negative
priority: high
risk: low
execution_mode: manual
preconditions:
- 以 Admin 登入後台
test_data: []
steps:
- n: 1
  action: 以 Admin 登入 帳務管理 > 出金設定 > TWD 頁籤，檢視稽核倍數設定的完整欄位
- n: 2
  action: 檢視開分相關的操作介面（機台選單為廠商實作，改為檢視平台側是否有任何與『開分招待』『送分』相關的設定或交易類型欄位）
expected_result: 稽核倍數僅為幣種層級的單一設定值，沒有任何可綁定至單筆交易或活動的欄位；平台亦不存在『開分招待』（開分即綁定流水門檻）或『送分』這類無現金流的交易類型，此為 v07 定案刻意不實作的範圍
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §機台帳號的稽核
  quote: 客戶回覆（2026-08-21）機台目前不需要稽核（維持預設 0 倍），但實務上存在「開分招待」活動…此活動無法以本節的稽核倍數實現：倍數是幣種層級設定，一設就綁全場館所有開分與入金，而招待只綁特定一筆；且「送分」為無現金流的交易，四種金流中尚無此類型
