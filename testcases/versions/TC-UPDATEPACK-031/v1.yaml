test_data: []
steps:
- n: 1
  action: 進入『各式報表 > 注單查詢』，設定查詢區間與篩選條件使結果包含線上會員的注單，查詢
- n: 2
  action: 檢視結果列表中線上會員注單列的『場次編號』欄位
expected_result: 線上會員注單的場次編號欄一律顯示「—」，不留空白、不顯示 0、也不顯示 null 或空字串
