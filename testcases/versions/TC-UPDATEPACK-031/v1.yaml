  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §五、交易紀錄的兩項欄位規則
  quote: 與線上會員共用的頁面（交易紀錄查詢、注單查詢）的「場次編號」欄位，線上帳號的資料一律顯示「—」，不留空白、不顯示 0 或 null。機台帳號顯示該筆交易所屬的場次編號
