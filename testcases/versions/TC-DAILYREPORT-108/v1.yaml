preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
- 機台 A 在營業日 D 內有兩個連續場次：S1 以開分起始、洗分結束並留有餘數 R（AC 範例 R＝900；實際值不限，須大於 0）；S2 承接該餘數 R，並以出金結束（出金一律清空餘額，S2 期末餘額為 0）；機台 A 在營業日 D 只有
  S1、S2 兩個場次，且兩者皆已結束
test_data:
- name: 餘數 R（AC 範例）
  value: 900
steps:
- n: 1
  action: 統計維度選「依場次明細」、統計週期選「按日」、機台帳號填機台 A、結算日期選 D（單一營業日），搜尋
- n: 2
  action: 找到 S1、S2 兩列，記錄各自的期末餘額
- n: 3
  action: 記錄底部總計列的期末餘額
expected_result: S1 列期末餘額＝R（AC 範例 900），S2 列期末餘額＝0；總計列期末餘額＝0（取機台 A 查詢範圍內最後一個場次 S2 的期末餘額），不是 S1＋S2 逐列相加的 R。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §列表欄位附註/期末餘額不加總（2026-09-12 定案）；§背景：場次資訊/期末餘額
  quote: 例如同一機台前一場次洗分後留餘數 900 結束、下一場次承接該 900 後出金清空為 0，兩列相加得 900，但結算時點該機台實際為 0
