priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
- 選定一台既有機台 A（自行從環境中選定），A 在 R23（連續 23 個營業日）內每個營業日皆有資料，使「依機台明細＋按日＋機台帳號篩選 A」時有 23 列、至少 3 頁
- （AC 條件的限制）AC-0244 原條件為「機台帳號篩選＋依機台明細＋損益排序＋經鑽取、位於第 1 頁」，但鑽取（由場館彙總列點場館名）會把結算日期收斂為該列的單一結算期間；為使結果有第 2 頁，本 TC 在鑽取後把統計週期改為「按日」，使每日一列
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「區間合計」、結算日期選 R23，搜尋；結果為一列（結算期間＝R23 的起訖）
- n: 2
  action: 點該列的場館名向下鑽取（切至依機台明細，結算日期收斂為該列的結算期間）
- n: 3
  action: 統計週期改選「按日」、機台帳號填機台 A，搜尋；確認結果至少 11 列（即至少有第 2 頁）
- n: 4
  action: 點「損益」標題排序
- n: 5
  action: 記錄換頁前的基準狀態 S0：機台帳號、結算日期、統計週期、統計維度、排序欄位與指示、麵包屑（層數、各層文字、哪些層可點）、分頁列顯示的頁碼與區間
- n: 6
  action: 點「第 2 頁」
- n: 7
  action: 記錄換頁後的狀態 S1（同樣項目）並與 S0 比對
expected_result: S1 與 S0 相同：機台帳號、結算日期、統計週期、統計維度、排序欄位與指示（損益 ▲）、麵包屑（層數、各層文字與可點狀態）皆維持不變；僅頁碼與顯示區間改為第 2 頁（第 11–20 筆）。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §排序與分頁/狀態保留
  quote: 切換頁碼保留當前篩選條件、統計維度、排序與鑽取麵包屑狀態；變更篩選、統計週期、統計維度、排序或鑽取層級時一律回到第 1 頁
