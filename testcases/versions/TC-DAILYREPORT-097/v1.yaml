title: 機台無進行中場次時，日結時間到達不會憑空產生新場次
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-017
acceptance_criteria_ids:
- AC-DAILYREPORT-0172
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 尋找一台機台過去某個已經過的營業日，其在該日日結時間點當下沒有任何進行中場次（該機台當天的場次記錄皆已在日結時間之前結束，或當天無任何場次記錄）
test_data: []
steps:
- n: 1
  action: 查看該機台該營業日日結時間前後的場次記錄列表
- n: 2
  action: 確認日結時間點是否額外產生了一筆狀態為『日結結算』的空場次記錄
expected_result: 該機台在該營業日日結時間點沒有額外產生『日結結算』狀態的場次記錄——沒有進行中場次時，日結不會憑空產生新場次
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §業務規則/場次日結
  quote: 日結時間到達時強制結束所有進行中的場次，餘額轉為隔日新場次的期初餘額
