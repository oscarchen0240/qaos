design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的站長帳號，確認其管轄的站台樹（自身站台及所有子站台）下涵蓋至少一個機台場館
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，進入『各式報表 > 交易紀錄查詢』，不限定場館查詢，確認結果涵蓋來自不同機台場館的交易紀錄
- n: 2
  action: 改以前置作業準備好的站長帳號登入，重複同樣的查詢，檢視結果範圍
expected_result: Admin 查詢結果涵蓋系統內全部機台場館範圍的交易紀錄；站長查詢結果僅涵蓋其自身站台及所有子站台下機台場館範圍內的交易，不包含管轄範圍以外的機台場館交易
