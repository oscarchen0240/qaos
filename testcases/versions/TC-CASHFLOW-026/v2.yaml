title: end-cashout 帶入已失效 TXID 時回 1-NO RECORD：涵蓋人工出金取消與新請求取代兩種真實觸發情境
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-022
acceptance_criteria_ids:
- AC-CASHFLOW-0221
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- scenario
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
test_data: []
steps:
- n: 1
  action: 情境一（人工出金取消）：呼叫 req-cashout 建立一筆尚未完成的出金 PENDING，記錄 TXID_A
- n: 2
  action: 以 Admin／櫃檯身份登入後台，對該機台帳號執行既有的人工出金功能
- n: 3
  action: 確認該筆出金 PENDING（TXID_A）是否被同時取消
- n: 4
  action: 以 TXID_A 呼叫 end-cashout
- n: 5
  action: 情境二（新請求取代）：呼叫 req-cashout 建立第一筆出金 PENDING，記錄 TXID_B（不呼叫 end-cashout）
- n: 6
  action: 再次呼叫 req-cashout（模擬玩家再次按下結算鍵），記錄 TXID_C，確認 TXID_B 已被標記失效
- n: 7
  action: 以已失效的 TXID_B 呼叫 end-cashout
expected_result: 情境一：櫃檯執行人工出金的同時，系統同時取消該機台尚未完成的出金 PENDING（TXID_A）；之後以 TXID_A 呼叫 end-cashout 因查無有效對應 PENDING 而回 1-NO RECORD。情境二：第二次
  req-cashout（TXID_C）建立前，先將既存的 TXID_B 標記失效；之後以已失效的 TXID_B 呼叫 end-cashout 同樣回 1-NO RECORD。兩種情境皆僅記錄 log 後丟棄、不變更任何資料，避免同一筆錢被領兩次或誤將舊請求完成扣分
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-出金
  quote: 收到 end-cashout 但查無 PENDING 或 TXID 不符時，僅記錄 log 後丟棄，回 1-NO RECORD
