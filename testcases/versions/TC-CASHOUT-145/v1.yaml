preconditions:
- 以管理員或站長登入後台（本案從頭到尾使用同一個後台帳號），頁面標題下方的站台切換下拉選單切到本案機台場館所屬的站台。
- 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（0.6；機台是否允許出金這麼小的餘額 spec 未定義，若機台端拒絕出金或收據面額不是
  0.6，代表前提不成立，請回報並停止，不要判定為本頁缺陷），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
  spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
- 顯示格式說明：spec 的例子是『399.6 → 399.60』。本案的硬性斷言是面額『數值』為 0.6（不是 0、不是 1、不是空白）；若畫面顯示為 0.60，與 spec 例子同型態；若顯示為 0.6（未補尾端 0）或顯示成『.6』（省略前導
  0），數值皆正確，只記錄實際顯示並回報格式差異，不判 FAIL，因為前導 0／尾端 0 的顯示規則 spec 未定義（TCRiskReview RF-02 待 Clarification）；只有顯示成『0』、空白或『1』（取整或未顯示）才是缺陷。
- 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
- 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。本案會對一筆新產生的 0.6 出金執行核實。
test_data:
- name: 機台餘額（出金前）
  value: '0.6'
- name: 預期收據面額／實際金額欄／核實彈窗金額（數值）
  value: '0.6'
  note: 預期顯示 0.60（同 spec 例子型態），格式差異見前提說明
- name: 預期提款次數差
  value: '+1'
- name: 預期提款金額差
  value: '+0.6'
  note: 不是 +0 或 +1
- name: 不應出現的結果
  value: 0、1、空白
  note: 『0.6』、『.6』只記錄格式差異，不判 FAIL
steps:
- n: 1
  action: 到後台『會員列表』，以選定機台帳號的會員編號查詢，記下『提款次數』N0 與『提款金額』W0（小數位照實記錄）。
  expected: 取得 N0、W0 作為基準。
- n: 2
  action: 在機台端確認機台餘額為 0.6，由玩家在前台遊戲畫面按『結算』鍵執行出金（出金一律全額並清空餘額），記下收據（過渡期為前台結算結果畫面）上的訂單編號與面額。
  expected: 出金完成；面額數值為 0.6（若不是，代表前提不成立，停止並回報）。
- n: 3
  action: 到後台『帳務管理 > 洗分出金核實』，在頁面上方『訂單編號』輸入步驟 2 的訂單編號並搜尋，檢視該筆的『實際金額』欄。
  expected: 列表出現該筆：交易類型『機台出金』、核實狀態『待核實』；『實際金額』欄顯示含小數的面額 0.6（預期 0.60），不是 0、1 或空白（『0.6』、『.6』只記錄格式差異，不判 FAIL）。
- n: 4
  action: 點擊該筆『核實』，檢視確認彈窗顯示的訂單編號、機台帳號、金額與收據印出時間（先不要按確認）。
  expected: 彈窗金額欄顯示含小數的面額 0.6（預期 0.60），不是 0、1 或空白（『0.6』、『.6』只記錄格式差異，不判 FAIL）。
- n: 5
  action: 核對無誤後點擊確認（不可撤銷）。
  expected: 該筆標記為『已核實』，記錄核實人員與時間。
- n: 6
  action: 核實完成後立即到會員列表重新查詢同一會員，讀取『提款次數』與『提款金額』。
  expected: 提款次數 ＝ N0 ＋ 1；提款金額 ＝ W0 ＋ 0.6（差值恰為 0.6，含小數，不是 +0 或 +1）。
expected_result: 機台餘額 0.6 出金後，洗分出金核實頁該筆的實際金額欄與核實確認彈窗金額都顯示含小數的面額 0.6（預期 0.60），不取整為 0 或 1、不顯示空白；核實後該機台帳號的提款次數 +1、提款金額累計 +0.6。
