title: 機台餘額 0.6（整數部分為 0）出金：實際金額欄與核實彈窗顯示含小數面額，核實後提款金額 +0.6，不取整為 0 或 1、不顯示空白
description: TCRiskReview RF-05：含小數面額目前只覆蓋 399.6。本案補整數部分為 0 的小數面額 0.6，檢查本頁實際金額欄、核實確認彈窗與核實後提款金額累計都保留小數。
