- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 編輯一個站台，於前台網域欄位輸入純數字字串（如 12345）並儲存
- n: 2
  action: 另開一次編輯，於後台網域欄位輸入含空白與符號的字串（如 not a domain!!）並儲存
expected_result: 兩種情況系統皆接受並儲存，不阻擋、不顯示任何格式錯誤提示
