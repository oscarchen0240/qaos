title: 加盟列表一般加盟商 Badge 依「是否達成升等門檻」與「是否已透過前台申請」正確顯示三種樣式
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-013
acceptance_criteria_ids:
- AC-MEMBER-017
- AC-MEMBER-018
- AC-MEMBER-019
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- decision_table
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入「會員與加盟商 > 加盟列表」
- 從加盟列表既有資料中，找出分別呈現三種 Badge 樣式（已申請/達成未申請/未達成）的既有會員各一名，作為 A（已申請）、B（達成未申請）、C（未達成）——「升等門檻」的具體算法 spec 全文未定義，本 TC 不透過人工調整指標去製造達成/未達成狀態，只挑選環境中既有已呈現對應樣式的帳號（見
  assumptions）
test_data: []
steps:
- n: 1
  action: 於加盟列表檢視會員 A（已申請）的一般加盟商 Badge
- n: 2
  action: 檢視會員 B（達成未申請）的一般加盟商 Badge
- n: 3
  action: 檢視會員 C（未達成）的一般加盟商 Badge
expected_result: A 顯示白底『已申請』樣式；B 顯示深灰底『達成未申請』樣式；C 顯示黑底『未達成』樣式，三者樣式互不相同且分別對應各自狀態
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.2.2 加盟等級
  quote: （1）已申請（白底）：會員達成升等門檻，且已透過前台主動申請成為加盟商；（2）達成未申請（深灰底）：會員已達成升等門檻，但尚未透過前台申請；（3）未達成（黑底）：會員尚未達成升等門檻
assumptions:
- text: 「升等門檻」的具體達成算法（依據哪些指標、門檻數值為何）spec 全文未定義；本 TC 假設可從環境既有資料中挑選出三種樣式各自對應的會員，若環境中找不到齊全的三種樣式，如何人工佈置達門檻/未達門檻的測試資料需環境負責人確認
  requirement_id: REQ-MEMBER-013
  needs_human_confirmation: true
