title: 核實（洗分）三步驟流程：核對彈窗內容後確認，狀態轉為已核實並記錄人員與時間
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-021
acceptance_criteria_ids:
- AC-CASHOUT-0211
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 依機台帳號（會員編號）或交易時間，於本頁找到一筆待核實的洗分紀錄，點擊『核實』
- n: 2
  action: 確認彈窗顯示機台帳號、實際金額與交易時間，逐項核對與該筆紀錄一致
- n: 3
  action: 核對無誤後點擊確認
expected_result: 系統將該筆紀錄的核實狀態由『待核實』轉為『已核實』，並記錄執行核實的人員與時間
