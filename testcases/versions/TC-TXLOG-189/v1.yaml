execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 交易狀態篩選選擇「已逾時」（此值僅存在於開分/入鈔分組，依 REQ-TXLOG-009 已確認的技術值分組），交易類型不設限，點擊搜尋
expected_result: 結果不包含任何機台出金或機台洗分類型的交易——出鈔/洗分分組的交易狀態技術值本身不含「已逾時」這個值（依 REQ-TXLOG-009），故此類交易永遠不會以已逾時狀態出現
