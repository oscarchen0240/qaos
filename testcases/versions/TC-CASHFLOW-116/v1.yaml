steps:
- n: 1
  action: M 送出 req-keyin，金額 100；記下 M 分數 B1
  expected: 回 0-OK；M 分數 B1
- n: 2
  action: 同一分鐘內：M 送出 req-cashout（之後不送 end-cashout），再送出 req-cashin 金額 100（之後不送 end-cashin）；記下兩筆的 TXID（出金 TXID_O、入金 TXID_I）與建立時間
    T0
  expected: 兩筆皆回 0-OK；後台 4.1 兩筆皆為『待確認』
- n: 3
  action: T0 + 24 小時之後，每隔一段時間重新整理 4.1，直到入金 TXID_I 轉為『已逾時』（它是排程已執行的對照證據）
  expected: TXID_I 轉為『已逾時』
- n: 4
  action: 在 TXID_I 已轉為已逾時之後，檢視 TXID_O 的狀態，並讀 M 分數
  expected: TXID_O 仍為『待確認』，沒有轉為已逾時；M 分數仍為 B1（出金未扣、入金未加）
- n: 5
  action: 清理（不列入判定）：M 送出 end-cashout 完成 TXID_O，或待前端上線後由管理員手動取消
