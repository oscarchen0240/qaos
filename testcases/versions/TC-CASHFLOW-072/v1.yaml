title: 入金 PENDING 超過 24 小時未完成，自動轉為已逾時並釋放預留額度
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-008
- REQ-CASHFLOW-012
acceptance_criteria_ids:
- AC-CASHFLOW-0082
- AC-CASHFLOW-0122
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- boundary
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashin 建立一筆 PENDING（不呼叫 end-cashin，模擬紙鈔卡在機台內、平台已受理但未收到收鈔完成回報）
- n: 2
  action: 等待（或由排程機制觸發）該筆 PENDING 建立時間超過 24 小時
- n: 3
  action: 查詢該筆 PENDING 狀態
- n: 4
  action: 查詢該場館的額度計算，確認此筆的預留金額是否仍被佔用
expected_result: 該 PENDING 自動轉為「已逾時」，其預留額度隨即釋放（不再計入『已預留未入帳的入金金額』），之後再收到該 TXID 的 end-cashin 依 REQ-CASHFLOW-012 回 1-NO RECORD
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-PENDING 保留期限
  quote: PENDING 逾時（24 小時）由排程關閉時釋放；入金 PENDING 保留 24 小時，逾期自動轉「已逾時」；之後再收到 end-cashin 一律回 1-NO RECORD，機台停止重送，流程收斂
assumptions:
- text: 入金 PENDING 的 24 小時保留期限為系統固定值，spec 未提供可縮短此值以利測試的設定項（不同於場次逾時時間或日結時間可由場館設定調整）；實際測試需與環境負責人確認是否有可加速時間判定的測試機制（例如調整系統時鐘或手動觸發逾時排程），否則需真實等待
    24 小時執行
  requirement_id: REQ-CASHFLOW-008
  needs_human_confirmation: true
automation_status: not_automated
