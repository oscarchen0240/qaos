execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁「機台憑證」區塊，點擊「產生憑證」或「重置憑證」
- n: 2
  action: 檢視一次性顯示畫面的憑證內容格式與呈現方式
expected_result: 憑證內容為 JWT 格式字串（由三段以 . 分隔的 Base64 字串組成，長達數百字元）；一次性顯示畫面可換行完整顯示整串內容，並提供複製按鈕
