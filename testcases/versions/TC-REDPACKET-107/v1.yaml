title: 線上站台『每月 1 日』重置：月底→1 日的 UTC+0 00:00 累計歸零、待開啟紅包作廢；月中的午夜不重置
description: 線上站台『每月 1 日』重置：月底→1 日的 UTC+0 00:00 累計歸零、待開啟紅包作廢；月中的午夜不重置
