title: 洗分請求的 throshold 為負值、缺漏或非數值時，三種等價類別各自防禦性拒絕回 6-BAD DATA/FORMAT
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-015
acceptance_criteria_ids:
- AC-CASHFLOW-0151
- AC-CASHFLOW-0152
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
test_data:
- name: 情境一 throshold
  value: -1（負值）
- name: 情境二 throshold
  value: 欄位缺漏
- name: 情境三 throshold
  value: 字串（非數值型別）
steps:
- n: 1
  action: 呼叫 req-keyout，throshold 帶入負值（例如 -1）
- n: 2
  action: 確認回覆與帳務是否變動
- n: 3
  action: 另呼叫 req-keyout，缺少 throshold 欄位
- n: 4
  action: 確認回覆與帳務是否變動
- n: 5
  action: 另呼叫 req-keyout，throshold 帶入非數值（例如字串）
- n: 6
  action: 確認回覆與帳務是否變動
expected_result: 三種規格外情形皆回 6-BAD DATA/FORMAT，不寫入任何帳務異動；三者以等價劃分（負值／缺漏／型別錯誤）分別代表一類規格外輸入，結果一致
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/洗分
  quote: throshold 為負值、缺漏或非數值時，平台防禦性拒絕並回 6-BAD DATA/FORMAT
