  action: 結算日期設為完整週 09-07～09-13；該週最後營業日 09-13 日結時期末合計 80、09-12 為 120
- n: 2
  action: 於 09-14 06:00 日結完成後按週依場館彙總搜尋
expected_result: 期末餘額 80（非 200 亦非 120）
