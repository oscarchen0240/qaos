title: 店員洗分：確認視窗選［繼續結算］、洗分完成後待開啟紅包作廢（原因機台洗分）、累計不歸零、不留給下一位玩家
description: 店員洗分：確認視窗選［繼續結算］、洗分完成後待開啟紅包作廢（原因機台洗分）、累計不歸零、不留給下一位玩家
