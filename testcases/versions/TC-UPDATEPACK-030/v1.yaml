title: 對會員執行一筆人工提出後，其提款次數與提款金額皆不變動
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-008
acceptance_criteria_ids:
- AC-UPDATEPACK-0082
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一名帳戶餘額足以扣除本次人工提出金額的既有會員
test_data: []
steps:
- n: 1
  action: 於會員列表查詢該會員，記錄其目前的『提款次數』與『提款金額』兩欄數值作為基準
- n: 2
  action: 進入該會員的『會員詳細資料頁』〈帳務資訊〉區塊，點擊『人工提出』按鈕，於滑出面板填寫金額、稽核、前台備注、後台備注等必填欄位後點擊『儲存』
- n: 3
  action: 回到會員列表重新查詢（或重新整理）該會員，記錄其『提款次數』與『提款金額』兩欄目前數值
expected_result: 步驟3 記錄的提款次數與提款金額，與步驟1 的基準值完全相同，這筆人工提出不計入這兩個欄位
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §二、存款／提款累計欄位
  quote: 會員列表的存款次數／存款金額／提款次數／提款金額四個欄位，僅計系統入金與系統出金，一律不含人工入金與人工出金
