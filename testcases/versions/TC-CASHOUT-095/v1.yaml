title: 篩選器不提供場館欄位，頁面資料範圍隨站台切換選單變動
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-008
acceptance_criteria_ids:
- AC-CASHOUT-0081
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 檢視篩選器所有欄位，確認是否存在『場館』篩選欄位
- n: 2
  action: 將頁面標題下方的站台切換選單切換至站台 A，記錄查詢結果範圍
- n: 3
  action: 再切換至另一個既有站台 B，重新查詢並比較結果範圍
expected_result: 篩選器不存在『場館』欄位；切至站台 A 時查詢結果僅限站台 A 範圍內的紀錄，切至站台 B 後結果隨之只剩站台 B 範圍內的紀錄
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §篩選器
  quote: 頁面資料範圍跟隨頁面標題下方的站台切換下拉選單（後台各頁皆有，一次僅顯示所選站台），不另設場館篩選欄位
