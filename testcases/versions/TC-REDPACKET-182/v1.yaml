title: 機台紅包隨版本對所有機台場館一次上線：每個機台場館的後台選單皆顯示『優惠活動管理』（僅紅包類型），不存在依場館啟用紅包的開關
description: 機台紅包隨版本對所有機台場館一次上線：每個機台場館的後台選單皆顯示『優惠活動管理』（僅紅包類型），不存在依場館啟用紅包的開關
product: ba-admin
functional_area: REDPACKET
