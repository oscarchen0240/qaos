design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，管轄範圍內至少有兩個機台場館 V1、V2（自行從環境中選定，彼此獨立）；紅包版本已上線
test_data: []
steps:
- n: 1
  action: 頁面標題下方站台切換下拉選單切到機台場館 V1，檢視左側選單『系統管理』底下的項目
  expected: 顯示『優惠活動管理』
- n: 2
  action: 進入『優惠活動管理 > 新增優惠活動』，展開『活動類型』下拉選單
  expected: 只有『紅包』可選（機台場館的優惠活動管理僅開放紅包類型）；離開表單，不儲存
- n: 3
  action: 對機台場館 V2 重複步驟 1～2
  expected: V2 同樣顯示『優惠活動管理』且只有『紅包』類型
- n: 4
  action: 『後台管理員系統 > 站台列表』分別開啟 V1、V2 的『編輯』Modal，檢視全部欄位（機台專屬欄位：場館地址、場館聯絡人／電話、額度上限、場次逾時時間、日結時間等）
  expected: 沒有任何『啟用紅包』或同義的場館層級開關／設定欄位（不存在依場館啟用紅包的設定）；關閉 Modal 不儲存
expected_result: 每個機台場館的後台選單都顯示『優惠活動管理』且僅紅包類型可選；V1、V2 的場館編輯視窗都沒有任何依場館啟用紅包的開關或設定。
expected_result_spec_reference:
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.2'
  location: §業務規則與驗證（第 407 行）
  quote: 隨版本對所有機台場館一次上線，不設場館開關；上線後場館是否參加由站長自行決定（建立紅包活動即參加）
