title: Admin 新增站台時可自由搜尋並改選上層站台，留空則建立根層站台
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-012
acceptance_criteria_ids:
- AC-SITELIST-0121
