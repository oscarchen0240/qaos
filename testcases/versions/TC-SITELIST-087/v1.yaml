test_level: ui_e2e
test_types:
- functional
design_techniques:
- decision_table
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 點擊「+ 新增站台」，上層站台欄位搜尋並選取一個任意既有站台，填妥其餘欄位後建立
- n: 2
  action: 另開一次「+ 新增站台」，上層站台留空，填妥其餘欄位後建立
expected_result: 前者：系統接受，新站台的上層即為所選站台；後者：系統接受，新站台建立為根層站台（無上層）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §角色與權限 + §操作/新增站台
  quote: 自動帶入當前所在層；可搜尋改選任意站台（搜尋結果顯示站台名稱、代碼及完整路徑）；留空為根層
