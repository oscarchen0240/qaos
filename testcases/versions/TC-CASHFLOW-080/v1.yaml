title: 洗分請求的 throshold 為負值、缺漏或非數值時，一律防禦性拒絕回 6-BAD DATA/FORMAT
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-015
acceptance_criteria_ids:
- AC-CASHFLOW-0151
- AC-CASHFLOW-0152
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-keyout，throshold 帶入負值（例如 -1）
- n: 2
  action: 確認回覆與帳務是否變動
- n: 3
  action: 呼叫 req-keyout，缺少 throshold 欄位
- n: 4
  action: 確認回覆與帳務是否變動
- n: 5
  action: 呼叫 req-keyout，throshold 帶入非數值（例如字串）
- n: 6
  action: 確認回覆與帳務是否變動
expected_result: 三種規格外情形皆回 6-BAD DATA/FORMAT，不寫入任何帳務異動；三者以等價劃分（負值／缺漏／型別錯誤）分別代表一類規格外輸入，結果一致
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-洗分
  quote: 規格外的值（負值、缺漏、非數值）屬廠商保證外情形，防禦性處理：拒絕該筆、回 6-BAD DATA/FORMAT，不寫入任何帳務異動
