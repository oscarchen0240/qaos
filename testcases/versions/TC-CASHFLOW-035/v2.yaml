title: 所有未成立原因（餘額不足、額度上限、資料格式錯誤、機台停用/場館未開通、憑證失效）一律不寫入交易紀錄
requirement_ids:
- REQ-CASHFLOW-030
acceptance_criteria_ids:
- AC-CASHFLOW-0301
- AC-CASHFLOW-0302
test_level: api
test_types:
- negative
design_techniques:
- decision_table
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
steps:
- n: 1
  action: 洗分或出金因餘額不足被拒絕，查詢機台交易紀錄
- n: 2
  action: 開分或入金因額度上限被拒絕，查詢機台交易紀錄
- n: 3
  action: 交易請求 currency 與主站台核心貨幣不符（資料格式錯誤），查詢機台交易紀錄
- n: 4
  action: Admin 於站台列表頁將該機台切換為停用狀態，送出任一交易請求，查詢機台交易紀錄
- n: 5
  action: Admin 對該機台會員詳細頁的機台憑證執行重置，機台仍以舊 token 送出任一交易請求，查詢機台交易紀錄
expected_result: 五種未成立原因，查詢機台交易紀錄皆查無此次拒絕的紀錄，僅收到對應狀態碼（依序 1-NO CREDITS／1-OVER LIMIT／6-BAD DATA/FORMAT／7-OUT OF SERVICE／9-OTHER
  ERROR）；分數皆未異動；「未成立」狀態不會出現在交易紀錄查詢中，五種原因待遇一致（CLR-CASHFLOW-006）
