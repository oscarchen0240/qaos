risk: medium
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定兩名既有線上會員且 VIP 等級序號不同：玩家 A（等級序號 b，未被任何等級規則勾選，適用預設規則）、玩家 B（等級序號 s，被等級規則 1 勾選）；兩人本週期無注單計入累計。【環境前提】若環境中的會員等級與此不符，需有可立即改變測試會員
  VIP 等級序號的辦法（6.2 僅定義自動升降的評估週期），由環境負責人提供
test_data:
- name: 預設規則（玩家 A）
  value: 門檻 100／上限 5／固定 10／稽核 1
- name: 等級規則 1（玩家 B，序號 s）
  value: 門檻 100／上限 5／權重表 8（60%）／18（30%）／88（10%）／稽核 1
steps:
- n: 1
  action: 建立活動『RP-AMOUNT』（永久）：活動幣種 USDT；預設規則（固定 10）＋等級規則 1 勾選序號 s（隨機金額，權重表 8／60%、18／30%、88／10%）；其餘依資料；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 【格 1：固定 × 無待開啟】玩家 A 點紅包圖示開啟紅包視窗
  expected: 紅包金額顯示『最高 ＄10』
- n: 3
  action: 【格 2：權重表 × 無待開啟】玩家 B 點紅包圖示開啟紅包視窗
  expected: 紅包金額顯示『最高 ＄88』（最大獎項金額）
- n: 4
  action: 【格 3：固定 × 有待開啟】玩家 A 結算有效流水貢獻 100（產生 1 個紅包）；開啟紅包視窗；點『領取獎勵（1）』看確認領取視窗
  expected: 視窗紅包金額顯示 10（實際金額），不加『最高』；確認領取視窗同樣顯示實際金額 10
- n: 5
  action: 【格 4：權重表 × 有待開啟】玩家 B 先後分兩次各結算有效流水貢獻 100（依序產生 2 個紅包）；至紅包明細依產生時間記下 B 的兩個紅包金額 r1（先）、r2（後），各為 8／18／88 之一；玩家 B 開啟紅包視窗
  expected: 視窗紅包金額顯示先產生的那一個（紅包明細產生時間較早者，r1）的實際金額，不加『最高』（不是『最高 ＄88』）
- n: 6
  action: 玩家 B 依領取流程領取一個，再看視窗
  expected: 視窗改顯示另一個紅包（後產生的 r2）的實際金額；仍不加『最高』
- n: 7
  action: 玩家 B 再領取第二個，再看視窗
  expected: 已無待開啟紅包：金額改回『最高 ＄88』
- n: 8
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 無待開啟紅包時，固定金額顯示『最高 ＄10』、權重表顯示『最高 ＄88』；有待開啟紅包時顯示下一個待開啟紅包的實際金額（固定 10；權重表為產生時已抽定的金額），不加『最高』，確認領取視窗同樣顯示實際金額。
