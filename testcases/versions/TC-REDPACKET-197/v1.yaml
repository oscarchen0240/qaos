title: 紅包視窗金額顯示決策表：獎勵方式（固定／權重表）× 有無待開啟紅包 → 無待開啟時『最高 ＄…』、有待開啟時顯示下一個待開啟紅包的實際金額（不加『最高』）
description: 紅包視窗金額顯示決策表：獎勵方式（固定／權重表）× 有無待開啟紅包 → 無待開啟時『最高 ＄…』、有待開啟時顯示下一個待開啟紅包的實際金額（不加『最高』）
