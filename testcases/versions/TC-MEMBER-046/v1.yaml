preconditions:
- 以 Admin 登入後台，進入加盟列表，取一名已設定客製化加盟商（S Partner）身分的會員
test_data: []
steps:
- n: 1
  action: 記錄該列目前的佣金比例%、優惠%、返水%、推薦返傭%、行政費、稽核倍數原始數值
- n: 2
  action: 點擊「超級加盟商」按鈕進入 Inline 編輯模式，將上述欄位修改為與原始值不同的新數值
- n: 3
  action: 點擊列尾 ✕ 取消
- n: 4
  action: 檢視該列數值
expected_result: 數值還原為修改前的原始值，先前輸入的變更未被儲存
