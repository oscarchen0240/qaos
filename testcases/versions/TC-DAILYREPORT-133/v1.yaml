preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下選定一段連續 23 個營業日的結算日期區間（記為 R23，例如 2026-09-01～2026-09-23），區間內每個營業日皆有交易資料，使「依場館彙總＋按日」時每個營業日一列、共 23 列（3 頁：10＋10＋3）；不選含完全無資料營業日的區間——無資料時各欄顯示
  0 與 v0.2 餘額規則（含當期無場次但仍有留存分數者）的關係尚未釐清（RM REQ-DAILYREPORT-016 ambiguity）
- R23 內至少有 3 台機台（含機台 A）在每個營業日皆有資料且每日皆有場次（每台機台在 R23 內至少 11 個場次），使「依機台明細＋按日」至少有 69 列（≥7 頁）、「依機台明細＋按週」至少有 11 列（每台機台每週一列，R23 至少跨
  4 個週期，3 台×4＝12 列，≥2 頁）、以機台帳號篩選 A 後的「依機台明細＋按日」有 23 列（3 頁）
- 基準狀態 B：統計維度「依機台明細」、統計週期「按日」、結算日期 R23、機台帳號留空、預設排序；每項變更前都先還原到基準狀態 B 並切到第 3 頁
test_data: []
steps:
- n: 1
  action: 以基準狀態 B 搜尋，切到第 3 頁，記錄分頁列（目前頁、區間、總筆數）。【變更一：篩選條件】機台帳號填機台 A，搜尋；檢視分頁列：目前頁、區間、總筆數（預期仍有 23 列、3 頁）
- n: 2
  action: 還原基準狀態 B（清除機台帳號並搜尋），切到第 3 頁。【變更二：統計週期】統計週期改選「按週」；檢視分頁列（預期總筆數 ≥ 11、至少 2 頁）
- n: 3
  action: 還原基準狀態 B，切到第 3 頁。【變更三：統計維度】統計維度改選「依場館彙總」；檢視分頁列（預期 23 列、3 頁）
- n: 4
  action: 還原基準狀態 B，切到第 3 頁。【變更四：排序】點「開分金額」標題；檢視分頁列（預期總筆數不變、仍為多頁）
- n: 5
  action: 還原基準狀態 B，切到第 3 頁。【變更五：鑽取層級】點第 3 頁任一列的機台帳號向下鑽取（切至依場次明細）；檢視分頁列（預期該機台在 R23 內至少 11 個場次，至少 2 頁）
expected_result: 五種變更之後，列表皆回到第 1 頁：分頁列顯示目前頁為第 1 頁、區間從第 1 筆起、「上一頁」停用；且每次變更後總筆數都 ≥ 11（仍為多頁，使『回到第 1 頁』與『本來就只有一頁』可區分）。
