title: 作廢後不可復原，且分數不會退回機台帳號
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-030
acceptance_criteria_ids:
- AC-CASHOUT-0301
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以一個既有的『站長』角色帳號登入後台（自行從環境中選定該站長所屬場館的帳號）
- 頁面標題下方的站台切換選單維持為該站長所屬場館
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台出金紀錄，記錄該機台帳號當前的機台分數/餘額
- n: 2
  action: 以站長身分將其作廢（依 REQ-CASHOUT-028 流程）
- n: 3
  action: 作廢完成後，檢視該機台帳號的分數/餘額是否有變化，並尋找是否有任何『復原作廢』的操作
expected_result: 該機台帳號的分數/餘額不會因作廢而增加（分數不退回機台）；介面上不存在復原作廢的功能
