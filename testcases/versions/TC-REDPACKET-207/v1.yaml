execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 瀏覽器視窗高度足以讓『活動幣種』欄與頁面底部的規則欄不同時出現在畫面中（例如縮小視窗高度）
test_data: []
steps:
- n: 1
  action: 新增紅包活動，類型『紅包』、名稱『RP-SCROLL』、永久；取消勾選所有活動幣種（錯誤 1，位於頁面上方）；新增 2 組等級規則使表單拉長；把最後一個規則的累積門檻填 0（錯誤 2，位於頁面下方）；其餘欄位合法
  expected: 表單可編輯
- n: 2
  action: 把畫面捲到最底部（看不到『活動幣種』欄），點底部『儲存』
  expected: 不建立活動；整體再檢查一次：活動幣種欄與該規則的累積門檻欄都標紅框並於欄位下方提示（『請至少勾選一個活動幣種』『累積門檻須大於 0』）
- n: 3
  action: 觀察畫面位置
  expected: 畫面自動捲動至第一個錯誤欄位（位置最上方的『活動幣種』欄）
expected_result: 按『儲存』時整體再檢查一次：所有錯誤欄位皆標紅框並於下方提示，畫面自動捲動至第一個（位置最上方的）錯誤欄位，活動未建立。
