title: 儲存時整體再檢查一次並捲動至第一個錯誤欄位：多個欄位有誤時皆標紅框與提示，畫面捲到最上方的錯誤欄位
description: 儲存時整體再檢查一次並捲動至第一個錯誤欄位：多個欄位有誤時皆標紅框與提示，畫面捲到最上方的錯誤欄位
