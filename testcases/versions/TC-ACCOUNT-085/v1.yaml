preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，點擊「編輯」
- n: 2
  action: 將機台狀態欄位切換為與目前不同的值並點擊「儲存變更」
expected_result: 系統接受，機台資訊區塊的機台狀態更新為所選的新值
