title: 機台被設為停用，或所屬場館站台非開通狀態時，任一交易請求皆回 7-OUT OF SERVICE
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-041
acceptance_criteria_ids:
- AC-CASHFLOW-0411
- AC-CASHFLOW-0412
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 將該機台帳號設為停用狀態（機台帳號沿用既有會員帳號機制，透過既有的帳號啟用/停用功能操作，見假設）
- n: 2
  action: 呼叫任一交易請求（開分/入金/洗分/出金）
- n: 3
  action: 確認回覆，並確認機台既有餘額與尚未完成的交易是否受影響
- n: 4
  action: 將該機台恢復為啟用狀態，改將所屬場館站台狀態改為非開通（例如暫停）
- n: 5
  action: 呼叫任一交易請求
expected_result: 兩種情況下任一交易請求皆回 7-OUT OF SERVICE，該機台（或整個場館所有機台）無法運作；停用或站台非開通不影響既有餘額與尚未完成的交易
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §業務規則與驗證/機台停用、場館站台狀態 + §附錄-狀態碼對照
  quote: 機台停用 | 停用中的機台無法運作；不影響餘額與尚未完成的交易｜場館站台狀態 | 場館站台（含自行經營的機台主站台）不是「開通」狀態時，該場館所有機台一律無法運作
assumptions:
- text: 『機台停用』的後台切換操作路徑，本 spec 未明確定義其所在頁面（僅說明其效果），推測透過既有的會員帳號啟用/停用機制操作，實際入口需與環境負責人確認
  requirement_id: REQ-CASHFLOW-041
  needs_human_confirmation: true
automation_status: not_automated
ci_eligible: false
hotfix_eligible: true
execution_cost: medium
stability: unknown
critical_path: true
