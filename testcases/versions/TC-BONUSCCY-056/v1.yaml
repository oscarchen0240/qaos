title: 遊戲商 JACKPOT／促銷派彩依玩家下注當下使用的錢包幣別，依匯率換算後入帳
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-008
acceptance_criteria_ids:
- AC-BONUSCCY-010
spec_id: SPEC-BONUSCCY-002
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台已啟用系統幣別以外的至少一種幣別（例如 TTK）
- 選定一名使用 TTK 錢包餘額在支援 JACKPOT／促銷派彩的遊戲商遊戲（例如 PP、AWC、SABA 其中之一，視測試環境當下可觸發的遊戲商而定）下注的既有會員
- 若測試環境當下沒有可實際觸發 JACKPOT／促銷派彩的遊戲或機制，本 TC 需標記為待執行，待環境支援後再測（此限制已由 RequirementModel 的 rejection_contract 說明記載）
test_data: []
steps:
- n: 1
  action: 於後台會員詳細資料頁展開多幣別餘額檢視，記錄該會員目前 TTK 與系統幣別（USDT）錢包的餘額
- n: 2
  action: 使該會員中得該遊戲商發放的 JACKPOT 或促銷派彩
- n: 3
  action: 重新查看多幣別餘額檢視，檢視派彩入帳結果進了哪個幣別錢包，並核對入帳金額是否已依匯率換算（非原始遊戲幣別金額原封不動搬入）
expected_result: 派彩依匯率換算後進入 TTK 錢包（玩家下注當下所用的錢包幣別），不是站台系統幣別（USDT）；若入帳金額與原始派彩金額不同，差異應對應當下的匯率換算，而不是直接原值入帳
expected_result_spec_reference:
