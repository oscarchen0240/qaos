title: 重設連結逾時（超過預設 1 小時）後失效，時效內仍有效
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-016
acceptance_criteria_ids:
- AC-ACCOUNT-0162
