preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館已設定日結時間 06:00 UTC+0
- 測試場館下有機台 A、B（會員編號已知），並依各案例準備交易資料
- 結算日期預設為單一營業日 2026-09-05（起迄相同）；需要多日的案例於步驟中另設
- 該場館無其他未兌現收據
test_data: []
steps:
- n: 1
  action: 當日出金收據合計 200（可為多張），其中 150 於當日或之後任一日在洗分出金核實頁核銷
- n: 2
  action: 以結算日期＝該日搜尋
expected_result: 該日列：已兌現 150、未兌現 50（歸屬依收據日，不受核銷是哪一天影響）
