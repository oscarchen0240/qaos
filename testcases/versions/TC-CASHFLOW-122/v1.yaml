steps:
- n: 1
  action: 確認 M 分數為 0、沒有進行中場次；M 送出 req-keyin，金額 321
  expected: 回 0-OK；M 分數 321，建立場次 S1
- n: 2
  action: M 送出 req-keyout，mode=all、throshold=100
  expected: 回 0-OK，核可 300；M 分數 21；S1 結束，新場次 S2 立即承接餘數
- n: 3
  action: 在場次資訊頁查詢 S1
  expected: S1 期初餘額 0（開分起始）、期末餘額 21（洗分結束留有餘數）、場次狀態『已結束』
- n: 4
  action: 查詢 S2
  expected: S2 期初餘額 21（承接餘數）、場次狀態『進行中』
- n: 5
  action: M 送出 req-cashout（核可金額 21），再送 end-cashout 完成
  expected: 回 0-OK；M 分數 0；S2 結束
- n: 6
  action: 再次查詢 S2
  expected: S2 期末餘額 0（出金結束）
