priority: high
risk: high
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
- 三個連續營業日 D1、D2、D3（AC 範例 9/10～9/12），各日皆有資料；場館各機台結算時點分數合計於 D1／D2／D3 分別為 500／300／450（AC 範例）
test_data:
- name: D1／D2／D3 期末
  value: 500／300／450（AC 範例）
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、機台帳號留空、結算日期選 D1～D3，搜尋（預設排序：結算期間 ▼，新→舊）
- n: 2
  action: 記錄 D3、D2、D1 各列（列表由上而下）的期初餘額與期末餘額，以及總計列的期末餘額
- n: 3
  action: 比對相鄰列：D1 列期末餘額與 D2 列期初餘額；D2 列期末餘額與 D3 列期初餘額
- n: 4
  action: 比對列表第一列（最新營業日 D3）的期末餘額與總計列的期末餘額
- n: 5
  action: 點「結算期間」標題切換為遞增（▲，舊→新），再比對相鄰列：D1 列期末餘額與 D2 列期初餘額；D2 列期末餘額與 D3 列期初餘額
expected_result: 步驟 3 與步驟 5：D1 列期末餘額＝D2 列期初餘額、D2 列期末餘額＝D3 列期初餘額（兩種結算期間排序方向下皆成立）；步驟 4：預設排序下第一列（最新營業日）的期末餘額＝總計列的期末餘額。
