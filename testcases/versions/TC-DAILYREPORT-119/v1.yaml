title: 按日、依場館彙總：相鄰營業日列前後相接（前一日期末＝次一日期初），預設排序下第一列期末等於總計列期末
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-020
