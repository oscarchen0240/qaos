title: 機台前台紅包圖示：達標亮起且不自動彈出視窗、玩家點圖示才開啟視窗；視窗『重置時間』為場館日結時間
description: 機台前台紅包圖示：達標亮起且不自動彈出視窗、玩家點圖示才開啟視窗；視窗『重置時間』為場館日結時間
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-034
- REQ-REDPACKET-035
acceptance_criteria_ids:
- AC-REDPACKET-0343
- AC-REDPACKET-0356
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- state_transition
priority: high
risk: medium
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 機台帳號 M1（自行從環境中選定，本週期無注單）
- 場館日結時間為已知值 C（UTC+0，站台列表『日結時間』欄）
test_data:
- name: 活動
  value: 門檻 100／上限 5／固定 20／稽核 0；每日重置
- name: 日結時間 C
  value: 環境值
steps:
- n: 1
  action: 建立機台場館紅包活動『RP-ARC-ICON』（永久）：每日重置；預設規則門檻 100／上限 5／固定 20／稽核 0；儲存
  expected: 建立成功
- n: 2
  action: M1 機台畫面（尚無待開啟紅包）檢視右側紅包圖示
  expected: 圖示為暗
- n: 3
  action: M1 結算有效流水貢獻 100（累計達門檻），觀察機台畫面
  expected: 紅包圖示亮起；不自動彈出紅包視窗（玩家未點擊前畫面沒有任何紅包視窗）
- n: 4
  action: 玩家點擊亮起的紅包圖示，檢視紅包視窗的『重置時間』
  expected: 開啟紅包視窗；『重置時間』顯示下一次場館日結時間 C 的時刻（時區呈現方式沿用前台既有優惠活動，只比對時刻）
- n: 5
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 機台達標時紅包圖示亮起、不自動彈出視窗；玩家點擊圖示才開啟紅包視窗；視窗『重置時間』顯示下一次場館日結時間。
