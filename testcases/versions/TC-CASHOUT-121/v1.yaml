title: 已核實的紀錄找不到任何撤銷核實的操作，僅能於後台操作紀錄追溯
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-027
acceptance_criteria_ids:
- AC-CASHOUT-0271
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆已核實的紀錄，檢視其操作欄與紀錄詳情，尋找是否有『撤銷核實』或等效的操作
- n: 2
  action: 至後台操作紀錄（7.4 操作紀錄），查詢該筆核實動作，確認是否可查得執行人員與時間
expected_result: 操作欄與任何介面皆不提供撤銷核實的功能；後台操作紀錄可查得該筆核實動作的執行人員與時間，但無法回復該筆紀錄的核實狀態
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作
  quote: 核實一經確認即無法撤銷，誤按無法回復，只能透過後台操作紀錄追溯執行人員與時間
