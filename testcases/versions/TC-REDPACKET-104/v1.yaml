title: 站台列表編輯機台站台的『日結時間』：一律提示『變更將立即影響場館日結報表的營業日切分與紅包重置週期』（不論有無進行中的紅包活動）
description: 站台列表編輯機台站台的『日結時間』：一律提示『變更將立即影響場館日結報表的營業日切分與紅包重置週期』（不論有無進行中的紅包活動）
