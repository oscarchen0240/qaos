execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，可編輯下列兩個機台站台（站台列表）
- 機台站台 V（場館）：該場館目前有進行中的紅包活動；另一個機台站台 V'：該場館沒有任何進行中或排程中的紅包活動（兩者自行從環境中選定，彼此獨立）
- 本案只觀察提示、不要儲存新的日結時間（提示出現後選取消或關閉 Modal）
test_data: []
steps:
- n: 1
  action: 進入『後台管理員系統 > 站台列表』，找到機台站台 V，點『編輯』開啟 Modal，修改『日結時間』欄為另一個時間（不儲存）
  expected: 畫面提示『變更將立即影響場館日結報表的營業日切分與紅包重置週期』（提示出現的時點——修改欄位當下或點儲存前——只記錄，文字必須一致）
- n: 2
  action: 關閉 Modal（不儲存）；重新開啟 V 的編輯 Modal 檢視『日結時間』
  expected: 仍為修改前的值
- n: 3
  action: 對沒有任何紅包活動的機台站台 V' 做同樣操作：點『編輯』，修改『日結時間』欄為另一個時間（不儲存）
  expected: 同樣提示『變更將立即影響場館日結報表的營業日切分與紅包重置週期』（不論有無進行中的紅包活動）
expected_result: 編輯機台站台的日結時間時，一律提示『變更將立即影響場館日結報表的營業日切分與紅包重置週期』，不論該場館有無進行中的紅包活動。
