title: 換頁或重新查詢後，已展開的餘額欄回到收合預設
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-006
acceptance_criteria_ids:
- AC-UPDATEPACK-0061
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個已啟用兩種以上幣別的既有線上站台，且會員列表查詢結果至少涵蓋兩頁
test_data: []
steps:
- n: 1
  action: 於會員列表展開任一會員（非第一頁最後一筆以外）的帳戶餘額欄，確認已展開
- n: 2
  action: 切換至下一頁，再切換回原頁面（或直接重新送出查詢）
- n: 3
  action: 檢視原本展開的那一列，帳戶餘額欄目前的展開／收合狀態
expected_result: 換頁或重新查詢後，該欄回到收合預設狀態，不記得先前的展開操作
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示/顯示規則
  quote: 展開狀態的保留 | 逐欄各自獨立展開／收合，僅作用於當次瀏覽；換頁、重新查詢或重新進入頁面後回到收合預設
