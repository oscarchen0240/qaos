preconditions:
- 於前台（會員端）登入頁或首頁
test_data: []
steps:
- n: 1
  action: 前台申請重設密碼連結並點擊該連結完成設定新密碼
- n: 2
  action: 再次點擊同一條（已使用過的）連結
expected_result: 系統應阻擋此連結被再次用於設定密碼（不得允許再次改密碼）；實際顯示的提示文案或畫面需人工比對實測結果後確認（見假設）
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §前台忘記密碼（線上會員）
  quote: 會員點擊連結設定新密碼，完成後舊密碼立即失效
assumptions:
- text: Spec 未定義已使用過的重設連結被再次點擊時，系統實際顯示的提示內容或行為（例如是否顯示『連結已失效』或其他錯誤訊息），需人工確認實測結果
