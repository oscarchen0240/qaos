title: 稽核欄位輸入 0、負數或留空時的系統反應（spec 未明確定義此規則，僅能觀察記錄）
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-011
acceptance_criteria_ids:
- AC-MEMBER-015
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台，開啟一名會員的人工存入面板
test_data: []
steps:
- n: 1
  action: 稽核欄位分別嘗試輸入 0、負數、留空
- n: 2
  action: 點擊儲存，觀察並記錄系統實際反應（是否阻擋、是否退回預設值1、或是否接受並產生對應的流水門檻計算結果）
expected_result: spec §2.1.5僅定義稽核「預設為 1」與「將影響會員後續提款條件」，完全沒有定義輸入 0、負數或留空時系統應如何反應（是否阻擋、是否退回預設值 1、或是否接受並產生無法計算/異常的投注門檻）；本TC只能如實記錄實際觀察到的行為，不預設任何一種反應為正確答案，需另外向
  PM 確認正確規則後再回填為確定案例
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 帳務資訊
  quote: 稽核｜設定本次異動金額所需完成的可提領投注倍數，將影響會員後續提款條件；預設為 1
assumptions:
- text: 稽核欄位對 0 / 負數 / 留空等無效輸入的系統反應，spec §2.1.5全文未定義（僅定義「預設為1」與「會影響提款條件」，未定義無效輸入時的處理方式）；本TC不預設這是一個應被阻擋或應退回預設值的欄位，只如實記錄實測行為，正確規則需
    PM 確認
  requirement_id: REQ-MEMBER-011
  needs_human_confirmation: true
