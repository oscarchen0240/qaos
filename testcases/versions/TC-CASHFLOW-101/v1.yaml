title: 洗分或出金扣分成功當下場次立即結束（不等核實）；請求被拒絕或取消不觸發場次結束
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-035
acceptance_criteria_ids:
- AC-CASHFLOW-0351
- AC-CASHFLOW-0352
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
- negative
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 佈置一個進行中場次，餘額 321，throshold=100，呼叫 req-keyout 全洗，確認回 0-OK
- n: 2
  action: 立即查詢場次狀態（不進行「洗分出金核實」頁的核實操作）
- n: 3
  action: 另佈置一個進行中場次，觸發一筆會被拒絕的請求（例如餘額不足或額度超限）
- n: 4
  action: 查詢場次狀態是否受影響
- n: 5
  action: 另佈置一筆出金 PENDING 後，以新的 req-cashout 取代它（使其被標記失效）
- n: 6
  action: 查詢原場次狀態是否因此結束
expected_result: 洗分回 0-OK 當下場次立即結束，不需等待「洗分出金核實」頁核實；請求被拒絕（未成立）或 PENDING 被取代/取消，皆不觸發場次結束，場次仍為進行中
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §場次/場次如何開始與結束
  quote: 任一筆洗分或出金交易完成（扣分成功）當下，場次即結束…核實僅是付現核銷
