preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 開啟交易類型篩選
- n: 2
  action: 檢視可選項目的標籤文字
- n: 3
  action: 同時勾選其中兩個項目（例如「開分」與「出鈔」）
expected_result: 可選項目恰為「開分」「入鈔」「出鈔」「洗分」四項（不含「機台」字首）；兩個項目可同時維持勾選狀態，非單選互斥
