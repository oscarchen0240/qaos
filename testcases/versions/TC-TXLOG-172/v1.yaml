title: 以文字輸入場次編號可查出同一場次內的所有交易
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-006
acceptance_criteria_ids:
- AC-TXLOG-0061
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 選定一個已知場次編號，該場次內含多筆交易（若無現成場次，可於同一機台同一場次內連續操作數筆開分／洗分／出金以產生，佈置細節屬開發包③既有場次機制範疇）
- n: 2
  action: 於場次編號篩選欄輸入該場次編號，點擊搜尋
expected_result: 查詢結果為該場次內的所有交易，且不含其他場次的交易
