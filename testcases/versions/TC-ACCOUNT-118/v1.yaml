title: 機台帳號的會員等級固定為最低等級，且無法變更
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-031
acceptance_criteria_ids:
- AC-ACCOUNT-0313
spec_id: SPEC-ACCOUNT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，檢視其會員等級
- n: 2
  action: 檢視是否存在任何可手動調整該帳號等級的操作入口
expected_result: 會員等級顯示為系統定義的最低等級；不存在可手動調整機台帳號等級的操作入口（升降等由投注或其他行為觸發的一般會員機制，機台帳號無從觸發，此包上線前也無法透過投注行為驗證，故以「固定顯示最低等級且無變更入口」作為現階段可執行的驗證範圍）
