preconditions:
- 以 Admin 登入後台
- 進入 帳務管理 > 洗分出金核實，站台切換選單已選定一個機台場館站台
test_data: []
steps:
- n: 1
  action: 玩家持收據到櫃檯，於頁面上方輸入收據上的訂單編號查詢，定位到該筆待核實出金
- n: 2
  action: 確認彈窗核對訂單編號、機台帳號、金額、收據印出時間皆無誤
- n: 3
  action: 點擊確認（此動作不可撤銷，見 REQ-CASHOUT-027）
- n: 4
  action: 櫃檯付現金給玩家
expected_result: 系統將該筆標記為「已核實」，並記錄核實人員與時間
