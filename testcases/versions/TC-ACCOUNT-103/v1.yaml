steps:
- n: 1
  action: 開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁「機台憑證」區塊
- n: 2
  action: 檢視產生／重置憑證的流程與畫面，確認是否存在任何「有效期限」相關欄位、設定或提示
expected_result: 整個機台憑證功能不存在任何「有效期限」欄位、設定項或倒數提示；憑證僅會因「重置憑證」操作而失效，不因時間經過而失效
