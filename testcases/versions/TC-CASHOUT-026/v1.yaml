test_data: []
steps:
- n: 1
  action: 店員已對一筆待核實洗分當場付現，依機台帳號或交易時間找到該筆紀錄，點擊「核實」
- n: 2
  action: 確認彈窗核對機台帳號、實際金額、交易時間皆無誤
- n: 3
  action: 點擊確認（此動作不可撤銷，見 REQ-CASHOUT-027）
expected_result: 系統將該筆標記為「已核實」，並記錄核實人員與時間
