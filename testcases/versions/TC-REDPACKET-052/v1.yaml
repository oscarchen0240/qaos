title: 尚無已入帳紅包顯示『—』；建立時成本試算為建立當下快照、不隨會員人數變動
description: 尚無已入帳紅包顯示『—』；建立時成本試算為建立當下快照、不隨會員人數變動
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-021
acceptance_criteria_ids:
