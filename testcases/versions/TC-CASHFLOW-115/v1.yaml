steps:
- n: 1
  action: M 送出 req-keyin，金額 100；記下 M 分數 B1
  expected: 回 0-OK；M 分數 B1
- n: 2
  action: M 送出 req-cashout 取得 TXID_1，使第二階段 end-cashout 一直無法成功（實機：暫時阻斷機台與平台連線讓機台持續重送；模擬：不送 end-cashout）
  expected: 平台已建立出金 PENDING TXID_1
- n: 3
  action: 現場 Operator 於機台選單執行 Reset，機台停止重送（模擬環境：記錄『此後不再送出』）
  expected: 機台不再送出該 TXID 的 end-cashout
- n: 4
  action: 等待至少 10 分鐘後，在 4.1（機台視角）篩選 M、待確認出金，檢視 TXID_1；並讀 M 分數
  expected: TXID_1 仍為『待確認』，不會自動結束；M 分數仍為 B1
- n: 5
  action: 管理員在 4.1 對 TXID_1 執行『手動取消』（若出現二次確認視窗則確認）
  expected: TXID_1 轉為『已取消』；M 分數仍為 B1。結果欄請註明 Reset 是實機執行或 API 模擬
test_data:
- name: 開分金額
  value: 100
- name: 觀察等待時間
  value: 至少 10 分鐘（本案自訂，spec 未規定）
