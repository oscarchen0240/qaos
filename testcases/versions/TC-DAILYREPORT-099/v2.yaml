title: 依場次明細的進行中場次列：結束時間「—」，場次時長與期末餘額累計到查詢當下
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-008
acceptance_criteria_ids:
- AC-DAILYREPORT-0083
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 測試場館下有一台既有機台 A（自行從環境中選定）
- 執行期間不得跨越場館日結時間 T（UTC+0）（若目前離日結時間不到 30 分鐘，請改日或等日結後再執行）
- 場次逾時預設為 1 小時（環境設定，本 spec 未載明，需環境負責人確認）：自機台 A 最後一次交易起算須在 1 小時內完成所有查詢，否則進行中場次可能變為「逾時結束」而使本次執行作廢
- 機台 A 目前有一個進行中場次：已有開分與投注，且最後一次投注後不再有任何交易、也不再遊玩
- 機台 A 的目前分數 X 已知：以機台前台畫面顯示的分數為準並記錄（AC 範例為 300，實際值不限，須大於 0）
test_data:
- name: X
  value: 機台 A 目前分數；AC 範例 300，實際取機台前台讀值，須 > 0
- name: 等待間隔
  value: 約 3 分鐘
steps:
- n: 1
  action: 進入 各式報表 > 場館日結報表，統計維度選「依場次明細」、統計週期「按日」、機台帳號填機台 A；結算日期涵蓋前一營業日與目前營業日（營業日依場館日結時間 T（UTC+0）切分；日期標示可能與測試人員所在地的日曆日不同，故取涵蓋兩天的區間）；列表預設依結算期間新→舊排序、每頁
    10 筆，進行中場次屬於最新（目前）營業日、位於列表最上方，請以「機台帳號＝機台 A」且「結算期間＝目前營業日（查詢當下所屬的營業日）」且「狀態＝進行中」定位目標列，不依賴列的位置；若目標列不在第 1 頁，翻頁尋找；查詢
- n: 2
  action: 在列表找出機台 A 的進行中場次列，記錄場次編號、狀態、結束時間、場次時長 T1、期末餘額，以及查詢的時間點
- n: 3
  action: 不對機台 A 做任何交易，等待約 3 分鐘，以完全相同的條件重新查詢，記錄同一場次列的場次時長 T2、結束時間、期末餘額
expected_result: 步驟 2：該場次列存在，狀態「進行中」、結束時間「—」、期末餘額＝X；步驟 3：同一場次編號的列仍為「進行中」、結束時間仍為「—」，場次時長 T2 比 T1 多約 3 分鐘（隨查詢當下累計，非固定值），期末餘額仍＝X（期間無交易）。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §列表欄位/場次編號 + §背景：場次資訊（結束時間、場次時長）；進行中場次列的累計顯示見 §列表欄位附註/餘額驗算（v0.2 原文）
  quote: 「依場次明細」維度的進行中場次列亦顯示累計至查詢當下的分數（比照「場次時長」的呈現方式，非顯示「—」）
