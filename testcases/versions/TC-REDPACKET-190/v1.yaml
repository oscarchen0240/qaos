preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
- 【時間窗】本案必須在 UTC+0 每日 00:00 重置前約 1 小時內完成：於 UTC+0 22:50 前建立活動並備妥待開啟紅包；觀察點為 UTC+0 22:58（距重置 62 分鐘）、23:01（距重置 59 分鐘）；本案請在 00:00
  之前結束（不要等到重置）
test_data:
- name: 活動
  value: 每日重置；門檻 100／上限 5／固定 10／稽核 1
- name: 觀察點
  value: UTC+0 22:58（61 分鐘以上）、23:01（60 分鐘以內）
steps:
- n: 1
  action: UTC+0 22:50 前建立活動『RP-WARN-D』（永久）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 10／稽核 1；每日重置；儲存；玩家 A 結算有效流水貢獻 100
  expected: 產生 1 個待開啟紅包 P1
- n: 2
  action: UTC+0 22:58（距下次重置 62 分鐘）玩家 A 點紅包圖示開啟紅包視窗
  expected: 不顯示『未開啟的紅包將於重置時作廢』提示
- n: 3
  action: UTC+0 23:01（距下次重置 59 分鐘）玩家 A 再開啟紅包視窗
  expected: 顯示提示『未開啟的紅包將於重置時作廢』
- n: 4
  action: 玩家 A 依領取流程領取 P1（已無待開啟紅包），再開啟紅包視窗
  expected: 不顯示該提示（無待開啟紅包時不提示）
- n: 5
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 有待開啟紅包時，於重置前 1 小時起提示『未開啟的紅包將於重置時作廢』：距重置 62 分鐘不提示、59 分鐘提示；無待開啟紅包時不提示。
