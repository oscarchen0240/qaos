title: 線上前台重置前 1 小時起提示：有待開啟紅包時，距下次重置 61 分鐘不提示、60 分鐘內提示『未開啟的紅包將於重置時作廢』；無待開啟紅包時不提示
description: 線上前台重置前 1 小時起提示：有待開啟紅包時，距下次重置 61 分鐘不提示、60 分鐘內提示『未開啟的紅包將於重置時作廢』；無待開啟紅包時不提示
