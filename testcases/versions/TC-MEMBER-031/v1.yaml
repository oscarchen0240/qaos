title: 加盟商會員透過邀請鏈註冊時，側邊面板正確顯示完整上下層邀請鏈
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-004
acceptance_criteria_ids:
- AC-MEMBER-005
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入「會員與加盟商 > 會員列表」頁面
- 取一名既有會員，須同時符合兩個各自獨立的條件：(a) 目前已具加盟商身分——加盟商身分的取得條件見 REQ-MEMBER-013，與註冊方式無關；(b) 當初是透過『另一名既有會員』的前台邀請連結完成註冊——這只決定其邀請鏈的上層是誰，不代表註冊本身會讓人自動升級為加盟商。自行從環境中選定同時符合這兩個條件的既有帳號
test_data: []
steps:
- n: 1
  action: 於會員列表點擊該會員的會員編號，開啟右側簡易資料面板
- n: 2
  action: 檢視面板頂部的邀請鏈顯示
expected_result: 面板頂部顯示完整的上下層關係：上層會員編號 → 當前會員編號 → 會員N人（N為其下層會員數），且上層顯示的是實際邀請該會員註冊的會員編號
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.4 側邊簡易資料面板
  quote: 邀請鏈顯示完整的上下層關係（如：上層會員編號 → 當前會員編號 → 會員 N 人）；若該會員非透過邀請鏈註冊，則上層顯示為站長
