title: 站長可於遊戲商管理手動開啟目前為停用狀態的機台場館遊戲
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-022
acceptance_criteria_ids:
- AC-PLATFORMRULE-0221
