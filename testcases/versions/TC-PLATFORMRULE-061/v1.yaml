test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台場館站台，並於其『遊戲商管理』選定一款目前狀態為停用的既有遊戲（不論其停用原因，只要目前狀態為停用即可）
- 選定一個管轄範圍涵蓋該機台場館的既有站長帳號
- 以該站長帳號登入後台
test_data: []
steps:
- n: 1
  action: 進入『遊戲商管理』，找到前置作業選定的停用中遊戲
- n: 2
  action: 對該遊戲執行啟用操作
expected_result: 系統允許站長完成該遊戲的啟用操作，操作後該遊戲狀態變為啟用
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
