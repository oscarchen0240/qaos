preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
  AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
- 收據資料（造數）：營業日 e1（AC 範例 2026-09-04，週五，落在第一個週列內）有一筆出金收據 100；營業日 e2（AC 範例 2026-09-08，週二，落在第二個週列內）有一筆出金收據 300；兩張截至查詢當下皆仍待核實
- 查詢範圍（AC 範例 2026-09-03～2026-09-10，起日為週四、週一為 09-07，故第一列為週四到週日的不完整週）內，除 e1、e2 兩張之外，場館沒有其他待核實的出金收據；測試期間不要對這兩張收據做核實或作廢
test_data:
- name: e1 收據（營業日 09-04）
  value: 100
  note: 待核實，第一個週列
- name: e2 收據（營業日 09-08）
  value: 300
  note: 待核實，第二個週列
- name: 第二次查詢的結算日期起日
  value: '2026-09-05'
  note: e1 收據日 09-04 的隔天
steps:
- n: 1
  action: 統計維度選「依場館彙總」，統計週期選「按週」，結算日期選 2026-09-03～2026-09-10，搜尋
- n: 2
  action: 記錄兩個週列（第一列「09-03～09-06」、第二列「09-07～09-10」）的未兌現金額
- n: 3
  action: 統計維度與統計週期不變，結算日期改為 2026-09-05～2026-09-10（起日為 e1 收據日的隔天），搜尋
- n: 4
  action: 記錄各週列的未兌現金額（第一列為週一之前的不完整週，期間文字以畫面實際顯示為準；第二列為「09-07～09-10」）
expected_result: 步驟 2：第一列（含 e1 的 09-04）未兌現 100、第二列（含 e2 的 09-08）未兌現 300——每一列只含出收據日落在該列期間內的待核實收據，e1 的 100 不會出現在第二列、e2 的 300
  不會出現在第一列。步驟 4：第一列未兌現 0（e1 的出收據日 09-04 在新的結算日期範圍之外，不計入）；第二列仍為 300。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  location: §列表欄位附註／統計週期（第 70 行）
  quote: 「已兌現」「未兌現」「已作廢」三欄同為該週期內各營業日的合計（依收據日歸屬），狀態一律以查詢當下為準
