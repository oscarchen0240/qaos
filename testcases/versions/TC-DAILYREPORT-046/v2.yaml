title: 未兌現金額仍受結算日期範圍限制，範圍外的未兌現收據不計入
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-015
acceptance_criteria_ids:
- AC-DAILYREPORT-0152
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館已設定日結時間 06:00 UTC+0
- 測試場館下有機台 A、B（會員編號已知），並依案例準備交易資料
- 存在一筆結算日期為 09-10 的未兌現收據 200
test_data:
- name: 未兌現收據金額
  value: 200
- name: 收據結算日期
  value: '2026-09-10'
steps:
- n: 1
  action: 以結算日期範圍 09-03～09-09（不含 09-10）、按週統計搜尋，記錄 09-07～09-09 與 09-03～09-06 兩列的未兌現金額
- n: 2
  action: 改以結算日期範圍 09-03～09-10（含 09-10）、按週統計搜尋，記錄 09-07～09-10 與 09-03～09-06 兩列的未兌現金額
expected_result: 第一次查詢（範圍不含 09-10）：未兌現金額不包含這筆 200，09-07～09-09 列與 09-03～09-06 列皆不反映此筆收據；第二次查詢（範圍含 09-10）：09-07～09-10 這一列的未兌現金額包含這筆
  200（較第一次同週次的未兌現金額多 200）。驗證未兌現金額仍以結算日期範圍為篩選條件，範圍外的未兌現收據不會被計入——『不受週期影響、累計至查詢當下』指的是不受『週期切分方式』影響（不會因為切成週而被打散或重複計算），不是不受『結算日期範圍』這個篩選條件限制
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §列表欄位附註（此節已由 CLR-DAILYREPORT-009 補充精確定義）
  quote: 未兌現金額：不受統計週期切分影響，累計至查詢當下；結算日期範圍仍是篩選條件，未兌現金額只計範圍內
