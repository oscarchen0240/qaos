title: 交易狀態篩選的可選項目依交易類型分組而不同：開分/入鈔為 7 項技術值，出鈔/洗分為 6 項技術值
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-009
acceptance_criteria_ids:
- AC-TXLOG-0091
- AC-TXLOG-0092
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- decision_table
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 交易類型篩選勾選「開分」或「入鈔」，開啟交易狀態篩選，記錄可選項目
- n: 2
  action: 改為交易類型篩選僅勾選「出鈔」或「洗分」，重新開啟交易狀態篩選，記錄可選項目
expected_result: 開分/入鈔分組下，交易狀態可選項目為「已逾時、錯誤、無、成功、等待中、已取消、無效」共 7 項；出鈔/洗分分組下，可選項目為「失效、待處理、已拒絕、等待中、錯誤、已處理」共 6 項（含 2026-09-14 補上的「已處理」）；兩組項目不相同
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §篩選器（實際畫面與 spec.md 原文不同，見 Oscar 2026-09-14 截圖確認）
  quote: 交易狀態 | 下拉選單 | 全部 / 待確認 / 已完成 / 已取消 / 已逾時 / 未成立（＊實際依交易類型分兩組技術值）
