test_data: []
steps:
- n: 1
  action: 調整場館額度上限為一已知值，另建構一筆已預留未入帳的入金 PENDING
- n: 2
  action: 送出開分請求（req-keyin），金額使加計後「全場館機台分數餘額合計＋已預留未入帳的入金金額＋本筆金額」超過該上限
expected_result: 平台回 1-OVER LIMIT；機台畫面顯示失敗；分數不變、不寫入任何帳務異動（判定含已預留未入帳的入金金額，與入金共用同一把場館鎖）
