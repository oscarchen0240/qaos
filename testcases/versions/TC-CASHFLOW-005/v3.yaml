test_data:
- name: 第一筆開分金額
  value: 100（使加計後恰等於上限 A）
- name: 第二筆開分金額
  value: 1（使加計後超過上限 A）
automation_status: not_automated
ci_eligible: false
hotfix_eligible: false
execution_cost: medium
stability: unknown
critical_path: true
priority: high
risk: high
title: 開分加計後恰等於場館額度上限可成立；超過 1 單位則被拒絕，不寫入帳務異動、也不寫入交易紀錄
requirement_ids:
- REQ-CASHFLOW-004
- REQ-CASHFLOW-030
acceptance_criteria_ids:
- AC-CASHFLOW-0041
- AC-CASHFLOW-0301
- AC-CASHFLOW-0302
test_level: api
test_types:
- functional
- negative
design_techniques:
- decision_table
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
- 調整場館額度上限為一已知值 A，另建構一筆已預留未入帳的入金 PENDING，使目前「全場館機台分數餘額合計＋已預留未入帳入金金額」恰為 A-100
steps:
- n: 1
  action: 送出開分請求（req-keyin），金額 100，使「全場館機台分數餘額合計＋已預留未入帳入金金額＋本筆金額」恰等於額度上限 A
- n: 2
  action: 確認回覆為 0-OK，分數正常增加，交易紀錄正常寫入
- n: 3
  action: 再送出開分請求（req-keyin），金額 1，使加計後超過額度上限 A
- n: 4
  action: 確認此筆的回覆、分數變化，並查詢交易紀錄（不篩選狀態）確認查無此筆
expected_result: 第一筆恰等於上限：成立，回 0-OK，分數正常增加，交易紀錄正常寫入；第二筆使合計超過上限：平台回 1-OVER LIMIT，機台畫面顯示失敗，分數不變、不寫入任何帳務異動，且查無此次拒絕的交易紀錄（CLR-CASHFLOW-006：額度上限不再屬於「其他未成立原因會留紀錄」，與餘額不足同一待遇）
