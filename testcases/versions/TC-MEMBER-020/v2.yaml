title: 尚未達成升等門檻的會員，一般加盟商 Badge 顯示黑底「未達成」
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-013
acceptance_criteria_ids:
- AC-MEMBER-019
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 一名會員尚未達成升等門檻（挑選一般新註冊、各項可觀察指標皆為0/無記錄的既有會員）
test_data: []
steps:
- n: 1
  action: 於後台確認該帳號為一般新註冊、各項可觀察指標（業績、推薦人數、儲值等）皆為0/無記錄的既有會員
- n: 2
  action: 於加盟列表檢視該會員的一般加盟商 Badge
expected_result: 顯示黑底「未達成」樣式
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.2.2 加盟等級
  quote: （1）已申請（白底）：會員達成升等門檻，且已透過前台主動申請成為加盟商；（2）達成未申請（深灰底）：會員已達成升等門檻，但尚未透過前台申請；（3）未達成（黑底）：會員尚未達成升等門檻
assumptions:
- text: 「升等門檻」的具體達成算法（依據哪些指標、門檻數值為何）spec §2.2.2全文未定義；本TC不透過人工調整指標去製造未達成狀態，改為從環境既有資料中挑選出已呈現「未達成」樣式的既有會員，若環境中找不到符合條件的既有帳號，如何人工佈置此狀態的測試資料需環境負責人/PM確認；「業績/推薦人數等指標」是否確實為升等門檻演算法的必要或充分條件，本身同樣未經spec證實，故不主張此case風險比TC-018/019低，僅以「新註冊、各項可觀察指標皆為0」作為挑選依據以降低（而非消除）不確定性
  requirement_id: REQ-MEMBER-013
