- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果中找到（或安排）一筆核實狀態為待核實的機台洗分交易
- n: 2
  action: 檢視其核實狀態欄的呈現方式
expected_result: 核實狀態欄以醒目色標（與其他狀態值視覺上明顯不同的提示樣式）呈現，用以提醒站務人員尚有待核實的洗分交易
