title: 對同一機台站台會員執行人工提出（幣種選擇欄位固定USDT無法切換），實際從該站台核心貨幣TWD錢包扣除
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-003
acceptance_criteria_ids:
- AC-BONUSCCY-005
spec_id: SPEC-BONUSCCY-001
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台切換選單切換至一個既有的機台（TWD核心貨幣）站台（自行從環境中選定）
- 該站台底下已有一個既有機台帳號（自行從環境中選定）
- 已知該面板「幣種選擇」欄位固定顯示 USDT 且操作者無法切換（此為既有UI行為，依SPEC-MEMBER-001/SPEC-ARCADE-001定案不受本次調整，非本次驗證重點；本測試重點是實際入帳/扣款結果的幣別，而非該欄位顯示文字）
- 該機台帳號目前核心貨幣（TWD）錢包餘額足以扣除本次測試金額（可先透過人工存入墊高餘額，或選擇餘額已足夠的既有帳號）
test_data: []
steps:
- n: 1
  action: 進入該機台帳號的會員詳細資料頁，記錄目前核心貨幣（TWD）錢包餘額
- n: 2
  action: 點擊「人工提出」開啟面板，金額欄填入一筆不超過目前TWD餘額的測試金額，稽核欄位維持預設值，前台備注與後台備注皆填寫必填文字，幣種選擇欄位維持固定顯示的 USDT（無法切換），點擊「儲存」
- n: 3
  action: 重新整理/回到會員詳細頁，檢視核心貨幣（TWD）錢包餘額
expected_result: 該會員核心貨幣（TWD）錢包餘額較提出前減少所填寫的金額；金額確實從站台核心貨幣（TWD）扣除，而不是寫死的 USDT（若舊行為的錯誤仍存在，TWD餘額將不會減少、或因找不到USDT餘額扣款而失敗，可藉此判斷）
expected_result_spec_reference:
  spec_id: SPEC-BONUSCCY-001
  spec_version: '1.0'
  location: §實際被改到的地方（表格第6項：人工出入金）
  quote: 人工出入金 | 四支原本沒有明確寫入幣別（靠資料表 DEFAULT 或填死 USDT），改成取核心貨幣
