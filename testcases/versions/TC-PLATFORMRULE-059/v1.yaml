title: 既有已啟用的遊戲於平台發布更新後，在機台場館被重新設為停用
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-021
acceptance_criteria_ids:
- AC-PLATFORMRULE-0211
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台場館站台 X
- 選定一款目前已在機台場館 X 呈啟用狀態的既有遊戲
test_data: []
steps:
- n: 1
  action: 於『遊戲商管理』記錄該遊戲目前於機台場館 X 的狀態（啟用中）
- n: 2
  action: 由具備權限的角色，對該遊戲發佈一次更新
- n: 3
  action: 更新完成後，重新檢視該遊戲於機台場館 X 的狀態
expected_result: 更新完成後，該遊戲於機台場館 X 被重新設為停用狀態，不因更新前原已是啟用狀態而被保留為啟用
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的遊戲更新
  quote: 預設停用 | 平台新增任何遊戲、或對既有遊戲發佈更新後，該遊戲在所有機台場館一律預設為停用——包含更新前原已啟用的遊戲（更新視同內容變動，須重新決定是否開放）
assumptions:
- text: 『平台對既有遊戲發佈更新』的實際後台操作介面與具體步驟不在本 spec 定義範圍內（本 spec 僅描述此動作對機台場館產生的連帶效果，未定義觸發此動作的頁面路徑），需另比對遊戲管理相關 spec 或洽環境負責人確認實際觸發方式；本
    TC 假設可透過後台遊戲管理功能中的版本／更新發佈動作觸發，若實際操作路徑與假設不符，結果需人工複核
  requirement_id: REQ-PLATFORMRULE-021
  needs_human_confirmation: false
  resolved_by_approval: APR-0125
