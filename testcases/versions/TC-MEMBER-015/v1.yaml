preconditions:
- 一名會員可提領投注額基準已知，準備對其執行一筆人工存入，稽核倍數設定為 3 倍
test_data: []
steps:
- n: 1
  action: 記錄存入前的「提領所需有效投注額」
- n: 2
  action: 執行人工存入，稽核倍數設為 3
- n: 3
  action: 檢視存入後的「提領所需有效投注額」
expected_result: 提領所需有效投注額因這筆存入金額乘上稽核倍數（3倍）而增加，不是單純加回存入金額本身
