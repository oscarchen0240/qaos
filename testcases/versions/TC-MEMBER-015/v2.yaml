title: 稽核倍數大於1時，提領所需有效投注額依倍數增加而非單純加回存入金額（具體數值驗證）
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-011
acceptance_criteria_ids:
- AC-MEMBER-015
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入一名既有會員的詳細資料頁
test_data:
- name: 人工存入金額
  value: 100 USDT
- name: 稽核倍數
  value: '3'
steps:
- n: 1
  action: 記錄目前帳務資訊區塊「提領所需有效投注額（流水錢包）」數值（設為 X）
- n: 2
  action: 點擊「人工存入」，金額填寫 100 USDT、稽核填寫 3，填妥前後台備注後儲存
- n: 3
  action: 重新整理該會員詳細資料頁，檢視帳務資訊區塊的「提領所需有效投注額」
expected_result: 提領所需有效投注額變為 X + (100 × 3) = X + 300，而非單純的 X + 100（存入金額本身），確認稽核倍數確實套用於流水計算
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 帳務資訊
  quote: 稽核｜設定本次異動金額所需完成的可提領投注倍數，將影響會員後續提款條件；預設為 1
