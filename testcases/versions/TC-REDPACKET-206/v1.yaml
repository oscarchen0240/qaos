preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 線上站台；每次建立後取消排程再建立下一筆（同站台同一時間只能有一個進行中的紅包活動）
test_data:
- name: 稽核倍數
  value: 0 ✓、100 ✓、2.5 ✓、2.55 ✗、-1 ✗
steps:
- n: 1
  action: 新增紅包活動『RP-AUD-A』（永久）：預設規則門檻 1000／上限 5／固定 10；稽核倍數填 2.55；其餘合法；點『儲存』
  expected: 不建立活動；稽核倍數欄提示『最多 1 位小數』
- n: 2
  action: 稽核倍數改填 -1，點『儲存』
  expected: 不建立活動；稽核倍數欄提示『稽核倍數須大於或等於 0』
- n: 3
  action: 稽核倍數改填 0，點『儲存』
  expected: 建立成功（稽核倍數可為 0）
- n: 4
  action: 取消排程 RP-AUD-A；新增『RP-AUD-B』（同上）稽核倍數填 100，儲存
  expected: 建立成功（不設上限）
- n: 5
  action: 取消排程 RP-AUD-B；新增『RP-AUD-C』（同上）稽核倍數填 2.5，儲存
  expected: 建立成功（1 位小數）
- n: 6
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 稽核倍數 0、100、2.5 可建立（可為 0、不設上限、最多 1 位小數）；2.55 提示『最多 1 位小數』；－1 提示『稽核倍數須大於或等於 0』，皆不建立活動。
