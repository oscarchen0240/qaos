title: 按日、依場館彙總的多日查詢：總計列期末餘額為最新營業日列的值、期初餘額為範圍起點前一營業日結算時點的值，均非逐列相加
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-019
acceptance_criteria_ids:
- AC-DAILYREPORT-0192
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
