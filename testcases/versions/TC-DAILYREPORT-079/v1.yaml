title: 過渡期無印表機的機台，收據金額欄取結算結果畫面顯示的出金金額合計
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-010
acceptance_criteria_ids:
- AC-DAILYREPORT-0102
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一台目前處於『過渡期尚未安裝印表機』狀態的既有機台
test_data: []
steps:
- n: 1
  action: 核對該機台當日的出金交易，記錄『結算結果畫面』顯示的出金金額合計（若此畫面非後台可直接查看，需經由對應的機台端或維運紀錄確認）
- n: 2
  action: 進入場館日結報表，統計維度選『依機台明細』，結算日期設為當日，查詢，檢視該機台的『收據金額』欄位
expected_result: 收據金額欄顯示的數值與步驟1記錄的結算結果畫面出金金額合計相符（而非印出的收據面額合計，因該機台過渡期無印表機）
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §列表欄位/開分~收據金額
  quote: 結算結果畫面顯示的出金金額合計
assumptions:
- text: 如何在後台判斷／辨識一台機台目前是否屬於『過渡期尚無印表機』狀態，本包與目前可讀的其他 spec 皆未定義對應欄位或查詢方式；此為測試資料佈置所需但 spec 未提供依據的判斷，需人工確認辨識方式
  requirement_id: REQ-DAILYREPORT-010
  needs_human_confirmation: true
