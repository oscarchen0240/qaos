preconditions:
- 以 Admin 登入後台
- 選定一台目前有進行中場次的既有機台
test_data: []
steps:
- n: 1
  action: 於會員詳細頁『機台資訊』區塊或機台交易紀錄，核對該機台當日已結束的場次筆數（不含目前進行中的這一場）
- n: 2
  action: 進入場館日結報表，統計維度選『依機台明細』，結算日期設為當日，查詢，檢視該機台的『場次數』欄位
expected_result: 該機台的場次數等於步驟1核對的已結束場次筆數，不因目前有一場進行中場次而多算一筆
