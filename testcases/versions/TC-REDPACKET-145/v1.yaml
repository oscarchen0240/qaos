design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 記下『活動排程 > 紅包活動』列表筆數 n0（狀態篩選『全部』）
test_data:
- name: 累積門檻
  value: 1000.55 ✗／1000.5 ✓
- name: 固定紅包金額
  value: 18.25 ✗／18.2 ✓
- name: 總預算
  value: 5000.55 ✗／5000.5 ✓
- name: 權重表機率
  value: 33.35 ✗／33.3、33.3、33.4 ✓
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，類型『紅包』、名稱『RP-DEC』、永久；預設規則：累積門檻 1000.55、單週期發放上限 5、固定金額 18.25、稽核倍數 1；總預算 5000.55；點『儲存』
  expected: 不建立活動；累積門檻、紅包金額、總預算三欄各自紅框並於欄位下方提示『最多 1 位小數』
- n: 2
  action: 把三欄各改為 1 位小數（累積門檻 1000.5、紅包金額 18.2、總預算 5000.5）再點『儲存』
  expected: 三欄的『最多 1 位小數』提示消失，活動建立成功（活動排程筆數 n0＋1）
- n: 3
  action: 取消排程 RP-DEC 並確認；重新新增活動，獎勵方式選『隨機金額』，權重表三列：金額 8／機率 33.35、金額 18／機率 33.3、金額 88／機率 33.35（其餘欄位合法、1 位小數）；點『儲存』
  expected: 不建立活動；機率欄於權重表欄位提示標示『最多 1 位小數』
- n: 4
  action: 把權重表機率改為 33.3、33.3、33.4（合計 100%）再點『儲存』
  expected: 權重表的小數位數提示消失，活動建立成功
- n: 5
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 累積門檻、紅包金額、總預算、中獎機率最多 1 位小數：2 位小數時不建立活動並提示『最多 1 位小數』（機率於權重表欄位提示標示），改為 1 位小數後該項檢查通過、活動可建立。
