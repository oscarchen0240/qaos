title: 數值精度邊界：累積門檻、紅包金額、總預算、中獎機率各自 2 位小數被擋（提示『最多 1 位小數』）、1 位小數可通過
description: 數值精度邊界：累積門檻、紅包金額、總預算、中獎機率各自 2 位小數被擋（提示『最多 1 位小數』）、1 位小數可通過
product: ba-admin
functional_area: REDPACKET
requirement_ids:
