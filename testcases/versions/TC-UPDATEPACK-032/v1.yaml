title: 注單查詢頁的查詢結果中，機台帳號的注單場次編號欄顯示其所屬場次編號
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-009
acceptance_criteria_ids:
- AC-UPDATEPACK-0092
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一台既有機台帳號，其至少有一筆注單記錄已知所屬的場次編號（可先於『各式報表 > 交易紀錄查詢』或機台交易紀錄核對該筆交易所屬場次編號，作為比對基準）
test_data: []
steps:
- n: 1
  action: 進入『各式報表 > 注單查詢』，篩選出該機台帳號的注單記錄，查詢
- n: 2
  action: 檢視該筆注單列的『場次編號』欄位，與前置作業核對的場次編號比對
expected_result: 機台帳號的注單場次編號欄顯示該筆注單實際所屬的場次編號，且與前置作業由交易紀錄查詢核對的場次編號一致
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §五、交易紀錄的兩項欄位規則
  quote: 與線上會員共用的頁面（交易紀錄查詢、注單查詢）的「場次編號」欄位，線上帳號的資料一律顯示「—」，不留空白、不顯示 0 或 null。機台帳號顯示該筆交易所屬的場次編號
