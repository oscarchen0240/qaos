title: 機台開啟紅包時沒有進行中的場次（分數歸零結束後才領取）：紅包入帳即建立新場次，期初餘額為當下分數 0，入帳歸屬該新場次
description: 機台開啟紅包時沒有進行中的場次（分數歸零結束後才領取）：紅包入帳即建立新場次，期初餘額為當下分數 0，入帳歸屬該新場次
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-025
acceptance_criteria_ids:
- AC-REDPACKET-0255
