spec_version: '0.2'
test_level: integration
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分與洗分；機台端洗分門檻為已知的正值或 0（機台端設定，後台無此設定）
- 機台帳號 M1（自行從環境中選定，本週期無注單）
- 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
test_data:
- name: 活動
  value: 門檻 10／上限 1／固定 30／稽核 0；每日重置
- name: 開分
  value: '10'
steps:
- n: 1
  action: 建立機台場館紅包活動『RP-NOSESSION』（永久）：每日重置；預設規則門檻 10／上限 1／固定 30／稽核 0；儲存
  expected: 建立成功
- n: 2
  action: 店員對 M1 開分 10（開始場次 S1）；M1 以小額連續下注（每局有效投注累計達 10 以上）直到分數歸 0（視遊戲結果可能需多局；若中途贏分，繼續下注直到歸零）
  expected: S1 因分數歸零結束；紅包明細有 M1 恰 1 筆待開啟紅包 P1（上限 1，歸零結束不作廢）
- n: 3
  action: 確認 M1 分數為 0 且沒有進行中的場次（『各式報表 > 場館日結報表』依場次明細：S1 狀態為已結束、沒有進行中場次）
  expected: 分數 0、無進行中場次
- n: 4
  action: M1 依領取流程領取 P1
  expected: M1 分數 +30（從 0 變 30）
- n: 5
  action: 至『各式報表 > 場館日結報表』依場次明細檢視 M1 的場次列
  expected: 紅包入帳即建立新場次 S3（進行中）：期初餘額為 0（入帳時 M1 的分數），紅包金額 30 歸屬 S3；S1 的紅包金額為 0
- n: 6
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 機台開啟紅包時若無進行中的場次，紅包入帳即建立新場次，期初餘額為當下機台分數 0，紅包入帳歸屬該新場次（S1 的紅包金額為 0）。
