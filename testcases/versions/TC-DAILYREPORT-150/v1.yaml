preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
  AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
- 機台 A 為自行從環境中選定的既有機台帳號（會員編號），須在該管理員管轄範圍內的機台場館；需要第二台機台時另選一台不同的既有機台帳號
- 查詢條件（AC 範例：結算日期 2026-09-03～2026-09-10、按週；起日為週四、週一為 09-07，第一列為週四到週日的不完整週、第二列為週一到迄日）。機台 A 的收據資料：收據 Ra，出收據日 e1 落在第一個週列內（AC
  範例 09-04），面額 200，已作廢，且作廢發生的日期落在第二個週列的期間內（AC 範例 09-08）；收據 Rb，出收據日 e2 落在第二個週列內（AC 範例 09-09），面額 500，已核銷（核實），且核實發生的日期晚於查詢範圍迄日（AC
  範例 09-12）；A 在查詢範圍內沒有其他已作廢或已核銷的收據
- （資料設計目的）作廢日與核實日刻意落在與收據日不同的週列或範圍外：若系統錯誤地依作廢日或核實日歸屬，Ra 的 200 會出現在第二列、Rb 的 500 會因核實日在範圍外而不出現，結果與預期可區分。這個目的是我的設計，不是 spec 規則
test_data:
- name: Ra
  value: 出收據日 09-04、面額 200、已作廢（作廢日 09-08）
- name: Rb
  value: 出收據日 09-09、面額 500、已核銷（核實日 09-12，範圍外）
- name: 預期（第一列／第二列）
  value: 已作廢 200／0；已兌現 0／500
steps:
- n: 1
  action: 統計維度選「依機台明細」、統計週期選「按週」、機台帳號填機台 A、結算日期選前述範圍，搜尋
- n: 2
  action: 記錄兩個週列（第一列、第二列）各自的「已兌現金額」與「已作廢金額」
expected_result: 第一列（含 e1）：已作廢金額 200、已兌現金額 0；第二列（含 e2）：已兌現金額 500、已作廢金額 0。（依收據日歸屬，作廢日、核實日不影響歸屬；狀態為查詢當下的狀態。）
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.3'
  location: §列表欄位附註／統計週期（第 70 行）
  quote: 「已兌現」「未兌現」「已作廢」三欄同為該週期內各營業日的合計（依收據日歸屬），狀態一律以查詢當下為準
