title: 操作員嘗試查詢自身所屬場館以外的場館日結報表，查無資料或無法選取
preconditions:
- 以根站台 admin 的管理員登入後台（用於準備操作員帳號；v0.1 稱 Admin）
- 承上，操作員帳號所屬場館為既有機台場館 X
- 以該操作員帳號登入後台
steps:
- n: 1
  action: 於『各式報表 > 場館日結報表』頁面，嘗試尋找或選取場館 X 以外的另一個機台場館 Y
- n: 2
  action: 若介面允許直接查詢，嘗試以場館 Y 為條件查詢；若介面本身無場館選擇欄位，確認結果是否仍侷限於場館 X
expected_result: 操作員無法查得或選取場館 X 以外（例如場館 Y）的任何場館日結報表資料——場館選擇欄位（若存在）不包含場館 Y，或選取後查無資料，僅能查得場館 X 範圍內的資料
