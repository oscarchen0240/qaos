title: 操作員嘗試查詢自身所屬場館以外的場館日結報表，查無資料或無法選取
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-013
acceptance_criteria_ids:
- AC-PLATFORMRULE-0131
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
- security
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 承上，操作員帳號所屬場館為既有機台場館 X
- 以該操作員帳號登入後台
test_data: []
steps:
- n: 1
  action: 於『各式報表 > 場館日結報表』頁面，嘗試尋找或選取場館 X 以外的另一個機台場館 Y
- n: 2
  action: 若介面允許直接查詢，嘗試以場館 Y 為條件查詢；若介面本身無場館選擇欄位，確認結果是否仍侷限於場館 X
expected_result: 操作員無法查得或選取場館 X 以外（例如場館 Y）的任何場館日結報表資料——場館選擇欄位（若存在）不包含場館 Y，或選取後查無資料，僅能查得場館 X 範圍內的資料
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §角色與權限
  quote: 可見場館範圍 | 全部場館 | 自身站台及所有子站台下的場館 | 僅自身所屬場館
assumptions:
- text: 本 TC 需要測試環境當下存在至少兩個不同的既有機台場館（操作員所屬場館 X 之外，另需一個場館 Y 作為『其他場館』對照）；若環境當下僅有一個機台場館，需先依既有機台場館的建立方式另外建立一個測試用機台場館 Y 才能執行本 TC
    的對照比較
  requirement_id: REQ-PLATFORMRULE-013
  needs_human_confirmation: false
  resolved_by_approval: APR-0125
