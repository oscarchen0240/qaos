title: 即使交易曾被機台重複回報完成，重送次數欄仍固定顯示「—」，不會顯示實際重複次數；分數本身仍只異動一次
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-025
acceptance_criteria_ids:
- AC-TXLOG-0251
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 安排一筆交易，並透過測試環境的方式使機台對同一筆交易編號重複送出一次完成回報（重複回報的模擬機制屬測試工具/環境能力，spec 未定義 QA 應如何觸發，需仰賴既有重複回報冪等處理機制，見 §相關業務規則）
- n: 2
  action: 檢視該筆交易的重送次數欄
- n: 3
  action: 透過會員詳細資料頁確認分數僅異動一次，未因重複回報而重複增減
expected_result: 重送次數欄仍固定顯示「—」，不顯示實際的重複次數 2；分數僅異動一次，未因重複回報而重複增減
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §相關業務規則
  quote: 機台重複回報同一筆交易時，分數只異動一次，不會重複加減（入金與出金以交易編號辨識）
assumptions:
- text: 驗證『重複回報』情境需要測試環境具備讓機台針對同一交易編號重複送出完成回報的能力（例如重播請求或測試工具模擬）；spec 未定義此測試手段，實際做法待環境負責人確認
  requirement_id: REQ-TXLOG-025
  needs_human_confirmation: true
