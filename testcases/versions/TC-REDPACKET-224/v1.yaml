preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
- 【環境前提，spec 未定義，需工程提供】可程式化地讓多筆注單『幾乎同時』結算（例如以腳本模擬遊戲商的注單結算通知，或同時操作多個前台工作階段各自結算）；結算通知的介面與格式 spec 未定義，由工程提供。每筆注單的有效流水貢獻須可指定（貢獻系數
  100% 的遊戲，有效投注額＝有效流水貢獻）
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計；每一輪開始時玩家 A 的累計都必須從 0 起算（每輪用全新的活動）
- 本案重複 3 輪。每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』
test_data:
- name: 活動
  value: 門檻 100／上限 2／固定 10／稽核 0／每日重置
- name: 起始累計
  value: 100 → 產生 1 個；再 90 → 累計 190
- name: 同時結算
  value: 玩家 A 5 筆各 100
- name: 輪數
  value: 3 輪
steps:
- n: 1
  action: 【每一輪】建立活動『RP-CAPC-n』（永久）：活動幣種 USDT；預設規則門檻 100／上限 2／固定 10／稽核 0；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 【每一輪】玩家 A 單獨結算有效流水貢獻 100，再單獨結算有效流水貢獻 90
  expected: 已產生 1 個紅包（週期累計 100）；累計 190（距下一個門檻 90），沒有第 2 個紅包
- n: 3
  action: 【每一輪】以腳本讓玩家 A 的 5 筆注單（每筆有效流水貢獻 100）『幾乎同時』結算
  expected: 請求送出
- n: 4
  action: 【每一輪】檢視紅包明細（篩選玩家 A）與紅包視窗
  expected: 紅包明細恰 2 筆（沒有第 3 筆）；第 2 筆的『週期累計』為 290（190＋100，產生達上限的那一個紅包時餘數 90 保留；其餘 4 筆不再計入）；紅包視窗『本期已獲得』顯示 2 ／ 2
- n: 5
  action: 【每一輪】玩家 A 再單獨結算有效流水貢獻 100，檢視紅包明細
  expected: 沒有新紅包（本週期產生數已達上限，停止累計直到重置）；紅包明細仍 2 筆
- n: 6
  action: 【每一輪】玩家 A 依領取流程領取 2 個紅包後開啟紅包視窗
  expected: 顯示『本期已達上限』
- n: 7
  action: 【每一輪結束】對該輪活動點『取消排程』並於確認視窗點『確認取消』，再進入下一輪
  expected: 已取消排程
expected_result: 單週期上限 2、已產生 1 個、距下一門檻 90 時，5 筆各 100 的注單同時結算：只再產生 1 個紅包（達上限，本期已獲得 2 ／ 2），第 2 個紅包的週期累計為 290，其餘注單不再計入；之後再結算也不產生紅包，全部領取後顯示『本期已達上限』。
