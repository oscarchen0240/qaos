title: 單週期上限邊界（上限 2、已產生 1）下同一帳號 5 筆注單同時結算：只再產生 1 個紅包（週期累計 290）、不超過上限，之後不再計入（重複 3 輪）
description: 單週期上限邊界（上限 2、已產生 1）下同一帳號 5 筆注單同時結算：只再產生 1 個紅包（週期累計 290）、不超過上限，之後不再計入（重複 3 輪）
