  action: 切換至該機台所屬站台，進入場館日結報表，統計維度選『依機台明細』
- n: 2
  action: 機台帳號欄位輸入選定機台的完整帳號，結算日期設定涵蓋當日或近期的區間並查詢
expected_result: 列表只包含輸入的該機台帳號一列資料，不出現同場館其他機台的資料列
