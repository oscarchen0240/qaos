title: 所有機台帳號適用預設規則；紅包以 TWD 入帳；機台視角交易紀錄含『紅包』類型（場次編號、交易狀態『已完成』、核實狀態『不適用』）
description: 所有機台帳號適用預設規則；紅包以 TWD 入帳；機台視角交易紀錄含『紅包』類型（場次編號、交易狀態『已完成』、核實狀態『不適用』）
