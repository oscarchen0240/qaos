preconditions:
- 一名會員的五個 KYC 階段（個人基本資訊/身分證明文件/身分證件自拍/居住地址/資產證明）分別處於不同狀態，至少涵蓋已核准/審核中/待補件/未申請/已停用其中三種以上——可透過後台對該測試帳號的各階段分別執行核准/駁回/停用操作、或部分階段保持未送審來佈置，或使用測試環境既有已涵蓋多種狀態的測試帳號
test_data: []
steps:
- n: 1
  action: 於會員列表檢視該會員的 KYC 狀態欄五個圖示顏色
- n: 2
  action: 滑鼠移至任一圖示
expected_result: 五個圖示顏色分別正確對應各自階段的實際狀態（綠=已核准/橘=審核中/紅=待補件/淺灰=未申請/深灰=已停用）；滑鼠移至圖示顯示 Tooltip 說明階段名稱與狀態
