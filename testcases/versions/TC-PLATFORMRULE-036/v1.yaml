title: 後台對機台帳號派發 Free Spin 後，免費旋轉直接到帳，不需玩家額外領取
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-003
acceptance_criteria_ids:
- AC-PLATFORMRULE-0032
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台帳號，記錄其目前的 Free Spin（免費旋轉）可用次數或狀態作為基準
test_data: []
steps:
- n: 1
  action: 於『系統管理 > Free Spin 管理』對該機台帳號派發一筆 Free Spin（設定次數與幣種後送出）
- n: 2
  action: 派發完成後，檢視該機台帳號目前的 Free Spin 狀態（可透過會員詳細資料頁或 Free Spin 管理的派發紀錄查看）
expected_result: 派發完成後，該機台帳號的免費旋轉可用次數立即增加（或呈現為已到帳狀態），不存在『待玩家領取』的中間狀態，不需要玩家或機台端另外操作才能取得
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §既有功能對機台帳號的排除規則 + §Free Spin 例外
  quote: 6.8 | Free Spin 管理 | 適用，同一般會員。可將機台帳號指定加入 Free Spin 活動；免費旋轉由後台直接派發、不需玩家領取，共用帳號收得到。幣種依主站台核心貨幣（機台場館即 TWD），見正本「核心貨幣」
assumptions: []
