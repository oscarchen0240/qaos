steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁與其於會員列表的操作選單
- n: 2
  action: 逐一檢視所有可用操作按鈕與選單項目
expected_result: 不存在任何「刪除機台」或「刪除帳號」的操作；機台狀態相關的可用操作僅有停用／啟用的切換
