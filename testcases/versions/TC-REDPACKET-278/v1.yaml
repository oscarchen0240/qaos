title: 無權限帳號與管轄範圍外的帳號以 API 呼叫紅包明細『匯出 CSV』：被後端拒絕『無權限』、不回傳資料
description: 無權限帳號與管轄範圍外的帳號以 API 呼叫紅包明細『匯出 CSV』：被後端拒絕『無權限』、不回傳資料
product: ba-admin
functional_area: REDPACKET
