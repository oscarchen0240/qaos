title: 線上與機台類型站台的列表與編輯畫面皆不存在任何刪除操作入口
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-022
acceptance_criteria_ids:
- AC-SITELIST-0221
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個既有的線上類型站台，檢視其於站台列表的可用操作按鈕，以及編輯畫面內的可用操作
- n: 2
  action: 取一個既有的機台類型站台，同樣檢視列表與編輯畫面的可用操作
expected_result: 兩種類型的站台，於列表與編輯畫面皆不存在任何可執行的刪除按鈕或入口；可用的操作僅限編輯與狀態切換（狀態切換選項依角色而定）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §操作/刪除站台（此節內容已由 CLR-SITELIST-009 確認為錯誤敘述）
  quote: 點擊列表「刪除」後顯示確認彈窗，列出站台名稱與代碼，二次確認後執行（＊此流程不存在於現行產品，見 CLR-SITELIST-009 PM 回覆）
