design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分與洗分；機台端洗分門檻為已知的正值或 0（機台端設定，後台無此設定）
- 機台帳號 M1（自行從環境中選定，本週期無注單）
- 【環境前提，需環境負責人確認】機台場館出金設定（後台『鏈上錢包管理』法幣 TWD 頁籤）的稽核倍數為 0（機台預設）；機台端洗分門檻設為 0（洗出全部餘額，SPEC-ARCADE-001：門檻 0 表示洗出當前全部餘額），使『核可金額＝餘額』可作為不扣除時的對照基準
- 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
test_data:
- name: Run A（對照）
  value: 紅包稽核倍數 0；門檻 100／固定 30
- name: Run B
  value: 紅包稽核倍數 1；門檻 100／固定 30
steps:
- n: 1
  action: 【Run A 對照】建立機台場館紅包活動『RP-AUD0』（永久）：每日重置；預設規則門檻 100／上限 5／固定 30／稽核倍數 0；儲存；M1 結算有效流水貢獻 100 並領取該紅包；記下 M1 分數 BA
  expected: M1 分數 BA 含紅包 30；稽核明細的紅包紀錄所需有效投注額增加 0（稽核倍數 0）
- n: 2
  action: 店員對 M1 以『全洗』洗分（機台端門檻 0）
  expected: 核可金額＝BA（全部餘額；沒有未完成稽核可扣除）
- n: 3
  action: 取消排程 RP-AUD0。【Run B】建立活動『RP-AUD1』（永久）：預設規則門檻 100／上限 5／固定 30／稽核倍數 1；儲存時出現機台稽核警告，確認後儲存
  expected: 建立成功
- n: 4
  action: 店員對 M1 開分，使 M1 分數大於 0（例如 100）；M1 結算有效流水貢獻 100 並領取該紅包；記下 M1 分數 BB；至稽核明細檢視紅包稽核
  expected: M1 分數 BB 含紅包 30；紅包稽核所需有效投注額增加 30，領取後尚未下注打滿（未完成稽核）
- n: 5
  action: 不再下注；店員對 M1 以『全洗』洗分（機台端門檻 0）；記下機台畫面顯示的核可金額 PB 與洗分後 M1 剩餘分數 R
  expected: 核可金額 PB 小於 BB（出金設定稽核倍數為 0 仍先扣除未完成稽核的部分，不因出金設定為 0 倍而略過）
- n: 6
  action: 【僅記錄，不判定】記錄 PB、R、BB 的數值；並記錄洗分後場次的處理（是否結束、餘數是否承接）
  expected: CLR-REDPACKET-056 尚未回答：扣除的金額如何計算、洗分後被扣除部分的處理未定義，只記錄
- n: 7
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 出金設定稽核倍數為 0 時，紅包稽核倍數 0 的洗分核可金額等於全部餘額（不扣除）；紅包稽核倍數 1 且稽核未完成時，洗分核可金額小於洗分前餘額（仍先扣除未完成稽核的部分，不因出金設定為 0 倍而略過）；扣除的確切金額與洗分後處理只記錄。
