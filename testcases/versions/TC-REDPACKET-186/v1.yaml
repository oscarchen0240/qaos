title: 機台出金設定稽核倍數為 0、紅包稽核倍數大於 0 且稽核未完成：洗分仍須先扣除未完成稽核的部分（對照紅包稽核倍數 0 時不扣除）；扣除的金額只記錄
description: 機台出金設定稽核倍數為 0、紅包稽核倍數大於 0 且稽核未完成：洗分仍須先扣除未完成稽核的部分（對照紅包稽核倍數 0 時不扣除）；扣除的金額只記錄
product: ba-admin
functional_area: REDPACKET
requirement_ids:
