title: 機台開分或入金交易完成後，稽核明細頁面正常出現並標示正確交易類型
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-002
acceptance_criteria_ids:
- AC-PLATFORMRULE-0021
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- scenario
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台切換下拉選單切換至一個既有的機台場館站台
- 選定一個既有的機台帳號，記錄一筆該帳號近期已完成的機台開分或機台入金交易的時間與金額（可先於『各式報表 > 交易紀錄查詢』核對是否已有現成記錄）
test_data: []
steps:
- n: 1
  action: 進入『各式報表 > 稽核明細』頁面，以該機台帳號與對應時間區間查詢
- n: 2
  action: 檢視查詢結果中該筆交易的『交易類型』欄位標示
expected_result: 該筆機台開分或機台入金交易正常出現在稽核明細頁面查詢結果中；交易類型欄位標示為「機台開分」或「機台入金」（依實際操作類型而定），不是顯示為其他既有線上交易類型、也不是空白
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §既有功能對機台帳號的排除規則
  quote: 4.4 | 稽核明細 | 照常寫入。開分與入金比照既有的出金設定，可依幣種設定稽核倍數，機台預設為 0 倍（等同不設稽核門檻）；詳見下方「出金設定 TWD 頁籤」與正本「機台帳號的稽核」
assumptions:
- text: 機台開分／入金交易本身是玩家在機台端實際遊玩產生的紀錄，非後台 UI 可直接建立的動作；本 TC 假設測試環境當下已存在或可查得該機台帳號至少一筆已完成的開分或入金交易供查驗，若環境當下查無現成記錄，需洽環境負責人透過機台模擬工具產生，此步驟超出本
    spec 定義範圍
  requirement_id: REQ-PLATFORMRULE-002
