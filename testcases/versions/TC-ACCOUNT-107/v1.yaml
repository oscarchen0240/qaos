preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
- 將站台切換選單切換至一個既有的機台場館（自行從環境中選定；依§前置相依，站台列表已先完成「站台類型」與主站台「核心貨幣」欄位設定）
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，建立一個機台帳號並記下建立成功畫面顯示的登入帳號與密碼
- n: 2
  action: 於前台以該組帳密登入
expected_result: 可正常登入前台（即機台本身的前台遊戲畫面所使用的登入方式）；「由現場人員設定機台時輸入」「不交付玩家」屬管理流程規範，非系統可驗證的行為，本案例僅驗證系統層級「帳密可用於登入」此一事實
