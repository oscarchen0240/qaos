title: 取消屬於已重置的上一週期的注單：不扣本週期累計、上一週期已產生的紅包不受影響（跨 UTC+0 00:00）
description: 取消屬於已重置的上一週期的注單：不扣本週期累計、上一週期已產生的紅包不受影響（跨 UTC+0 00:00）
