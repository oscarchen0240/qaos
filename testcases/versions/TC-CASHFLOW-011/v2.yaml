title: 即使 req-cashin 已成功建立 PENDING，end-cashin 時全場館餘額已達額度上限，仍會被擋下並退鈔
requirement_ids:
- REQ-CASHFLOW-009
acceptance_criteria_ids:
- AC-CASHFLOW-0091
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
steps:
- n: 1
  action: req-cashin 已送出並成功建立 PENDING、取得 TXID（本階段未判定額度、未預留）
- n: 2
  action: 在收到 end-cashin 前，令全場館餘額合計因其他交易已達到額度上限
- n: 3
  action: 機台送出 end-cashin，TXID 相符，帶入實際清點金額
expected_result: 平台於 end-cashin 判定額度上限：因加計後將超過上限，回 1-OVER LIMIT，不更新帳務、不關閉 PENDING 為已完成（純 API 環境以回覆碼與帳務未異動為判定依據，實體機台另確認退鈔）——與
  req-cashin 階段是否已建立 PENDING 無關，該 PENDING 本身不代表額度已通過。與 TC-CASHFLOW-009（併發序列化下的超限拒絕）的差異：本案驗證的是單一交易在單純狀態前置下的超限拒絕，非併發序列化
