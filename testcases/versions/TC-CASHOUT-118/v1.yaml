title: 操作員登入後台時，前端不提供切換至其他場館的入口，僅能對自身場館紀錄執行核實
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-025
acceptance_criteria_ids:
- AC-CASHOUT-0251
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- security
- negative
design_techniques:
- security_rule
priority: high
risk: high
execution_mode: manual
preconditions:
- 以一個既有的『操作員』角色帳號登入後台（自行從環境中選定）
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 以操作員身分登入後台，檢視頁面標題下方的站台切換選單
- n: 2
  action: 確認選單是否提供切換至其他場館的選項
- n: 3
  action: 對該操作員自身所屬場館的一筆待核實紀錄嘗試執行核實
expected_result: 站台切換選單不提供切換至其他場館的入口（前端已限制，操作員僅能停留在自身所屬場館）；對自身場館的紀錄可正常完成核實
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作
  quote: 權限 | Admin、站長、操作員皆可執行（操作員限自身場館）
assumptions:
- text: 『操作員』角色的權限範圍（含是否限定單一場館）定義於開發包⑥ PLATFORMRULE，該包尚未完成 Phase 3 測試設計；本 TC 引用的規則文字取自 SPEC-CASHOUT-001 本身（非本 TC 自行推測），但目前測試環境中是否已存在一個確實依此規則設定好場館範圍的操作員帳號、以及後端是否已如文字所述拒絕跨場館請求，尚未獨立確認，需環境/PLATFORMRULE負責人協助確認後才能視為可重複執行的既定案例
  requirement_id: REQ-CASHOUT-025
  needs_human_confirmation: true
