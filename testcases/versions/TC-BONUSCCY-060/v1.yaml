title: 人工存款依後台填寫的稽核倍數正常計入稽核流水（提領所需有效投注額隨倍數增加）
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-010
acceptance_criteria_ids:
- AC-BONUSCCY-014
spec_id: SPEC-BONUSCCY-002
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一名既有會員，記錄其存款前的『提領所需有效投注額（流水錢包）』數值
- 人工存入操作方式依 SPEC-MEMBER-001 v0.2 §2.1.5：會員詳細資料頁帳務資訊區塊的『人工存入』按鈕，右側滑出面板填寫金額／稽核倍數／前台備注／後台備注後點擊『儲存』
test_data:
- name: 存入金額（第一筆／第二筆）
  value: 100
- name: 稽核倍數（第一筆）
  value: 1
- name: 稽核倍數（第二筆）
  value: 3
steps:
- n: 1
  action: 於該會員詳細資料頁記錄目前的『提領所需有效投注額（流水錢包）』數值作為基準值
- n: 2
  action: 使用『人工存入』功能，填入金額 100，稽核倍數設為 1，點擊儲存；重新查看『提領所需有效投注額（流水錢包）』，記錄第一次的增量 Δ1
- n: 3
  action: 對同一會員再次使用『人工存入』功能，同樣填入金額 100，這次稽核倍數設為 3，點擊儲存；重新查看『提領所需有效投注額（流水錢包）』，記錄第二次的增量 Δ2
expected_result: 兩筆人工存款都有依稽核倍數計入稽核流水：Δ1、Δ2 皆大於 0（沒有因為是人工存款就被排除在稽核流水之外）；且在存入金額相同的情況下，稽核倍數較高的第二筆存款，其『提領所需有效投注額』增量 Δ2 明顯大於稽核倍數為
  1 的第一筆存款增量 Δ1，驗證系統確實依後台當次填寫的稽核倍數計入，而非固定倍數或忽略此設定
expected_result_spec_reference:
  spec_id: SPEC-BONUSCCY-002
  spec_version: '1.0'
  location: §人工存款
  quote: 稽核流水（打碼量）✅有，依後台填的稽核倍數
assumptions: []
