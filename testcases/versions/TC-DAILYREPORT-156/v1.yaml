preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 三種統計維度下，各自選一段有資料的查詢條件使列表至少有 1 列結果（資料內容不拘，本案只看欄位標題的順序）
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」，搜尋；由左至右記錄列表上的全部欄位標題
- n: 2
  action: 統計維度改選「依機台明細」，搜尋；由左至右記錄全部欄位標題
- n: 3
  action: 統計維度改選「依場次明細」，搜尋；由左至右記錄全部欄位標題
- n: 4
  action: 統計維度回到「依場館彙總」，搜尋後點擊頁面右上角「匯出 CSV」，開啟檔案，由左至右記錄第一列的欄位標題
expected_result: 三種統計維度的畫面欄位標題皆依序包含相鄰的「未兌現金額」→「已作廢金額」→「現金淨收」→「注單數」→「有效投注額」：已作廢金額在未兌現金額之後、現金淨收之前；注單數在現金淨收與有效投注額之間。CSV 的欄位標題中，「現金淨收」「注單數」「有效投注額」的相對順序與畫面一致。（CSV
  內「已作廢金額」的位置 spec 未明寫，只記錄、不作判準。）
