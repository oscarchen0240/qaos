title: 未兌現金額總計隨結算日期範圍變動：只涵蓋 D2 日時只含 D2 那張，涵蓋 D1～D2 日時含兩張
description: 驗證要看全部未兌現須使結算日期涵蓋最早一張未兌現收據（AC-CASHOUT-0323）
requirement_ids:
- REQ-CASHOUT-032
acceptance_criteria_ids:
- AC-CASHOUT-0323
test_types:
- functional
- negative
design_techniques:
- requirement_based
preconditions:
- 以管理員、站長或操作員登入後台皆可（本案只查詢，不核實也不作廢）；頁面標題下方的站台切換下拉選單切到本案機台場館所屬站台
- 選定兩筆測試站台、測試機台帳號產生的『待核實』出金紀錄 R1、R2（自行從環境中選定），交易時間（UTC+0）日期分別為 D1 與 D2 且 D1 早於 D2（不同日），兩筆交易時間離 UTC+0 00:00 至少 2 小時，且面額不為 0。【環境前提，spec
  未定義佈置方式，需環境負責人確認】若環境沒有符合的兩筆，需在機台端（前台）於不同日曆日（UTC+0）各執行一筆出金並保持待核實；後台不能直接建立指定日期的出金紀錄。
- 【環境前提，spec 與派發包均未定義，需環境負責人確認】場館日結報表的後台選單路徑、日期切分基準（是否與洗分出金核實頁的 UTC+0 交易時間一致）、以及核實／作廢後報表金額的更新時機（即時或排程）。本案以『報表列的日期＝該筆在洗分出金核實頁的交易時間日期（UTC+0）』為比對基準；若發現報表日期切分與
  UTC+0 不一致，或報表未即時反映，請記錄實際現象與等待時間，不要直接判定 PASS／FAIL。為降低日期切分歧義，選用交易時間離 UTC+0 00:00 至少 2 小時的紀錄。
- 環境中可能另有其他日期的待核實出金，本案以洗分出金核實頁待核實出金面額的按日期加總作為報表總計的對照基準，不假設其他日期為 0；測試期間不要核實或作廢該站台的任何出金，也不要新增出收據，避免基準變動
test_data:
- name: D1（較早）、D2（較晚）
  value: 兩個不同日期（UTC+0），由環境選定並記錄；R1 在 D1、R2 在 D2
- name: 對照基準
  value: 洗分出金核實頁各日期『待核實、機台出金』面額加總
steps:
- n: 1
  action: 到後台『帳務管理 > 洗分出金核實』，以『交易類型＝機台出金』『核實狀態＝待核實』篩選，『交易時間』範圍設為 D1 日至 D2 日；記下 R1（日期 D1、面額 F1）、R2（日期 D2、面額 F2），並依日期算出：S_D2
    ＝ D2 日全部待核實出金面額加總（含 R2）、S_D1D2 ＝ D1 日至 D2 日全部待核實出金面額加總（含 R1、R2）
  expected: 取得 F1、F2、S_D2、S_D1D2；S_D1D2 ≥ S_D2 + F1
- n: 2
  action: 開啟場館日結報表（選單路徑見前提），同一站台，結算日期只設 D2 日（起訖皆為 D2），查詢並讀取『未兌現金額』總計 T2
  expected: T2 = S_D2：包含 R2 的面額 F2，不包含 R1 的面額 F1（T2 ≠ S_D1D2）
- n: 3
  action: 同一站台，結算日期改為 D1 日至 D2 日，查詢並讀取『未兌現金額』總計 T12
  expected: T12 = S_D1D2：同時包含 R1 與 R2 的面額；T12 比 T2 多出的部分包含 F1
expected_result: D1 日與 D2 日（D1 早於 D2）各有一張未兌現收據時：結算日期只涵蓋 D2 日，未兌現金額總計只含 D2 那張；結算日期涵蓋 D1～D2 日，總計包含兩張。
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.2'
  location: §操作（備註）（第 110 行）
  quote: 查詢範圍內的總計即代表場館端尚未付出的負債（要看全部未兌現，結算日期須涵蓋最早一張未兌現收據）
