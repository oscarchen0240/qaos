priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data:
- name: site_code_lowercase
  value: ab
- name: site_code_mixed
  value: a1b2
steps:
- n: 1
  action: 點擊「+ 新增站台」，站台代碼欄位輸入小寫字母（如 ab）
- n: 2
  action: 另開一次，站台代碼欄位輸入包含數字或符號的字串（如 a1b2 或 a!b）
expected_result: 第一步：欄位值自動轉為大寫（AB）；第二步：非英文字元被過濾，不計入代碼（僅保留英文字母部分）
