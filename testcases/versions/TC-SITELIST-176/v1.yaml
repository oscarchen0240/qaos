title: 站台代碼輸入小寫或含非英文字元時自動轉大寫並過濾非英文字元
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-020
acceptance_criteria_ids:
- AC-SITELIST-0201
- AC-SITELIST-0202
