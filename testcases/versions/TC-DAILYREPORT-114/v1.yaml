priority: medium
risk: high
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下有任一營業日有資料，使三種統計維度都能查出至少一列
test_data: []
steps:
- n: 1
  action: 統計週期選「按日」、結算日期選一個有資料的營業日，統計維度選「依場館彙總」，搜尋；由左至右記錄欄位標題順序
- n: 2
  action: 統計維度改選「依機台明細」，搜尋；由左至右記錄欄位標題順序
- n: 3
  action: 統計維度改選「依場次明細」，搜尋；由左至右記錄欄位標題順序
expected_result: 三種統計維度下，「期初餘額」欄都在「期末餘額」欄的緊鄰前一欄（左側相鄰）。
