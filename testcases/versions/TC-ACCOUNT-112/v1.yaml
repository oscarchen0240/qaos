- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，建立或確認至少一個既有機台帳號存在（一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個））
- n: 2
  action: 開啟會員列表，帳號類型篩選維持「全部」，記錄列表總筆數
- n: 3
  action: 確認該機台帳號出現在列表中
expected_result: 會員列表總筆數包含線上與機台帳號，機台帳號未被排除，且可於列表中找到該機台帳號
