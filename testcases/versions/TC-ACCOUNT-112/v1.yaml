title: 不篩選帳號類型時機台帳號照常列於會員列表且計入總筆數
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-028
acceptance_criteria_ids:
- AC-ACCOUNT-0281
