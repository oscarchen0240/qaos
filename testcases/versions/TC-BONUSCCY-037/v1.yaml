title: 新增一名機台站台會員後，該站台會員列表查詢筆數應同步增加，不因JOIN條件排除
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-002
acceptance_criteria_ids:
- AC-BONUSCCY-003
spec_id: SPEC-BONUSCCY-001
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台切換選單切換至一個既有的機台（TWD核心貨幣）站台
test_data: []
steps:
- n: 1
  action: 進入 會員與加盟商 > 會員列表，不加篩選查詢，記錄目前總筆數（N）
- n: 2
  action: 點擊「創建會員帳號」，帳號類型選「機台」，建立一個新的機台帳號
- n: 3
  action: 重新查詢會員列表（不加篩選），記錄新的總筆數（N'）並確認新建立的帳號出現在列表中
expected_result: N' 應等於 N+1，且新建立的機台帳號出現在查詢結果中，會員列表未因JOIN條件比對寫死USDT常數而遺漏該筆機台站台會員
expected_result_spec_reference:
