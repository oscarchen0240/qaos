priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下選定一段連續 23 個營業日的結算日期區間（記為 R23，例如 2026-09-01～2026-09-23），區間內每個營業日皆有交易資料，使「依場館彙總＋按日」時每個營業日一列、共 23 列（3 頁：10＋10＋3）；不選含完全無資料營業日的區間——無資料時各欄顯示
  0 與 v0.2 餘額規則（含當期無場次但仍有留存分數者）的關係尚未釐清（RM REQ-DAILYREPORT-016 ambiguity）
- R23 內各營業日的開分金額，在全部 23 列中排名第 10 與第 11 的兩列數值不相同（避免排序鍵值相同時次排序未定義〔RM REQ-022 ambiguity minor〕干擾頁面邊界的判讀）
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、結算日期選 R23，搜尋；逐頁（第 1、2、3 頁）記錄全部 23 列的開分金額，由大到小排出名次 K1～K23，確認 K10 ≠ K11
- n: 2
  action: 點「開分金額」標題兩次，使其為遞減（▼）；確認列表回到第 1 頁
- n: 3
  action: 記錄第 1 頁 10 列的開分金額
- n: 4
  action: 切到第 2 頁，記錄 10 列的開分金額，並記錄分頁列顯示的區間
- n: 5
  action: 切到第 3 頁，記錄 3 列的開分金額
expected_result: 第 1 頁 10 列的開分金額依序為 K1～K10（全部 23 列中最大的 10 列、遞減）；第 2 頁為 K11～K20（第 11–20 筆）；第 3 頁為 K21～K23。頁面邊界（K10→K11）沒有重複、遺漏或跳動。
