title: 核實面額 399.60 的出金：確認彈窗顯示金額 399.60，核實過程不要求、不顯示現場實付金額或差額
description: 驗證出金核實一律以面額計，彈窗顯示含小數面額，核實流程不要求也不呈現實付與差額（AC-CASHOUT-0222）
