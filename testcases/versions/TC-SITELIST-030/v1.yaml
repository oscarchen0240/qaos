  action: 取一個狀態為暫停的站台，重複上述操作，確認狀態
- n: 3
  action: 取一個狀態為關閉的站台，重複上述操作，確認狀態
expected_result: 三種狀態皆不因網域異動而改變（不會變為更新待審）
