test_data:
- name: 結算日期區間
  value: 刻意設定超過一年（例如 400 天以上）的起訖日期
steps:
- n: 1
  action: 進入場館日結報表，結算日期選擇一個起訖相差超過一年（例如 400 天以上）的區間
- n: 2
  action: 統計週期任選一種（如按日或按月），點擊查詢
expected_result: 系統正常接受查詢並回傳資料（或合理的無資料結果），不因區間長度而彈出錯誤訊息或拒絕查詢；不因『不設區間上限』而對長區間查詢加上未公開的隱性限制
