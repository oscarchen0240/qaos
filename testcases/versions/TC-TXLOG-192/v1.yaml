title: 出金交易長期停留待確認狀態不會被自動收斂為已逾時，只會透過機台補回報、新出金取代、人工出金連動取消或轉介核實頁處理
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-017
acceptance_criteria_ids:
- AC-TXLOG-0171
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 安排一筆出金交易並確保其停留在待確認狀態，機台未補送完成回報
- n: 2
  action: 在未觸發任何收斂動作（機台回報、新出金取代、人工出金連動取消、核實頁人工處理）的情況下持續查詢該筆交易
- n: 3
  action: 另行確認：交易狀態篩選器中「已逾時」這個值僅存在於開分/入鈔分組（依 REQ-TXLOG-009），出鈔/洗分分組本身不含此技術值
expected_result: 該筆出金交易在未觸發任何收斂動作前持續維持待確認狀態，不會自動轉為已逾時或任何其他狀態；出鈔/洗分分組的技術值集合本身即不包含已逾時，結構上保證了此差異
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §交易狀態 + §相關業務規則
  quote: 出金不設逾時，待確認會一直保留，直到機台補完回報、被新的出金取代、櫃檯人工出金連動取消，或轉介至「洗分出金核實」頁人工處理（原文「或由 Admin 手動取消為止」已由 Oscar 2026-09-14 確認為錯誤敘述，見 REQ-TXLOG-028）
