title: 出金紀錄被作廢後分數不退回機台，且無法復原
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-030
acceptance_criteria_ids:
- AC-CASHOUT-0301
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 帳務管理 > 洗分出金核實，站台切換選單已選定一個機台場館站台
test_data: []
steps:
- n: 1
  action: 使用測試站台專用、金額最小化、且已排除出正式日結報表統計的一筆待核實出金紀錄，記錄其對應機台帳號當下的分數
- n: 2
  action: 對該筆執行作廢（不可逆操作，執行前先確認此為測試資料）
- n: 3
  action: 再次檢視該機台帳號的分數，並嘗試尋找復原作廢的操作
expected_result: 分數不會退回機台帳號（維持作廢前的餘額，不因作廢而增加）；系統不提供復原作廢的功能
