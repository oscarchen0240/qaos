preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館已設定日結時間 06:00 UTC+0
- 測試場館下有機台 A、B（會員編號已知），並依各案例準備交易資料
- 結算日期預設為單一營業日 2026-09-05（起迄相同）；需要多日的案例於步驟中另設
- 該場館無其他未兌現收據
test_data: []
steps:
- n: 1
  action: 準備未兌現收據：09-05 300、09-03 200（皆在結算日期 09-01～09-07 範圍內）
- n: 2
  action: 結算日期 09-01～09-07，分別以按日（看 09-05 列）與按週搜尋
expected_result: 按日的 09-05 列與按週的該週列，未兌現金額皆為 500（不受統計週期切分影響）
