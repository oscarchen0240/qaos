title: 作廢出收據兩日前的待核實出金：面額計入出收據那天（D 日）的已作廢金額，作廢那天（D+2 日）不計
description: 驗證作廢收據的『已作廢金額』記在出收據那天而非作廢那天，且 D 日未兌現金額不再包含該筆（AC-CASHOUT-0321）
