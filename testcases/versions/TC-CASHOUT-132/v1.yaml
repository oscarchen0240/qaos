design_techniques:
- requirement_based
preconditions:
- 以站長或管理員登入後台（作廢僅管理員與站長可執行，操作員不能）；頁面標題下方的站台切換下拉選單切到本案機台場館所屬站台
- 選定一筆測試站台、測試機台帳號產生的『待核實』出金紀錄 R（自行從環境中選定，在洗分出金核實頁以『交易類型＝機台出金』『核實狀態＝待核實』篩選）：其交易時間（UTC+0）的日期 D 比今天（UTC+0）早 2 日，使『作廢當天』為 D+2
  日；交易時間離 UTC+0 00:00 至少 2 小時。【環境前提，spec 未定義佈置方式，需環境負責人確認】若環境中沒有這樣的紀錄，需要在機台端（前台）先對測試機台帳號執行一筆出金，等到 2 個日曆日（UTC+0）之後再執行本案；後台不能直接建立指定日期的出金紀錄。作廢相差
  2 日是為了對應 AC 的 D／D+2 例子。
- 【環境前提，spec 與派發包均未定義，需環境負責人確認】場館日結報表的後台選單路徑、日期切分基準（是否與洗分出金核實頁的 UTC+0 交易時間一致）、以及核實／作廢後報表金額的更新時機（即時或排程）。本案以『報表列的日期＝該筆在洗分出金核實頁的交易時間日期（UTC+0）』為比對基準；若發現報表日期切分與
  UTC+0 不一致，或報表未即時反映，請記錄實際現象與等待時間，不要直接判定 PASS／FAIL。為降低日期切分歧義，選用交易時間離 UTC+0 00:00 至少 2 小時的紀錄。
- 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行。
- 測試期間不要對同一站台執行其他作廢或核實，也不要在該站台對 D 日、D+2 日產生新的出收據，避免干擾報表列的前後差值
- 本案會對 R 執行不可撤銷的作廢，R 不得與其他 TC 共用；其他 REQ-CASHOUT-032 案例需另行選用不同的紀錄，且不要與它們在同一時段並行
test_data:
- name: 出收據日期 D
  value: 今天（UTC+0）往前 2 日，由環境選定並記錄
- name: 作廢日期
  value: D+2（即今天，UTC+0）
- name: 作廢原因
  value: 測試作廢：收據遺失（作廢原因必填）
steps:
- n: 1
  action: 到後台『帳務管理 > 洗分出金核實』，以『交易類型＝機台出金』『核實狀態＝待核實』篩選，選定符合前提的紀錄 R，記下訂單編號、面額 F、交易時間（UTC+0）及其日期 D
  expected: 取得 R 的訂單編號、F、D；R 目前為待核實
- n: 2
  action: 開啟場館日結報表（選單路徑見前提，需環境負責人提供），同一站台，結算日期範圍設為 D 日至 D+2 日；記下 D 日列的『未兌現金額』U_D0 與『已作廢金額』V_D0，以及 D+2 日列的『已作廢金額』V_D2_0
  expected: 取得三個基準值；U_D0 包含 R 的面額 F（可與洗分出金核實頁 D 日全部待核實出金面額加總交叉確認）
- n: 3
  action: 回洗分出金核實頁，對 R 點擊『作廢』，填寫作廢原因『測試作廢：收據遺失』，確認（不可撤銷）
  expected: R 標記為『已作廢』
- n: 4
  action: 回到場館日結報表，以同一站台、同一結算日期範圍（D 日至 D+2 日）重新查詢（若報表未即時反映，記錄實際更新方式與等待時間後再讀取）
  expected: D 日列『已作廢金額』= V_D0 + F；D+2 日列『已作廢金額』= V_D2_0（不含 R）；D 日列『未兌現金額』= U_D0 − F（不再包含 R）
expected_result: 待核實出金 R 於 D+2 日作廢後，其面額 F 計入場館日結報表 D 日（出收據那天）列的『已作廢金額』，不計入 D+2 日（作廢那天）列的『已作廢金額』；D 日列的『未兌現金額』不再包含 R。
