preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 於測試機台完成一筆機台出金（收據印出，或於機台交易紀錄確認一筆出金交易狀態已為『已完成』）
- n: 2
  action: 進入本頁，檢視是否出現對應該筆交易的紀錄
expected_result: 本頁自動出現一筆待核實紀錄，其交易編號對應剛完成的出金交易
