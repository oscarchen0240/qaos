title: 站長對待核實出金執行作廢，填寫作廢原因後系統接受並標記為已作廢
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-028
acceptance_criteria_ids:
- AC-CASHOUT-0281
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以一個既有的『站長』角色帳號登入後台（自行從環境中選定該站長所屬場館的帳號）
- 頁面標題下方的站台切換選單維持為該站長所屬場館
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台出金紀錄，以站長身分對其點擊『作廢』
- n: 2
  action: 於作廢原因欄填寫原因（例如：收據遺失）
- n: 3
  action: 送出
expected_result: 系統接受此次作廢，該筆紀錄的核實狀態轉為『已作廢』
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作/作廢（僅出金）
  quote: 僅 Admin 與站長可執行，須填寫作廢原因（必填）；用於收據遺失、爭議或確認不再兌付的情況
