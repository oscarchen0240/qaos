title: 印表機到位後：列印未開始前偵測異常，機台不呼叫 end-cashout 但平台仍留待確認 PENDING
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-023
acceptance_criteria_ids:
- AC-CASHFLOW-0231
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
- boundary
design_techniques:
- decision_table
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
- 機台印表機已到位、已恢復正式收據列印流程（非過渡期現況）
test_data: []
steps:
- n: 1
  action: 前提：本案例僅適用印表機到位、機台恢復原生 req-cashout/end-cashout 呼叫流程後；過渡期（見 REQ-CASHFLOW-025）不適用
- n: 2
  action: 機台已送出 req-cashout 並取得核可（PENDING 已建立）
- n: 3
  action: 按下結算時印表機已有異常（列印尚未開始），機台直接結束流程、不呼叫 end-cashout
expected_result: 機台不呼叫 end-cashout，分數不扣、保留在機台上；但平台因先前 req-cashout 已建立的 PENDING 仍留有一筆「待確認」的出金（現場其實什麼也沒發生，該 PENDING 依 REQ-CASHFLOW-026
  的既有機制收斂）
