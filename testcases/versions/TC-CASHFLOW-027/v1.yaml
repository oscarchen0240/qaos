title: 印表機到位後：列印未開始前偵測異常則不呼叫 end-cashout、但平台仍留有待確認 PENDING；已入列印佇列後才故障則分數照扣、收據待排除後自動印出
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-023
acceptance_criteria_ids:
- AC-CASHFLOW-0231
- AC-CASHFLOW-0232
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
- boundary
design_techniques:
- decision_table
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
- 機台印表機已到位、已恢復正式收據列印流程（非過渡期現況）
test_data: []
steps:
- n: 1
  action: 前提：本案例僅適用印表機到位、機台恢復原生 req-cashout/end-cashout 呼叫流程後執行；過渡期（現行狀態，見 REQ-CASHFLOW-025）不適用本規則
- n: 2
  action: 情境一：機台已送出 req-cashout 並取得核可（PENDING 已建立），按下結算時印表機已有異常（列印尚未開始），機台直接結束流程、不呼叫 end-cashout
- n: 3
  action: 情境二：機台已送出 req-cashout 並取得核可，收據已送入列印佇列後才卡紙或缺紙
expected_result: 情境一：機台不呼叫 end-cashout，分數不扣、保留在機台上；但平台因先前 req-cashout 已建立的 PENDING 仍留有一筆「待確認」的出金（現場其實什麼也沒發生，該 PENDING 依 REQ-CASHFLOW-026
  的既有機制收斂）；情境二：機台送出 end-cashout，分數已扣（出金已完成），收據仍在佇列中，待現場排除狀況後自動印出，不可視為未出金而重做
