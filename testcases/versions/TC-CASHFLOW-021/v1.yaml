title: 指定金額洗分且洗完後餘額仍足夠再洗一次同額時，重複送出會造成重複扣款
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-018
acceptance_criteria_ids:
- AC-CASHFLOW-0181
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
test_data: []
steps:
- n: 1
  action: 機台餘額 1000、門檻 100，送出指定金額洗分請求（req-keyout，mode=value）300，收到 0-OK，餘額變為 700
- n: 2
  action: 誤判失敗（或未看清回應）後重按，再次送出同樣的洗分請求（req-keyout，mode=value）300
expected_result: 第二次同樣回 0-OK 並扣款 300，餘額變為 400；系統不會偵測或阻擋此重複，屬 spec 明確點名的風險情境，需靠現場 SOP（先查後台再決定是否重做）因應
