- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
- ⚠️ 本案例依賴驗證憑證的平台 API；該 API 屬開發包③範圍，正式對接前尚不存在，目前無法實際執行，僅供開發包③上線後執行
test_data: []
steps:
- n: 1
  action: 機台使用憑證 A 正常呼叫平台 API
- n: 2
  action: 在後台重置該機台的憑證（產生憑證 B，A 應立即失效）
- n: 3
  action: 以憑證 A 再次呼叫平台 API
expected_result: 第三步呼叫被拒絕——平台除驗證簽章外，另比對機台目前有效的憑證識別（如 jti／版本號），僅簽章有效不足以通過
