steps:
- n: 1
  action: M 送出 req-keyin，金額 500
  expected: 回 0-OK；建立場次 S1
- n: 2
  action: 在機台前台下注至少 3 筆（任意金額與遊戲），記下這些注單的時間／金額／遊戲；查看前台『注單』與『遊戲紀錄』
  expected: 前台顯示這幾筆注單與遊戲紀錄（對照基準：證明紀錄存在且前台能顯示當前場次的內容）
- n: 3
  action: 結束 S1：M 送出 req-cashout 與 end-cashout（或在前台按結算）完成出金
  expected: 回 0-OK；M 分數 0；S1 結束，M 沒有進行中場次
- n: 4
  action: 重新載入前台『注單』與『遊戲紀錄』
  expected: 內容為空（無進行中場次時為空）
- n: 5
  action: 模擬下一位玩家：M 送出 req-keyin，金額 200，建立場次 S2；重新載入前台『注單』與『遊戲紀錄』
  expected: 看不到步驟 2 記下的 S1 注單與遊戲紀錄（內容為空）
- n: 6
  action: 在前台於 S2 下注 1 筆，再重新載入『注單』與『遊戲紀錄』
  expected: 只顯示這 1 筆（S2 的內容），仍看不到 S1 的任何紀錄
- n: 7
  action: 對照：後台以 M 的機台帳號查詢注單（後台注單查詢頁，若該頁可查到已結束場次）
  expected: S1 的注單仍存在於後台，證明前台看不到是顯示隔離，不是紀錄被刪除
- n: 8
  action: 清理：M 送出 req-cashout 與 end-cashout，使餘額歸 0
