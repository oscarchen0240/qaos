title: 達單週期上限時餘數保留：第 5 個紅包產生時保留餘數 84、之後結算的注單不再計入；升級調高上限後自保留餘數續計
description: 達單週期上限時餘數保留：第 5 個紅包產生時保留餘數 84、之後結算的注單不再計入；升級調高上限後自保留餘數續計
product: ba-admin
functional_area: REDPACKET
requirement_ids:
