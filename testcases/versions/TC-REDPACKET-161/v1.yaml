priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 【環境前提，spec 未定義】需有可立即改變指定測試會員 VIP 等級序號的辦法（6.2 僅定義自動升降的評估週期；變動結果可於『各式報表 > 會員等級異動紀錄』核對），由環境負責人提供；下文『會員升級／降級』均指此辦法
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定一名既有線上會員（玩家 A，目前 VIP 等級序號 b，未被任何等級規則勾選），及另一個序號 s（s ≠ b）作為升級目標；本週期無注單計入累計
test_data:
- name: 預設規則
  value: 門檻 1000／上限 5／固定 10／稽核 1
- name: 等級規則 1（序號 s）
  value: 門檻 1000／上限 8／固定 10／稽核 1
- name: 下注序列
  value: 4000、974、110、500 → 升級 → 916、999、1
steps:
- n: 1
  action: 建立活動『RP-CAP』（活動時間『永久』）：活動幣種 USDT；預設規則門檻 1000／上限 5／固定 10／稽核 1；等級規則 1 勾選序號 s（門檻 1000／上限 8／固定 10／稽核 1）；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 玩家 A 結算有效流水貢獻 4000（單筆）
  expected: 循環產生 4 個紅包，累計餘量 0
- n: 3
  action: 玩家 A 結算有效流水貢獻 974
  expected: 沒有新紅包（餘量 974）
- n: 4
  action: 玩家 A 結算有效流水貢獻 110
  expected: 累計 1,084 達標：產生第 5 個紅包（達上限 5）；紅包明細該筆『週期累計』顯示 5,084（產生當下本週期總額）；超出的 84 保留
- n: 5
  action: 玩家 A 再結算有效流水貢獻 500
  expected: 不再計入累計、沒有新紅包（紅包明細仍 5 筆）
- n: 6
  action: 把玩家 A 升級至序號 s（等級規則 1，上限 8）
  expected: 等級異動生效；變動當下不產生新紅包（仍 5 筆）
- n: 7
  action: 玩家 A 結算有效流水貢獻 916
  expected: 自保留的 84 續計：84＋916＝1,000 達標，產生第 6 個紅包；該筆『週期累計』顯示 6,000（上限已達期間的 500 沒有被計入）
- n: 8
  action: 玩家 A 結算有效流水貢獻 999
  expected: 沒有新紅包（餘量 999；若上限期間的 500 被計入，累計會是 1,499，這裡就會多產生紅包）
- n: 9
  action: 玩家 A 結算有效流水貢獻 1
  expected: 累計 1,000：產生第 7 個紅包（餘量 999＋1）
- n: 10
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 產生達上限的第 5 個紅包時，超出門檻的餘數 84 保留，之後結算的注單（500）不再計入；升級至上限 8 的等級規則後自保留的 84 續計，916 結算後恰好產生第 6 個紅包；之後 999 不產生、再加 1
  才產生第 7 個。
expected_result_spec_reference:
  spec_id: SPEC-REDPACKET-001
  spec_version: '0.2'
  location: §業務規則與驗證（第 389 行）
  quote: 產生達上限的那一個紅包時，超出門檻的餘數保留（例：門檻 1,000、上限 5 個，第 5 個產生時累計為 1,084，保留 84），之後結算的注單不再計入；會員等級變動使上限調高時，自保留的餘數續計
