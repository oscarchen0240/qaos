preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個模板為空、狀態非開通的站台（可用上一條 TC 建立的待開通站台）
- n: 2
  action: 編輯該站台，將狀態切換為「開通」並點擊「儲存變更」
expected_result: 系統阻擋儲存，顯示錯誤提示要求先設定模板；站台狀態維持原狀，未變更為開通
