execution_mode: manual
preconditions:
- 以 Admin 登入後台，一名會員目前帳號狀態為啟用
test_data: []
steps:
- n: 1
  action: 於該會員詳細資料頁點擊帳號狀態旁的鉛筆圖示，將狀態從啟用切換為停用，確認後台顯示已更新為停用
- n: 2
  action: 該會員嘗試以自己的帳號登入前台
expected_result: 該會員無法登入，前台系統拒絕其登入請求
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 會員啟用狀態
  quote: 處於停用狀態的會員將無法登入或進入平台。點擊鉛筆圖示可切換狀態
