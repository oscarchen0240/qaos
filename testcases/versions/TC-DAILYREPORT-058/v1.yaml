title: 場館資料範圍完全由站台切換下拉選單決定，頁面不存在獨立的場館篩選欄位
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-002
acceptance_criteria_ids:
- AC-DAILYREPORT-0021
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 確認至少有兩個不同站台可供切換，且各自底下有不同的場館／機台資料
test_data: []
steps:
- n: 1
  action: 進入『各式報表 > 場館日結報表』，透過頁面標題下方的站台切換下拉選單切換至站台 A，設定結算日期並查詢，記錄列表資料範圍
- n: 2
  action: 檢視篩選器區域的所有欄位名稱，確認是否存在『場館』相關的篩選欄位
- n: 3
  action: 切換站台下拉選單至站台 B（不變更其他篩選條件），重新查詢，記錄列表資料範圍
expected_result: 篩選器區域不存在任何『場館』篩選欄位（僅有機台帳號／結算日期／統計週期／統計維度）；切換站台後，列表資料範圍隨之變為站台 B 的資料，不再顯示站台 A 的場館資料——場館資料範圍完全由站台切換下拉選單決定
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
