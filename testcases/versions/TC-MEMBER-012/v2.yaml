title: 會員等級可由後台人員編輯，後台備注選填、操作人員自動帶入當前登入帳號
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-008
acceptance_criteria_ids:
- AC-MEMBER-012
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入一名會員的詳細資料頁
test_data: []
steps:
- n: 1
  action: 點擊會員等級旁的「編輯」按鈕，確認右側滑出「會員等級編輯」面板
- n: 2
  action: 面板中選擇一個與目前不同的新會員等級
- n: 3
  action: 後台備注欄位（選填）留空，不填寫
- n: 4
  action: 點擊儲存
expected_result: 會員等級成功更新為新選擇的等級；後台備注為選填欄位，留空不影響儲存成功；操作人員欄位自動帶入當前登入帳號，不需手動填寫
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 等級資訊
  quote: 會員等級｜可透過「編輯」按鈕手動調整；點擊後右側滑出「會員等級編輯」面板，填寫以下欄位後點擊「儲存」：會員編號（唯讀）、會員等級（下拉選單）、後台備注（選填）、操作人員（自動帶入當前登入帳號，唯讀）
