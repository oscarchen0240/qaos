preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果中任選一筆場次編號非「—」的機台交易
- n: 2
  action: 點擊該筆交易的場次編號欄位值
expected_result: 頁面自動套用該場次編號為篩選條件並重新查詢，結果為同一場次內的所有交易
