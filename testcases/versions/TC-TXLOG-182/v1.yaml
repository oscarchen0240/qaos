preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 找出（或安排）兩筆已知交易時間相隔明顯的交易，一筆落在欲設定的日期範圍內、一筆在範圍外
- n: 2
  action: 設定交易時間範圍涵蓋前者、排除後者，點擊搜尋
expected_result: 結果包含範圍內的交易，不包含範圍外的交易
