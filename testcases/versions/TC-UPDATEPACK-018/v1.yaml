title: 於鏈上錢包管理將某幣別改為禁用後，展開清單即時反映、不再列出該幣別
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-001
acceptance_criteria_ids:
- AC-UPDATEPACK-0012
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 承上一條 TC 的站台設定（已啟用三種幣別），選定其中一名會員供比對
test_data: []
steps:
- n: 1
  action: 展開該會員的餘額欄，記錄目前列出的幣別清單
- n: 2
  action: 前往『帳務管理 > 鏈上錢包管理』，將清單中其中一種非核心貨幣的幣別改為禁用並儲存
- n: 3
  action: 回到會員列表，重新展開同一會員的餘額欄（可重新查詢或重新進入頁面）
- n: 4
  action: 測試完成後，回『帳務管理 > 鏈上錢包管理』將步驟2禁用的幣別重新設回啟用並儲存，復原站台設定，避免影響同一站台的其他TC前提（該站台已啟用三種幣別）
expected_result: 重新展開後的清單不再列出剛被禁用的幣別，僅剩餘下已啟用的幣種，清單內容即時反映鏈上錢包管理目前的啟用狀態
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示
  quote: 幣別清單來源 | 依「帳務管理 > 鏈上錢包管理」中狀態為啟用的幣種為準（含法幣頁籤的幣別）；狀態為關閉或禁用的幣種不列出。幣種增減隨鏈上錢包管理的啟用狀態連動，本功能不另行設定幣別清單
