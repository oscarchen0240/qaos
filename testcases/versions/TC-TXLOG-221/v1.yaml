title: 管理員手動取消待確認出金完成後，X 自己的完成回報（end-cashout）才遲到：仍為已取消，分數與紀錄筆數與取消後相同，沒有多出已完成的出金
description: 補充案例（Risk Review RF-01）：取消完成之後，X 所屬機台以 X 原始交易欄位送出的完成回報不得讓 X 變成已完成或扣分；不涵蓋取消與完成回報同時到達的情況
requirement_ids:
- REQ-TXLOG-028
acceptance_criteria_ids: []
test_types:
- functional
- negative
design_techniques:
- scenario
preconditions:
- 以管理員（spec 原文稱 Admin）登入後台，進入『各式報表 > 交易紀錄查詢』，頁面標題下方的站台切換下拉選單切到機台場館所屬站台（資料範圍跟隨該選單，一次僅顯示所選站台）
- 【執行通道，前端未開發】依 CLR-TXLOG-002，手動取消的後端已完成、前端尚未開發（BUG-TXLOG-001；2026-10-12 實機：列表操作欄只有『明細』，明細面板標示『本頁只讀』）。標記『UI』的步驟照 spec 描述撰寫，前端上線前實機看不到手動取消入口，這些步驟記為『受阻』（不是本案的產品
  FAIL，也不要把『實機沒有入口』當成預期結果）；標記『API』的步驟以後端為準。手動取消後端 API 的路徑、方法、參數、身分驗證與二次確認的表達方式 spec 與派發包都未定義，需向 RD／環境負責人取得；取不到時 API 步驟一併記『受阻』，不得自行推測或編造
  API，也不得改用資料庫直接修改來替代。列表查詢本身（篩選、交易狀態欄）不受前端缺手動取消影響，可正常用來觀察結果。
- 手動取消的入口位置 spec 未定義（列表操作欄或右側明細面板，REQ-TXLOG-028 Q01 detail_gaps），不得假設；兩處都要檢視
- 【一輪執行所需的待確認測試資料數量（供執行計畫備料）】不可逆消耗（取消或完成後不得再用）的待確認機台出金共 7 筆：AC-0282 案 1 筆、手動取消後遲到 end-cashout 案 2 筆（取消目標 X 與對照出金 V）、AC-0291
  站長案 1 筆、AC-0291 操作員案 1 筆、AC-0292 案對照出金 W1 1 筆、AC-0293 案對照出金 W2 1 筆；另需可共用、不被取消的待確認機台出金 1 筆（AC-0281、AC-0283、TC-TXLOG-165 修訂版共用），TC-TXLOG-148
  修訂版需另一筆超過 24 小時且全程不被取消者 1 筆，AC-0293 案需待確認的機台入金 Y 1 筆（24 小時內）；AC-0292 案另需已完成與已取消的機台出金各 1 筆（不消耗）。各筆都是測試機台帳號的測試資料，佈置方式 spec
  未定義，需環境負責人確認
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】本站台有兩筆交易狀態為『待確認』的機台出金，必須屬於兩台不同機台（不同的測試機台帳號）：X（本案的取消目標，其所屬機台記為 M_X）與 V（只用來驗證重送工具）。不同機台是必要的：依
  spec 第 51 行，同一台機台新的出金請求會取代舊的待確認出金，放在同一台會使其中一筆被取代。兩筆取消或完成後都不可復原，僅用測試資料
- 【環境前提，spec 未定義，需環境負責人確認】X 在被取消之前，M_X 已送出 X 的出金請求，並且刻意沒有送出完成回報（end-cashout）；要保留 X 的原始請求紀錄 R_X（含交易編號、金額、機台身分與憑證、其他固有欄位）。重送方式優先順序：(1)
  用 M_X 的機台模擬器，在 X 被取消之後，直接送出它原本那筆未完成的回報；(2) 用 RD 工具，以 M_X 的身分與憑證、X 的原始交易欄位送出。端點、欄位、認證方式 spec 未定義，不得推測或編造；無法取得 R_X、模擬器或工具，或無法確認重送請求對應到
  M_X 與 X 時，本案記『受阻』，不得判通過。手動取消的 API 沿用 AC-TXLOG-0282 案例成功執行過的同一份範本
- 【環境前提，spec 未定義，需環境負責人確認】機台帳號分數（餘額）以哪個來源讀取：機台端畫面，或在列表點擊『機台帳號』進入的會員詳細資料頁（該頁是否顯示分數 spec 未定義）。取消前後固定用同一個來源讀取，且測試期間不要對該機台帳號進行其他開分、洗分、入金、出金，否則分數差異無法歸因。
- 【判定記錄】前端未上線時，手動取消以 API 執行；後端通過、UI 受阻時，整案記為『後端通過、UI 待前端上線後重跑』。本案的重送動作只能在機台模擬器或 RD 工具進行，沒有 UI 通道
- 【範圍】本案只驗證『取消完成之後』才到達的完成回報（循序情境，spec 第 93 行已規定）；取消與完成回報『同時到達』以哪個為準 spec 未定義（另案澄清 CLR-CASHFLOW-012），本案不斷言，也不得人為製造同時到達來判定。X
  被取消之後、重送完成之前，不要讓 M_X 送出新的出金請求，以免干擾筆數比對
- 【斷言範圍】本案不對已取消出金 X 的『核實狀態』欄作任何斷言（spec 未定義待確認或已取消的出金顯示什麼核實狀態），只比較重送前後同一項目有沒有變化
test_data:
- name: 重送 end-cashout 次數
  value: 3（2～3 次皆可，本案取 3）
- name: 重送前後預期交易狀態（X）
  value: 已取消（全程）
- name: 預期分數（X 的機台帳號）
  value: 重送前後相同（S2 等於取消後的 S1；S1 等於取消前的 S0）
steps:
- n: 1
  action: 在交易紀錄查詢篩選『交易類型＝機台出金』『交易狀態＝待確認』並搜尋，選定 X，記下交易編號 T_X、訂單編號、機台帳號與所屬機台 M_X；依前提的來源讀取分數 S0；取得 X 的原始請求紀錄 R_X
  expected: X 為『待確認』；取得 S0 與 R_X。取不到 R_X 則本案記『受阻』
- n: 2
  action: 重送工具有效性驗證（只驗工具）：用 RD 提供的 end-cashout 工具，以 V 自己所屬機台的身分與 V 自己的交易欄位，對 V 送出一次完成回報，再於交易紀錄查詢查看 V
  expected: V 由『待確認』轉為『已完成』，證明工具能送出有效的完成回報。這一步只證明工具可用，不是 X 的重送請求有效的依據（V 與 X 屬不同機台、不同欄位）；若 V 沒有完成，或回應顯示請求格式錯誤／路由不存在／憑證無效，本案記『無效／受阻』，不繼續，X
    保持待確認
- n: 3
  action: 以管理員身分、沿用 AC-TXLOG-0282 案例成功執行過的同一份 RD 範本，對 X 執行手動取消並完成二次確認（UI 路徑前端未上線時受阻，以 API 執行）；重新查詢 X；取消成功後重新記錄基準：分數 S1、M_X
    所屬機台帳號『交易狀態＝已完成』『交易類型＝機台出金』的筆數 C1、以『核實狀態＝待核實』『交易類型＝機台出金』篩選時該機台帳號的筆數 P1，以及 T_X 是否出現在該待核實篩選結果中（記為 F1：有／無）
  expected: X 為『已取消』，S1 等於 S0（取消完成，作為重送前的起點；此為前置確認）；取得 S1、C1、P1、F1。取消沒有成功則本案記『受阻』
- n: 4
  action: 取消完成之後，由 M_X 送出 X 自己的完成回報：優先讓 M_X 的機台模擬器直接送出它原本那筆未完成的回報；否則用 RD 工具，以 M_X 的身分與憑證、R_X 中 X 的原始欄位（交易編號 T_X、金額等；RD 範本說明哪些欄位需換）送出。連續送出
    3 次（每次間隔數秒），每次都記下實際請求與平台對機台的回應內容。送出前先做逐欄對照表：實際請求 vs R_X，逐欄標示相同或不同；機台身分、憑證、交易編號、金額與其他固有欄位必須與 R_X 相同，只允許 RD 說明為每次請求必變的欄位（例如時間戳、序號）不同
  expected: 三次都已送出，對照表顯示請求確實是 M_X 對 X 的完成回報；回應內容只記錄、不判定（spec 第 93 行說明取消後平台會告知機台這筆交易不存在，但回應格式 spec 未定義）。若對照表顯示機台身分或固有欄位與 R_X
    不符、無法確認請求對應到 M_X 與 X，或回應顯示請求格式錯誤／路由不存在／憑證無效，本案記『無效／受阻』，不得判通過
- n: 5
  action: 回到交易紀錄查詢，以 T_X 重新查詢 X，依同一來源讀取 M_X 所屬機台帳號的分數 S2；再重做步驟 3 的兩個篩選查詢，得到 C2、P2，以及 T_X 是否出現在待核實篩選結果中 F2
  expected: X 仍為『已取消』（沒有變成『已完成』）；S2 等於 S1；C2 等於 C1（沒有多出已完成的機台出金）；P2 等於 P1（沒有多出待核實紀錄）；F2 與 F1 相同（T_X 在待核實結果中的有無與取消後相同）。不對 X
    的核實狀態是什麼作任何斷言
expected_result: 管理員手動取消待確認的機台出金 X 完成之後，X 所屬機台才送出 X 自己的完成回報並重送多次：X 仍為『已取消』，機台帳號分數與重送前（取消後）相同，沒有多出已完成的出金，也沒有新增待核實紀錄，T_X 在待核實結果中的有無與取消後相同。（平台對機台的回應內容只記錄、不判定；不對已取消出金的核實狀態作斷言；本結論須在重送請求經逐欄對照確認為
  M_X 對 X 的完成回報、且不是格式錯誤／路由不存在／憑證無效時才成立，否則記無效／受阻；環境無法重送時記受阻；不涵蓋取消與完成回報同時到達的情況。）
