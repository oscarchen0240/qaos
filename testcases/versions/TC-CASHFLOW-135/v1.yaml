title: 餘額 0.6（整數部分為 0）：以門檻 100 全洗回 1-NO CREDITS 洗不出，按結算出金核可金額 0.6、不被當成 0 而回 1-NO CREDITS，餘額歸 0、交易紀錄 -0.6
