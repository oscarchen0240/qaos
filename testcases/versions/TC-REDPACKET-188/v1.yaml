title: 機台前台『本期已獲得』含待開啟、已入帳與已作廢：2 已入帳＋1 已作廢（機台洗分）＋1 待開啟 顯示 4 ／ 5
description: 機台前台『本期已獲得』含待開啟、已入帳與已作廢：2 已入帳＋1 已作廢（機台洗分）＋1 待開啟 顯示 4 ／ 5
