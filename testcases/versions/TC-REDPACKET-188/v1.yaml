execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分與洗分；機台端洗分門檻為已知的正值或 0（機台端設定，後台無此設定）
- 機台帳號 M1（自行從環境中選定，本週期無注單）
- M1 洗分門檻已知；整個測試在同一個營業日（日結時間）內完成，避免每日重置干擾
- 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
test_data:
- name: 活動
  value: 門檻 100／上限 5／固定 20／稽核 0；每日重置
- name: 下注
  value: 每次有效流水貢獻 100，共 4 次
steps:
- n: 1
  action: 建立機台場館紅包活動『RP-OBTAINED』（永久）：每日重置；預設規則門檻 100／上限 5／固定 20／稽核 0；儲存；店員對 M1 開分使分數大於洗分門檻
  expected: 建立成功
- n: 2
  action: M1 結算有效流水貢獻 100，產生 P1，依領取流程領取
  expected: P1 已入帳
- n: 3
  action: M1 結算有效流水貢獻 100，產生 P2，依領取流程領取
  expected: P2 已入帳
- n: 4
  action: M1 結算有效流水貢獻 100，產生 P3（不領取）；店員對 M1 以『指定金額』洗分並在確認視窗選［繼續結算］
  expected: 洗分完成，P3 作廢（機台洗分）；週期累計不歸零
- n: 5
  action: M1 結算有效流水貢獻 100，產生 P4（不領取）
  expected: P4 待開啟
- n: 6
  action: 後台紅包明細確認 M1 的 4 筆紅包狀態；M1 前台點紅包圖示開啟紅包視窗，檢視『本期已獲得』
  expected: 後台：P1、P2 已入帳、P3 已作廢、P4 待開啟；視窗『本期已獲得』顯示 4 ／ 5（含待開啟、已入帳與已作廢）
- n: 7
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 本期已獲得＝本週期已產生數（含待開啟、已入帳與已作廢）／單週期發放上限：2 已入帳、1 已作廢、1 待開啟時顯示 4 ／ 5。
