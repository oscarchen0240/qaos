title: 機台場館前台網域找不到自行註冊入口，同一時間線上站台前台維持提供註冊入口作為對照
product: ba-admin
functional_area: ARCADE
requirement_ids:
- REQ-ARCADE-001
acceptance_criteria_ids:
- AC-ARCADE-001
spec_id: SPEC-ARCADE-001
spec_version: '0.7'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- negative
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 於後台『站台列表』頁面，查詢一個既有機台場館（或自行經營之機台主站台）的網域，並另外查詢一個既有線上站台的網域，記錄兩者的前台網址（本步驟僅用於取得網址，不涉及登入後台以外的任何前台操作）
test_data: []
steps:
- n: 1
  action: 於瀏覽器開啟機台場館的前台網址，檢視頁面（含首頁、登入頁、選單與頁尾等一般常見放置註冊入口的位置）是否存在任何『註冊』相關按鈕或連結
- n: 2
  action: 於另一分頁開啟該線上站台的前台網址，同樣檢視是否存在『註冊』相關按鈕或連結，並嘗試點擊確認可進入註冊流程頁面
expected_result: 機台場館前台網域的頁面（首頁、登入頁、選單、頁尾等常見位置）皆找不到任何『註冊』入口；線上站台前台網域則正常可見『註冊』入口並可進入以帳號密碼方式自行註冊的流程，兩者形成對照，差異僅在站台類型不同
expected_result_spec_reference:
  spec_id: SPEC-ARCADE-001
  spec_version: '0.7'
  location: 機台場館的後台選單／補充說明
  quote: 機台場館的前台不開放自行註冊（v07 定案維持）：註冊入口不在機台場館的前台提供，機台帳號一律由後台建立（暱稱禁用詞設定因此一併隱藏）；開放與否屬未來營運需求、時程未定。線上站台的前台註冊不受影響
assumptions: []
