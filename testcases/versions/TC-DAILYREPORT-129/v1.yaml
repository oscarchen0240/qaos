priority: low
risk: low
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下選定一段至少有 2 個營業日資料的區間，以「依場館彙總＋按日」查詢
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」，搜尋（預設依結算期間排序）；檢視列表上方是否有餘額欄提示
- n: 2
  action: 點「開分金額」標題改依開分金額排序；檢視列表上方
- n: 3
  action: 點「結算期間」標題改依結算期間排序；檢視列表上方
expected_result: 步驟 1：不顯示餘額欄提示；步驟 2：顯示提示「「期初餘額」「期末餘額」僅在依結算期間排序時前後相接，其餘排序下兩欄各自正確但不可逐列銜接閱讀」；步驟 3：提示消失。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §排序與分頁/餘額欄提示
  quote: 排序欄位非「結算期間」時，列表上方顯示提示：「期初餘額」「期末餘額」僅在依結算期間排序時前後相接，其餘排序下兩欄各自正確但不可逐列銜接閱讀
