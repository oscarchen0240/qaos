title: 跨站台推薦時，推薦註冊金依收款人（新玩家）所屬站台的系統幣別發放，不是推薦人所屬站台的幣別
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-009
acceptance_criteria_ids:
- AC-BONUSCCY-011
spec_id: SPEC-BONUSCCY-002
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定兩個系統幣別不同的既有站台 A（系統幣別 X）與 B（系統幣別 Y），A、B 之間已存在或可建立跨站台推薦關係（站台 A 的既有會員以推薦人身分，使一名新玩家於站台 B 完成註冊）
- 若測試環境當下不易建置兩個系統幣別不同且可互相推薦的站台組合，本 TC 需標記為待執行（此限制已由 RequirementModel 的 rejection_contract 說明記載）
test_data: []
steps:
- n: 1
  action: 確認站台 A 與站台 B 的系統幣別設定（後台『站台列表』或對應站台設定頁可查核，兩者應不同）
- n: 2
  action: 以站台 A 既有會員的推薦連結／推薦碼，讓一名新玩家於站台 B 完成註冊並取得推薦註冊金
- n: 3
  action: 於後台會員詳細資料頁查看該新玩家（收款人）的錢包，確認註冊金入帳的幣別
expected_result: 推薦註冊金依收款人（新玩家）所屬站台 B 的系統幣別 Y 發放，進入新玩家站台 B 系統幣別的錢包，不是推薦人所屬站台 A 的系統幣別 X
