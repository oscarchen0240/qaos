priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台洗分交易，於本頁依 REQ-CASHOUT-021 流程完成核實，記錄執行核實的帳號與系統顯示的核實時間
- n: 2
  action: 至機台交易紀錄頁，查詢該筆交易，檢視其核實狀態、核實人員、核實時間欄
expected_result: 機台交易紀錄頁顯示該筆交易的核實狀態為已核實，核實人員與核實時間與本頁執行核實時記錄的一致；本 TC 僅比對這三個欄位的回寫值，不驗證機台交易紀錄頁其餘欄位或篩選邏輯
