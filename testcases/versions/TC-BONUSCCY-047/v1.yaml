title: 線上站台存款金額為非整數小數時，錢包入帳金額仍精確不被四捨五入或截斷
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-011
acceptance_criteria_ids:
- AC-BONUSCCY-017
spec_id: SPEC-BONUSCCY-003
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 選定一名既有的線上站台會員（自行從環境中選定，可與另一條 TC 使用不同會員以避免互相干擾）。
- 於 ba-admin 後台查詢該會員目前的錢包餘額，記錄為存款前基準值。
test_data: []
steps:
- n: 1
  action: 以該會員身分，透過線上站台實際完成一筆系統存款，刻意使用一個非整數、非規則的小數金額，例如 83.57 USDT（避免使用 100 這類整數，降低『欄位間複製/寫入時精度被吃掉』這類 bug 被整數掩蓋的機率；實際小數位數以站台實際允許的輸入精度為準）。
- n: 2
  action: 確認該筆存款入帳成功。
- n: 3
  action: 於 ba-admin 後台重新查詢該會員的錢包餘額。
expected_result: 錢包餘額增加的金額精確等於存入的小數金額（本例 83.57），小數位不因「原始金額」與「核心貨幣金額」拆成兩欄位而被四捨五入、無條件捨去或整數化。
expected_result_spec_reference:
  spec_id: SPEC-BONUSCCY-003
  spec_version: '1.0'
  location: §改了什麼／①存款金額拆成兩個；§這次能測什麼／T2
  quote: 原始金額｜玩家實際存的錢，玩家看到的幣別｜進錢包、算流水倍數、算手續費／T2 入金金額進錢包正確：存多少就進多少，幣別正確。這是最重要的回歸點
assumptions: []
