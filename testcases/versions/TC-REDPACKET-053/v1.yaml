title: 紅包明細篩選、金額總計僅計已入帳、線上場次編號顯示『—』
description: 紅包明細篩選、金額總計僅計已入帳、線上場次編號顯示『—』
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-022
acceptance_criteria_ids:
