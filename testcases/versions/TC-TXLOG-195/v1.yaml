title: 線上會員交易的機台帳號欄顯示「—」，且列表中任一欄位皆不顯示場館名稱
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-019
acceptance_criteria_ids:
- AC-TXLOG-0192
- AC-TXLOG-0193
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果包含線上會員的既有交易，檢視其機台帳號欄
- n: 2
  action: 逐一檢視列表的所有欄位標題與內容，確認是否存在場館／場館名稱相關欄位
expected_result: 線上會員交易的機台帳號欄顯示「—」；列表中不存在任何場館名稱欄位或場館名稱顯示（場館範圍已由頁面標題下方的站台切換選單限定，每列皆相同、屬冗餘資訊，故不重複顯示）
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §列表欄位
  quote: 機台帳號（來源機台） | ...非機台交易顯示「—」。場館名稱不顯示——場館已由頁面標題下方的站台切換限定
