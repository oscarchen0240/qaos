title: Free Spin 管理選擇會員時可指定機台帳號，不因帳號類型而被排除
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-003
acceptance_criteria_ids:
- AC-PLATFORMRULE-0031
