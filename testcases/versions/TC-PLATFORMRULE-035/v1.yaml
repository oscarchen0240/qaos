spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台帳號
test_data: []
steps:
- n: 1
  action: 進入『系統管理 > Free Spin 管理』，建立或編輯一個 Free Spin 活動，於選擇發放對象（會員）的步驟嘗試搜尋並選取前置作業選定的機台帳號
- n: 2
  action: 確認該機台帳號在選擇清單中是否可被勾選/選取
expected_result: 系統允許選取該機台帳號作為 Free Spin 活動的發放對象，不因其帳號類型為機台而被過濾、隱藏或拒絕選取
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §既有功能對機台帳號的排除規則 + §Free Spin 例外
  quote: 6.8 | Free Spin 管理 | 適用，同一般會員。可將機台帳號指定加入 Free Spin 活動；免費旋轉由後台直接派發、不需玩家領取，共用帳號收得到。幣種依主站台核心貨幣（機台場館即 TWD），見正本「核心貨幣」
