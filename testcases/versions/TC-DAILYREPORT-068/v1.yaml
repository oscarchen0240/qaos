title: 統計維度選依場次明細時，即使統計週期選區間合計，列表仍逐場次列出、不彙總
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-006
acceptance_criteria_ids:
- AC-DAILYREPORT-0063
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個當日（或近期單一營業日）已有多個已結束場次的既有機台
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計維度選『依場次明細』，統計週期選『區間合計』，結算日期涵蓋該機台已知有多個已結束場次的區間，查詢
- n: 2
  action: 記錄列表的列數，並與該機台在此區間內實際的已結束場次數（可透過『機台交易紀錄』頁依場次篩選核對）比對
expected_result: 列表逐場次列出，列數與該區間內實際場次數相符，不因統計週期選了『區間合計』就把多個場次彙總成一列——統計週期在此維度下僅決定查詢範圍，不影響列表是否逐場次呈現
