title: 上層站台為 admin 時，子站台類型不強制跟隨，可自由選擇機台或線上
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-002
acceptance_criteria_ids:
- AC-SITELIST-0023
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- admin 為既有的最上層根站台（線上類型；測試環境中此站台目前命名為 admin，如環境有變動請以平台最上層根站台為準）
test_data: []
steps:
- n: 1
  action: 至後台管理員系統 > 站台列表，新增子站台，上層站台選擇 admin，站台類型選擇「機台」並儲存
- n: 2
  action: 檢視這個新建立的機台子站台，確認核心貨幣欄位與其自身的鏈上錢包管理
- n: 3
  action: 再新增另一個子站台，上層站台同樣選擇 admin，這次站台類型選擇「線上」並儲存
- n: 4
  action: 檢視這個新建立的線上子站台，確認核心貨幣欄位與其自身的鏈上錢包管理
expected_result: 兩次新增站台類型欄位皆可自由選擇，不因上層站台 admin 本身是線上類型而被強制鎖定為線上、UI 也未唯讀跟隨；機台類型的子站台建立後核心貨幣顯示 TWD，且該子站台自己的鏈上錢包管理裡 TWD 已連動為啟用狀態；線上類型的子站台建立後核心貨幣顯示
  USDT，且該子站台自己的鏈上錢包管理裡 USDT 同樣已連動為啟用狀態——兩種類型皆不需要 admin 自身的鏈上錢包管理預先啟用對應幣別
