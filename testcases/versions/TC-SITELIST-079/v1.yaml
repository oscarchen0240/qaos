test_data: []
steps:
- n: 1
  action: 取一個核心貨幣為 TWD 的機台主站台，在其底下已有的子站台，檢視或編輯其核心貨幣欄位
- n: 2
  action: 嘗試在該子站台的編輯畫面尋找任何可修改核心貨幣的操作方式
expected_result: 子站台核心貨幣顯示為 TWD（與主站台一致），欄位為唯讀顯示；找不到任何可個別指定或修改該值的操作方式
