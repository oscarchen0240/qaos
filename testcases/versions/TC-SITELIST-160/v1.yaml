steps:
- n: 1
  action: 點擊「+ 新增站台」，模板欄位選取一個既有模板，填妥其餘欄位後建立
- n: 2
  action: 編輯剛建立的站台，將模板改為另一個既有模板並儲存
expected_result: 兩次操作系統皆接受；建立時所選模板正確儲存，編輯時模板成功變更為新選取的模板
