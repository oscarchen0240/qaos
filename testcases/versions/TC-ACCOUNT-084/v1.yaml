title: 修改機台名稱並儲存後，會員暱稱同步更新且修改時間自動更新
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-014
acceptance_criteria_ids:
- AC-ACCOUNT-0142
spec_id: SPEC-ACCOUNT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，記錄目前機台資訊區塊的修改時間
- n: 2
  action: 點擊「編輯」，將機台名稱改為一個新值並點擊「儲存變更」
- n: 3
  action: 檢視機台資訊區塊的機台名稱與修改時間
- n: 4
  action: 至會員列表尋找該帳號，檢視其會員編號下方顯示的暱稱
expected_result: 機台資訊區塊的機台名稱更新為新值，修改時間更新為本次操作時刻（不同於步驟一記錄的舊值）；會員列表該帳號的暱稱同步顯示為新值（套用效果需實際反映在會員列表，而不只是儲存本身）
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §編輯機台
  quote: 機台名稱 | 可…修改即更新該帳號的暱稱…點擊「儲存變更」後，修改時間自動更新
