title: 列表底部總計列以核心貨幣餘額加總計算，不依幣別拆分
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-007
acceptance_criteria_ids:
- AC-UPDATEPACK-0072
