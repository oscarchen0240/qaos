- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個已啟用兩種以上幣別、查詢結果會回傳多筆會員的既有線上站台
test_data: []
steps:
- n: 1
  action: 進入會員列表並查詢，逐列記錄每位會員收合狀態的帳戶餘額（核心貨幣）數值
- n: 2
  action: 手動加總各列數值，與列表底部『總計』列顯示的數值比對
- n: 3
  action: 確認總計列旁是否存在幣別選擇或拆分顯示的選項
expected_result: 總計列數值等於各列收合狀態核心貨幣餘額的加總；總計不依幣別拆分顯示，也不提供幣別選擇
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示/顯示規則
  quote: 不變更的範圍：2.1.2 篩選器的「帳戶餘額（主錢包）min ～ max」與列表底部「總計」列維持現行行為——皆以收合時的單一數值（核心貨幣錢包餘額）為準，不依幣別拆分，也不提供幣別選擇
