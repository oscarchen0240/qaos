preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個既有的機台類型站台（場館），點擊「編輯」，額度上限欄位輸入 0 並儲存
- n: 2
  action: 重新開啟編輯畫面，檢視額度上限欄位的值
expected_result: 系統接受並儲存 0；重新開啟後欄位值仍為 0（本 TC 僅驗證『0 這個設定值可被接受並持久化』這個 SITELIST 可觀察的部分；『0 代表不限制』實際在開分／入金時是否真的不檢核上限，需搭配機台交易功能才能驗證，超出本
  spec 範圍，未在此案例斷言）
