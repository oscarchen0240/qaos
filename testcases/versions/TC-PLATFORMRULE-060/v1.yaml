title: 平台新增一款全新遊戲後，所有機台場館皆預設停用
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-021
acceptance_criteria_ids:
- AC-PLATFORMRULE-0212
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定至少兩個不同的既有機台場館站台，供比對新遊戲於各場館的預設狀態
test_data: []
steps:
- n: 1
  action: 由具備權限的角色，於平台新增一款全新遊戲
- n: 2
  action: 分別切換至前置作業選定的各個機台場館，於『遊戲商管理』檢視該款新遊戲的預設狀態
expected_result: 該款新遊戲於所檢視的每一個機台場館皆預設為停用狀態，沒有任何機台場館預設為啟用
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的遊戲更新
  quote: 預設停用 | 平台新增任何遊戲、或對既有遊戲發佈更新後，該遊戲在所有機台場館一律預設為停用——包含更新前原已啟用的遊戲（更新視同內容變動，須重新決定是否開放）
assumptions:
- text: 『平台新增一款全新遊戲』的實際後台操作介面與具體步驟不在本 spec 定義範圍內，需另比對遊戲管理相關 spec 或洽環境負責人確認實際觸發方式；本 TC 假設可透過後台遊戲管理功能中的新增遊戲動作觸發，若實際操作路徑與假設不符，結果需人工複核
  requirement_id: REQ-PLATFORMRULE-021
  needs_human_confirmation: false
  resolved_by_approval: APR-0125
