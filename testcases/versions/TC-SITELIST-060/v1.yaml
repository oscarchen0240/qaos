title: 略過前端直接呼叫刪除站台 API，後端同樣拒絕
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-022
acceptance_criteria_ids:
- AC-SITELIST-0222
spec_id: SPEC-SITELIST-001
