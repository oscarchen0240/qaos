test_level: api
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分取得有效憑證（略過前端 UI 限制）
test_data: []
steps:
- n: 1
  action: 取一個線上類型站台，直接呼叫刪除站台的後端 API，帶入該站台 ID
- n: 2
  action: 取一個機台類型站台，直接呼叫刪除站台的後端 API，帶入該站台 ID
expected_result: 兩種類型皆被後端拒絕該請求，站台資料不受影響（原因：刪除站台會影響站台樹狀結構，故 PM／後端定案不提供刪除功能，見 CLR-SITELIST-009）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §操作/刪除站台（此節內容已由 CLR-SITELIST-009 確認為錯誤敘述，非現行產品行為）
  quote: 點擊列表「刪除」後顯示確認彈窗，列出站台名稱與代碼，二次確認後執行（＊此流程不存在於現行產品，見 CLR-SITELIST-009 PM 回覆）
