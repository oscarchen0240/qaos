preconditions:
- 以 Admin 登入後台
- 選定一個當日洗分金額中有部分仍待核實的既有場館或機台（可先於帳務管理『洗分出金核實』頁查找當日仍有待核實項目的機台）
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，結算日期設為當日，統計維度選『依機台明細』，查詢
- n: 2
  action: 檢視該機台列的『待核實洗分』欄位數值與呈現方式
expected_result: 待核實洗分欄位顯示大於 0 的金額，且該欄位出現某種提醒標示；spec 未定義具體呈現形式為顏色／圖示／文字，本案僅斷言『有提醒標示這個事實存在』，不斷言標示的具體視覺形式
