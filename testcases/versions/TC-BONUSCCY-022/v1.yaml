test_data: []
steps:
- n: 1
  action: 記錄玩家目前 VIP 累積儲值進度與目前等級，確認距升等門檻仍差一筆金額Y
- n: 2
  action: 對其執行一筆金額恰為Y的人工存款（存入後若計入則會剛好達標升等）
- n: 3
  action: 檢視玩家的累積儲值統計與目前 VIP 等級
expected_result: 累積儲值統計不變（不計入這筆Y），VIP 等級維持不變、不會被推進——即使金額剛好卡在會讓門檻達標的邊界值也一樣
