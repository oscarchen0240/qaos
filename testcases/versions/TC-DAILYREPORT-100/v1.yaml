title: 同一機台有已結束與進行中場次時，只有進行中場次顯示結束時間「—」並持續累計時長
requirement_ids:
- REQ-DAILYREPORT-008
acceptance_criteria_ids:
- AC-DAILYREPORT-0083
test_level: ui_e2e
test_types:
- negative
design_techniques:
- requirement_based
priority: high
risk: high
preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 測試場館下有一台既有機台 A（自行從環境中選定）
- 執行期間不得跨越場館日結時間（若目前離日結時間不到 30 分鐘，請改日或等日結後再執行）
- 機台 A 在同一個營業日內先後有兩個場次：先一個已結束場次（有開分與投注，以出金結束——出金一律清空餘額，見 spec §場次資訊），之後再開分並投注形成一個進行中場次，且之後不再有任何交易
- （比對基準）已結束場次與進行中場次是同一台機台、同一次查詢內的兩列，彼此互為對照
test_data:
- name: 等待間隔
  value: 約 3 分鐘
steps:
- n: 1
  action: 進入 各式報表 > 場館日結報表，統計維度選「依場次明細」、統計週期「按日」、機台帳號填機台 A、結算日期涵蓋昨日與今日（營業日依場館日結時間切分；日期標示可能與日曆日不同，故取涵蓋兩天的區間，並以列表中最後一個、尚未日結的營業日列為判讀對象），查詢
- n: 2
  action: 在列表分別找出機台 A 的已結束場次列與進行中場次列，記錄兩列的場次編號、狀態、結束時間、場次時長（已結束列 E1、進行中列 P1）
- n: 3
  action: 不對機台 A 做任何交易，等待約 3 分鐘，以完全相同的條件重新查詢，記錄兩列的結束時間與場次時長（已結束列 E2、進行中列 P2）
expected_result: 已結束列：狀態「已結束」、結束時間為具體時間（不是「—」），兩次查詢的結束時間與場次時長不變（E2＝E1）；進行中列：狀態「進行中」、結束時間「—」，P2 比 P1 多約 3 分鐘；兩列的場次編號不同
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §背景：場次資訊（場次時長）+ §列表欄位/場次編號；進行中場次列於依場次明細依 CLR-DAILYREPORT-013（PM 定案 A，2026-10-01；以 spec 2026-09-17 修訂為準，v0.1 不含該修訂）
  quote: 開始至結束的時間差；進行中則顯示累計至查詢當下
