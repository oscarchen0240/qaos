title: 機台帳號的 KYC 五階段皆為未申請，且無法提交申請
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-031
acceptance_criteria_ids:
- AC-ACCOUNT-0314
