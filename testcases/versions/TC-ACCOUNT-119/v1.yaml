- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，檢視 KYC 相關資訊（若該頁 KYC 區塊依 REQ-ACCOUNT-029
    已隱藏，改至既有的 KYC 管理功能查詢該帳號的 KYC 狀態）
- n: 2
  action: 嘗試對該帳號提交任一階段的 KYC 申請
expected_result: 五個 KYC 階段皆顯示「未申請」；無法對該機台帳號提交 KYC 申請（操作入口不可用或送出後被拒絕）
