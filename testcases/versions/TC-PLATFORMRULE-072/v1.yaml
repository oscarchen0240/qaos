preconditions:
- 站台樹（由環境負責人準備；站台與帳號皆自行對應，不指定編號）：根站台 admin 底下有兩個互相平行的機台類型主站台 P1、P2；P1 底下有機台類型子站台 S1、S2（互相平行），S1 底下再有機台類型子站台 S1a；P2 底下有機台類型子站台
  T1。依站台列表 spec，子站台與主站台同類型、機台類型站台（含主站台）皆帶機台專屬欄位，故 P1、S1、S1a、S2、P2、T1 皆視為場館
- 交易資料（由環境負責人確認既有資料，或以既有機台開分／入金流程製造，並提供會員編號與交易時間）：S1 下的機台帳號 MS1 至少一筆機台交易、S2 下的機台帳號 MS2 至少一筆機台交易、T1 下的機台帳號 MT1 至少一筆機台交易，三筆交易時間均落在同一個已知日期範圍內
- 機台交易紀錄查詢頁的資料範圍跟隨頁面標題下方的站台切換下拉選單（一次僅顯示所選站台，不另設場館篩選欄位，見 SPEC-TXLOG-001「篩選器」）
- 以根站台 admin 的管理員帳號（由環境負責人提供）登入後台
steps:
- n: 1
  action: 以根站台 admin 的管理員登入後台，進入『各式報表 > 交易紀錄查詢』
- n: 2
  action: 展開頁面標題下方的 站台切換下拉選單，確認含 P1、S1、S1a、S2、P2、T1
- n: 3
  action: 將站台切換至 S1，以涵蓋已知交易的日期範圍及機台帳號 MS1 查詢
- n: 4
  action: 將站台切換至 S2，以涵蓋已知交易的日期範圍及機台帳號 MS2 查詢
- n: 5
  action: 將站台切換至 T1（P2 底下），以涵蓋已知交易的日期範圍及機台帳號 MT1 查詢
expected_result: 站台切換選單列出全平台場館（P1 子樹的 S1、S1a、S2 與 P2 子樹的 T1 皆在內）；依序切換至 S1、S2、T1 時，分別查得 MS1、MS2、MT1 的機台交易，跨兩個平行主站台皆可切換並查得
