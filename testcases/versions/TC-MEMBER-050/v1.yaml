preconditions:
- 以 Admin 登入後台，進入暱稱禁用詞設定頁，Violence 與 Other 分頁目前皆為空（或至少不含將在本 TC 新增的那個詞）
test_data: []
steps:
- n: 1
  action: 切換至 Violence 分頁，於輸入框輸入一個測試用禁用詞，按 Enter 確認，確認該詞以 Tag 形式顯示
- n: 2
  action: 切換至 Other 分頁，檢視禁用詞清單
expected_result: Other 分頁的清單不包含剛才在 Violence 分頁新增的那個詞，兩個分頁的設定互相獨立
