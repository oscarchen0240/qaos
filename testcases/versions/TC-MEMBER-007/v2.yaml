title: 可提領餘額恰為 10 USDT 時不可於前台申請出金（邊界值，剛好不達門檻）
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-005
acceptance_criteria_ids:
- AC-MEMBER-007
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: integration
test_types:
- boundary
design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 後台帳務資訊「可提領餘額」欄位只是唯讀顯示，spec 全文沒有描述後台有可點擊的「申請出金」入口；「申請出金」是會員在前台自行操作的功能，因此本規則實際生效與可驗證的入口是會員前台，不在 ba-admin 後台範圍內（見 assumptions）
- spec 分別定義了帳戶餘額（主錢包）、提領所需有效投注額（流水錢包）、可提領餘額三個獨立欄位，也定義了人工存入/提出的「金額」與「稽核」設定（稽核＝設定本次異動金額所需完成的可提領投注倍數，會影響提款條件），但 spec 全文並未給出「可提領餘額」如何由前述欄位換算得出的公式，也未定義稽核=1時存入金額是否、以及何時會反映到可提領餘額（見
  assumptions）。佈置方式：透過人工存入/人工提出反覆調整，每次調整後回到帳務資訊區塊查看實際顯示的可提領餘額數值，不依賴任何計算公式預先斷定應存入/提出多少金額
- 需要一名會員的「可提領餘額」恰為 10.00 USDT
test_data: []
steps:
- n: 1
  action: 於後台帳務資訊區塊確認可提領餘額顯示為 10.00 USDT
- n: 2
  action: 以該會員身分登入會員前台，進入出金/提領申請功能
- n: 3
  action: 嘗試送出出金申請
expected_result: 前台阻擋出金申請（規則為「須大於10 USDT」，剛好等於10不符合條件）：申請入口不可用，或送出後被系統拒絕而未成功送出
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.4 帳戶資訊
  quote: 可提領餘額｜目前符合提領條件的金額（單位USDT）；須大於 10 USDT 方可申請出金
assumptions:
- text: 步驟中「以該會員身分登入前台並嘗試申請出金」需要會員前台的測試環境與登入方式；spec 未定義後台是否存在可直接驗證此門檻的入口，前台測試環境是否可用、以及人工提出是否適用同一道 >10 USDT 門檻，需環境負責人 / PM
    確認
  requirement_id: REQ-MEMBER-005
  needs_human_confirmation: true
- text: 可提領餘額與帳戶餘額（主錢包）、提領所需有效投注額（流水錢包）、稽核倍數之間的精確換算公式，spec 全文未定義；本 TC 假設可透過人工存入/提出搭配後台實際讀數反覆調整至目標邊界值，但無法保證這是唯一或最有效率的方式，此換算機制需環境負責人
    / PM 確認
  requirement_id: REQ-MEMBER-005
  needs_human_confirmation: true
