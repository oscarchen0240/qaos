title: 一台機台同時間只會維持一個進行中場次，不會產生併發的第二個場次
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-039
acceptance_criteria_ids:
- AC-CASHFLOW-0391
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- boundary
design_techniques:
- boundary_value
priority: high
risk: medium
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
test_data: []
steps:
- n: 1
  action: 機台餘額恰為 0（無進行中場次），以測試工具對同一機台併發送出兩個會使分數由 0 轉正的請求（例如一筆開分 req-keyin 與一筆入金 end-cashin，同一時間發出）
- n: 2
  action: 檢視兩筆請求皆判定通過後，機台的場次紀錄
expected_result: 兩筆交易皆正常入帳、分數累加，但仍只建立並維持一個進行中場次（不會因兩筆幾乎同時使分數轉正而產生兩個場次），兩筆交易皆歸屬於同一個場次編號
