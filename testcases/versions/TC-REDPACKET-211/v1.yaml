title: 切換會員等級方案後新方案多出、未被勾選的序號：預設規則開啟時該序號會員適用預設規則；預設規則關閉時不參加（不累計、不產生）
description: 切換會員等級方案後新方案多出、未被勾選的序號：預設規則開啟時該序號會員適用預設規則；預設規則關閉時不參加（不累計、不產生）
