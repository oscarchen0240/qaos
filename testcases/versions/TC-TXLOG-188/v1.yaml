title: 入金交易超過 24 小時未收到機台回報，自動轉為已逾時，分數未異動
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-015
acceptance_criteria_ids:
- AC-TXLOG-0151
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- state_transition
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 安排一筆入金交易並確保其停留在待確認狀態
- n: 2
  action: 等待（或透過測試環境提供的時間加速機制）滿 24 小時後，重新查詢該筆交易
- n: 3
  action: 檢視其交易狀態與（透過會員詳細資料頁核對的）分數
expected_result: 交易狀態自動轉為已逾時；分數未異動
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §交易狀態
  quote: 已逾時 | 僅入金會出現：超過 24 小時仍未收到機台回報而自動關閉；分數未異動
assumptions:
- text: 驗證『超過 24 小時自動轉已逾時』需要測試環境具備時間加速能力，或存在一筆已知建立時間已超過 24 小時前、仍處於待確認狀態的既有入金交易；spec 未定義 QA 應如何取得此類測試條件，實際做法待環境負責人確認
  requirement_id: REQ-TXLOG-015
  needs_human_confirmation: true
automation_status: not_automated
