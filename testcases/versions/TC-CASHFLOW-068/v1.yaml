title: req-cashin 每次皆建立新 PENDING 與唯一 TXID，不使既有 PENDING 失效；對其中一筆完成 end-cashin 不影響另一筆
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-006
acceptance_criteria_ids:
- AC-CASHFLOW-0061
- AC-CASHFLOW-0062
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- requirement_based
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashin 送出第一筆入金請求，記錄回覆的 TXID1（PENDING1 建立）
- n: 2
  action: 再呼叫 req-cashin 送出第二筆入金請求（同一機台帳號），記錄回覆的 TXID2
- n: 3
  action: 確認 TXID1 ≠ TXID2，且 PENDING1 未因 PENDING2 的建立而失效（兩者並存）
- n: 4
  action: 以 TXID1 呼叫 end-cashin 完成該筆入帳
- n: 5
  action: 確認 PENDING2（TXID2）仍維持待確認狀態、未受影響，可再獨立以 end-cashin(TXID2) 完成
expected_result: 每次 req-cashin 皆建立新 PENDING 並產生唯一 TXID，不使既有 PENDING 失效；同一帳號可同時存在多筆有效入金 PENDING，且對其中一筆完成或處理不會波及另一筆
