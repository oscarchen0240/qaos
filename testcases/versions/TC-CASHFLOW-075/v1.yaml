title: 同一 TXID 的 end-cashin 於成功處理後再次送達，回 0-OK 但不重複加值
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-011
acceptance_criteria_ids:
- AC-CASHFLOW-0111
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- requirement_based
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashin 取得 TXID，並以該 TXID 呼叫 end-cashin 完成一次入帳，記錄完成後的機台分數
- n: 2
  action: 以相同 TXID 再次呼叫 end-cashin（模擬機台 15 秒未收到成功回覆而重送，或跨斷電續送）
- n: 3
  action: 確認回覆與機台分數是否變化
expected_result: 第二次仍回 0-OK，但機台分數不再重複增加，維持第一次入帳後的值
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-入金
  quote: 平台必須具備冪等性：相同 TXID 第二次以後收到時，若該 PENDING 已完成，直接回 0-OK 且不重複加值
