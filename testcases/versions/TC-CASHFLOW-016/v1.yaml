test_data: []
steps:
- n: 1
  action: 機台餘額 321、門檻 100，送出全洗請求（req-keyout，mode=all），檢視核可金額
- n: 2
  action: 同餘額同門檻，改送指定金額 300 的洗分請求（req-keyout，mode=value），檢視核可金額
- n: 3
  action: 機台餘額 321、門檻改為 0，送出全洗請求（req-keyout，mode=all），檢視核可金額
expected_result: 第一步核可金額 300；第二步核可金額同為 300，與全洗結果一致；第三步門檻為 0 時核可金額為 321（全額，不取整）
