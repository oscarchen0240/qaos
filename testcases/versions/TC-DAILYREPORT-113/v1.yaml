preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
- 機台 A（路徑一）：營業日 D 內場次 S1 以開分起始、洗分結束留餘數 R1（AC 範例 900）；場次 S2 承接該 R1，S2 在 D 結束的日結時刻（日結時間 T）仍進行中而被日結結算、結束時分數 R2（AC 範例 80）；次一營業日
  D+1 的新場次 S3 由 S2 日結結算後轉入 R2
- 機台 B（路徑二）：場次 S1' 以出金結束（出金一律清空餘額），之後以入金開始場次 S2'
- A、B 皆為環境中既有機台（自行選定）；兩台機台在查詢範圍內都沒有「逾時結束」場次
test_data:
- name: AC-0183 示意
  value: S1 期初 0、S2 期初 900、S3 期初 80
- name: AC-0184 示意
  value: S2' 期初 0
steps:
- n: 1
  action: 統計維度選「依場次明細」、統計週期選「按日」、機台帳號填機台 A、結算日期涵蓋 D 與 D+1，搜尋；記錄 S1、S2、S3 三列的場次狀態與期初餘額
- n: 2
  action: 機台帳號改填機台 B，結算日期涵蓋 S1' 與 S2' 所屬營業日，搜尋；記錄 S1'、S2' 兩列的期初餘額
expected_result: 機台 A：S1 期初餘額＝0（開分起始）、S2 期初餘額＝R1（承接洗分餘數，AC 範例 900）、S3 期初餘額＝R2（日結結算轉入，AC 範例 80）；機台 B：S2' 期初餘額＝0（出金清空、無餘數承接）。
