title: 切換至機台場館後，後台選單依隱藏規則調整，不適用頁面消失
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-004
acceptance_criteria_ids:
- AC-PLATFORMRULE-0041
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台場館站台
test_data: []
steps:
- n: 1
  action: 使用頁面上方的站台切換下拉選單，切換至前置作業選定的機台場館站台
- n: 2
  action: 展開左側選單全部分類，逐一檢視各分類下目前可見的項目清單
expected_result: 選單依「機台場館的後台選單」規則調整：資訊看板分類整個消失；會員與加盟商僅剩會員列表；帳務管理僅剩鏈上錢包管理與洗分出金核實；各式報表僅剩交易紀錄查詢、注單查詢、稽核明細、場館日結報表；系統管理僅剩公告設定、Free
  Spin 管理、橫幅管理、消稽核設定；遊戲商管理與後台管理員系統維持全部顯示不變——其餘屬於隱藏規則列表的項目（如加盟列表、出金審核、KYC 設定等）皆不出現於任何分類
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的後台選單
  quote: 站台切換下拉選單選到機台場館時，後台選單隱藏不適用的頁面（這些頁面的功能已由排除規則排除，現階段留著只會是空白頁）。顯示與否跟著站台切換走：同一操作者切回線上站台即恢復完整選單
