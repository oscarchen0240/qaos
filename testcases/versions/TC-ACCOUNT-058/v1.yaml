preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，切換至一個線上站台，點擊「創建會員帳號」，帳號類型選「線上」並建立
- n: 2
  action: 以 Admin 登入後台，切換至一個機台場館，點擊「創建會員帳號」，帳號類型選「機台」並建立
- n: 3
  action: 分別檢視兩個新帳號的會員紀錄，確認帳號類型欄位值
expected_result: 第一個帳號的帳號類型欄位值為「線上」；第二個帳號的帳號類型欄位值為「機台」
