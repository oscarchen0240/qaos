title: 場次進行中期間所有交易與注單皆歸屬於該場次，含結束此場次的洗分/出金交易本身
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-034
acceptance_criteria_ids:
- AC-CASHFLOW-0341
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 佈置一個進行中場次，期間發生一筆開分、一筆入金
- n: 2
  action: 查詢這兩筆交易的場次編號
- n: 3
  action: 以一筆洗分交易結束此場次
- n: 4
  action: 查詢這筆洗分交易的場次編號
expected_result: 開分與入金皆歸屬於當前這個場次；結束此場次的洗分交易本身，也歸屬於被它結束的這個場次（而非新建立的場次）
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §場次/場次如何開始與結束
  quote: 進行中期間所有的開分、入金、洗分、出金與注單，一律歸屬於這個場次；結束場次的那筆洗分／出金交易，歸屬於被它結束的場次
