title: 待確認出金由管理員手動取消：原交易視為未成立、領取按鈕由『交易處理中』恢復可領取，紅包仍為待開啟
description: 待確認出金由管理員手動取消：原交易視為未成立、領取按鈕由『交易處理中』恢復可領取，紅包仍為待開啟
