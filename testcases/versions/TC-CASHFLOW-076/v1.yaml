title: 入金 PENDING 超過 24 小時自動轉已逾時，之後收到 end-cashin 一律回 1-NO RECORD
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-012
acceptance_criteria_ids:
- AC-CASHFLOW-0121
- AC-CASHFLOW-0122
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
- negative
design_techniques:
- state_transition
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashin 建立一筆 PENDING，記錄 TXID（不呼叫 end-cashin）
- n: 2
  action: 等待該筆 PENDING 建立時間超過 24 小時（或由排程機制觸發逾時判定）
- n: 3
  action: 查詢該 PENDING 狀態，確認已轉為「已逾時」
- n: 4
  action: 以相同 TXID 呼叫 end-cashin
expected_result: PENDING 於超過 24 小時後自動轉為「已逾時」，預留額度釋放；轉為已逾時之後才收到的 end-cashin 一律回 1-NO RECORD，不變更任何資料，機台端因此停止重送、流程收斂
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-PENDING 保留期限
  quote: 入金 PENDING 保留 24 小時，逾期自動轉「已逾時」；之後再收到 end-cashin 一律回 1-NO RECORD，機台停止重送，流程收斂
assumptions:
- text: 同 REQ-CASHFLOW-008：24 小時為系統固定逾時值，非場館可調整項，測試需與環境負責人確認是否有可加速判定的測試機制，否則需真實等待 24 小時執行
  requirement_id: REQ-CASHFLOW-012
  needs_human_confirmation: true
automation_status: not_automated
