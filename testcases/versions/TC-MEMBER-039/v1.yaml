title: 人工存入可用「,」分隔一次對多筆會員編號批次執行
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-009
acceptance_criteria_ids:
- AC-MEMBER-013
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入一名既有會員的詳細資料頁，開啟人工存入面板
test_data: []
steps:
- n: 1
  action: 確認會員編號欄已預設帶入當前會員編號
- n: 2
  action: 額外以「,」分隔輸入另一名不同的既有會員編號（自行從環境中選定，兩筆會員編號需彼此不同）
- n: 3
  action: 填寫金額、前台備注、後台備注等其他必填欄位後點擊儲存
expected_result: 系統對輸入的所有會員編號（當前會員與額外輸入的另一名會員）各自執行一筆相同金額的人工存入操作
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 帳務資訊
  quote: 會員編號｜預設帶入當前會員編號；亦可使用「,」分隔多個會員編號，一次對多筆會員執行操作
