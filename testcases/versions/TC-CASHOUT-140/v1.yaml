preconditions:
- 以管理員或站長登入後台（本案從頭到尾使用同一個後台帳號），頁面標題下方的站台切換下拉選單切到本案機台場館所屬的站台。
- 【環境前提，佈置方式 spec 與派發包均未定義，需環境負責人確認】本案需要一個既有的機台帳號（自行從環境中選定，該機台帳號即會員編號），其機台餘額可被調整為指定值（399.6），且機台端（前台，非後台）可由玩家按『結算』鍵（CASHOUT）執行出金。出金一律全額並清空餘額，所以每次出金前都要重新把餘額調到指定值。『如何把機台餘額調到指定值』（遊戲結果、人工開分、機台端測試工具等）不在
  spec 範圍，是我推測需要由環境負責人提供；後台洗分出金核實頁不會憑空產生出金紀錄（紀錄由機台端已完成的交易自動產生），因此後台單獨無法執行本案。若無法佈置為指定值，請回報環境負責人，不要以其他金額替代後逕行判定。
- 使用桌面版 Chrome（或 Edge）開發者工具（F12）：Network 面板勾選 Preserve log、篩選 Fetch/XHR；本案利用其『Replay XHR』與『Copy as fetch』功能重送請求。核實 API 的網址與請求格式
  spec 未定義，一律以 Network 面板實際擷取為準。
- 【執行輪次】本案至少執行 2 輪，每輪使用一筆新的待核實出金（核實不可撤銷，用過即不可重用）。
- 測試期間該站台（使用測試站台與測試機台帳號）不應有其他出金／洗分交易、核實或作廢，也不要對選定機台帳號的會員做其他存提款或人工操作，避免干擾會員列表與日結報表的前後差值（欄位可能已有既有累計值，不要求為 0，一律取前後差值比對）。
- 核實與作廢一經確認皆不可撤銷，且會進入場館日結報表的統計；本案只使用測試站台、測試機台帳號產生的紀錄，不得對正式營運資料執行，本案產生的紀錄不與其他 TC 共用。
test_data:
- name: 出金面額（機台餘額）
  value: '399.6'
  note: 含小數，使重複累計呈現 +799.2 而容易辨識
- name: 預期提款次數差（每輪）
  value: '+1'
  note: 不是 +2 或更多
- name: 預期提款金額差（每輪）
  value: '+399.6'
  note: 不是 +799.2
- name: 重放方式
  value: (a) 同一 JS 週期內連續兩次 click；(b) Replay XHR 重送一次；(c) Copy as fetch 後並行送出 2 個
steps:
- n: 1
  action: （每輪開始）到後台『會員列表』，以選定機台帳號的會員編號查詢，記下『提款次數』N0 與『提款金額』W0（小數位照實記錄）。
  expected: 取得本輪基準 N0、W0。
- n: 2
  action: 在機台端對選定機台帳號（餘額 399.6）按『結算』執行出金，記下訂單編號 O 與面額。
  expected: 出金完成，面額數值 399.6（若不是，前提不成立，停止並回報）。
- n: 3
  action: 到『帳務管理 > 洗分出金核實』，以 O 查詢，點擊該筆『核實』開啟確認彈窗（先不要按確認）；開啟開發者工具 Network 面板並按 Clear；在 Elements 面板選取彈窗上的『確認』按鈕。
  expected: 彈窗顯示訂單編號、機台帳號、金額 399.60 與收據印出時間；Network 面板為空。
- n: 4
  action: 切到 Console，輸入 `$0.click(); $0.click();`（同一個 JS 週期內連續點擊兩次，模擬連點）。待回應完成後，記下 Network 面板中核實請求的數量與每個請求的回應（成功或拒絕）。再以 O
    重新查詢，記下 P 的核實狀態、核實人員與核實時間。
  expected: P 為『已核實』。Network 中若出現多個核實請求，至多 1 個成功，其餘為拒絕（回應非成功）；若前端在第一次點擊後即停用按鈕而只送出 1 個請求，也符合預期（如實記錄，這屬前端保護，下一步仍要驗後端）。記下此刻的核實人員與核實時間
    H1。
- n: 5
  action: 在 Network 面板找到那個『成功的』核實請求，右鍵 → Replay XHR（Chrome）重送一次，記下回應。
  expected: 重送的請求被阻擋（回應為拒絕／錯誤，不是成功；spec 要求『系統阻擋並提示』，提示字樣與狀態碼 spec 未定義，不比對）。
- n: 6
  action: 同一個成功的核實請求，右鍵 → Copy → Copy as fetch，貼到 Console，將 `fetch(...)` 陳述式改寫成 `const send = () => fetch(...)`，再執行 `Promise.all([send(),
    send()]).then(r => Promise.all(r.map(x => x.text()))).then(console.log)`（並行重放 2 個）。
  expected: 兩個並行重放請求都被阻擋（回應為拒絕／錯誤，沒有任何一個成功）。
- n: 7
  action: 重新整理洗分出金核實頁，以 O 查詢 P。
  expected: P 仍為『已核實』且只有 1 筆；核實人員與核實時間與 H1 完全相同（重放沒有覆寫）。
- n: 8
  action: 回會員列表重新查詢同一會員，讀取『提款次數』與『提款金額』。
  expected: 提款次數 ＝ N0 ＋ 1；提款金額 ＝ W0 ＋ 399.6（不是 +799.2 或更多）。
- n: 9
  action: 重複步驟 1～8 共至少 2 輪，每輪用新的出金。
  expected: 每一輪都符合各步驟的預期。
expected_result: 對同一張待核實出金，確認鈕連點與同一核實請求的重放（含並行重放）只成立一次核實：重放的請求被阻擋，核實人員與時間維持第一次的值；該機台帳號的提款次數只 +1、提款金額只累計 +399.6。
