title: 核實確認連點與同一核實請求重放：只成立一次核實，重送被阻擋，提款次數只 +1、提款金額只 +399.6，核實人員／時間不被覆寫
description: TCRiskReview RF-15：核實確認鈕連點、或以開發者工具重放同一個核實請求（含並行重放）。驗證只成立一次核實、重放請求被阻擋，會員列表提款累計不重複計入。
