title: 機台場館重置前 1 小時起提示：有待開啟紅包時，距場館日結時間 62 分鐘不提示、59 分鐘提示『未開啟的紅包將於重置時作廢』；領完後不提示
description: 機台場館重置前 1 小時起提示：有待開啟紅包時，距場館日結時間 62 分鐘不提示、59 分鐘提示『未開啟的紅包將於重置時作廢』；領完後不提示
product: ba-admin
functional_area: REDPACKET
