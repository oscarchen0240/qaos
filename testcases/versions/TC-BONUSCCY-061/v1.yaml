title: 人工存款不計入累積存款活動的累積門檻，活動不會被觸發
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-010
acceptance_criteria_ids:
- AC-BONUSCCY-015
spec_id: SPEC-BONUSCCY-002
spec_version: '1.0'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一名既有會員，其原本未達累積存款活動的累積門檻（可先於後台『優惠活動管理』查得該累積存款活動設定的累積門檻金額，再選一名累積進度低於此門檻的既有會員）
- 確認該會員在本次操作前後沒有其他系統存款同時進行，避免干擾判斷
- 人工存入操作方式依 SPEC-MEMBER-001 v0.2 §2.1.5：會員詳細資料頁帳務資訊區塊的『人工存入』按鈕，右側滑出面板填寫金額／稽核倍數／前台備注／後台備注後點擊『儲存』
test_data: []
steps:
- n: 1
  action: 記錄該會員此刻的帳戶餘額（主錢包）
- n: 2
  action: 使用『人工存入』功能，填入一筆金額足以達到累積存款活動的累積門檻，稽核倍數維持預設 1，點擊儲存
- n: 3
  action: 重新查看該會員的帳戶餘額（主錢包），並回『優惠活動管理』確認該累積存款活動是否已判定為達標並發放獎勵
expected_result: 累積存款活動的累積門檻不計入這筆人工存款金額，活動不會被觸發：帳戶餘額（主錢包）僅增加本次人工存入的金額，沒有額外的活動獎勵金額一併入帳；該累積存款活動的狀態仍為未達標
