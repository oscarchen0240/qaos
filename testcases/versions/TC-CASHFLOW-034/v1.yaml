design_techniques:
- decision_table
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證（情境四除外，該情境即為憑證已失效）
- 機台所屬場館為開通狀態、機台為啟用狀態（情境三除外，該情境即為停用或場館未開通）
test_data: []
steps:
- n: 1
  action: 情境一（機台正常啟用、場館開通）：加計後將超過場館額度上限，送出開分或入金
- n: 2
  action: 情境二（機台正常啟用、場館開通）：查無對應 PENDING 或 TXID 不符，送出 end-cashin/end-cashout
- n: 3
  action: 情境三（改為機台停用，或改為場館站台非開通狀態）：送出任一交易請求
- n: 4
  action: 情境四（機台正常啟用、場館開通，但機台憑證已失效／被重置）：送出任一交易請求
- n: 5
  action: 情境五（機台正常啟用、場館開通）：請求欄位缺漏、型別錯誤，或 currency 不符主站台核心貨幣，或金額為負，送出任一交易請求
expected_result: 五種情境分別正確回應：1-OVER LIMIT、1-NO RECORD、7-OUT OF SERVICE、9-OTHER ERROR、6-BAD DATA/FORMAT
