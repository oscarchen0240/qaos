title: 過渡期由前台依序呼叫 req-cashout 取得核可後立即回報 end-cashout，收到完成回覆當下才扣分並結束場次
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-025
acceptance_criteria_ids:
- AC-CASHFLOW-0251
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認機台暫無印表機（過渡期現況）
- n: 2
  action: 模擬前台依序呼叫：先呼叫 req-cashout 取得核可金額
- n: 3
  action: 取得核可後立即依回覆內容呼叫 end-cashout
- n: 4
  action: 觀察扣分與場次結束的確切時間點
expected_result: 扣分時點與場次結束時點皆為前台回報完成（end-cashout 成功）、平台扣分成功的當下，而非以送入列印佇列為準（過渡期無印表機、無列印佇列的概念）
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/出金（過渡期）
  quote: 扣分時點＝前台回報完成、平台扣分成功當下（不再以「送入列印佇列」為準）；場次亦於此時結束
