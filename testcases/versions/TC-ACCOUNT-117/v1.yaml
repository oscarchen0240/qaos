preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 選定一個既有、有直推下線的會員（自行從環境中選定），記錄其目前的直推人數
- n: 2
  action: 以 Admin 登入後台建立一個新的機台帳號（創建會員帳號 Modal 本身沒有任何邀請人／推薦人欄位）
- n: 3
  action: 重新檢視步驟一所選會員的直推人數
expected_result: 步驟一所選會員的直推人數在機台帳號建立前後不變；由於「創建會員帳號」Modal 本身沒有邀請人欄位，機台帳號天然不會被計入任何人的直推人數
