preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果中找到一筆已於「洗分出金核實」頁被核實過的交易，檢視其核實人員／時間欄
- n: 2
  action: 另找一筆仍待核實的機台洗分或出金交易，檢視其核實人員／時間欄
expected_result: 已核實交易顯示執行核實的後台帳號與核實時間（UTC+0）；待核實交易的此欄顯示「—」
