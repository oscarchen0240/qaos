  action: 取一個核心貨幣為 TWD 的機台主站台，在其底下已有的機台子站台（場館）
- n: 2
  action: 於該子站台的檢視情境（如機台資訊區塊或報表頁面的場館幣別欄位，若 SITELIST 頁面本身無此檢視入口則以站台列表/編輯彈窗中場館幣別的唯讀顯示值為準）檢視場館幣別
expected_result: 顯示值為 TWD，與所屬主站台的核心貨幣一致
