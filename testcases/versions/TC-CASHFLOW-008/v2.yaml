title: 入金加計後恰等於額度上限可成立並預留，超過 1 單位則 1-OVER LIMIT 且不建立 PENDING、不預留
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-007
acceptance_criteria_ids:
- AC-CASHFLOW-0071
- AC-CASHFLOW-0072
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- boundary
- negative
design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 機台已透過憑證通過認證
- 機台所屬場館為開通狀態，機台為啟用狀態
- 設定該場館額度上限為 A，並確認目前「全場館機台分數餘額合計＋已預留未入帳入金金額」恰為 A-100
test_data:
- name: 第一筆入金金額
  value: 100（使加計後恰等於上限 A）
- name: 第二筆入金金額
  value: 1（使加計後超過上限 A）
steps:
- n: 1
  action: 送出 req-cashin，金額 100，使「全場館餘額合計＋已預留未入帳金額＋本筆金額」恰等於額度上限 A
- n: 2
  action: 確認回覆建立 PENDING 並將 100 計入預留（此時全場館「餘額合計＋預留」恰為 A）
- n: 3
  action: 再送出 req-cashin，金額 1，使加計後超過額度上限 A
- n: 4
  action: 確認此筆的回覆，並確認機台未收到分數變化、無新 PENDING 產生，機台直接退鈔
expected_result: 第一筆恰等於上限：成立，建立 PENDING 並將本筆金額計入預留；第二筆超過上限：回 1-OVER LIMIT，不建立 PENDING、不預留，機台直接退鈔
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/入金
  quote: req-cashin 於場館鎖內以「全場館餘額＋已預留＋本筆金額」判定額度，未超限才建立 PENDING 並預留
assumptions: []
