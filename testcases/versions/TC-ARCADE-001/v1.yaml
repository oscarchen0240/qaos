preconditions:
- 有一個機台場館站台與一個線上站台可供對照
test_data: []
steps:
- n: 1
  action: 於站台列表分別查看該機台場館站台與該線上站台各自的網域欄位
- n: 2
  action: 以瀏覽器開啟機台場館的前台網域，尋找「註冊」入口
- n: 3
  action: 以瀏覽器開啟線上站台的前台網域，尋找「註冊」入口
expected_result: 機台場館前台找不到任何自行註冊功能；線上站台前台則正常提供註冊入口，兩者形成對照
