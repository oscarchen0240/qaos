title: 待核實的洗分或出金紀錄不計入場館現金淨收扣除項
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-031
acceptance_criteria_ids:
- AC-CASHOUT-0311
spec_id: SPEC-CASHOUT-001
