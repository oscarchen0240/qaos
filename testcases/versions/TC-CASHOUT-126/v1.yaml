test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台洗分交易與一筆待核實的機台出金交易，先於 帳務管理 > 場館日結報表（SPEC-DAILYREPORT-001 定義現金淨收欄位的頁面）記錄核實前的現金淨收數值
- n: 2
  action: 確認這兩筆紀錄皆維持待核實狀態，不執行任何核實動作
- n: 3
  action: 再次檢視場館日結報表的現金淨收數值
expected_result: 現金淨收數值不因這兩筆待核實紀錄而變動；待核實的洗分與出金皆不計入現金淨收的扣除項
