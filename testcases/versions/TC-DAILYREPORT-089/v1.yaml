title: 統計週期為按週時，期末餘額取週內最後一個營業日的值，而非該週各日加總
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-014
acceptance_criteria_ids:
- AC-DAILYREPORT-0142
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個場館，確認其在某個週期間（週一至週日）內至少兩個營業日皆有結算資料，且各營業日期末餘額不同
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計維度選『依場館彙總』，統計週期選『按日』，結算日期涵蓋該週的各營業日，查詢，記錄每個營業日的期末餘額（尤其是週內最後一個營業日）
- n: 2
  action: 統計週期改選『按週』，結算日期涵蓋同一週，查詢，檢視該週那一列的期末餘額
expected_result: 按週那一列顯示的期末餘額，等於步驟1中『週內最後一個營業日』單日的期末餘額，而非該週所有營業日期末餘額的加總或平均
