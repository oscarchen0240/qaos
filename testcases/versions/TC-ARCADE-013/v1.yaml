title: 稽核倍數調整為大於 0 並儲存後，尚未完成稽核的部分會使機台洗分／出金的核可金額被扣減
product: ba-admin
functional_area: ARCADE
requirement_ids:
- REQ-ARCADE-004
acceptance_criteria_ids:
- AC-ARCADE-004
spec_id: SPEC-ARCADE-001
spec_version: '0.7'
test_level: ui_e2e
test_types:
- functional
- boundary
design_techniques:
- scenario
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有機台場館，並記錄其下一台既有機台帳號（作為稽核倍數調整後的觀察對象）
test_data:
- name: 稽核倍數設定值
  value: 大於 0 的任意值（例如 2）
steps:
- n: 1
  action: 站台切換至該機台場館，進入『帳務管理 > 鏈上錢包管理 > TWD』頁籤，將稽核倍數由目前值修改為一個大於 0 的數值（例如 2），儲存
- n: 2
  action: 使該機台帳號完成一筆機台開分或機台入金交易，使其產生尚未完成稽核的累計金額（此步驟涉及機台端硬體現場流程與稽核判定的具體計算方式，非本 spec 摘錄段落定義範圍，見下方假設）
- n: 3
  action: 在該筆開分/入金完成、稽核尚未完成的狀態下，嘗試對該機台帳號執行洗分或出金操作，檢視系統核可的金額
expected_result: 洗分或出金的核可金額因尚未完成稽核的部分而被扣除，明顯低於未設定稽核倍數（0倍）時應得的全額；若扣除後金額為 0，機台畫面顯示餘額不足。此結果證明剛才在鏈上錢包管理 TWD 頁籤儲存的稽核倍數確實套用於後續的機台開分與入金稽核門檻計算，而不是僅停留在設定畫面本身沒有實際生效
expected_result_spec_reference:
  spec_id: SPEC-ARCADE-001
  spec_version: '0.7'
  location: 機台帳號的稽核／稽核規則表
  quote: 倍數大於 0 時 | 洗分與出金的核可金額須扣除尚未完成稽核的部分；扣除後為 0 時視同餘額不足，機台畫面顯示餘額不足
assumptions:
- text: 本 TC 涉及兩個超出本次精讀 spec 段落定義範圍的環節，皆需環境負責人協助確認：①使機台帳號實際產生開分/入金交易，依賴機台端硬體現場流程，非後台 UI 可直接觸發；②稽核倍數轉換為『未完成稽核金額』的精確計算公式（例如倍數如何與單筆或累計金額相乘、稽核在什麼條件下視為『完成』）不在本次精讀的
    140-232行/760-819行段落中，該計算細節可能屬SPEC-CASHFLOW-001（既有出金設定的稽核倍數機制）延伸範圍；本 TC 僅定性驗證『調高倍數後核可金額確實受影響』這個功能連動是否成立，不驗證扣減金額的精確數字是否正確——精確算式的驗證應由稽核倍數機制本身既有的
    spec 與其 TC 負責，避免本 TC 重複驗證不屬於ARCADE 開發包範圍的計算公式。
  requirement_id: REQ-ARCADE-004
  needs_human_confirmation: false
  resolved_by_approval: APR-0157
