title: 追加預算後端驗證：略過前端直接呼叫 API，新總預算不大於目前總預算被拒絕、總預算維持不變、不寫入操作紀錄
description: 追加預算後端驗證：略過前端直接呼叫 API，新總預算不大於目前總預算被拒絕、總預算維持不變、不寫入操作紀錄
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-016
acceptance_criteria_ids:
- AC-REDPACKET-0168
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: api
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義，需工程提供】測試人員可用 API 工具（例如 REST 客戶端或瀏覽器開發者工具）以指定後台帳號的登入身分直接呼叫後端 API；各 API 的端點、參數與認證方式 spec 未定義，由工程提供。錯誤代碼與 HTTP
  狀態碼由後端定義，本案只核對『被拒絕』與『資料不變』
- 【環境前提，spec 未定義，需環境負責人確認】7.4 操作紀錄是實體機台正本規劃新增的頁面（手冊 v01 尚未定義），其選單路徑與可檢視角色隨該頁定義、目前 spec 未載明；由環境負責人告知入口，並確認本案登入角色可檢視；記下該頁目前的紀錄筆數
- 【清空後依序佈置】建立活動『RP-TOPUP-API』：活動幣種 USDT、重置方式每日、活動時間『永久』、預設規則（門檻 1000／上限 5／固定 10／稽核 1）、總預算 5000；儲存後確認狀態為『進行中』
test_data:
- name: 原總預算
  value: 5000
- name: API 測試值
  value: 新總預算 4000、5000
steps:
- n: 1
  action: 以管理員身分用 API 工具直接呼叫『追加預算』API，新總預算 4000
  expected: 後端拒絕，不修改資料
- n: 2
  action: 再呼叫一次，新總預算 5000（等於目前總預算）
  expected: 後端拒絕，不修改資料
- n: 3
  action: 回到『活動排程 > 紅包活動』檢視該活動的預算使用，並開啟紅包明細檢視頂部總預算
  expected: 總預算維持 5,000
- n: 4
  action: 進入 7.4 操作紀錄頁（入口依環境前提），檢視是否新增紀錄
  expected: 沒有新增任何追加預算紀錄（筆數與前置條件記下的相同）
- n: 5
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 略過前端、直接呼叫追加預算 API 且新總預算（4000、5000）不大於目前總預算 5000 時，後端拒絕；總預算維持 5,000，且不寫入 7.4 操作紀錄。
