title: 未兌現金額不受統計週期切分方式影響，四種統計週期下數值一致
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-015
acceptance_criteria_ids:
- AC-DAILYREPORT-0152
