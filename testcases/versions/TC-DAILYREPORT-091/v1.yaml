- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個目前有未兌現金額（收據尚待核實）的既有場館或機台
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計週期選『按日』，結算日期設為涵蓋今日的單日，查詢，記錄該機台／場館的未兌現金額
- n: 2
  action: 統計週期改選『按週』『按月』『區間合計』（結算日期涵蓋同一段包含今日的區間），分別查詢，記錄每種週期下的未兌現金額
expected_result: 四種統計週期下，同一機台／場館的未兌現金額數值皆相同，不因統計週期的彙總方式不同而改變——未兌現金額一律為截至查詢當下的累計值，不受統計週期切分影響
