title: 新建機台主站台的鏈上錢包管理 TWD 頁籤可見稽核倍數欄位，初始預設值為 0
product: ba-admin
functional_area: ARCADE
requirement_ids:
- REQ-ARCADE-004
acceptance_criteria_ids:
- AC-ARCADE-004
spec_id: SPEC-ARCADE-001
spec_version: '0.7'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 於後台『站台列表』新增一個全新的機台主站台（站台類型選擇「機台」，依畫面指示填寫其餘必要欄位後建立），確保稽核倍數尚未被任何人調整過，記錄新建立站台的名稱以利後續操作（刻意新建而非沿用既有場館，避免既有場館的稽核倍數可能已被他人調整過、導致無法驗證真正的初始預設值）
test_data:
- name: 稽核倍數初始值
  value: 0
steps:
- n: 1
  action: 站台切換下拉選單切換至剛建立的機台主站台
- n: 2
  action: 進入『帳務管理 > 鏈上錢包管理』，檢視頁籤列
- n: 3
  action: 點開 TWD 頁籤，檢視稽核倍數設定欄位目前顯示的數值
expected_result: 頁籤列僅顯示「TWD」（法幣）頁籤；TWD 頁籤內可見稽核倍數設定欄位，欄位當下顯示值為 0（尚未經任何調整的初始預設值）
expected_result_spec_reference:
  spec_id: SPEC-ARCADE-001
  spec_version: '0.7'
  location: 機台帳號的稽核／稽核規則表
  quote: 預設值 | **0 倍**——即開分與入金不產生稽核門檻，玩家隨時可洗分與出金
assumptions: []
automation_status: not_automated
