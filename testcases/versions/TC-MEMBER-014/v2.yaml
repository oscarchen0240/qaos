- decision_table
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入一名既有會員的詳細資料頁，開啟人工存入面板
test_data: []
steps:
- n: 1
  action: 情境一：金額等其他欄位填妥，前台備注留空、後台備注填寫，點擊儲存，觀察結果
- n: 2
  action: 情境二：金額等其他欄位填妥，前台備注填寫、後台備注留空，點擊儲存，觀察結果
- n: 3
  action: 情境三：金額等其他欄位填妥，前台備注與後台備注皆留空，點擊儲存，觀察結果
- n: 4
  action: 情境四：前台備注與後台備注皆填寫，點擊儲存，觀察結果
expected_result: 情境一、二、三皆被系統阻擋，不允許在缺少任一（或兩個）必填備注的情況下送出；情境四（兩者皆填寫）成功送出
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.1.5 帳務資訊
  quote: 前台備注｜必填；填寫後顯示於會員端，作為該筆金額異動的說明 ｜ 後台備注｜必填；僅後台人員可見，作為該筆操作紀錄的內部說明
