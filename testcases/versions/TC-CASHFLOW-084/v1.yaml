title: 已有效出金 PENDING 時再次送出 req-cashout，舊 PENDING 被標記失效並建立新 PENDING，全程只有一筆有效
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-019
- REQ-CASHFLOW-022
acceptance_criteria_ids:
- AC-CASHFLOW-0191
- AC-CASHFLOW-0221
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashout 建立第一筆出金 PENDING，記錄 TXID1（不呼叫 end-cashout）
- n: 2
  action: 再次呼叫 req-cashout（模擬玩家再次按下結算鍵），記錄 TXID2
- n: 3
  action: 確認 TXID1 是否已被標記失效
- n: 4
  action: 以 TXID1 呼叫 end-cashout（驗證舊 PENDING 是否真的已失效）
expected_result: 第二次 req-cashout 建立新 PENDING（TXID2）前，先將既存的 TXID1 標記失效，全程同一時間只有一筆有效出金 PENDING；之後以已失效的 TXID1 呼叫 end-cashout，因查無有效對應
  PENDING 而回 1-NO RECORD（依 REQ-CASHFLOW-022），不會誤將舊請求完成扣分
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-出金
  quote: 同一帳號同時只允許一筆有效出金 PENDING；收到 req-cashout 時若已有既存 PENDING，必須先標記失效再建立新的｜收到 end-cashout 但查無 PENDING 或 TXID 不符時，僅記錄 log
    後丟棄，回 1-NO RECORD
