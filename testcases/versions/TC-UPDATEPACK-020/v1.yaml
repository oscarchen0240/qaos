title: 已啟用兩種以上幣別時，側邊簡易資料面板與會員詳細資料頁的三個餘額類欄位皆顯示展開箭頭
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-002
acceptance_criteria_ids:
- AC-UPDATEPACK-0022
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個已啟用兩種以上幣別的既有線上站台，並選定該站台下一名既有會員
test_data: []
steps:
- n: 1
  action: 於會員列表點開該會員列，開啟『側邊簡易資料面板』，檢視〈帳戶資訊〉的帳戶餘額（主錢包）、提領所需有效投注額（流水錢包）、可提領餘額三欄
- n: 2
  action: 改開啟該會員的『會員詳細資料頁』，檢視〈帳務資訊〉同樣的三個欄位
expected_result: 側邊簡易資料面板與會員詳細資料頁的三個餘額類欄位（帳戶餘額、提領所需有效投注額、可提領餘額）皆顯示展開箭頭
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示/顯示規則
  quote: 展開箭頭顯示條件 | 已啟用幣種超過一種時才顯示展開箭頭；僅啟用一種幣別的站台不顯示箭頭，維持單行呈現
