title: 所有規則共用一個預算池：預設規則與等級規則的紅包合計占用同一份總預算；剩餘預算恰等於抽出金額仍可產生、不足則不產生並標示預算用罄
description: 所有規則共用一個預算池：預設規則與等級規則的紅包合計占用同一份總預算；剩餘預算恰等於抽出金額仍可產生、不足則不產生並標示預算用罄
product: ba-admin
functional_area: REDPACKET
