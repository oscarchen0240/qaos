priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定兩名既有線上會員且 VIP 等級序號不同：玩家 A（等級序號 b，未被任何等級規則勾選，適用預設規則）、玩家 B（等級序號 s，被等級規則 1 勾選）；兩人本週期無注單計入累計。【環境前提】若環境中的會員等級與此不符，需有可立即改變測試會員
  VIP 等級序號的辦法（6.2 僅定義自動升降的評估週期），由環境負責人提供
test_data:
- name: 總預算
  value: 100
- name: 預設規則
  value: 門檻 100／上限 5／固定 40／稽核 1
- name: 等級規則 1（序號 s）
  value: 門檻 100／上限 5／固定 30／稽核 1
- name: 下注
  value: A 100、B 100、B 100、A 100
steps:
- n: 1
  action: 建立活動『RP-POOL』（活動時間『永久』）：活動幣種 USDT；總預算 100；預設規則門檻 100／上限 5／固定 40／稽核 1；等級規則 1 勾選序號 s（門檻 100／上限 5／固定 30／稽核 1）；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 玩家 A（預設規則）結算有效流水貢獻 100
  expected: 產生 1 個紅包 40；活動排程列表的預算使用顯示 40 ／ 100
- n: 3
  action: 玩家 B（等級規則 1）結算有效流水貢獻 100
  expected: 產生 1 個紅包 30；預算使用顯示 70 ／ 100（兩個規則共用同一池，占用＝40＋30）
- n: 4
  action: 玩家 A 依領取流程領取自己的紅包（40 入帳）
  expected: 預算使用仍為 70 ／ 100（占用＝已入帳＋待開啟，領取不改變占用）
- n: 5
  action: 玩家 B 再結算有效流水貢獻 100
  expected: 剩餘預算 30 恰等於抽出金額 30：仍可產生，產生第 2 個等級規則紅包；預算使用 100 ／ 100
- n: 6
  action: 玩家 A 再結算有效流水貢獻 100
  expected: 抽出金額 40 大於剩餘預算 0：不產生紅包；活動排程列表該活動狀態旁標示『預算用罄』；紅包明細共 3 筆（A 的 1 筆、B 的 2 筆）
- n: 7
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 預算占用＝已入帳＋待開啟紅包金額，所有規則共用一池：A（預設規則 40）與 B（等級規則 30）合計占用 70；剩餘預算 30 恰等於抽出金額 30 時仍可產生（占用 100 ／ 100）；剩餘 0 而抽出 40
  時不產生，並標示『預算用罄』。
