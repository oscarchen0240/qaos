preconditions:
- 站台樹（由環境負責人準備；站台與帳號皆自行對應，不指定編號）：根站台 admin 底下有兩個互相平行的機台類型主站台 P1、P2；P1 底下有機台類型子站台 S1、S2（互相平行），S1 底下再有機台類型子站台 S1a；P2 底下有機台類型子站台
  T1。依站台列表 spec，子站台與主站台同類型、機台類型站台（含主站台）皆帶機台專屬欄位，故 P1、S1、S1a、S2、P2、T1 皆視為場館
- 以P1 站台的管理員帳號（由環境負責人提供）登入後台（P1 為根站台 admin 底下的主站台，非根站台）
- （對照組）事先確認以根站台 admin 的管理員帳號（由環境負責人提供）登入時，站台切換下拉選單含 S1、S1a、S2 與 T1，避免把『場館不存在』誤判為『管理員看不到』
steps:
- n: 1
  action: 以 P1 站台的管理員登入後台，展開 站台切換下拉選單，完整記錄選單中所有項目
- n: 2
  action: 檢視選單內是否含 P1（自身）、S1、S1a、S2（P1 的子站台）
- n: 3
  action: 檢視選單內是否出現 P2 或 T1（平行主站台及其底下的場館）
expected_result: 選單可見 P1（自身站台）及其所有子站台下的場館 S1、S1a、S2；平行的另一主站台 P2 及其底下的場館 T1 皆不可見（選單中查無）
