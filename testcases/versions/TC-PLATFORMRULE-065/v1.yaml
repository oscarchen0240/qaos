test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
preconditions:
- 以操作員身分登入後台
- 站台切換選單已選定自身所屬的機台場館
- 該場館已有至少一筆注單與一筆機台開分／入金交易（供稽核明細顯示）
test_data: []
steps:
- n: 1
  action: 展開左側選單「各式報表」分類
- n: 2
  action: 點擊「注單查詢」，以涵蓋既有注單的日期範圍查詢
- n: 3
  action: 點擊「稽核明細」，以涵蓋既有交易的日期範圍查詢
expected_result: 各式報表分類含「注單查詢」與「稽核明細」兩項；兩頁皆可進入，查詢回傳自身場館的資料（注單查詢至少含該筆注單；稽核明細至少含該筆機台開分／入金）
