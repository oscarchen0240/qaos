preconditions:
- 以站長身分登入 ba-admin 後台
- 進入「站台列表」頁面（預設顯示自身管轄範圍）
test_data: []
steps:
- n: 1
  action: 點擊「+ 新增站台」，檢視表單是否有模板欄位
- n: 2
  action: 編輯自身管轄範圍內一個已有模板的站台，檢視模板欄位的呈現方式並嘗試修改
expected_result: 新增畫面不顯示模板欄位；編輯畫面模板欄位唯讀顯示目前值，無法修改
