title: 收合狀態的帳戶餘額欄顯示的即為核心貨幣錢包的原始餘額
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-003
acceptance_criteria_ids:
- AC-UPDATEPACK-0031
spec_id: SPEC-UPDATEPACK-001
