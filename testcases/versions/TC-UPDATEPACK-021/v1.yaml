test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個已啟用兩種以上幣別的既有線上站台（核心貨幣為 USDT），並選定一名同時持有核心貨幣與至少一種非核心貨幣餘額的既有會員；若當前環境找不到現成案例，需先於『帳務管理 > 鏈上錢包管理』確認幣別已啟用，並尋找已有跨幣別餘額紀錄的會員
test_data: []
steps:
- n: 1
  action: 先展開該會員的帳戶餘額欄，記錄核心貨幣（USDT）那一列顯示的金額
- n: 2
  action: 收合該欄位，檢視收合狀態顯示的數值
expected_result: 收合狀態顯示的數值，與展開後核心貨幣（USDT）那一列的金額完全相同
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示/顯示規則
  quote: 收合時顯示的數值 | 該站台核心貨幣錢包的餘額——不做匯率換算，也不是各幣別的加總。核心貨幣為主站台層級的設定，底下子站台一律繼承、不可各自指定
