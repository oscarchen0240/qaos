steps:
- n: 1
  action: 後台讀 M 分數，記為 B0；M 送出 req-cashin，金額 100，之後不送 end-cashin；記下後台 4.1 該筆的建立時間 T0（UTC+0）
  expected: 回 0-OK 取得 TXID_A；該筆狀態『待確認』
- n: 2
  action: 在 T0 + 23 小時 50 分左右（尚未滿 24 小時）重新查詢 4.1 該筆，並讀 M 分數
  expected: 仍為『待確認』（尚未滿 24 小時不應逾時）；M 分數 = B0
- n: 3
  action: T0 + 24 小時之後，每隔一段時間重新整理 4.1 該筆，記錄實際看到轉為『已逾時』的時間；轉換後讀 M 分數
  expected: 該筆轉為『已逾時』；M 分數仍為 B0，沒有增加
test_data:
- name: 入金金額
