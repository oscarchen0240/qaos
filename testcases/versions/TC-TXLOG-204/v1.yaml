title: 未成立原因欄僅在交易狀態為未成立時顯示內容，其餘狀態不顯示
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-023
acceptance_criteria_ids:
- AC-TXLOG-0231
- AC-TXLOG-0232
