spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果中找到一筆未成立狀態的交易，檢視其未成立原因欄
- n: 2
  action: 另找一筆已完成狀態的交易，檢視其未成立原因欄
expected_result: 未成立狀態的交易，未成立原因欄顯示對應的拒絕原因文字（內容依 SPEC-CASHFLOW-001 定義的對照表）；已完成狀態的交易，此欄不顯示內容（或顯示「—」）
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §列表欄位
  quote: 未成立原因 | 僅「未成立」狀態顯示，內容見「交易不成立的原因」對照表（定義於開發包③／正本）
