title: 洗分因門檻計算實際金額小於店員原輸入金額時，本欄顯示實際金額且應以此欄付現
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-018
acceptance_criteria_ids:
- AC-CASHOUT-0181
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得（或使機台端門檻計算產生）一筆洗分交易，其實際入帳金額小於店員操作機台時輸入的金額（門檻換算邏輯屬開發包③ CASHFLOW 管轄，本 TC 不重新驗證門檻計算本身是否正確，只需借用一筆已滿足『實際金額 < 原輸入金額』條件的交易）
- n: 2
  action: 於本頁檢視該筆紀錄的實際金額欄
expected_result: 顯示門檻計算後的實際金額（小於原輸入金額），且此欄位是店員付現的唯一依據，不是原輸入金額
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §列表欄位
  quote: 實際金額 | 實際異動的金額。洗分因門檻計算可能小於店員輸入的金額，付現一律以本欄為準；出金即收據面額
