assumptions:
- text: RM REQ-009 ambiguity（major）：營業日內『逾時結束』場次是否計入『當日結束的場次筆數』、歸屬哪個營業日，v0.2 與 CLR-007 皆未涵蓋（已送 PM、尚未回覆）；本 TC 選用不含逾時結束場次的機台與營業日，只斷言已結束＋日結結算的計入，不對逾時結束作任何預期
  requirement_id: REQ-DAILYREPORT-009
  needs_human_confirmation: true
