title: 日結結算狀態的場次同樣計入當日場次數，不因是被強制結束而排除（不涵蓋逾時結束場次）
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-009
acceptance_criteria_ids:
- AC-DAILYREPORT-0091
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 已以管理員登入後台（所選機台須在該管理員的管轄範圍內），並切換至機台場館站台（Arcade）
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 選定一台既有機台 A（自行從環境中選定，須在該管理員管轄範圍內的場館），機台 A 在某個過去營業日 D（單一營業日）的場次記錄同時包含狀態「已結束」與「日結結算」兩種（可於機台交易紀錄依場次狀態篩選查找；日結結算場次歸屬於場次「開始」的營業日）
- 機台 A 在營業日 D 內沒有狀態「逾時結束」的場次，也沒有「進行中」的場次（逾時結束場次是否計入「當日結束的場次筆數」本 spec 未定義，見 assumption；為避免干擾，選用不含此狀態的機台與營業日）
test_data: []
steps:
- n: 1
  action: 於機台交易紀錄核對機台 A 在營業日 D（依日結時間 T 切分的時間範圍）的場次狀態分布，分別記錄「已結束」與「日結結算」各自的筆數
- n: 2
  action: 進入 各式報表 > 場館日結報表，統計維度選「依機台明細」、統計週期選「按日」、機台帳號填機台 A、結算日期設為營業日 D（起迄同一天），搜尋，找到機台 A 在營業日 D 的列，檢視「場次數」
expected_result: 機台 A 在營業日 D 的場次數＝已結束場次數＋日結結算場次數，不含進行中場次；日結結算狀態的場次（因日結時間到達被系統強制結束）同樣計入當日場次數，歸屬於其開始的營業日，不因被強制結束而被排除。本 TC 不涵蓋「逾時結束」狀態的場次。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §列表欄位/場次數（日結結算歸屬開始的營業日依 CLR-DAILYREPORT-007）
  quote: 為當日結束的場次筆數：依機台明細＝該機台帳號當日的場次數
automation_status: not_automated
