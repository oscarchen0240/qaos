title: 列表底部依交易類型分列顯示金額總計，且與該類型交易的金額加總一致
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-018
acceptance_criteria_ids:
- AC-TXLOG-0181
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 篩選出一批包含至少兩種交易類型（例如開分與出金）的查詢結果
- n: 2
  action: 人工加總結果中各交易類型的金額（依實際金額欄，或依 spec 定義的金額口徑）
- n: 3
  action: 檢視列表底部的分類總計
expected_result: 列表底部顯示依交易類型分列的金額總計，且每個類型的總計數字與人工加總該類型所有交易金額的結果一致
