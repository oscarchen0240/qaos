design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長，或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）；財務角色能否檢視紅包明細、取消排程尚未定義（CLR-REDPACKET-015），所以除 023 系列案例外一律不用財務角色執行
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
test_data:
- name: 第二個活動區間
  value: 今天+30日 ～ +60日
steps:
- n: 1
  action: 建立活動『RP-PERM』：活動時間選『永久』；其餘合法；儲存
  expected: 建立成功，狀態進行中（若列表顯示活動尚未生效，等其生效；狀態文字與位置只記錄）
- n: 2
  action: 新增活動『RP-PERM-2』：活動時間選『區間』，起＝今天起算 +30 日、迄＝+60 日（UTC+0）；其餘合法；儲存
  expected: 阻擋儲存；活動排程無『RP-PERM-2』
- n: 3
  action: 清理：取消『RP-PERM』的排程
  expected: 已取消
expected_result: 已有永久生效的進行中紅包活動時，即使新活動的區間在遙遠的未來也阻擋儲存。
