title: 依機台明細的損益以機台（會員）端計算：玩家淨贏的機台顯示正值綠色，玩家淨輸的機台顯示負值紅色
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-013
acceptance_criteria_ids:
- AC-DAILYREPORT-0134
- AC-DAILYREPORT-0135
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 選定一個過去營業日 D。測試場館下有兩台既有機台（自行從環境中選定）：機台 A 在 D 的派彩合計大於有效投注合計（玩家淨贏；AC 範例：有效投注 1000、派彩 1300），機台 B 在 D 的派彩合計小於有效投注合計（玩家淨輸；AC 範例：有效投注
  1000、派彩 800）
- 各機台在 D 的有效投注與派彩由該機台對應會員的投注紀錄取得（投注紀錄入口與欄位本報表 spec 未定義，由環境負責人指引）；若環境中找不到符合條件的機台，由環境負責人以機台前台遊玩累積或造數，不自行假設結果
test_data:
- name: AC-0134 示意
  value: 有效投注 1000、派彩 1300 → 損益 +300（綠）
- name: AC-0135 示意
  value: 有效投注 1000、派彩 800 → 損益 −200（紅）
steps:
- n: 1
  action: 統計維度選「依機台明細」、統計週期選「按日」、機台帳號填機台 A、結算日期選 D（單一營業日），搜尋；記錄機台 A 列的損益（數值、正負號、顏色）
- n: 2
  action: 機台帳號改填機台 B，其餘條件不變，搜尋；記錄機台 B 列的損益（數值、正負號、顏色）
- n: 3
  action: 於兩台機台對應會員的投注紀錄，各自加總營業日 D 內全部注單的有效投注額與派彩，計算機台端損益＝派彩 − 有效投注額
expected_result: 機台 A 列損益＝派彩 − 有效投注額（AC 範例 +300）：為正值、綠色，不是其相反數（非 −300）；機台 B 列損益＝派彩 − 有效投注額（AC 範例 −200）：為負值、紅色。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §列表欄位/損益（v0.2 新增機台端視角）
  quote: 以機台（會員）端計算——正值代表玩家淨贏、機台分數增加（與手冊「直推總損益／會員損益」的視角一致；平台視角另用「派彩」一詞）。正值綠色、負值紅色
