title: 麵包屑第一層顯示站台切換選單所選的場館，且不提供切換其他場館的控制項
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-025
acceptance_criteria_ids:
- AC-DAILYREPORT-0255
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台，其管轄範圍內有至少兩個可查詢場館日結報表的站台（其一為機台場館站台 Arcade；另一個由環境負責人提供，若環境僅有 Arcade 一個，則只執行步驟 1 並於結果註記）
- 進入 各式報表 > 場館日結報表
test_data: []
steps:
- n: 1
  action: 在頁面標題下方的站台切換下拉選單選擇站台 X1（Arcade），搜尋；檢視麵包屑第一層顯示的場館名，並檢視第一層是否有下拉選單、切換按鈕或其他可切換場館的控制項
- n: 2
  action: 在站台切換下拉選單改選站台 X2（另一個既有站台），搜尋；檢視麵包屑第一層顯示的場館名，以及是否有切換場館的控制項
expected_result: 步驟 1：第一層顯示站台 X1 所屬場館；步驟 2：第一層顯示站台 X2 所屬場館；兩次第一層都沒有切換其他場館的控制項（只能透過頁面標題下方的站台切換下拉選單切換）。
