execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一台目前有進行中場次的既有機台（可先於會員詳細頁『機台資訊』區塊確認該機台目前有進行中場次）
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計維度選『依場次明細』，結算日期涵蓋當日，查詢
- n: 2
  action: 找到該進行中場次所在列，檢視結束時間與場次時長欄位
expected_result: 結束時間欄顯示「—」；場次時長欄顯示自該場次開始時間至目前查詢當下的累計時間差（而非固定值，重新查詢應隨時間推移增加）
