title: 線上站台建立紅包活動重複送出：連點『儲存』、API 重放、並送 3 個請求（逐請求時間記錄、至少 3 個有效輪），只建立 1 個活動，玩家結算只產生 1 個紅包
description: 線上站台建立紅包活動重複送出：連點『儲存』、API 重放、並送 3 個請求（逐請求時間記錄、至少 3 個有效輪），只建立 1 個活動，玩家結算只產生 1 個紅包
product: ba-admin
functional_area: REDPACKET
