title: 櫃檯人工入金不影響紅包；櫃檯人工出金視同出金完成：待開啟紅包作廢（作廢原因『機台出金』），週期累計不歸零
description: 櫃檯人工入金不影響紅包；櫃檯人工出金視同出金完成：待開啟紅包作廢（作廢原因『機台出金』），週期累計不歸零
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-028
acceptance_criteria_ids:
- AC-REDPACKET-0288
- AC-REDPACKET-0289
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: integration
test_types:
- negative
- functional
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 機台帳號 M1（自行從環境中選定，本週期無注單；分數餘額可在『會員與加盟商 > 會員列表』帳號類型篩「機台」、所屬站台選該場館時，由 M1 的餘額欄查看；結算出金前餘額須大於 0，若為 0 先由店員對 M1 開分補足）
- 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
- 【環境前提，spec 未定義操作入口，需環境負責人告知】櫃檯對機台帳號執行『人工入金』與『人工出金』的後台操作入口與可用角色（SPEC-ARCADE-001 只列『人工入金／出金（櫃檯）』三種角色皆可操作，未載明頁面路徑）；本案用管理員或站長身分操作
test_data:
- name: 活動
  value: 門檻 300／上限 5／固定 20／稽核 0
- name: 下注
  value: M1 300；之後 300
steps:
- n: 1
  action: 建立機台場館紅包活動『RP-MANUAL』（永久）：每日重置；預設規則門檻 300／上限 5／固定 20／稽核 0；儲存；M1 結算有效流水貢獻 300
  expected: 產生 1 個待開啟紅包 P1，週期累計 300
- n: 2
  action: 【AC-0289】櫃檯對 M1 執行『人工入金』（任意金額，例如 100）
  expected: 人工入金完成
- n: 3
  action: 在 M1 前台點紅包圖示開啟紅包視窗，檢視領取按鈕；後台檢視紅包明細 P1
  expected: P1 仍為『待開啟』、領取按鈕可點（可領取；人工入金不影響紅包），本步驟不領取
- n: 4
  action: 【AC-0288】櫃檯對 M1 執行『人工出金』（出金全部餘額）
  expected: 人工出金完成
- n: 5
  action: 後台紅包明細檢視 P1
  expected: 視同出金完成：P1 狀態『已作廢』、作廢原因『機台出金』
- n: 6
  action: M1 在機台前台再結算有效流水貢獻 300（需先由店員對 M1 開分使分數大於 0）
  expected: 累計沒有因人工出金歸零：產生第 2 個紅包 P2，紅包明細『週期累計』顯示 600（300＋300；若累計歸零則為 300）
- n: 7
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 人工入金不影響紅包（P1 仍待開啟、可領取）；人工出金視同出金完成：P1 作廢（作廢原因『機台出金』），週期累計不歸零（下一個紅包的週期累計為 600）。
