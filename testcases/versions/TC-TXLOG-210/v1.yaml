title: 本頁僅提供查看明細操作，不提供手動取消、不提供核實相關操作，核實狀態欄位純顯示無法編輯
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-028
- REQ-TXLOG-021
- REQ-TXLOG-030
acceptance_criteria_ids:
- AC-TXLOG-0281
- AC-TXLOG-0214
- AC-TXLOG-0301
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: critical
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 檢視本頁（交易紀錄查詢）任一筆待確認狀態的交易，逐一檢查該列可見的所有按鈕／操作入口
- n: 2
  action: 嘗試在列表或前一步開啟的右側明細面板中尋找任何可修改核實狀態的欄位或按鈕
- n: 3
  action: 嘗試尋找任何標示為「手動取消」的按鈕或操作入口，並確認整頁範圍內（含各交易狀態的列）皆不存在
expected_result: 本頁唯一可執行的操作只有「查看明細」；不存在任何手動取消的按鈕或入口（spec.md 原文描述的『Admin 可手動取消待確認交易』已由 PM 於 2026-09-14／CLR-TXLOG-001 確認為錯誤敘述，非現行產品行為）；核實狀態欄純顯示文字，無任何輸入框、下拉或按鈕可供修改——凡待確認／待核實交易需要的人工處理，一律於「洗分出金核實」頁（SPEC-CASHOUT-001）進行，不在本頁
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §操作
  quote: 手動取消：僅 Admin 可對「待確認」狀態的交易執行；二次確認後標記為「已取消」，分數不異動（＊此操作不存在於現行產品，見 Oscar 2026-09-14 確認）
assumptions: []
