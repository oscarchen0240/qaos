title: 於洗分出金核實頁將一筆待核實洗分核實後，報表的已核實／待核實數字對應變動
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-011
acceptance_criteria_ids:
- AC-DAILYREPORT-0114
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一筆帳務管理『洗分出金核實』頁中目前狀態為待核實的洗分項目
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，查詢該筆待核實項目所屬機台與日期，記錄目前的『已核實洗分』『待核實洗分』數值
- n: 2
  action: 前往帳務管理『洗分出金核實』頁，將該筆待核實項目核實
- n: 3
  action: 回場館日結報表，以相同篩選條件重新查詢，記錄『已核實洗分』『待核實洗分』數值
expected_result: 重新查詢後，已核實洗分金額增加該筆項目的金額，待核實洗分金額對應減少相同金額，兩者變動相符
