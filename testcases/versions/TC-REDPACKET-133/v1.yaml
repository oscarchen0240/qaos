preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
- 前台以玩家 A 登入並停留在前台畫面；另備一個可讓玩家 A 的注單結算的手段（例如在另一個視窗／裝置下注結算），使本視窗不需重新整理以外的操作
test_data:
- name: 活動
  value: 門檻 100／上限 5／固定 10／稽核 1
steps:
- n: 1
  action: 建立活動『RP-ICON』（永久）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 10／稽核 1；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 玩家 A 進入前台（尚無待開啟紅包），檢視畫面右側與右上角
  expected: 畫面右側常駐顯示暗的紅包圖示；右上角禮物圖示沒有紅點
- n: 3
  action: 點擊暗的紅包圖示
  expected: 開啟紅包視窗，可查看活動與累計進度；關閉視窗
- n: 4
  action: 玩家 A 停留在前台；另一視窗讓玩家 A 結算有效流水貢獻 100（累計達門檻、產生紅包）
  expected: 紅包圖示亮起；不自動彈出紅包視窗；右上角禮物圖示亮紅點（圖示更新所需的時間 spec 未定義，若需重新整理才更新，記錄所需操作）
- n: 5
  action: 玩家 A 點亮起的圖示開啟紅包視窗，點『領取獎勵（1）』，於確認視窗點［確認領取］（領取該唯一的待開啟紅包）
  expected: 領取完成入帳 10
- n: 6
  action: 檢視前台右側紅包圖示
  expected: 紅包圖示轉暗（已無待開啟紅包）
- n: 7
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 線上前台紅包圖示：無待開啟紅包時為暗；達標產生紅包時亮起、不自動彈出視窗，右上角禮物圖示亮紅點；領完唯一的待開啟紅包後轉暗。
