preconditions:
- 以 Admin 登入後台
- 尋找或選定一個當日已核實洗分與已兌現金額合計，明顯大於開分與進鈔金額合計的既有機台或場館（使公式計算結果為負值；若查詢範圍內找不到現成案例，可嘗試放寬結算日期或改選其他機台尋找）
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，設定選定的機台與涵蓋日期，查詢
- n: 2
  action: 檢視該列的現金淨收欄位數值，並依公式手動計算核對
expected_result: 現金淨收欄位正常顯示負值（不會被系統攔截、顯示為 0、或以錯誤訊息取代），且該負值等於依公式計算的結果——代表場館端現金應淨減少多少
