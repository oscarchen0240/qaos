title: 非按日週期（按週／區間合計）的金額欄，等於各營業日的合計，三種統計週期呈現的總額互相一致
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-015
acceptance_criteria_ids:
- AC-DAILYREPORT-0151
spec_id: SPEC-DAILYREPORT-001
