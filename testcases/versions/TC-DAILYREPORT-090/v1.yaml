test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個場館，其在同一週內至少三個營業日皆有開分交易
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計週期選『按日』，統計維度選『依場館彙總』，結算日期涵蓋該週三個（或以上）營業日，查詢，記錄每個營業日的開分金額
- n: 2
  action: 統計週期改選『按週』，同一結算日期區間，查詢，檢視該週列的開分金額
- n: 3
  action: 統計週期改選『區間合計』，同一結算日期區間，查詢，檢視該列的開分金額
expected_result: 按週列與區間合計列的開分金額皆等於步驟1各營業日開分金額的加總；三種統計週期呈現的總額互相一致，不因彙總方式不同而算出不同的總額——非按日週期不會漏算或多算任何一個營業日
