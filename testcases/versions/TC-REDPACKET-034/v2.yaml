title: 活動到期：活動轉『已結束』仍列於列表；待開啟作廢（原因活動結束、釋放預算）、已入帳維持
description: 活動到期：活動轉『已結束』仍列於列表；待開啟作廢（原因活動結束、釋放預算）、已入帳維持
