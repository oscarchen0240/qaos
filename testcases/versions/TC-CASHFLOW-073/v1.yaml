title: end-cashin 完成入帳時不再重新檢查額度上限，即使額度環境已於期間變化
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-009
acceptance_criteria_ids:
- AC-CASHFLOW-0091
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- requirement_based
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 設場館額度上限為 A，呼叫 req-cashin 送出入金金額 100 並通過（已於 req-cashin 階段判定並預留，此時全場館合計含此筆恰為 A）
- n: 2
  action: 在呼叫 end-cashin 之前，以 Admin 將該場館額度上限調降至遠低於 A 的值（模擬若重新判定必定超限的環境變化）
- n: 3
  action: 以該筆的 TXID 呼叫 end-cashin
expected_result: end-cashin 仍正常回 0-OK，關閉 PENDING、更新帳務、預留轉為實際餘額——即使此時的額度上限已被調低到理論上會超限，本階段依規則不再判定額度上限，不會因額度環境變化而失敗
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-入金
  quote: 收到 end-cashin 且 TXID 相符時，關閉 PENDING、更新帳務、把預留轉為實際餘額，回 0-OK。本階段不再判定額度上限
