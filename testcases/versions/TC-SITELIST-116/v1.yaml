title: 機台主站台自身的場館設定與其底下新建子站台的場館設定各自獨立、互不影響
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-024
acceptance_criteria_ids:
- AC-SITELIST-0241
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個機台類型的主站台（根層站台），編輯並設定其額度上限為某值 A（若尚未設定機台專屬欄位，先行設定）
- n: 2
  action: 在該主站台底下新增一個機台類型子站台（場館），設定其額度上限為不同的值 B
- n: 3
  action: 重新檢視主站台自身的額度上限，確認仍為 A；檢視新建子站台的額度上限，確認為 B
expected_result: 主站台的額度上限維持 A 不變；子站台的額度上限為 B；兩者各自一份設定，互不影響
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §站台類型與機台專屬欄位 + §業務規則-機台主站台可直接經營
  quote: 每份場館設定（額度上限、場次逾時、日結時間）的作用範圍為該站台自身、不含子站台，主站台與各場館各自一份、互不影響
