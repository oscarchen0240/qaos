title: 機台待確認出金被新出金取代：舊筆轉『已取消』，新出金仍進行中時紅包繼續鎖定；新出金完成後作廢
description: 機台待確認出金被新出金取代：舊筆轉『已取消』，新出金仍進行中時紅包繼續鎖定；新出金完成後作廢
product: ba-admin
functional_area: REDPACKET
