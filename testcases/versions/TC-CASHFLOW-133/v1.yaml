preconditions:
- 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
  M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
- 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
- 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
- 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）【環境前提，需環境負責人確認】
- 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
- 額度上限的設定：額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，所以本案以探測步驟確認新額度已生效；動手前先記下原額度上限 Q_orig，執行完畢後還原
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】本案需要機台帳號出現帶小數的分數：spec 只說明餘額帶小數來自部分遊戲派彩，沒有定義 req-keyin 是否接受小數金額，也沒有定義如何構造小數餘額。建議作法（我的推測，未經 spec
  證實）：以 req-keyin 送出只帶一位小數的金額（本案只用一位小數；小數位數上限、進位與顯示格式 spec 未定義，不在本案判定範圍）。若被拒（例如 6-BAD DATA/FORMAT）或顯示被取整，改請環境負責人以測試資料工具或指定派彩設定構造相同餘額；仍無法構造恰為指定值的餘額時，本案記為『受阻』，不可改用其他小數值替代後仍宣稱通過
- 清空機台分數的方式：用洗分（req-keyout，mode=all、throshold=0），並且不要核實這筆清空用的洗分；不要用出金清空，因為出金的收據金額會混入場館報表（此為清理手法，依 spec『稽核倍數預設 0 倍，玩家隨時可洗分』與『門檻
  0＝洗出全部餘額』）
- 本案依賴的『機台 API 請求欄位名稱與 JSON 格式』（例如 req-cashin 的金額欄、end-cashin 的實際清點金額欄、TXID 欄）spec 未定義，依機台 API 文件（J型老虎機API文件-入金出金）組成請求；本案只寫各欄位的語意與數值
- 機台 N：與 M 同一場館的另一台既有機台（自行從環境中選定，狀態『啟用』），並取得 N 現行有效的機台憑證；N 用來持有小數餘額 99.4，M 用來送出入金
- 場館內除 N 以外的機台帳號分數皆為整數（步驟 4 會核對 S 的小數部分恰為 .4；不符就換一個場館）
- 實體入鈔機只會清點出整數面額的紙鈔，所以本案的 end-cashin 清點金額一律用整數，小數只出現在『剩餘額度』
test_data:
- name: N 佈置用的開分金額
  value: 399.4
  note: 再以門檻 100 全洗，餘數 99.4 留在 N
- name: S（含 N 的 99.4 與 M 的 B0 在內的場館分數合計）
  value: 依環境讀出
  note: 小數部分應為 .4
- name: 額度上限 A
  value: S + 100.6
  note: S 的小數部分為 .4，所以 A 是整數
- name: end-cashin 實際清點金額（依序）
  value:
  - 101
  - 100
  - 1
  note: 各自對應新的 req-cashin（聲稱金額與清點金額相同）
steps:
- n: 1
  action: 把 M 所屬場館的額度上限設為 0（排除額度干擾）；記下原值 Q_orig。若 N 目前分數不是 0，先用洗分清空 N（req-keyout，mode=all、throshold=0，不核實）
  expected: N 分數為 0
- n: 2
  action: 【佈置】N 送出 req-keyin，金額 399.4
  expected: 回 0-OK，N 分數 = 399.4；若被拒或被取整，依前提處理（受阻，不可改用其他值）
- n: 3
  action: 【佈置】N 送出 req-keyout，mode=all、throshold=100
  expected: 回 0-OK，value 為 300；N 分數 = 99.4。此檢查點只確認佈置成立，不列入本案判定
- n: 4
  action: 後台讀 M 分數 B0；逐一讀出場館所有機台帳號的分數（含 N 的 99.4）並加總為 S
  expected: S 的小數部分恰為 .4；否則換場館重做
- n: 5
  action: 把額度上限設為 A = S + 100.6（整數；剩餘額度 100.6）
  expected: 額度上限 A 已儲存
- n: 6
  action: M 送出 req-cashin，金額 101，取得 TXID_1；接著送出 end-cashin（TXID_1，實際清點金額 101，超過剩餘額度 0.4）
  expected: req-cashin 回 0-OK；end-cashin 回 1-OVER LIMIT；M 分數仍為 B0。超限後 TXID_1 的去向 spec 未定義（RF-06），本案不斷言、不再重送
- n: 7
  action: M 送出 req-cashin，金額 100，取得 TXID_2；接著送出 end-cashin（TXID_2，實際清點金額 100，低於剩餘額度 0.6）
  expected: end-cashin 回 0-OK；M 分數 = B0 + 100；場館分數合計 = A − 0.6
- n: 8
  action: M 送出 req-cashin，金額 1，取得 TXID_3；接著送出 end-cashin（TXID_3，實際清點金額 1，大於此時剩餘額度 0.6）
  expected: end-cashin 回 1-OVER LIMIT；M 分數仍為 B0 + 100。若回 0-OK，表示剩餘額度 0.6 被四捨五入成 1 之類的取整誤差，記為缺陷
- n: 9
  action: 還原：額度上限改回 Q_orig；清理 M、N 的餘額（req-keyout，mode=all、throshold=0，不核實），不列入判定。TXID_1、TXID_3 留下的 PENDING 不處理
expected_result: 全場館分數合計含小數（99.4）、剩餘額度為 100.6 時，end-cashin 依整數實際清點金額精確判定：101（多 0.4）回 1-OVER LIMIT、不更新帳務；100 回 0-OK、分數增加 100；成立後剩餘額度
  0.6，再入 1 回 1-OVER LIMIT。不會把剩餘額度取整後誤放行。
