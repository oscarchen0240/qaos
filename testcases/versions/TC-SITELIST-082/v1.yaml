title: 主站台建立後核心貨幣欄位於編輯畫面唯讀，無法透過編輯變更
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-010
acceptance_criteria_ids:
- AC-SITELIST-0101
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: critical
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個既有的主站台（根層站台，自行從環境中選定；若環境中無合適的既有主站台，可依 AC-SITELIST-0011 的操作路徑，即 TC-DRAFT-01M2NCSW5C2NPYX0YR2ATYY7QA 的 step1，先建立一個後使用），點擊「編輯」，檢視核心貨幣欄位的呈現方式
- n: 2
  action: 嘗試以瀏覽器操作改變其值，並點擊「儲存變更」，儲存後重新開啟編輯畫面確認
expected_result: 核心貨幣欄位唯讀顯示，無法點選或修改；儲存後核心貨幣值與建立時相同，未被變更
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §核心貨幣 + §業務規則-核心貨幣繼承
  quote: 主站台建立後，核心貨幣不可修改（v07 定案）：比照「站台類型」，於建立時選定即永久鎖定，編輯視窗唯讀顯示
