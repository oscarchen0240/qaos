title: 人工存入前台備注與後台備注兩個必填欄位的組合驗證：任一或兩者留空即阻擋，皆填寫才允許送出
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-010
acceptance_criteria_ids:
- AC-MEMBER-014
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
