title: 代理佣金同樣一律發放進站台系統幣別，不受下線用何種幣別下注影響
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-006
acceptance_criteria_ids:
- AC-BONUSCCY-008
spec_id: SPEC-BONUSCCY-002
spec_version: '1.0'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個已啟用兩種以上幣別的線上站台
- 選定一名有代理身分、其下線近期已產生佣金基數的既有代理會員
test_data: []
steps:
- n: 1
  action: 於後台會員詳細資料頁展開該代理會員的多幣別餘額檢視，記錄目前系統幣別與其他已啟用幣別（如 TTK）錢包的餘額
- n: 2
  action: 確認該代理這筆代理佣金已結算入帳後，重新查看同一組多幣別餘額
expected_result: 代理佣金入帳後，增加的金額出現在系統幣別錢包那一列，其餘幣別錢包不因這筆佣金而變動；驗證除返水外，代理佣金這個不同計算基礎（下線流水而非自身有效投注）的紅利類型，同樣遵守一律發系統幣別的規則
