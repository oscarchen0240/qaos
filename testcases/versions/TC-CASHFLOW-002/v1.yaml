test_data: []
steps:
- n: 1
  action: 場館稽核倍數設為 1 倍，機台帳號有未完成稽核金額
- n: 2
  action: 送出洗分請求（req-keyout），檢視核可金額
- n: 3
  action: 另建構未完成稽核金額等於全部餘額的情境，送出出金請求（req-cashout）
expected_result: 第一步核可金額已扣除未完成稽核部分；第二步扣除後金額為 0，回 1-NO CREDITS，視同餘額不足
