steps:
- n: 1
  action: 點擊「+ 新增站台」，上層站台留空，站台類型選「線上」，展開核心貨幣下拉選單，檢視選項
- n: 2
  action: 另開一次「+ 新增站台」，站台類型選「機台」，展開核心貨幣下拉選單，檢視選項
expected_result: 前者下拉選單只列出 USDT 一個選項；後者只列出 TWD 一個選項
