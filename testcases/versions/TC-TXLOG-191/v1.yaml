title: 因餘額不足被拒絕的洗分或出金請求完全不寫入交易紀錄，不會以未成立狀態出現
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-016
acceptance_criteria_ids:
- AC-TXLOG-0162
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 安排一筆機台洗分或出金請求，且其請求金額明確超過會員當下可用餘額（觸發餘額不足拒絕）
- n: 2
  action: 嘗試以該筆請求相關的線索（時間區間、機台帳號）查詢交易紀錄
expected_result: 查無此筆請求對應的交易紀錄——餘額不足被拒絕的請求不會被寫入紀錄，因此也不會以未成立狀態出現在列表中，這與 REQ-TXLOG-016/TC1（其他原因被拒絕、確實會被記錄為未成立）形成明確對照
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §交易狀態
  quote: 未成立 | ...（餘額不足不寫入紀錄，故本狀態不含餘額不足）
assumptions: []
