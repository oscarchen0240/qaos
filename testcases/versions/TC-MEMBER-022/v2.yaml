title: 客製化加盟商 Inline 編輯修改數值後點擊取消，還原為原始值且不儲存
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-014
acceptance_criteria_ids:
- AC-MEMBER-021
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入加盟列表，取一名已設定客製化加盟商（S Partner）身分的會員
test_data: []
steps:
- n: 1
  action: 記錄該列目前的佣金比例%、優惠%、返水%、推薦返傭%、行政費、稽核原始數值
- n: 2
  action: 點擊「超級加盟商」按鈕進入 Inline 編輯模式，將上述欄位修改為與原始值不同的新數值
- n: 3
  action: 點擊列尾 ✕ 取消
- n: 4
  action: 檢視該列數值；重新整理列表，再次檢視該列數值
expected_result: 點擊取消後立即還原為修改前的原始值，先前輸入的變更未被儲存；重新整理列表後仍維持原始值（畫面顯示狀態與後端實際儲存狀態一致，取消操作未造成資料被覆寫）
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.2.3 客製化加盟商設定
  quote: 點擊列尾的 ✓ 確認儲存；或點擊 ✕ 取消並還原原始值
assumptions: []
