steps:
- n: 1
  action: 後台讀出 M 目前分數，記為 B0
  expected: 取得入帳前基準 B0
- n: 2
  action: M 送出 req-cashin，金額 200
  expected: 回 0-OK 並取得 TXID_1
- n: 3
  action: 後台 4.1 以 M 的機台帳號篩選，找到 TXID_1 那筆入金；再讀 M 分數
  expected: 該筆狀態為『待確認』；M 分數仍為 B0（入帳前基準，確認尚未入帳）
- n: 4
  action: M 送出 end-cashin，帶 TXID_1 與入鈔機實際清點金額 200（欄位名稱依廠商 API 文件）
  expected: 回 0-OK
- n: 5
  action: 後台讀 M 分數；重新整理 4.1 查看 TXID_1 那筆
  expected: M 分數 = B0 + 200；該筆狀態由『待確認』轉為『已完成』
test_data:
- name: 入金金額（req-cashin 與 end-cashin 實際清點金額相同）
  value: 200
assumptions: []
title: 待確認入金（req-cashin 未預留額度）經 end-cashin 成功入帳：分數入帳、該筆轉為已完成
