steps:
- n: 1
  action: 情境一：PENDING 有預留額度，機台送出 end-cashin 成功入帳
- n: 2
  action: 情境二：另一筆 PENDING 有預留額度，超過 24 小時未收到 end-cashin
- n: 3
  action: 情境三：另一筆 PENDING 有預留額度，Admin 於交易紀錄手動取消
expected_result: 情境一：預留轉為實際分數餘額；情境二：排程將其轉為已逾時並釋放預留；情境三：預留立即釋放。三者釋放後皆不再佔用額度
