title: 機台帳號篩選以「,」分隔輸入兩個會員編號，可一次查得兩者的交易
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-004
acceptance_criteria_ids:
- AC-TXLOG-0041
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 於機台帳號篩選欄輸入「會員編號A,會員編號B」（兩個既有機台會員的會員編號，自行從環境中選定，需為兩個不同的既有會員）
- n: 2
  action: 點擊搜尋
expected_result: 查詢結果同時包含這兩個機台帳號各自的交易，且不包含其他未輸入的機台帳號的交易
