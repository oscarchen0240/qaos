title: 交易被平台拒絕（例如額度上限）時狀態顯示未成立，分數未異動，未成立原因欄可查得拒絕原因
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-016
acceptance_criteria_ids:
- AC-TXLOG-0161
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 安排一筆會被平台拒絕的機台交易請求（例如超過場館額度上限，判定邏輯屬開發包③既有規則，本測試不重新驗證判定本身，僅借用其已知會產生拒絕結果的情境）
- n: 2
  action: 查詢該筆交易，檢視其狀態、分數（透過會員詳細資料頁）與未成立原因欄
expected_result: 交易狀態顯示未成立；分數未異動；未成立原因欄顯示對應的拒絕原因文字（內容依 SPEC-CASHFLOW-001 定義的對照表）
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §交易狀態
  quote: 未成立 | 平台拒絕了這筆請求；分數未異動，原因見「未成立原因」欄
assumptions: []
