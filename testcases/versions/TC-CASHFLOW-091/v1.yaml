preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashout 取得核可與 PENDING，尚未呼叫 end-cashout
- n: 2
  action: 嘗試尋找任何可在此時間窗口內『單純取消』此筆出金（不透過新的 req-cashout 取代、也不透過人工出金連動取消）的 API 或後台操作
expected_result: 不存在可於此區間單純取消該筆出金的操作路徑；結算畫面的「取消」鍵僅在送出請求前有效，送出後即不可逆，僅能靠新的 req-cashout 取代（REQ-CASHFLOW-019）或人工出金連動取消（REQ-CASHFLOW-027）收斂
