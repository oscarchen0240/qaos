test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
- 準備三個後台帳號：財務、站長、管理員（管理員為內部角色），皆登入後可切到線上站台
test_data:
- name: 角色
  value: 財務／站長／管理員
steps:
- n: 1
  action: 以財務登入，切到線上站台，新增紅包活動『RP-ROLE-FIN』（活動時間『永久』、總預算 5000，其餘合法）並儲存
  expected: 建立成功
- n: 2
  action: 對該活動點『追加預算』，輸入 6000 確認
  expected: 成功
- n: 3
  action: 以站長登入，先取消前一個活動（RP-ROLE-FIN）的排程，再重複步驟 1～2（活動名稱『RP-ROLE-SM』）
  expected: 皆成功
- n: 4
  action: 以管理員登入，先取消 RP-ROLE-SM 的排程，再重複步驟 1～2（活動名稱『RP-ROLE-ADM』）
  expected: 皆成功
- n: 5
  action: 清理：以管理員取消 RP-ROLE-ADM 的排程
  expected: 已取消
expected_result: 財務、站長、管理員三種角色在線上站台都能新增紅包活動並追加預算。
