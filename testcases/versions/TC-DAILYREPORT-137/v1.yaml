title: 向下鑽取（機台明細→場次明細）：點機台帳號後該帳號帶入機台帳號篩選，麵包屑變三層
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-026
acceptance_criteria_ids:
- AC-DAILYREPORT-0263
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 測試場館 Arcade 下選定一個有資料的營業日 D，當日至少有一台機台 A（自行從環境中選定）有場次
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、結算日期選 D，搜尋；點 D 列的場館名鑽取至「依機台明細」
- n: 2
  action: 在「依機台明細」列表找到機台 A 那一列（以機台帳號欄定位），記錄機台帳號；點該機台帳號
- n: 3
  action: 檢視：統計維度、篩選器的機台帳號欄位值、麵包屑層數與各層文字
expected_result: 統計維度切為「依場次明細」；篩選器的機台帳號欄位帶入被點的機台帳號 A；麵包屑變三層（場館 › 結算期間 › 機台帳號）。
