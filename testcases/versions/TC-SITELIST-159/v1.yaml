title: Admin 繞過前端直接呼叫編輯站台 API，帶入會形成循環的上層站台 ID
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-013
acceptance_criteria_ids: []
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: api
test_types:
- negative
- security
design_techniques:
- security_rule
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個既有的、底下至少有一層子站台的站台 A
- n: 2
  action: 以 Admin 身分，直接呼叫編輯站台 A 的 API，上層站台 ID 帶入 A 自身或 A 的某個子站台
expected_result: 預期後端拒絕該請求，避免形成循環的父子關係；此結果目前未經確認，執行時若發現後端接受了此請求（形成循環），應視為高風險缺陷立即上報，而非視為預期行為
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §業務規則與驗證/上層站台循環防護
assumptions:
- text: CLR-SITELIST-006 的 PM 回覆明確聲明『本次確認聚焦於站長權限，Admin 編輯時的循環防護是否也有對應後端驗證，未在本次回覆中明確涵蓋，若後續測試發現可繞過，需另案處理』；也就是說 Admin 這一側的後端防護目前完全沒有人力確認過，屬於比站長那一側更不確定的風險
  requirement_id: REQ-SITELIST-013
  needs_human_confirmation: true
