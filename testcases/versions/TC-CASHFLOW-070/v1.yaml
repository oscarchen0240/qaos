title: 兩筆入金請求依場館鎖序列化處理，第二筆的判定基準已包含第一筆剛通過的預留金額
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-007
acceptance_criteria_ids:
- AC-CASHFLOW-0073
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
- negative
design_techniques:
- scenario
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 設場館額度上限為 A，目前全場館餘額合計＋已預留金額為 A-150
- n: 2
  action: 呼叫 req-cashin 送出金額 100 的入金請求（單看未超限：A-150+100=A-50，未超過 A）
- n: 3
  action: 確認此筆通過並建立 PENDING（預留轉入後，判定基準已含此筆的 100）
- n: 4
  action: 接著（不等待前一筆入帳，模擬幾乎同時送達）呼叫 req-cashin 送出金額 100 的另一筆入金請求（若僅以原始 A-150 為基準計算不會超限，但加計前一筆已預留的 100 後將達 A+50，超限）
expected_result: 依場館鎖逐筆序列化處理：第一筆通過並將 100 計入預留後，第二筆的判定基準已包含第一筆的預留（A-150+100+100=A+50 超過上限），因而正確被擋下並回 1-OVER LIMIT，不會發生『兩筆各自判斷都通過、合計卻超額』的漏洞
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-入金
  quote: 先取得場館鎖…在鎖內以「當下全場館機台分數餘額合計 ＋ 已預留未入帳的入金金額 ＋ 本筆金額」判定；未超限才建立 PENDING、把本筆金額計入預留、釋放鎖，超限則回 1-OVER LIMIT、不建立 PENDING、不預留
