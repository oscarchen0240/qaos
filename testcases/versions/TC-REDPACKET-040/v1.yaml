preconditions:
- 以具備優惠活動管理權限的後台角色（站長，或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）；財務角色能否檢視紅包明細、取消排程尚未定義（CLR-REDPACKET-015），所以除 023 系列案例外一律不用財務角色執行
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計
test_data:
- name: 總預算
  value: 36 → 54
- name: 固定金額
  value: 18
steps:
- n: 1
  action: 建立活動『RP-TOPUP』（活動時間『永久』）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 18／稽核 1；總預算 36；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 玩家 A 結算有效流水貢獻 300（跨 3 個門檻）
  expected: 產生 2 個紅包（預算用完），第 3 個因預算不足不產生；標示『預算用罄』（標示位置只記錄）
- n: 3
  action: 該活動列點『追加預算』
  expected: 視窗顯示目前總預算 36、已占用 36、剩餘 0
- n: 4
  action: 輸入新總預算 54，點『確認』
  expected: 視窗關閉；新預算即時生效；活動列預算使用顯示 36 ／ 54；原有的『預算用罄』標示消失（位置只記錄）
- n: 5
  action: 檢視紅包明細筆數
  expected: 仍為 2 筆（追加預算本身不補發用罄期間未產生的紅包）
- n: 6
  action: 玩家 A 再結算 100
  expected: 活動恢復產生：新增 1 個紅包（共 3 筆）
expected_result: 追加預算視窗顯示目前總預算／已占用／剩餘；輸入更大的新總預算確認後即時生效，用罄的活動恢復產生紅包，且不補發用罄期間未產生的那一個。
