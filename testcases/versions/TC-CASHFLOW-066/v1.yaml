title: 開分加計後恰等於場館額度上限可成立，超過 1 單位則被拒絕（1-OVER LIMIT）
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-004
acceptance_criteria_ids:
- AC-CASHFLOW-0041
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- boundary
- negative
design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 以 Admin 登入 站台列表，將該機台所屬場館的額度上限設為 A（一個便於計算的整數，例如現有全場館機台分數餘額合計＋已預留未入帳入金金額為 A-100）
- n: 2
  action: 呼叫 req-keyin 開分金額恰為 100（使加計後全場館合計恰等於額度上限 A）
- n: 3
  action: 確認開分成功（0-OK），分數增加、交易紀錄正常寫入
- n: 4
  action: 再次呼叫 req-keyin 開分金額 1（此時加計後將超過額度上限 A）
- n: 5
  action: 確認此筆的回覆與分數變化
expected_result: 第一筆恰等於上限：成立，回 0-OK，分數正常增加；第二筆使合計超過上限：平台回 1-OVER LIMIT，分數不變、不寫入任何帳務異動，但交易紀錄留有「未成立」紀錄（超過額度上限不屬於餘額不足的不寫入例外）
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/開分 + §附錄-開分
  quote: 判定與入帳於場館鎖內執行，與入金的預留共用同一把鎖而序列化，判定基準須含已預留未入帳的入金金額（v07 定案）；開分為單階段，判定即入帳。超過額度上限回 1-OVER LIMIT，不寫入任何帳務異動
assumptions: []
