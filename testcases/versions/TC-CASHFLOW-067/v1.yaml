title: 額度上限內連續送出兩筆內容相同的開分請求，系統不偵測也不阻擋重複，兩筆皆入帳
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-005
acceptance_criteria_ids:
- AC-CASHFLOW-0051
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認場館額度上限充足，不受本次測試金額影響
- n: 2
  action: 呼叫 req-keyin 開分金額 X（模擬現場店員操作）
- n: 3
  action: 確認回 0-OK，分數增加 X
- n: 4
  action: 在未查詢後台的情況下，直接以完全相同的參數再次呼叫 req-keyin（模擬店員誤判失敗後重按）
- n: 5
  action: 確認第二筆的回覆與分數變化
expected_result: 兩筆請求皆判定通過、分別入帳，機台分數總共增加 2X——系統不會偵測或阻擋這種重複，此為 spec 明確承認的既定行為（現場 SOP 因應）而非缺陷
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §業務規則與驗證/單階段交易防重複 + §附錄-開分
  quote: 開分無任何自然防護——只要不超過額度上限，重按幾次就加幾次，是最高風險項
