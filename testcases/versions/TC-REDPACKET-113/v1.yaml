design_techniques:
- requirement_based
priority: medium
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
test_data:
- name: 活動 P
  value: 永久，總預算 5000
- name: 活動 Q
  value: 區間 現在－1 小時～現在＋1 小時（UTC+0），總預算 5000
steps:
- n: 1
  action: 建立活動『RP-RUN-P』：活動時間『永久』；活動幣種 USDT；預設規則門檻 1000／上限 5／固定 10／稽核 1；總預算 5000；儲存
  expected: 建立成功
- n: 2
  action: 進入『活動排程 > 紅包活動』，檢視 RP-RUN-P 的『狀態』欄與操作欄
  expected: 狀態『進行中』（永久活動開始後一律為進行中；建立後多久生效 spec 未明講，若短暫為『排程中』等待後再檢視）；操作欄有『取消排程』與『追加預算』
- n: 3
  action: 對 RP-RUN-P 點『取消排程』並於確認視窗點『確認取消』
  expected: 已取消排程，釋出同站台唯一的進行中名額
- n: 4
  action: 建立活動『RP-RUN-Q』：活動時間『區間』，開始＝現在－1 小時、結束＝現在＋1 小時（UTC+0）；其餘同上（總預算 5000）；儲存
  expected: 建立成功
- n: 5
  action: 檢視 RP-RUN-Q 的『狀態』欄與操作欄
  expected: 狀態『進行中』（開始時間 ≦ 現在 ＜ 結束時間）；操作欄有『取消排程』與『追加預算』
- n: 6
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 永久活動與落在區間內的區間活動皆顯示為『進行中』，操作欄提供『取消排程』，設有總預算者另提供『追加預算』。
