title: 進行中狀態：永久活動與區間活動（現在落在區間內）皆為『進行中』，操作欄提供『取消排程』（設有總預算者另提供『追加預算』）
description: 進行中狀態：永久活動與區間活動（現在落在區間內）皆為『進行中』，操作欄提供『取消排程』（設有總預算者另提供『追加預算』）
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-016
acceptance_criteria_ids:
