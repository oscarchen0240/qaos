title: 本期已達上限：已產生數達單週期發放上限且全部領取後，紅包視窗顯示『本期已達上限』（對照：達上限前一個不顯示）
description: 本期已達上限：已產生數達單週期發放上限且全部領取後，紅包視窗顯示『本期已達上限』（對照：達上限前一個不顯示）
