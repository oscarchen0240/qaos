title: 機台名稱輸入暱稱禁用詞不被阻擋，後台建立不經該檢查
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-005
acceptance_criteria_ids:
- AC-ACCOUNT-0052
spec_id: SPEC-ACCOUNT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 取得前台暱稱禁用詞清單中的任一詞彙（自行從既有禁用詞清單中選定，或向環境負責人確認清單內容）
- n: 2
  action: 以 Admin 登入後台並切換至機台場館，點擊「創建會員帳號」，帳號類型選「機台」，機台名稱欄位輸入該禁用詞並送出建立
expected_result: 系統不阻擋，帳號正常建立成功，機台名稱（即暱稱）即為所輸入的禁用詞
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §業務規則與驗證/機台識別附近
  quote: 後台建立／修改不經「暱稱禁用詞」檢查（該檢查僅作用於前台設定暱稱，機台場館亦不顯示該設定頁）
assumptions:
- text: 測試需要一個確實存在於前台暱稱禁用詞清單中的字詞作為輸入樣本；該清單的實際內容屬既有前台功能、非本 spec 定義範圍，執行前需向環境負責人確認清單內容或使用環境中已知的禁用詞樣本
  requirement_id: REQ-ACCOUNT-005
  needs_human_confirmation: true
