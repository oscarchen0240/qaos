title: 尚未完成（待確認）的洗分交易，系統不會為其建立核實紀錄
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-001
- REQ-CASHOUT-004
acceptance_criteria_ids:
- AC-CASHOUT-0011
