spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得（或使一筆）機台洗分交易於機台交易紀錄的交易狀態為『待確認』（尚未完成）
- n: 2
  action: 進入本頁，以該機台帳號或訂單編號查詢，確認是否有對應紀錄
expected_result: 查無此筆紀錄；因為交易尚未完成，系統根本不會為它建立核實狀態紀錄。不可憑本頁無紀錄直接判斷交易狀態，須至機台交易紀錄查明實際狀態後再決定是否付款
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §紀錄產生規則
  quote: 僅交易狀態為「已完成」的機台洗分與機台出金會出現在本頁；待確認、已取消、已逾時、未成立的交易不會出現
