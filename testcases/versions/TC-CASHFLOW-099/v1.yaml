title: 無進行中場次時開分或入金轉正建立新場次；洗分結束留有餘數時立即建立新場次承接
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-033
acceptance_criteria_ids:
- AC-CASHFLOW-0331
- AC-CASHFLOW-0332
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
- negative
design_techniques:
- state_transition
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認機台帳號目前無進行中場次（分數為 0）
- n: 2
  action: 呼叫 req-keyin 開分金額 X，確認分數由 0 轉正
- n: 3
  action: 查詢場次資訊，確認是否建立新場次，期初餘額是否為 0
- n: 4
  action: 佈置一個進行中場次餘額 321，呼叫 req-keyout（throshold=100、mode=all）結束此場次並留有餘數 21
- n: 5
  action: 查詢場次資訊，確認是否已立即建立新場次承接
- n: 6
  action: 另驗證：機台分數為 0、無任何開分/入金發生的情況下，單純的注單/遊戲操作不應能建立新場次（因無資金流入觸發，屬理論情境，實際上分數為 0 時亦無法投注）
expected_result: 開分或入金完成使分數由 0 轉為有餘額時，建立新場次、期初餘額為 0；洗分結束留有餘數 21 時，立即建立新場次承接、期初餘額為 21；分數維持 0 時不會意外建立場次
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §場次/場次如何開始與結束
  quote: 無進行中場次時，開分或入金完成使分數由 0 轉為有餘額，建立新場次；或前一場次因洗分結束後留有餘數，立即建立新場次承接
