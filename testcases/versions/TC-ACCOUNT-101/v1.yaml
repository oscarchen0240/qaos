title: 重置憑證時取消二次確認，憑證不變
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-019
acceptance_criteria_ids:
- AC-ACCOUNT-0193
spec_id: SPEC-ACCOUNT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）且已產生過機台憑證的會員詳細頁「機台憑證」區塊，記錄目前遮罩顯示的前後 4 碼
- n: 2
  action: 點擊「重置憑證」開啟二次確認彈窗
- n: 3
  action: 點擊「取消」
expected_result: 彈窗關閉，憑證未被重置，遮罩顯示的前後 4 碼與取消前相同
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
