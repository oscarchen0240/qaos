expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  location: §業務規則與驗證（本包相關）（第 258 行）
  quote: 提款次數／提款金額累計機台洗分與機台出金——於「洗分出金核實」頁核實當下累計，待核實與已作廢不計
steps:
- n: 1
  action: 確認 M 分數為 0；若有餘額，先以 req-keyout mode=all、throshold=0 洗到 0（這筆清空用的洗分不要核實也不要作廢，讓它留在待核實，才不影響提款累計）
  expected: M 分數為 0（下列 900、400 等絕對數值以此為前提）
- n: 2
  action: 會員列表記下 M 的『提款次數』w0、『提款金額』m0
  expected: 取得基準值 w0、m0
- n: 3
  action: M 送出 req-keyin 1000；再送 req-keyout mode=value、value=100、throshold=100
  expected: 回 0-OK，核可 100（洗分 R_w 完成，M 分數 900）
- n: 4
  action: M 送出 req-cashout 與 end-cashout 完成出金（全額 900），得 R_o；再送 req-keyin 400，req-cashout 與 end-cashout 完成出金（全額 400），得 R_v
  expected: 兩筆出金完成，M 分數 0
- n: 5
  action: 後台 4.1 查看 R_w、R_o、R_v；會員列表查看提款次數與金額
  expected: R_w 交易類型『機台洗分』金額 −100；R_o、R_v 類型『機台出金』金額 −900、−400；三筆都尚未核實，提款次數、提款金額仍為 w0、m0（尚未累計）
- n: 6
  action: 到『洗分出金核實』頁僅核實 R_w（R_o、R_v 維持待核實）；查看會員列表
  expected: 提款次數 = w0 + 1、提款金額 = m0 + 100（R_o、R_v 為待核實，不計）
- n: 7
  action: 核實 R_o；查看會員列表
  expected: 提款次數 = w0 + 2、提款金額 = m0 + 1000（以核心貨幣原值累計，不換算）
- n: 8
  action: 對 R_v 在『洗分出金核實』頁執行『作廢』（不核實）；查看會員列表
  expected: 提款次數、提款金額維持 w0 + 2、m0 + 1000（已作廢不計）
test_data:
- name: 洗分 R_w
  value: 指定金額 100（mode=value、throshold=100）
- name: 出金 R_o
  value: 全額 900
- name: 出金 R_v（將作廢）
  value: 全額 400
