priority: medium
risk: high
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
test_data: []
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，活動類型選『紅包』；展開『重置方式』欄
  expected: 選項為『每日』『每週一』『每月 1 日』『不重置』四項（不含其他選項）
- n: 2
  action: 檢視『重置方式』欄周邊的提示文字
  expected: 【僅記錄，不判定】記錄實際提示文字（機台場館的提示格式見 TC-REDPACKET-031；線上站台的提示文字 spec 沒有定義，只在欄位說明寫『線上站台於 UTC+0 00:00 切分』）
- n: 3
  action: 離開此表單，不儲存
  expected: 未建立任何活動
expected_result: 線上站台『重置方式』欄的選項為每日、每週一、每月 1 日、不重置四項；線上提示文字只記錄、不判定。
