title: 線上站台新增紅包活動表單的『重置方式』欄：選項為每日／每週一／每月 1 日／不重置；線上提示文字只記錄
description: 線上站台新增紅包活動表單的『重置方式』欄：選項為每日／每週一／每月 1 日／不重置；線上提示文字只記錄
product: ba-admin
functional_area: REDPACKET
requirement_ids:
