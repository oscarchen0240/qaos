title: 洗分回 0-OK 即代表分數已扣除且無回滾機制，完成當下立即結束當前場次並由新場次承接餘數
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-017
acceptance_criteria_ids:
- AC-CASHFLOW-0171
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- state_transition
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認機台帳號目前有一個進行中場次，餘額 321
- n: 2
  action: 呼叫 req-keyout，mode=all、throshold=100，確認回 0-OK
- n: 3
  action: 查詢場次資訊（會員詳細頁「機台資訊」區塊或依場次編號查詢），確認原場次是否已結束、期末餘額為多少
- n: 4
  action: 確認是否已有新場次開始，期初餘額是否等於餘數 21
- n: 5
  action: 嘗試尋找任何可撤銷或回滾這筆已完成洗分的 API 或後台操作
expected_result: 回 0-OK 當下分數已扣除為最終結果、無法回滾；原場次立即結束（期末餘額 21），餘數 21 立即由新場次承接（新場次期初餘額 21）；不存在任何可撤銷或回滾此筆洗分的機制
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/洗分 + §附錄-洗分
  quote: 單階段，回 0-OK 即已完成扣款，無回滾機制；完成當下當前場次即結束，餘數由新場次承接
