test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 延續上一條 TC 的兩筆待核實紀錄（或另取一筆待核實洗分、一筆待核實出金），於場館日結報表記錄核實前的現金淨收數值
- n: 2
  action: 於本頁分別對這兩筆紀錄執行核實
- n: 3
  action: 核實完成後，再次檢視場館日結報表的現金淨收數值
expected_result: 現金淨收數值在這兩筆紀錄核實後出現對應的扣減（金額與方向與公式『現金淨收 = 開分＋進鈔－已核實洗分－已兌現』一致）；已核實的洗分與出金皆計入現金淨收的扣除項
