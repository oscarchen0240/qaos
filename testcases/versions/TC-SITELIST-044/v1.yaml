title: 線上類型主站台帶有子站台時執行刪除
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-023
acceptance_criteria_ids:
- AC-SITELIST-0231
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 後台管理員系統 > 站台列表
test_data: []
steps:
- n: 1
  action: 取一個線上類型且帶有至少一個子站台的主站台
- n: 2
  action: 點擊刪除並二次確認
expected_result: 三種可能結果之一：(a) 阻擋刪除——系統顯示錯誤提示，主站台與所有子站台皆維持不變；(b) 連坐刪除——主站台與所有子站台（含孫層）皆從列表消失；(c) 子站台上移——主站台消失，其子站台仍存在但上層站台改變（變成根層或掛到被刪站台原本的上層）。請對照實測結果記錄屬於哪一種，待
  CLR-SITELIST-008 回覆後收斂為單一斷言（見假設）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §操作/刪除站台
assumptions:
- text: Spec 未定義有子站台的站台如何刪除；CLR-SITELIST-008 尚待 PM 回覆是阻擋、連坐刪除、或子站台改掛他處
