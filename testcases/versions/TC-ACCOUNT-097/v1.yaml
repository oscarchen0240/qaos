test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，建立一個線上帳號（依 REQ-ACCOUNT-007，電子信箱留空且不進行補綁）
- n: 2
  action: 於前台忘記密碼頁，輸入該帳號與任意電子信箱，送出申請
expected_result: 系統無法完成本次申請（該帳號尚未綁定信箱可供比對）；實際顯示的畫面或提示文案需人工比對實測結果後確認是否與一般「查無帳號/信箱不符」情境相同（見假設）
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §前台忘記密碼/機台帳號、未綁定信箱的帳號
  quote: 未綁定信箱的帳號 | 無法使用本機制，一律以後台「重設密碼」處理
assumptions:
- text: Spec 未定義未綁定信箱的帳號實際送出忘記密碼申請時，前端顯示的具體提示內容，需人工確認實測結果
