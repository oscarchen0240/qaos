preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 切換站台選單至一個機台場館，開啟「創建會員帳號」Modal，檢視帳號類型欄位的預設值與可選項
- n: 2
  action: 切換站台選單至一個線上站台，開啟「創建會員帳號」Modal，檢視帳號類型欄位的預設值，並嘗試點選「機台」選項
expected_result: 機台場館下：帳號類型預設為「機台」，「線上」「機台」皆可選；線上站台下：帳號類型預設為「線上」，「機台」選項為停用狀態，無法點選
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §操作/創建會員帳號
  quote: 預設值依目前站台的「站台類型」帶入——機台場館預設「機台」、線上站台預設「線上」。「機台」選項僅於目前站台為機台場館時可選
