execution_mode: manual
preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館已設定日結時間 06:00 UTC+0
- 測試場館下有機台 A、B（會員編號已知），並依各案例準備交易資料
- 結算日期預設為單一營業日 2026-09-05（起迄相同）；需要多日的案例於步驟中另設
test_data: []
steps:
- n: 1
  action: 讓機台 A 於營業日 2026-09-05 開始 1 場並逾時結束、另 1 場持續至 09-06 06:00 日結結算
- n: 2
  action: 於 09-06 06:00 日結後依機台明細搜尋 2026-09-05
expected_result: 場次數 2（逾時結束 1 ＋ 日結結算 1；依假設含所有非進行中狀態，且日結結算場次歸屬開始的營業日）
