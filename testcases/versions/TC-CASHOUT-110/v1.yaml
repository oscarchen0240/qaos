preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得（或借用）一筆洗分交易，其門檻計算後的實際金額非常接近 0（但大於 0）
- n: 2
  action: 於本頁檢視該筆紀錄的實際金額欄呈現方式
expected_result: 正確顯示該筆極小的實際金額數值，不會顯示空白、負數或明顯錯誤的格式，欄位呈現規則與一般金額一致
