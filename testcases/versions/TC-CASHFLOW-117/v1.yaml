  action: M 送出 req-keyin，金額 100；M 送出 req-cashout，之後不送 end-cashout
  expected: 回 0-OK；平台建立待確認出金 TXID_1
- n: 2
  action: 站長登入後台，進入 4.1（機台視角），篩選 M、交易狀態『待確認』，找到 TXID_1 那列；檢視操作欄與明細，若有『手動取消』按鈕則嘗試點擊
  expected: 站長沒有可執行的『手動取消』（沒有入口，或入口不可操作）；TXID_1 仍為『待確認』
- n: 3
  action: 對照組（前端上線後才成立）：管理員登入同一頁，找到 TXID_1 那列
  expected: 管理員看得到『手動取消』入口；前端上線前記為受阻
- n: 4
  action: （後端 API，若開發提供）以站長身分呼叫手動取消 API 取消 TXID_1；API 的拒絕回應內容 spec 未定義，只記錄回應，不斷言內容
  expected: TXID_1 仍為『待確認』，沒有被取消
- n: 5
  action: 清理：M 送出 end-cashout 完成 TXID_1，或前端上線後由管理員手動取消
