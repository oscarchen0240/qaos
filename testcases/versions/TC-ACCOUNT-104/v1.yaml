title: 停用機台後帳號餘額不受影響，再次啟用恢復狀態
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-022
acceptance_criteria_ids:
- AC-ACCOUNT-0221
- AC-ACCOUNT-0222
spec_id: SPEC-ACCOUNT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- state_transition
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 開啟一個機台狀態為「啟用」的一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，記錄其主錢包（分數）餘額 X
- n: 2
  action: 於「機台資訊」區塊將機台狀態切換為「停用」
- n: 3
  action: 檢視機台狀態與餘額
- n: 4
  action: 再將機台狀態切換回「啟用」
- n: 5
  action: 檢視機台狀態
expected_result: 切換為停用後：機台狀態 Badge 顯示「停用」，帳號餘額仍為 X（不變）；再切換為啟用後：機台狀態 Badge 顯示「啟用」
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §停用／啟用機台
  quote: 停用不會影響機台帳號上的餘額…再次啟用即恢復運作
