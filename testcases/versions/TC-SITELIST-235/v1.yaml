preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個狀態為開通的站台（自行從環境中選定；若環境中無現成的開通狀態站台，可依 AC-SITELIST-0153 的操作路徑，即 TC-DRAFT-01M2NCSW5DZPS5F0FR84FE18P6 的 step1-2，取一個模板已填妥的站台，將狀態切換為開通後使用）
- n: 2
  action: 編輯該站台，新增一筆前台網域並點擊「儲存變更」
- n: 3
  action: 檢視站台狀態
expected_result: 儲存後站台狀態自動變為「更新待審」
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
