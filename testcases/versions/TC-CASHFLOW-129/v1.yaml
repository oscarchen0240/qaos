steps:
- n: 1
  action: 以原 T 送 req-keyin，金額 10（對照）；後台記下 M 分數 B1、4.1 以 M 篩選的交易筆數 N1
  expected: 回 0-OK；基準值 B1、N1
- n: 2
  action: 類別 (a)：取 T，把簽章段（第三段）中間任一字元換成另一個不同字元，其餘不變，送 req-keyin 金額 10
  expected: 回 9-OTHER ERROR
- n: 3
  action: 類別 (b)：取 T，解碼 payload，改動其中任一 claim 的值後重新編碼，沿用原簽章，送 req-keyin 金額 10
  expected: 回 9-OTHER ERROR
- n: 4
  action: 類別 (c)：用測試人員自己產生的金鑰簽發一個 payload 與 T 相同的 JWT，送 req-keyin 金額 10
  expected: 回 9-OTHER ERROR
- n: 5
  action: 後台讀 M 分數；4.1 重新查詢交易筆數
  expected: M 分數仍為 B1；筆數仍為 N1（三個無效 token 的請求都沒有被處理）
- n: 6
  action: 以原 T 再送 req-keyin，金額 10（確認 T 仍有效，排除因機台狀態問題導致的拒絕）
  expected: 回 0-OK；M 分數 = B1 + 10
test_data:
- name: 等價類別
  value: (a) 簽章段被竄改／(b) payload 被竄改但沿用原簽章／(c) 非平台簽發（自行產生金鑰簽發、內容與 T 相同）
- name: 請求
  value: req-keyin 金額 10
