title: 設定多個篩選條件後點擊清除，所有條件重置為預設值且結果回到未篩選狀態
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-012
acceptance_criteria_ids:
- AC-TXLOG-0121
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 設定多個篩選條件（例如機台帳號、交易類型 chip、交易狀態、金額範圍）並搜尋
- n: 2
  action: 點擊「清除」按鈕
expected_result: 所有已設定的篩選條件（文字輸入清空、chip 取消勾選、下拉/範圍回到預設）皆重置；查詢結果回到未篩選狀態（僅受站台切換範圍限制）
