execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個既有的線上帳號（自行從環境中選定，與其他案例中使用的帳號為不同帳號）的會員詳細頁，檢視是否有「重設密碼」操作
- n: 2
  action: 另開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）的會員詳細頁，檢視是否有「重設密碼」操作
expected_result: 兩種帳號類型的會員詳細頁皆顯示「重設密碼」操作
