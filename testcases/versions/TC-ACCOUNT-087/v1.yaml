  action: 以 Admin 登入後台，開啟一個既有的線上帳號（自行從環境中選定，與其他案例中使用的帳號為不同帳號）的會員詳細頁，重設密碼前先記下（或另行以既有帳密登入前台驗證可登入)該帳號的登入帳密
- n: 2
  action: 點擊「重設密碼」並二次確認完成重設
- n: 3
  action: 以重設前的舊密碼嘗試登入前台
