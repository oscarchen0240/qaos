execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 依『後台管理員系統』新增一個操作員角色帳號，將其所屬場館指定為一個既有機台場館
- 選定該機台場館下一個既有的會員/機台帳號
- 以該操作員帳號登入後台
test_data: []
steps:
- n: 1
  action: 嘗試尋找或執行對該會員的重設密碼功能
- n: 2
  action: 觀察系統反應
expected_result: 操作員無法執行重設密碼操作——功能按鈕不存在、呈現不可用狀態、或操作被系統拒絕，不具備此權限
