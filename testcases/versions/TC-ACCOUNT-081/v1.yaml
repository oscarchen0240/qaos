steps:
- n: 1
  action: 以 Admin 登入後台，開啟一個機台帳號的會員詳細頁
- n: 2
  action: 檢視「機台資訊」區塊的完整欄位
- n: 3
  action: 點擊所屬場館欄位
expected_result: 區塊顯示機台名稱、所屬場館（含站台代碼，為唯讀但可點擊）、機台狀態 Badge、進行中場次、建立與修改時間（皆標示 UTC+0）；點擊所屬場館可導覽回站台列表該層
