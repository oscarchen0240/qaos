title: 過渡期以結算結果畫面照片上的訂單編號核銷，流程與狀態與有收據時相同
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-023
acceptance_criteria_ids:
- AC-CASHOUT-0231
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 若目前環境仍處於過渡期（機台無印表機）：取得玩家出示的結算結果畫面照片，讀取照片上的訂單編號；若環境已回歸正式期（印表機已到位），改用收據上的訂單編號替代，核銷邏輯本身不受影響
- n: 2
  action: 於本頁上方以該訂單編號查詢，找到對應的待核實出金紀錄
- n: 3
  action: 依 REQ-CASHOUT-022 的核實流程核對彈窗內容後確認
expected_result: 無論訂單編號來源是照片還是實體收據，核實流程與最終狀態轉換完全相同，系統不區分過渡期與正式期
