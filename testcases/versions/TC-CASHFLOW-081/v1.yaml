title: 洗分計算後可洗金額為 0 時回 1-NO CREDITS，不寫入任何帳務異動與交易紀錄
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-016
acceptance_criteria_ids:
- AC-CASHFLOW-0161
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- boundary
- negative
design_techniques:
- boundary_value
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data:
- name: 機台餘額
  value: 50
- name: throshold
  value: 100
steps:
- n: 1
  action: 透過人工入金將機台帳號分數佈置為小於一個門檻單位（例如餘額 50、throshold 100）
- n: 2
  action: 呼叫 req-keyout，mode=all、throshold=100
expected_result: 回 1-NO CREDITS，機台畫面顯示餘額不足，不寫入任何帳務異動，也不寫入交易紀錄（此為餘額不足的例外，與其他未成立原因不同）
