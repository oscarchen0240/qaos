title: 洗分餘數留在機台帳號上不被清除；餘數單獨存在時無法再洗出（可洗金額為 0）
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-014
acceptance_criteria_ids:
- AC-CASHFLOW-0141
- AC-CASHFLOW-0142
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- boundary
design_techniques:
- boundary_value
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data:
- name: 機台餘額
  value: 321
- name: throshold
  value: 100
steps:
- n: 1
  action: 透過人工入金將機台帳號分數佈置為 321
- n: 2
  action: 呼叫 req-keyout，mode=all、throshold=100，確認洗出 300、機台餘額變為 21
- n: 3
  action: 再次呼叫 req-keyout，mode=all、throshold=100（此時餘額僅剩 21，小於一個門檻單位）
expected_result: 第一次：洗出 300，餘數 21 留在機台帳號上，系統不另記交易、不清空餘額；第二次：核可金額為 0，回 1-NO CREDITS，無法洗出（可改按結算全額領回）
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/洗分 + §業務規則-餘數保留
  quote: 餘數保留 | 洗分（門檻大於 0 時）僅扣除核可金額，不足一個門檻單位的餘數留在機台帳號上；系統不另記交易、不清空餘額
