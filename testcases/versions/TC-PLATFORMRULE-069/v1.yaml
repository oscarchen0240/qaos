- requirement_based
preconditions:
- 站台樹（由環境負責人準備；站台與帳號皆自行對應，不指定編號）：根站台 admin 底下有兩個互相平行的機台類型主站台 P1、P2；P1 底下有機台類型子站台 S1、S2（互相平行），S1 底下再有機台類型子站台 S1a；P2 底下有機台類型子站台
  T1。依站台列表 spec，子站台與主站台同類型、機台類型站台（含主站台）皆帶機台專屬欄位，故 P1、S1、S1a、S2、P2、T1 皆視為場館
- 以根站台 admin 的管理員帳號（由環境負責人提供）登入後台（根站台 admin 的子樹即全平台）
steps:
- n: 1
  action: 以根站台 admin 的管理員登入後台，展開 站台切換下拉選單，完整記錄選單中所有項目
- n: 2
  action: 逐一核對選單是否含 P1、S1、S1a、S2、P2、T1 六個場館（跨兩個主站台）
expected_result: 選單可見全平台所有場館：P1、S1、S1a、S2（P1 子樹）與 P2、T1（P2 子樹），兩個平行主站台下的場館皆可見
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.2'
  location: §角色與權限（管理員說明；角色層級依 CLR-PLATFORMRULE-001）
  quote: 「管理員」**每個站台皆有**，權限範圍跟著所屬站台走（自身站台及其所有子站台），與站長的可見範圍相同、差別在操作深度；根站台 `admin` 的管理員因其子樹即全平台，故等同看到全部場館。
