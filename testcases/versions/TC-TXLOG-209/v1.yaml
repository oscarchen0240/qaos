title: 點擊列表任一列開啟右側明細面板，區分摘要區塊與技術欄位區塊
product: ba-admin
functional_area: TXLOG
requirement_ids:
- REQ-TXLOG-027
acceptance_criteria_ids:
- AC-TXLOG-0271
spec_id: SPEC-TXLOG-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 頁面標題下方的站台切換選單已選定一個機台場館站台
- 已進入 各式報表 > 交易紀錄查詢 頁面（機台交易紀錄為此頁面的機台視角擴充，不另設獨立頁面）
test_data: []
steps:
- n: 1
  action: 查詢結果中任選一筆交易
- n: 2
  action: 點擊該筆交易所在列
- n: 3
  action: 檢視開啟的右側面板結構
expected_result: 右側面板開啟並顯示該筆交易的完整往來紀錄；面板上半部為摘要區塊、下半部為技術欄位區塊，兩者在視覺上可明確區分（例如分區標題或視覺分隔）
expected_result_spec_reference:
  spec_id: SPEC-TXLOG-001
  spec_version: '0.1'
  location: §操作
  quote: 查看明細：點擊任一列開啟右側面板，顯示該筆交易的完整往來紀錄。⚠️ 面板下半部為技術欄位，供開發團隊排查用，站務人員以上半部的摘要為準即可
