title: 管理員與站長以 API 並行送出時段重疊的建立活動請求（不同帳號、逐請求時間記錄、至少 3 個有效輪）：最終只存在 1 個活動，另一個被阻擋
description: 管理員與站長以 API 並行送出時段重疊的建立活動請求（不同帳號、逐請求時間記錄、至少 3 個有效輪）：最終只存在 1 個活動，另一個被阻擋
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-017
acceptance_criteria_ids:
- AC-REDPACKET-0171
- AC-REDPACKET-0172
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: api
test_types:
