title: 機台帳號餘額欄不顯示展開箭頭，維持單行呈現
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-030
acceptance_criteria_ids:
- AC-ACCOUNT-0301
