- functional
design_techniques:
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，於會員列表找到一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個），檢視其餘額欄
- n: 2
  action: 開啟其側邊簡易資料面板，檢視餘額欄
- n: 3
  action: 開啟其會員詳細頁，檢視餘額欄
expected_result: 三處餘額欄皆不顯示展開箭頭、維持單行呈現；顯示的數值即該帳號主錢包（所屬主站台核心貨幣，如 TWD）的餘額
