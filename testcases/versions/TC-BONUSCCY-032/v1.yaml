execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台切換選單切換至一個既有的機台（TWD核心貨幣）站台（自行從環境中選定）
- 該站台底下已有既有機台帳號的注單紀錄（自行從環境中選定；若無可透過該機台帳號實際遊玩產生一筆）
test_data: []
steps:
- n: 1
  action: 進入 各式報表 > 注單查詢（機台場館下此頁面可見）
- n: 2
  action: 查詢列表中任一筆屬於該機台站台的注單
- n: 3
  action: 檢視列表金額欄位
expected_result: 金額欄位顯示為站台核心貨幣 TWD 的數值，不是寫死顯示 USDT 或其換算值
expected_result_spec_reference:
  spec_id: SPEC-BONUSCCY-001
  spec_version: '1.0'
  location: §實際被改到的地方（表格第2項：注單三層金額）
  quote: 注單三層金額 | game_bet_log → …_wallet_reference → …_system_wallet_reference，第三層的幣別與換算改依站台核心貨幣
