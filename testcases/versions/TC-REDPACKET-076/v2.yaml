title: 活動名稱多語系：前台紅包視窗以用戶語系顯示名稱，無法匹配時以預設語系顯示
description: 活動名稱多語系：前台紅包視窗以用戶語系顯示名稱，無法匹配時以預設語系顯示
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-033
acceptance_criteria_ids:
