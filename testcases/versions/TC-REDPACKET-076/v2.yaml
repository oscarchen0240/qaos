design_techniques:
- requirement_based
priority: low
risk: low
execution_mode: manual
preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提】前台有一個『未在活動中設定名稱』的語系可切換（例如日文）；選定一名既有線上會員（玩家 A）
test_data:
- name: 名稱
  value: 繁中：紅包繁中；英文：RedPacketEN
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，活動類型選『紅包』、活動時間選『永久』；預設語系選繁體中文；在『活動名稱／說明欄』先選繁中語系填名稱『紅包繁中』，再選英文語系填名稱『RedPacketEN』；其餘欄位填合法值；儲存
  expected: 建立成功，活動進入進行中
- n: 2
  action: 玩家 A 以繁中語系打開前台，點右側紅包圖示開啟紅包視窗
  expected: 顯示『紅包繁中』
- n: 3
  action: 玩家 A 以英文語系打開紅包視窗
  expected: 顯示『RedPacketEN』
- n: 4
  action: 玩家 A 切到未設定名稱的日文語系打開紅包視窗
  expected: 顯示預設語系（繁中）的名稱『紅包繁中』
- n: 5
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 前台紅包視窗以用戶語系匹配活動名稱；無法匹配（日文）時以預設語系（繁中）的名稱顯示。
