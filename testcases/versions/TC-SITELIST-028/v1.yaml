test_data: []
steps:
- n: 1
  action: Admin 編輯一個狀態為開通的站台
- n: 2
  action: 嘗試將狀態切換為「待開通」並儲存
expected_result: 情境一（任意狀態含待開通）：系統接受切換，狀態變為待開通；情境二（任意狀態不含待開通）：系統阻擋此切換，顯示錯誤提示或該選項不可選。請對照實測結果記錄屬於哪一種情境，並提交 Human 確認何者為準（見假設）
