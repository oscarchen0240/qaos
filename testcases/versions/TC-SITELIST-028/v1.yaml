  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §站台狀態
assumptions:
- text: 「待開通」在 §站台狀態一節僅列「新建站台自動設定」為觸發方式，未列為 Admin 可手動選取的目標狀態；spec 對「任意狀態」是否含待開通未明確定義
