title: end-cashout 扣分完成當下場次立即結束、餘額歸 0；對相同 TXID 具備冪等性
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-021
acceptance_criteria_ids:
- AC-CASHFLOW-0211
- AC-CASHFLOW-0212
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- state_transition
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認機台帳號有進行中場次，餘額 321，呼叫 req-cashout 取得 PENDING 與核可金額 321
- n: 2
  action: 以該 TXID 呼叫 end-cashout
- n: 3
  action: 確認機台餘額歸 0，且原場次立即結束（不承接餘數）
- n: 4
  action: 以相同 TXID 再次呼叫 end-cashout
expected_result: end-cashout 完成當下餘額歸 0、場次立即結束（無餘數承接）；相同 TXID 再次送達回應成功但不重複扣分（分數已是 0，不會變負）
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §附錄-出金
  quote: end-cashout 扣分完成當下當前場次即結束，餘額歸 0、無餘數承接…同樣須對相同 TXID 的重複 end-cashout 具備冪等性
