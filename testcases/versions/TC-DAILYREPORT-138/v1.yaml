priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 測試場館 Arcade 下有一個區間 R（AC 範例 9/01～9/15）、其內一個有資料的營業日 D（AC 範例 9/10），且 D 當日機台 A（自行從環境中選定）有場次
test_data: []
steps:
- n: 1
  action: 統計維度「依場館彙總」、統計週期「按日」、機台帳號留空、結算日期選 R，搜尋；記錄起始條件 C1（統計維度、結算日期 R、機台帳號為空）
- n: 2
  action: 點營業日 D 列的場館名鑽取至「依機台明細」；記錄條件 C2（統計維度、結算日期、機台帳號）
- n: 3
  action: 點機台 A 的機台帳號鑽取至「依場次明細」，確認麵包屑為三層
- n: 4
  action: 點麵包屑第一層「場館」；檢視統計維度、結算日期、機台帳號與麵包屑層數，並與 C1 比對
- n: 5
  action: 再依步驟 2～3 鑽取回第三層
- n: 6
  action: 點麵包屑第二層「結算期間」；檢視統計維度、結算日期、機台帳號與麵包屑層數，並與 C2 比對
- n: 7
  action: 在此「依機台明細」（兩層）狀態下點麵包屑第一層「場館」；檢視統計維度、結算日期、機台帳號與麵包屑層數，並與 C1 比對
expected_result: 步驟 4：回到「依場館彙總」，結算日期還原為 R、機台帳號還原為空（＝C1），麵包屑剩一層；步驟 6：回到「依機台明細」，結算日期為 D～D、機台帳號還原為空（＝C2，該層鑽取前的條件），麵包屑剩兩層；步驟 7：回到「依場館彙總」，結算日期還原為
  R、機台帳號為空（＝C1），麵包屑剩一層。
