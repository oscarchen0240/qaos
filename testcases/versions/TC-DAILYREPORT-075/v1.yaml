title: 場次數：依機台明細等於該機台當日已結束場次數，依場館彙總等於底下所有機台場次數加總
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-009
acceptance_criteria_ids:
- AC-DAILYREPORT-0091
- AC-DAILYREPORT-0092
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個場館，其底下至少兩台機台當日皆有已結束場次記錄（僅使用狀態明確為『已結束』的場次，避開逾時結束或日結結算狀態，以迴避場次結束狀態範圍尚未明確定義的模糊地帶）
test_data: []
steps:
- n: 1
  action: 透過『機台交易紀錄』或對應的場次查詢功能，分別核對這兩台機台當日各自狀態為『已結束』的場次筆數，記錄下來
- n: 2
  action: 進入場館日結報表，統計維度選『依機台明細』，結算日期設為當日，查詢，記錄每台機台的『場次數』欄位
- n: 3
  action: 統計維度改選『依場館彙總』，查詢，記錄場館彙總列的『場次數』
expected_result: 依機台明細：每台機台的場次數與步驟1核對的該機台已結束場次筆數相符；依場館彙總：場次數等於該場館底下所有機台場次數的加總（＝步驟1兩台機台場次數之和）
