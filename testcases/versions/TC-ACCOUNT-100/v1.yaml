priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 開啟一個既有的機台帳號（自行從環境中選定；若環境中尚無，可先依「創建會員帳號」功能於一個機台場館下建立一個）且已產生過機台憑證的會員詳細頁「機台憑證」區塊，記錄目前遮罩顯示的前後 4 碼
- n: 2
  action: 點擊「重置憑證」並完成二次確認
- n: 3
  action: 檢視結果
expected_result: 確認後完整顯示新憑證內容一次，並可複製；新憑證的前後 4 碼與步驟一記錄的舊值不同
