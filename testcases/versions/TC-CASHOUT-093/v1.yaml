title: 待核實與已作廢的紀錄不計入提款次數與提款金額
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-006
acceptance_criteria_ids:
- AC-CASHOUT-0061
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆仍為『待核實』的機台洗分交易，記錄該機台帳號當前的提款次數與提款金額
- n: 2
  action: 確認未對其執行核實，再次檢視該機台帳號的提款次數與提款金額
- n: 3
  action: 另取得一筆『已作廢』的機台出金交易，同樣確認其對應機台帳號的提款次數與提款金額未因該筆作廢紀錄而變動
expected_result: 待核實與已作廢的紀錄皆不計入提款次數與提款金額，只有『已核實』狀態的紀錄才會在核實當下被計入
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作
  quote: 並於核實當下把該筆累計進該機台帳號於會員列表的「提款次數」「提款金額」（金額以站台核心貨幣原值累計、不換算 USDT；待核實與已作廢不計）
