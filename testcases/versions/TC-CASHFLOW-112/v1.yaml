steps:
- n: 1
  action: 確認 M 後台分數恰為 399.6
  expected: M 分數 = 399.6
- n: 2
  action: M 送出 req-cashout
  expected: 回 0-OK；核可金額為 399.6（含小數，不取整為 399 或 400），並回覆該筆出金的 TXID_1
- n: 3
  action: M 送出 end-cashout，帶 TXID_1
  expected: 回 0-OK
- n: 4
  action: 後台讀 M 分數
  expected: M 分數為 0（機台餘額歸 0）
- n: 5
  action: 查看收據面額：過渡期為前台結算結果畫面的『結算分數』（若僅以 API 驗證，以 req-cashout 回覆的核可金額為準）
  expected: 面額數值等於 399.6（收據例示 399.60）。小數位數與顯示格式 spec 未定義，只比對數值相等，不斷言字串寫成 399.6 或 399.60
- n: 6
  action: 後台 4.1 查看這筆機台出金
  expected: 金額為 -399.6
