title: 按下結算機台連不上平台時分數不扣，重按後前一筆待確認出金自動被新的一筆取代
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-024
acceptance_criteria_ids:
- AC-CASHFLOW-0241
- AC-CASHFLOW-0242
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- scenario
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashout 取得 PENDING（TXID1）與核可金額，但不呼叫 end-cashout（模擬機台連不上平台、自行結束流程）
- n: 2
  action: 確認機台分數未扣（一毛都沒扣）
- n: 3
  action: 再次呼叫 req-cashout（模擬玩家或店員再按一次結算），記錄 TXID2
- n: 4
  action: 確認 TXID1 是否自動被取代、新請求（TXID2）是否正常受理
expected_result: 第一次無回應時分數未扣；再按一次結算後，前一筆待確認出金（TXID1）自動被新的一筆（TXID2）取代，不需人工處理，新請求正常處理
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/出金
  quote: 按了結算卻沒有任何反應…分數一毛都沒扣，請玩家或店員再按一次結算即可。就算平台端留有前一筆待確認的出金，也會被新的一筆自動取代，不需人工處理
assumptions: []
