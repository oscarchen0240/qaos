title: 場館日結時間到達時，所有進行中場次一律結束並標記日結結算，剩餘分數轉為隔日新場次期初餘額
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-038
acceptance_criteria_ids:
- AC-CASHFLOW-0381
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
design_techniques:
- state_transition
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 以 Admin 登入 站台列表，將該場館日結時間設定為便於測試觀察、即將到達的時刻
- n: 2
  action: 確認該場館至少兩台機台皆有進行中場次，分別記錄其當下餘額
- n: 3
  action: 等待日結時間到達
- n: 4
  action: 查詢兩台機台的場次狀態與新場次期初餘額
expected_result: 日結時間到達時，兩台機台的進行中場次皆結束並標記為「日結結算」，各自的剩餘分數精確轉為隔日新場次的期初餘額（不多不少）
