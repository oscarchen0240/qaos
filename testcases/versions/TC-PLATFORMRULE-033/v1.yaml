title: 機台出金核實完成後，出金審核頁面查無該筆機台出金項目
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-001
acceptance_criteria_ids:
- AC-PLATFORMRULE-0011
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- scenario
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 站台切換下拉選單切換至一個既有的機台場館站台
- 於『帳務管理 > 洗分出金核實』頁面尋找一筆狀態為『待核實』的機台出金申請並完成核實（含收據核銷），記錄核實完成的時間與對象機台帳號
test_data: []
steps:
- n: 1
  action: 於『帳務管理 > 出金審核』頁面，設定查詢區間涵蓋剛才核實完成那筆機台出金交易的時間範圍
- n: 2
  action: 檢視查詢結果列表，尋找是否存在該筆機台出金項目；若查詢區間內另有線上會員的出金審核項目，一併記錄
expected_result: 出金審核頁面的查詢結果中查無剛才核實完成的那筆機台出金項目；頁面僅列出線上會員的出金審核項目（若查詢範圍內原本就有其他線上會員的出金審核項目，仍正常列出，僅機台出金不出現）
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §既有功能對機台帳號的排除規則 + §對既有章節的影響
  quote: 3.2 | 出金審核 | 不進入本流程。機台出金為現場即時核可並印出收據，不需後台審核
assumptions:
- text: 機台出金申請本身的產生方式（現場即時核可、印出收據）屬機台端硬體現場流程，非本 spec 定義的後台 UI 操作；本 TC 假設測試環境的『洗分出金核實』頁面當下存在或可產生一筆狀態為『待核實』的機台出金申請供核實使用，若環境當下查無待核實項目，需洽環境負責人透過機台模擬工具或既有測試資料補上一筆，此步驟超出本
    spec 定義範圍
