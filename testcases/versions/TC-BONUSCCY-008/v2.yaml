title: 嘗試停用站台核心貨幣本身對應的錢包幣別，系統應阻擋
product: ba-admin
functional_area: BONUSCCY
requirement_ids:
- REQ-BONUSCCY-004
acceptance_criteria_ids:
- AC-BONUSCCY-006
spec_id: SPEC-BONUSCCY-001
spec_version: '1.0'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 一個站台的核心貨幣為其自身鏈上錢包管理中目前已啟用的某個幣別（例如機台站台核心貨幣 TWD）
test_data: []
steps:
- n: 1
  action: 至該站台的鏈上錢包管理，找到核心貨幣本身對應的那個幣別項目（例如 TWD）
- n: 2
  action: 嘗試將該幣別項目的狀態切換為停用
expected_result: 系統阻擋，不允許停用站台核心貨幣本身對應的幣別（若實際錯誤訊息文案與此不同，不視為違反本條，僅測是否被阻擋）；若系統允許停用，代表核心貨幣可能變成不在啟用幣別清單中，直接違反 REQ-BONUSCCY-004
