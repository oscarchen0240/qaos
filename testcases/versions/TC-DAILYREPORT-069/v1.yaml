title: 交易發生在日結時間前一分鐘時，計入前一個營業日
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-007
acceptance_criteria_ids:
- AC-DAILYREPORT-0071
