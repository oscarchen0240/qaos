test_level: ui_e2e
test_types:
- functional
- boundary
design_techniques:
- boundary_value
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個日結時間設定為 06:00 UTC+0 的既有場館（可於場館設定頁核對）
- 確認該場館下有一筆交易或場次記錄的時間點落在 2026-09-05 05:59 UTC+0（即日結時間前一分鐘）；若無現成案例，可改選其他已知落在對應場館日結時間前一分鐘的既有交易記錄
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，統計週期選『按日』，統計維度選『依場館彙總』或『依機台明細』，結算日期設為涵蓋 2026-09-04 與 2026-09-05 的範圍，查詢
- n: 2
  action: 檢視 2026-09-05 05:59 UTC+0 這筆交易被計入哪一個『結算期間』（營業日）列
expected_result: 該筆 05:59 UTC+0 的交易被計入營業日 2026-09-04 那一列，而非 2026-09-05
