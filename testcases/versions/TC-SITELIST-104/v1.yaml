title: 待開通、暫停、關閉狀態下網域異動不觸發狀態改變
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-017
acceptance_criteria_ids:
- AC-SITELIST-0172
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個狀態為待開通的站台，編輯新增一筆網域並儲存，檢視狀態是否改變
- n: 2
  action: 取一個狀態為暫停的站台，編輯新增一筆網域並儲存，檢視狀態是否改變
- n: 3
  action: 取一個狀態為關閉的站台，編輯新增一筆網域並儲存，檢視狀態是否改變
expected_result: 三種情況下，站台狀態皆維持原狀（待開通/暫停/關閉），不會因網域異動而自動切換為更新待審
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §站台狀態（「更新待審」列） + §業務規則與驗證（「網域異動觸發」列）
  quote: 站台處於「開通」或「更新待審」狀態下，若前台或後台網域有異動，儲存後自動切換；待技術部門完成設定後由 Admin 人工切回「開通」／站台為「開通」或「更新待審」時，儲存若有網域新增或刪除，系統自動切為「更新待審」；適用於所有角色
