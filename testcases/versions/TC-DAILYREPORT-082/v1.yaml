preconditions:
- 以 Admin 登入後台
- 選定一個當日收據金額中部分已核銷、部分仍待核實的既有機台
test_data: []
steps:
- n: 1
  action: 進入場館日結報表，結算日期設為當日，統計維度選『依機台明細』，查詢
- n: 2
  action: 檢視該機台列的『已兌現金額』與『未兌現金額』兩欄，並與帳務管理『洗分出金核實』頁該機台當日收據核實狀態的明細加總比對
expected_result: 已兌現金額＝該機台當日已核實（核銷）的收據金額合計；未兌現金額＝截至查詢當下仍待核實的收據金額合計；兩者與『洗分出金核實』頁的明細加總相符
