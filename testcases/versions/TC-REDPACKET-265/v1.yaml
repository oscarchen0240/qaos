title: 舊活動的注單在新活動期間被取消：取消排程後立即以相同設定重建新活動，舊活動注單的 －300 不扣到新活動的累計
description: 舊活動的注單在新活動期間被取消：取消排程後立即以相同設定重建新活動，舊活動注單的 －300 不扣到新活動的累計
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-008
- REQ-REDPACKET-017
acceptance_criteria_ids:
- AC-REDPACKET-0087
- AC-REDPACKET-0173
spec_id: SPEC-REDPACKET-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
