title: 櫃檯對機台帳號人工出金時，系統同時取消該機台尚未完成的出金 PENDING
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-027
- REQ-CASHFLOW-022
acceptance_criteria_ids:
- AC-CASHFLOW-0271
- AC-CASHFLOW-0221
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
design_techniques:
- requirement_based
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashout 建立一筆尚未完成的出金 PENDING，記錄 TXID
- n: 2
  action: 以 Admin／櫃檯身份登入後台，對該機台帳號執行既有的人工出金功能
- n: 3
  action: 確認該筆出金 PENDING 是否被同時取消
- n: 4
  action: 以原 TXID 呼叫 end-cashout（驗證是否已無法完成，避免同一筆錢被領兩次）
expected_result: 櫃檯執行人工出金的同時，系統同時取消該機台尚未完成的出金 PENDING；之後以原 TXID 呼叫 end-cashout 因查無有效對應 PENDING 而回 1-NO RECORD（依 REQ-CASHFLOW-022），避免同一筆錢被領兩次
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/出金 + §業務規則與驗證/人工出金連動
  quote: 櫃檯對機台帳號人工出金時，必須同時取消該機台尚未完成的出金交易｜收到 end-cashout 但查無 PENDING 或 TXID 不符時，僅記錄 log 後丟棄，回 1-NO RECORD
