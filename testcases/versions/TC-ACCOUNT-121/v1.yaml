spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- error_guessing
priority: low
risk: low
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以機台帳號的登入帳密登入前台（現場人員設定機台時所用的帳密）
- n: 2
  action: 嘗試進入優惠活動頁面或每日簽到功能並嘗試領取
expected_result: 系統不應核發任何優惠或簽到獎勵給機台帳號；實際行為（是否有主動阻擋機制，或僅是介面本來就不會被一般玩家操作到而『天然』不會發生）需人工比對實測結果後確認（見假設）
expected_result_spec_reference:
  spec_id: SPEC-ACCOUNT-001
  spec_version: '0.1'
  location: §既有功能對機台帳號的排除規則
  quote: 優惠活動與簽到（帳密僅供機台本身登入使用，玩家無從參與）
assumptions:
- text: Spec 僅說明機台帳密不交付玩家、實務上『天然』不會發生，未明確要求系統層級主動阻擋機台帳號參與優惠活動或簽到；本案例假設『系統仍應具備防護』僅為建議性推測，需人工確認產品是否要求此防護，以及若無防護時實際會發生什麼（例如是否真的核發了獎勵）
  requirement_id: REQ-ACCOUNT-032
  needs_human_confirmation: true
