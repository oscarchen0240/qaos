risk: high
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
  AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
- 機台 A 為自行從環境中選定的既有機台帳號（會員編號），須在該管理員管轄範圍內的機台場館；需要第二台機台時另選一台不同的既有機台帳號
- 機台 A 的場次形狀（AC-0094，AC 範例日結時間 06:00、D＝9/10、D+1＝9/11，實際以場館的 T 為準）：場次 S2 於營業日 D 內開始（AC 範例 9/10 20:00），在 D 結束、D+1 開始的那個日結時刻被日結強制結束（狀態「日結結算」，AC
  範例 9/11 06:00）；餘分轉入的新場次 S3 於同一個日結時刻（D 結束、D+1 開始的那一刻，AC 範例 9/11 06:00）開始，查詢時仍進行中
- 因為 S3 必須在查詢時仍進行中，本案只能在 D+1 營業日當天執行（S3 一旦結束就會被計入 D+1，形狀就不成立）；機台 A 在 D 內沒有 S2 以外的已結束場次、在 D+1 內也沒有 S3 以外的場次（使 D 列應為 1、D+1 列應為
  0）
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘分如何處置 spec 未定義，CLR-DAILYREPORT-017 尚未回覆；本案不依賴也不斷言該行為）
test_data:
- name: S2
  value: D 內開始、在 D 結束／D+1 開始的日結時刻被日結結算
  note: AC 範例 9/10 20:00 → 9/11 06:00
- name: S3
  value: 同一日結時刻（D+1 開始）起、查詢時進行中
  note: AC 範例 9/11 06:00 起
- name: 預期場次數（D 列／D+1 列）
  value: 1 ／ 0
steps:
- n: 1
  action: 先確認造數形狀：統計維度選「依場次明細」、統計週期選「按日」、機台帳號填機台 A、結算日期 D～D+1，搜尋；記錄 S2 與 S3 的場次編號、開始時間、結束時間（S3 的結束時間應顯示「—」）。此步只用來確認造數形狀成立，不判定這兩場次出現在依場次明細的哪一天的列
  expected: S2 開始於 D、結束時間為 D 結束、D+1 開始的那個日結時刻；S3 開始於同一個日結時刻、結束時間顯示「—」；若不符，停止並回報環境負責人，不要繼續判定
- n: 2
  action: 統計維度改選「依機台明細」，統計週期「按日」，機台帳號與結算日期（D～D+1）不變，搜尋
- n: 3
  action: 找到機台 A 在 D 的列與在 D+1 的列，分別記錄「場次數」
expected_result: 機台 A 在 D 的列場次數 1（S2 雖在 D 結束、D+1 開始的那個日結時刻才被結束，仍歸屬其開始的營業日 D）；在 D+1 的列場次數 0（S2 不計入 D+1；S3 於該日結時刻開始、屬 D+1，但查詢時仍進行中，進行中不計入）。
