title: 刪除推薦註冊金設定須二次確認，確認後永久刪除、清單中不再出現、且無任何復原入口
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-017
acceptance_criteria_ids:
- AC-MEMBER-024
spec_id: SPEC-MEMBER-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 推薦註冊金設定列表存在至少一筆既有設定
test_data: []
steps:
- n: 1
  action: 點擊該筆設定旁的刪除圖示，確認彈出確認視窗
- n: 2
  action: 於確認視窗點擊確認
- n: 3
  action: 重新整理列表，確認該筆設定已從清單移除
- n: 4
  action: 於推薦註冊金設定列表頁確認該列（含整頁）無任何「復原」/「還原」/「取消刪除」按鈕、連結或選單項；依spec.md全文（無任何回收桶/垃圾桶頁面或操作歷程復原功能的定義），本頁面之檢查已涵蓋spec所定義的驗證範圍——若日後系統新增回收桶或操作紀錄等功能，需回頭補測本案例
expected_result: 彈出確認視窗；確認後該筆設定被永久刪除，重新整理後清單中不再出現該筆記錄；推薦註冊金設定列表頁不存在任何復原此操作的按鈕或入口（spec全文未定義回收桶或操作歷程復原功能，本案例之驗證範圍以此頁面為準）
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.4.3 列表欄位
  quote: 點擊旁側刪除圖示後，彈出確認視窗，確認後刪除該筆設定，操作不可復原
