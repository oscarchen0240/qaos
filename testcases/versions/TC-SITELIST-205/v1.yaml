title: 修改場館額度上限後即時生效，且不回溯影響既有設定的其他站台
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-005
acceptance_criteria_ids:
- AC-SITELIST-0052
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 取一個既有的機台類型站台，記錄其目前額度上限值 X
- n: 2
  action: 將額度上限修改為新值 Y 並儲存
- n: 3
  action: 重新開啟編輯畫面確認新值已生效
- n: 4
  action: 檢視另一個不同機台站台的額度上限，確認其值未受影響
expected_result: 該站台額度上限立即更新為 Y（重新整理即可見）；另一個機台站台的額度上限維持原值，不受影響（『既有機台餘額不受影響』一句涉及機台帳號分數餘額，此為 ACCOUNT/實體機台交易範疇，不在 SITELIST 頁面可觀察範圍內，本
  TC 不對餘額本身斷言）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
