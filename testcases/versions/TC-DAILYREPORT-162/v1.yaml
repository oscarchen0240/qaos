title: 查詢與匯出 CSV 的同時有人核實或作廢收據：每一次回應都自洽（每列收據金額＝三欄之和、總計列＝各列之和、收據金額不變），事後的最終查詢反映全部核實與作廢
description: 驗證報表在查詢／匯出執行期間，同一時段有另一帳號持續核實與作廢收據時，單次回應（畫面查詢與 CSV）內部一致（RUN-20261012-007 T3RR RF-10）。
requirement_ids:
