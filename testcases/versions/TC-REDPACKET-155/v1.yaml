preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定一名既有線上會員（玩家 A），本週期無注單計入累計；記下玩家 A 目前 USDT 錢包餘額
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】可模擬遊戲商對已結算的指定注單送來『取消』或『重結算』（負值有效流水貢獻，重結算為 －300 再 ＋300）的測試手段（例如遊戲商模擬器／測試後門），並可指定是哪一筆注單
test_data:
- name: 活動
  value: 門檻 1000／上限 5／固定 10／稽核 1
- name: 注單
  value: X＝有效流水貢獻 784；Y＝有效流水貢獻 300
steps:
- n: 1
  action: 建立活動『RP-RESETTLE』（活動時間『永久』）：活動幣種 USDT；預設規則門檻 1000／上限 5／固定 10／稽核 1；每日重置；儲存
  expected: 建立成功
- n: 2
  action: 玩家 A 依序結算注單 X（有效流水貢獻 784）、注單 Y（300）
  expected: Y 結算時累計 1,084 達標，產生 1 個待開啟紅包 P1，『週期累計』1,084；餘量 84
- n: 3
  action: 對注單 Y 觸發遊戲商『重結算』（先 －300 再 ＋300，結果同為 300）
  expected: 沒有新增紅包（紅包明細仍只有 P1，P1 仍為待開啟）
- n: 4
  action: 玩家 A 結算有效流水貢獻 915
  expected: 累計 84＋915＝999，未達門檻，沒有新紅包（若重結算讓累計多算了 300，這裡會多產生紅包）
- n: 5
  action: 玩家 A 結算有效流水貢獻 1
  expected: 累計恰 1,000 達標：產生第 2 個紅包 P2，『週期累計』顯示 2,000（1,084＋916），證明重結算後累計仍是 84
- n: 6
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 注單被重結算（－300＋300）後累計仍為 84：不新增紅包，之後再累計 915 未達標、再加 1 才達標，第 2 個紅包的週期累計為 2,000。
