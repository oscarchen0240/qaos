title: 分數因投注輸完歸 0 時，場次結束並標記為歸零結束
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-036
acceptance_criteria_ids:
- AC-CASHFLOW-0361
