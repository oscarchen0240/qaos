priority: high
risk: high
execution_mode: manual
preconditions:
- 主站台 A（線上、核心貨幣 USDT）底下有子站台 A1；備妥 A 的『管理員』與『站長』後台帳號各一（角色權限以 A 為所屬站台）
- A 與 A1 目前都沒有進行中或排程中的紅包活動；由 A 的管理員在 A 與 A1 各建立一個活動：A 的『RP-SCOPE-A』、A1 的『RP-SCOPE-A1』（永久、活動幣種 USDT、預設規則門檻 100／上限 5／固定 10／稽核
  1、總預算 5000）
- 【環境註記】CLR-REDPACKET-054 已回答：線上站長在紅包功能的範圍為自身站台、不含子站台，與 SPEC-ROLEPERM-001@0.2 通則（站長管轄含子站台）不一致，另以文件問題回報 PM；本案依 CLR-054 的回答設計
test_data:
- name: 決策表
  value: 角色（管理員／站長）× 站台（自身 A／子站台 A1）→ 可否檢視與操作紅包活動
steps:
- n: 1
  action: 【格 1：管理員 × 自身站台】以 A 的管理員登入，站台切到 A，進入『活動排程 > 紅包活動』，檢視 RP-SCOPE-A 列表、點名稱進入紅包明細，並對其『追加預算』（輸入 6000）
  expected: 可檢視列表與紅包明細，可追加預算（總預算變 6000）
- n: 2
  action: 【格 2：管理員 × 子站台】同一管理員，站台切到子站台 A1，檢視 RP-SCOPE-A1 列表、點名稱進入紅包明細，並對其『追加預算』（輸入 6000）
  expected: 可檢視列表與紅包明細，可追加預算（管理員範圍含其子站台）
- n: 3
  action: 【格 3：站長 × 自身站台】以 A 的站長登入，站台切到 A，檢視 RP-SCOPE-A 列表、點名稱進入紅包明細，並對其『追加預算』（輸入 7000）
  expected: 可檢視列表與紅包明細，可追加預算（總預算變 7000）
- n: 4
  action: 【格 4：站長 × 子站台】同一站長嘗試檢視與操作 A1 的紅包活動：若站台切換選單提供 A1，切到 A1 後嘗試進入『活動排程 > 紅包活動』、點 RP-SCOPE-A1 的名稱、對其『追加預算』；若選單不提供 A1，記錄之
  expected: 站長在紅包功能的範圍為自身站台、不含子站台：無法檢視或操作 A1 的紅包活動（RP-SCOPE-A1 的列表／明細／追加預算皆不可用）；呈現方式——選單不提供 A1，或選到 A1 後不顯示活動／被拒——只記錄、不判定
- n: 5
  action: 檢視 RP-SCOPE-A1 的總預算（以管理員）
  expected: 仍為 6000（站長沒有改動到 A1 的活動）
- n: 6
  action: 清理：以管理員於 A、A1 各對其活動點『取消排程』並確認
  expected: 已取消排程
expected_result: 決策表：管理員 × 自身站台 ＝ 可；管理員 × 子站台 ＝ 可；站長 × 自身站台 ＝ 可；站長 × 子站台 ＝ 不可（線上站長在紅包功能的範圍為自身站台、不含子站台，依 CLR-REDPACKET-054）。
