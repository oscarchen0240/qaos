title: 三種統計維度下，列表上的每個欄位標題皆可排序並顯示排序指示
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-022
acceptance_criteria_ids:
- AC-DAILYREPORT-0225
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- 三種統計維度下，各自選一段查詢條件使列表至少有 3 列、且各欄位數值不全相同（含場次編號、場館／機台、期初餘額、期末餘額欄）
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」，搜尋；記錄列表上的全部欄位標題（含：結算期間、場館／機台、場次數、開分金額、洗分金額、已核實洗分、待核實洗分、進鈔金額、收據金額、已兌現金額、未兌現金額、現金淨收、有效投注額、損益、期初餘額、期末餘額）；逐一點擊每一個欄位標題各一次（每次點擊另一欄時該欄由遞增開始），檢視該標題的指示是否為
    ▲；數值欄（場次數、各金額欄、期初／期末餘額、損益等）另檢視列順序是否依數值遞增；文字與時間欄（結算期間、場館／機台、場次編號、開始／結束時間）只記錄實際列順序，不作判準
- n: 2
  action: 統計維度改選「依機台明細」，搜尋；重複步驟 1 的逐欄點擊
- n: 3
  action: 統計維度改選「依場次明細」，搜尋；記錄全部欄位標題（含場次編號、開始／結束時間、場次時長等該維度新增的欄位）；重複步驟 1 的逐欄點擊
expected_result: 三種統計維度下，列表上的每個欄位標題都可點擊排序：點擊後該標題顯示 ▲，數值欄的列順序依數值單調遞增；不存在點擊後無反應或無排序指示的欄位。文字與時間欄（結算期間、場館／機台、場次編號、開始／結束時間，含進行中場次結束時間「—」）的實際排序規則
  spec 未定義，只記錄實際順序、不作為通過與否的判準。
