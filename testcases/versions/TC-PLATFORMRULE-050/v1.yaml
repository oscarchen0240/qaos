title: 操作員於機台交易紀錄查詢頁查詢自身所屬場館以外的交易，查無結果
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-015
acceptance_criteria_ids:
- AC-PLATFORMRULE-0151
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
- security
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 依『後台管理員系統』新增一個操作員角色帳號，將其所屬場館指定為一個既有機台場館 X
- 以該操作員帳號登入後台
test_data: []
steps:
- n: 1
  action: 進入『各式報表 > 交易紀錄查詢』頁面
- n: 2
  action: 嘗試以場館 X 以外的另一個既有機台場館 Y 為條件查詢（若頁面提供場館篩選欄位，檢視其選項；若無此欄位，直接查詢並比對結果範圍）
expected_result: 查詢結果中查無場館 Y（或任何非自身所屬場館 X）的交易紀錄，僅能查得場館 X 範圍內的機台交易；若頁面提供場館篩選欄位，選項不包含場館 Y
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §角色與權限
  quote: 機台交易紀錄查詢 | 全部 | 管轄範圍 | 自身場館
assumptions:
- text: 本 TC 需要測試環境當下存在至少兩個不同的既有機台場館（操作員所屬場館 X 之外，另需一個場館 Y 且該場館有機台交易紀錄，作為『查無結果』的對照）；若環境當下僅有一個機台場館或場館 Y 無任何交易紀錄，需先洽環境負責人補上對應資料才能執行本
    TC 的對照比較
  requirement_id: REQ-PLATFORMRULE-015
