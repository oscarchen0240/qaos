test_data:
- name: 機台名稱
  value: A 區 03 號
steps:
- n: 1
  action: 以 Admin 登入後台並切換至機台場館，點擊「創建會員帳號」，帳號類型選「機台」，機台名稱欄位輸入「A 區 03 號」並建立
- n: 2
  action: 至會員列表找到該新帳號，檢視會員編號下方顯示的暱稱
expected_result: 帳號建立成功，會員列表該帳號的會員編號下方顯示暱稱「A 區 03 號」
