title: 操作員不具備作廢權限，無法執行作廢操作
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-029
acceptance_criteria_ids:
- AC-CASHOUT-0291
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- security
- negative
design_techniques:
- security_rule
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以一個既有的『操作員』角色帳號登入後台（自行從環境中選定）
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 以操作員身分登入後台，取得一筆待核實的機台出金紀錄
- n: 2
  action: 檢視該筆紀錄的操作欄，確認是否提供『作廢』選項；若提供，嘗試點擊並觀察系統反應
expected_result: 操作欄不提供作廢選項給操作員（或即使嘗試觸發也被系統拒絕），操作員無法完成作廢
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作/作廢（僅出金）
  quote: 僅 Admin 與站長可執行
assumptions:
- text: 『操作員』角色的權限範圍（含是否限定單一場館）定義於開發包⑥ PLATFORMRULE，該包尚未完成 Phase 3 測試設計；本 TC 引用的規則文字取自 SPEC-CASHOUT-001 本身（非本 TC 自行推測），但目前測試環境中是否已存在一個確實依此規則設定好場館範圍的操作員帳號、以及後端是否已如文字所述拒絕跨場館請求，尚未獨立確認，需環境/PLATFORMRULE負責人協助確認後才能視為可重複執行的既定案例
  requirement_id: REQ-CASHOUT-029
  needs_human_confirmation: true
