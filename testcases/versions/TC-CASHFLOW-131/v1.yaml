preconditions:
- 測試用機台：自行從環境中選定一台狀態為『啟用』、所屬場館站台為『開通』的既有機台（下稱機台 M），並取得 M 現行有效的機台憑證（JWT，Bearer 帶入）。取得憑證的方式不在本 spec 範圍【環境前提，需環境負責人確認】。下文『機台送出』的請求，都以
  M 的憑證直接呼叫機台 API（Postman 或腳本）送出，不需要實體機台
- 以管理員（Admin）角色登入後台；後台查詢用 4.1 交易紀錄查詢（機台視角）與會員資料，並切換到 M 所屬的場館站台（若該頁以站台切換下拉選單限定範圍）；欄位與選單的實際名稱以環境畫面為準
- 【環境前提，spec 未定義】需要能在後台讀出機台帳號的『分數』：spec 只說分數等同機台帳號的帳戶餘額，未載明顯示在哪個頁面；下文以『會員詳細頁／會員列表的餘額』稱之，實際欄位位置請環境負責人確認
- 選用測試期間沒有其他機台或玩家同時交易的場館（額度判定的基準是『全場館機台分數餘額合計』，旁人的交易會讓下列數值失準）【環境前提，需環境負責人確認】
- 確認稽核倍數為預設 0 倍（帳務管理 > 出金設定 > TWD 頁籤；spec 預設值），否則洗分／出金核可金額會被稽核門檻扣減而干擾本案
- 額度上限的設定：額度上限屬站台列表的場館設定（spec 前言所引欄位）；【環境前提】修改後是否即時套用 spec 未載明，所以本案以探測步驟確認新額度已生效；動手前先記下原額度上限 Q_orig，執行完畢後還原
- 本案依賴的『機台 API 請求欄位名稱與 JSON 格式』（例如 req-cashin 的金額欄、end-cashin 的實際清點金額欄、TXID 欄）spec 未定義，依機台 API 文件（J型老虎機API文件-入金出金）組成請求；本案只寫各欄位的語意與數值
- end-cashin 要帶『入鈔機實際清點金額』（CLR-CASHFLOW-005）；純 API 直連環境沒有實體入鈔機，以請求中帶入的清點金額欄位為準，回覆碼與分數是判定依據，『機台退鈔』只在有實體機台時另行確認
test_data:
- name: S（場館所有機台帳號分數合計）
  value: 依環境讀出
  note: 下文 A = S + 100
- name: req-cashin 金額 ＝ end-cashin 實際清點金額
  value: 101
  note: 兩者相同，避免觸及『清點金額與聲稱金額不同』的未定義邊界（RF-03 待澄清）
- name: 額度上限（步驟 4 之後）
  value: 0
steps:
- n: 1
  action: 後台讀 M 分數 B0；逐一讀出 M 所屬場館所有機台帳號的分數並加總為 S；記下該場館『額度上限』原值 Q_orig；把額度上限設為 A = S + 100（非 0）
  expected: 取得 B0、S、Q_orig；額度上限 A 已儲存
- n: 2
  action: 對照（額度上限非 0）：M 送出 req-cashin，金額 101
  expected: 回 0-OK 並取得 TXID_1（req-cashin 階段不判定額度、不預留；AC-0071）；M 分數仍為 B0
- n: 3
  action: M 送出 end-cashin，帶 TXID_1，實際清點金額 101（加計後合計 S + 101，超過 A 共 1 單位）
  expected: 回 1-OVER LIMIT；後台讀 M 分數仍為 B0（不更新帳務；AC-0072）。同時確認 A 已即時生效。超限後 TXID_1 這筆 PENDING 的去向 spec 未定義（RF-06 待澄清），本案不斷言它的狀態，也不再用
    TXID_1 重送
- n: 4
  action: 把該場館『額度上限』改為 0
  expected: 額度上限 0 已儲存
- n: 5
  action: M 送出 req-cashin，金額 101（與步驟 2 相同），取得 TXID_2
  expected: 回 0-OK 並取得 TXID_2
- n: 6
  action: M 送出 end-cashin，帶 TXID_2，實際清點金額 101（與步驟 3 相同）
  expected: 回 0-OK；後台讀 M 分數 = B0 + 101；4.1 查 TXID_2 為『已完成』（AC-0091：未超限則更新帳務、關閉 PENDING）。同一筆清點金額在額度上限非 0 時被退、改為 0 後成立，差異只來自額度上限設定值
- n: 7
  action: 還原：把額度上限改回 Q_orig。TXID_1 留下的 PENDING 不處理、不依賴其狀態；M 餘額若需歸零，可送 req-keyout（mode=all、throshold=0）全洗，此為清理，不列入判定
expected_result: end-cashin 以入鈔機實際清點金額判定額度上限：額度上限為非 0 的 A 時，同一筆 101 超過剩餘額度，回 1-OVER LIMIT、不更新帳務；額度上限改為 0 後，同一筆 101 回 0-OK、分數增加
  101、該筆轉為已完成——0 代表不限制，end-cashin 路徑也不會把 0 當成上限 0。
