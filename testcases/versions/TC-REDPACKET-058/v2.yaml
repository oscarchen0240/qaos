title: 機台場館操作員的紅包明細：經活動排程點活動名稱進入、僅自身場館且唯讀（不能新增、追加預算、取消排程）
description: 機台場館操作員的紅包明細：經活動排程點活動名稱進入、僅自身場館且唯讀（不能新增、追加預算、取消排程）
product: ba-admin
functional_area: REDPACKET
requirement_ids:
- REQ-REDPACKET-024
acceptance_criteria_ids:
