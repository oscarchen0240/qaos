test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台洗分交易，先於該機台帳號的會員列表記錄核實前的提款次數與提款金額
- n: 2
  action: 於本頁對該筆交易執行核實（依 REQ-CASHOUT-021 流程）
- n: 3
  action: 核實完成當下，再次檢視該機台帳號的提款次數與提款金額
expected_result: 提款次數較核實前 +1；提款金額較核實前增加本筆實際金額，以站台核心貨幣原值累計，不換算 USDT
