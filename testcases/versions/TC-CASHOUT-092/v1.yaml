title: 核實當下，該筆金額以原值累計進該機台帳號的提款次數與提款金額
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-006
acceptance_criteria_ids:
- AC-CASHOUT-0061
spec_id: SPEC-CASHOUT-001
