title: 櫃檯對機台帳號人工入金時，不使既有的入金 PENDING 失效，兩者可分別繼續走完流程
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-028
acceptance_criteria_ids:
- AC-CASHFLOW-0281
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: integration
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 呼叫 req-cashin 建立一筆入金 PENDING，記錄 TXID（不呼叫 end-cashin）
- n: 2
  action: 以 Admin／櫃檯身份登入後台，對該機台帳號執行既有的人工入金功能，補入一筆分數
- n: 3
  action: 確認該筆入金 PENDING 是否仍為有效狀態
- n: 4
  action: 以原 TXID 呼叫 end-cashin，確認是否仍可正常完成
expected_result: 既有的入金 PENDING 不受人工入金影響，仍可各自繼續走完流程（以原 TXID 呼叫 end-cashin 仍正常完成入帳）——與人工出金必須連動取消既有 PENDING 的規則相反，兩者刻意不對稱
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
