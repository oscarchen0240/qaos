- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 在根層對某關鍵字進行搜尋，確認結果不包含子層才有的站台
- n: 2
  action: 鑽入某個子站台層級，套用一個篩選條件，確認即使上層或其他層級有符合條件的站台，結果也不會出現
expected_result: 無論在哪一層套用篩選或搜尋，結果都只限於當前所在層的站台，不包含其他層級（即使其他層級也有符合條件的站台）
