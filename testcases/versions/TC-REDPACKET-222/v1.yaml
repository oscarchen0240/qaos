preconditions:
- 以具備優惠活動管理權限的後台角色（站長或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動（已取消、已結束的活動不列入重疊判斷），否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】測試用玩家帳號可於前台以指定幣種下注並結算出指定的有效投注額；所用遊戲的貢獻系數已確認為 100%（確認方式：後台 遊戲商管理 > 遊戲貢獻值設定；該頁在線上站台的存在與操作為依機台場館選單推測，需確認），下文稱為『100%
  遊戲』
- 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
- 【環境前提，spec 未定義，需工程提供】可程式化地讓多筆注單『幾乎同時』結算（例如以腳本模擬遊戲商的注單結算通知，或同時操作多個前台工作階段各自結算）；結算通知的介面與格式 spec 未定義，由工程提供。每筆注單的有效流水貢獻須可指定（貢獻系數
  100% 的遊戲，有效投注額＝有效流水貢獻）
- 整個測試須在同一個 UTC+0 日內完成（避開 UTC+0 00:00 前後 30 分鐘），否則每日重置會干擾累計與待開啟紅包
- 選定三名既有線上會員（玩家 A、B、C，彼此不同），本週期皆無注單計入累計
- 本案重複 5 輪；每一輪用一個全新的活動（上一輪的活動取消排程後立即以相同設定重建，使三人的累計從 0 重新起算）。每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』
test_data:
- name: 活動
  value: 門檻 100／上限 5／固定 30／稽核 0／總預算 30／每日重置
- name: 玩家累計
  value: A、B、C 各 90，再各結算 10（同時）
- name: 輪數
  value: 5 輪
steps:
- n: 1
  action: 【每一輪】建立活動『RP-POOL-n』（n 為輪次；活動時間『永久』）：活動幣種 USDT；預設規則門檻 100／上限 5／固定 30／稽核 0；總預算 30；每日重置；儲存
  expected: 建立成功；預算使用 0 ／ 30
- n: 2
  action: 【每一輪】玩家 A、B、C 各自依序結算有效流水貢獻 90（共 3 筆，逐筆完成，不同時）
  expected: 三人累計各 90，沒有任何紅包；預算使用仍 0 ／ 30
- n: 3
  action: 【每一輪】以腳本讓三人各一筆有效流水貢獻 10 的注單『幾乎同時』結算（三人的累計同時恰好達到門檻 100）
  expected: 請求送出
- n: 4
  action: 【每一輪】檢視 RP-POOL-n 的紅包明細，以及『活動排程 > 紅包活動』列表該活動的預算使用與狀態旁標示
  expected: 紅包明細恰 1 筆紅包（金額 30、狀態『待開啟』），由 A、B、C 其中一人取得（誰取得不判定）；預算使用 30 ／ 30，占用任何時候都不得大於總預算 30；狀態旁標示『預算用罄』
- n: 5
  action: 【每一輪】另外兩名未取得紅包的玩家各再結算有效流水貢獻 100
  expected: 仍不產生紅包（預算用罄期間達標的門檻不產生、不補發）；紅包明細仍 1 筆；預算使用 30 ／ 30
- n: 6
  action: 【每一輪結束】於『活動排程 > 紅包活動』對該輪活動點『取消排程』並於確認視窗點『確認取消』，再回到步驟 1 進入下一輪
  expected: 已取消排程
expected_result: A、B、C 三人同時達標、剩餘預算只夠一個紅包時，每一輪都只產生 1 個紅包（金額 30）、預算使用恰為 30 ／ 30（不得大於總預算）、活動標示『預算用罄』；其餘兩人該門檻不產生紅包且之後不補發。
