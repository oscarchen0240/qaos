title: 多帳號同時達標爭用同一池總預算（剩餘只夠一個）：只產生 1 個紅包、預算占用不超過總預算、用罄標示、其餘不補發（重複 5 輪）
description: 多帳號同時達標爭用同一池總預算（剩餘只夠一個）：只產生 1 個紅包、預算占用不超過總預算、用罄標示、其餘不補發（重複 5 輪）
