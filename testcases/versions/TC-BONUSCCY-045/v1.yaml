preconditions:
- 一個線上（USDT核心貨幣）站台已啟用一種以上幣別錢包
- 已有一個該站台的既有線上會員帳號與其登入憑證（自行從環境中選定；與REQ-BONUSCCY-005驗證的機台帳號為不同站台、不同帳號）
test_data: []
steps:
- n: 1
  action: 以該線上會員帳號登入前台
- n: 2
  action: 進入前台資產列表
- n: 3
  action: 檢視列表顯示的幣別項目
expected_result: 資產列表列出該站台所有已啟用的幣別，包含餘額為 0 的幣別項目，維持改動前既有行為，不受本次機台站台專屬改動影響
