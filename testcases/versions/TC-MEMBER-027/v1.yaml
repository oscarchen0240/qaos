test_data: []
steps:
- n: 1
  action: 點擊頁面頂部「OTP報表」按鈕，開啟彈窗
- n: 2
  action: 輸入指定年份與月份（例如 2026 / 08）
- n: 3
  action: 點擊「搜尋」
- n: 4
  action: 檢視查詢結果
- n: 5
  action: 點擊 ✕ 關閉彈窗，確認返回會員列表頁
expected_result: 彈窗顯示指定年月的 OTP 使用次數查詢結果；點擊 ✕ 後彈窗關閉，返回會員列表頁不受影響
