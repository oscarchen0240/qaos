priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一台當日已有開分、洗分、入金、出金四種交易皆發生過的既有機台
test_data: []
steps:
- n: 1
  action: 透過『機台交易紀錄』頁篩選該機台當日的交易紀錄，分別加總開分金額、洗分金額、入金金額、出金金額（收據金額）四類總額，記錄作為比對基準
- n: 2
  action: 進入場館日結報表，統計維度選『依機台明細』，結算日期設為當日，查詢，檢視該機台列的開分金額、洗分金額、進鈔金額、收據金額四欄
expected_result: 報表四欄金額分別與步驟1由機台交易紀錄加總出的開分、洗分、入金、出金總額相符（開分金額＝開分總額；洗分金額＝洗分總額；進鈔金額＝入金總額；收據金額＝出金總額）
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §列表欄位/開分~收據金額
  quote: 收據金額 | 當日出金總額（印出的收據面額合計；過渡期機台暫無印表機時，為結算結果畫面顯示的出金金額合計）
