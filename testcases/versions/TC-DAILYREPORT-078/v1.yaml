title: 開分／洗分／進鈔／收據金額分別等於當日對應類型交易的加總
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-010
acceptance_criteria_ids:
- AC-DAILYREPORT-0101
spec_id: SPEC-DAILYREPORT-001
