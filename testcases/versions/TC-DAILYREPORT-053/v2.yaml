title: 已結束場次不可再變回進行中
preconditions:
- 已登入後台並切換至機台場館站台（Arcade）
- 測試場館已設定日結時間 06:00 UTC+0
- 測試場館下有機台 A（會員編號已知），可開啟其會員詳細頁「機台資訊」區塊
- 各式報表 > 場館日結報表 可用（依場次明細只列已結束／逾時結束／日結結算的場次，依 CLR-DAILYREPORT-012）
steps:
- n: 1
  action: 依場次明細取得機台 A 一個「已結束」場次，記錄其場次編號
- n: 2
  action: 對機台 A 再產生開分或投注
- n: 3
  action: 開啟機台 A 的會員詳細頁「機台資訊」區塊
- n: 4
  action: 依場次明細重新查詢
expected_result: 步驟 3：機台資訊區塊顯示一個進行中場次，其場次編號不同於步驟 1；步驟 4：步驟 1 的場次仍為「已結束」，狀態未變回進行中
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §背景：場次資訊（場次定義：從機台有分數開始玩起算，到洗分、出金或分數歸 0 為止，算一個場次）+ §背景：場次資訊／場次呈現位置（會員詳細頁「機台資訊」區塊：顯示該機台目前進行中的場次摘要）
