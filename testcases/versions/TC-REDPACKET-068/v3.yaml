title: 洗分請求送出後、完成前：領取按鈕停用並顯示『交易處理中』、紅包不可領取；完成後作廢
description: 洗分請求送出後、完成前：領取按鈕停用並顯示『交易處理中』、紅包不可領取；完成後作廢
