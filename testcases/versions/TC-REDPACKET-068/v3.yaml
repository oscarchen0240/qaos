execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分與洗分；機台端洗分門檻為已知的正值或 0（機台端設定，後台無此設定）
- 【自足佈置】(1) 建立機台場館紅包活動『RP-LOCKW』（活動時間『永久』）：重置方式每日、預設規則門檻 100／上限 5／固定 20／稽核 0；儲存。(2) 機台帳號 M1（自行從環境中選定，本週期無注單）結算有效流水貢獻 100，產生
  1 個待開啟紅包 P1，不開啟。(3) M1 分數餘額須大於機台端洗分門檻（使洗分可成立）
- 【環境前提，spec 未定義，需環境負責人／工程確認可行】洗分在 SPEC-ARCADE-001 是單階段交易（req-keyout，平台回覆成功即扣分），沒有人工可觀察的『已送出、尚未完成』空窗；本案需要借助測試手段（例如可延遲平台回覆或暫緩處理的機台模擬器／代理）讓洗分請求停在已送出、未完成。若環境沒有此手段，本案無法執行，應回報，不要改以別的方式推斷
- 領取流程＝點機台畫面上亮起的紅包圖示 → 紅包視窗 → 點『領取獎勵（N）』→ 確認領取視窗點［確認領取］
test_data: []
steps:
- n: 1
  action: 店員在 M1 以鑰匙選單『指定金額』洗分（金額不超過核可上限），在跳出的『尚有紅包未開啟，交易完成後將作廢』確認視窗選［繼續結算］，並透過環境手段讓該洗分請求停在已送出、尚未完成
  expected: 洗分交易處於進行中（M1 分數尚未扣除）
- n: 2
  action: 玩家在 M1 前台點紅包圖示開啟紅包視窗，查看領取按鈕
  expected: 『領取獎勵』按鈕停用並顯示『交易處理中』
- n: 3
  action: 嘗試點擊領取 P1
  expected: 無法領取；M1 分數不變
- n: 4
  action: 讓洗分交易完成
  expected: 洗分完成；後台紅包明細 P1 狀態『已作廢』
- n: 5
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 洗分請求送出後、交易完成前，領取按鈕停用並顯示『交易處理中』，紅包無法領取；洗分完成後 P1 依規則作廢。
