title: 指定金額洗分且洗完後餘額仍足夠再洗一次同額時，重按會造成重複扣款（已知風險非缺陷）
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-018
acceptance_criteria_ids:
- AC-CASHFLOW-0181
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: high
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data:
- name: 機台餘額
  value: 1000
- name: throshold
  value: 100
- name: 指定洗分金額
  value: 300
steps:
- n: 1
  action: 透過人工入金將機台帳號分數佈置為 1000，throshold=100
- n: 2
  action: 呼叫 req-keyout，mode=value、throshold=100、指定金額 300，確認回 0-OK，餘額變為 700
- n: 3
  action: 在未查後台確認的情況下，直接以完全相同參數再次呼叫 req-keyout（模擬機台顯示失敗後店員重按）
expected_result: 第二次同樣回 0-OK 並再扣款 300（餘額變為 400）——系統不會偵測或阻擋，此為 spec 明確點名的已知風險情境，需仰賴現場 SOP（先查後台機台交易紀錄再決定是否重做）因應，而非系統缺陷
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/洗分（機台顯示失敗時要怎麼辦）
  quote: 指定金額洗分、且洗完後餘額仍足夠再洗一次同額時，第二次會成功…玩家就被扣了兩次卻只拿到一次現金
