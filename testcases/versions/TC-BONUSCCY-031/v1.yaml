execution_mode: manual
preconditions:
- 以 Admin 登入後台，至該機台站台的鏈上錢包管理，將核心貨幣本身對應的錢包幣別（例如 TWD）停用
- 必須使用機台站台（非線上站台）——洗分為機台版前台功能，線上站台無此入口，Oscar 2026-09-15 確認入金/出金/開分/洗分四項操作皆於機台版前台進行，對應 SPEC-CASHFLOW-001 §兩階段/單階段對照表的 API
test_data: []
steps:
- n: 1
  action: 於機台版前台選擇「全洗 all」或輸入指定金額 value，觸發 req-keyout（洗分，單階段立即結束當前場次並扣分）
- n: 2
  action: 觀察回應（是否回 0-OK 並完成扣分）
expected_result: req-keyout 應被阻擋，不應回 0-OK 並完成扣分；若實際錯誤訊息/狀態碼文案不同，不視為違反本條，僅測是否被阻擋
