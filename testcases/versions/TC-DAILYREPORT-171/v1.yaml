preconditions:
- 已以管理員登入後台（所選機台場館須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至該機台場館站台（自行從環境中選定一個機台場館）
- 進入 各式報表 > 場館日結報表
- 營業日依場館的日結時間 T（UTC+0，場館設定欄位，第 152 行）切分：自某日 T 起至次日 T 前的交易屬同一營業日，營業日以起算日期標示（AC-DAILYREPORT-0071／0072：T=06:00 時，9/5 05:59 的交易計入
  9/4，9/5 06:00 的交易計入 9/5）。結算日期欄與列表上的日期皆為營業日；測試人員位於非 UTC 時區時，須先依 T 把營業日換算成 UTC+0 的時間範圍，避免差一天
- 機台 A 為自行從環境中選定的既有機台帳號（會員編號），屬於上述場館；A 在『目前營業日』（以查詢當下依 T 判定）沒有其他入金與出金，餘額為 0，沒有進行中場次，且整個測試在同一個營業日內完成（不要跨過日結時刻）
- 重送完成回報的方式：由環境負責人提供可對指定機台的指定交易重送第二階段完成回報（end-cashin／end-cashout，內容與 TXID 與原回報完全相同）的機台模擬器或請求重放工具。重送機制與請求格式不在本 spec 內，本案不預設；若環境沒有任何可重送的工具，本案記為『受阻』（blocked），不判通過也不判失敗，並回報環境負責人；入金／出金的
  TXID 由該工具或『機台交易紀錄』取得
- 本案不假設重送在交易層會被如何處理（忽略、冪等或另記一筆皆有可能），也不斷言重送時機台金流端的回應。判定分兩段：先以『機台交易紀錄』確認：(1) 每個被重送的 TXID 都只有一筆紀錄，且 (2) 機台 A 當日入金、出金的紀錄總筆數等於本案造出的筆數（見各分支步驟，不得多出重送另記的新
  TXID 紀錄）；兩項都成立才斷言報表重送前後相同。任一項不成立代表交易層問題（含重送被記成另一個 TXID 的新紀錄），記錄後停止，不判報表 FAIL（報表依第 50、51 行是當日入金／出金交易的合計，交易層多記一筆時報表加總是正確行為）
- 收據只做『出金』，不核實也不作廢（維持待核實，以便觀察未兌現）。（造數方式為我的推測，需環境負責人確認）本規格未定義如何造出指定時間的開分／出金交易與收據，也沒有後台入口可直接建立出金；我推測出金（收據）由機台端產生、核實與作廢在『帳務管理
  > 洗分出金核實』執行（第 111 行），因此造數由環境負責人以環境既有的機台操作或造數工具完成。出金一律清空餘額（第 128 行），故一張收據的面額＝出金當下機台的餘額（AC-DAILYREPORT-0104：機台餘額帶小數 → 收據面額帶小數）
- 第二段（步驟 6 起）需要『核實／作廢帳號』：有權限在『帳務管理 > 洗分出金核實』核實與作廢出金的後台帳號（核實與作廢的角色權限不在本 spec，本案不驗證權限）；若與管理員不是同一個，需切換登入，回到報表查詢時切回管理員並重選站台。核實與作廢可能無法復原，請視為不可復原；核實／作廢後重新查詢，報表應立即反映最新狀態（第
  53、70 行：狀態一律以查詢當下為準），若重新查詢仍是舊值，記錄實際延遲並視為與 spec 的偏差回報，不要等待更新後再讀取並判定通過
test_data:
- name: 第一段：入金／出金（收據 R1）
  value: 入金 500 一次、出金一次（收據面額 500，維持待核實）；兩者的第二階段完成回報各重送 3 次
- name: 第二段：收據 R2
  value: 入金 300 一次、出金一次（收據面額 300），之後核實；出金的完成回報在核實後才遲到重送 3 次
- name: 第二段：收據 R3
  value: 入金 200 一次、出金一次（收據面額 200），之後作廢；出金的完成回報在作廢後才遲到重送 3 次
- name: 預期（第一段 Z1、Z2）
  value: 相對 Z0：進鈔 +500、收據 +500、未兌現 +500；重送後 Z2＝Z1
- name: 預期（第二段 Z3、Z4）
  value: 相對 Z2：進鈔 +500、收據 +500、未兌現 +0（R2、R3 皆已轉出）、已兌現 +300、已作廢 +200；遲到重送後 Z4＝Z3（未兌現不重新出現、已兌現與已作廢不重複）
steps:
- n: 1
  action: 以管理員登入並選好站台，開啟場館日結報表：統計維度『依機台明細』、統計週期『按日』、機台帳號填機台 A、結算日期為目前營業日 ～ 目前營業日，搜尋；記錄 A 當日列的『開分』『洗分』『進鈔』『收據』『已兌現』『未兌現』『已作廢』（基準
    Z0）
  expected: 取得基準 Z0（預期進鈔 0、收據 0、未兌現 0、已兌現 0、已作廢 0，若不為 0 代表前提 A 當日無其他入金／出金不成立，更換機台）
- n: 2
  action: 對機台 A 進行一次入金 500（兩階段皆正常完成），再進行一次出金（餘額 500 清空，收據 R1 面額 500，維持待核實）；從『機台交易紀錄』或測試工具記下入金與出金各自的 TXID 與面額（TXID_in1、TXID_out1）
  expected: 入金、出金各完成一次；取得 TXID_in1 與 TXID_out1
- n: 3
  action: 以步驟 1 相同條件重新查詢，記錄同樣七欄（記為 Z1）
  expected: 相對 Z0：進鈔金額增加 500、收據金額增加 500、未兌現金額增加 500；開分、洗分、已兌現、已作廢不變
- n: 4
  action: 用前提的重送工具，對 TXID_in1 的第二階段完成回報重送 3 次，對 TXID_out1 的第二階段完成回報重送 3 次（內容與 TXID 與原回報相同）；記錄每次重送的回應（只記錄，不判定）。若環境無法重送，記為受阻並停止。接著到『機台交易紀錄』查看機台
    A 當日 TXID_in1 與 TXID_out1 各有幾筆紀錄，以及 A 當日入金與出金的紀錄總筆數；並到『帳務管理 > 洗分出金核實』確認收據 R1 目前仍為待核實
  expected: 分支判定：(a) TXID_in1 與 TXID_out1 各只有一筆紀錄，且 A 當日入金、出金的紀錄總筆數各為 1（只有本案那兩筆），且 R1 仍為待核實 → 繼續步驟 5 並依其判定報表；(b) 任一 TXID 出現多筆，或入金／出金的紀錄總筆數大於
    1（含重送被另記成新 TXID），或 R1 的狀態被改變 → 記錄為交易層／核實層問題（附紀錄截圖與筆數），停止本案並回報，不判定報表 FAIL，也不執行步驟 5 以後的判定
- n: 5
  action: （僅在步驟 4 為分支 (a) 時）以步驟 1 相同條件重新查詢，記錄同樣七欄（記為 Z2）
  expected: Z2 與 Z1 完全相同：進鈔金額仍只增加 500（不是 1000 或 2000）、收據金額仍只增加 500、未兌現金額仍只增加 500（只有一筆面額 500）；開分、洗分、已兌現、已作廢仍不變
- n: 6
  action: （第二段：收據已核實、已作廢之後完成回報才遲到）對機台 A 再進行一次入金 300（兩階段皆正常完成）與一次出金（收據 R2，面額 300），再進行一次入金 200 與一次出金（收據 R3，面額 200）；記下 TXID_in2、TXID_out2（R2）、TXID_in3、TXID_out3（R3）。此時先不要重送任何完成回報
  expected: 取得四個 TXID；R2、R3 目前皆為待核實
- n: 7
  action: 以『核實／作廢帳號』登入（必要時切換並重選站台），到『帳務管理 > 洗分出金核實』：對 R2（300）執行核實（核銷），對 R3（200）執行作廢（按鈕名稱與必填欄位以畫面為準）；再以管理員登入（必要時切回並重選站台），以步驟
    1 相同條件重新查詢，記錄同樣七欄（記為 Z3）
  expected: 相對 Z2：進鈔金額增加 500（300＋200）、收據金額增加 500、未兌現金額不變（R2、R3 已轉出，仍只剩 R1 的 500）、已兌現金額增加 300、已作廢金額增加 200；開分、洗分不變
- n: 8
  action: 用前提的重送工具，在 R2 已核實、R3 已作廢之後，對 TXID_out2 與 TXID_out3 的第二階段完成回報各重送 3 次（內容與 TXID 與原回報相同）；記錄回應（只記錄，不判定）。若環境無法重送，記為受阻並停止
  expected: 重送動作完成（回應內容不作判準）
- n: 9
  action: 到『機台交易紀錄』查看機台 A 當日 TXID_out2、TXID_out3（以及 TXID_in2、TXID_in3）各有幾筆紀錄，以及 A 當日入金與出金的紀錄總筆數；並以『核實／作廢帳號』（必要時切換並重選站台）到『帳務管理
    > 洗分出金核實』確認重送之後 R2、R3 目前的狀態
  expected: 分支判定：(a) 這四個 TXID 各只有一筆，且 A 當日入金、出金的紀錄總筆數各為 3（R1、R2、R3，只有本案造出的），且 R2 仍為已核實、R3 仍為已作廢 → 繼續步驟 10 並依其判定報表；(b) 任一 TXID
    出現多筆，或入金／出金總筆數大於 3，或 R2、R3 任一的狀態被改變（例如被改回待核實）→ 記錄為交易層／核實層問題（附紀錄與狀態截圖），停止本案並回報，不判定報表 FAIL（此時報表依第 53 行把待核實收據計入未兌現反而是正確行為）
- n: 10
  action: （僅在步驟 9 為分支 (a) 時）以步驟 1 相同條件重新查詢，記錄同樣七欄（記為 Z4）
  expected: Z4 與 Z3 完全相同：未兌現金額沒有重新增加（仍只有 R1 的 500），已兌現金額仍只增加 300、已作廢金額仍只增加 200（不重複），收據金額與進鈔金額相對 Z2 仍各只增加 500；開分、洗分不變
expected_result: 第一段：當機台交易紀錄中重送的入金 TXID 與出金 TXID 各只有一筆、且 A 當日入金／出金的紀錄總筆數各為 1 時，報表在重送前後完全相同——進鈔金額相對基準只增加該筆入金的 500，收據金額與未兌現金額各只增加該筆出金的收據面額
  500，重送前後（Z1、Z2）各金額欄不變。第二段：收據 R2 已核實、R3 已作廢之後，出金完成回報才遲到重送；當四個 TXID 各只有一筆、A 當日入金／出金紀錄總筆數各為 3，且 R2 仍為已核實、R3 仍為已作廢時，報表在遲到重送前後完全相同（Z3、Z4）：未兌現不重新出現（仍只有
  R1 的 500），已兌現（+300）與已作廢（+200）不重複，收據金額與進鈔金額不加倍。任一 TXID 出現多筆、總筆數多於預期（含重送被另記成新 TXID），或收據狀態被重送改變時，為交易層／核實層問題，記錄後停止，不判定報表；環境無法重送時記為受阻。（原文：第
  50 行『進鈔金額＝當日入金總額』、第 51 行『收據金額＝當日出金總額』、第 52 行已兌現、第 53 行未兌現為當日出金收據中仍待核實者的合計、第 54 行已作廢；本案的斷言只建立在『報表各欄＝當日交易紀錄的合計與各收據當下狀態』這個不變量上，沒有假設重送是否構成新交易。）
