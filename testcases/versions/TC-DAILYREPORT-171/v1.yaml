title: 機台重送第二階段完成回報（同 TXID）：收據待核實時重送、以及收據已核實或已作廢之後才遲到重送，只要機台交易紀錄中該 TXID 各只有一筆且入金、出金總筆數符合預期，報表的進鈔、收據、未兌現、已兌現、已作廢都與重送前相同
description: 驗證機台重送完成回報後，報表仍與交易層一致：以機台交易紀錄的 TXID 筆數與當日總筆數作為前置判定，只有交易層無重複紀錄時才判定報表（RUN-20261012-007 T3RR RF-13；iteration 2 補收據已核實／已作廢之後才遲到的分支，二次抽查
  RF-03）。環境無法重送時記為受阻，不判通過也不判失敗。
