preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台並切換至機台場館，點擊「創建會員帳號」，帳號類型選「機台」並送出建立
- n: 2
  action: 至該帳號的會員詳細頁「機台資訊」區塊，檢視機台資料
expected_result: 機台資訊區塊顯示恰有一台機台與此帳號綁定，且與帳號同時建立完成（無需額外操作）
