test_data: []
steps:
- n: 1
  action: 進入『後台管理員系統』的使用者列表，點擊新增使用者
- n: 2
  action: 檢視角色下拉選項清單
- n: 3
  action: 選擇「操作員」角色，檢視畫面是否出現可指定所屬場館的欄位，並嘗試選取一個既有機台場館作為所屬場館
expected_result: 角色選項清單包含「操作員」；選擇操作員角色後，畫面提供可指定所屬場館的欄位，且能選取一個既有機台場館作為其所屬場館
