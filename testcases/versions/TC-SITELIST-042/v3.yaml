title: 任何站台類型皆不提供刪除操作（前端與編輯畫面皆無入口）
product: ba-admin
functional_area: SITELIST
requirement_ids:
- REQ-SITELIST-022
acceptance_criteria_ids:
- AC-SITELIST-0221
spec_id: SPEC-SITELIST-001
spec_version: '0.4'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 站台列表
test_data: []
steps:
- n: 1
  action: 取一個線上類型站台，檢視其列表與編輯畫面的可用操作
- n: 2
  action: 取一個機台類型站台，檢視其列表與編輯畫面的可用操作
expected_result: 兩種類型（線上／機台）皆不提供刪除操作／按鈕（列表與編輯畫面皆找不到任何刪除入口）。（原因：刪除站台會影響站台樹狀結構——子站台歸屬與上下層關係——故 PM／後端定案不提供刪除功能，見 CLR-SITELIST-009；可用的狀態切換選項依角色而定，非本案例斷言範圍，見
  REQ-SITELIST-016）
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §操作/刪除站台（此節內容已由 CLR-SITELIST-009 確認為錯誤敘述，非現行產品行為）
  quote: 點擊列表「刪除」後顯示確認彈窗，列出站台名稱與代碼，二次確認後執行（＊此流程不存在於現行產品，見 CLR-SITELIST-009 PM 回覆）
