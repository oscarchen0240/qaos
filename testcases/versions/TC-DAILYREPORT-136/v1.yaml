title: 向下鑽取（場館彙總→機台明細）：點場館名後結算日期收斂為該列的結算期間，按日列收斂為單日、按週列收斂為該週起訖
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-026
acceptance_criteria_ids:
