priority: medium
risk: medium
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 測試場館 Arcade 下有一個涵蓋至少一個完整週（週一～週日）的區間 R（AC 範例 9/01～9/15，內含完整週 9/07～9/13），區間內各營業日有資料
test_data: []
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、結算日期選 R，搜尋；記錄目前的結算日期；點其中一個營業日列（AC 範例 9/10）的場館名
- n: 2
  action: 檢視：統計維度、結算日期、麵包屑層數
- n: 3
  action: 點麵包屑第一層「場館」（或手動把統計維度改回「依場館彙總」），並把結算日期重設為 R（鑽取後結算日期已收斂為單日，不是 R），統計週期改選「按週」，搜尋；找到結算期間為完整週（AC 範例 09-07～09-13）的列，點該列的場館名
- n: 4
  action: 檢視：統計維度、結算日期、麵包屑層數
expected_result: 步驟 2：統計維度切為「依機台明細」，結算日期收斂為該營業日單日（AC 範例 9/10～9/10），麵包屑變兩層；步驟 4：統計維度切為「依機台明細」，結算日期收斂為該週列的結算期間（AC 範例 9/07～9/13），麵包屑變兩層。
