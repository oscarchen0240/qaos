preconditions:
- 以一個既有的『站長』角色帳號登入後台（自行從環境中選定該站長所屬場館的帳號）
- 頁面標題下方的站台切換選單維持為該站長所屬場館
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 取得一筆待核實的機台出金紀錄，以站長身分對其點擊『作廢』
- n: 2
  action: 不填寫作廢原因欄，直接嘗試送出
expected_result: 系統阻擋此次送出，提示作廢原因為必填，該筆紀錄核實狀態維持不變（不會被作廢）
