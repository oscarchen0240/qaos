title: 一台機台同時間僅會有一個進行中場次，不會產生併發的第二個進行中場次
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-039
acceptance_criteria_ids:
- AC-CASHFLOW-0391
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- functional
design_techniques:
- error_guessing
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 確認機台帳號目前無進行中場次
- n: 2
  action: 以近乎同時的方式（例如平行送出，或由自動化工具連續快速送出）呼叫 req-keyin 與 req-cashin/end-cashin 各一筆，皆使分數轉正
- n: 3
  action: 查詢該機台帳號當下的進行中場次數量
expected_result: 無論觸發時序多接近，該機台同時間只會存在一個進行中場次，不會因為多筆幾乎同時的分數轉正事件而產生兩個併發的進行中場次
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §場次/場次如何開始與結束
  quote: 併發 | 一台機台同時間只會有一個進行中的場次
assumptions:
- text: 本 AC 標註為『理論情境』，真正的高並發競態通常需要能同時發送多筆請求的壓測/自動化工具才能可靠重現與驗證，一般手動或序列化的功能測試僅能模擬『幾乎同時』而非真正併發；是否有可用的並發測試工具/環境需與自動化或效能測試團隊確認
  requirement_id: REQ-CASHFLOW-039
  needs_human_confirmation: true
