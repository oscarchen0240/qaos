title: 核實（出金＝核銷收據）四步驟流程：查詢、核對彈窗、確認、櫃檯付現
product: ba-admin
functional_area: CASHOUT
requirement_ids:
- REQ-CASHOUT-022
acceptance_criteria_ids:
- AC-CASHOUT-0221
spec_id: SPEC-CASHOUT-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- state_transition
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 身分登入後台
- 頁面標題下方的站台切換選單已切換至一個既有的測試站台
- 進入 帳務管理 > 洗分出金核實
test_data: []
steps:
- n: 1
  action: 於本頁上方輸入一筆待核實出金交易的訂單編號查詢，並在結果中點擊『核實』（或直接於列表對該筆點擊『核實』）
- n: 2
  action: 確認彈窗顯示訂單編號、機台帳號、金額與收據印出時間，逐項核對與該筆紀錄一致
- n: 3
  action: 核對無誤後點擊確認
- n: 4
  action: （現場流程）櫃檯付現金給玩家——此步驟為現場操作，測試時以口頭/紀錄方式確認流程已知會執行人員，系統面僅需驗證前三步的狀態轉換
expected_result: 系統將該筆紀錄的核實狀態由『待核實』轉為『已核實』，並記錄執行核實的人員與時間；核實即代表該筆收據已核銷
expected_result_spec_reference:
  spec_id: SPEC-CASHOUT-001
  spec_version: '0.1'
  location: §操作/核實（出金＝核銷收據）
  quote: 1. 於頁面上方輸入收據上的訂單編號查詢...或直接在列表點擊「核實」 2. 確認彈窗顯示訂單編號、機台帳號、金額與收據印出時間，核對無誤後點擊確認 3. 系統標記為「已核實」，並記錄核實人員與時間 4. 櫃檯付現金給玩家
