title: 線上站台已啟用的遊戲於平台發布更新後，維持啟用狀態不受機台場館停用規則影響
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-023
acceptance_criteria_ids:
- AC-PLATFORMRULE-0231
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的線上站台，並於其『遊戲商管理』選定一款目前已啟用的既有遊戲
test_data: []
steps:
- n: 1
  action: 記錄該遊戲於此線上站台目前為啟用狀態
- n: 2
  action: 由具備權限的角色，對該遊戲發佈一次更新（與同一款遊戲對機台場館產生影響的更新事件相同）
- n: 3
  action: 更新完成後，重新檢視該遊戲於此線上站台的狀態
expected_result: 更新完成後，該遊戲於此線上站台維持啟用狀態不變，不受機台場館『預設停用』規則影響——因為該規則僅適用站台類型為「機台」的場館
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的遊戲更新
  quote: 適用範圍 | 僅站台類型「機台」的場館；線上站台維持既有行為，不受本規則影響
assumptions:
- text: 同 REQ-PLATFORMRULE-021，『平台對遊戲發佈更新』的實際後台操作介面與具體步驟不在本 spec 定義範圍內，此處假設可透過後台遊戲管理功能觸發，且該次更新動作屬平台層級事件、會同時影響同一款遊戲在線上與機台場館兩側的預設狀態判斷；若實際操作路徑與假設不符，結果需人工複核
  requirement_id: REQ-PLATFORMRULE-023
  needs_human_confirmation: false
  resolved_by_approval: APR-0125
