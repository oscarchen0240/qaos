title: 匯出 CSV 格式：欄位與順序同列表、狀態與作廢原因為畫面文字、未入帳／未作廢輸出『—』、時間為 UTC+0 YYYY-MM-DD HH:mm:ss、不含總計列
description: 匯出 CSV 格式：欄位與順序同列表、狀態與作廢原因為畫面文字、未入帳／未作廢輸出『—』、時間為 UTC+0 YYYY-MM-DD HH:mm:ss、不含總計列
