steps:
- n: 1
  action: 點擊「超級加盟商」按鈕，確認該列的佣金比例%、優惠%、返水%、推薦返傭%、行政費、稽核倍數欄位進入 Inline 編輯模式
- n: 2
  action: 修改佣金比例%與行政費為新數值
- n: 3
  action: 點擊列尾 ✓ 確認
- n: 4
  action: 重新整理列表，檢視該列數值
expected_result: 數值成功更新並儲存為修改後的新值，重新整理後仍維持新值
