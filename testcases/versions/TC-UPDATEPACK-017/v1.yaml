title: 已啟用三種幣別（含法幣 TWD 頁籤）時，展開清單恰好列出這三種幣別
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-001
acceptance_criteria_ids:
- AC-UPDATEPACK-0011
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的線上站台，於『帳務管理 > 鏈上錢包管理』核對該站台目前狀態為啟用的幣種恰為三種（含法幣頁籤幣別，若目前不足三種則先啟用至三種）
test_data: []
steps:
- n: 1
  action: 進入『會員與加盟商 > 會員列表』，任選一名該站台既有會員，展開其『帳戶餘額（主錢包）』欄
- n: 2
  action: 檢視展開後列出的幣別清單
expected_result: 展開清單恰好列出鏈上錢包管理中目前狀態為啟用的三種幣別，不多也不少
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示
  quote: 幣別清單來源 | 依「帳務管理 > 鏈上錢包管理」中狀態為啟用的幣種為準（含法幣頁籤的幣別）；狀態為關閉或禁用的幣種不列出。幣種增減隨鏈上錢包管理的啟用狀態連動，本功能不另行設定幣別清單
