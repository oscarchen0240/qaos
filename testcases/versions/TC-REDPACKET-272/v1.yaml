title: 追加預算重複送出：連點『確認』、API 重放同一請求、並送 3 個相同請求（逐請求時間記錄、至少 3 個有效輪），每次只增加一次、7.4 操作紀錄只多一筆
description: 追加預算重複送出：連點『確認』、API 重放同一請求、並送 3 個相同請求（逐請求時間記錄、至少 3 個有效輪），每次只增加一次、7.4 操作紀錄只多一筆
