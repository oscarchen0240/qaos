preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data:
- name: credit_limit
  value: -1
steps:
- n: 1
  action: 取一個既有的機台類型站台，點擊「編輯」，額度上限欄位輸入 -1 並嘗試儲存
- n: 2
  action: 若前端未阻擋而送出請求，觀察後端回應
expected_result: 前端顯示『值必須大於或等於 0』之類的錯誤提示並阻擋送出；即使繞過前端直接呼叫 API 帶入負數，後端同樣拒絕該請求，額度上限維持修改前的值
