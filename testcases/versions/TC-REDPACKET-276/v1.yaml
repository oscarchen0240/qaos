priority: high
risk: high
execution_mode: manual
preconditions:
- 以管理員或站長角色登入後台，站台切換下拉選單選到機台場館（站台類型＝機台，核心貨幣 TWD）；紅包版本已隨版本對所有機台場館上線、不設場館開關（場館建立紅包活動即參加），不需另行啟用場館
- 【先清空】確認該機台場館目前沒有進行中或排程中的紅包活動（後台站台切換選到該機台場館 > 優惠活動管理 > 活動排程 > 紅包活動子分頁，看『狀態』欄；若有，逐一於該列點『取消排程』並於確認視窗點『確認取消』，直到沒有狀態為『進行中』或『排程中』的活動；狀態為『已結束』『已取消』的活動仍會列在列表，不影響）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若狀態欄顯示『排程中』，等其變為『進行中』再開始下注（永久活動建立後多久生效，spec
  未明講，狀態文字與位置只記錄）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】機台前台遊戲畫面（以機台帳號登入）可讓測試人員以 TWD 下注並結算出指定的有效投注額；所用遊戲貢獻系數已確認為 100%（遊戲商管理 > 遊戲貢獻值設定）
- 【環境前提，spec 未定義佈置方式，需環境負責人確認】場館店員（持鑰匙）可透過機台鑰匙選單對測試機台帳號開分，使機台帳號有分數可下注；開分流程與開分對紅包的影響 spec 本案未定義（spec 只規定洗分／出金完成才會作廢待開啟紅包），本案除指定步驟外不洗分、不出金
- 【環境前提，spec 未定義，需工程提供】測試人員可用 API 工具（例如 REST 客戶端或瀏覽器開發者工具）以指定後台帳號的登入身分直接呼叫後端 API；各 API 的端點、參數與認證方式 spec 未定義，由工程提供。錯誤代碼與 HTTP
  狀態碼由後端定義，本案只核對『被拒絕』與『資料不變』
- 【環境前提，spec 未定義，需工程提供】可讓多個請求『幾乎同時』送出的手段（例如以腳本在同一時間點平行送出 N 個請求，或預先開好 N 個工作階段後以同一個觸發訊號同時送出）；『同時送出』無法保證每一輪都撞上競態，所以本案重複多輪，且每一輪的預期都是『不論誰先誰後都必須成立的最終一致結果』，不是指定誰先成立
- 【逐請求時間記錄與有效重疊判定】腳本須對每一個並行請求記錄：請求識別與送出帳號、送出絕對時間 t_send（UTC+0，至毫秒）、收到回應的絕對時間 t_resp（UTC+0，至毫秒）與回應內容。該輪有效 ⇔ max(所有請求的 t_send)
  < min(所有請求的 t_resp)（所有請求都在任一請求得到回應之前已送出）；不符者該輪作廢，不計入有效輪數，重做（重新佈置該輪）。有效輪數未達本案規定的下限時，不得判定通過（記為未完成）。人工口令同時按下只當補充觀察，不計入有效輪
- 機台帳號 M1（自行從環境中選定，本週期無注單）；另備兩個後台帳號：甲＝管理員、乙＝站長（皆可管轄該機台場館），分別用獨立瀏覽器登入；備妥『儲存』鈕的快速連點手段
- 整個測試須在同一個營業日內完成，且避開場館日結時間前後 30 分鐘（日結時間見『後台管理員系統 > 站台列表』該機台站台的『日結時間』），否則日結結算與每日重置會干擾累計與待開啟紅包
test_data:
- name: 活動
  value: 永久／每日重置／門檻 100／上限 5／固定 20／稽核倍數 0
- name: 重送次數
  value: UI 連點 3 次；API 逐次重送 2 次；兩人 API 並行送出至少 2 個有效輪
steps:
- n: 1
  action: 進入該機台場館『優惠活動管理 > 新增優惠活動』（活動類型僅『紅包』），填妥合法表單：活動名稱『RP-DUP-ARC』、活動時間『永久』、重置方式每日、預設規則門檻 100／上限 5／固定 20／稽核倍數 0，先不按儲存
  expected: 表單已填妥
- n: 2
  action: 【UI 連點】快速連點『儲存』3 次
  expected: 『活動排程 > 紅包活動』狀態為『進行中』或『排程中』的活動恰 1 個，沒有重複建立
- n: 3
  action: 【API 重放】以 API 工具逐次重送與步驟 1 相同的『新增紅包活動』請求 2 次
  expected: 兩次皆被阻擋（時段重疊）；進行中／排程中的活動仍恰 1 個
- n: 4
  action: 取消 RP-DUP-ARC 的排程（確認視窗點『確認取消』）。【兩人 API 並行送出，至少 2 個有效輪】甲（管理員）、乙（站長）各用自己的憑證備妥一份時段重疊的『新增紅包活動』API 請求（甲＝『RP-RACE-ARC-ADM』永久；乙＝『RP-RACE-ARC-MGR』區間約
    2 分鐘後～約 30 天後；其餘設定同步驟 1），以腳本並行送出，並依『逐請求時間記錄』記下兩個請求的 t_send、t_resp 與回應；第 1 個有效輪結束後取消存活活動的排程再做下一輪，最後一個有效輪不取消
  expected: 每輪依 max(t_send) < min(t_resp) 判定是否有效，無效者作廢（取消存活活動）重做。有效輪：進行中／排程中的活動恰 1 個，另一個被阻擋、未建立；以活動名稱與回應判定勝方（人工在畫面上同時按『儲存』只當補充觀察，不計有效輪）
- n: 5
  action: （上一步最後一輪不取消存活的活動，等它變為『進行中』）店員對 M1 開分 200；M1 結算有效流水貢獻 100
  expected: 只產生 1 個紅包（紅包明細 1 筆；M1 紅包視窗『本期已獲得』1 ／ 5）
- n: 6
  action: 清理：測試結束後於機台場館『活動排程 > 紅包活動』對該活動點『取消排程』，於確認視窗點『確認取消』，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 機台場館建立活動被重複送出或兩人同時建立時段重疊的活動時：同一時間只存在 1 個進行中或排程中的紅包活動，其餘請求被阻擋、資料不寫入；M1 結算達門檻只產生 1 個紅包。
