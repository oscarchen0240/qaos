title: 機台場館建立紅包活動重複送出與兩人 API 並行送出（不同帳號、逐請求時間記錄、至少 2 個有效輪）：連點、API 重放、管理員與站長同時建立重疊活動，最終只存在 1 個活動，M1 結算只產生 1 個紅包
description: 機台場館建立紅包活動重複送出與兩人 API 並行送出（不同帳號、逐請求時間記錄、至少 2 個有效輪）：連點、API 重放、管理員與站長同時建立重疊活動，最終只存在 1 個活動，M1 結算只產生 1 個紅包
