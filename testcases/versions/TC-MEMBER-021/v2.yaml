title: 客製化加盟商 Inline 編輯修改欄位數值後點擊確認，成功儲存且重新整理後仍維持新值
product: ba-admin
functional_area: MEMBER
requirement_ids:
- REQ-MEMBER-014
acceptance_criteria_ids:
- AC-MEMBER-020
