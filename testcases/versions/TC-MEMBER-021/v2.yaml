priority: medium
risk: medium
execution_mode: manual
preconditions:
- 以 Admin 登入後台，進入加盟列表，取一名已設定客製化加盟商（S Partner）身分的會員
test_data: []
steps:
- n: 1
  action: 點擊「超級加盟商」按鈕，確認該列的佣金比例%、優惠%、返水%、推薦返傭%、行政費、稽核欄位進入 Inline 編輯模式
- n: 2
  action: 修改佣金比例%與行政費為新數值
- n: 3
  action: 點擊列尾 ✓ 確認
- n: 4
  action: 重新整理列表，檢視該列數值
expected_result: 數值成功更新並儲存為修改後的新值；重新整理列表後該列仍顯示新值（確認資料已持久化存入後端，非僅前端暫存狀態）
expected_result_spec_reference:
  spec_id: SPEC-MEMBER-001
  spec_version: '0.2'
  location: §2.2.3 客製化加盟商設定
  quote: 點擊列尾的 ✓ 確認儲存；或點擊 ✕ 取消並還原原始值
