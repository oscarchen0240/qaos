preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料，也未定義如何建立指定日期的出金收據；我推測出金（收據）由機台端（前台）交易產生、後台沒有直接建立指定日期出金的入口，此點需環境負責人確認。因此由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的
  AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日的場次、交易、收據與其核實狀態、結算時點的分數）作為預期值的比對來源
- 機台 A 為自行從環境中選定的既有機台帳號（會員編號），須在該管理員管轄範圍內的機台場館；需要第二台機台時另選一台不同的既有機台帳號
- 查詢範圍涵蓋兩個完整的週（各為週一到週日，共 14 個營業日）：第一週內機台 A 有三個營業日的注單數分別為 10、20、30，該週其餘營業日為 0（AC-0283 範例，數字可依環境調整）；第二週 A 各營業日的注單數依造數記錄（合計記為
  X，例如 15，不拘）
- 本案避開『注單跨場次切換點』的資料（一筆注單的投注與派彩分屬不同場次或營業日）：這種注單算進哪個場次／營業日 v0.3 未定義，不在本案驗證範圍；請挑選或佈置 查詢範圍內所有注單的投注與派彩皆落在同一場次、且各場次整段落在 查詢範圍內的機台與日期
test_data:
- name: 第一週三日注單數
  value: 10、20、30
- name: 預期第一週列注單數
  value: 60
steps:
- n: 1
  action: 統計維度選「依機台明細」、統計週期選「按日」、機台帳號填機台 A、結算日期設為上述兩週的範圍，搜尋；記錄各日列的「注單數」（確認第一週三日為 10、20、30，其餘依造數記錄）與列表底部總計列的「注單數」
  expected: 各日列注單數與造數記錄一致
- n: 2
  action: 統計週期改選「按週」，其餘條件不變，搜尋；記錄第一週列、第二週列的「注單數」與列表底部總計列的「注單數」
expected_result: 按週：第一週列注單數 60（＝10＋20＋30，該週各營業日注單數之和）、第二週列注單數 X；總計列注單數＝60＋X（各列合計），與步驟 1 按日查詢的總計列注單數相同。
