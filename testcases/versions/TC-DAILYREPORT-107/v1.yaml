title: 機台帳號篩選下，依場館彙總列的期末餘額只含該機台，不含場館其他機台
product: ba-admin
functional_area: DAILYREPORT
requirement_ids:
- REQ-DAILYREPORT-014
acceptance_criteria_ids:
- AC-DAILYREPORT-0145
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.2'
test_level: ui_e2e
test_types:
- functional
- negative
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 已以管理員登入後台（機台場館站台 Arcade 須在該管理員的管轄範圍內），並在頁面標題下方的站台切換下拉選單切換至機台場館站台（Arcade）
- 進入 各式報表 > 場館日結報表
- 測試場館（Arcade）已設定日結時間 T（UTC+0；以場館設定為準，目前 Arcade 為 00:00，若不同請以實際 T 換算）。營業日依 T 切分：自某日 T 起至次日 T 前的交易屬同一營業日；結算日期欄與列表上的日期皆為營業日，測試人員位於非
  UTC 時區或 T 不是 00:00 時，須依 T 把「某營業日」換算成對應的 UTC 時間範圍，避免差一天（T 前後的交易歸屬不同營業日）
- （歷史資料佈置）本規格未定義如何造出過去營業日的資料：由環境負責人預先造數，或從環境既有資料中挑選符合下列形狀者；說明中的 AC 範例日期與數字（如 9/10、1000）僅為示意，可平移為環境中的實際日期與數值，但營業日的連續關係與數值之間的關係必須保持；環境負責人須提供「造數記錄」（各機台於各營業日結算時點的分數、各項金額）作為預期值的比對來源
- 查詢範圍內不含狀態「逾時結束」的場次（逾時結束後留在機台的餘數是否承接、是否計入餘額，本 spec 未定義；為避免該未定義行為干擾餘額，請挑選或佈置不含逾時結束場次的資料）
- 營業日 D（過去的營業日）：機台 A 於 D 結算時點分數 200、機台 B 於 D 結算時點分數 150（AC 範例），場館內其他機台於 D 結算時點分數皆為 0（若不為 0，將其計入「機台帳號留空」時的預期值）
test_data:
- name: 機台 A D 結算時點分數
  value: 200（AC 範例）
- name: 機台 B D 結算時點分數
  value: 150（AC 範例）
steps:
- n: 1
  action: 統計維度選「依場館彙總」、統計週期選「按日」、結算日期選 D（單一營業日）、機台帳號留空，搜尋；記錄 D 列期末餘額 E_all
- n: 2
  action: 機台帳號填機台 A，其餘條件不變，搜尋；記錄 D 列期末餘額 E_A
- n: 3
  action: 機台帳號改填機台 B，其餘條件不變，搜尋；記錄 D 列期末餘額 E_B
expected_result: E_A＝200（僅含機台 A，不含 B 的 150）；E_B＝150（僅含機台 B）；E_all＝350（機台帳號留空時含場館全部機台）。
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.2'
  location: §列表欄位附註/期初餘額比照辦理（各列餘額涵蓋篩選條件內的所有機台；餘額比照機台帳號篩選條件）
  quote: 餘額涵蓋篩選條件內的所有機台
