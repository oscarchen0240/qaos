title: 遊戲因平台更新被停用後，若無人工操作，平台不會自動將其重新設為啟用
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-022
acceptance_criteria_ids:
- AC-PLATFORMRULE-0223
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一個既有的機台場館，於其『遊戲商管理』選定一款目前狀態為停用的既有遊戲，確認自其被設為停用以來尚未有任何站長執行過啟用操作
test_data: []
steps:
- n: 1
  action: 記錄該遊戲目前的停用狀態與檢視時間
- n: 2
  action: 間隔一段時間後（或重新整理/重新查詢該頁面），在不進行任何手動啟用操作的情況下，再次檢視該遊戲狀態
expected_result: 該遊戲狀態仍維持停用，未觀察到任何自動或排程機制將其重新設為啟用；平台本身不會主動代為開啟，需人工由站長執行
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的遊戲更新
  quote: 開啟方式 | 由站長自行於 遊戲商管理 啟用該遊戲；操作員不可操作；平台不代為開啟
