preconditions:
- 以具備優惠活動管理權限的後台角色（站長，或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）；財務角色能否檢視紅包明細、取消排程尚未定義（CLR-REDPACKET-015），所以除 023 系列案例外一律不用財務角色執行
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
- 前往『系統管理 > 會員等級設定』，記下目前『生效』方案的所有等級（序號與名稱，需至少 2 個等級）
test_data: []
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，活動類型選『紅包』
  expected: 表單載入
- n: 2
  action: 點『+ 新增等級規則』建立『等級規則 1』，檢視『適用等級』選項
  expected: 選項為生效會員等級方案的所有等級，顯示格式『VIP 等級序號・等級名稱』，與前置記下的清單一致
- n: 3
  action: 在等級規則 1 勾選其中一個等級（記為等級 X，例如序號 3）
  expected: 勾選成功
- n: 4
  action: 再點『+ 新增等級規則』建立『等級規則 2』，檢視其適用等級選項中的等級 X
  expected: 等級 X 為停用狀態，並標示所屬規則『等級規則 1』
- n: 5
  action: 嘗試點擊等級 X
  expected: 無法勾選
expected_result: 適用等級選項來自生效會員等級方案，顯示為『序號・名稱』；已被等級規則 1 勾選的等級在等級規則 2 停用並標示屬於等級規則 1，無法再被勾選。
