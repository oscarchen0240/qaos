test_data: []
steps:
- n: 1
  action: 機台餘額 321、門檻 100，送出全洗請求（req-keyout，mode=all）
- n: 2
  action: 檢視洗分後機台餘額
- n: 3
  action: 以剩餘餘額（21）再次嘗試送出洗分請求（req-keyout，mode=all）
expected_result: 洗出 300，機台餘額變為 21，餘數留在帳號上未被清除、系統不另記交易；第二次嘗試因核可金額為 0，回 1-NO CREDITS，無法洗出
