title: 餘額不足（1-NO CREDITS）被拒絕時不寫入交易紀錄，其餘未成立原因才留下紀錄
product: ba-admin
functional_area: CASHFLOW
requirement_ids:
- REQ-CASHFLOW-030
acceptance_criteria_ids:
- AC-CASHFLOW-0301
- AC-CASHFLOW-0302
spec_id: SPEC-CASHFLOW-001
spec_version: '0.1'
test_level: api
test_types:
- negative
design_techniques:
- equivalence_partitioning
priority: high
risk: medium
execution_mode: manual
preconditions:
- 已知一台已核發有效機台憑證（JWT，依 創建會員帳號_spec_v01.md 建立）的既有機台帳號（自行從測試環境選定），並取得可用於直接呼叫機台端 API 的 Bearer Token（本包無獨立 UI，四種金流與 PENDING 生命週期皆由機台廠商韌體呼叫
  API 觸發，故以直接呼叫 API 模擬機台/前台行為進行驗證）
test_data: []
steps:
- n: 1
  action: 佈置洗分或出金因餘額不足而回 1-NO CREDITS 的情境並送出請求
- n: 2
  action: 查詢機台交易紀錄，確認是否留下此次拒絕的紀錄
- n: 3
  action: 另佈置一筆會因額度上限（或其他非餘額不足原因）被拒絕的請求並送出
- n: 4
  action: 查詢機台交易紀錄，確認是否留下「未成立」紀錄
expected_result: 餘額不足被拒絕時：查無此次拒絕的紀錄，僅回覆 1-NO CREDITS；額度上限或其他原因被拒絕時：留有「未成立」交易紀錄，可查得拒絕原因——兩者行為不同，容易被誤以為所有拒絕都會留紀錄
expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.1'
  location: §四種金流/交易不成立的原因 + §附錄-狀態碼對照
  quote: 餘額不足 | 洗分時可洗金額為 0…或出金時餘額為 0。屬正常情形。不寫入交易紀錄——平台僅回覆機台餘額不足；本表其餘原因才會留下「未成立」紀錄
