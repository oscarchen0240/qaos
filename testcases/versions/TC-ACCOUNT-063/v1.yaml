title: 帳號一律歸屬建立當下所在站台，切換站台後歸屬隨之改變
product: ba-admin
functional_area: ACCOUNT
requirement_ids:
- REQ-ACCOUNT-003
acceptance_criteria_ids:
- AC-ACCOUNT-0031
