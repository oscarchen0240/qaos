execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 進入 會員與加盟商 > 會員列表
test_data: []
steps:
- n: 1
  action: 以 Admin 登入後台，切換站台選單至站台 A（自行從環境中選定），點擊「創建會員帳號」建立一個線上帳號，記錄其所屬站台
- n: 2
  action: 將站台選單切換至另一個不同站台 B（自行從環境中選定），再次點擊「創建會員帳號」建立一個線上帳號，記錄其所屬站台
expected_result: 第一個帳號所屬站台為 A；第二個帳號所屬站台為 B，兩者分別對應建立當下所在的站台，不受先前操作影響
