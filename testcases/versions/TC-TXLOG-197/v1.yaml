steps:
- n: 1
  action: 透過會員詳細資料頁記錄該機台帳號出金前的餘額
- n: 2
  action: 對該機台帳號發起一筆出金交易並使其完成
- n: 3
  action: 檢視該筆交易的請求金額欄與實際金額欄
expected_result: 請求金額與實際金額兩者皆等於出金前的餘額（全額清空），且兩者彼此相等
