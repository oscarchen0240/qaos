test_data: []
steps:
- n: 1
  action: 確認一個機台場館所屬主站台的核心貨幣（自行從環境中選定，記錄其核心貨幣，例如 TWD）
- n: 2
  action: 於該場館下點擊「創建會員帳號」，帳號類型選「機台」並建立
- n: 3
  action: 檢視該帳號的幣別
expected_result: 該機台帳號的幣別與所屬主站台的核心貨幣一致
