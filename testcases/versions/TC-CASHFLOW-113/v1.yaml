expected_result_spec_reference:
  spec_id: SPEC-CASHFLOW-001
  spec_version: '0.2'
  location: §出金（第 168 行）
  quote: 平台只記錄面額，不管現場實際付現多少，零頭怎麼付由場館自行決定，平台也不記錄面額與實付的差額；交易紀錄、核實與場館日結報表的收據金額、已兌現金額、現金淨收一律以面額計
steps:
- n: 1
  action: 先完成餘額佈置：使 M 餘額恰為 399.6（見前提）。若 M 原有餘額，先以洗分 req-keyout mode=all、throshold=0 清到 0（不要用出金清空，也不要核實這筆洗分），再依前提佈置 399.6。這些佈置交易都會進入同一張場館日結報表，所以必須在記錄基準值之前全部完成
  expected: M 分數 = 399.6
- n: 2
  action: 佈置交易已反映在報表後、送出 req-cashout 之前，才在場館日結報表（該場館、當日）記下『收據金額』『已兌現金額』『現金淨收』三個欄位目前的數值，分別記為 R0、C0、N0（若報表不是即時更新，先向環境負責人確認更新方式，待佈置交易反映後再記）
  expected: 取得報表基準值（已含佈置交易，此後的差額只包含本筆出金）
- n: 3
  action: M 送出 req-cashout，取得核可金額 399.6 與 TXID_1；再送 end-cashout 帶 TXID_1 完成
  expected: 兩個請求皆回 0-OK；出金完成，面額 399.6，M 分數歸 0
- n: 4
  action: 系統外動作：假設櫃檯依收據付現 399（或 400）元，執行者記下自己選的實付值；不要把這個數字輸入系統任何地方
- n: 5
  action: 後台『洗分出金核實』頁找到這筆（以機台帳號或訂單編號定位），檢視其收據金額，並將該筆核實（轉為已核實）；檢視該頁與 4.1 該筆明細有沒有『實付金額』或『面額與實付差額』欄位
  expected: 收據金額顯示 399.6；整個核實流程沒有要求輸入實付金額；4.1 明細與核實頁都沒有實付金額，也沒有面額與實付的差額（例如 0.6 或 0.4）
- n: 6
  action: 重新查詢場館日結報表，與步驟 2 的基準值比對（差額只涵蓋 req-cashout 到核實這段期間）
  expected: 『收據金額』增加 399.6、『已兌現金額』增加 399.6、『現金淨收』的變動量絕對值為 399.6；沒有出現以 399、400 或差額計算的數字
test_data:
- name: 出金面額
  value: 399.6
- name: 櫃檯實付（系統外動作，場館自訂）
  value: 399（也可為 400）
