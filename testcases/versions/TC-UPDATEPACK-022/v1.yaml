title: 收合狀態顯示的數值不是各幣別加總、也不是匯率換算後的結果
product: ba-admin
functional_area: UPDATEPACK
requirement_ids:
- REQ-UPDATEPACK-003
acceptance_criteria_ids:
- AC-UPDATEPACK-0031
spec_id: SPEC-UPDATEPACK-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- negative
design_techniques:
- negative
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 選定一名核心貨幣（USDT）餘額與另一種已啟用幣別餘額，兩者數值明顯不同且皆非 0 的既有會員（例如核心貨幣餘額與另一幣別餘額至少相差一個數量級，以利肉眼判斷收合值不是兩者加總或換算結果）
test_data: []
steps:
- n: 1
  action: 展開該會員的帳戶餘額欄，逐列記錄每個已啟用幣別各自的金額
- n: 2
  action: 手動計算『各幣別金額加總』作為對照值 A
- n: 3
  action: 收合該欄位，記錄收合狀態顯示的數值
- n: 4
  action: 比對收合值分別與步驟1的核心貨幣列金額、步驟2的對照值 A 是否相符
expected_result: 收合狀態顯示的數值等於核心貨幣錢包的原始金額，且明顯不等於各幣別加總後的對照值 A（除非巧合下非核心貨幣餘額恰為 0，此情形應改選其他會員以確保比對有效）；收合值不做任何匯率換算
expected_result_spec_reference:
  spec_id: SPEC-UPDATEPACK-001
  spec_version: '0.1'
  location: §一、多幣別錢包展開顯示/顯示規則
  quote: 收合時顯示的數值 | 該站台核心貨幣錢包的餘額——不做匯率換算，也不是各幣別的加總。核心貨幣為主站台層級的設定，底下子站台一律繼承、不可各自指定
