preconditions:
- 以 Admin 身分登入 ba-admin 後台
- 進入「站台列表」頁面
test_data: []
steps:
- n: 1
  action: 以操作員身分登入後台
- n: 2
  action: 於選單中尋找「站台列表」入口，或嘗試直接訪問站台列表頁面網址
expected_result: 站台列表頁面不對操作員開放，操作員無法檢視任何站台或調整其狀態
expected_result_spec_reference:
  spec_id: SPEC-SITELIST-001
  spec_version: '0.4'
  location: §角色與權限/狀態切換
assumptions:
- text: 本 spec（SPEC-SITELIST-001 v0.4）的「角色與權限」表格只定義 Admin 與站長兩種角色，全文未見任何『操作員』的角色定義或本頁面的存取限制描述；「操作員」在本文件中僅出現於『場次逾時時間…操作員唯讀』與一則註腳『操作員為實體機台功能新增角色，本章不另定義，詳見實體機台_spec_v07.md』。AC-SITELIST-0164
    關於操作員完全無法存取站台列表頁面的斷言，在本文件中找不到直接依據，可能源自實體機台_spec_v07.md 或其他功能區（如 ACCOUNT）的權限設計慣例，需要人工確認此斷言的實際來源與正確性後才能視為確定規則
  requirement_id: REQ-SITELIST-016
  needs_human_confirmation: true
