title: 自機台場館切回線上站台後，後台選單恢復完整
product: ba-admin
functional_area: PLATFORMRULE
requirement_ids:
- REQ-PLATFORMRULE-004
acceptance_criteria_ids:
- AC-PLATFORMRULE-0042
spec_id: SPEC-PLATFORMRULE-001
spec_version: '0.1'
test_level: ui_e2e
test_types:
- functional
design_techniques:
- requirement_based
priority: high
risk: high
execution_mode: manual
preconditions:
- 以 Admin 登入後台
- 承上一條 TC（AC-0041），已切換至機台場館且選單已依規則隱藏；若未緊接執行該條TC，可自行先手動切換至機台場館以重建此前置狀態
- 選定一個既有的線上站台
test_data: []
steps:
- n: 1
  action: 使用站台切換下拉選單，切回前置作業選定的線上站台
- n: 2
  action: 展開左側選單全部分類，逐一檢視各分類下目前可見的項目清單
expected_result: 選單恢復完整：先前於機台場館被隱藏的所有頁面（資訊看板、加盟列表、登入網域查詢、推薦註冊金設定、暱稱禁用詞設定、出金審核、優惠彩金審核、返水明細、加盟傭金發放紀錄、代理返傭發放紀錄、會員等級異動紀錄、KYC 設定、會員等級設定、代理設定、加盟商設定、優惠活動管理、畫面管理）全部重新出現；鏈上錢包管理頁面的區塊鏈幣別頁籤也恢復顯示
expected_result_spec_reference:
  spec_id: SPEC-PLATFORMRULE-001
  spec_version: '0.1'
  location: §機台場館的後台選單
  quote: 站台切換下拉選單選到機台場館時，後台選單隱藏不適用的頁面（這些頁面的功能已由排除規則排除，現階段留著只會是空白頁）。顯示與否跟著站台切換走：同一操作者切回線上站台即恢復完整選單
assumptions: []
