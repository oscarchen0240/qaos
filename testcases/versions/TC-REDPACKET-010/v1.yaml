preconditions:
- 以具備優惠活動管理權限的後台角色（站長，或管理員）登入後台，頁面標題下方的站台切換下拉選單選到線上站台（核心貨幣 USDT）；財務角色能否檢視紅包明細、取消排程尚未定義（CLR-REDPACKET-015），所以除 023 系列案例外一律不用財務角色執行
- 【先清空】確認該站台目前沒有進行中或排程中的紅包活動（系統管理 > 優惠活動管理 > 活動排程 > 紅包活動子分頁；若有，逐一於該列點『取消排程』直到列表沒有）；依據：同一站台同一時間僅能有一個進行中的紅包活動，否則後續『儲存』會被阻擋。本案需要的活動一律在清空之後、依本案步驟或下列佈置步驟自行建立，不沿用其他案例留下的活動；除步驟另有指定『區間』者外，活動時間一律選『永久』，建立後若列表顯示活動尚未生效，等其進入進行中再開始下注（永久活動是否立即生效
  spec 未明講，狀態文字與位置只記錄）
test_data:
- name: 26字元名稱
  value: ABCDEFGHIJKLMNOPQRSTUVWXYZ
- name: 25字元名稱
  value: ABCDEFGHIJKLMNOPQRSTUVWXY
steps:
- n: 1
  action: 進入『系統管理 > 優惠活動管理 > 新增優惠活動』，活動類型選『紅包』、活動時間選『永久』；預設語系選一個語系，於『活動名稱／說明欄』選該語系
  expected: 名稱輸入框可輸入
- n: 2
  action: 活動名稱輸入 26 個 ASCII 字元『ABCDEFGHIJKLMNOPQRSTUVWXYZ』並填妥其餘必填欄位，點『儲存』
  expected: 不允許超過 25 字元：輸入被限制在 25 字元，或儲存被阻擋（兩種呈現皆不判 fail，記錄實際行為供 CLR-REDPACKET-001）；最終不存在名稱為 26 字元的活動
- n: 3
  action: 活動名稱改為恰 25 個 ASCII 字元『ABCDEFGHIJKLMNOPQRSTUVWXY』，點『儲存』
  expected: 儲存成功；活動排程列表顯示完整 25 字元名稱
- n: 4
  action: 清理：測試結束後於『活動排程 > 紅包活動』對該活動點『取消排程』清理，避免占用同站台唯一的紅包活動名額
  expected: 已取消排程
expected_result: 26 字元的名稱無法被儲存成 26 字元的活動（不允許超過 25 字元）；25 字元的名稱可儲存且顯示完整。
