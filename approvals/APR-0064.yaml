diff_summary: '[exploratory] TC-MEMBER-018 v2 已達成升等門檻且已申請的會員，一般加盟商 Badge 顯示白底「已申請」：「升等門檻」的具體達成算法（依據哪些指標、門檻數值為何）spec §2.2.2全文未定義；本TC不透過人工調整指標去製造達成狀態，改為從環境既有資料中挑選出已呈現「已申請」樣式的既有會員，若環境中找不到符合條件的既有帳號，如何人工佈置此狀態的測試資料需環境負責人/PM確認

  [exploratory] TC-MEMBER-019 v2 已達成升等門檻但未申請的會員，一般加盟商 Badge 顯示深灰底「達成未申請」：「升等門檻」的具體達成算法（依據哪些指標、門檻數值為何）spec §2.2.2全文未定義；本TC不透過人工調整指標去製造達成未申請狀態，改為從環境既有資料中挑選出已呈現「達成未申請」樣式的既有會員，若環境中找不到符合條件的既有帳號，如何人工佈置此狀態的測試資料需環境負責人/PM確認

  [exploratory] TC-MEMBER-020 v2 尚未達成升等門檻的會員，一般加盟商 Badge 顯示黑底「未達成」：「升等門檻」的具體達成算法（依據哪些指標、門檻數值為何）spec §2.2.2全文未定義；本TC不透過人工調整指標去製造未達成狀態，改為從環境既有資料中挑選出已呈現「未達成」樣式的既有會員，若環境中找不到符合條件的既有帳號，如何人工佈置此狀態的測試資料需環境負責人/PM確認；「業績/推薦人數等指標」是否確實為升等門檻演算法的必要或充分條件，本身同樣未經spec證實，故不主張此case風險比TC-018/019低，僅以「新註冊、各項可觀察指標皆為0」作為挑選依據以降低（而非消除）不確定性'
