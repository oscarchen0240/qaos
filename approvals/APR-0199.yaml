diff_summary: '[exploratory] TC-CASHFLOW-120 v1 入金交易帶 order_id（來源待確認，exploratory）：只記錄 req-cashin 後入金是否帶有 order_id 及其在後台的呈現，不斷言來源、格式與唯一性：入金
  order_id 的來源（廠商於 req-cashin 帶入或由平台產生）尚未定案（CLR-CASHFLOW-011 OPEN，REQ-CASHFLOW-045 Q02 minor）；本案不假設來源，只記錄觀察。『入金帶有 order_id
  並可於交易紀錄顯示與查詢』（spec 2026-09-09 定案）的存在性、以及『由平台產生、與出金共用編號規則與全系統唯一』的暫定規則，都只當觀察點，待 CLR-CASHFLOW-011 回覆後再轉為確定斷言

  [risk-review] 抽查 28 張 VALIDATED TC（修訂 7、新增 21；涵蓋 CLR-005 end-cashin 判額度、CLR-006 未成立不寫紀錄、CLR-008 rev 1 出金管理員手動取消／入金沒有手動取消、CLR-007
  小數、REQ-045～049）。五個面向皆有缺口，共 20 條建議：high 8、medium 10、low 2；其中 12 條 spec／CLR 未定義、需開 Clarification（RF-03、RF-05、RF-06、RF-07、RF-08、RF-10、RF-11、RF-13、RF-15、RF-16、RF-18、RF-19），其餘
  8 條有依據可直接補案例。最優先：end-cashin 超限後 PENDING 去向與機台重送可能造成退鈔又入帳（RF-06）、已印收據的出金被手動取消（RF-07）、手動取消 API 對非待確認出金目標的防護（RF-08）、前端未上線時後端權限驗證只是選做（RF-17）、token
  與機台帳號不一致（RF-19）、開分與 end-cashin 同時判定額度（RF-12）。本審查只提建議，不修改 TC、不判定 PASS／FAIL。

  [RF-01/medium/boundary] 額度上限只測了『恰等於上限／超過 1 單位』，沒有測額度上限設為 0 的特殊值。第 249 行規定設為 0 代表不限制；若實作把 0 當成真的上限 0，所有開分與入金都會被拒，整間場館無法營運。v0.2
  起入金改在 end-cashin 判定（CLR-005），這條路徑也要一併確認 0 = 不限制。本次草稿與同 area ACTIVE TC 都沒有這個情境。 → 建議：把測試場館額度上限設為 0，分別送出大額 req-keyin（例如 1,000,000），以及
  req-cashin＋end-cashin（實際清點金額為大額）。預期兩者都回 0-OK 並入帳，不回 1-OVER LIMIT；最後把額度改回原值。（相關 TC-DRAFT-01M4RBDBYMSX6BPHXJMAQWJHME, TC-DRAFT-01M4RBDBYNMQVF4E1RKHDX3566,
  TC-CASHFLOW-005, TC-CASHFLOW-008）

  [RF-02/medium/boundary] v0.2 起機台分數可帶小數（例 399.6；門檻 100 全洗後留下 99.6）。額度判定的基準是全場館分數合計，但『恰等於上限可成立』的臨界案例（TC-DRAFT-…MSX6、TC-CASHFLOW-008）都用整數。合計含小數時若以浮點比較，恰等於上限可能被誤判為超過，或超過
  0.1 卻被放行。 → 建議：讓同場館另一台機台留有 99.6 的餘數（以門檻 100 全洗 399.6 佈置），把額度上限設為『目前合計＋100.4』這類帶小數的剩餘額度，分別送 req-keyin 100.4（應成立）與 100.5（應回
  1-OVER LIMIT）。另以 end-cashin 做同樣的臨界比對（若入鈔金額只能是整數，就改用帶小數的剩餘額度搭配整數入鈔）。（相關 TC-DRAFT-01M4RBDBYMSX6BPHXJMAQWJHME, TC-DRAFT-01M4RBDBYQZZNMETG2W1BV24ZH,
  TC-CASHFLOW-005, TC-CASHFLOW-008）

  [RF-03/medium/boundary/需澄清] CLR-005 改為依 end-cashin 的入鈔機實際清點金額判定額度，但實際清點金額的邊界值沒有定義：清點金額為 0、清點金額大於 req-cashin 聲稱的金額、清點金額帶小數時，入帳金額以哪個為準、要不要拒絕，CLR
  與 spec 都沒寫。TC-CASHFLOW-008 只測了清點金額小於聲稱金額的情況（聲稱鉅額、實際 100）。另外 CLR-005 提到 req-cashin『或僅做極寬鬆的防禦性預檢』，預檢門檻也未定義（REQ-007 Q01 detail_gaps）。
  → 建議：開 Clarification 確認：end-cashin 清點金額為 0、大於聲稱金額、帶小數時的入帳規則與回覆碼，以及 req-cashin 有沒有防禦性預檢、門檻多少。定案後補邊界案例：同一筆 req-cashin 聲稱 100，end-cashin
  分別帶 0、200、100.5，核對回覆碼、入帳金額與存款金額累計。（相關 TC-DRAFT-01M4RBDBYNBPDNBXBG42AGHHB7, TC-DRAFT-01M4RBDBYNMQVF4E1RKHDX3566, TC-CASHFLOW-008）

  [RF-04/low/boundary] TC-DRAFT-…QZZN 驗證門檻 100 全洗 399.6 後留下 99.6，但沒有接著驗證帶小數的餘數如何領回。第 252 行說餘數單獨存在時可洗金額為 0、可按結算出金全額領回；餘數帶小數（99.6），或整數部分為
  0（0.6）時，洗分應回 1-NO CREDITS、出金應全額照記含小數，目前沒有案例覆蓋。 → 建議：接續 99.6 的餘數：先以門檻 100 再洗一次，預期回 1-NO CREDITS、不寫交易紀錄；再按結算出金，預期核可金額 99.6、餘額歸
  0、交易紀錄 -99.6。另佈置餘額 0.6 重做一次出金，預期核可 0.6，不被當成 0 而回 1-NO CREDITS。（相關 TC-DRAFT-01M4RBDBYQZZNMETG2W1BV24ZH, TC-DRAFT-01M4RBDBYQNEEAQF9AKM6F991Z,
  TC-CASHFLOW-017）

  [RF-05/medium/boundary/需澄清] 小數只測了一位小數（399.6）。REQ-020 Q02 的 detail_gaps 已指出小數位數上限、儲存精度與顯示格式未定義：餘額為 399.65 或 399.655 時，核可金額、交易紀錄、場館日結報表各自保留幾位、如何進位都沒有規則。另外
  throshold 帶小數（例 0.5）時是否合法、如何捨去也沒有定義（第 251 行只寫正值或 0）。 → 建議：開 Clarification 確認金額的小數精度、進位規則，以及 throshold 能否帶小數。定案後補邊界案例：餘額
  399.65 分別做出金與門檻 0 全洗，比對 API 核可金額、交易紀錄金額、場館日結報表三處數值是否一致；若 throshold 允許小數，補門檻 0.5、餘額 1.2 的全洗案例。（相關 TC-DRAFT-01M4RBDBYQ7V1TNS278YAHS2RZ,
  TC-DRAFT-01M4RBDBYQZZNMETG2W1BV24ZH, TC-DRAFT-01M4RBDBYQNEEAQF9AKM6F991Z, TC-DRAFT-01M4RBDBYRFDNCNHFJ3E4SB8E1）

  [RF-06/high/exception_flow/需澄清] CLR-005 把入金額度判定移到 end-cashin，超限時回 1-OVER LIMIT、機台退鈔。但該筆 PENDING 之後的去向未定義（REQ-007 Q01 detail_gaps）：PENDING
  會轉成什麼狀態（維持待確認、轉未成立或關閉）沒有寫。第 371 行只列 1-NO RECORD、6-BAD DATA/FORMAT 會讓機台停止重送，1-OVER LIMIT 不在其中。機台若照 15 秒重送規則持續重送同一 TXID 的
  end-cashin，之後額度一旦被釋放（例如他台出金），遲到的重送就可能成功入帳；這時紙鈔已退還玩家，卻又加了分，等同重複付款。現有案例只斷言回 1-OVER LIMIT，沒有追蹤之後的行為。 → 建議：開 Clarification 確認
  end-cashin 超限後：PENDING 的狀態與收斂方式、機台收到 1-OVER LIMIT 後會不會重送、平台收到重送時是否必須固定回拒絕（不得在額度釋放後轉為成功）。定案後補案例：end-cashin 超限回 1-OVER LIMIT
  後，讓同場館他台出金釋放額度，再重送同一 TXID 的 end-cashin，核對回覆碼、分數與該筆狀態。（相關 TC-DRAFT-01M4RBDBYNMQVF4E1RKHDX3566, TC-CASHFLOW-008, TC-CASHFLOW-011）

  [RF-07/high/exception_flow/需澄清] 正式流程中，機台是在收據送入列印佇列之後才送 end-cashout（第 151、344 行），Operator Reset 的情境是『第二階段遲遲無法成功』，所以收據多半已經印出。管理員手動取消這筆
  PENDING 後，平台標記為已取消、分數不異動（CLR-008），但玩家手上持有一張該 order_id 的收據，機台端也可能已在本地扣分。收據無法核銷（沒有已完成交易），機台與平台餘額也可能不一致。手動取消前管理員要確認什麼、收據要怎麼處理，都沒有定義。TC-DRAFT-…R23N
  以 API 模擬 Reset，不會觸及這個情境。 → 建議：開 Clarification 確認：對已印出收據的待確認出金執行手動取消時，管理員事前應核對的項目，取消後收據怎麼處理（拒兌，或改走人工出金）、機台與平台的分數怎麼對齊。定案後在實機補案例：印出收據後阻斷
  end-cashout、執行 Reset、管理員手動取消，再以收據上的 order_id 到洗分出金核實頁查詢，並比對機台畫面分數與後台分數。（相關 TC-DRAFT-01M4RBDBYR23NH8S15ZHENKCMK, TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ,
  TC-DRAFT-01M4RBDBYND4WM6YVKF2A19S2W, TC-CASHFLOW-061）

  [RF-08/high/exception_flow/需澄清] 後端手動取消 API 已開發完成，前端尚未開發，目前 API 是唯一的操作面。CLR-008 只說管理員可手動取消『待確認出金』，沒有定義 API 收到其他狀態或其他類型時的拒絕行為：對已完成出金（可能已產生核實紀錄甚至已兌現）、已取消出金、待確認入金（CLR-008
  明說入金沒有手動取消）呼叫取消。若後端沒有擋，已完成出金被改成已取消，會和洗分出金核實、日結報表互相矛盾。TC-DRAFT-…Q8MS 步驟 5 對入金是選做且只記錄。 → 建議：開 Clarification 確認手動取消 API 對非『待確認出金』目標的拒絕回應。定案後補負向案例：以管理員身分分別對已完成出金（含已核實者）、已取消出金、待確認入金、已逾時入金呼叫手動取消
  API；核對每筆都不被改變狀態、分數不變，洗分出金核實頁對應紀錄也不受影響。（相關 TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ, TC-DRAFT-01M4RBDBYQ8MSZ2XGAA0HWY164, TC-DRAFT-01M4RBDBYR2V0CB2P5PYCJQ0MY）

  [RF-09/medium/exception_flow] AC-0264 的例子是機台已報廢（僅停用不刪除）時待確認出金的清理，但 TC-DRAFT-…REA5 並沒有實際把機台設為停用。第 268 行規定機台停用不影響尚未完成的交易；停用期間的待確認出金應維持待確認，並且可以由管理員手動取消。停用狀態下
  end-cashout 是否回 7-OUT OF SERVICE、PENDING 是否保持不變，都沒有案例驗證。 → 建議：建立一筆待確認出金後，把該機台設為停用：送出該 TXID 的 end-cashout，記錄回覆碼（第 318 行為
  7-OUT OF SERVICE）；確認 PENDING 仍為待確認、分數不變；再由管理員手動取消，確認轉為已取消、分數不異動。（相關 TC-DRAFT-01M4RBDBYREA5MXRBTBCTT6VV0, TC-DRAFT-01M4RBDBYND4WM6YVKF2A19S2W,
  TC-CASHFLOW-049）

  [RF-10/medium/exception_flow/需澄清] TC-DRAFT-…TH00 只驗證重置後舊 token 發起新請求會被拒。機台在有未完成 PENDING（入金待 end-cashin、出金待 end-cashout）時被重置憑證，有兩點沒有定義：舊
  token 的 end-cashin 回 9-OTHER ERROR 時機台會不會持續重送（9 不在第 371 行的停止重送清單），以及寫入新 token 後，能不能用新 token 完成重置前建立的 TXID。入金這種情況下紙鈔可能已進錢箱，卻因此拖到
  24 小時逾時。 → 建議：開 Clarification 確認憑證重置與未完成 PENDING 的關係（新 token 可否完成舊 TXID、舊 token 重送的處置）。定案後補案例：req-cashin 建立 PENDING 後重置憑證，先以舊
  token 送 end-cashin（預期 9-OTHER ERROR、分數不變），再以新 token 送同一 TXID 的 end-cashin，依定案核對結果；出金比照辦理。（相關 TC-DRAFT-01M4RBDBYTH00EJG3EJS8BKBBW,
  TC-DRAFT-01M4RBDBYNMFGQX9B9AFFPQ0HR, TC-DRAFT-01M4RBDBYR23NH8S15ZHENKCMK, TC-CASHFLOW-059）

  [RF-11/high/concurrency/需澄清] 管理員手動取消與機台遲到的 end-cashout 同時到達同一筆待確認出金：草稿只測了『先取消、後 end-cashout 回 1-NO RECORD』的循序情境。兩者交錯時，最終只能有一個結果（已完成且扣分，或已取消且分數不動），不得出現『已取消但已扣分』或『已完成但被標記取消』。輸的一方回什麼（管理員看到什麼提示、機台收到什麼碼）也沒有定義。
  → 建議：開 Clarification 確認手動取消與 end-cashout 競態時，輸的一方的回應。以測試工具在管理員送出手動取消 API 的同時送出該 TXID 的 end-cashout，重複多次：每次核對最終狀態與分數一致（已完成→扣分且產生待核實紀錄；已取消→分數不變且洗分出金核實頁沒有該筆）。（相關
  TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ, TC-DRAFT-01M4RBDBYR23NH8S15ZHENKCMK, TC-CASHFLOW-025）

  [RF-12/high/concurrency] TC-CASHFLOW-009 只驗證兩筆 end-cashin 同時到達時的場館鎖序列化。v0.2 起入金改在 end-cashin 判定，同場館『一台開分 req-keyin＋另一台 end-cashin』同時到達、各自單看不超限但合計超限的組合沒有案例。若兩條路徑沒有序列化在同一把場館鎖內，兩筆都會通過，全場館餘額就會超過額度上限。
  → 建議：把剩餘額度設為 100，同場館 M1 先完成 req-cashin（聲稱 100）；以測試工具同時送出 M1 的 end-cashin（清點 100）與 M2 的 req-keyin 100。預期恰好一筆成立、另一筆回 1-OVER
  LIMIT，全場館合計不超過上限；重複多次確認結果穩定。（相關 TC-DRAFT-01M4RBDBYMSX6BPHXJMAQWJHME, TC-CASHFLOW-009, TC-CASHFLOW-005）

  [RF-13/high/concurrency/需澄清] 第 175、343 行說出金過程中玩家仍可投鈔，出金金額以按下結算當下為準，不會把期間新投入的錢算進去；但第 337 行又說出金完成後機台餘額為 0，第 338 行說出金結束場次、無餘數承接。若
  req-cashout 與 end-cashout 之間有一筆入金完成，end-cashout 後餘額應是 0 還是該筆入金金額、這筆餘額屬於哪個場次（出金不產生承接場次），spec 自相矛盾也未定義。現有案例都沒有在出金兩階段之間穿插入金。
  → 建議：開 Clarification 確認出金兩階段之間入帳的入金，在 end-cashout 後的餘額與場次歸屬。定案後補案例：餘額 300 時 req-cashout（核可 300），接著完成一筆入金 100（req-cashin＋end-cashin），再送
  end-cashout；核對核可／扣款金額、最終餘額、場次資訊的期末餘額與新場次期初餘額。（相關 TC-DRAFT-01M4RBDBYQNEEAQF9AKM6F991Z, TC-CASHFLOW-023, TC-CASHFLOW-024）

  [RF-14/medium/concurrency] TC-DRAFT-…S31R 驗證 order_id 全系統唯一時，四筆出金都是依序執行。order_id 是給人讀的短碼（長度受限）且全系統唯一，最容易出錯的是多台機台、多個場館同時
  req-cashout 時，序號產生發生競爭而重號。重號會讓櫃檯以訂單編號核銷時查到兩筆，或核銷到錯的一筆。 → 建議：以測試工具讓同場館與跨場館至少 10 台機台同時送出 req-cashout（各自完成 end-cashout），收集全部
  order_id 比對是否重複；再到洗分出金核實頁以每個 order_id 查詢，確認各自只查到一筆。（相關 TC-DRAFT-01M4RBDBYS31R7E5V22VYSY9XD, TC-DRAFT-01M4RBDBYSP1GA8QAYF04FD01R）

  [RF-15/medium/duplicate_submission/需澄清] 管理員手動取消是不可回復的帳務操作，但重複送出（前端上線後連點，或同一 API 請求重送）的行為沒有定義：第二次要回阻擋提示還是冪等成功，會不會重複寫操作紀錄或觸發其他副作用（例如誤取消同機台下一筆新建的
  PENDING）。目前沒有案例。 → 建議：開 Clarification 確認手動取消重送的回應。定案後補案例：對一筆待確認出金連續送出兩次相同的手動取消請求，再讓同機台建立一筆新的 req-cashout，然後重放第一次的取消請求；核對原筆只取消一次、新
  PENDING 不受影響、分數不變。（相關 TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ, TC-DRAFT-01M4RBDBYR23NH8S15ZHENKCMK）

  [RF-16/low/duplicate_submission/需澄清] 入金 order_id 的來源仍待確認（CLR-CASHFLOW-011 OPEN，REQ-045 Q02 為 E5）。若最後定案由廠商在 req-cashin 帶入，同一
  order_id 重複送達（機台重送 req-cashin，或兩台機台帶相同編號）時，要建立新 PENDING、拒絕，還是視為同一筆，完全沒有定義；『全系統唯一』也無法由平台保證。TC-DRAFT-…SJKW 是 exploratory，只做記錄。
  → 建議：待 CLR-CASHFLOW-011 定案後一併確認重複 order_id 的處理。若由廠商帶入：補案例以相同 order_id 連送兩次 req-cashin，以及兩台機台帶相同 order_id，核對 PENDING 筆數、回覆碼與交易紀錄查詢結果。（相關
  TC-DRAFT-01M4RBDBYSJKWFTGG9FC1RD7RN）

  [RF-17/high/permission] CLR-008 說待確認出金的手動取消僅限管理員，而目前只有後端 API、前端尚未開發。TC-DRAFT-…R2V0 的介面步驟在前端上線前必然受阻，唯一能真正驗證權限的 API 步驟（步驟
  4）卻是『若開發提供』的選做，等於目前沒有任何案例確實驗證後端會拒絕非管理員。另外只測了站長，沒有測操作員。 → 建議：把 API 權限驗證改為必做：分別以站長、操作員的後台身分呼叫手動取消 API，指定一筆待確認出金。預期兩者都被拒絕（拒絕內容未定義時只記錄），TXID
  仍為待確認、分數不變；再以管理員呼叫同一 API 作為對照，預期轉為已取消。（相關 TC-DRAFT-01M4RBDBYR2V0CB2P5PYCJQ0MY, TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ）

  [RF-18/medium/permission/需澄清] 手動取消在 4.1 交易紀錄查詢的機台視角操作，但管理員的站台範圍沒有定義：A 站台的管理員能否透過 API（竄改站台或 TXID 參數）取消 B 站台機台的待確認出金，spec
  與 CLR-008 都沒有寫。若後端只檢查角色、不檢查站台歸屬，就會跨站台取消別人的交易。 → 建議：開 Clarification 確認手動取消的站台範圍（管理員是否限所屬站台）。定案後補案例：以 A 站台管理員身分呼叫手動取消 API，指定
  B 站台機台的待確認出金 TXID，核對回應與該筆狀態。（相關 TC-DRAFT-01M4RBDBYRBJ031JR8R5KTACDQ, TC-DRAFT-01M4RBDBYR2V0CB2P5PYCJQ0MY）

  [RF-19/high/permission/需澄清] JWT 案例只測了重置後的舊 token、竄改簽章、自簽 token 和長期有效 token。若一台機台的有效 token 搭配另一台機台的帳號（或另一場館的機台）發出請求，第 282
  行只寫要比對『該機台』現行的憑證識別，沒有明確規定請求中的機台帳號必須和 token 所屬機台一致，以及不一致時回什麼碼。若沒有檢查，持有 A 機台憑證就能替 B 機台開分或出金。 → 建議：開 Clarification 確認請求的機台帳號與
  token 所屬機台不一致時的處置與回覆碼。定案後補案例：以 M1 的有效 token 對 M2（同場館）與 M3（不同場館）分別送 req-keyin、req-cashout，核對都被拒絕、M2／M3 分數不變、沒有建立 PENDING
  或交易紀錄。（相關 TC-DRAFT-01M4RBDBYTH00EJG3EJS8BKBBW, TC-DRAFT-01M4RBDBYT9X043QMG3Z1C3C8F, TC-DRAFT-01M4RBDBYTAY2TZ78G5N03CH9Q,
  TC-CASHFLOW-059）

  [RF-20/medium/permission] TC-DRAFT-…T9X0 只測了三種無效簽章（改簽章、改 claim、用他人金鑰簽）。常見的 JWT 驗證繞過手法（header alg 改成 none 並去掉簽章、HS／RS 演算法混淆、token
  指向不存在的機台帳號）沒有覆蓋。第 319 行規定 token 無效或機台帳號不存在都回 9-OTHER ERROR。 → 建議：補負向案例：(a) header 改為 alg=none、去掉簽章段；(b) 若平台使用非對稱金鑰，改用 HS256
  並以公鑰當密鑰重簽；(c) 簽章有效但 claim 指向不存在的機台帳號（以測試環境的簽章金鑰產生）。三者送 req-keyin 都應回 9-OTHER ERROR，分數與交易筆數不變。（相關 TC-DRAFT-01M4RBDBYT9X043QMG3Z1C3C8F,
  TC-DRAFT-01M4RBDBYTH00EJG3EJS8BKBBW）'
