diff_summary: '[exploratory] TC-ACCOUNT-016 v1 操作員的會員列表不顯示創建會員帳號按鈕：Spec 只寫「操作員不可新增機台帳號」，未寫具體阻擋方式；PM 已於 CLR-ACCOUNT-001 確認為前端按鈕隱藏

  [exploratory] TC-ACCOUNT-029 v1 已使用過的重設連結被再次點擊：Spec 未定義已使用過的連結被再次點擊時的具體回應；PM 已於 CLR-ACCOUNT-002 確認前端顯示「連結已失效，請重新申請」

  [exploratory] TC-ACCOUNT-031 v1 機台帳號無法使用前台忘記密碼：Spec 只說機台帳號沒有信箱、不適用忘記密碼，未定義實際申請時前端的提示；PM 已於 CLR-ACCOUNT-003 確認機台帳號無法以信箱登入註冊，故前台不存在此功能可用

  [exploratory] TC-ACCOUNT-036 v1 重置後舊憑證即使簽章仍有效也一律被拒絕：規則本身 spec 已明確定義（非假設待確認），此處的 assumption 僅用於標記『目前無法執行、需等待開發包③』這個環境限制，供
  Human 知悉並在 ACTIVATE 時決定是否先行核准、標記為延後執行

  [exploratory] TC-ACCOUNT-057 v1 機台前台沒有優惠活動與簽到頁面可供參與：Spec 只說『帳密不交付玩家所以天然不會發生』，未明確要求系統主動阻擋；PM 已於 CLR-ACCOUNT-004 確認機台前台根本沒有優惠活動頁面，玩家介面上無法進入'
