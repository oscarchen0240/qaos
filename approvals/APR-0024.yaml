  Admin 直接隱藏」的假設設計，待 CLR-TXLOG-001 回覆後需重新確認並調整

  [exploratory] TC-TXLOG-042 v1 對非待確認狀態的交易嘗試手動取消會被阻擋（暫依假設）：Spec 只定義了『僅可對待確認狀態執行』，未定義對其他狀態嘗試時系統具體的阻擋機制；本案例暫依「操作入口對非待確認狀態直接隱藏或停用」的假設設計，待
