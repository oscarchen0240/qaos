  rationale: REQ-TXLOG-028/029 描述的『手動取消』操作在實際產品中不存在——交易紀錄查詢頁沒有可手動取消的交易，待核實相關的人工操作一律在洗分出金核實頁進行。需回頭修正這兩條需求並移除相關 TC
