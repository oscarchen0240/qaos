diff_summary: '[risk-review] RUN-20261001-003（TC-DAILYREPORT-053 修訂）抽查結果：共 2 條 finding，無 high。RF-01 建議補「分數歸 0」與「洗分留餘數」兩種結束方式，以及剩
  1 分的臨界案例，有 spec 依據。RF-02 是結束交易與投注同時送達時的處置，spec 沒有定義，需要澄清。權限由既有 ACTIVE TC 覆蓋；異常流程與重複提交不適用。

  [RF-01/medium/boundary] spec 定義場次有三種結束方式：洗分、出金、分數歸 0。Draft 步驟 1 只用出金產生 S1，下列兩種結束後的狀態不可逆都沒驗：(a) 分數歸 0，邊界是剩 1 分時場次仍為進行中，歸
  0 才結束；(b) 洗分留有餘數 r，此時 S1 期末＝r，之後繼續遊玩或開分形成的新場次期初餘額應承接 r。其中 (b) 的 S1 結束後機台仍有分數，最容易在實作上被誤併回原場次。 → 建議：分別用三種方式產生 S1：出金、輸到分數歸
  0、洗分留餘數 r。每種都要先在剩 1 分時確認 S1 仍為進行中。之後對機台 A 開分或投注，用依場次明細重查，確認三件事：S1 仍為「已結束」，結束時間與期末餘額不變（出金與歸 0 為 0，洗分為 r）；另有一個新的進行中列，場次編號不同於
  S1；洗分路徑下，新場次的期初餘額＝r。（相關 TC-DRAFT-01M3VG71R1V0K840TCCR5M0SDM, TC-DAILYREPORT-053）

  [RF-02/medium/concurrency/需澄清] 對機台 A 送出出金或洗分（結束 S1），同時從前台或 API 送出一筆投注時，這筆投注應被拒絕，還是歸入新場次？S1 在結束時間之後，投注筆數、有效投注額、損益、期末餘額可不可能再變動？v0.1
  只定義場次以洗分、出金、分數歸 0 結束，沒有定義結束交易與投注同時發生時的處置。 → 建議：建議開 Clarification 確認：結束交易與投注同時發生時，該筆投注要如何處置。定案後補案例：同時送出出金與投注 API，用依場次明細重查，比對
  S1 結束前後的投注筆數、有效投注額、損益、期末餘額，以及新場次列的內容，確認那筆投注只出現在定案指定的一邊。（相關 TC-DRAFT-01M3VG71R1V0K840TCCR5M0SDM）'
