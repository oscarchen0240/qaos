diff_summary: '[exploratory] TC-SITELIST-134 v1 繞過 UI 直接呼叫建立站台 API，帶入與上層站台不同的站台類型：Spec 只描述 UI 唯讀跟隨、未定義繞過 UI 時後端是否也拒絕（REQ-SITELIST-002
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-001（2026-09-14）回覆『後端也會拒絕』，但此答覆未回寫進 RequirementModel 的 rejection_contract，故仍以
  exploratory 方式標記，需人工於執行時再次確認

  [exploratory] TC-SITELIST-140 v1 額度上限欄位輸入負數，前後端皆拒絕：Spec 原文未定義輸入負數時系統的回應（REQ-SITELIST-005 的 rejection_contract.defined=false）；PM
  已於 CLR-SITELIST-002（2026-09-14）回覆『前端顯示錯誤、後端也拒絕（雙層驗證）』，但此答覆未回寫進 RequirementModel，故仍以 exploratory 方式標記，執行時需人工再確認實際文案與後端行為

  [exploratory] TC-SITELIST-143 v1 場次逾時時間輸入低於 1 小時或超長格式時系統拒絕：Spec 原文未定義輸入 0、負數或極端值時系統的回應（REQ-SITELIST-006 的 rejection_contract.defined=false）；PM
  已於 CLR-SITELIST-003（2026-09-14）回覆『後端最低值 1 小時、超過 17 位數格式錯誤回 COMMON_INVALID_REQUEST_FORMAT』，此答覆未回寫進 RequirementModel，故以 exploratory
  標記，執行時需人工再確認實際錯誤代碼與文案

  [exploratory] TC-SITELIST-152 v1 站長直接以站台 ID 呼叫查詢 API 存取平行或上層站台：Spec 未定義站長嘗試以站台 ID 直接呼叫查詢 API 存取平行／上層站台時的具體回應（REQ-SITELIST-011
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-004（2026-09-14）回覆『依範圍模型應無法取得資料』，但未定義精確的錯誤格式，且此答覆未回寫進 RequirementModel，故以
  exploratory 標記，需人工確認實際回應格式

  [exploratory] TC-SITELIST-155 v1 站長繞過前端直接呼叫建立站台 API 並帶入其他上層站台 ID：Spec 只定義前端行為（欄位唯讀），未定義繞過前端直接呼叫 API 時後端是否拒絕（REQ-SITELIST-012
  的 rejection_contract.defined=false，且 requirement 本身註明此為已知風險區域）；PM 已於 CLR-SITELIST-005（2026-09-14）回覆『後端已拒絕，此前 RD 回報的可繞過風險已修復』，但此答覆未回寫進
  RequirementModel，故以 exploratory 標記，需人工再次確認後端行為

  [exploratory] TC-SITELIST-158 v1 站長繞過前端直接呼叫編輯站台 API 修改上層站台：Spec 只定義 UI 選單排除循環選項，未定義繞過 UI 直接呼叫編輯 API 時後端是否驗證並拒絕站長的修改（REQ-SITELIST-013
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-006（2026-09-14）回覆『同 CLR-005，站長編輯時的上層站台唯讀限制後端已拒絕』，但此答覆未回寫進 RequirementModel，故以
  exploratory 標記

  [exploratory] TC-SITELIST-159 v1 Admin 繞過前端直接呼叫編輯站台 API，帶入會形成循環的上層站台 ID：CLR-SITELIST-006 的 PM 回覆明確聲明『本次確認聚焦於站長權限，Admin 編輯時的循環防護是否也有對應後端驗證，未在本次回覆中明確涵蓋，若後續測試發現可繞過，需另案處理』；也就是說
  Admin 這一側的後端防護目前完全沒有人力確認過，屬於比站長那一側更不確定的風險

  [exploratory] TC-SITELIST-168 v1 操作員無法檢視或調整任何站台的狀態：本 spec（SPEC-SITELIST-001 v0.4）的「角色與權限」表格只定義 Admin 與站長兩種角色，全文未見任何『操作員』的角色定義或本頁面的存取限制描述；「操作員」在本文件中僅出現於『場次逾時時間…操作員唯讀』與一則註腳『操作員為實體機台功能新增角色，本章不另定義，詳見實體機台_spec_v07.md』。AC-SITELIST-0164
  關於操作員完全無法存取站台列表頁面的斷言，在本文件中找不到直接依據，可能源自實體機台_spec_v07.md 或其他功能區（如 ACCOUNT）的權限設計慣例，需要人工確認此斷言的實際來源與正確性後才能視為確定規則

  [exploratory] TC-SITELIST-196 v1 機台類型根層站台建立時，核心貨幣依所選類型正確連動帶出 TWD：本TC的expected_result斷言「核心貨幣連動建立與鏈上錢包管理（platform級幣種出入金風控開關）完全無關、不互相依賴」，依據為CLR-SITELIST-011（status:
  APPLIED）。獨立Validator審查指出，CLR-SITELIST-011的provenance明顯弱於本專案同功能區其餘CLR-SITELIST-001~009的既有慣例（同一帳號於11秒內提出/回答/套用，無asked_to/asked_at欄位、無ASKED中繼狀態、無可獨立核查的第三方來源；spec.md全文「鏈上錢包」零命中，此概念完全由RequirementModel/CLR自行注入）。Oscar確認此為對話中直接確認的內容、非資料錯誤，但為維持本專案的驗證標準（稽核強度需獨立於orchestrating
  session本身），選擇不強制通過此爭議、改保留為待確認假設。執行此TC前，建議先取得更具外部可查核性的來源（如實際會議記錄、ticket連結）以升級此判斷的確定性層級。'
decision:
  decision: reject
  decided_by: oscarchen@blockaction.tech
  decided_at: '2026-09-17T15:03:53Z'
  rationale: Phase2×3交叉比對發現2類問題需修正：(1)5條負向API繞過TC的acceptance_criteria_ids漏標，(2)AC-SITELIST-0241缺少「主站台可獨立經營」這個Oscar確認的真實斷言
