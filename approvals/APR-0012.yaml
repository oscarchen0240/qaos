diff_summary: '[exploratory] TC-SITELIST-004 v1 直接呼叫建立站台 API，帶入與上層站台不同的站台類型：Spec 只描述 UI 唯讀跟隨；PM 已於 CLR-SITELIST-001 確認後端也會拒絕，但尚未寫入
  spec 正文

  [exploratory] TC-SITELIST-009 v1 額度上限輸入負數應被拒絕：Spec 只寫「設為 0 代表不限制」，未定義負數輸入的處理；PM 已於 CLR-SITELIST-002 確認前後端皆拒絕

  [exploratory] TC-SITELIST-011 v1 場次逾時時間低於 1 小時或超過 17 位數皆應被拒絕：Spec 只寫「預設 1 小時，站長可調整」，未定義下限與極端值的處理；PM 已於 CLR-SITELIST-003
  確認上述兩種拒絕行為與錯誤代碼

  [exploratory] TC-SITELIST-018 v1 站長嘗試以站台 ID 直接查詢平行或上層站台：Spec 未定義具體回應方式（403／空資料／錯誤訊息）；PM 已於 CLR-SITELIST-004 以權限範圍圖確認範圍由所屬站台決定

  [exploratory] TC-SITELIST-020 v1 站長直接呼叫建立站台 API，帶入非當前層的上層站台：Spec 只描述前端唯讀行為；PM 已於 CLR-SITELIST-005 確認後端已拒絕（此前 RD 回報的繞過風險已修復）

  [exploratory] TC-SITELIST-022 v1 直接呼叫編輯站台 API，帶入會形成循環的上層站台 ID：Spec 只定義 UI 選單排除循環選項；PM 對站長權限的後端驗證已於 CLR-SITELIST-006 確認，但
  Admin 編輯時的循環防護是否也有對應後端驗證未明確涵蓋，需另行確認

  [exploratory] TC-SITELIST-028 v1 Admin 嘗試將既有站台手動切回待開通：「待開通」在 §站台狀態一節僅列「新建站台自動設定」為觸發方式，未列為 Admin 可手動選取的目標狀態；spec 對「任意狀態」是否含待開通未明確定義

  [exploratory] TC-SITELIST-042 v1 機台類型站台不提供刪除操作，只能停用：Spec 原文的刪除流程未區分站台類型；PM 已於 CLR-SITELIST-007 確認機台類型不提供刪除操作，僅能停用

  [exploratory] TC-SITELIST-044 v1 線上類型主站台帶有子站台時執行刪除：Spec 未定義有子站台的站台如何刪除；CLR-SITELIST-008 尚待 PM 回覆是阻擋、連坐刪除、或子站台改掛他處'
