diff_summary: '[exploratory] TC-ACCOUNT-067 v1 機台名稱輸入暱稱禁用詞不被阻擋，後台建立不經該檢查：測試需要一個確實存在於前台暱稱禁用詞清單中的字詞作為輸入樣本；該清單的實際內容屬既有前台功能、非本
  spec 定義範圍，執行前需向環境負責人確認清單內容或使用環境中已知的禁用詞樣本

  [exploratory] TC-ACCOUNT-078 v1 操作員嘗試創建會員帳號（含機台帳號）不被允許：Spec 未定義操作員嘗試建立帳號時系統的具體回應方式（按鈕隱藏 vs 送出後 API 拒絕），需人工確認實際行為屬於哪一種；「操作員」角色本身屬開發包⑥實作範圍；本包（①）測試環境當下是否已提供可登入的操作員角色/測試帳號尚不確定，需向環境負責人確認角色是否可用，若尚未提供則本案例需延後至該角色可用後執行

  [exploratory] TC-ACCOUNT-090 v1 重設連結逾時（超過預設 1 小時）後失效，時效內仍有效：驗證此邊界需要能夠讓連結「產生後經過指定時間」才點擊，測試環境是否提供可調整系統時間、縮短時效設定或其他方式模擬時間經過，spec
  未定義，此測試資料佈置方式為設計推測，需環境負責人確認實際可行的驗證方式

  [exploratory] TC-ACCOUNT-093 v1 重設連結被使用過後再次點擊的系統反應：Spec 未定義已使用過的重設連結被再次點擊時，系統實際顯示的提示內容或行為（例如是否顯示『連結已失效』或其他錯誤訊息），需人工確認實測結果

  [exploratory] TC-ACCOUNT-096 v1 機台帳號於前台嘗試使用忘記密碼：Spec 未定義機台帳號實際送出忘記密碼申請時，前端顯示的具體提示內容（是否仍顯示與 REQ-ACCOUNT-017 相同的通用『若資料相符』訊息，或有其他提示），需人工確認實測結果

  [exploratory] TC-ACCOUNT-097 v1 未補綁信箱的後台建立線上帳號於前台嘗試使用忘記密碼：Spec 未定義未綁定信箱的帳號實際送出忘記密碼申請時，前端顯示的具體提示內容，需人工確認實測結果

  [exploratory] TC-ACCOUNT-121 v1 嘗試以機台帳密操作優惠活動或每日簽到：Spec 僅說明機台帳密不交付玩家、實務上『天然』不會發生，未明確要求系統層級主動阻擋機台帳號參與優惠活動或簽到；本案例假設『系統仍應具備防護』僅為建議性推測，需人工確認產品是否要求此防護，以及若無防護時實際會發生什麼（例如是否真的核發了獎勵）'
