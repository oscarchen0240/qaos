  24 小時前、仍處於待確認狀態的既有入金交易；spec 未定義 QA 應如何取得此類測試條件，實際做法待環境負責人確認

  [exploratory] TC-TXLOG-207 v1 即使交易曾被機台重複回報完成，重送次數欄仍固定顯示「—」，不會顯示實際重複次數；分數本身仍只異動一次：驗證『重複回報』情境需要測試環境具備讓機台針對同一交易編號重複送出完成回報的能力（例如重播請求或測試工具模擬）；spec
