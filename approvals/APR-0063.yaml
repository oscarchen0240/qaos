diff_summary: '[exploratory] TC-MEMBER-007 v4 可提領餘額恰為 10 USDT 時不可於前台申請出金（邊界值，剛好不達門檻）：本TC的邊界值佈置手法依賴以下機制，spec §2.1.5僅定義「金額」欄位直接影響主錢包、「稽核」欄位設定投注倍數會影響提款條件，但未明訂「可提領餘額＝主錢包－流水錢包」的換算公式、「金額×稽核倍數＝流水錢包增減量」的具體算式、以及稽核=0時是否為合法輸入與其效果；這三項皆由
  Oscar 於 2026-09-15 以實際操作範例確認，非spec原文明訂。其中「稽核倍數影響流水錢包增減量」這部分方向上與REQ-MEMBER-011/AC-MEMBER-015（稽核倍數大於1時，提領所需有效投注額因存入金額乘上稽核倍數而增加）一致，但REQ-MEMBER-011並未涵蓋稽核=0這個特例，故本assumption標記在REQ-MEMBER-005（本TC實際驗證的需求）下。若後續系統行為變動（例如稽核=0被系統限制或停用），須重新驗證此佈置手法是否仍然可行

  [exploratory] TC-MEMBER-008 v4 可提領餘額為 10.01 USDT 時可正常於前台申請出金（邊界值，略高於門檻）：本TC的邊界值佈置手法依賴以下機制，spec §2.1.5僅定義「金額」欄位直接影響主錢包、「稽核」欄位設定投注倍數會影響提款條件，但未明訂「可提領餘額＝主錢包－流水錢包」的換算公式、「金額×稽核倍數＝流水錢包增減量」的具體算式、以及稽核=0時是否為合法輸入與其效果；這三項皆由
