  [exploratory] TC-DAILYREPORT-014 v1 按週以週一為週起，結算日期起日非週一時仍以週一分週：結算期間欄對不完整週（第一列）的顯示格式 Spec 未定義；結算日期範圍外但同週的營業日（08-31～09-02）是否計入第一列合計
