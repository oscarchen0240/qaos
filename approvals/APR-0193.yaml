diff_summary: '[exploratory] TC-PLATFORMRULE-048 v2 操作員嘗試查詢自身所屬場館以外的場館日結報表，查無資料或無法選取：本 TC 需要測試環境當下存在至少兩個不同的既有機台場館（操作員所屬場館
  X 之外，另需一個場館 Y 作為『其他場館』對照）；若環境當下僅有一個機台場館，需先依既有機台場館的建立方式另外建立一個測試用機台場館 Y 才能執行本 TC 的對照比較

  [exploratory] TC-PLATFORMRULE-073 v1 非根站台的管理員略過畫面、直接以相同登入憑證改寫機台交易紀錄查詢請求的場館參數指向管轄範圍外的場館，回應不得含該場館的機台交易：管理員或站長越權（略過畫面直接呼叫 API
  帶範圍外場館）時的系統反應（回 4xx 拒絕、或回 200 但結果為空）v0.2 未定義，待 CLR-DAILYREPORT-014（OPEN，待 PM 回覆）；本案只斷言回應不含範圍外場館的交易資料，不斷言狀態碼與回應形態；管理員／站長的可見場館範圍在後端也強制執行（不只前端隱藏選項）——v0.2
  僅定義可見範圍，未明說後端是否強制；此為依操作員同類規則（REQ-013 既有 TC-017）類推的假設，非 spec 明文；機台交易紀錄查詢送出的請求帶有可被改寫的場館／站台範圍參數（可由瀏覽器開發者工具的 Network 面板看到）；若實際請求不帶此參數（範圍完全由伺服端依登入身分決定），本案無從照步驟執行，需改定驗證方式

  [exploratory] TC-PLATFORMRULE-074 v1 站長略過畫面、直接以相同登入憑證改寫機台交易紀錄查詢請求的場館參數指向其管轄範圍（P1 子樹）外的場館，回應不得含該場館的機台交易：管理員或站長越權（略過畫面直接呼叫
  API 帶範圍外場館）時的系統反應（回 4xx 拒絕、或回 200 但結果為空）v0.2 未定義，待 CLR-DAILYREPORT-014（OPEN，待 PM 回覆）；本案只斷言回應不含範圍外場館的交易資料，不斷言狀態碼與回應形態；管理員／站長的可見場館範圍在後端也強制執行（不只前端隱藏選項）——v0.2
  僅定義可見範圍，未明說後端是否強制；此為依操作員同類規則（REQ-013 既有 TC-017）類推的假設，非 spec 明文；機台交易紀錄查詢送出的請求帶有可被改寫的場館／站台範圍參數（可由瀏覽器開發者工具的 Network 面板看到）；若實際請求不帶此參數（範圍完全由伺服端依登入身分決定），本案無從照步驟執行，需改定驗證方式'
