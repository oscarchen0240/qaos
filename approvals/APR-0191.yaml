  [risk-review] 抽查 RUN-20261001-007 Validator PASS 的 48 條 TC（修訂 11、新增 37），對照 SPEC-DAILYREPORT-001 v0.2、RM v0.2、CLR-001～014
  與 27 條同 area ACTIVE TC。五面向：boundary、exception_flow、concurrency、permission 有缺口；duplicate_submission 不適用（本頁唯讀，交易冪等屬開發包③）。共
  10 條建議，其中 high 5 條。有 spec 依據、可直接補 TC 的：RF-01 依場館彙總／多機台總計列含進行中場次、RF-02 按月／區間合計／不完整週的期初期末與驗算、RF-10 匯出 CSV 越權。需要澄清的：RF-04 期初在前一營業日無資料時取
  0 還是沿用（建議併入已送 PM 的 REQ-016 題目）、RF-06 逾時結束場次的餘額與場次數（已送 PM）。上一輪三項：洗分餘數承接已補上；總計列含進行中只補了依場次明細單一機台；依場館彙總仍未補（RF-01）。作廢呈現依 CLR-DAILYREPORT-011
  暫緩，未提 finding。

  [RF-01/high/boundary] 上一輪提過的「期末餘額含進行中場次」在依場館彙總與多機台總計列這兩處仍沒有驗證。本次含進行中場次的 TC 都只查單一機台：依機台明細的機台列（TC-DRAFT-01M3VQFWH9ZG4QHDE7JDYCXV9A、TC-DRAFT-01M3VQFWHAPFPWJ6X3VFT03V96）和依場次明細的總計列（TC-DRAFT-01M3VQFWHAS7HZPJ36EM9BVCX1）。依場館彙總要把「進行中機台截至查詢當下的分數」與「其他機台的值」跨機台相加；依機台明細多機台時，總計要對每台機台各取最後值再相加。這兩條聚合路徑都沒有測到，如果實作仍用最後一個已結束場次（9/12
  舊規則）或漏掉進行中機台，現有 TC 抓不到。 → 建議：同一場館在目前營業日：機台 A 有進行中場次、目前分數 X（取前台讀值）；機台 B 今日場次已洗分結束、留餘數 Y；其餘機台分數已知。(1) 依場館彙總＋按日，結算日期涵蓋前一營業日與目前營業日、機台帳號留空：目前營業日列的期末應＝X＋Y＋其餘機台分數；總計列期末應＝該列；前一營業日列仍為結算時點值，並以驗算式核對目前營業日列。(2)
  改依機台明細：總計列期末應＝各機台最後一列相加（含 A 的 X）。(3) 對 A 追加開分後重新查詢，場館列與總計列都應隨之變動。執行期間不得跨越日結時間或逾時。（相關 TC-DRAFT-01M3VQFWH9ZG4QHDE7JDYCXV9A,
  TC-DRAFT-01M3VQFWHAS7HZPJ36EM9BVCX1, TC-DRAFT-01M3VQFWHAPFPWJ6X3VFT03V96, TC-DAILYREPORT-101, TC-DAILYREPORT-102）

  [RF-02/high/boundary] 非按日週期的期初餘額只測了完整週（TC-DRAFT-01M3VQFWH9REY0RJAZ5R6HDN1N、TC-DRAFT-01M3VQFWHA6F7AK1CN5ANZG5DB、TC-DRAFT-01M3VQFWHAZ0WK3F6YM2JX31KJ）。按月、區間合計，以及結算日期起迄不在週／月邊界的不完整期間，期初／期末與驗算式都沒有
  TC。TC-DRAFT-01M3VQFWH966M68T4K7AJ0E6FQ 雖然用了不完整週，但明言「期初／期末餘額為時點值，不在此比對」。ACTIVE TC-015／016 只比金額。不完整週列（例如 09-03～09-06）的期初最容易出錯：實作若取日曆週起點（08-31）之前的值，而不是實際範圍起點（09-03）之前的值，就會和只計範圍內金額的流量對不上，驗算式不成立。
  → 建議：(1) 結算日期 09-03～09-13、按週、依場館彙總：不完整週列（09-03～09-06）期初應＝09-02 結算時點分數合計（依 CLR-DAILYREPORT-008，列期間為實際起迄、範圍外營業日不計入），並以驗算式核對該列；兩列前後相接。(2)
  跨月區間（如 08-20～09-10）按月：每月列的期初＝該列第一個營業日之前的結算值，期末＝最後營業日結算值，驗算成立，08 月列期末＝09 月列期初。(3) 區間合計：唯一一列的期初＝總計列期初＝範圍起點前一營業日值，期末＝總計列期末，驗算成立。（相關
  TC-DRAFT-01M3VQFWH966M68T4K7AJ0E6FQ, TC-DRAFT-01M3VQFWH9REY0RJAZ5R6HDN1N, TC-DRAFT-01M3VQFWHAZ0WK3F6YM2JX31KJ, TC-DRAFT-01M3VQFWHA6F7AK1CN5ANZG5DB,
