diff_summary: '[exploratory] TC-SITELIST-068 v1 繞過 UI 直接呼叫建立站台 API，帶入與上層站台不同的站台類型：Spec 只描述 UI 唯讀跟隨、未定義繞過 UI 時後端是否也拒絕（REQ-SITELIST-002
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-001（2026-09-14）回覆『後端也會拒絕』，但此答覆未回寫進 RequirementModel 的 rejection_contract，故仍以
  exploratory 方式標記，需人工於執行時再次確認

  [exploratory] TC-SITELIST-074 v1 額度上限欄位輸入負數，前後端皆拒絕：Spec 原文未定義輸入負數時系統的回應（REQ-SITELIST-005 的 rejection_contract.defined=false）；PM
  已於 CLR-SITELIST-002（2026-09-14）回覆『前端顯示錯誤、後端也拒絕（雙層驗證）』，但此答覆未回寫進 RequirementModel，故仍以 exploratory 方式標記，執行時需人工再確認實際文案與後端行為

  [exploratory] TC-SITELIST-077 v1 場次逾時時間輸入低於 1 小時或超長格式時系統拒絕：Spec 原文未定義輸入 0、負數或極端值時系統的回應（REQ-SITELIST-006 的 rejection_contract.defined=false）；PM
  已於 CLR-SITELIST-003（2026-09-14）回覆『後端最低值 1 小時、超過 17 位數格式錯誤回 COMMON_INVALID_REQUEST_FORMAT』，此答覆未回寫進 RequirementModel，故以 exploratory
  標記，執行時需人工再確認實際錯誤代碼與文案

  [exploratory] TC-SITELIST-086 v1 站長直接以站台 ID 呼叫查詢 API 存取平行或上層站台：Spec 未定義站長嘗試以站台 ID 直接呼叫查詢 API 存取平行／上層站台時的具體回應（REQ-SITELIST-011
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-004（2026-09-14）回覆『依範圍模型應無法取得資料』，但未定義精確的錯誤格式，且此答覆未回寫進 RequirementModel，故以
  exploratory 標記，需人工確認實際回應格式

  [exploratory] TC-SITELIST-089 v1 站長繞過前端直接呼叫建立站台 API 並帶入其他上層站台 ID：Spec 只定義前端行為（欄位唯讀），未定義繞過前端直接呼叫 API 時後端是否拒絕（REQ-SITELIST-012
  的 rejection_contract.defined=false，且 requirement 本身註明此為已知風險區域）；PM 已於 CLR-SITELIST-005（2026-09-14）回覆『後端已拒絕，此前 RD 回報的可繞過風險已修復』，但此答覆未回寫進
  RequirementModel，故以 exploratory 標記，需人工再次確認後端行為

  [exploratory] TC-SITELIST-092 v1 站長繞過前端直接呼叫編輯站台 API 修改上層站台：Spec 只定義 UI 選單排除循環選項，未定義繞過 UI 直接呼叫編輯 API 時後端是否驗證並拒絕站長的修改（REQ-SITELIST-013
  的 rejection_contract.defined=false）；PM 已於 CLR-SITELIST-006（2026-09-14）回覆『同 CLR-005，站長編輯時的上層站台唯讀限制後端已拒絕』，但此答覆未回寫進 RequirementModel，故以
  exploratory 標記

  [exploratory] TC-SITELIST-093 v1 Admin 繞過前端直接呼叫編輯站台 API，帶入會形成循環的上層站台 ID：CLR-SITELIST-006 的 PM 回覆明確聲明『本次確認聚焦於站長權限，Admin 編輯時的循環防護是否也有對應後端驗證，未在本次回覆中明確涵蓋，若後續測試發現可繞過，需另案處理』；也就是說
  Admin 這一側的後端防護目前完全沒有人力確認過，屬於比站長那一側更不確定的風險

  [exploratory] TC-SITELIST-102 v1 操作員無法檢視或調整任何站台的狀態：本 spec（SPEC-SITELIST-001 v0.4）的「角色與權限」表格只定義 Admin 與站長兩種角色，全文未見任何『操作員』的角色定義或本頁面的存取限制描述；「操作員」在本文件中僅出現於『場次逾時時間…操作員唯讀』與一則註腳『操作員為實體機台功能新增角色，本章不另定義，詳見實體機台_spec_v07.md』。AC-SITELIST-0164
  關於操作員完全無法存取站台列表頁面的斷言，在本文件中找不到直接依據，可能源自實體機台_spec_v07.md 或其他功能區（如 ACCOUNT）的權限設計慣例，需要人工確認此斷言的實際來源與正確性後才能視為確定規則

  [exploratory] TC-SITELIST-130 v1 機台類型根層站台建立時核心貨幣 TWD 連動啟用，過程中未在 admin 端預先啟用該幣別：「帳務管理 > 鏈上錢包管理」這個頁面、以及各頁標題下方的「站台切換」下拉選單，在
  SPEC-SITELIST-001 v0.4 全文完全沒有出現（「鏈上錢包」四字零命中）；step 5 的頁面路徑與「機台場館的鏈上錢包管理僅顯示法幣 TWD 頁籤、只啟用這一種幣別」這個預期觀察，依據來自 SPEC-ARCADE-001
  v0.7「機台場館的後台選單」表與 SPEC-UPDATEPACK-001 v0.1「機台場館的情形」，屬跨 spec 推論，需人工確認在「從站台列表新建機台根站台」這個情境下同樣成立。；AC-SITELIST-0023 then 子句中「不需
  admin 自身的鏈上錢包管理預先啟用該幣別」這一句，在 spec.md v0.4 查無出處，CLR-SITELIST-010（status: APPLIED）的 PM 答覆也只寫到「核心貨幣依所選類型連動建立」、沒有這一句；其唯一出處是
  RequirementModel 的 AC 文字本身。需人工向 PM 確認此斷言的來源與精確語意（是「不需要先啟用」還是「建立時會順帶啟用」）後，才能把它當成確定規則。；本 TC 能否真正證明「不需預先啟用」，取決於執行當下 admin 自身的鏈上錢包管理中
  TWD 恰好不是啟用狀態（step 1 的基準觀察）；若環境中 admin 的 TWD 原本即為啟用，這個否定前提不成立，本次執行只能驗證「連動建立」的正面部分。spec 沒有任何條文說明 admin 層的幣別啟用狀態如何設定或重置，因此「如何佈置出
  TWD 未啟用的 admin 環境」是我無法從 spec 推導的，需環境負責人協助。；新建站台狀態固定為「待開通」（spec.md §操作/新增站台）；spec 未定義「待開通」狀態的站台是否會出現在後台的「站台切換」下拉選單中。若不出現，step
  5 / step 6 無法執行，本 TC 的可驗證範圍將退回到 step 3/4（站台列表頁面內可觀察的核心貨幣連動帶入），需人工確認站台切換清單的納入條件。'
decision:
  decision: reject
  decided_by: oscarchen@blockaction.tech
  decided_at: '2026-09-17T14:07:02Z'
  rationale: TC-SITELIST-130(TC-DRAFT-01M2QR8VA6H9TKKST1WYK73T74)的設計邏輯有誤：拿鏈上錢包管理的幣別啟用狀態當作站台核心貨幣連動建立的驗證依據，但經CLR-SITELIST-011確認兩者是互不相依的獨立概念(鏈上錢包管理是platform級幣種出入金風控開關，跟站台核心貨幣連動完全無關)，需要重新設計這條TC，移除所有鏈上錢包管理相關步驟
