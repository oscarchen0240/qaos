diff_summary: '[exploratory] TC-CASHFLOW-063 v1 稽核倍數大於 0 且有未完成稽核金額時，洗分核可金額已扣除未完成稽核部分：稽核倍數機制沿用既有出金設定（依 §機台帳號的稽核：『機台的開分與入金比照既有的出金設定』），但『未完成稽核金額』的精確判定方式（例如以有效投注額對比存入金額的比例）並未在本
  spec 中重新定義，屬既有機制的延伸；此處佈置『有未完成稽核金額』狀態的具體操作方式為依既有出金設定稽核邏輯的推測，需環境負責人／熟悉既有稽核機制的人員確認佈置方式是否正確

  [exploratory] TC-CASHFLOW-064 v1 稽核倍數大於 0，扣除未完成稽核部分後金額為 0 時視同餘額不足：稽核倍數機制沿用既有出金設定（依 §機台帳號的稽核：『機台的開分與入金比照既有的出金設定』），但『未完成稽核金額』的精確判定方式（例如以有效投注額對比存入金額的比例）並未在本
  spec 中重新定義，屬既有機制的延伸；此處佈置『有未完成稽核金額』狀態的具體操作方式為依既有出金設定稽核邏輯的推測，需環境負責人／熟悉既有稽核機制的人員確認佈置方式是否正確

  [exploratory] TC-CASHFLOW-072 v1 入金 PENDING 超過 24 小時未完成，自動轉為已逾時並釋放預留額度：入金 PENDING 的 24 小時保留期限為系統固定值，spec 未提供可縮短此值以利測試的設定項（不同於場次逾時時間或日結時間可由場館設定調整）；實際測試需與環境負責人確認是否有可加速時間判定的測試機制（例如調整系統時鐘或手動觸發逾時排程），否則需真實等待
  24 小時執行

  [exploratory] TC-CASHFLOW-076 v1 入金 PENDING 超過 24 小時自動轉已逾時，之後收到 end-cashin 一律回 1-NO RECORD：同 REQ-CASHFLOW-008：24 小時為系統固定逾時值，非場館可調整項，測試需與環境負責人確認是否有可加速判定的測試機制，否則需真實等待
  24 小時執行

  [exploratory] TC-CASHFLOW-095 v1 五種未成立原因分別對應正確的狀態碼：情境三『機台停用』的後台操作切換路徑，本 spec 未明確定義其所在頁面（機台帳號沿用既有會員資料機制，推測透過既有的帳號啟用/停用功能操作），實際切換入口需與環境負責人確認

  [exploratory] TC-CASHFLOW-102 v1 分數因投注輸完歸 0 時，場次結束並標記為歸零結束：『分數因投注輸完歸 0』的觸發機制屬於遊戲/投注引擎的範疇，不在本包（機台金流與場次，純後端）定義的四種金流 API 範圍內；本包僅定義『分數歸
  0 時場次如何反應』，至於如何在測試環境中實際觸發分數歸 0（例如是否有可直接呼叫的測試用注單模擬介面），需與環境負責人或遊戲引擎測試團隊確認可行的觸發方式

  [exploratory] TC-CASHFLOW-105 v1 一台機台同時間僅會有一個進行中場次，不會產生併發的第二個進行中場次：本 AC 標註為『理論情境』，真正的高並發競態通常需要能同時發送多筆請求的壓測/自動化工具才能可靠重現與驗證，一般手動或序列化的功能測試僅能模擬『幾乎同時』而非真正併發；是否有可用的並發測試工具/環境需與自動化或效能測試團隊確認

  [exploratory] TC-CASHFLOW-107 v1 機台被設為停用，或所屬場館站台非開通狀態時，任一交易請求皆回 7-OUT OF SERVICE：『機台停用』的後台切換操作路徑，本 spec 未明確定義其所在頁面（僅說明其效果），推測透過既有的會員帳號啟用/停用機制操作，實際入口需與環境負責人確認'
decision:
  decision: reject
  decided_by: oscarchen@blockaction.tech
  decided_at: '2026-09-16T10:34:39Z'
  rationale: Phase2×3交叉比對整合已完成(見RUN-20260916-003/004/005/006)：66組AC中59組語意等價、維持Phase2原版；4組(TC-CASHFLOW-005/008/018/026)已整合Phase3加值內容並核准為v2；2組(AC-0421/0431)因CLR-CASHFLOW-001/002仍OPEN維持Phase2既有exploratory
    TC；1組(AC-0083)為RequirementModel本身資料落差、兩邊皆判定不適用。有價值的Phase3內容皆已透過個別tc revise併入Phase2，本次47條Phase3草稿不整批啟用為獨立ACTIVE TC，避免重複佔用Registry編號，比照MEMBER的整合原則
