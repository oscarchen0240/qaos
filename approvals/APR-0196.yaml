  TC；重複計入會直接讓帳號提早或多產生紅包。 → 建議：建議開 CLR 請 PM／RD 定義同一注單結算重送時，紅包累計是否以注單編號去重。定案前先執行並記錄：玩家 A 累計 900（門檻 1,000），對一筆有效流水貢獻 100 的注單重送同一結算通知（若環境能模擬），記錄週期累計是
  1,000 還是 1,100、是否多產生紅包，並對照 4.2 注單查詢該注單筆數。（相關 TC-DRAFT-01M4QRTV2Y02PC5WCP04KTWME3, TC-DRAFT-01M4QRTV2Z0P9GS31PH63Q59G8, TC-DRAFT-01M4QRTV2ZN8YDDEMRYGS8BQ04）

  [RF-14/high/permission/需澄清] 領取 API 是否檢查紅包屬於呼叫者沒有任何 TC：玩家 A 以 API 帶玩家 B 的紅包編號領取、或機台 M2 帶 M1 的紅包編號領取。spec 只寫紅包屬於取得紅包的帳號（機台屬於該機台），沒有定義其他帳號領取時的回應；放行就等於可以領走他人的獎勵。
