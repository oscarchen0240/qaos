  紅包狀態、雙方錢包／分數、交易紀錄與稽核明細是否有變化。（相關 TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-DRAFT-01M4QRTV2Y06Z4B6Y3SNBGYTS1, TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P）

  [RF-15/medium/permission] 線上站長的紅包範圍限自身站台、不含子站台（CLR-REDPACKET-054），但 T3SFRC 只從畫面測站長對子站台（選單不提供或不顯示只記錄），TJX2SK 的越權 API 只測子站台管理員對上層站台、與無權限角色。站長略過畫面、直接呼叫
  API 操作子站台活動的情況沒有測；此外 TJX2SK 只測『查詢紅包明細』，沒有測『匯出 CSV』API。 → 建議：主站台 A 的站長以 API 工具直接對子站台 A1 的紅包活動呼叫追加預算、取消排程、查詢紅包明細、匯出 CSV，並嘗試在
  A1 新增活動：後端拒絕並回傳『無權限』，A1 活動的總預算與狀態不變、不回傳資料、A1 沒有新增活動。另以無權限角色呼叫匯出 CSV API，同樣拒絕。（相關 TC-DRAFT-01M4QRTV30G2G6EM9H88T3SFRC, TC-DRAFT-01M4QRTV307P31B4CRV9TJX2SK）

