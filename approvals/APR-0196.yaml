diff_summary: '[exploratory] TC-REDPACKET-187 v1 機台紅包稽核未完成且扣除後可核可金額為 0：視同餘額不足，機台畫面顯示餘額不足、分數不扣（佈置依扣除基準推測）：以『稽核倍數 100（所需有效投注額
  3,000）、M1 分數低於 3,000』佈置出『扣除後可核可金額為 0』的前提：此佈置假設扣除的金額是『剩餘未達的所需有效投注額』（≥ 分數），但 CLR-REDPACKET-056 尚未回答扣除金額的計算基準（也可能是『未完成稽核的紅包金額
  30』，那麼核可金額會是 B－30，前提不成立）；因此本案的前提與預期都依賴未定案的決策點，待 PM 回覆後再轉為確定案例

  [exploratory] TC-REDPACKET-202 v1 重複點擊或兩個裝置同時確認領取同一個待開啟紅包：只入帳一次（錢包、交易紀錄、稽核明細各一筆）：重複點擊或兩裝置同時領取同一個待開啟紅包時只入帳一次（冪等）：spec 未明寫重複／併發請求的行為，只定義紅包狀態待開啟→已入帳、『領取獎勵（N）』每次領取一個；此預期由狀態規則推得（整合評估
  RE-O-06 註明『v02 未明寫冪等』），非 spec 明文，待 PM／RD 確認

  [risk-review] 抽查 SPEC-REDPACKET-001 0.2 的 82 張已 VALIDATED 草稿（修訂 20、新增 62；TC-018、035、086 沿用 Registry ACTIVE 版），對照 R001 需求模型、spec
  原文與同 area ACTIVE TC。五個面向皆有缺口，共 17 條建議（high 6、medium 8、low 3），其中 7 條 spec 未定義、需開 CLR。最需優先處理的是金額與預算一致性：多帳號同時達標爭用共用預算池可能超發（RF-07）、建立活動重複送出可能同時存在兩個進行中活動（RF-12）、線上領取與重置／取消排程競爭可能既入帳又作廢（RF-09）、領取中途失敗的原子性未定義（RF-04）、領取
  API 未驗證紅包歸屬（RF-14）。CLR-REDPACKET-051、056 與待確認出金手動取消入口已在 TC 中只記錄，未列為遺漏。本報告只提建議，不修改 TC、不判 PASS／FAIL、不擋 ACTIVATE。

  [RF-01/medium/boundary/需澄清] 機台場館的紅包金額同樣允許 1 位小數（固定金額、權重表各列），入帳後機台分數會帶小數。本次所有機台 TC 都用整數金額（20、30），沒有一張驗證小數紅包入帳後的分數、4.1／4.4
  的 TWD 金額、日結報表紅包金額與餘額驗算；而機台帶小數餘額時出金的收據面額與付現怎麼處理，CLR-CASHFLOW-007 仍為 OPEN，紅包是新增的小數來源。 → 建議：機台場館建立紅包活動：固定金額 10.5 TWD（另一輪用權重表
  0.5／10.5）；M1 達標後領取。可依 spec 斷言的部分：M1 分數 +10.5、4.1 機台視角『紅包』列與 4.4 稽核明細金額為 10.5 TWD、場館日結報表紅包金額 10.5 且餘額驗算成立。之後玩家按結算出金（以及店員全洗），收據面額、付現與小數殘值的處理只記錄，待
  CLR-CASHFLOW-007 定案後再補預期；建議 PM 一併確認機台場館是否應限制紅包金額為整數。（相關 TC-DRAFT-01M4QRTV2Y2AE3D2B0QSBT7H2A, TC-DRAFT-01M4QRTV2ZHFH432KPQRZ8447F,
  TC-DRAFT-01M4QRTV31RVKRGZ5AB1XDHKE4, TC-DRAFT-01M4QRTV309R217TTBXC36D4V1）

  [RF-02/low/boundary] 重置前 1 小時的作廢提示只有線上站台（UTC+0 00:00）的 61／59 分鐘邊界（FDDD45）；機台場館的重置點是場館日結時間，計算路徑不同，沒有任何 TC 驗證機台在日結時間前 1 小時起提示，也沒有驗證日結時間變更（調早／調晚）後提示跟著新的週期結束點走。
  → 建議：機台場館日結時間 UTC+0 20:00、每日重置，M1 有 1 個待開啟紅包：UTC+0 18:58 開啟紅包視窗不提示；19:01 提示『未開啟的紅包將於重置時作廢』。另一輪於 10:00（台灣時間）把日結時間調晚為 06:00（本週期延至次日
  06:00 結束），檢查提示改在次日 05:00 起出現、原 03:00～04:00 不提示。（相關 TC-DRAFT-01M4QRTV30ZJXMQSPZN2FDDD45, TC-DRAFT-01M4QRTV30VYEJF1YX743J07Z8,
  TC-DRAFT-01M4QRTV30JP5WSK6Z6ZNWVDEV, TC-DRAFT-01M4QRTV2ZAFMQERDCMHTC8BX2, TC-DRAFT-01M4QRTV2ZM2P4C3K1BD7N59QB）

  [RF-03/low/boundary] 機台場館的『每月 1 日』重置沒有 TC。1VZQ5P 只驗證每週一在日結時間切分、J9JWZK 只驗證線上 UTC+0 00:00 的月切分；日結時間為 UTC+0 20:00 時，1 日營業日的起點落在
  UTC 上個月最後一天 20:00，日期跨月邊界最容易算錯。 → 建議：機台場館日結時間 UTC+0 20:00、重置方式『每月 1 日』，月底前產生 1 個待開啟紅包（累計有餘量）：UTC+0 月底日 19:50 檢查未重置；20:10（台灣時間
  1 日 04:10）檢查待開啟紅包作廢（週期重置）、累計歸零；另於 UTC+0 1 日 00:10 確認不是在 UTC 日曆換月時重置。（相關 TC-DRAFT-01M4QRTV2ZBVQJHP8VRV1VZQ5P, TC-DRAFT-01M4QRTV2ZM2258YB23YJ9JWZK）

