  PM／RD 定義後再轉為斷言。（相關 TC-DRAFT-01M4QRTV2XG6VGENEHFM9117Z1, TC-DRAFT-01M4QRTV313SNH2SW9K7M7V2TD, TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8,
