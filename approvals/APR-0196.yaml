  [RF-05/medium/exception_flow] 注單取消『活動已結束時不扣』只驗證了週期已重置的一半（V3FFZ8）。已取消的活動不占時段，可立即以相同時段重建；舊活動的注單在新活動期間被遊戲商取消時，負值不應扣到新活動的累計，這條路徑沒有
  TC，扣錯會讓新活動少發或延後發紅包。 → 建議：線上站台活動 A（永久、門檻 1,000）：玩家 A 結算 300；取消排程 A，立即建立相同設定的活動 B；玩家 A 在 B 結算 500。對屬於活動 A 期間的那筆 300 觸發遊戲商取消（－300）：B
  的累計仍為 500；再結算 499 不產生紅包、再結算 1 恰好產生 1 個（週期累計 1,000）。（相關 TC-DRAFT-01M4QRTV2Z7YT91T76KKV3FFZ8, TC-DRAFT-01M4QRTV2ZN8YDDEMRYGS8BQ04,
  TC-REDPACKET-035）

  [RF-06/low/exception_flow/需澄清] 『洗分／出金後才達標』直接以已作廢建立、不占預算、計入已產生數；但活動此時若已預算用罄（剩餘預算小於抽出金額），第 392 行規定不產生該紅包，第 399 行規定照常建立已作廢紅包，兩條規則同時成立時怎麼處理沒有定義，會影響『本期已獲得』與單週期上限的計數。
  → 建議：機台場館活動總預算 20、固定 20：M1 產生並領取 1 個（剩餘 0、預算用罄），另一局暫緩結算；店員洗分完成後讓該局結算達標，記錄是否建立已作廢紅包（作廢原因機台洗分）、本期已獲得是否 +1。預期請 PM 定義後再轉為斷言。（相關
  TC-DRAFT-01M4QRTV31VK907F8N9YFBHXP6, TC-DRAFT-01M4QRTV2Z4DFF97PN9ACDWBV1）

  [RF-07/high/concurrency] 總預算是整個活動（所有帳號、所有規則）共用一池，但預算邊界只用單一帳號依序結算來測。多個帳號幾乎同時達標、剩餘預算只夠其中一個時，若產生紅包與扣預算不是原子操作，會產生超出總預算的紅包（占用大於總預算），直接造成超發。
  → 建議：線上站台活動總預算 30、固定 30、門檻 100、上限 5；玩家 A、B、C 各自累計 90。以腳本讓三人各一筆有效流水貢獻 10 的注單幾乎同時結算，重複 5 輪（每輪重建活動）。每輪斷言：只產生 1 個紅包、預算使用 30
  ／ 30、活動標示『預算用罄』、其餘兩人該門檻不產生且之後不補發；任何一輪出現占用大於總預算即為缺陷。（相關 TC-DRAFT-01M4QRTV2Z4DFF97PN9ACDWBV1, TC-REDPACKET-038, TC-REDPACKET-039）

  [RF-08/medium/concurrency] 循環產生與單週期上限只用依序結算來測。同一帳號多筆注單同時結算（多桌、多遊戲）時，累計若有遺失更新，會少計或多產生紅包；接近上限時同時結算可能產生超過上限的紅包數。 → 建議：(1) 門檻
  100、上限 10：玩家 A 從 0 起，5 筆各 100 的注單同時結算 → 恰好產生 5 個、週期累計最後為 500。(2) 門檻 100、上限 2：玩家 A 已產生 1 個、距下一門檻 90，5 筆各 100 的注單同時結算 → 只再產生
  1 個（本期已獲得 2 ／ 2），保留餘數 90，其餘 4 筆不再計入。每種各重複 3 輪。（相關 TC-REDPACKET-027, TC-REDPACKET-028, TC-DRAFT-01M4QRTV2ZQZHC22H7PS2SNX41）

  [RF-09/high/concurrency] 領取與作廢事件互相競爭的情況只測了機台『領取 vs 店員洗分』（9PXZJX）。線上的『領取 vs 週期重置』『領取 vs 取消排程／活動到期』沒有測：確認領取視窗開著時紅包已被作廢再按［確認領取］，或兩者在同一瞬間發生。TC-REDPACKET-035（ACTIVE
  v2）只在取消完成後依序嘗試開啟，新增的 4KGF0P 以 API 開啟已作廢紅包只記錄，FC98S7 第 5 步也只記錄，都沒有涵蓋同時發生、也沒有斷言不入帳。紅包被作廢後仍入帳，或入帳後又被作廢（並釋放預算），都會造成金額與預算不一致。
  → 建議：線上活動每日重置、固定 10、設總預算：(1) 玩家 A 在 UTC+0 23:59:50 開啟確認領取視窗，00:00:05 才按［確認領取］；(2) 後台按『確認取消』與玩家按［確認領取］同時送出，重複 5 輪。每輪斷言結果只有兩種：已入帳（錢包、交易紀錄、稽核明細各
  1 筆，之後不被作廢、預算仍占用）或已作廢（週期重置／活動結束；錢包不變、無『紅包』交易與稽核、預算釋放），不出現既入帳又作廢。前台被拒時的訊息只記錄。（相關 TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P, TC-DRAFT-01M4QRTV30KT8PFVK9R3FC98S7,
  TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-REDPACKET-029, TC-REDPACKET-034, TC-REDPACKET-035）

  [RF-10/high/duplicate_submission/需澄清] N23FH8 測了連點與兩裝置同時領取，但『只入帳一次』是推得的預期（Validator 已提醒標成 assumption、建議開 CLR）。另外沒有測『事後重放同一個領取請求』：對已入帳的紅包再送一次領取
  API（不是同時）、或機台帳號重送領取請求；spec 沒有定義重複領取的冪等與回應。 → 建議：建議開 CLR 請 PM／RD 定義重複／重放領取請求的處理（是否以紅包編號冪等、回應為何）。定案前先執行並記錄：線上玩家 A 領取 P1 成功後，以
  API 工具重送完全相同的領取請求 2 次；機台 M1 同樣重送一次。記錄錢包／分數、交易紀錄『紅包』與稽核明細筆數是否仍各 1。（相關 TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P,
  TC-DRAFT-01M4QRTV315R7RJVD1859PXZJX）

  [RF-11/medium/duplicate_submission] 追加預算只測了單次送出的合法與不合法金額。連點［確認］、重放同一個 API 請求、或兩位管理員同時從相同的『目前總預算』出發各自追加，都沒有測；處理不當會重複寫 7.4
  操作紀錄，或後送的較小值覆蓋較大值，等於調低了總預算（違反只能調高）。 → 建議：進行中活動總預算 5,000：(1) 輸入 6,000 後快速連點［確認］3 次，或以 API 重送同一請求 → 總預算 6,000，7.4 操作紀錄只多 1
  筆（5,000→6,000），其餘請求因 6,000 不大於目前 6,000 被拒。(2) 管理員甲、乙同時開啟追加預算視窗（皆顯示 5,000），甲先送 7,000、乙再送 6,000 → 乙被拒，總預算維持 7,000、操作紀錄 1 筆；順序對調（乙
  6,000 先、甲 7,000 後）→ 兩筆皆成功，紀錄為 5,000→6,000、6,000→7,000。總預算任何時候都不得下降。（相關 TC-DRAFT-01M4QRTV2YSK5G3458G1JEV2MM, TC-DRAFT-01M4QRTV2ZWPJZKP0D0SPKJDQ9,
  TC-DRAFT-01M4QRTV2X4JFADXPN14J9TJMN, TC-REDPACKET-041）

  [RF-12/high/duplicate_submission] 時段重疊阻擋只用『既有活動已存在後再新增』來測。快速連點『儲存』、重放建立 API，或兩位管理員／站長同時在同一站台建立重疊時段的活動，如果重疊檢查與寫入不是原子操作，就可能同時存在兩個進行中的紅包活動，同一筆流水被兩個活動累計、重複發放。
  → 建議：線上站台（另於機台場館各一輪）目前沒有進行中或排程中的紅包活動：(1) 填妥合法表單後快速連點『儲存』3 次；(2) 以 API 重送同一個建立請求；(3) 管理員與站長同時送出兩個時段重疊的活動。每種皆斷言活動排程只多 1 個進行中／排程中的活動，其餘被阻擋；之後玩家結算達門檻只產生
  1 個紅包。（相關 TC-REDPACKET-044, TC-REDPACKET-045, TC-REDPACKET-082）

