  只測財務在自身站台。 → 建議：建議開 CLR 請 PM 定義線上財務在紅包功能的管轄範圍（是否含子站台）。定案前先執行並記錄：主站台 A 的財務切換到子站台 A1（若選單提供），嘗試檢視 A1 的紅包活動與明細、追加預算、取消排程，並以
  API 直接呼叫；記錄可否操作與回應。（相關 TC-DRAFT-01M4QRTV302RS8KW8Z7EZPDA65, TC-DRAFT-01M4QRTV30G2G6EM9H88T3SFRC, TC-REDPACKET-055）'
