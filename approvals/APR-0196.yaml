  CSV，都沒有測。 → 建議：站長 S 管轄場館 V1、V2，另有不在其管轄內的場館 V3（有進行中活動）：S 以 API 對 V3 的活動呼叫追加預算、取消排程、查詢紅包明細、匯出 CSV，並嘗試在 V3 新增活動 → 一律拒絕並回傳『無權限』、V3
  資料不變。V1 操作員以 API 匯出 V2 活動的紅包明細 CSV → 拒絕、不回傳資料。（相關 TC-DRAFT-01M4QRTV2YX2W5956AFZQ3172R, TC-DRAFT-01M4QRTV2Y6SMYD0TG73DT5P9Y,
  TC-REDPACKET-059）

