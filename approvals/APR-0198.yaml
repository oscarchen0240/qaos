diff_summary: '[risk-review] 抽查 7 張 VALIDATED 新增 TC（REQ-CASHOUT-006／018／022／032，AC 0062、0183、0184、0222、0321、0322、0323），五個面向皆有缺口，共
  19 條建議：high 6、medium 10、low 3；其中 11 條 spec 未定義、需開 Clarification（RF-01、02、06、07、08、09、10、11、13、16、19），其餘 8 條有 spec 依據可直接補案例。最優先：同一收據雙核實與請求重放（RF-12、RF-15，第
  95 行『避免重複付款』）、已核實收據能否作廢（RF-09）、核實中途失敗的連動一致性（RF-10）、日結報表切日臨界值（RF-01）。本審查只提建議，不修改 TC、不判定 PASS／FAIL。

  [RF-01/high/boundary/需澄清] REQ-CASHOUT-032 三張草稿都刻意選交易時間離 UTC+0 00:00 至少 2 小時的收據，避開了日期切分點本身；「出收據那天」在日結報表以什麼時點切日（UTC+0 00:00
  或場館日結時間／營業日）本 spec 沒有定義（切日規則屬場館日結報表規格，不在派發包範圍）。歸屬錯一天的缺陷最容易出現在切分點前後，目前沒有任何 TC 會打到。 → 建議：先開 Clarification 確認日結報表「出收據那天」的切日基準，再補一張臨界值案例：分別取切分點前
  1 分鐘與後 1 分鐘出收據的兩張待核實出金，查日結報表相鄰兩日列的未兌現金額，並對其中一張執行作廢，看已作廢金額記在哪一列。預期列歸屬待 Clarification 定案後再寫入，現在不要自行假設是 UTC+0。（相關 TC-DRAFT-01M4R8AB9CG3THKPB84PTVW6A4,
  TC-DRAFT-01M4R8AB9CRSXTEP1D729J9S7B, TC-DRAFT-01M4R8AB9CREDEGPX5G5GA4C1G）

  [RF-02/medium/boundary/需澄清] 小數只測了一位小數（399.6 → 399.60）。機台餘額若帶兩位小數（如 399.65）或超過兩位（如 399.655），面額要保留幾位、超出位數是四捨五入還是截斷，spec 只給了一位小數的例子，沒有定義精度規則。實際金額欄、核實彈窗、提款金額累計、日結報表四處若各自取捨，會出現對不上的情況。另外整數面額的顯示格式（第
  118 行同時寫『餘額 321 → 收據面額 321』與『399.6 → 399.60』）是否補兩位小數也沒有一致規則。 → 建議：開 Clarification 確認面額的小數精度與進位規則（含整數面額是否顯示 .00）。定案後補邊界案例：餘額
  399.65、399.655（若機台餘額可能出現三位）分別出金，比對收據／結算畫面、實際金額欄、核實彈窗、會員列表提款金額差值、日結報表未兌現金額五處數值是否一致。（相關 TC-DRAFT-01M4R8AB9CHKEEY1FY5T8Q1G7S,
  TC-DRAFT-01M4R8AB9CP86RY8N2PBRD049S, TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D, TC-CASHOUT-063）

  [RF-03/medium/boundary] 提款金額累計只驗了單筆 +399.60；日結報表三張草稿的面額 F 也沒要求帶小數。多筆含小數面額連續累計（典型浮點誤差組合如 0.10＋0.20、或多筆 .x5 相加）時，會員列表提款金額與報表未兌現／已作廢金額總計是否仍是精確和，沒有案例覆蓋。
  → 建議：對同一機台帳號依序核實面額 0.10、0.20、399.65 三張出金（或可佈置的等價含小數面額），每次核實後讀會員列表提款金額，確認差值逐筆精確等於面額、總和為 400.95，不出現 400.9499… 之類尾數；另讓含小數面額的兩張收據落在同一天，查日結報表該列未兌現金額等於面額精確加總。（相關
  TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D, TC-DRAFT-01M4R8AB9CRSXTEP1D729J9S7B, TC-DRAFT-01M4R8AB9CREDEGPX5G5GA4C1G, TC-CASHOUT-048）

  [RF-04/medium/boundary] 門檻 0 全額洗分的含小數金額（399.6）只驗了實際金額欄顯示（AC-0184）；第 118 行說核實與日結報表一律以面額計、門檻 0 全額洗分比照，但沒有案例驗證這筆 399.6 洗分核實後的會員列表提款金額累計，以及現金淨收扣除項是否以
  399.6 計（TC-CASHOUT-048／081 用的是一般整數洗分）。 → 建議：延續 AC-0184 的佈置（機台端門檻 0、餘額 399.6 全額洗分），核實該筆洗分：核實前後讀會員列表提款次數／提款金額，確認 +1、+399.6；並查場館現金淨收計算，核實前不扣、核實後扣除
  399.6，不取整為 399 或 400。（相關 TC-DRAFT-01M4R8AB9CP86RY8N2PBRD049S, TC-CASHOUT-048, TC-CASHOUT-081）

  [RF-05/low/boundary] 含小數面額只取了 399.6；整數部分為 0 的面額（機台餘額 0 < x < 1，例 0.6 → 0.60）沒有覆蓋。TC-CASHOUT-110 只測洗分接近 0 的顯示，未涵蓋出金收據面額，也未涵蓋小數顯示（0.60
  被顯示成 .6、0 或空白之類的格式缺陷）。 → 建議：機台餘額 0.6 時玩家結算出金，於本頁檢視實際金額欄、核實彈窗金額，確認顯示含小數的面額（0.60），不取整為 0 也不顯示空白；核實後會員列表提款金額 +0.60。（相關 TC-DRAFT-01M4R8AB9CHKEEY1FY5T8Q1G7S,
  TC-CASHOUT-110）

  [RF-06/low/boundary/需澄清] v0.2 起實際金額可能帶小數，但金額範圍篩選（第 57 行只寫『範圍輸入（min ～ max）』）是否接受小數輸入、邊界值是否含等號（min=max=399.60 能否查到該筆）沒有定義；TC-CASHOUT-058
  只驗一般範圍。櫃檯以金額輔助查找含小數面額時可能查不到。 → 建議：開 Clarification 確認金額篩選是否支援小數與邊界是否含等號；定案後補案例：以 min=399.6、max=399.6，以及 min=399、max=399.59
  查詢面額 399.60 的出金，確認是否列出。（相關 TC-CASHOUT-058）

  [RF-07/medium/boundary/需澄清] 跨日收據（D 日出收據、D+n 日核實）核實後，D 日列的未兌現金額轉出，但轉出的這筆兌現金額（現金淨收的扣除項）記在 D 日列還是核實那天的列，spec 只說作廢記在出收據那天（第
  104 行），對跨日核實的兌現金額歸屬沒有規定。TC-DRAFT-…RSXT 只驗 D 日列不再含此筆、之後各列未兌現不增加，沒有驗兌現金額去哪一列。 → 建議：開 Clarification 確認跨日核實的兌現金額（含現金淨收扣除項）歸屬
  D 日或核實日；定案後在 TC-DRAFT-…RSXT 的情境上補檢查 D 日列與核實日列的現金淨收／已兌現相關欄位前後差值。（相關 TC-DRAFT-01M4R8AB9CRSXTEP1D729J9S7B, TC-CASHOUT-082）

  [RF-08/medium/boundary/需澄清] 第 110 行要求『要看全部未兌現，結算日期須涵蓋最早一張未兌現收據』，收據又永久有效。日結報表的結算日期範圍若有上限（例如最多可查 N 天或只保留某段期間），很舊的未兌現收據將無法被涵蓋，負債總計會失真；上限是否存在、超出時如何處理，本
  spec 未定義（屬場館日結報表規格）。 → 建議：開 Clarification 確認日結報表結算日期範圍的上限與資料保留期；若有上限，補案例：最早一張未兌現收據早於上限時，用最大範圍查詢，確認系統如何提示或呈現這筆負債。（相關 TC-DRAFT-01M4R8AB9CREDEGPX5G5GA4C1G）

  [RF-09/high/exception_flow/需澄清] 作廢的前置狀態沒有定義：第 95 行限制只有待核實可核實，但作廢（第 102～104 行）沒有寫只能對待核實出金執行。若已核實（已兌現）的收據還能被作廢，同一筆面額會同時算在已兌現與
  D 日列的已作廢金額，提款金額是否回扣也不明。RM 只列出 待核實→已作廢 的轉換；同 area ACTIVE TC 只有『已作廢不能再核實』（TC-CASHOUT-071），沒有『已核實能否作廢』。 → 建議：開 Clarification
  確認已核實出金是否可作廢（操作欄是否還提供作廢、後端是否拒絕）。定案後補負向案例：對一筆已核實出金嘗試作廢（介面與直接呼叫 API 各一次），並檢查 D 日列已作廢金額與會員列表提款金額是否變動。（相關 TC-DRAFT-01M4R8AB9CG3THKPB84PTVW6A4,
  TC-CASHOUT-077, TC-CASHOUT-071）

  [RF-10/high/exception_flow/需澄清] 核實一次會改動三處：核實狀態、機台交易紀錄回寫（第 97 行）、會員列表提款次數／金額累計。按下確認後請求逾時、網路中斷或後端部分失敗時，三處是否同進同退、畫面如何提示、櫃檯是否已可付現，spec
  沒有定義；核實又不可撤銷（第 98 行），若出現『狀態已核實但提款金額未累計』或反之，無法由操作修正。 → 建議：開 Clarification 確認核實請求失敗或逾時時的處置（狀態是否維持待核實、是否保證三處一致、櫃檯如何判斷可否付現）。定案後補案例：在確認送出瞬間中斷網路（或以測試工具讓
  API 逾時），重新整理後核對該筆核實狀態、機台交易紀錄核實欄位、會員列表提款次數／金額三者是否一致。（相關 TC-DRAFT-01M4R8AB9CQN2FV3S1ND7SJ05V, TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D,
  TC-CASHOUT-075）

  [RF-11/medium/exception_flow/需澄清] 過渡期以前台結算結果畫面照片代替收據（第 30 行），畫面顯示的是『結算分數』；spec 沒有規定結算分數的小數顯示。若照片顯示 399.6、399 或 400，而核實彈窗顯示
  399.60，櫃檯『核對無誤後點擊確認』會遇到金額對不上的情況，該如何處置（以後台為準照付、拒付、轉人工）沒有定義。Validator 已點出前提檢查的格式問題，但金額不一致時的櫃檯處置流程仍無案例。 → 建議：開 Clarification
  確認結算結果畫面的分數顯示精度，以及照片金額與核實彈窗金額不一致時櫃檯的處置；定案後補一張例外案例，以餘額 399.6 出金，比對結算結果畫面與核實彈窗金額，依定案處置驗證。（相關 TC-DRAFT-01M4R8AB9CHKEEY1FY5T8Q1G7S,
  TC-DRAFT-01M4R8AB9CQN2FV3S1ND7SJ05V, TC-CASHOUT-069）

  [RF-12/high/concurrency] 兩個櫃檯（或同一帳號兩個分頁）同時對同一張待核實出金按核實確認：兩邊開彈窗時都看到待核實。TC-CASHOUT-070 只測『已核實後再核實』的循序情境，沒有測兩個請求同時抵達的競態；若後端沒有原子的狀態檢查，會變成兩次核實、提款次數
  +2、提款金額累計兩次，等同重複付款。 → 建議：以兩個已登入的工作階段開啟同一張待核實出金（例如面額 399.60）的核實彈窗，盡量同時按確認：預期僅一方成功、另一方被阻擋並提示；會員列表提款次數只 +1、提款金額只 +399.60，核實人員／時間只記一筆。（相關
  TC-DRAFT-01M4R8AB9CQN2FV3S1ND7SJ05V, TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D, TC-CASHOUT-070）

  [RF-13/high/concurrency/需澄清] 同一張待核實出金，櫃檯正在核實、站長同時作廢：作廢先完成時，第 95 行規定核實要被擋；核實先完成時，作廢是否被擋則取決於 RF-09 未定義的規則。兩者交錯時最終只能有一個終態，否則日結報表會同時出現已兌現與已作廢金額，提款金額也可能已累計。目前沒有覆蓋這組競態。
  → 建議：RF-09 定案後，以兩個工作階段（操作員核實、站長作廢）對同一張待核實出金幾乎同時送出：確認最終只有一種狀態，敗方收到阻擋提示；D 日列只出現在已作廢或已兌現其中之一，提款金額只在核實勝出時累計。（相關 TC-DRAFT-01M4R8AB9CG3THKPB84PTVW6A4,
  TC-DRAFT-01M4R8AB9CQN2FV3S1ND7SJ05V, TC-CASHOUT-071, TC-CASHOUT-077）

  [RF-14/medium/concurrency] 同一機台帳號有兩張不同的待核實收據（或一筆洗分＋一張收據），由兩個櫃檯同時核實。兩筆都會寫入同一個提款次數／提款金額累計值，若累計採先讀後寫，會發生更新遺失（只加到一筆）。TC-DRAFT-…Y985
  與 TC-CASHOUT-048 都是單筆循序核實。 → 建議：同一機台帳號準備兩張待核實出金（面額 F1、F2，至少一張含小數），兩個工作階段同時核實：完成後會員列表提款次數 = N0 + 2、提款金額 = W0 + F1 + F2。（相關
  TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D, TC-CASHOUT-048）

  [RF-15/high/duplicate_submission] 核實確認鈕連點兩下、或網路重試／重放同一個核實請求，現有案例都沒有覆蓋。TC-CASHOUT-070 是在畫面已顯示已核實之後再操作；同一請求在狀態更新前重送時，若後端不以狀態原子判斷，會造成提款次數
  +2、提款金額重複累計（AC-0062 的 +399.60 會變成 +799.20）。 → 建議：對一張面額 399.60 的待核實出金，在核實確認彈窗快速連點確認；另以開發者工具重送同一個核實請求一次。預期只成立一次核實，重送被阻擋並提示；會員列表提款次數
  +1、提款金額 +399.60，機台交易紀錄與後台操作紀錄只各一筆核實。（相關 TC-DRAFT-01M4R8AB9CQN2FV3S1ND7SJ05V, TC-DRAFT-01M4R8AB9CY9854ZMQX882HA3D, TC-CASHOUT-070）

  [RF-16/medium/duplicate_submission/需澄清] 作廢送出鈕連點或作廢請求重送：spec 只規定已作廢不能再核實（第 95 行），沒有規定重複作廢時系統要阻擋提示或冪等忽略，也沒有規定重送是否會覆寫作廢原因或追加操作紀錄。若處理不當，D
  日列已作廢金額可能被計入兩次（AC-0321 的 V_D0 + F 會變成 V_D0 + 2F）。 → 建議：開 Clarification 確認重複作廢請求的系統回應（阻擋提示或冪等）與作廢原因、操作紀錄是否保留第一次的內容。定案後補案例：對一張待核實出金連點作廢送出並重送一次請求，核對
  D 日列已作廢金額增加量、作廢原因與後台操作紀錄筆數。（相關 TC-DRAFT-01M4R8AB9CG3THKPB84PTVW6A4, TC-CASHOUT-077）

  [RF-17/medium/duplicate_submission] 機台端的出金完成回報若重送（同一訂單編號的完成通知送達兩次），本頁是否只產生一筆待核實紀錄沒有案例。若產生兩筆，日結報表 D 日列的未兌現金額會重複計入，也可能被兩個櫃檯各兌現一次。TC-CASHOUT-041／084
  只驗正常情境產生一筆。 → 建議：以機台端測試工具對同一筆出金重送完成回報（同一訂單編號），確認本頁以該訂單編號查詢只有一筆待核實紀錄，D 日列未兌現金額只計一次面額。（相關 TC-DRAFT-01M4R8AB9CRSXTEP1D729J9S7B,
  TC-DRAFT-01M4R8AB9CREDEGPX5G5GA4C1G, TC-CASHOUT-041, TC-CASHOUT-084）

