  rationale: Oscar 提供實際畫面截圖，發現多項篩選器設計與實際產品不符：(1) 交易類型與交易狀態皆為多選 chip 篩選，非單選下拉；(2) 交易狀態選項依交易類型分兩組、且用詞是後端技術值而非 spec.md 的 5 個分類詞；(3)
    交易類型實際標籤為「開分/入鈔/出鈔/洗分」，非「機台開分/機台洗分/機台入金/機台出金」；(4) 核實狀態篩選只有 3 個可選值，無「不適用」。需回頭依實際畫面修正 REQ-008/009/010 與相關 TC
