diff_summary: '[exploratory] TC-BONUSCCY-048 v1 存款後的流水門檻增量與手續費，以玩家實際存入的原始金額為基數計算：spec.md 未說明存款觸發非零『流水倍數』與『手續費』的確切條件（例如是否需要同時符合某個存款相關紅利活動才會有流水倍數，或手續費率如何配置／在哪個後台頁面可查）。此測試資料佈置方式（選定一名存款會產生非零流水倍數與手續費的會員、並於後台查得其規則數值用於回算比對）是我方為了讓案例可執行而做的推測，需要環境負責人確認實際可行的操作路徑與查詢頁面。

  [exploratory] TC-BONUSCCY-051 v1 已開啟「有效會員每月重置」的簽到活動，跨月後有效會員累積進度正確歸零重算，不誤讀上月已計入的舊資料：spec 未定義如何在測試環境中人工製造『跨月』情境（例如是否有可調整系統日期的測試環境，或需要仰賴自然存在、真的橫跨月份邊界的既有會員資料）。此測試資料佈置方式是我方推測的可行做法，需要環境負責人確認實際可行的操作路徑。'
