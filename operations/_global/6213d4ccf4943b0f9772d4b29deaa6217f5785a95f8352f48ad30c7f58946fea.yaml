  spec_id: SPEC-REDPACKET-001
  spec_version: '0.2'
  question: 機台場館的紅包金額是否應限制為整數？若允許 1 位小數（例 10.5），機台入帳後的分數、4.1／4.4 金額、日結報表紅包金額是否都照記含小數？
  context: 紅包金額允許 1 位小數（固定金額、權重表），機台場館入帳後分數會帶小數；出金收據的小數處理已由 CLR-CASHFLOW-007 定案（照記含小數、平台只記面額）。（來源：2026-10-12／13 T3RR 風險抽查
    REDPACKET RF-01；問題單 C 主題 C3）
