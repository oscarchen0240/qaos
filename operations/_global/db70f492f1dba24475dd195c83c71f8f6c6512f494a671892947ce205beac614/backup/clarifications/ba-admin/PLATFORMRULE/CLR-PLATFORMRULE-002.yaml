answer: 此為架構層要求（選單顯示規則需與排除規則同一來源，不得各自寫死），非使用者可觀察行為，且目前無任何排除項目被實際解除、無真實案例可測。維持 rejection_contract.defined=false；Test Design
  階段不強行湊負向 TC，於 TestDesignReport 註記「架構要求，待未來有排除項目實際解除時再補測試」；未來若要驗證，走「先解除某排除項目→驗證對應頁面恢復顯示」的真實案例，而非現在憑空模擬。
