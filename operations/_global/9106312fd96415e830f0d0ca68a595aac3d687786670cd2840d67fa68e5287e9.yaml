  question: 以 API 建立子站台並帶入與主站台不同的站台類型時，後端是否拒絕、回應為何。v0.7 第 59、223 行的「後端強制／無權限」只列權限類限制（管轄範圍、自身站台限制、角色指派上限），未涵蓋類型繼承。CLR-SITELIST-001
    rev 0（針對 v0.4）答「後端會擋下」，但該答案的 basis 與本次分析不同、也沒有自身答案範圍，不能直接作為 v0.7 的依據（X16）；需以 applicability 綁定到 v0.7 或重新確認，並確認回應內容
  context: REQ-SITELIST-002：站台類型於主站台（根站台 admin 底下第一層）選定，其下所有子站台一律與主站台同類型、不可個別選擇（新增視窗唯讀跟隨主站台）；根站台 admin 不參與繼承鏈，故於根站台底下新增主站台時可自由選擇線上或機台，核心貨幣依所選類型連動。以下兩點為前版依
    CLR 記載、v0.7 原文未載的行為，本版列為待綁定決策點（見 Q02、Q03）：子站台以 API 帶入與上層不同類型時後端拒絕（CLR-SITELIST-001）；新站台建立時自動於該站台自己的鏈上錢包管理啟用對應幣別、不依賴根站台
    admin 的設定（CLR-SITELIST-012，修正 CLR-SITELIST-011）。
