  context: REQ-REDPACKET-027：機台場館累計達門檻時，於當局結束後在機台遊戲畫面彈出紅包；玩家點擊開啟 → 顯示金額 → 分數即時增加。玩家未開啟即關閉彈窗時，紅包保留於遊戲首頁錢包彈窗內（與結算鍵同處）可再次開啟。玩家於錢包彈窗按結算鍵、或店員洗分時，若尚有待開啟紅包，前台提示「尚有紅包未開啟，交易完成後將作廢」。洗分或出金請求送出後、交易完成前，紅包按鈕停用並顯示「交易處理中」；交易取消或未成立即恢復可開啟。提示的觸發時點、文字與位置（機台前台，含店員洗分時）由第
    173 行定義；呈現樣式由前台設計另定（第 176 行）。
