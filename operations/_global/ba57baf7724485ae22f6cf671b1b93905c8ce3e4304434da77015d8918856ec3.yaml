    [RF-06/low/exception_flow/需澄清] 『洗分／出金後才達標』直接以已作廢建立、不占預算、計入已產生數；但活動此時若已預算用罄（剩餘預算小於抽出金額），第 392 行規定不產生該紅包，第 399 行規定照常建立已作廢紅包，兩條規則同時成立時怎麼處理沒有定義，會影響『本期已獲得』與單週期上限的計數。
    → 建議：機台場館活動總預算 20、固定 20：M1 產生並領取 1 個（剩餘 0、預算用罄），另一局暫緩結算；店員洗分完成後讓該局結算達標，記錄是否建立已作廢紅包（作廢原因機台洗分）、本期已獲得是否 +1。預期請 PM 定義後再轉為斷言。（相關
    TC-DRAFT-01M4QRTV31VK907F8N9YFBHXP6, TC-DRAFT-01M4QRTV2Z4DFF97PN9ACDWBV1）

    [RF-07/high/concurrency] 總預算是整個活動（所有帳號、所有規則）共用一池，但預算邊界只用單一帳號依序結算來測。多個帳號幾乎同時達標、剩餘預算只夠其中一個時，若產生紅包與扣預算不是原子操作，會產生超出總預算的紅包（占用大於總預算），直接造成超發。
    → 建議：線上站台活動總預算 30、固定 30、門檻 100、上限 5；玩家 A、B、C 各自累計 90。以腳本讓三人各一筆有效流水貢獻 10 的注單幾乎同時結算，重複 5 輪（每輪重建活動）。每輪斷言：只產生 1 個紅包、預算使用 30
    ／ 30、活動標示『預算用罄』、其餘兩人該門檻不產生且之後不補發；任何一輪出現占用大於總預算即為缺陷。（相關 TC-DRAFT-01M4QRTV2Z4DFF97PN9ACDWBV1, TC-REDPACKET-038, TC-REDPACKET-039）

    [RF-08/medium/concurrency] 循環產生與單週期上限只用依序結算來測。同一帳號多筆注單同時結算（多桌、多遊戲）時，累計若有遺失更新，會少計或多產生紅包；接近上限時同時結算可能產生超過上限的紅包數。 → 建議：(1)
    門檻 100、上限 10：玩家 A 從 0 起，5 筆各 100 的注單同時結算 → 恰好產生 5 個、週期累計最後為 500。(2) 門檻 100、上限 2：玩家 A 已產生 1 個、距下一門檻 90，5 筆各 100 的注單同時結算
    → 只再產生 1 個（本期已獲得 2 ／ 2），保留餘數 90，其餘 4 筆不再計入。每種各重複 3 輪。（相關 TC-REDPACKET-027, TC-REDPACKET-028, TC-DRAFT-01M4QRTV2ZQZHC22H7PS2SNX41）

    [RF-09/high/concurrency] 領取與作廢事件互相競爭的情況只測了機台『領取 vs 店員洗分』（9PXZJX）。線上的『領取 vs 週期重置』『領取 vs 取消排程／活動到期』沒有測：確認領取視窗開著時紅包已被作廢再按［確認領取］，或兩者在同一瞬間發生。TC-REDPACKET-035（ACTIVE
    v2）只在取消完成後依序嘗試開啟，新增的 4KGF0P 以 API 開啟已作廢紅包只記錄，FC98S7 第 5 步也只記錄，都沒有涵蓋同時發生、也沒有斷言不入帳。紅包被作廢後仍入帳，或入帳後又被作廢（並釋放預算），都會造成金額與預算不一致。
    → 建議：線上活動每日重置、固定 10、設總預算：(1) 玩家 A 在 UTC+0 23:59:50 開啟確認領取視窗，00:00:05 才按［確認領取］；(2) 後台按『確認取消』與玩家按［確認領取］同時送出，重複 5 輪。每輪斷言結果只有兩種：已入帳（錢包、交易紀錄、稽核明細各
    1 筆，之後不被作廢、預算仍占用）或已作廢（週期重置／活動結束；錢包不變、無『紅包』交易與稽核、預算釋放），不出現既入帳又作廢。前台被拒時的訊息只記錄。（相關 TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P, TC-DRAFT-01M4QRTV30KT8PFVK9R3FC98S7,
    TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-REDPACKET-029, TC-REDPACKET-034, TC-REDPACKET-035）

    [RF-10/high/duplicate_submission/需澄清] N23FH8 測了連點與兩裝置同時領取，但『只入帳一次』是推得的預期（Validator 已提醒標成 assumption、建議開 CLR）。另外沒有測『事後重放同一個領取請求』：對已入帳的紅包再送一次領取
    API（不是同時）、或機台帳號重送領取請求；spec 沒有定義重複領取的冪等與回應。 → 建議：建議開 CLR 請 PM／RD 定義重複／重放領取請求的處理（是否以紅包編號冪等、回應為何）。定案前先執行並記錄：線上玩家 A 領取 P1
    成功後，以 API 工具重送完全相同的領取請求 2 次；機台 M1 同樣重送一次。記錄錢包／分數、交易紀錄『紅包』與稽核明細筆數是否仍各 1。（相關 TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P,
    TC-DRAFT-01M4QRTV315R7RJVD1859PXZJX）

    [RF-11/medium/duplicate_submission] 追加預算只測了單次送出的合法與不合法金額。連點［確認］、重放同一個 API 請求、或兩位管理員同時從相同的『目前總預算』出發各自追加，都沒有測；處理不當會重複寫 7.4
    操作紀錄，或後送的較小值覆蓋較大值，等於調低了總預算（違反只能調高）。 → 建議：進行中活動總預算 5,000：(1) 輸入 6,000 後快速連點［確認］3 次，或以 API 重送同一請求 → 總預算 6,000，7.4 操作紀錄只多
    1 筆（5,000→6,000），其餘請求因 6,000 不大於目前 6,000 被拒。(2) 管理員甲、乙同時開啟追加預算視窗（皆顯示 5,000），甲先送 7,000、乙再送 6,000 → 乙被拒，總預算維持 7,000、操作紀錄
    1 筆；順序對調（乙 6,000 先、甲 7,000 後）→ 兩筆皆成功，紀錄為 5,000→6,000、6,000→7,000。總預算任何時候都不得下降。（相關 TC-DRAFT-01M4QRTV2YSK5G3458G1JEV2MM,
    TC-DRAFT-01M4QRTV2ZWPJZKP0D0SPKJDQ9, TC-DRAFT-01M4QRTV2X4JFADXPN14J9TJMN, TC-REDPACKET-041）

    [RF-12/high/duplicate_submission] 時段重疊阻擋只用『既有活動已存在後再新增』來測。快速連點『儲存』、重放建立 API，或兩位管理員／站長同時在同一站台建立重疊時段的活動，如果重疊檢查與寫入不是原子操作，就可能同時存在兩個進行中的紅包活動，同一筆流水被兩個活動累計、重複發放。
    → 建議：線上站台（另於機台場館各一輪）目前沒有進行中或排程中的紅包活動：(1) 填妥合法表單後快速連點『儲存』3 次；(2) 以 API 重送同一個建立請求；(3) 管理員與站長同時送出兩個時段重疊的活動。每種皆斷言活動排程只多 1
    個進行中／排程中的活動，其餘被阻擋；之後玩家結算達門檻只產生 1 個紅包。（相關 TC-REDPACKET-044, TC-REDPACKET-045, TC-REDPACKET-082）

    [RF-13/medium/duplicate_submission/需澄清] spec 只定義了遊戲商取消（負值）與重結算（－300＋300）。同一筆注單的結算通知被重送（相同注單編號再送一次正值）時，累計會不會重複計入沒有定義，也沒有
    TC；重複計入會直接讓帳號提早或多產生紅包。 → 建議：建議開 CLR 請 PM／RD 定義同一注單結算重送時，紅包累計是否以注單編號去重。定案前先執行並記錄：玩家 A 累計 900（門檻 1,000），對一筆有效流水貢獻 100 的注單重送同一結算通知（若環境能模擬），記錄週期累計是
    1,000 還是 1,100、是否多產生紅包，並對照 4.2 注單查詢該注單筆數。（相關 TC-DRAFT-01M4QRTV2Y02PC5WCP04KTWME3, TC-DRAFT-01M4QRTV2Z0P9GS31PH63Q59G8,
    TC-DRAFT-01M4QRTV2ZN8YDDEMRYGS8BQ04）

    [RF-14/high/permission/需澄清] 領取 API 是否檢查紅包屬於呼叫者沒有任何 TC：玩家 A 以 API 帶玩家 B 的紅包編號領取、或機台 M2 帶 M1 的紅包編號領取。spec 只寫紅包屬於取得紅包的帳號（機台屬於該機台），沒有定義其他帳號領取時的回應；放行就等於可以領走他人的獎勵。
    → 建議：建議開 CLR 請 PM／RD 定義領取 API 的歸屬檢查與越權回應。定案前先執行並記錄：玩家 B 有待開啟紅包 P_B，以玩家 A 的登入身分呼叫領取 API 帶 P_B 的編號；機台場館以 M2 身分帶 M1 的待開啟紅包編號呼叫。記錄回應、P_B／M1
    紅包狀態、雙方錢包／分數、交易紀錄與稽核明細是否有變化。（相關 TC-DRAFT-01M4QRTV31F8D5Q1YZT8N23FH8, TC-DRAFT-01M4QRTV2Y06Z4B6Y3SNBGYTS1, TC-DRAFT-01M4QRTV316T9JVQXPCA4KGF0P）

    [RF-15/medium/permission] 線上站長的紅包範圍限自身站台、不含子站台（CLR-REDPACKET-054），但 T3SFRC 只從畫面測站長對子站台（選單不提供或不顯示只記錄），TJX2SK 的越權 API 只測子站台管理員對上層站台、與無權限角色。站長略過畫面、直接呼叫
    API 操作子站台活動的情況沒有測；此外 TJX2SK 只測『查詢紅包明細』，沒有測『匯出 CSV』API。 → 建議：主站台 A 的站長以 API 工具直接對子站台 A1 的紅包活動呼叫追加預算、取消排程、查詢紅包明細、匯出 CSV，並嘗試在
    A1 新增活動：後端拒絕並回傳『無權限』，A1 活動的總預算與狀態不變、不回傳資料、A1 沒有新增活動。另以無權限角色呼叫匯出 CSV API，同樣拒絕。（相關 TC-DRAFT-01M4QRTV30G2G6EM9H88T3SFRC,
    TC-DRAFT-01M4QRTV307P31B4CRV9TJX2SK）

    [RF-16/medium/permission] 機台場館越權 API 只測了操作員（新增／追加／取消、查詢非自身場館的明細）。站長或管理員對管轄範圍外的場館直接呼叫新增、追加預算、取消排程、紅包明細 API，以及操作員以 API 匯出非自身場館的紅包明細
    CSV，都沒有測。 → 建議：站長 S 管轄場館 V1、V2，另有不在其管轄內的場館 V3（有進行中活動）：S 以 API 對 V3 的活動呼叫追加預算、取消排程、查詢紅包明細、匯出 CSV，並嘗試在 V3 新增活動 → 一律拒絕並回傳『無權限』、V3
    資料不變。V1 操作員以 API 匯出 V2 活動的紅包明細 CSV → 拒絕、不回傳資料。（相關 TC-DRAFT-01M4QRTV2YX2W5956AFZQ3172R, TC-DRAFT-01M4QRTV2Y6SMYD0TG73DT5P9Y,
    TC-REDPACKET-059）

    [RF-17/medium/permission/需澄清] 線上站台的財務可以新增、追加預算、取消排程、匯出紅包明細，但 spec 只定義了管理員（含子站台）與站長（自身站台）的範圍，財務對子站台的紅包活動能否檢視與操作沒有定義；ZPDA65
    只測財務在自身站台。 → 建議：建議開 CLR 請 PM 定義線上財務在紅包功能的管轄範圍（是否含子站台）。定案前先執行並記錄：主站台 A 的財務切換到子站台 A1（若選單提供），嘗試檢視 A1 的紅包活動與明細、追加預算、取消排程，並以
    API 直接呼叫；記錄可否操作與回應。（相關 TC-DRAFT-01M4QRTV302RS8KW8Z7EZPDA65, TC-DRAFT-01M4QRTV30G2G6EM9H88T3SFRC, TC-REDPACKET-055）'
