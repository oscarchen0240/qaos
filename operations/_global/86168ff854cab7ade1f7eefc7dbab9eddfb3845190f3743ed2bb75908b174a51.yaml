  diff_summary: '[risk-review] 抽查 RUN-20261013-005 落地 CLR-TXLOG-002（交易紀錄查詢恢復管理員手動取消待確認的機台出金）的 9 張 TC：修訂 TC-TXLOG-148、165，加上
    REQ-028 三張、REQ-029 四張。整體設計紮實。REQ-029 的四張都以 API 實送，並附同一份範本的管理員對照組與憑證預檢，排除假通過；前端未開發時 UI 步驟記受阻、以 API 判定，處理一致。新列 1 條：high
    1、medium 0、low 0，有 spec 依據，不需另開 Clarification。RF-01：手動取消完成後，同一筆出金的完成回報才遲到；依第 93 行不得讓該筆完成或扣分，否則可能重複付款，目前沒有案例。和 CLR-CASHFLOW-012
    重疊的項目只在 dimension_results 註記：收據已印、取消與 end-cashout 同時到達、重複送出、跨站台。另有兩條 medium 觀察沒有列 finding，都建議隨 CLR-CASHFLOW-012 追問：取消
    API 部分失敗的處置，以及手動取消與櫃檯人工出金或新出金同時發生。CLR-TXLOG-003（阻擋方式）與 Validator 的 5 條 minor（含 TC-TXLOG-164 退役）都不重複列。本審查只提建議，不修改 TC、不判定
    PASS／FAIL。

    [RF-01/high/exception_flow] 手動取消完成之後，同一筆出金（同一交易編號）的完成回報 end-cashout 才遲到，這個情境沒有任何案例。TC-DRAFT-…YDP（AC-TXLOG-0282）只在取消當下檢查『已取消』與分數不變。第
    93 行規定取消後平台會告知機台這筆交易不存在；若後端實作成『收到完成回報就完成交易』，這筆出金會從已取消變成已完成，同時扣除分數並產生可兌現的收據。手動取消本身不扣分，玩家在取消後可能已經以剩餘分數再出金，結果就是重複付款，或兩次扣分造成分數錯誤。這和
    CLR-CASHFLOW-012 第 (3) 點（兩者同時到達以哪個為準）不同：本題是取消完成後才到達的循序情境，spec 已有規定。 → 建議：延伸 TC-DRAFT-…YDP（或另立一張）：管理員對待確認出金 X 完成手動取消、確認狀態為『已取消』且分數
    S1＝S0 之後，用機台模擬器或 RD 提供的工具，以 X 的交易編號送出 end-cashout（可重送 2～3 次）。預期 X 仍為『已取消』、沒有變成已完成，機台帳號分數仍等於 S0，交易紀錄沒有因此新增一筆已完成的出金；平台對機台的回應內容只記錄。環境無法重送
    end-cashout 時，記為受阻。同時到達的競態留給 CLR-CASHFLOW-012 第 (3) 點。（相關 TC-DRAFT-01M4T43E6KSMEBW054QGCWGYDP）'
