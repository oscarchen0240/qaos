    CSV」匯出整個查詢結果：欄位與順序同列表（紅包編號 → 作廢原因）；狀態與作廢原因輸出畫面上的文字，未入帳、未作廢者輸出「—」；時間以 UTC+0、格式 YYYY-MM-DD HH:mm:ss 輸出；不含總計列。
