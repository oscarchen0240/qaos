  question: REQ-SITELIST-037 不符合時系統應如何反應？（Spec 未定義拒絕行為）
  context: '「管理員」為每個站台皆有的角色，權限範圍跟著所屬站台走（自身站台及其所有子站台），層級高於同站台的站長；管理員與站長可見範圍相同，差別在操作深度——管理員可操作管轄範圍內的所有欄位並指派角色，站長部分欄位唯讀。根站台 admin
    的管理員因其子樹即全平台而等同看到全部站台，是所屬站台的位置造成，不是角色本身有跨站權限；v0.4「Admin 為平台方最高管理者、可見全部站台」作廢。角色層級為管理員＞站長＞操作員，可見範圍由所屬站台決定、權限層級由角色決定（CLR-PLATFORMRULE-001，與
    v0.6 一致）。

    v0.6 未定義管理員對管轄範圍外站台（例如平行主站台）執行編輯、狀態切換等操作（含直接呼叫 API）時系統的反應；CLR-SITELIST-004 只涵蓋站長查詢平行／上層站台'
