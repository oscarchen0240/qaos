  question: 洗分請求同時帶 throshold=0 與 mode=value（指定金額，例如洗 100）時，以哪一條為準：第 360 行「throshold=0 表示洗出當前全部餘額」，還是第 364 行「mode=value 時以請求金額核可、餘額不清空」？
  context: 兩行對同一組合的結果相反。現場風險：店員在門檻 0 的機台指定洗 100，若實作照第 360 行把全部餘額洗走，付出的現金與帳對不上；測試案例以此組合還原分數時也會因結果不同而卡住。（來源：2026-10-13 RUN-20261013-003
