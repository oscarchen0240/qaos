  diff_summary: '[risk-review] 複查 21 張紅包補強 TC 是否補到 RUN-20261012-002 紅包 TRR（ART-TRR-01M4QS6XAG0068DH4QNEGTA01T）的 RF-01、02、03、05、07、08、09、11、12、15、16。那份
    TRR 不在本次派發包範圍內，我沒有讀取；對應關係依各 draft 的 source_ref 與 spec 原文判斷。11 條都有對應案例；邊界值、異常流程、重複提交、權限四個面向補得完整，權限案例（T18～T21）以 API 為主要驗證並有對照組。併發案例
    T07～T17 斷言正確，但沒有確實打到同時送達：後台類允許人工口令同時按下，結算類沒有重疊證據，也沒有以時間戳判定有效重疊、沒重疊就作廢重做。新列 3 條：high 2、medium 1、low 0，3 條都有 spec 依據、不需另開
    Clarification：RF-01 T12～T17 應改為 API 並行加有效重疊判定；RF-02 T07～T09 需要結算確實並行處理的證據，否則只能算循序驗證；RF-03 機台『確認領取』與洗分／出金互搶同一把帳號鎖沒有案例（第
    400 行）。已開 CLR 的項目（CLR-REDPACKET-058～063，即該 TRR 的 RF-01 整數部分、04、06、10、13、14、17）依指示不重複列；Validator 已列的 9 條 minor 也不重複。本審查只提建議，不修改
    TC、不判定 PASS／FAIL。

    [RF-01/high/concurrency] 後台操作類的併發案例沒有確保請求真的同時送達。T12（玩家［確認領取］對後台［確認取消］）、T14（兩位管理員同時追加預算）、T16／T17（管理員與站長同時建立重疊活動）都允許『兩人以同一口令同時按下』或『或以腳本／API
    送出』二擇一。人工按鍵的時間差通常是數百毫秒，後端幾乎一定會循序處理，多跑幾輪也只是多驗幾次循序情境。各案也都沒有像同批機台金流補強那樣，記錄每個請求的送出與回應時間，並以 max(送出) < min(回應) 判定這一輪有沒有真正重疊、沒重疊就作廢重做。T13
    步驟 3、T15 步驟 4 雖然用腳本並送，同樣缺少重疊證據。結果可能是『每輪都 PASS』，但其實從沒碰到競態。T12 牽涉入帳與預算釋放，風險最高。 → 建議：把 T12、T14、T16、T17 的觸發方式改為必須用 API 層腳本並行送出（人工同時按下只當補充觀察）。T12、T13、T14、T15、T16、T17
    都補上逐請求的送出與回應時間記錄，加入有效重疊判定：沒有重疊的輪次作廢重做，有效輪次不足規定輪數時不得判定通過。T12 另要確認：每輪的錢包、交易紀錄、稽核明細與紅包狀態只符合（甲）或（乙）其中一種組合。（相關 TC-DRAFT-01M4RHPVSCTFSRR7AHH2RBPPR0,
    TC-DRAFT-01M4RHPVZ5EVSTT9PXS4BYR1S7, TC-DRAFT-01M4RHPW69PH4EPP344S7GZ8VA, TC-DRAFT-01M4RHPW97HCC4A0FK80ECX20A, TC-DRAFT-01M4RHPVW4AME56E8N3E22WFY1,
    TC-DRAFT-01M4RHPW27ATVSAE9V9D0NB215）

    [RF-02/medium/concurrency] T07（多帳號同時達標，爭用同一池預算）、T08／T09（同一帳號多筆注單同時結算）由工程提供的腳本『幾乎同時』送出結算，但沒有任何證據證明後端真的同時處理。注單是非同步計入（第 399
    行），若平台以佇列逐筆處理結算，這幾張無論重跑幾輪都只是循序情境；而預算超發（第 392 行）、上限超發與累計遺失（第 389 行），只會在『讀取剩餘預算或累計』與『寫入新紅包』之間被另一筆插入時才會發生。案例只寫『同時送出無法保證每一輪都撞上競態，所以重複多輪』，但沒有判斷依據，所以不知道哪一輪有效。
    → 建議：在 T07、T08、T09 補上判定依據：記錄每筆結算通知的送出與回應時間，並套用有效重疊判定；可行的話另請工程提供計入時點（例如紅包明細的產生時間，或結算處理 log 的時間戳），確認多筆結算的處理時間確實重疊。沒有重疊證據的輪次作廢重做。若工程確認結算一律經單一佇列序列化處理，請在
    TC 前提寫明，並把這三張改列為『循序一致性』驗證，不要宣稱已驗證併發。（相關 TC-DRAFT-01M4RHPV880S0GKYTE230BSKRW, TC-DRAFT-01M4RHPVBC1DR76836FG6P5EPC, TC-DRAFT-01M4RHPVFFNTZND8N9PNFTPNN1）

    [RF-03/high/concurrency] 本批併發補強只有線上的『領取對取消排程』（T12）。機台場館的同一帳號上，『確認領取紅包』與『洗分／出金請求』同時送達的情況沒有任何案例。第 400 行規定兩者使用同一把帳號鎖：洗分或出金送出後到完成前不可開啟紅包，完成時待開啟紅包作廢（第
    398 行）。既有的 TC-REDPACKET-068／089／185 都是先送出交易、再嘗試領取的循序情境。若鎖沒有正確實作，可能出現『紅包已入帳，但同時被記為機台洗分作廢』，或洗分的核可金額沒算入剛入帳的紅包分數、出金清空後又被加回分數，造成機台分數與交易紀錄對不上。
    → 建議：機台 M1 有 1 個待開啟紅包（固定 20），先讓 M1 停在確認領取視窗；以腳本並行送出［確認領取］與 req-keyout（mode=all、throshold=0），記錄送出與回應時間、作廢判定有效重疊，至少做 5 輪。每輪核對結果只能是兩種之一：(甲)
    領取先成立＝紅包已入帳、交易紀錄與稽核明細各 +1，洗分核可金額含這 20；(乙) 洗分先成立＝紅包已作廢（原因機台洗分）、分數沒有增加 20、交易紀錄與稽核明細不變。最終機台分數、交易紀錄與紅包狀態必須一致。出金（req-cashout）比照再做一組。（相關
    TC-DRAFT-01M4RHPVSCTFSRR7AHH2RBPPR0, TC-REDPACKET-068, TC-REDPACKET-089, TC-REDPACKET-185）'
