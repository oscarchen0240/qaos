    - 已核實（已兌現）的出金收據還能不能作廢？若同一張待核實收據被櫃檯核實、同時被站長作廢，最終以哪個為準、輸的一方看到什麼？
    - oscarchen@blockaction.tech
    kwargs:
      context: v0.2 第 95 行只規定已作廢不能再核實；作廢（第 102～104 行）沒有寫只能對待核實出金執行，RM 只列待核實→已作廢。若已核實還能作廢，同一面額會同時算在已兌現與出收據日的已作廢金額，會員列表提款金額是否回扣也不明；場館日結報表「收據＝已兌現＋未兌現＋已作廢」也會不成立（日結報表
        RF-07、RF-11）。選項：甲、只有待核實可作廢，已核實的作廢一律拒絕（介面不提供、後端拒絕）；乙、已核實也可作廢，並說明提款金額與日結報表如何回補。（來源：2026-10-12／13 T3RR 風險抽查 CASHOUT RF-09/13；DAILYREPORT
