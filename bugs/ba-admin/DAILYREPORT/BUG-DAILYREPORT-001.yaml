title: '[後端][機台][場館日結報表] 依場館彙總／依機台明細維度的 API 回應缺少「場次數」欄位'
product: ba-admin
functional_area: DAILYREPORT
severity_rationale: Spec 明定的列表欄位整欄缺失（後端未回傳），對帳核心維度之一無法使用；非資料錯誤故不到 critical
environment:
  name: stage
  url: stage-admin-srv.springkyle.online
  account: ACAA00280（站長）／ACAA00250（機台帳號，交易發起）
