testcase_id: TC-DAILYREPORT-029
testcase_version: 1
preconditions:
- 測試帳號 ACAA00280（站長）可登入
- 機台帳號 ACAA00250 於 2026-09-08 有已結束場次（sessionCode ACAA00250_20260908_0003）
reproduction_steps:
- 登入後台，站台切換至機台場館（Arcade）
- 進入 各式報表 > 場館日結報表，統計維度選「依場館彙總」，結算日期選 2026-09-08，搜尋
- 觀察列表「場次數」欄
- 開啟瀏覽器 Network，攔截 query-venue-daily-report 的回應 JSON，檢查是否有場次數欄位
expected_result: 「依場館彙總」列的場次數＝該場館底下所有機台帳號當日場次數的加總；API 回應應含對應欄位（如 sessionCount）
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §列表欄位/場次數（2026-09-03 定案）
actual_result: 畫面「場次數」欄一律顯示「--」；API 回應整包無任何場次數欄位（僅 settlePeriod / endTime / 金額類欄位）
actual_result_evidence_map:
- claim: 畫面場次數欄顯示 --
  evidence_id: EVD-0009
- claim: API 回應無 sessionCount 類欄位
  evidence_id: EVD-0044
