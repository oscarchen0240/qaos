impact: 凡注單的投注與派彩跨越日結時刻（每日必然發生），其投注額與派彩會被拆記到兩個場次／兩個營業日——本次五份證據皆為此情境。推測同一機制在其他場次切換點（洗分／出金結束場次、分數歸零、逾時結束）亦會發生，惟本次證據未涵蓋，待 RD
  確認或另補注單核對；若成立則觸發頻率更高。上述拆記使注單數、有效投注額、損益、期末餘額四個欄位同時失真；因總計仍然正確，總計列的檢查無法發現。疊加日結結算場次歸屬結束日的問題後，整個營業日的注單資料會出現在隔日（本例 09-22 列注單相關欄全為
  0，該日實際有 6 筆注單）。場館端點鈔對帳與平台分潤皆以此報表為準。TC-DAILYREPORT-031、TC-DAILYREPORT-077 判 fail
suspected_area: 後端 query-venue-daily-report／場次彙總邏輯：①注單的金額彙總疑似分別以「扣分時點」歸投注額、以「派彩時點」歸派彩，未以單一注單為不可分割單位歸屬場次；②注單數以投注時間計、有效投注額以派彩時間計，兩者基準不一致；③場次的營業日歸屬疑似取場次結束時間（日結結算場次＝日結時刻＝下一營業日起點）而非開始時間。spec
  §場次資訊已明訂「期間所有的開分、入金、洗分、出金與注單，一律歸屬於這個場次」，可作為修正依據。前端未發現問題
