title: '[後台][Arcade][後端][場館日結報表] 跨場次切換點的注單被拆成投注與派彩兩半分記不同場次／營業日，且日結結算場次歸到結束日而非開始的營業日'
product: ba-admin
functional_area: DAILYREPORT
severity_rationale: 本報表用途為「供平台與場館對帳、分潤」（spec §功能說明）。單一根因同時污染四個對帳欄位：注單數、有效投注額、損益、期末餘額，且三者的總和仍然正確（全場次合計 注單數 6／有效投注額 1000／損益
  372 皆與注單查詢相符），只有分配到各營業日／各場次的結果是錯的——這類「總數對、分帳錯」的缺陷不會被總計列的檢查發現，使用者與對帳人員無從察覺。實測 09-22 列注單相關欄全為 0（該日實際有 6 筆注單）、0005 場次損益 −20（實際
  +180）、0001 場次注單數 0 卻有有效投注額 200，皆為可直接證偽的錯誤。與同功能既有 BUG-DAILYREPORT-003 對照：該案 severity_rationale 明載「無金額計算錯誤，故不到 critical」而評
  major；本案具備其所缺的金額計算錯誤要素，評 critical 有合理區隔。priority high：觸發條件是「注單的投注與派彩跨越場次切換點」，其中日結時刻每日必然發生，非邊緣情境
