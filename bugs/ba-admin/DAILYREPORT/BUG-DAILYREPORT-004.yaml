actual_result: 同一筆注單被拆成投注與派彩兩半分記不同場次：依場次明細（結算日期 2026-09-23）顯示 ACAA00414_20260922_0005（09-22 23:32～09-23 00:00）注單數 6／有效投注額
  800／損益 −20／期末 2380，ACAA00414_20260923_0001（09-23 00:00～00:21）注單數 0／有效投注額 200／損益 +392／期末 2772；總計 注單數 6／有效投注額 1000／損益 372（總數與注單查詢相符，僅分配錯誤）。逐項驗算：有效投注額
  800＝派彩時間亦在 0005 場次內的前 5 筆、200＝6745026（依派彩時間）；注單數 6 全記於 0005（依投注時間），故 0001 出現「注單數 0 卻有投注額 200」；損益＝該場次毛派彩 − 該場次投注額，兩者各依自己的時點歸屬：0005＝980−1000＝−20、0001＝392−0＝+392（毛派彩含本金；此機制同時精確重現兩個數字，零自由參數）。另
  ACAA00414_20260922_0005 與 ACAA00314_20260922_0005 兩個 9/22 開始的日結結算場次，結算期間皆顯示 2026-09-23；依機台明細 09-22 列因此注單數／有效投注額／損益全為 0，09-23
  列為 注單數 6／有效投注額 800／損益 −20／期末 2380，與機台前台實際餘額 2772 差 392
