expected_result: ①一筆注單的投注與派彩應歸屬同一個場次／營業日（以單一基準計算，spec 未明示採投注時間或派彩時間，但不得把同一筆拆成兩半）：6745026 的投注額 200 與其派彩 392 應同屬一列；②同一列的注單數與有效投注額應採同一基準——不應出現「注單數
  0 卻有有效投注額 200」（0001 場次）或「注單數 6 但有效投注額只算 5 筆」（0005 場次）；③損益應為該場次／營業日全部注單的損益合計（統一基準下：依投注時間則 0005＝+372、0001＝0；依派彩時間則 0005＝+180、0001＝+192），而非現行的
  −20／+392——後者係毛派彩與投注額各依自己時點歸屬相減所致；④日結結算場次 ACAA00414_20260922_0005、ACAA00314_20260922_0005 應歸屬其開始的營業日 2026-09-22，而非結束日 2026-09-23（依
  CLR-DAILYREPORT-007 PM 回覆與 TC-DAILYREPORT-031 經 APR-0003 核准的假設，已回寫入 RM REQ-DAILYREPORT-009 statement）
