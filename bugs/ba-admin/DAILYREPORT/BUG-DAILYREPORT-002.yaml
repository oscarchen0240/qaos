- AC-DAILYREPORT-0081
testcase_id: TC-DAILYREPORT-025
testcase_version: 1
preconditions:
- 測試帳號 ACAA00280（站長）可登入
- 機台帳號 ACAA00250 於 2026-09-08 有已結束場次（sessionCode ACAA00250_20260908_0003）
reproduction_steps:
- 登入後台，站台切換至機台場館（Arcade）
- 進入 各式報表 > 場館日結報表，統計維度選「依場次明細」，結算日期選 2026-09-08，搜尋
- 觀察每列「開始 ～ 結束」的開始時間與「場次時長」欄
- 攔截 query-venue-daily-report 的回應 JSON，檢查是否有開始時間與時長欄位
expected_result: 每列有場次編號、開始時間、結束時間（UTC+0）、場次時長（結束－開始；進行中為累計至查詢當下）；API 回應應含開始時間（如 startTime）與時長（如 duration）欄位
expected_result_spec_reference:
  spec_id: SPEC-DAILYREPORT-001
  spec_version: '0.1'
  location: §列表欄位/場次編號 + §場次資訊/開始時間、場次時長
actual_result: 畫面開始時間與場次時長皆顯示「--」；API 回應僅有 endTime，無開始時間與時長欄位
actual_result_evidence_map:
- claim: 畫面開始時間、場次時長顯示 --
  evidence_id: EVD-0009
- claim: API 回應僅 endTime、無 startTime / duration
  evidence_id: EVD-0045
evidence_ids:
- EVD-0009
- EVD-0045
