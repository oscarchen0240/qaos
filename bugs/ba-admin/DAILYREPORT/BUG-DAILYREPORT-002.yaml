title: '[後端][機台][場館日結報表] 依場次明細維度的 API 回應缺少「開始時間」與「場次時長」欄位'
product: ba-admin
functional_area: DAILYREPORT
severity_rationale: Spec 明定場次編號需附開始／結束時間與時長；缺開始時間使前端連自行計算時長都不可能
environment:
  name: stage
  url: stage-admin-srv.springkyle.online
  account: ACAA00280（站長）／ACAA00250（機台帳號，交易發起）
spec_id: SPEC-DAILYREPORT-001
spec_version: '0.1'
