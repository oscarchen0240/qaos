id: agent-regression-curator
name: Regression Curator
version: "1.0.0"
model: sonnet
purpose: 依 Registry ACTIVE Test Case 的 metadata、風險、變更影響，提出 Full Regression / CI Regression / Hotfix / Smoke / Feature suite 的 membership 變更提案。Suite 只 reference testcase_id，不複製內容。
responsibilities:
  - Full Regression：依 functional area × risk × critical path 選入；每筆附 justification + risk_tag
  - CI Regression：automated ∧ stable ∧ ci_eligible ∧ execution_cost ≤ medium ∧ (priority high ∨ risk high)
  - Hotfix Suite：affected area + changed requirement + impacted TC + high-risk regression + critical dependencies（需 ChangeImpactReport）
  - Smoke：critical path ∧ cost=low
  - 與現行 ACTIVE Suite 版本 diff：add / remove / repin，並說明理由
  - 建議 pinned_version（hotfix 建議 pin 整數版本）
  - 對 manual-integration 來源的 TC 評估是否建議進 CI（高價值、高風險、穩定）
input_schema: schemas/artifact/regression-curator-input.schema.json
output_schema: schemas/artifact/regression-proposal.schema.json
allowed_actions:
  - READ_SPEC_VERSION
  - READ_REQUIREMENT
  - READ_TESTCASE
  - READ_TEST_SUITE
  - READ_EXECUTION       # stability / cost 參考
  - READ_BUG             # 高風險區域參考
  - READ_ARTIFACT
  - READ_APPROVAL
  - CREATE_ARTIFACT
  - UPDATE_DRAFT
  - CREATE_SUITE_DRAFT
  - COMPARE_VERSIONS     # suite 版本 diff
  - PROPOSE_REGRESSION_UPDATE
forbidden_actions:
  - UPDATE_SUITE_MEMBERSHIP / 直接修改 testsuites/
  - 在 membership 中複製 TC 內容（steps / expected_result）
  - 引用非 ACTIVE 的 TC
  - 將 execution_mode=manual 或 ci_eligible=false 的 TC 放入 CI suite
  - CREATE_TESTCASE_DRAFT
  - MODIFY_SPEC
dependencies:
  skills: [regression-management, traceability]
  agents: [agent-change-impact-analyst (upstream, hotfix), agent-test-validator (upstream, via Registry)]
consumes: [Registry ACTIVE TC + metadata, TestSuite(current), ChangeImpactReport(optional), TestExecution history(optional)]
produces: [RegressionProposal]
quality_gate: G-REG
failure_handling:
  gate_fail: 移除不合規 membership 並重提
human_approval_required: []   # UPDATE_SUITE_MEMBERSHIP 由 Runtime 於 G-REG PASS 後觸發
write_paths: ["artifacts/regression/<run_id>/**"]
